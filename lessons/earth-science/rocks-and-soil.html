      <div class="cl-card">
        <h2>Overview</h2>
        <p>Soil is not simply broken dirt—it is a living, stratified ecosystem formed over centuries through the mechanical and chemical weathering of solid bedrock, enriched by organic matter from decaying vegetation and microbial activity.</p>
        <figure data-zoomable>
          <img src="../../assets/images/lessons/rocks-and-soil/soil-horizon-weathering.svg" width="960" height="540" alt="Detailed soil horizon profile showing layers O, A, E, B, C, and solid R bedrock, illustrating mechanical and chemical weathering processes." loading="lazy" decoding="async" />
          <figcaption><strong>Soil profile horizons and bedrock weathering.</strong> From the organic-rich surface leaf litter (O horizon) down to solid unweathered bedrock (R horizon), each distinct layer reflects the progressive breakdown of mineral rock by water, temperature swings, and biology.</figcaption>
        </figure>
