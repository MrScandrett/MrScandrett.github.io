<h2 id="promise-family-title">Follow the family of promise</h2>
<p>Select Joseph and trace his ancestors back to Terah, then compare Ishmael and Esau. Now find Rebekah, Leah, and Rachel on Nahor’s branch: Isaac and Jacob both marry back into Abraham’s own kin (Genesis 24:4; 28:2). This is a selected genealogy, not every relative or descendant. The colored branches under Jacob identify mothers, not separate generations. Read Genesis 11:27–32; 16; 21; 22:20–24; 25; 29–30; 35:16–26.</p>
<ul data-family-tree data-tree-title="Terah’s family: selected Genesis relationships" data-tree-generations="off" data-tree-search>
<li><strong>Terah</strong>: “This is the account of Terah” (Genesis 11:27) opens Abraham’s story. Terah’s family leaves Ur for Haran (11:31).<ul><li data-partner="Sarah"><strong>Abraham</strong>: The promise begins in Genesis 12:1–3. His children have different mothers; see each branch.<ul><li data-group="Ishmael’s line"><strong>Ishmael</strong>: Son of Abraham and Hagar (Genesis 16). His descendants are also promised a future (17:20).</li><li data-partner="Rebekah" data-group="Isaac’s line"><strong>Isaac</strong>: Son of Abraham and Sarah.<ul><li data-group="Esau’s line"><strong>Esau</strong>: Son of Isaac and Rebekah; Jacob’s brother.</li><li ><strong>Jacob / Israel</strong>: Son of Isaac and Rebekah. His twelve sons become the tribes of Israel; Genesis also names his daughter Dinah (30:21).<ul><li data-group="Children of Leah"><strong>Reuben</strong>: A son of Jacob and Leah.</li><li data-group="Children of Leah"><strong>Simeon</strong>: A son of Jacob and Leah.</li><li data-group="Children of Leah"><strong>Levi</strong>: A son of Jacob and Leah.</li><li data-group="Children of Leah"><strong>Judah</strong>: A son of Jacob and Leah. Jacob’s blessing promises that “the scepter will not depart from Judah” (Genesis 49:10).<ul><li data-group="Children of Leah"><strong>Perez</strong>: Son of Judah and Tamar (Genesis 38:29). His line leads to King David (Ruth 4:18–22).</li></ul></li><li data-group="Children of Bilhah"><strong>Dan</strong>: A son of Jacob and Bilhah.</li><li data-group="Children of Bilhah"><strong>Naphtali</strong>: A son of Jacob and Bilhah.</li><li data-group="Children of Zilpah"><strong>Gad</strong>: A son of Jacob and Zilpah.</li><li data-group="Children of Zilpah"><strong>Asher</strong>: A son of Jacob and Zilpah.</li><li data-group="Children of Leah"><strong>Issachar</strong>: A son of Jacob and Leah.</li><li data-group="Children of Leah"><strong>Zebulun</strong>: A son of Jacob and Leah.</li><li data-group="Children of Leah"><strong>Dinah</strong>: Daughter of Jacob and Leah (Genesis 30:21; 34).</li><li data-group="Children of Rachel"><strong>Joseph</strong>: A son of Jacob and Rachel. His journey brings the family story toward Egypt (Genesis 37–50).<ul><li data-group="Children of Rachel"><strong>Manasseh</strong>: Joseph’s firstborn, born in Egypt (Genesis 41:51). Jacob adopts him as his own (48:5).</li><li data-group="Children of Rachel"><strong>Ephraim</strong>: Joseph’s second son (Genesis 41:52). Jacob crosses his hands and blesses the younger first (48:13–20).</li></ul></li><li data-group="Children of Rachel"><strong>Benjamin</strong>: A son of Jacob and Rachel.</li></ul></li></ul></li><li data-group="Keturah’s children"><strong>Children with Keturah</strong>: Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah (Genesis 25:1–4). Their descendants are omitted here.</li></ul></li><li data-partner="Milcah" data-group="Nahor’s line"><strong>Nahor</strong>: Abraham’s brother, who stays in the region of Haran (Genesis 11:29; 22:20–24; 24:10).<ul><li data-group="Nahor’s line"><strong>Bethuel</strong>: Son of Nahor and Milcah (Genesis 22:22–23; 24:15).<ul><li data-group="Nahor’s line"><strong>Rebekah</strong>: Daughter of Bethuel. Abraham’s servant finds her at the well and she marries Isaac (Genesis 24).</li><li data-group="Nahor’s line"><strong>Laban</strong>: Rebekah’s brother (Genesis 24:29). Jacob flees to him and works for his daughters (Genesis 28–31).<ul><li data-group="Nahor’s line"><strong>Leah</strong>: Laban’s older daughter and Jacob’s first wife (Genesis 29:16–30).</li><li data-group="Nahor’s line"><strong>Rachel</strong>: Laban’s younger daughter, whom Jacob loved; mother of Joseph and Benjamin (Genesis 29–30; 35:16–20).</li></ul></li></ul></li></ul></li><li data-group="Haran’s line"><strong>Haran</strong>: Abraham’s brother, who dies in Ur (Genesis 11:28).<ul><li data-group="Haran’s line"><strong>Lot</strong>: Abraham’s nephew, who travels with him and settles near Sodom (Genesis 12:4–5; 13; 19).</li></ul></li></ul></li>
</ul>
<p><strong>Try it:</strong> Explain how Joseph is related to Abraham. Then name a sibling branch and describe why the family story is wider than a single line. Last, notice how often a younger son is carried forward: Isaac over Ishmael, Jacob over Esau, Ephraim over Manasseh.</p>
