<h2 id="promise-family-title">Follow the family of promise</h2>
<p>Select Joseph and trace his ancestors back to Abraham, then compare Ishmael and Esau. This is a selected genealogy, not every relative or descendant. The colored branches under Jacob identify mothers, not separate generations. Read Genesis 16; 21; 25; 29–30; 35:16–26.</p>
<ul data-family-tree data-tree-title="Abraham’s family: selected Genesis relationships" data-tree-generations="off" data-tree-search>
<li ><strong>Abraham</strong>: The promise begins in Genesis 12:1–3. His children have different mothers; see each branch.<ul><li data-group="Ishmael’s line"><strong>Ishmael</strong>: Son of Abraham and Hagar (Genesis 16). His descendants are also promised a future (17:20).</li><li data-partner="Rebekah" data-group="Isaac’s line"><strong>Isaac</strong>: Son of Abraham and Sarah.<ul><li data-group="Esau’s line"><strong>Esau</strong>: Son of Isaac and Rebekah; Jacob’s brother.</li><li ><strong>Jacob / Israel</strong>: Son of Isaac and Rebekah. This selection shows his twelve sons; Genesis also names his daughter Dinah (30:21).<ul><li data-group="Children of Leah"><strong>Reuben</strong>: A son of Jacob and Leah.</li><li data-group="Children of Leah"><strong>Simeon</strong>: A son of Jacob and Leah.</li><li data-group="Children of Leah"><strong>Levi</strong>: A son of Jacob and Leah.</li><li data-group="Children of Leah"><strong>Judah</strong>: A son of Jacob and Leah.</li><li data-group="Children of Bilhah"><strong>Dan</strong>: A son of Jacob and Bilhah.</li><li data-group="Children of Bilhah"><strong>Naphtali</strong>: A son of Jacob and Bilhah.</li><li data-group="Children of Zilpah"><strong>Gad</strong>: A son of Jacob and Zilpah.</li><li data-group="Children of Zilpah"><strong>Asher</strong>: A son of Jacob and Zilpah.</li><li data-group="Children of Leah"><strong>Issachar</strong>: A son of Jacob and Leah.</li><li data-group="Children of Leah"><strong>Zebulun</strong>: A son of Jacob and Leah.</li><li data-group="Children of Rachel"><strong>Joseph</strong>: A son of Jacob and Rachel. His journey brings the family story toward Egypt (Genesis 37–50).</li><li data-group="Children of Rachel"><strong>Benjamin</strong>: A son of Jacob and Rachel.</li></ul></li></ul></li><li data-group="Keturah’s children"><strong>Children with Keturah</strong>: Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah (Genesis 25:1–4). Their descendants are omitted here.</li></ul></li>
</ul>
<p><strong>Try it:</strong> Explain how Joseph is related to Abraham. Then name a sibling branch and describe why the family story is wider than a single line.</p>
