<h2 id="david-family-title">How Ruth’s story leads to David</h2>
<p>Follow the genealogy in Ruth 4:13–22. This selected tree begins with Ruth and Boaz; the passage gives earlier ancestors too. Family descent and succession in office are different: Joshua, the judges, Samuel, and Saul are not a chain of David’s parents.</p>
<ul data-family-tree data-tree-title="From Ruth and Boaz to David" data-tree-generations="off" data-tree-search>
<li data-partner="Ruth"><strong>Boaz</strong>: Ruth’s marriage to Boaz places her within the family line that the book traces toward David.<ul><li ><strong>Obed</strong>: Son of Ruth and Boaz.<ul><li ><strong>Jesse</strong>: Son of Obed and father of David.<ul><li ><strong>David</strong>: One of Jesse’s sons, later anointed king (1 Samuel 16). Other siblings are omitted.</li></ul></li></ul></li></ul></li>
</ul>
<p><strong>Try it:</strong> Count the parent–child links from Obed to David. How does the end of Ruth connect a household’s story to Israel’s later kingship?</p>
