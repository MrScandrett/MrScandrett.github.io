<section class="bpl-card" id="david-family" aria-labelledby="david-family-title">
<h2 id="david-family-title">How Ruth’s story leads to David</h2>
<p>Follow the ten names in Ruth 4:18–22, then compare the sons of Jesse named when Samuel visits Bethlehem in 1 Samuel 16:6–13. The tree traces descent. The lesson’s timeline traces succession in leadership.</p>
<ul data-family-tree data-tree-title="From Perez to David" data-tree-flow="right" data-tree-generations="off" data-tree-search>
<li><strong>Perez</strong> Ruth 4:18 starts this genealogy with Perez, a son of Judah and Tamar (Genesis 38:29).<ul>
  <li><strong>Hezron</strong> Ruth 4:18 names him as the son of Perez.<ul>
    <li><strong>Ram</strong> Ruth 4:19 names him as the son of Hezron.<ul>
      <li><strong>Amminadab</strong> Ruth 4:19 places him between Ram and Nahshon.<ul>
        <li><strong>Nahshon</strong> Numbers 2:3 names him as a leader of Judah in the wilderness camp.<ul>
          <li><strong>Salmon</strong> Ruth 4:20–21 places him between Nahshon and Boaz.<ul>
            <li data-partner="Ruth"><strong>Boaz</strong> Boaz marries Ruth. Their son Obed continues this family line (Ruth 4:13, 21).<ul>
              <li><strong>Obed</strong> The women of Bethlehem name him, and Naomi cares for him (Ruth 4:16–17).<ul>
                <li><strong>Jesse</strong> Ruth 4:22 names Jesse as David’s father. First Samuel 16 tells how his sons appear before Samuel.<ul>
                  <li><strong>Eliab</strong> Samuel first notices Eliab. God tells him to look beyond appearance (1 Samuel 16:6–7).</li>
                  <li><strong>Abinadab</strong> Jesse calls him to pass before Samuel (1 Samuel 16:8).</li>
                  <li><strong>Shammah</strong> Jesse has him pass before Samuel as well (1 Samuel 16:9).</li>
                  <li><strong>David</strong> The youngest is called from tending sheep and anointed in the presence of his brothers (1 Samuel 16:11–13).</li>
                </ul></li>
              </ul></li>
            </ul></li>
          </ul></li>
        </ul></li>
      </ul></li>
    </ul></li>
  </ul></li>
</ul></li>
</ul>
<p><strong>Try it.</strong> Find Ruth and trace the links to David. Then compare Jesse’s branch with 1 Samuel 16:10–11. Why can the tree name only some of David’s brothers from that scene?</p>
