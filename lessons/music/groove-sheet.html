<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drum Homework Sheet Builder · Mr. Scandrett's ClassroomOS</title>
  <meta name="description" content="Collect grooves from the Drum Lab builder into a printable homework sheet: notation, count line, tempo ladder, practice log and a QR code that opens each groove on a phone." />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg" />
  <link rel="stylesheet" href="../../assets/css/classroom-fonts.css" />
  <link rel="stylesheet" href="../../assets/css/lessons/groove-sheet.css" />
  <script src="../../assets/js/music-notation.js"></script>
</head>
<body>
  <a class="gs-skip no-print" href="#gsPages">Skip to the sheet</a>

  <header class="gs-bar no-print">
    <div class="gs-bar-row">
      <a class="gs-back" href="drums.html#build">← Drum Lab builder</a>
      <h1>Homework sheet builder</h1>
      <p class="gs-lede">Every groove you build in the Drum Lab can go on a sheet. Edit it here, then print one handout per student.</p>
    </div>

    <div class="gs-bar-row gs-fields">
      <label>Sheet for
        <select id="gsSheetSelect"></select>
      </label>
      <button type="button" id="gsNewSheet">New sheet</button>
      <button type="button" id="gsDupSheet" title="Copy this sheet's grooves to a new student">Copy to new student</button>
      <button type="button" id="gsDelSheet" class="gs-danger">Delete sheet</button>
    </div>

    <div class="gs-bar-row gs-fields">
      <label>Student name <input id="gsStudent" type="text" maxlength="60" autocomplete="off" placeholder="Leave blank to write by hand" /></label>
      <label>Date <input id="gsAssigned" type="date" /></label>
      <label>Due <input id="gsDue" type="date" /></label>
      <label>Grooves per page
        <select id="gsPerPage"><option value="3">3</option><option value="2">2 (roomier)</option></select>
      </label>
    </div>

    <div class="gs-bar-row gs-fields">
      <button type="button" id="gsPrint" class="gs-primary">Print this sheet</button>
      <button type="button" id="gsExport">Export this sheet</button>
      <button type="button" id="gsExportAll">Export all sheets</button>
      <button type="button" id="gsImportBtn">Import…</button>
      <input id="gsImport" type="file" accept="application/json,.json" hidden />
      <details class="gs-site">
        <summary>QR address</summary>
        <label>Site address the QR codes point to
          <input id="gsSite" type="url" inputmode="url" autocomplete="off" placeholder="https://mrscandrett.github.io" />
        </label>
        <p id="gsSiteHint"></p>
      </details>
    </div>

    <p id="gsStatus" class="gs-status" role="status" aria-live="polite"></p>
  </header>

  <main id="gsPages" class="gs-pages" tabindex="-1"></main>

  <script src="../../assets/js/lessons/groove-sheet-core.js"></script>
  <script src="../../assets/js/lessons/qr.js"></script>
  <script src="../../assets/js/lessons/drums.js"></script>
  <script src="../../assets/js/lessons/groove-sheet.js"></script>
</body>
</html>
