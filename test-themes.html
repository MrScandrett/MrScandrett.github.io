<!DOCTYPE html>
<html data-theme="honey">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme Test - Modular Rack</title>
  <link rel="stylesheet" href="assets/css/classroom-home.css">
  <style>
    body { padding: 2rem; }
    .theme-switch { margin-bottom: 2rem; }
    button { padding: 0.5rem 1rem; margin-right: 0.5rem; cursor: pointer; }
    button.active { background: #333; color: white; }
  </style>
</head>
<body>
  <div class="theme-switch">
    <h3>Select Theme:</h3>
    <button onclick="setTheme('honey')" class="active">Honey</button>
    <button onclick="setTheme('day')">Day</button>
    <button onclick="setTheme('night')">Night</button>
    <button onclick="setTheme('sakura')">Sakura</button>
    <button onclick="setTheme('cherry')">Cherry</button>
    <button onclick="setTheme('obsidian')">Obsidian</button>
    <button onclick="setTheme('mahogany')">Mahogany</button>
    <button onclick="setTheme('emerald')">Emerald</button>
    <button onclick="setTheme('vaporwave')">Vaporwave</button>
    <button onclick="setTheme('diamond')">Diamond</button>
  </div>

  <iframe src="music-lab.html" style="width: 100%; height: 800px; border: 1px solid #ccc;"></iframe>

  <script>
    function setTheme(theme) {
      const root = document.documentElement;
      const lighting = ['day', 'night'].includes(theme) ? theme : null;
      
      document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      if (lighting) {
        root.setAttribute('data-lighting', lighting);
        root.removeAttribute('data-theme');
      } else {
        root.setAttribute('data-theme', theme);
        root.removeAttribute('data-lighting');
      }
      
      // Reload iframe with new theme
      const iframe = document.querySelector('iframe');
      const html = iframe.contentDocument.documentElement;
      if (lighting) {
        html.setAttribute('data-lighting', lighting);
        html.removeAttribute('data-theme');
      } else {
        html.setAttribute('data-theme', theme);
        html.removeAttribute('data-lighting');
      }
    }
  </script>
</body>
</html>
