name: Accessibility Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pa11y:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Start static server
        run: npx serve . --listen 8080 &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:8080 --timeout 15000

      - name: Run pa11y accessibility audit
        id: audit
        run: |
          npx pa11y-ci --config .pa11yci.json --reporter json > pa11y-report.json 2>&1 || echo "VIOLATIONS_FOUND=true" >> $GITHUB_ENV

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report-${{ github.sha }}
          path: pa11y-report.json
          retention-days: 30

      - name: Summarise violations
        if: always()
        run: |
          echo "## Accessibility Audit Results" >> $GITHUB_STEP_SUMMARY
          if [ -f pa11y-report.json ]; then
            node -e "
              const r = require('./pa11y-report.json');
              const total = Object.values(r.results || {}).reduce((s, arr) => s + arr.length, 0);
              const pages = Object.keys(r.results || {}).length;
              console.log(\`Audited \${pages} pages — \${total} issue(s) found.\`);
              if (total > 0) {
                Object.entries(r.results || {}).forEach(([url, issues]) => {
                  if (issues.length) {
                    console.log(\`\\n### \${url} (\${issues.length} issue(s))\`);
                    issues.slice(0, 5).forEach(i => console.log(\`- \${i.code}: \${i.message.slice(0,120)}\`));
                    if (issues.length > 5) console.log(\`  ...and \${issues.length - 5} more\`);
                  }
                });
              }
            " >> $GITHUB_STEP_SUMMARY
          fi
