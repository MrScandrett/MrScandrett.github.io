name: Accessibility Audit

# Runs as a job of "Deploy GitHub Pages" (deploy.yml), which waits for it: a page that gets worse
# than data/a11y-baseline.json blocks the deploy, and the same job is the check on pull requests.
# workflow_dispatch runs it on its own.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pa11y:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start static server
        run: npx --no-install serve . --listen 8080 &

      - name: Wait for server to be ready
        run: npx --no-install wait-on http://localhost:8080 --timeout 15000

      - name: Run pa11y accessibility audit
        id: audit
        run: |
          npm run a11y

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report-${{ github.sha }}
          path: reports/accessibility/latest.json
          retention-days: 30

      - name: Summarise violations
        if: always()
        run: |
          echo "## Accessibility Audit Results" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/accessibility/latest.json ]; then
            node -e "
              const r = require('./reports/accessibility/latest.json');
              const s = r.summary;
              console.log(\`Audited \${s.completed} pages — \${s.cleanPages} clean, \${s.issueCount} issue(s), \${s.technicalFailures} technical failure(s).\`);
              Object.entries(r.groupedRootCauses || {}).forEach(([name, group]) =>
                console.log(\`- \${name}: \${group.count} issue(s) across \${group.pages.length} page(s)\`));
            " >> $GITHUB_STEP_SUMMARY
          fi
