name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  # Bot commits pushed with GITHUB_TOKEN (the daily verse) don't fire `push`
  # workflows, so redeploy after that workflow finishes instead.
  workflow_run:
    workflows: ["Update Verse of the Day"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Showcase apps are generated output. Rebuild every app from its canonical
      # student source so Pages can never deploy stale or hand-edited copies.
      - name: Rebuild showcase from canonical student sources
        run: npm run build -- --strict

      - name: Verify generated showcase output is committed and reproducible
        run: git diff --exit-code -- apps

      - name: Start site for interactive checks
        run: |
          node serve-local.js > /tmp/classroomos-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/classroomos-server.log
          exit 1

      - name: Run release quality checks
        run: npm run quality

      - name: Build minified dist/
        run: npm run build:dist

      - name: Verify public artifact boundary
        run: npm run check:dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
