<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dune — Mentats and the Butlerian Jihad</title>
  <desc id="desc">A hooded Mentat with sapho-stained lips and calculating eyes stands before a shattered, banned computer, silhouetted against desert dunes — Frank Herbert's answer to a civilization that outlawed thinking machines.</desc>
  <defs>
    <linearGradient id="skyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a0d" />
      <stop offset="55%" stop-color="#2f2211" />
      <stop offset="100%" stop-color="#4a3618" />
    </linearGradient>
    <radialGradient id="sandGlow" cx="0.32" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="rgba(224,175,90,0.22)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="robeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a24" />
      <stop offset="100%" stop-color="#211809" />
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2c19" />
      <stop offset="100%" stop-color="#1c1409" />
    </linearGradient>
    <radialGradient id="faceGrad" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#dcb98c" />
      <stop offset="100%" stop-color="#b98f5f" />
    </radialGradient>
    <linearGradient id="duneNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2c15" />
      <stop offset="100%" stop-color="#241a0c" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#skyBg)" />
  <rect width="1200" height="675" fill="url(#sandGlow)" />

  <!-- two moons, a Dune signature -->
  <circle cx="1040" cy="90" r="26" fill="#e8d4a0" opacity="0.85" />
  <circle cx="1110" cy="150" r="14" fill="#e8d4a0" opacity="0.6" />

  <!-- Shattered, banned thinking machine (background, right) -->
  <g transform="translate(770 150)" opacity="0.55">
    <rect x="0" y="40" width="230" height="300" rx="14" fill="#2a2015" stroke="#6b5330" stroke-width="3" />
    <rect x="26" y="68" width="178" height="112" rx="8" fill="#161006" stroke="#54402420" stroke-width="1" />
    <line x1="26" y1="104" x2="204" y2="118" stroke="#3a2a14" stroke-width="1.5" />
    <line x1="26" y1="140" x2="204" y2="130" stroke="#3a2a14" stroke-width="1.5" />
    <circle cx="66" cy="248" r="30" fill="none" stroke="#6b5330" stroke-width="4" stroke-dasharray="10 8" />
    <circle cx="160" cy="272" r="22" fill="none" stroke="#6b5330" stroke-width="4" stroke-dasharray="9 7" />
    <!-- fracture lines -->
    <g stroke="#e0af5a" stroke-width="2" opacity="0.55">
      <path d="M40 40 L110 190 L70 340" fill="none" />
      <path d="M190 60 L130 210 L200 320" fill="none" />
      <path d="M0 160 L120 190 L230 170" fill="none" />
    </g>
    <!-- banned seal -->
    <g transform="translate(115 190)">
      <circle r="58" fill="none" stroke="#8b2020" stroke-width="6" opacity="0.85" />
      <line x1="-40" y1="-40" x2="40" y2="40" stroke="#8b2020" stroke-width="6" opacity="0.85" />
    </g>
  </g>

  <!-- Mentat figure (center-left) -->
  <g transform="translate(300 90)">
    <!-- hood, behind head/shoulders -->
    <path d="M40,120 Q60,20 165,10 Q270,20 290,120 L290,170 Q165,90 40,170 Z" fill="url(#hoodGrad)" stroke="#4a3a22" stroke-width="2" />

    <!-- robed shoulders/body -->
    <path d="M165,205 C95,205 70,230 55,300 L45,470 L285,470 L275,300 C260,230 235,205 165,205 Z" fill="url(#robeGrad)" stroke="#5c4a2e" stroke-width="2" />
    <!-- robe fold lines -->
    <g stroke="#5c4a2e" stroke-width="2" opacity="0.5" fill="none">
      <path d="M120,230 C110,300 105,390 100,470" />
      <path d="M165,220 C165,300 165,390 165,470" />
      <path d="M210,230 C220,300 225,390 230,470" />
    </g>

    <!-- neck -->
    <rect x="145" y="178" width="40" height="34" fill="#c9a87c" />

    <!-- head -->
    <ellipse cx="165" cy="140" rx="54" ry="60" fill="url(#faceGrad)" />

    <!-- hood inner edge framing the face -->
    <path d="M104,130 Q100,55 165,42 Q230,55 226,130 Q226,150 165,168 Q104,150 104,130 Z" fill="none" stroke="#3a2c19" stroke-width="6" opacity="0.55" />

    <!-- eyebrows: focused, calculating -->
    <path d="M128,118 Q140,110 154,116" stroke="#3a2417" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M176,116 Q190,110 202,118" stroke="#3a2417" stroke-width="4" fill="none" stroke-linecap="round" />

    <!-- eyes -->
    <ellipse cx="142" cy="132" rx="10" ry="7" fill="#f4e7ce" />
    <ellipse cx="188" cy="132" rx="10" ry="7" fill="#f4e7ce" />
    <circle cx="144" cy="132" r="4.2" fill="#221708" />
    <circle cx="186" cy="132" r="4.2" fill="#221708" />

    <!-- nose -->
    <path d="M162,130 Q155,150 161,158 L169,158" fill="none" stroke="#8a6539" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- sapho-stained lips, the Mentat mark -->
    <path d="M148,180 Q165,187 182,180 Q165,192 148,180 Z" fill="#9b2c2c" />

    <!-- thought lines radiating from the mind, not a machine -->
    <g stroke="#e0af5a" stroke-width="2" opacity="0.65">
      <line x1="165" y1="40" x2="165" y2="4" />
      <line x1="112" y1="58" x2="82" y2="26" />
      <line x1="218" y1="58" x2="248" y2="26" />
      <line x1="88" y1="98" x2="46" y2="86" />
      <line x1="242" y1="98" x2="284" y2="86" />
    </g>
    <g fill="#e0af5a" opacity="0.8">
      <circle cx="165" cy="0" r="3.5" />
      <circle cx="78" cy="22" r="3.5" />
      <circle cx="252" cy="22" r="3.5" />
      <circle cx="41" cy="83" r="3.5" />
      <circle cx="289" cy="83" r="3.5" />
    </g>
  </g>

  <!-- desert dunes, foreground -->
  <path d="M0,470 Q220,410 430,455 Q640,415 860,460 Q1030,425 1200,450 L1200,675 L0,675 Z" fill="url(#duneNear)" opacity="0.9" />
  <path d="M0,540 Q280,495 560,525 Q860,500 1200,530 L1200,675 L0,675 Z" fill="#1c1409" opacity="0.9" />

  <!-- Title -->
  <text x="60" y="60" fill="#f3e6c8" font-size="36" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Dune</text>
  <text x="164" y="60" fill="#e6d4aa" font-size="30" font-family="Georgia, 'Times New Roman', serif">— The World That Banned AI</text>
  <text x="60" y="94" fill="#c8b79f" font-size="19" font-family="Georgia, 'Times New Roman', serif" font-style="italic">"Thou shalt not make a machine in the likeness of a human mind."</text>
</svg>
