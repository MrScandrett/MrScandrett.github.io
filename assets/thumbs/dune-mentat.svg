<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dune — Mentats and the Butlerian Jihad</title>
  <desc id="desc">A stylized human figure with glowing sapho-stained lips representing a Mentat, and a shattered machine behind them, symbolizing the ban on thinking machines in Frank Herbert's Dune.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1a140a"/>
      <stop offset="100%" stop-color="#2c1f0e"/>
    </linearGradient>
    <radialGradient id="sandGlow" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0%" stop-color="rgba(214,166,77,0.18)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3020"/>
      <stop offset="100%" stop-color="#1f180e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#sandGlow)"/>

  <!-- Shattered machine (background, right) -->
  <g transform="translate(760 140)" opacity="0.35">
    <rect x="0" y="60" width="240" height="320" rx="12" fill="#2a2218" stroke="#5c4a2e" stroke-width="3"/>
    <!-- Cracks -->
    <line x1="40" y1="60" x2="120" y2="220" stroke="#d6a64d" stroke-width="2" opacity="0.5"/>
    <line x1="200" y1="80" x2="100" y2="300" stroke="#d6a64d" stroke-width="2" opacity="0.5"/>
    <line x1="80" y1="120" x2="220" y2="250" stroke="#d6a64d" stroke-width="1.5" opacity="0.4"/>
    <!-- Dead screen -->
    <rect x="40" y="100" width="160" height="100" rx="6" fill="#161008" stroke="#4a3a22" stroke-width="2"/>
    <line x1="40" y1="140" x2="200" y2="160" stroke="#3a2a14" stroke-width="1"/>
    <!-- Broken gears -->
    <circle cx="80" cy="290" r="28" fill="none" stroke="#5c4a2e" stroke-width="3" stroke-dasharray="12 8"/>
    <circle cx="170" cy="310" r="22" fill="none" stroke="#5c4a2e" stroke-width="3" stroke-dasharray="10 7"/>
    <!-- X mark (banned) -->
    <line x1="60" y1="80" x2="180" y2="360" stroke="#8b2020" stroke-width="6" opacity="0.6"/>
    <line x1="180" y1="80" x2="60" y2="360" stroke="#8b2020" stroke-width="6" opacity="0.6"/>
  </g>

  <!-- Mentat figure (center-left) -->
  <g transform="translate(320 100)">
    <!-- Robe / body -->
    <path d="M120,180 Q80,190 60,420 L180,420 Q160,190 120,180 Z" fill="url(#robe)" stroke="#5c4a2e" stroke-width="2"/>
    <!-- Head -->
    <circle cx="120" cy="150" r="48" fill="#c9a87c"/>
    <!-- Eyes (focused, calculating) -->
    <ellipse cx="104" cy="144" rx="7" ry="5" fill="#1a140a"/>
    <ellipse cx="136" cy="144" rx="7" ry="5" fill="#1a140a"/>
    <!-- Sapho-stained lips (cranberry/red, the Mentat mark) -->
    <ellipse cx="120" cy="168" rx="12" ry="4" fill="#9b2c2c"/>
    <!-- Hood outline -->
    <path d="M65,160 Q70,90 120,75 Q170,90 175,160" fill="none" stroke="#4a3a22" stroke-width="3"/>
    <!-- Thought lines radiating from head -->
    <g stroke="#d6a64d" stroke-width="1.5" opacity="0.6">
      <line x1="120" y1="95" x2="120" y2="60"/>
      <line x1="80" y1="110" x2="55" y2="82"/>
      <line x1="160" y1="110" x2="185" y2="82"/>
      <line x1="70" y1="140" x2="38" y2="130"/>
      <line x1="170" y1="140" x2="202" y2="130"/>
    </g>
    <!-- Small dots at line endpoints (data points / thoughts) -->
    <g fill="#d6a64d" opacity="0.7">
      <circle cx="120" cy="56" r="3"/>
      <circle cx="52" cy="78" r="3"/>
      <circle cx="188" cy="78" r="3"/>
      <circle cx="35" cy="128" r="3"/>
      <circle cx="205" cy="128" r="3"/>
    </g>
  </g>

  <!-- Sand dunes (foreground) -->
  <path d="M0,580 Q200,520 400,560 Q600,530 800,570 Q1000,540 1200,560 L1200,675 L0,675 Z" fill="#3d3020" opacity="0.5"/>
  <path d="M0,620 Q300,580 600,610 Q900,590 1200,620 L1200,675 L0,675 Z" fill="#2c1f0e" opacity="0.6"/>

  <!-- Title text -->
  <text x="72" y="72" fill="#f3e6c8" font-size="38" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Dune</text>
  <text x="182" y="72" fill="#e6d4aa" font-size="38" font-family="Georgia, 'Times New Roman', serif"> — The World That Banned AI</text>
  <text x="72" y="110" fill="#c8b79f" font-size="22" font-family="'Segoe UI', Arial, sans-serif">"Thou shalt not make a machine in the likeness of a human mind."</text>
</svg>
