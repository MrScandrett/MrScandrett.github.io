  <g fill="#0d1117" stroke="#a371f7" stroke-width="8">
    <circle cx="82" cy="68" r="18"/><circle cx="82" cy="132" r="18"/><circle cx="188" cy="215" r="18"/>
  </g>
  <circle cx="266" cy="230" r="18" fill="#1f6f35" stroke="#3fb950" stroke-width="8"/>
  <rect x="394" y="146" width="184" height="150" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="5"/>
  <rect x="418" y="174" width="136" height="24" rx="4" fill="#3fb950"/>
