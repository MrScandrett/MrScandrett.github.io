<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#040101"/>
      <stop offset="30%" stop-color="#160806"/>
      <stop offset="65%" stop-color="#3c1408"/>
      <stop offset="85%" stop-color="#6a2010"/>
      <stop offset="100%" stop-color="#9a3812"/>
    </linearGradient>
    <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#6b2a14"/>
      <stop offset="40%" stop-color="#4a1a0a"/>
      <stop offset="100%" stop-color="#280d05"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffd0" stop-opacity="1"/>
      <stop offset="20%"  stop-color="#ffcc40" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#ff6010" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#cc1800" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(160,60,20,0)"/>
      <stop offset="100%" stop-color="rgba(160,60,20,0.35)"/>
    </linearGradient>
    <linearGradient id="hudgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(180,80,30,0.9)"/>
      <stop offset="100%" stop-color="rgba(220,120,60,0.9)"/>
    </linearGradient>
    <linearGradient id="vvec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,140,60,0.8)"/>
      <stop offset="100%" stop-color="rgba(255,60,10,0)"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="flameGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="rgba(255,160,40,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,60,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="52"  cy="22"  r="1.5" fill="white" opacity="0.85"/>
  <circle cx="130" cy="44"  r="0.9" fill="white" opacity="0.65"/>
  <circle cx="195" cy="18"  r="1.3" fill="white" opacity="0.9"/>
  <circle cx="252" cy="50"  r="0.8" fill="white" opacity="0.55"/>
  <circle cx="318" cy="28"  r="1.5" fill="white" opacity="0.75"/>
  <circle cx="370" cy="10"  r="1.0" fill="white" opacity="0.7"/>
  <circle cx="430" cy="38"  r="0.8" fill="white" opacity="0.5"/>
  <circle cx="510" cy="15"  r="1.4" fill="white" opacity="0.85"/>
  <circle cx="565" cy="46"  r="0.9" fill="white" opacity="0.6"/>
  <circle cx="635" cy="22"  r="1.2" fill="white" opacity="0.8"/>
  <circle cx="710" cy="52"  r="0.8" fill="white" opacity="0.55"/>
  <circle cx="760" cy="18"  r="1.3" fill="white" opacity="0.7"/>
  <circle cx="90"  cy="80"  r="0.7" fill="white" opacity="0.4"/>
  <circle cx="165" cy="95"  r="1.0" fill="white" opacity="0.6"/>
  <circle cx="290" cy="85"  r="0.8" fill="white" opacity="0.45"/>
  <circle cx="480" cy="72"  r="0.9" fill="white" opacity="0.5"/>
  <circle cx="600" cy="90"  r="0.7" fill="white" opacity="0.4"/>
  <circle cx="745" cy="80"  r="1.1" fill="white" opacity="0.65"/>

  <!-- Phobos (small moon) -->
  <ellipse cx="692" cy="72" rx="9" ry="6" fill="#c8a882" opacity="0.75" filter="url(#glow)"/>
  <ellipse cx="690" cy="70" rx="3" ry="2" fill="rgba(200,180,150,0.3)"/>

  <!-- Atmosphere haze -->
  <rect x="0" y="270" width="800" height="80" fill="url(#haze)"/>

  <!-- Terrain shape -->
  <polygon
    points="0,360 55,342 95,356 140,334 200,348 260,328 305,343 355,324 400,340 450,320 500,342 555,326 610,348 668,330 720,352 800,338 800,450 0,450"
    fill="url(#gnd)"/>
  <!-- Terrain edge -->
  <polyline
    points="0,360 55,342 95,356 140,334 200,348 260,328 305,343 355,324 400,340 450,320 500,342 555,326 610,348 668,330 720,352 800,338"
    fill="none" stroke="#8b3a1e" stroke-width="2" opacity="0.8"/>

  <!-- Rocks on terrain -->
  <ellipse cx="80"  cy="352" rx="14" ry="7"  fill="#5a1e0e" opacity="0.9"/>
  <ellipse cx="240" cy="342" rx="8"  ry="5"  fill="#6a2a12" opacity="0.85"/>
  <ellipse cx="720" cy="350" rx="18" ry="9"  fill="#4e1a0a" opacity="0.9"/>
  <ellipse cx="590" cy="340" rx="11" ry="6"  fill="#5c2010" opacity="0.8"/>

  <!-- Distant crater rim -->
  <ellipse cx="150" cy="338" rx="48" ry="12" fill="none" stroke="#6a2a14" stroke-width="2" opacity="0.45"/>

  <!-- Landing pad -->
  <rect x="375" y="322" width="88" height="8" fill="#e08040" rx="2"/>
  <!-- Pad lights (glow) -->
  <circle cx="375" cy="322" r="6" fill="#ffe060" opacity="0.6" filter="url(#softBlur)"/>
  <circle cx="397" cy="322" r="6" fill="#ffe060" opacity="0.6" filter="url(#softBlur)"/>
  <circle cx="419" cy="322" r="6" fill="#ffe060" opacity="0.6" filter="url(#softBlur)"/>
  <circle cx="441" cy="322" r="6" fill="#ffe060" opacity="0.6" filter="url(#softBlur)"/>
  <circle cx="463" cy="322" r="6" fill="#ffe060" opacity="0.6" filter="url(#softBlur)"/>
  <!-- Pad lights (sharp) -->
  <circle cx="375" cy="322" r="3.5" fill="#ffe080" filter="url(#glow)"/>
  <circle cx="397" cy="322" r="3.5" fill="#ffe080" filter="url(#glow)"/>
  <circle cx="419" cy="322" r="3.5" fill="#ffe080" filter="url(#glow)"/>
  <circle cx="441" cy="322" r="3.5" fill="#ffe080" filter="url(#glow)"/>
  <circle cx="463" cy="322" r="3.5" fill="#ffe080" filter="url(#glow)"/>
  <!-- Pad label -->
  <text x="419" y="314" text-anchor="middle" font-family="'system-ui',sans-serif" font-size="10" font-weight="700" fill="#ffc060" letter-spacing="0.06em">LANDING ZONE</text>

  <!-- === LANDER === -->
  <!-- Thruster flame glow (behind everything) -->
  <ellipse cx="419" cy="256" rx="32" ry="40" fill="url(#flameGlow)" filter="url(#softBlur)"/>

  <!-- Main thruster flame -->
  <path d="M 407,234 C 404,252 402,268 419,296 C 436,268 434,252 431,234 Z" fill="url(#flame)" opacity="0.95"/>
  <!-- Flame inner core -->
  <path d="M 413,234 C 412,247 411,258 419,274 C 427,258 426,247 425,234 Z" fill="#fffff0" opacity="0.85" filter="url(#glow)"/>

  <!-- Landing legs -->
  <!-- Left primary -->
  <line x1="404" y1="222" x2="388" y2="254" stroke="#b8a898" stroke-width="3" stroke-linecap="round"/>
  <!-- Left foot -->
  <line x1="382" y1="254" x2="396" y2="254" stroke="#c8b8a8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left diagonal strut -->
  <line x1="408" y1="218" x2="388" y2="254" stroke="#988878" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right primary -->
  <line x1="434" y1="222" x2="450" y2="254" stroke="#b8a898" stroke-width="3" stroke-linecap="round"/>
  <!-- Right foot -->
  <line x1="444" y1="254" x2="458" y2="254" stroke="#c8b8a8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right diagonal strut -->
  <line x1="430" y1="218" x2="450" y2="254" stroke="#988878" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center leg -->
  <line x1="419" y1="228" x2="419" y2="260" stroke="#b0a090" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="415" y1="260" x2="423" y2="260" stroke="#c0b0a0" stroke-width="3" stroke-linecap="round"/>

  <!-- Engine bell -->
  <path d="M 411,228 L 409,240 L 429,240 L 427,228 Z" fill="#8a7a6a" stroke="#5a4a3a" stroke-width="1"/>

  <!-- Main body -->
  <rect x="404" y="200" width="30" height="28" rx="3" fill="#d4c4aa" stroke="#806a52" stroke-width="1.5"/>
  <!-- Thermal foil -->
  <rect x="406" y="202" width="26" height="24" rx="2" fill="rgba(200,165,40,0.4)"/>
  <!-- Panel seams -->
  <line x1="411" y1="202" x2="411" y2="226" stroke="rgba(140,110,35,0.5)" stroke-width="0.8"/>
  <line x1="416" y1="202" x2="416" y2="226" stroke="rgba(140,110,35,0.5)" stroke-width="0.8"/>
  <line x1="421" y1="202" x2="421" y2="226" stroke="rgba(140,110,35,0.5)" stroke-width="0.8"/>
  <line x1="426" y1="202" x2="426" y2="226" stroke="rgba(140,110,35,0.5)" stroke-width="0.8"/>

  <!-- Left solar panel arm -->
  <rect x="400" y="208" width="6" height="10" fill="#9a8a7a"/>
  <!-- Left solar panel -->
  <rect x="350" y="203" width="52" height="18" rx="3" fill="#1a2840" stroke="#0a1828" stroke-width="1.5"/>
  <!-- Solar cells left -->
  <rect x="352" y="205" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="352" y="213" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="364" y="205" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="364" y="213" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="376" y="205" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="376" y="213" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="388" y="205" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="388" y="213" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <!-- Panel sheen left -->
  <rect x="350" y="203" width="52" height="18" rx="3" fill="rgba(100,160,255,0.07)"/>

  <!-- Right solar panel arm -->
  <rect x="432" y="208" width="6" height="10" fill="#9a8a7a"/>
  <!-- Right solar panel -->
  <rect x="436" y="203" width="52" height="18" rx="3" fill="#1a2840" stroke="#0a1828" stroke-width="1.5"/>
  <!-- Solar cells right -->
  <rect x="438" y="205" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="438" y="213" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="450" y="205" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="450" y="213" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="462" y="205" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="462" y="213" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="474" y="205" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <rect x="474" y="213" width="10" height="6"  rx="1" fill="#1e3a8a" opacity="0.9"/>
  <!-- Panel sheen right -->
  <rect x="436" y="203" width="52" height="18" rx="3" fill="rgba(100,160,255,0.07)"/>

  <!-- UHF antenna -->
  <line x1="427" y1="200" x2="431" y2="182" stroke="#d0c0b0" stroke-width="1.5"/>
  <path d="M 425,178 A 6,6 0 0 1 437,178" fill="none" stroke="#e8d8c8" stroke-width="1.5"/>
  <line x1="431" y1="178" x2="431" y2="182" stroke="#c0b0a0" stroke-width="1"/>

  <!-- Camera mast -->
  <line x1="409" y1="200" x2="407" y2="185" stroke="#c0b0a0" stroke-width="1.5"/>
  <circle cx="407" cy="183" r="4.5" fill="#4a8ab0" stroke="#2a5a80" stroke-width="1"/>
  <circle cx="406" cy="182" r="1.5" fill="rgba(200,240,255,0.8)"/>

  <!-- Velocity vector (orange dashed arrow going down-right) -->
  <line x1="419" y1="232" x2="450" y2="295" stroke="rgba(255,130,50,0.65)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="450,295 443,284 456,285" fill="rgba(255,130,50,0.7)"/>

  <!-- === HUD OVERLAYS === -->
  <!-- Telemetry panel -->
  <rect x="18" y="18" width="150" height="96" rx="8" fill="rgba(18,6,2,0.82)" stroke="rgba(180,80,30,0.3)" stroke-width="1"/>
  <text x="28" y="37"  font-family="'Courier New',monospace" font-size="11" fill="#805040">ALT</text>
  <text x="128" y="37" font-family="'Courier New',monospace" font-size="11" fill="#d09070" text-anchor="end">1 248 m</text>
  <text x="28" y="55"  font-family="'Courier New',monospace" font-size="11" fill="#805040">V-SPD</text>
  <text x="128" y="55" font-family="'Courier New',monospace" font-size="11" fill="#ff6030" text-anchor="end">↓ 9.4 m/s</text>
  <text x="28" y="73"  font-family="'Courier New',monospace" font-size="11" fill="#805040">H-SPD</text>
  <text x="128" y="73" font-family="'Courier New',monospace" font-size="11" fill="#d09070" text-anchor="end">→ 1.8 m/s</text>
  <text x="28" y="91"  font-family="'Courier New',monospace" font-size="11" fill="#805040">TILT</text>
  <text x="128" y="91" font-family="'Courier New',monospace" font-size="11" fill="#d09070" text-anchor="end">4.2°</text>
  <!-- Fuel label and bar -->
  <text x="18" y="127" font-family="'system-ui',sans-serif" font-size="10" font-weight="700" fill="#c07050">FUEL</text>
  <rect x="50" y="116" width="120" height="13" rx="3" fill="rgba(100,30,10,0.6)"/>
  <rect x="50" y="116" width="73"  height="13" rx="3" fill="#e07030"/>
  <rect x="50" y="116" width="120" height="13" rx="3" fill="none" stroke="rgba(180,60,20,0.5)" stroke-width="1"/>

  <!-- Wind indicator -->
  <rect x="300" y="18" width="148" height="24" rx="6" fill="rgba(18,6,2,0.75)" stroke="rgba(180,80,30,0.2)" stroke-width="1"/>
  <text x="374" y="34" text-anchor="middle" font-family="'system-ui',sans-serif" font-size="11.5" fill="#c07848">WIND  → 12.6 m/s</text>

  <!-- Bottom title overlay -->
  <rect x="0" y="374" width="800" height="76" fill="rgba(8,3,1,0.82)"/>
  <line x1="0" y1="374" x2="800" y2="374" stroke="rgba(180,70,25,0.4)" stroke-width="1"/>
  <text x="400" y="413" text-anchor="middle" font-family="'system-ui',sans-serif" font-size="30" font-weight="800" fill="white" letter-spacing="-0.02em">MARS ROVER LANDING</text>
  <text x="400" y="437" text-anchor="middle" font-family="'system-ui',sans-serif" font-size="13" fill="#c07050">Manage fuel · Fight Martian wind · Nail the landing pad</text>
</svg>
