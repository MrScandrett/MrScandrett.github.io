<svg xmlns="http://www.w3.org/2000/svg" width="690" height="364" viewBox="0 0 690 364" role="img" aria-label="CGI water simulation wave surface thumbnail">
  <defs>
    <linearGradient id="cw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1840"/>
      <stop offset="1" stop-color="#0f2a6b"/>
    </linearGradient>
    <linearGradient id="cw-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e6df0"/>
      <stop offset="1" stop-color="#0a1c52"/>
    </linearGradient>
  </defs>
  <rect width="690" height="364" fill="url(#cw-sky)"/>
  <!-- horizon water body -->
  <rect x="0" y="150" width="690" height="214" fill="url(#cw-sea)"/>
  <!-- Gerstner wave crests -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 168 Q86 142 172 168 T344 168 T516 168 T688 168" stroke="#bcd6ff" stroke-width="3" opacity="0.85"/>
    <path d="M0 196 Q98 162 196 196 T392 196 T588 196 T690 196" stroke="#7fb0ff" stroke-width="3" opacity="0.7"/>
    <path d="M0 230 Q110 192 220 230 T440 230 T660 230 T690 230" stroke="#5b8fe6" stroke-width="3" opacity="0.6"/>
    <path d="M0 270 Q124 228 248 270 T496 270 T690 270" stroke="#3f6fc4" stroke-width="3" opacity="0.5"/>
    <path d="M0 312 Q140 266 280 312 T560 312 T690 312" stroke="#2d558f" stroke-width="3" opacity="0.45"/>
  </g>
  <!-- specular highlight glints -->
  <g fill="#eaf4ff" opacity="0.85">
    <ellipse cx="250" cy="172" rx="22" ry="3"/>
    <ellipse cx="470" cy="200" rx="18" ry="3"/>
    <ellipse cx="150" cy="236" rx="16" ry="3"/>
  </g>
  <!-- sun/light source -->
  <circle cx="540" cy="78" r="34" fill="#ffe9a8" opacity="0.9"/>
</svg>
