<svg xmlns="http://www.w3.org/2000/svg" width="690" height="364" viewBox="0 0 690 364" role="img" aria-label="Finite state machine diagram thumbnail">
  <defs>
    <linearGradient id="sm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1840"/>
      <stop offset="1" stop-color="#06122e"/>
    </linearGradient>
    <marker id="sm-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8bb4ff"/>
    </marker>
  </defs>
  <rect width="690" height="364" fill="url(#sm-bg)"/>

  <!-- transitions -->
  <g stroke="#8bb4ff" stroke-width="3" fill="none" marker-end="url(#sm-arrow)">
    <path d="M188 130 q145 -60 270 0"/>
    <path d="M470 168 q-145 60 -270 0"/>
    <path d="M512 200 q90 70 -120 118"/>
    <path d="M168 178 q-70 70 80 130"/>
  </g>

  <!-- self loop on S0 -->
  <g stroke="#8bb4ff" stroke-width="3" fill="none" marker-end="url(#sm-arrow)">
    <path d="M150 120 q-46 -42 -8 -70 q40 -26 56 16"/>
  </g>

  <!-- states -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="30" font-weight="700" text-anchor="middle">
    <circle cx="160" cy="150" r="46" fill="#13235c" stroke="#8bb4ff" stroke-width="4"/>
    <text x="160" y="160" fill="#eaf2ff">S₀</text>

    <circle cx="500" cy="150" r="46" fill="#13235c" stroke="#8bb4ff" stroke-width="4"/>
    <text x="500" y="160" fill="#eaf2ff">S₁</text>

    <!-- accepting (double ring) state -->
    <circle cx="330" cy="300" r="46" fill="#1b3a2c" stroke="#5be08a" stroke-width="4"/>
    <circle cx="330" cy="300" r="38" fill="none" stroke="#5be08a" stroke-width="2.5"/>
    <text x="330" y="310" fill="#dffbe9">S₂</text>
  </g>

  <!-- start arrow -->
  <g stroke="#5be08a" stroke-width="3" fill="none" marker-end="url(#sm-arrow)">
    <path d="M70 150 L108 150"/>
  </g>
</svg>
