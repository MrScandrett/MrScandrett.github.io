<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Go: Outsmart the AI</title>
  <desc id="desc">Black and white Go stones on a warm wooden board with a green digital glow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d2d1e"/>
      <stop offset="1" stop-color="#071711"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e8c36d"/>
      <stop offset="1" stop-color="#b7802f"/>
    </linearGradient>
    <radialGradient id="blackStone" cx=".32" cy=".25" r=".8">
      <stop stop-color="#5d6462"/>
      <stop offset=".32" stop-color="#1b1e1d"/>
      <stop offset="1" stop-color="#050606"/>
    </radialGradient>
    <radialGradient id="whiteStone" cx=".32" cy=".25" r=".8">
      <stop stop-color="#fff"/>
      <stop offset=".6" stop-color="#e9e7df"/>
      <stop offset="1" stop-color="#aaa89f"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1020" cy="92" r="220" fill="#31c878" opacity=".09"/>
  <circle cx="130" cy="610" r="260" fill="#d9a84d" opacity=".08"/>
  <g opacity=".17" stroke="#86e4ad">
    <path d="M0 90h1200M0 170h1200M0 250h1200M0 330h1200M0 410h1200M0 490h1200M0 570h1200"/>
    <path d="M80 0v675M160 0v675M240 0v675M320 0v675M400 0v675M480 0v675M560 0v675M640 0v675M720 0v675M800 0v675M880 0v675M960 0v675M1040 0v675M1120 0v675"/>
  </g>
  <g transform="translate(710 86) rotate(4 210 210)" filter="url(#shadow)">
    <rect width="420" height="420" rx="28" fill="url(#wood)" stroke="#744b17" stroke-width="12"/>
    <g stroke="#684718" stroke-width="4" opacity=".9">
      <path d="M46 46v328M87 46v328M128 46v328M169 46v328M210 46v328M251 46v328M292 46v328M333 46v328M374 46v328"/>
      <path d="M46 46h328M46 87h328M46 128h328M46 169h328M46 210h328M46 251h328M46 292h328M46 333h328M46 374h328"/>
    </g>
    <g fill="#50350f">
      <circle cx="128" cy="128" r="6"/><circle cx="292" cy="128" r="6"/><circle cx="210" cy="210" r="6"/><circle cx="128" cy="292" r="6"/><circle cx="292" cy="292" r="6"/>
    </g>
    <g filter="url(#shadow)">
      <circle cx="128" cy="128" r="24" fill="url(#blackStone)"/>
      <circle cx="169" cy="128" r="24" fill="url(#blackStone)"/>
      <circle cx="210" cy="169" r="24" fill="url(#blackStone)"/>
      <circle cx="251" cy="210" r="24" fill="url(#blackStone)"/>
      <circle cx="292" cy="251" r="24" fill="url(#blackStone)"/>
      <circle cx="169" cy="210" r="24" fill="url(#whiteStone)"/>
      <circle cx="210" cy="251" r="24" fill="url(#whiteStone)"/>
      <circle cx="251" cy="292" r="24" fill="url(#whiteStone)"/>
      <circle cx="128" cy="292" r="24" fill="url(#whiteStone)"/>
      <circle cx="333" cy="169" r="24" fill="url(#whiteStone)"/>
    </g>
    <circle cx="292" cy="251" r="36" fill="#46e68c" opacity=".28" filter="url(#glow)"/>
    <circle cx="292" cy="251" r="30" fill="none" stroke="#9cffc5" stroke-width="4"/>
  </g>
  <g transform="translate(78 104)">
    <rect width="520" height="72" rx="36" fill="#173f29" stroke="#4fa774" stroke-width="2"/>
    <circle cx="40" cy="36" r="18" fill="#68d995"/>
    <path d="M32 36l6 6 12-14" fill="none" stroke="#0d2d1e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="45" fill="#dff9e8" font-family="system-ui, sans-serif" font-size="27" font-weight="700" letter-spacing="2">A GAME BY MR. SCANDRETT</text>
  </g>
  <text x="78" y="286" fill="#fff" font-family="system-ui, sans-serif" font-size="82" font-weight="850">GO</text>
  <text x="78" y="358" fill="#d8f1e1" font-family="system-ui, sans-serif" font-size="54" font-weight="750">OUTSMART THE AI</text>
  <text x="82" y="420" fill="#9fc9af" font-family="system-ui, sans-serif" font-size="28">Strategy • territory • Monte Carlo search</text>
  <g transform="translate(80 498)">
    <rect width="318" height="74" rx="37" fill="#f2c765"/>
    <text x="159" y="48" text-anchor="middle" fill="#16321f" font-family="system-ui, sans-serif" font-size="30" font-weight="800">PLAY 9×9 GO</text>
  </g>
</svg>
