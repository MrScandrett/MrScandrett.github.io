<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Frostline: Citadel Zero thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0c2a4a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Castle/citadel silhouette -->
  <g transform="translate(60 80)" fill="#bae6fd" opacity="0.85">
    <!-- main tower -->
    <rect x="150" y="200" width="120" height="360"/>
    <!-- battlements -->
    <rect x="140" y="175" width="30" height="35"/>
    <rect x="180" y="175" width="30" height="35"/>
    <rect x="220" y="175" width="30" height="35"/>
    <rect x="260" y="175" width="30" height="35"/>
    <!-- side walls -->
    <rect x="60"  y="320" width="90"  height="240"/>
    <rect x="270" y="320" width="90"  height="240"/>
    <!-- side battlements -->
    <rect x="52"  y="298" width="22" height="28"/>
    <rect x="82"  y="298" width="22" height="28"/>
    <rect x="112" y="298" width="22" height="28"/>
    <rect x="262" y="298" width="22" height="28"/>
    <rect x="292" y="298" width="22" height="28"/>
    <rect x="322" y="298" width="22" height="28"/>
    <!-- gate -->
    <rect x="175" y="460" width="70" height="100" rx="35" fill="#0a0f1e"/>
    <!-- snowflake accent -->
    <g transform="translate(210 100)" stroke="#bae6fd" stroke-width="10" fill="none" opacity="0.6">
      <line x1="0" y1="-50" x2="0" y2="50"/>
      <line x1="-50" y1="0" x2="50" y2="0"/>
      <line x1="-35" y1="-35" x2="35" y2="35"/>
      <line x1="35" y1="-35" x2="-35" y2="35"/>
    </g>
  </g>
  <text x="520" y="370" fill="#e0f2fe" font-size="64" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Frostline</text>
  <text x="520" y="445" fill="#e0f2fe" font-size="64" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Citadel Zero</text>
  <text x="520" y="520" fill="#7dd3fc" font-size="38" font-family="Segoe UI, Arial, sans-serif">Action Game · Thomas</text>
</svg>
