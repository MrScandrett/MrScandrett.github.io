<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Tetris thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="100%" stop-color="#1a0030"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Tetris pieces -->
  <g transform="translate(60 80)" stroke="#000" stroke-width="4">
    <!-- I-piece (cyan) -->
    <rect x="60"  y="480" width="56" height="56" fill="#06b6d4"/>
    <rect x="120" y="480" width="56" height="56" fill="#06b6d4"/>
    <rect x="180" y="480" width="56" height="56" fill="#06b6d4"/>
    <rect x="240" y="480" width="56" height="56" fill="#06b6d4"/>
    <!-- L-piece (orange) -->
    <rect x="60"  y="360" width="56" height="56" fill="#f97316"/>
    <rect x="60"  y="420" width="56" height="56" fill="#f97316"/>
    <rect x="120" y="420" width="56" height="56" fill="#f97316"/>
    <rect x="180" y="420" width="56" height="56" fill="#f97316"/>
    <!-- S-piece (green) -->
    <rect x="120" y="300" width="56" height="56" fill="#22c55e"/>
    <rect x="180" y="300" width="56" height="56" fill="#22c55e"/>
    <rect x="60"  y="360" width="56" height="56" fill="#22c55e"/>
    <!-- T-piece (purple, falling) -->
    <rect x="120" y="100" width="56" height="56" fill="#a855f7"/>
    <rect x="60"  y="160" width="56" height="56" fill="#a855f7"/>
    <rect x="120" y="160" width="56" height="56" fill="#a855f7"/>
    <rect x="180" y="160" width="56" height="56" fill="#a855f7"/>
    <!-- O-piece (yellow) -->
    <rect x="240" y="300" width="56" height="56" fill="#eab308"/>
    <rect x="300" y="300" width="56" height="56" fill="#eab308"/>
    <rect x="240" y="360" width="56" height="56" fill="#eab308"/>
    <rect x="300" y="360" width="56" height="56" fill="#eab308"/>
  </g>
  <text x="560" y="380" fill="#f5f3ff" font-size="100" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Tetris</text>
  <text x="560" y="460" fill="#a855f7" font-size="42" font-family="Segoe UI, Arial, sans-serif">Classic Game · Jace B.</text>
</svg>
