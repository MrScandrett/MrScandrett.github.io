  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="72" y="98" fill="#ddc985" font-size="25" font-weight="800" letter-spacing="5">SCHOLARS' CHESS SOCIETY</text>
    <text x="68" y="173" fill="#f4f9ff" font-size="76" font-weight="900" letter-spacing="-3">CHRONOCHESS</text>
    <text x="876" y="173" fill="#ddc985" font-size="76" font-weight="300">3D</text>
    <text x="73" y="215" fill="#b9cce0" font-size="25" font-weight="600" letter-spacing="2">FOUR ERAS. ONE BOARD. YOUR MOVE.</text>
    <text x="73" y="632" fill="#d8e8f7" font-size="22" font-weight="700">A GAME BY MR. SCANDRETT</text>
  </g>
