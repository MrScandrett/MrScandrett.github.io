<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ChronoChess 3D</title>
  <desc id="desc">A glowing three-dimensional chess arena against a deep blue background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#061b17"/>
      <stop offset=".55" stop-color="#0b2b24"/>
      <stop offset="1" stop-color="#170f0a"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2ead6"/>
      <stop offset="1" stop-color="#cdbd97"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#315747"/>
      <stop offset="1" stop-color="#19382f"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#c4a35b" stop-opacity=".42"/>
      <stop offset="1" stop-color="#c4a35b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="boardClip"><path d="M175 470 590 222 1031 451 602 615Z"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="860" cy="172" r="360" fill="url(#halo)"/>
  <g fill="none" stroke="#c4a35b" stroke-opacity=".14">
    <path d="M0 116h1200M0 166h1200M0 216h1200"/>
    <path d="M891 0 737 675M1014 0 874 675M1126 0 1018 675"/>
  </g>
  <path d="M161 477 589 211 1048 447 604 629Z" fill="#25170f" stroke="#c4a35b" stroke-opacity=".72" stroke-width="8" filter="url(#glow)"/>
  <g clip-path="url(#boardClip)">
    <path d="M175 470 590 222 1031 451 602 615Z" fill="url(#dark)"/>
    <g stroke="#b8e1ff" stroke-opacity=".42" stroke-width="3">
      <path d="m227 439 429 206M279 408l377 201M331 377l324 196M383 346l272 191M435 315l220 186M487 284l168 181M539 253l116 176"/>
      <path d="M228 490 646 251M281 511l416-234M335 532l413-229M388 552l412-222M442 573l410-218M495 594l408-213M549 614l405-207"/>
    </g>
    <path d="M488 486 542 454 598 482 543 516Z" fill="#c4a35b" opacity=".8" filter="url(#glow)"/>
    <path d="M707 376 759 348 814 376 761 405Z" fill="#742536" opacity=".75" filter="url(#glow)"/>
  </g>
  <g stroke="#071321" stroke-width="7" stroke-linejoin="round">
    <g fill="url(#light)">
      <path d="M419 436c25-18 60-21 87-5l8 20-20 15 3 53 35 21-7 22H398l-7-22 36-21 2-55-18-10Z"/>
      <circle cx="463" cy="410" r="25"/>
      <path d="M552 400c27-18 62-19 88-2l10 20-22 15 4 69 40 23-8 23H526l-8-23 40-23 3-69-20-12Z"/>
      <path d="M588 365v47m-22-23h44" fill="none" stroke="#d9efff" stroke-width="13"/>
    </g>
    <g fill="#122d50">
      <path d="M760 328c21-17 52-19 76-5l8 18-18 13 4 55 32 19-7 20H742l-7-20 33-19 3-55-18-10Z"/>
      <path d="m870 314 30-52 35 16-11 30 26 31-18 75h-93l-7-20 27-18-4-47Z"/>
