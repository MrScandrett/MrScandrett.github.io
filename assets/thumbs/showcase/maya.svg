<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Gravity Dodge thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Falling obstacles and player dot -->
  <g transform="translate(80 100)">
    <!-- falling blocks -->
    <rect x="60"  y="80"  width="70" height="70" rx="8" fill="#f87171" opacity="0.9"/>
    <rect x="200" y="180" width="70" height="70" rx="8" fill="#fb923c" opacity="0.85"/>
    <rect x="100" y="310" width="70" height="70" rx="8" fill="#f87171" opacity="0.8"/>
    <rect x="240" y="420" width="70" height="70" rx="8" fill="#fb923c" opacity="0.75"/>
    <rect x="40"  y="520" width="70" height="70" rx="8" fill="#f87171" opacity="0.7"/>
    <!-- player -->
    <circle cx="190" cy="560" r="38" fill="#818cf8"/>
    <!-- motion lines -->
    <line x1="145" y1="555" x2="60"  y2="555" stroke="#818cf8" stroke-width="10" opacity="0.5" stroke-linecap="round"/>
    <line x1="145" y1="570" x2="80"  y2="570" stroke="#818cf8" stroke-width="7"  opacity="0.35" stroke-linecap="round"/>
  </g>
  <text x="560" y="370" fill="#e0e7ff" font-size="80" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Gravity Dodge</text>
  <text x="560" y="450" fill="#818cf8" font-size="42" font-family="Segoe UI, Arial, sans-serif">Dodge Game · Maya</text>
</svg>
