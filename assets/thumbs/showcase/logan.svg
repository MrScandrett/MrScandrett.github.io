<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Hollow Knight Style Game thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Knight silhouette -->
  <g transform="translate(80 120)" fill="#d1d5db" stroke="none">
    <ellipse cx="200" cy="100" rx="60" ry="65"/>
    <!-- horns -->
    <polygon points="155,50 135,10 165,55"/>
    <polygon points="245,50 265,10 235,55"/>
    <!-- body -->
    <rect x="140" y="158" width="120" height="180" rx="10"/>
    <!-- legs -->
    <rect x="140" y="330" width="48" height="120" rx="8"/>
    <rect x="212" y="330" width="48" height="120" rx="8"/>
    <!-- cloak -->
    <polygon points="120,170 280,170 320,420 80,420" fill="#6b7280" opacity="0.7"/>
    <!-- sword -->
    <rect x="270" y="140" width="16" height="200" rx="4" fill="#e5e7eb"/>
    <rect x="250" y="200" width="56" height="14" rx="4" fill="#9ca3af"/>
  </g>
  <text x="560" y="380" fill="#f3f4f6" font-size="72" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Hollow Knight</text>
  <text x="560" y="455" fill="#9ca3af" font-size="42" font-family="Segoe UI, Arial, sans-serif">Style Game · Logan</text>
</svg>
