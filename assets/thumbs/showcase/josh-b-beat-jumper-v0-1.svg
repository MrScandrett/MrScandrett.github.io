<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Beat Jumper thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a00"/>
      <stop offset="100%" stop-color="#271a00"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Sound wave bars (beat visualizer) -->
  <g transform="translate(60 440)">
    <rect x="0"   y="-60"  width="36" height="60"  rx="6" fill="#fb923c"/>
    <rect x="46"  y="-130" width="36" height="130" rx="6" fill="#f97316"/>
    <rect x="92"  y="-80"  width="36" height="80"  rx="6" fill="#fb923c"/>
    <rect x="138" y="-200" width="36" height="200" rx="6" fill="#ea580c"/>
    <rect x="184" y="-100" width="36" height="100" rx="6" fill="#fb923c"/>
    <rect x="230" y="-160" width="36" height="160" rx="6" fill="#f97316"/>
    <rect x="276" y="-60"  width="36" height="60"  rx="6" fill="#fb923c"/>
    <rect x="322" y="-240" width="36" height="240" rx="6" fill="#ea580c"/>
    <rect x="368" y="-110" width="36" height="110" rx="6" fill="#fb923c"/>
    <!-- Scratch logo cat silhouette hint -->
    <circle cx="340" cy="-300" r="45" fill="#f97316" opacity="0.3"/>
  </g>
  <!-- Scratch cat simple icon -->
  <g transform="translate(90 180)" fill="#fb923c" opacity="0.7">
    <ellipse cx="90" cy="90" rx="70" ry="65"/>
    <polygon points="30,40 10,0 55,30"/>
    <polygon points="150,40 170,0 125,30"/>
    <circle cx="65" cy="80" r="10" fill="#0f0a00"/>
    <circle cx="115" cy="80" r="10" fill="#0f0a00"/>
  </g>
  <text x="560" y="360" fill="#fff7ed" font-size="80" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Beat Jumper</text>
  <text x="560" y="440" fill="#fb923c" font-size="42" font-family="Segoe UI, Arial, sans-serif">Scratch Game · Josh B.</text>
</svg>
