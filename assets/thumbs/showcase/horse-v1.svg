<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Horse Adventure thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f00"/>
      <stop offset="100%" stop-color="#3d2000"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Voxel-style blocks landscape -->
  <g transform="translate(60 260)">
    <!-- ground blocks -->
    <rect x="0"   y="200" width="60" height="60" fill="#92400e"/>
    <rect x="60"  y="200" width="60" height="60" fill="#78350f"/>
    <rect x="120" y="200" width="60" height="60" fill="#92400e"/>
    <rect x="180" y="200" width="60" height="60" fill="#78350f"/>
    <rect x="240" y="200" width="60" height="60" fill="#92400e"/>
    <rect x="300" y="200" width="60" height="60" fill="#78350f"/>
    <!-- grass tops -->
    <rect x="0"   y="180" width="60" height="22" fill="#16a34a"/>
    <rect x="60"  y="180" width="60" height="22" fill="#15803d"/>
    <rect x="120" y="180" width="60" height="22" fill="#16a34a"/>
    <rect x="180" y="180" width="60" height="22" fill="#15803d"/>
    <rect x="240" y="180" width="60" height="22" fill="#16a34a"/>
    <rect x="300" y="180" width="60" height="22" fill="#15803d"/>
    <!-- raised block platform -->
    <rect x="120" y="120" width="60" height="62" fill="#78350f"/>
    <rect x="120" y="100" width="60" height="22" fill="#16a34a"/>
    <!-- voxel horse (simple) -->
    <rect x="190" y="90"  width="50" height="50" fill="#d97706"/>
    <rect x="240" y="70"  width="30" height="40" fill="#d97706"/>
    <rect x="188" y="138" width="14" height="46" fill="#b45309"/>
    <rect x="205" y="138" width="14" height="46" fill="#b45309"/>
    <rect x="222" y="138" width="14" height="46" fill="#b45309"/>
    <rect x="236" y="138" width="14" height="46" fill="#b45309"/>
    <!-- sun -->
    <rect x="320" y="20" width="50" height="50" fill="#fbbf24"/>
  </g>
  <text x="560" y="360" fill="#fef3c7" font-size="80" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Horse Adventure</text>
  <text x="560" y="440" fill="#f59e0b" font-size="42" font-family="Segoe UI, Arial, sans-serif">Voxel Sandbox · Raegen</text>
</svg>
