<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="3D Fortnite thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1a0c"/>
      <stop offset="100%" stop-color="#1a3a1a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- 3D box wireframe -->
  <g transform="translate(80 160)" fill="none" stroke="#4ade80" stroke-width="16" stroke-linejoin="round">
    <!-- front face -->
    <rect x="80" y="160" width="240" height="240"/>
    <!-- top face -->
    <polygon points="80,160 160,80 400,80 320,160"/>
    <!-- right face -->
    <polygon points="320,160 400,80 400,320 320,400"/>
    <!-- depth lines -->
    <line x1="80" y1="400" x2="160" y2="320"/>
    <line x1="160" y1="80" x2="160" y2="320"/>
    <line x1="400" y1="80" x2="400" y2="320"/>
  </g>
  <text x="560" y="370" fill="#dcfce7" font-size="80" font-family="Segoe UI, Arial, sans-serif" font-weight="700">3D Fortnite</text>
  <text x="560" y="450" fill="#4ade80" font-size="42" font-family="Segoe UI, Arial, sans-serif">Three.js Game · Luke D.</text>
</svg>
