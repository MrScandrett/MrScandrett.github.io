<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Dino Valley thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2a1f"/>
      <stop offset="100%" stop-color="#123a26"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1830"/>
      <stop offset="100%" stop-color="#2c6a63"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1260" cy="220" r="90" fill="#e8a23a"/>

  <!-- distant ridge -->
  <polygon points="0,560 220,470 420,540 640,440 900,530 1140,450 1400,540 1600,480 1600,900 0,900" fill="#123a26" opacity="0.9"/>
  <!-- near valley floor -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#bg)"/>

  <!-- waterhole -->
  <ellipse cx="1180" cy="760" rx="220" ry="60" fill="#2c6f7a" opacity="0.85"/>

  <!-- ferns -->
  <g fill="#2f7a3e">
    <path d="M120 780 q30 -70 60 0 q30 -70 60 0 z"/>
    <path d="M260 800 q26 -60 52 0 q26 -60 52 0 z"/>
  </g>

  <!-- triceratops silhouette (the tamable goal animal) -->
  <g transform="translate(560 560)" fill="#3f6e2f">
    <ellipse cx="150" cy="150" rx="150" ry="70"/>
    <path d="M20 130 C -30 90 -20 20 40 10 C 30 -40 110 -55 130 -5 C 170 -30 210 0 190 40 C 230 40 240 90 200 110 L 180 130 Z"/>
    <circle cx="30" cy="30" r="10" fill="#e8a23a"/>
    <rect x="-4" y="180" width="26" height="60" rx="8"/>
    <rect x="80" y="200" width="26" height="60" rx="8"/>
    <rect x="200" y="200" width="26" height="60" rx="8"/>
    <rect x="270" y="180" width="26" height="60" rx="8"/>
  </g>

  <!-- rex silhouette, distant and dark -->
  <g transform="translate(1020 470) scale(0.9)" fill="#0c2016" opacity="0.92">
    <path d="M0 160 C -10 100 30 40 90 40 C 100 0 150 -30 180 0 C 210 -10 230 20 210 40 C 250 50 260 90 220 100 L 210 160 L 180 160 L 190 110 L 90 110 L 80 220 L 50 220 L 60 110 C 20 130 0 150 0 160 Z"/>
  </g>

  <!-- foreground amber crystals -->
  <g fill="#d98a2b">
    <polygon points="1380,860 1400,820 1420,860 1400,890"/>
    <polygon points="1440,870 1456,838 1472,870 1456,896"/>
  </g>

  <text x="60" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#e7f0da" opacity="0.92">Dino Valley</text>
</svg>
