<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Upward Jumper thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0c1a3a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Platforms and character -->
  <g transform="translate(60 60)">
    <!-- platforms -->
    <rect x="40"  y="580" width="180" height="22" rx="8" fill="#38bdf8"/>
    <rect x="160" y="460" width="160" height="22" rx="8" fill="#38bdf8"/>
    <rect x="80"  y="350" width="140" height="22" rx="8" fill="#38bdf8"/>
    <rect x="200" y="240" width="140" height="22" rx="8" fill="#38bdf8"/>
    <rect x="100" y="140" width="120" height="22" rx="8" fill="#7dd3fc"/>
    <!-- jump arc -->
    <path d="M200,560 Q260,380 280,240" stroke="#38bdf8" stroke-width="6" fill="none" stroke-dasharray="16 10" opacity="0.5" stroke-linecap="round"/>
    <!-- character on platform -->
    <rect x="192" y="198" width="34" height="44" rx="6" fill="#f0abfc"/>
    <circle cx="209" cy="184" r="20" fill="#f0abfc"/>
    <!-- stars -->
    <circle cx="340" cy="80"  r="5" fill="#fde68a"/>
    <circle cx="60"  cy="100" r="4" fill="#fde68a"/>
    <circle cx="280" cy="160" r="3" fill="#fde68a"/>
    <circle cx="380" cy="300" r="5" fill="#fde68a"/>
    <circle cx="30"  cy="280" r="3" fill="#fde68a"/>
  </g>
  <text x="560" y="370" fill="#e0f2fe" font-size="80" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Upward Jumper</text>
  <text x="560" y="450" fill="#38bdf8" font-size="42" font-family="Segoe UI, Arial, sans-serif">Platformer · Drake</text>
</svg>
