<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Xeno-Ecosystem: Neon Evolution thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a05"/>
      <stop offset="100%" stop-color="#0d1f0d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Neon ecosystem blobs -->
  <g filter="url(#glow)">
    <circle cx="180" cy="300" r="55" fill="#00ff88" opacity="0.8"/>
    <circle cx="280" cy="420" r="38" fill="#00ffcc" opacity="0.7"/>
    <circle cx="130" cy="480" r="28" fill="#00ff88" opacity="0.6"/>
    <circle cx="320" cy="250" r="22" fill="#39ff14" opacity="0.75"/>
    <circle cx="200" cy="540" r="18" fill="#00ffcc" opacity="0.65"/>
    <circle cx="360" cy="360" r="16" fill="#00ff88" opacity="0.5"/>
    <!-- connecting lines (ecosystem links) -->
    <line x1="180" y1="300" x2="280" y2="420" stroke="#00ff88" stroke-width="4" opacity="0.4"/>
    <line x1="280" y1="420" x2="130" y2="480" stroke="#00ffcc" stroke-width="4" opacity="0.35"/>
    <line x1="180" y1="300" x2="320" y2="250" stroke="#39ff14" stroke-width="4" opacity="0.4"/>
    <line x1="280" y1="420" x2="360" y2="360" stroke="#00ff88" stroke-width="4" opacity="0.3"/>
    <line x1="130" y1="480" x2="200" y2="540" stroke="#00ffcc" stroke-width="4" opacity="0.35"/>
  </g>
  <text x="500" y="340" fill="#ccfff0" font-size="62" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Xeno-Ecosystem</text>
  <text x="500" y="415" fill="#ccfff0" font-size="62" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Neon Evolution</text>
  <text x="500" y="490" fill="#00ff88" font-size="38" font-family="Segoe UI, Arial, sans-serif">Simulation · Kael</text>
</svg>
