  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g opacity="0.5" fill="#d9a94a">
    <circle cx="34" cy="36" r="1.4"/>
    <circle cx="80" cy="18" r="1"/>
    <circle cx="360" cy="40" r="1.3"/>
    <circle cx="24" cy="230" r="1.1"/>
    <circle cx="370" cy="250" r="1.2"/>
    <circle cx="200" cy="16" r="1"/>
  </g>

  <g transform="translate(200,160) rotate(-8)">
