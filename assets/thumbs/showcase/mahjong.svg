<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1c4a3a"/>
      <stop offset="55%" stop-color="#0d2a21"/>
      <stop offset="100%" stop-color="#060f0c"/>
    </radialGradient>
    <linearGradient id="tileface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf3e3"/>
      <stop offset="100%" stop-color="#e7d7ae"/>
