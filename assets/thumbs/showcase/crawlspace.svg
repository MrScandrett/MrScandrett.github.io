<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#000"/>
  <g font-family="Courier New, monospace" font-size="16" fill="#3a3a3a">
    <text x="20" y="40">####################</text>
    <text x="20" y="60">#..................#</text>
    <text x="20" y="80">#..................#</text>
  </g>
  <g font-family="Courier New, monospace" font-size="16" fill="#8a8a8a">
    <text x="60" y="140">##########</text>
    <text x="60" y="160">#........#</text>
    <text x="60" y="180">#........#</text>
    <text x="60" y="200">##########</text>
  </g>
  <text x="120" y="180" font-family="Courier New, monospace" font-size="18" fill="#ffffff">@</text>
  <text x="180" y="180" font-family="Courier New, monospace" font-size="18" fill="#ff5c5c">g</text>
  <text x="220" y="160" font-family="Courier New, monospace" font-size="18" fill="#ffe14d">$</text>
  <text x="240" y="200" font-family="Courier New, monospace" font-size="18" fill="#ffe14d">&gt;</text>
  <text x="200" y="260" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#7cff9c" text-anchor="middle">Crawlspace</text>
