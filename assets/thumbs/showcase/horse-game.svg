<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Horse Field Demo thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1a0d"/>
      <stop offset="100%" stop-color="#1a3520"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Simple horse silhouette -->
  <g transform="translate(60 100)" fill="#86efac" stroke="none">
    <!-- body -->
    <ellipse cx="230" cy="340" rx="150" ry="90"/>
    <!-- neck -->
    <rect x="330" y="220" width="70" height="140" rx="35" transform="rotate(20 330 220)"/>
    <!-- head -->
    <ellipse cx="400" cy="190" rx="55" ry="40" transform="rotate(20 400 190)"/>
    <!-- mane -->
    <ellipse cx="370" cy="185" rx="18" ry="50" fill="#4ade80" transform="rotate(20 370 185)"/>
    <!-- legs -->
    <rect x="120" y="410" width="34" height="130" rx="12"/>
    <rect x="170" y="415" width="34" height="125" rx="12"/>
    <rect x="270" y="415" width="34" height="125" rx="12"/>
    <rect x="320" y="410" width="34" height="130" rx="12"/>
    <!-- tail -->
    <path d="M100,320 Q40,380 60,460" stroke="#4ade80" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="412" cy="182" r="8" fill="#0d1a0d"/>
    <!-- wireframe overlay hint -->
    <rect x="80" y="250" width="300" height="180" rx="10" fill="none" stroke="#4ade80" stroke-width="6" stroke-dasharray="20 10" opacity="0.4"/>
  </g>
  <text x="560" y="360" fill="#dcfce7" font-size="76" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Horse Field</text>
  <text x="560" y="440" fill="#dcfce7" font-size="76" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Demo</text>
  <text x="560" y="510" fill="#4ade80" font-size="38" font-family="Segoe UI, Arial, sans-serif">3D Test · Raegen</text>
</svg>
