<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">The Engine from Gulliver's Travels</title>
  <desc id="desc">A wooden frame holding a grid of individually lettered word blocks, with hand-crank levers on each side — Jonathan Swift's satirical machine for generating text by mechanical chance.</desc>
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ead7" />
      <stop offset="100%" stop-color="#e3d4ac" />
    </linearGradient>
    <linearGradient id="woodFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a97c3f" />
      <stop offset="100%" stop-color="#7c5a2a" />
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf5e6" />
      <stop offset="100%" stop-color="#f0e2bd" />
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4e8c9" />
      <stop offset="100%" stop-color="#e7d5a5" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" rx="32" fill="url(#paperBg)" />

  <!-- Outer wooden frame -->
  <rect x="46" y="46" width="1108" height="808" rx="26" fill="url(#woodFrame)" />
  <rect x="70" y="70" width="1060" height="760" rx="18" fill="url(#paperBg)" />

  <!-- Title plate -->
  <text x="600" y="128" fill="#4a3417" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" text-anchor="middle" letter-spacing="1">The Engine of Words</text>
  <text x="600" y="160" fill="#7a5c2e" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" text-anchor="middle">Turn the crank — phrases form by chance, not thought</text>

  <!-- Word-block grid: 6 columns x 3 rows, one word per tile -->
  <g>
    <rect x="140" y="196" width="152" height="146" rx="10" fill="url(#tileA)" stroke="#8a6a31" stroke-width="3" />
    <rect x="302" y="196" width="152" height="146" rx="10" fill="url(#tileB)" stroke="#8a6a31" stroke-width="3" />
    <rect x="464" y="196" width="152" height="146" rx="10" fill="url(#tileA)" stroke="#8a6a31" stroke-width="3" />
    <rect x="626" y="196" width="152" height="146" rx="10" fill="url(#tileB)" stroke="#8a6a31" stroke-width="3" />
    <rect x="788" y="196" width="152" height="146" rx="10" fill="url(#tileA)" stroke="#8a6a31" stroke-width="3" />
    <rect x="950" y="196" width="152" height="146" rx="10" fill="url(#tileB)" stroke="#8a6a31" stroke-width="3" />
    <rect x="140" y="352" width="152" height="146" rx="10" fill="url(#tileB)" stroke="#8a6a31" stroke-width="3" />
    <rect x="302" y="352" width="152" height="146" rx="10" fill="url(#tileA)" stroke="#8a6a31" stroke-width="3" />
    <rect x="464" y="352" width="152" height="146" rx="10" fill="url(#tileB)" stroke="#8a6a31" stroke-width="3" />
    <rect x="626" y="352" width="152" height="146" rx="10" fill="url(#tileA)" stroke="#8a6a31" stroke-width="3" />
    <rect x="788" y="352" width="152" height="146" rx="10" fill="url(#tileB)" stroke="#8a6a31" stroke-width="3" />
    <rect x="950" y="352" width="152" height="146" rx="10" fill="url(#tileA)" stroke="#8a6a31" stroke-width="3" />
    <rect x="140" y="508" width="152" height="146" rx="10" fill="url(#tileA)" stroke="#8a6a31" stroke-width="3" />
    <rect x="302" y="508" width="152" height="146" rx="10" fill="url(#tileB)" stroke="#8a6a31" stroke-width="3" />
    <rect x="464" y="508" width="152" height="146" rx="10" fill="url(#tileA)" stroke="#8a6a31" stroke-width="3" />
    <rect x="626" y="508" width="152" height="146" rx="10" fill="url(#tileB)" stroke="#8a6a31" stroke-width="3" />
    <rect x="788" y="508" width="152" height="146" rx="10" fill="url(#tileA)" stroke="#8a6a31" stroke-width="3" />
    <rect x="950" y="508" width="152" height="146" rx="10" fill="url(#tileB)" stroke="#8a6a31" stroke-width="3" />
  </g>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-weight="700" text-anchor="middle">
    <text x="216" y="277" font-size="22" fill="#3a2a12">THE</text>
    <text x="378" y="277" font-size="22" fill="#3a2a12">ENGINE</text>
    <text x="540" y="277" font-size="22" fill="#3a2a12">TURNS</text>
    <text x="702" y="277" font-size="22" fill="#3a2a12">WORDS</text>
    <text x="864" y="277" font-size="22" fill="#3a2a12">INTO</text>
    <text x="1026" y="277" font-size="22" fill="#3a2a12">NEW</text>
    <text x="216" y="433" font-size="17" fill="#3a2a12">PHRASES</text>
    <text x="378" y="433" font-size="22" fill="#3a2a12">BY</text>
    <text x="540" y="433" font-size="22" fill="#3a2a12">RULE</text>
    <text x="702" y="433" font-size="22" fill="#3a2a12">ALONE</text>
    <text x="864" y="433" font-size="22" fill="#3a2a12">SHIFT</text>
    <text x="1026" y="433" font-size="22" fill="#3a2a12">SORT</text>
    <text x="216" y="589" font-size="17" fill="#3a2a12">COMBINE</text>
    <text x="378" y="589" font-size="22" fill="#3a2a12">REPEAT</text>
    <text x="540" y="589" font-size="22" fill="#3a2a12">GUESS</text>
    <text x="702" y="589" font-size="22" fill="#3a2a12">SCAN</text>
    <text x="864" y="589" font-size="22" fill="#3a2a12">COPY</text>
    <text x="1026" y="589" font-size="22" fill="#3a2a12">PRINT</text>
  </g>

  <!-- Left crank levers -->
  <g stroke="#5c3f1a" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M46 236 h-30 v-40" />
    <path d="M46 450 h-30 v-40" />
    <path d="M46 664 h-30 v-40" />
  </g>
  <g fill="#5c3f1a">
    <circle cx="16" cy="196" r="14" />
    <circle cx="16" cy="410" r="14" />
    <circle cx="16" cy="624" r="14" />
  </g>

  <!-- Right crank levers -->
  <g stroke="#5c3f1a" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M1154 236 h30 v-40" />
    <path d="M1154 450 h30 v-40" />
    <path d="M1154 664 h30 v-40" />
  </g>
  <g fill="#5c3f1a">
    <circle cx="1184" cy="196" r="14" />
    <circle cx="1184" cy="410" r="14" />
    <circle cx="1184" cy="624" r="14" />
  </g>

  <!-- Bottom caption strip -->
  <text x="600" y="838" fill="#7a5c2e" font-family="Georgia, 'Times New Roman', serif" font-size="18" text-anchor="middle">Academy of Lagado, from Part III of Gulliver's Travels (1726)</text>

  <rect x="70" y="70" width="1060" height="760" rx="18" fill="none" stroke="#8a6a31" stroke-width="4" opacity="0.5" />
</svg>
