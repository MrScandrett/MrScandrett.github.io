<svg xmlns="http://www.w3.org/2000/svg" width="690" height="364" viewBox="0 0 690 364" role="img" aria-label="Sorting algorithm bar chart thumbnail">
  <defs>
    <linearGradient id="srt-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1840"/>
      <stop offset="1" stop-color="#06122e"/>
    </linearGradient>
    <linearGradient id="srt-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2b62d8"/>
      <stop offset="1" stop-color="#8bb4ff"/>
    </linearGradient>
  </defs>
  <rect width="690" height="364" fill="url(#srt-bg)"/>
  <!-- baseline -->
  <line x1="40" y1="312" x2="650" y2="312" stroke="rgba(139,180,255,0.35)" stroke-width="2"/>
  <!-- sorted ascending bars -->
  <g fill="url(#srt-bar)">
    <rect x="48"  y="276" width="34" height="36"  rx="3"/>
    <rect x="92"  y="252" width="34" height="60"  rx="3"/>
    <rect x="136" y="224" width="34" height="88"  rx="3"/>
    <rect x="180" y="196" width="34" height="116" rx="3"/>
    <rect x="224" y="168" width="34" height="144" rx="3"/>
    <rect x="268" y="140" width="34" height="172" rx="3"/>
    <rect x="312" y="116" width="34" height="196" rx="3"/>
  </g>
  <!-- active comparison pair, highlighted -->
  <g fill="#ffcf4d">
    <rect x="356" y="92"  width="34" height="220" rx="3"/>
    <rect x="400" y="72"  width="34" height="240" rx="3"/>
  </g>
  <g fill="url(#srt-bar)" opacity="0.55">
    <rect x="444" y="150" width="34" height="162" rx="3"/>
    <rect x="488" y="118" width="34" height="194" rx="3"/>
    <rect x="532" y="186" width="34" height="126" rx="3"/>
    <rect x="576" y="100" width="34" height="212" rx="3"/>
  </g>
  <!-- swap arrows over the highlighted pair -->
  <g stroke="#ffcf4d" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M362 56 q18 -22 36 0"/>
    <path d="M398 56 l8 -2 -2 8" />
  </g>
  <text x="48" y="346" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="rgba(139,180,255,0.7)">O(n log n)</text>
</svg>
