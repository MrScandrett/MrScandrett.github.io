<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="960" height="700" fill="#fef8f4"/>

  <!-- side cross-section of a wall stack of layers -->
  <g>
    <rect x="330" y="150" width="300" height="80"  fill="#3b6fd6" opacity="0.9"/>
    <rect x="330" y="230" width="300" height="80"  fill="#3b6fd6" opacity="0.9"/>
    <!-- crack -->
    <rect x="330" y="310" width="300" height="26" fill="#fef8f4"/>
    <path d="M330,310 C400,326 340,320 420,332 C480,340 420,314 500,326 C560,334 520,312 630,326"
          fill="none" stroke="#c43d00" stroke-width="4"/>
    <rect x="330" y="336" width="300" height="80"  fill="#3b6fd6" opacity="0.9"/>
    <rect x="330" y="416" width="300" height="80"  fill="#3b6fd6" opacity="0.9"/>
    <rect x="330" y="496" width="300" height="80"  fill="#3b6fd6" opacity="0.9"/>
  </g>
  <g stroke="#2b4fa0" stroke-width="1" opacity="0.4">
    <line x1="330" y1="150" x2="630" y2="150"/>
    <line x1="330" y1="230" x2="630" y2="230"/>
    <line x1="330" y1="416" x2="630" y2="416"/>
    <line x1="330" y1="496" x2="630" y2="496"/>
    <line x1="330" y1="576" x2="630" y2="576"/>
  </g>

  <line x1="640" y1="323" x2="780" y2="290" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="640" cy="323" r="4" fill="#5a3a1a"/>
  <text x="785" y="265" font-size="24" fill="#3a2a1a">Layer never fully</text>
  <text x="785" y="292" font-size="24" fill="#3a2a1a">fused to the one</text>
  <text x="785" y="319" font-size="24" fill="#3a2a1a">below it</text>

  <line x1="330" y1="323" x2="180" y2="380" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="330" cy="323" r="4" fill="#5a3a1a"/>
  <text x="170" y="405" font-size="24" fill="#3a2a1a" text-anchor="end">Too cold, too fast,</text>
  <text x="170" y="432" font-size="24" fill="#3a2a1a" text-anchor="end">or too much cooling</text>
  <text x="170" y="459" font-size="24" fill="#3a2a1a" text-anchor="end">between layers</text>

  <text x="480" y="640" font-size="24" fill="#3a2a1a" text-anchor="middle">Part splits cleanly along a layer line under load</text>

  <text x="30" y="672" font-size="17" fill="#a8968a">FFF 3D printing troubleshooting — layer delamination</text>
</svg>
