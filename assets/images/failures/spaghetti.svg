<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="960" height="700" fill="#fef8f4"/>
  <!-- build plate -->
  <g>
    <polygon points="140,560 560,560 700,470 280,470" fill="#ffe3d1" stroke="#ff6b35" stroke-width="4"/>
  </g>
  <!-- fallen detached part, knocked over -->
  <g transform="translate(330,455) rotate(-14)">
    <rect x="-40" y="-90" width="80" height="90" rx="4" fill="#3b6fd6" opacity="0.85"/>
    <line x1="-40" y1="-70" x2="40" y2="-70" stroke="#2b4fa0" stroke-width="2"/>
    <line x1="-40" y1="-45" x2="40" y2="-45" stroke="#2b4fa0" stroke-width="2"/>
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#2b4fa0" stroke-width="2"/>
  </g>
  <!-- printhead -->
  <g transform="translate(560,190)">
    <rect x="-70" y="-18" width="140" height="26" rx="4" fill="#8a8f98"/>
    <rect x="-24" y="8" width="48" height="46" rx="6" fill="#c9ccd2"/>
    <polygon points="-10,54 10,54 0,80" fill="#ffb020"/>
  </g>
  <!-- tangled spaghetti loops -->
  <g fill="none" stroke="#3b6fd6" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M400,260 C480,220 520,330 460,340 C400,350 380,270 460,250 C540,230 560,320 500,360 C440,400 380,360 420,300"/>
    <path d="M320,320 C260,300 250,380 320,390 C390,400 410,330 340,320 C270,310 260,400 340,410"/>
    <path d="M550,300 C610,280 630,360 570,380 C510,400 480,340 540,330"/>
    <path d="M420,400 C360,420 340,470 410,470 C480,470 480,410 420,430"/>
  </g>
  <!-- leader lines & labels -->
  <line x1="600" y1="230" x2="700" y2="150" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="600" cy="230" r="4" fill="#5a3a1a"/>
  <text x="705" y="145" font-size="24" fill="#3a2a1a">Nozzle keeps moving</text>
  <text x="705" y="172" font-size="24" fill="#3a2a1a">after the part detaches</text>

  <line x1="340" y1="465" x2="150" y2="400" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="340" cy="465" r="4" fill="#5a3a1a"/>
  <text x="30" y="380" font-size="24" fill="#3a2a1a" text-anchor="start">Print peeled off the bed</text>
  <text x="30" y="407" font-size="24" fill="#3a2a1a" text-anchor="start">and got knocked over</text>

  <line x1="480" y1="330" x2="480" y2="600" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="480" cy="330" r="4" fill="#5a3a1a"/>
  <text x="480" y="625" font-size="24" fill="#3a2a1a" text-anchor="middle">Molten filament drags through</text>
  <text x="480" y="652" font-size="24" fill="#3a2a1a" text-anchor="middle">open air, cooling into loops</text>

  <text x="30" y="672" font-size="17" fill="#a8968a">FFF 3D printing troubleshooting — spaghetti failure</text>
</svg>
