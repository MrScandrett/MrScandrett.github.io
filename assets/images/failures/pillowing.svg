<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="960" height="700" fill="#fef8f4"/>

  <!-- cross section: walls, sparse infill, sagging top skin -->
  <rect x="220" y="230" width="30" height="270" fill="#3b6fd6"/>
  <rect x="710" y="230" width="30" height="270" fill="#3b6fd6"/>

  <!-- sparse infill lines -->
  <g stroke="#3b6fd6" stroke-width="6" opacity="0.55">
    <line x1="270" y1="480" x2="330" y2="420"/>
    <line x1="330" y1="480" x2="390" y2="420"/>
    <line x1="390" y1="480" x2="450" y2="420"/>
    <line x1="450" y1="480" x2="510" y2="420"/>
    <line x1="510" y1="480" x2="570" y2="420"/>
    <line x1="570" y1="480" x2="630" y2="420"/>
    <line x1="630" y1="480" x2="690" y2="420"/>
  </g>

  <!-- sagging top skin with holes -->
  <path d="M250,240 C300,255 320,300 370,260 C420,222 450,290 500,255 C550,220 580,285 630,250 C680,215 700,255 710,240"
        fill="none" stroke="#ffdcb4" stroke-width="14" stroke-linecap="round"/>
  <!-- pillow bubbles / holes -->
  <g fill="#c9863f" opacity="0.55">
    <ellipse cx="345" cy="268" rx="9" ry="5"/>
    <ellipse cx="475" cy="262" rx="10" ry="5"/>
    <ellipse cx="605" cy="258" rx="9" ry="5"/>
  </g>

  <line x1="475" y1="255" x2="475" y2="140" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="475" cy="255" r="4" fill="#5a3a1a"/>
  <text x="475" y="115" font-size="24" fill="#3a2a1a" text-anchor="middle">Top skin bridges gaps in</text>
  <text x="475" y="90" font-size="24" fill="#3a2a1a" text-anchor="middle">sparse infill and sags between them</text>

  <line x1="480" y1="450" x2="480" y2="580" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="480" cy="450" r="4" fill="#5a3a1a"/>
  <text x="480" y="605" font-size="24" fill="#3a2a1a" text-anchor="middle">Fix: more top layers or</text>
  <text x="480" y="632" font-size="24" fill="#3a2a1a" text-anchor="middle">higher infill density beneath</text>

  <text x="30" y="672" font-size="17" fill="#a8968a">FFF 3D printing troubleshooting — pillowing</text>
</svg>
