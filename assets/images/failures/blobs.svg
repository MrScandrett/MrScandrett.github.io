<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="960" height="700" fill="#fef8f4"/>

  <!-- top-down view of a cylindrical wall with seam -->
  <circle cx="480" cy="340" r="180" fill="none" stroke="#3b6fd6" stroke-width="16"/>
  <circle cx="480" cy="340" r="180" fill="none" stroke="#2b4fa0" stroke-width="2" stroke-dasharray="3 10" opacity="0.6"/>

  <!-- blobs at seam points, stacked at same X location (aligned seam) -->
  <g fill="#ffb020" stroke="#c9863f" stroke-width="1.5">
    <circle cx="480" cy="164" r="11"/>
    <circle cx="480" cy="192" r="10"/>
    <circle cx="480" cy="220" r="9"/>
  </g>

  <line x1="486" y1="164" x2="700" y2="120" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="486" cy="164" r="4" fill="#5a3a1a"/>
  <text x="705" y="100" font-size="24" fill="#3a2a1a">Nozzle pauses and</text>
  <text x="705" y="127" font-size="24" fill="#3a2a1a">re-starts at the same</text>
  <text x="705" y="154" font-size="24" fill="#3a2a1a">seam point every layer</text>

  <line x1="300" y1="340" x2="140" y2="420" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="300" cy="340" r="4" fill="#5a3a1a"/>
  <text x="120" y="450" font-size="24" fill="#3a2a1a" text-anchor="end">Wall pressure keeps</text>
  <text x="120" y="477" font-size="24" fill="#3a2a1a" text-anchor="end">pushing plastic out</text>
  <text x="120" y="504" font-size="24" fill="#3a2a1a" text-anchor="end">after the stop signal</text>

  <text x="480" y="600" font-size="24" fill="#3a2a1a" text-anchor="middle">Result: raised bumps ("zits") stacking</text>
  <text x="480" y="627" font-size="24" fill="#3a2a1a" text-anchor="middle">into a visible ridge up the seam line</text>

  <text x="30" y="672" font-size="17" fill="#a8968a">FFF 3D printing troubleshooting — blobs &amp; zits</text>
</svg>
