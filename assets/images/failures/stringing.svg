<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="960" height="700" fill="#fef8f4"/>
  <polygon points="140,600 820,600 760,540 200,540" fill="#ffe3d1" stroke="#ff6b35" stroke-width="4"/>

  <!-- two towers -->
  <g>
    <rect x="260" y="300" width="90" height="240" fill="#3b6fd6" opacity="0.9"/>
    <rect x="610" y="300" width="90" height="240" fill="#3b6fd6" opacity="0.9"/>
    <g stroke="#2b4fa0" stroke-width="1.5" opacity="0.7">
      <line x1="260" y1="330" x2="350" y2="330"/>
      <line x1="260" y1="370" x2="350" y2="370"/>
      <line x1="260" y1="410" x2="350" y2="410"/>
      <line x1="260" y1="450" x2="350" y2="450"/>
      <line x1="260" y1="490" x2="350" y2="490"/>
      <line x1="610" y1="330" x2="700" y2="330"/>
      <line x1="610" y1="370" x2="700" y2="370"/>
      <line x1="610" y1="410" x2="700" y2="410"/>
      <line x1="610" y1="450" x2="700" y2="450"/>
      <line x1="610" y1="490" x2="700" y2="490"/>
    </g>
  </g>

  <!-- travel path of nozzle, dotted -->
  <path d="M305,290 C400,240 520,240 655,290" fill="none" stroke="#9aa0aa" stroke-width="2" stroke-dasharray="6 6"/>
  <g transform="translate(655,290)">
    <rect x="-40" y="-14" width="80" height="20" rx="4" fill="#8a8f98"/>
    <rect x="-14" y="6" width="28" height="26" rx="5" fill="#c9ccd2"/>
    <polygon points="-6,32 6,32 0,48" fill="#ffb020"/>
  </g>

  <!-- strings -->
  <g stroke="#c9863f" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M310,300 C420,330 540,330 650,300"/>
    <path d="M320,300 C420,345 540,345 640,300"/>
    <path d="M330,300 C420,320 540,320 630,300"/>
  </g>

  <line x1="480" y1="315" x2="480" y2="200" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="480" cy="315" r="4" fill="#5a3a1a"/>
  <text x="480" y="175" font-size="24" fill="#3a2a1a" text-anchor="middle">Nozzle oozes while</text>
  <text x="480" y="150" font-size="24" fill="#3a2a1a" text-anchor="middle">travelling between towers</text>

  <line x1="480" y1="322" x2="480" y2="410" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="480" cy="322" r="4" fill="#5a3a1a"/>
  <text x="480" y="435" font-size="24" fill="#3a2a1a" text-anchor="middle">Thin strands cool into</text>
  <text x="480" y="462" font-size="24" fill="#3a2a1a" text-anchor="middle">hair-thin plastic threads</text>

  <text x="30" y="672" font-size="17" fill="#a8968a">FFF 3D printing troubleshooting — stringing</text>
</svg>
