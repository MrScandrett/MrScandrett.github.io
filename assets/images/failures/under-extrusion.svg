<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="960" height="700" fill="#fef8f4"/>

  <text x="255" y="140" font-size="26" font-weight="700" fill="#5a3a1a" text-anchor="middle">Correct flow</text>
  <text x="700" y="140" font-size="26" font-weight="700" fill="#c43d00" text-anchor="middle">Under-extrusion</text>

  <!-- good wall -->
  <g>
    <rect x="150" y="180" width="210" height="320" fill="#fef8f4" stroke="#ff6b35" stroke-width="3"/>
    <g stroke="#3b6fd6" stroke-width="10" stroke-linecap="round">
      <line x1="165" y1="200" x2="345" y2="200"/>
      <line x1="165" y1="230" x2="345" y2="230"/>
      <line x1="165" y1="260" x2="345" y2="260"/>
      <line x1="165" y1="290" x2="345" y2="290"/>
      <line x1="165" y1="320" x2="345" y2="320"/>
      <line x1="165" y1="350" x2="345" y2="350"/>
      <line x1="165" y1="380" x2="345" y2="380"/>
      <line x1="165" y1="410" x2="345" y2="410"/>
      <line x1="165" y1="440" x2="345" y2="440"/>
      <line x1="165" y1="470" x2="345" y2="470"/>
    </g>
  </g>

  <!-- bad wall with gaps -->
  <g>
    <rect x="600" y="180" width="210" height="320" fill="#fef8f4" stroke="#ff6b35" stroke-width="3"/>
    <g stroke="#3b6fd6" stroke-width="7" stroke-linecap="round" opacity="0.85">
      <line x1="615" y1="200" x2="795" y2="200"/>
      <line x1="615" y1="230" x2="720" y2="230"/>
      <line x1="750" y1="230" x2="795" y2="230"/>
      <line x1="615" y1="260" x2="670" y2="260"/>
      <line x1="700" y1="260" x2="795" y2="260"/>
      <line x1="615" y1="290" x2="795" y2="290"/>
      <line x1="615" y1="320" x2="660" y2="320"/>
      <line x1="690" y1="320" x2="740" y2="320"/>
      <line x1="770" y1="320" x2="795" y2="320"/>
      <line x1="615" y1="350" x2="795" y2="350"/>
      <line x1="615" y1="380" x2="650" y2="380"/>
      <line x1="680" y1="380" x2="795" y2="380"/>
      <line x1="615" y1="410" x2="795" y2="410"/>
      <line x1="615" y1="440" x2="700" y2="440"/>
      <line x1="730" y1="440" x2="795" y2="440"/>
      <line x1="615" y1="470" x2="795" y2="470"/>
    </g>
  </g>

  <!-- filament path diagram at bottom -->
  <g transform="translate(80,555)">
    <rect x="0" y="0" width="34" height="70" rx="6" fill="#c9ccd2"/>
    <rect x="8" y="70" width="18" height="40" fill="#8a8f98"/>
    <polygon points="8,110 26,110 17,130" fill="#ffb020"/>
    <line x1="17" y1="-20" x2="17" y2="0" stroke="#3b6fd6" stroke-width="6"/>
    <text x="45" y="35" font-size="21" fill="#3a2a1a">Feeder gear slips or nozzle</text>
    <text x="45" y="60" font-size="21" fill="#3a2a1a">is partly clogged — less</text>
    <text x="45" y="85" font-size="21" fill="#3a2a1a">plastic reaches the tip than</text>
    <text x="45" y="110" font-size="21" fill="#3a2a1a">the slicer commanded</text>
  </g>

  <text x="30" y="672" font-size="17" fill="#a8968a">FFF 3D printing troubleshooting — under-extrusion</text>
</svg>
