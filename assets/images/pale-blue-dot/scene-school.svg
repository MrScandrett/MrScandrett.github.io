<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="An aerial view of a school building with a courtyard, running track and trees">
  <title>Your School</title>
  <defs>
    <radialGradient id="s-bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2d4030"/>
      <stop offset="100%" stop-color="#152018"/>
    </radialGradient>
    <linearGradient id="s-roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b06a4a"/>
      <stop offset="100%" stop-color="#8a4e34"/>
    </linearGradient>
    <linearGradient id="s-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9c5a3d"/>
      <stop offset="100%" stop-color="#7a442c"/>
    </linearGradient>
    <radialGradient id="s-tree" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5c8a4a"/>
      <stop offset="100%" stop-color="#2e5230"/>
    </radialGradient>
    <radialGradient id="s-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255,214,120,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,214,120,0)"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#s-bg)"/>

  <!-- running track -->
  <ellipse cx="480" cy="250" rx="330" ry="150" fill="none" stroke="#7a5a3a" stroke-width="22" opacity="0.5"/>
  <ellipse cx="480" cy="250" rx="330" ry="150" fill="none" stroke="#c9a86a" stroke-width="2" stroke-dasharray="10 10" opacity="0.5"/>

  <!-- main building block -->
  <rect x="290" y="150" width="380" height="200" rx="10" fill="url(#s-roof)"/>
  <rect x="290" y="150" width="380" height="200" rx="10" fill="none" stroke="#5f3320" stroke-width="4"/>
  <g stroke="#5f3320" stroke-width="3" opacity="0.6">
    <path d="M370 150 v200 M450 150 v200 M530 150 v200 M610 150 v200"/>
    <path d="M290 210 h380 M290 270 h380"/>
  </g>

  <!-- side wing -->
  <rect x="150" y="200" width="140" height="100" rx="8" fill="url(#s-wing)"/>
  <rect x="670" y="220" width="130" height="90" rx="8" fill="url(#s-wing)"/>

  <!-- courtyard -->
  <rect x="440" y="200" width="80" height="100" rx="6" fill="#4a6a3c" opacity="0.7"/>
  <line x1="480" y1="200" x2="480" y2="300" stroke="#e8dcb8" stroke-width="2" opacity="0.6"/>
  <circle cx="480" cy="250" r="16" fill="none" stroke="#e8dcb8" stroke-width="2" opacity="0.6"/>

  <!-- trees around the grounds -->
  <g>
    <circle cx="150" cy="120" r="22" fill="url(#s-tree)"/>
    <circle cx="200" cy="100" r="16" fill="url(#s-tree)"/>
    <circle cx="810" cy="140" r="20" fill="url(#s-tree)"/>
    <circle cx="850" cy="180" r="15" fill="url(#s-tree)"/>
    <circle cx="140" cy="380" r="18" fill="url(#s-tree)"/>
    <circle cx="820" cy="400" r="22" fill="url(#s-tree)"/>
    <circle cx="760" cy="430" r="14" fill="url(#s-tree)"/>
  </g>

  <!-- parking lot -->
  <g stroke="#c9c9c9" stroke-width="2" opacity="0.35">
    <path d="M330 420 v40 M370 420 v40 M410 420 v40 M450 420 v40 M490 420 v40 M530 420 v40 M570 420 v40 M610 420 v40"/>
  </g>

  <!-- you are here -->
  <circle cx="480" cy="250" r="46" fill="url(#s-glow)"/>
</svg>
