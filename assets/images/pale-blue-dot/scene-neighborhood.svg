<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="An aerial view of a neighborhood with houses, yards and streets">
  <title>Your Neighborhood</title>
  <defs>
    <linearGradient id="n-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33472f"/>
      <stop offset="100%" stop-color="#1b2a1c"/>
    </linearGradient>
    <radialGradient id="n-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255,214,120,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,214,120,0)"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#n-bg)"/>

  <!-- streets -->
  <g stroke="#39424a" stroke-width="26">
    <path d="M0 130 h960 M0 280 h960 M0 420 h960"/>
  </g>
  <g stroke="#c9b25a" stroke-width="2" stroke-dasharray="14 12" opacity="0.6">
    <path d="M0 130 h960 M0 280 h960 M0 420 h960"/>
  </g>
  <g stroke="#39424a" stroke-width="24">
    <path d="M180 0 v500 M480 0 v500 M760 0 v500"/>
  </g>
  <g stroke="#c9b25a" stroke-width="2" stroke-dasharray="14 12" opacity="0.6">
    <path d="M180 0 v500 M480 0 v500 M760 0 v500"/>
  </g>

  <!-- houses: yard + roof, scattered across the blocks -->
  <g>
    <!-- block helper via repeated groups -->
    <g transform="translate(70,50)">
      <rect x="-26" y="-18" width="52" height="40" rx="5" fill="#c98a4f"/>
      <polygon points="-30,-18 0,-40 30,-18" fill="#8c5230"/>
    </g>
    <g transform="translate(280,60)">
      <rect x="-24" y="-16" width="48" height="36" rx="5" fill="#7fa8c9"/>
      <polygon points="-28,-16 0,-36 28,-16" fill="#4f7898"/>
    </g>
    <g transform="translate(340,90)">
      <rect x="-22" y="-16" width="44" height="34" rx="5" fill="#c9977f"/>
      <polygon points="-26,-16 0,-34 26,-16" fill="#966249"/>
    </g>
    <g transform="translate(600,60)">
      <rect x="-26" y="-18" width="52" height="38" rx="5" fill="#9ac97f"/>
      <polygon points="-30,-18 0,-38 30,-18" fill="#6a9850"/>
    </g>
    <g transform="translate(660,95)">
      <rect x="-22" y="-15" width="44" height="32" rx="5" fill="#d0b06a"/>
      <polygon points="-26,-15 0,-32 26,-15" fill="#a07f42"/>
    </g>
    <g transform="translate(870,60)">
      <rect x="-24" y="-16" width="48" height="36" rx="5" fill="#c97fa8"/>
      <polygon points="-28,-16 0,-36 28,-16" fill="#98507c"/>
    </g>

    <g transform="translate(80,200)">
      <rect x="-24" y="-16" width="48" height="36" rx="5" fill="#c9977f"/>
      <polygon points="-28,-16 0,-36 28,-16" fill="#966249"/>
    </g>
    <g transform="translate(330,205)">
      <rect x="-26" y="-18" width="52" height="40" rx="5" fill="#7fa8c9"/>
      <polygon points="-30,-18 0,-40 30,-18" fill="#4f7898"/>
    </g>
    <g transform="translate(620,200)">
      <rect x="-24" y="-16" width="48" height="36" rx="5" fill="#c98a4f"/>
      <polygon points="-28,-16 0,-36 28,-16" fill="#8c5230"/>
    </g>
    <g transform="translate(890,210)">
      <rect x="-22" y="-15" width="44" height="32" rx="5" fill="#9ac97f"/>
      <polygon points="-26,-15 0,-32 26,-15" fill="#6a9850"/>
    </g>

    <g transform="translate(90,350)">
      <rect x="-24" y="-16" width="48" height="36" rx="5" fill="#d0b06a"/>
      <polygon points="-28,-16 0,-36 28,-16" fill="#a07f42"/>
    </g>
    <g transform="translate(300,360)">
      <rect x="-22" y="-15" width="44" height="32" rx="5" fill="#c97fa8"/>
      <polygon points="-26,-15 0,-32 26,-15" fill="#98507c"/>
    </g>
    <g transform="translate(620,355)">
      <rect x="-26" y="-18" width="52" height="40" rx="5" fill="#7fa8c9"/>
      <polygon points="-30,-18 0,-40 30,-18" fill="#4f7898"/>
    </g>
    <g transform="translate(870,350)">
      <rect x="-24" y="-16" width="48" height="36" rx="5" fill="#c98a4f"/>
      <polygon points="-28,-16 0,-36 28,-16" fill="#8c5230"/>
    </g>
  </g>

  <!-- your home, highlighted -->
  <circle cx="480" cy="200" r="50" fill="url(#n-glow)"/>
  <g transform="translate(480,200)">
    <rect x="-28" y="-19" width="56" height="42" rx="5" fill="#ffd678"/>
    <polygon points="-32,-19 0,-42 32,-19" fill="#e8a53c"/>
    <rect x="-6" y="0" width="12" height="19" fill="#7a4f28"/>
  </g>
</svg>
