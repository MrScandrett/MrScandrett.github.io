<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="A single school desk with an open notebook, pencil and apple, lit by warm morning light">
  <title>Your Desk</title>
  <defs>
    <radialGradient id="d-bg" cx="35%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#6b4a2a"/>
      <stop offset="55%" stop-color="#3c2818"/>
      <stop offset="100%" stop-color="#1a1109"/>
    </radialGradient>
    <linearGradient id="d-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a06f3f"/>
      <stop offset="100%" stop-color="#7a4f28"/>
    </linearGradient>
    <linearGradient id="d-woodtop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5c33"/>
      <stop offset="100%" stop-color="#6d4726"/>
    </linearGradient>
    <linearGradient id="d-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf4e2"/>
      <stop offset="100%" stop-color="#efe3c6"/>
    </linearGradient>
    <radialGradient id="d-apple" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff8266"/>
      <stop offset="60%" stop-color="#d43f34"/>
      <stop offset="100%" stop-color="#9c2420"/>
    </radialGradient>
    <linearGradient id="d-pencil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2c34d"/>
      <stop offset="100%" stop-color="#dba32a"/>
    </linearGradient>
    <radialGradient id="d-light" cx="20%" cy="8%" r="60%">
      <stop offset="0%" stop-color="rgba(255,224,160,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,224,160,0)"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#d-bg)"/>
  <rect width="960" height="500" fill="url(#d-light)"/>

  <!-- desk shadow -->
  <ellipse cx="480" cy="430" rx="320" ry="34" fill="rgba(0,0,0,0.35)"/>

  <!-- desk legs -->
  <rect x="220" y="330" width="18" height="90" rx="4" fill="#4a3018"/>
  <rect x="722" y="330" width="18" height="90" rx="4" fill="#4a3018"/>

  <!-- desk body -->
  <rect x="180" y="230" width="600" height="150" rx="18" fill="url(#d-wood)"/>
  <rect x="180" y="215" width="600" height="34" rx="10" fill="url(#d-woodtop)"/>
  <g stroke="rgba(0,0,0,0.12)" stroke-width="2">
    <path d="M210 260 h540 M210 300 h540 M210 340 h540"/>
  </g>

  <!-- notebook -->
  <g>
    <rect x="335" y="160" width="290" height="176" rx="10" fill="url(#d-paper)"/>
    <line x1="480" y1="168" x2="480" y2="328" stroke="rgba(120,95,60,0.35)" stroke-width="3"/>
    <g stroke="rgba(120,95,60,0.28)" stroke-width="2">
      <path d="M358 196 h96 M358 216 h96 M358 236 h96 M358 256 h96 M358 276 h96 M358 296 h96"/>
      <path d="M506 196 h96 M506 216 h96 M506 236 h96 M506 256 h96 M506 276 h96 M506 296 h96"/>
    </g>
  </g>

  <!-- pencil -->
  <g transform="translate(650,235) rotate(-18)">
    <rect x="0" y="0" width="150" height="20" rx="6" fill="url(#d-pencil)"/>
    <rect x="0" y="0" width="20" height="20" rx="6" fill="#e8798f"/>
    <polygon points="150,0 172,10 150,20" fill="#e9c79a"/>
    <polygon points="166,7 172,10 166,13" fill="#5a4632"/>
  </g>

  <!-- apple -->
  <g transform="translate(258,268)">
    <circle r="34" fill="url(#d-apple)"/>
    <path d="M-4,-30 q6,-16 16,-18" stroke="#6a8a3c" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="-3" y="-38" width="6" height="14" rx="2" fill="#5a3a20"/>
  </g>

  <!-- the marker's fixed point, drawn by canvas on top -->
</svg>
