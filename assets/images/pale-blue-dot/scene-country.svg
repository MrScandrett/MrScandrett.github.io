<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="An abstract map of a country with a highlighted state and surrounding cities">
  <title>Your Country</title>
  <defs>
    <linearGradient id="co-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2236"/>
      <stop offset="100%" stop-color="#061220"/>
    </linearGradient>
    <linearGradient id="co-ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c3f5e"/>
      <stop offset="100%" stop-color="#0c2438"/>
    </linearGradient>
    <linearGradient id="co-land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8aa25c"/>
      <stop offset="100%" stop-color="#586e34"/>
    </linearGradient>
    <linearGradient id="co-state" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a9a5c"/>
      <stop offset="100%" stop-color="#3f6e40"/>
    </linearGradient>
    <radialGradient id="co-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255,214,120,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,214,120,0)"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#co-bg)"/>
  <rect width="960" height="500" fill="url(#co-ocean)" opacity="0.5"/>
  <g stroke="rgba(255,255,255,0.06)" stroke-width="8" fill="none">
    <path d="M-40,120 Q480,90 1000,150"/>
    <path d="M-40,420 Q480,450 1000,390"/>
  </g>

  <!-- country landmass -->
  <path d="M220,60 C380,20 560,30 660,90 C760,120 820,200 800,280
           C840,340 800,420 700,450 C580,480 420,470 320,430
           C220,440 160,370 190,300 C120,260 140,150 220,60 Z"
        fill="url(#co-land)" stroke="#33481e" stroke-width="4"/>
  <path d="M220,60 C380,20 560,30 660,90 C760,120 820,200 800,280
           C840,340 800,420 700,450 C580,480 420,470 320,430
           C220,440 160,370 190,300 C120,260 140,150 220,60 Z"
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- your state, nested and highlighted -->
  <path d="M400,180 C470,160 550,175 585,215 C625,220 640,270 615,300
           C635,335 615,380 570,390 C525,405 460,398 425,375
           C380,380 355,345 365,310 C335,290 345,235 400,180 Z"
        fill="url(#co-state)" stroke="#264e28" stroke-width="3"/>

  <!-- other state / city dots -->
  <circle cx="300" cy="150" r="5" fill="#dfe6ea" opacity="0.6"/>
  <circle cx="650" cy="180" r="5" fill="#dfe6ea" opacity="0.6"/>
  <circle cx="720" cy="330" r="5" fill="#dfe6ea" opacity="0.6"/>
  <circle cx="280" cy="380" r="5" fill="#dfe6ea" opacity="0.6"/>
  <circle cx="500" cy="440" r="4" fill="#dfe6ea" opacity="0.5"/>

  <!-- your city, highlighted -->
  <circle cx="500" cy="280" r="42" fill="url(#co-glow)"/>
  <circle cx="500" cy="280" r="7" fill="#ffd678" stroke="#fff3d0" stroke-width="2"/>

  <g transform="translate(860,60)" opacity="0.5">
    <circle r="26" fill="none" stroke="#dfe6ea" stroke-width="1.5"/>
    <path d="M0,-20 L6,0 L0,20 L-6,0 Z" fill="#dfe6ea"/>
    <text x="0" y="-30" text-anchor="middle" font-size="14" fill="#dfe6ea" font-family="sans-serif">N</text>
  </g>
</svg>
