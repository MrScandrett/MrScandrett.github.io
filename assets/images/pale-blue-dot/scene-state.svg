<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="An abstract map of a state with a highlighted city and surrounding towns">
  <title>Your State</title>
  <defs>
    <linearGradient id="st-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16283a"/>
      <stop offset="100%" stop-color="#0a1622"/>
    </linearGradient>
    <linearGradient id="st-land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a9a5c"/>
      <stop offset="100%" stop-color="#3f6e40"/>
    </linearGradient>
    <radialGradient id="st-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255,214,120,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,214,120,0)"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#st-bg)"/>

  <!-- lat/long reference lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <path d="M0 125 h960 M0 250 h960 M0 375 h960 M240 0 v500 M480 0 v500 M720 0 v500"/>
  </g>

  <!-- state landmass -->
  <path d="M310,90 C420,60 560,80 620,140 C690,150 720,220 690,270
           C730,320 700,390 630,410 C560,440 460,430 400,400
           C320,410 270,360 280,300 C230,270 240,190 310,90 Z"
        fill="url(#st-land)" stroke="#264e28" stroke-width="4"/>
  <path d="M310,90 C420,60 560,80 620,140 C690,150 720,220 690,270
           C730,320 700,390 630,410 C560,440 460,430 400,400
           C320,410 270,360 280,300 C230,270 240,190 310,90 Z"
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- county-ish texture lines -->
  <g stroke="rgba(20,50,20,0.35)" stroke-width="1.5" fill="none">
    <path d="M400,140 C420,220 400,320 420,400"/>
    <path d="M500,120 C520,220 500,320 520,400"/>
  </g>

  <!-- towns -->
  <circle cx="360" cy="200" r="6" fill="#dfe6ea" opacity="0.75"/>
  <circle cx="560" cy="180" r="5" fill="#dfe6ea" opacity="0.7"/>
  <circle cx="440" cy="330" r="5" fill="#dfe6ea" opacity="0.7"/>
  <circle cx="600" cy="320" r="6" fill="#dfe6ea" opacity="0.75"/>
  <circle cx="340" cy="330" r="4" fill="#dfe6ea" opacity="0.6"/>

  <!-- your city, highlighted -->
  <circle cx="480" cy="255" r="46" fill="url(#st-glow)"/>
  <circle cx="480" cy="255" r="9" fill="#ffd678" stroke="#fff3d0" stroke-width="2"/>

  <!-- compass -->
  <g transform="translate(860,60)" opacity="0.55">
    <circle r="26" fill="none" stroke="#dfe6ea" stroke-width="1.5"/>
    <path d="M0,-20 L6,0 L0,20 L-6,0 Z" fill="#dfe6ea"/>
    <text x="0" y="-30" text-anchor="middle" font-size="14" fill="#dfe6ea" font-family="sans-serif">N</text>
  </g>
</svg>
