<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="A dense aerial view of a city grid with tall buildings and streets">
  <title>Your City</title>
  <defs>
    <linearGradient id="ci-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182636"/>
      <stop offset="100%" stop-color="#08111c"/>
    </linearGradient>
    <linearGradient id="ci-bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7290"/>
      <stop offset="100%" stop-color="#334a64"/>
    </linearGradient>
    <linearGradient id="ci-bldg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c8ca0"/>
      <stop offset="100%" stop-color="#4c5c70"/>
    </linearGradient>
    <radialGradient id="ci-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255,214,120,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,214,120,0)"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#ci-bg)"/>

  <!-- street grid -->
  <g stroke="#2c3a4a" stroke-width="16">
    <path d="M0 90 h960 M0 190 h960 M0 290 h960 M0 390 h960"/>
    <path d="M100 0 v500 M280 0 v500 M460 0 v500 M640 0 v500 M820 0 v500"/>
  </g>

  <!-- building blocks, varied sizes with a highlight/shadow edge for depth -->
  <g>
    <!-- row 1 -->
    <g fill="url(#ci-bldg)"><rect x="20" y="10" width="60" height="60" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="120" y="16" width="50" height="54" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="190" y="8" width="70" height="62" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="300" y="14" width="46" height="56" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="360" y="6" width="80" height="64" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="480" y="18" width="52" height="52" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="550" y="10" width="70" height="60" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="660" y="14" width="46" height="56" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="720" y="8" width="80" height="62" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="840" y="16" width="60" height="54" rx="4"/></g>

    <!-- row 2 -->
    <g fill="url(#ci-bldg2)"><rect x="16" y="110" width="66" height="60" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="120" y="118" width="46" height="52" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="188" y="106" width="72" height="64" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="300" y="116" width="50" height="54" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="660" y="112" width="52" height="58" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="722" y="104" width="76" height="66" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="840" y="118" width="58" height="52" rx="4"/></g>

    <!-- row 3 -->
    <g fill="url(#ci-bldg)"><rect x="18" y="210" width="62" height="60" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="120" y="216" width="48" height="54" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="188" y="208" width="70" height="62" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="660" y="214" width="50" height="56" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="722" y="206" width="76" height="64" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="840" y="214" width="58" height="56" rx="4"/></g>

    <!-- row 4 -->
    <g fill="url(#ci-bldg2)"><rect x="18" y="310" width="62" height="60" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="120" y="316" width="48" height="54" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="188" y="308" width="70" height="62" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="300" y="314" width="50" height="56" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="660" y="312" width="52" height="58" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="722" y="304" width="78" height="66" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="840" y="316" width="58" height="54" rx="4"/></g>

    <!-- row 5 -->
    <g fill="url(#ci-bldg)"><rect x="20" y="410" width="60" height="60" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="120" y="418" width="50" height="52" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="190" y="408" width="70" height="62" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="300" y="416" width="46" height="54" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="660" y="414" width="46" height="56" rx="4"/></g>
    <g fill="url(#ci-bldg2)"><rect x="720" y="406" width="80" height="64" rx="4"/></g>
    <g fill="url(#ci-bldg)"><rect x="840" y="416" width="60" height="54" rx="4"/></g>
  </g>

  <!-- highlighted block -->
  <circle cx="480" cy="240" r="56" fill="url(#ci-glow)"/>
  <rect x="446" y="206" width="68" height="68" rx="4" fill="#ffd678"/>
</svg>
