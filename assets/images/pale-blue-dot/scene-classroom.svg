<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="A birds-eye view of a classroom with rows of desks and a chalkboard">
  <title>Your Classroom</title>
  <defs>
    <linearGradient id="c-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c4f68"/>
      <stop offset="100%" stop-color="#212d3e"/>
    </linearGradient>
    <linearGradient id="c-board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5240"/>
      <stop offset="100%" stop-color="#233227"/>
    </linearGradient>
    <linearGradient id="c-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c7148"/>
      <stop offset="100%" stop-color="#7a5534"/>
    </linearGradient>
    <radialGradient id="c-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255,214,120,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,214,120,0)"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#c-floor)"/>
  <g stroke="rgba(255,255,255,0.04)" stroke-width="2">
    <path d="M0 100 h960 M0 200 h960 M0 300 h960 M0 400 h960"/>
  </g>

  <rect x="330" y="30" width="300" height="56" rx="6" fill="url(#c-board)" stroke="#4a3524" stroke-width="6"/>
  <g stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none">
    <path d="M360 55 q40,-14 80,0 t80,0"/>
  </g>

  <!-- desk grid, hand-placed for a tidy composition -->
  <g>
    <g fill="url(#c-desk)">
      <rect x="220" y="150" width="70" height="46" rx="6"/>
      <rect x="320" y="150" width="70" height="46" rx="6"/>
      <rect x="420" y="150" width="70" height="46" rx="6" fill="none"/>
      <rect x="520" y="150" width="70" height="46" rx="6"/>
      <rect x="620" y="150" width="70" height="46" rx="6"/>

      <rect x="220" y="230" width="70" height="46" rx="6"/>
      <rect x="320" y="230" width="70" height="46" rx="6"/>
      <rect x="420" y="230" width="70" height="46" rx="6" fill="none"/>
      <rect x="520" y="230" width="70" height="46" rx="6"/>
      <rect x="620" y="230" width="70" height="46" rx="6"/>

      <rect x="220" y="310" width="70" height="46" rx="6"/>
      <rect x="320" y="310" width="70" height="46" rx="6"/>
      <rect x="420" y="310" width="70" height="46" rx="6" fill="none"/>
      <rect x="520" y="310" width="70" height="46" rx="6"/>
      <rect x="620" y="310" width="70" height="46" rx="6"/>

      <rect x="220" y="390" width="70" height="46" rx="6"/>
      <rect x="320" y="390" width="70" height="46" rx="6"/>
      <rect x="420" y="390" width="70" height="46" rx="6" fill="none"/>
      <rect x="520" y="390" width="70" height="46" rx="6"/>
      <rect x="620" y="390" width="70" height="46" rx="6"/>
    </g>
  </g>

  <!-- highlighted desk (student's own) -->
  <circle cx="455" cy="253" r="60" fill="url(#c-glow)"/>
  <rect x="420" y="230" width="70" height="46" rx="6" fill="#ffd678"/>
  <rect x="420" y="230" width="70" height="46" rx="6" fill="none" stroke="#fff3d0" stroke-width="2"/>
</svg>
