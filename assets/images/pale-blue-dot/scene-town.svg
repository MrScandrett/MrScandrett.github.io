<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="An aerial view of a small town with a park, a river and clustered buildings">
  <title>Your Town</title>
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#233246"/>
      <stop offset="100%" stop-color="#101a28"/>
    </linearGradient>
    <linearGradient id="t-river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a9ad0"/>
      <stop offset="100%" stop-color="#316f9c"/>
    </linearGradient>
    <radialGradient id="t-park" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#5c8a4a"/>
      <stop offset="100%" stop-color="#37602e"/>
    </radialGradient>
    <radialGradient id="t-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255,214,120,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,214,120,0)"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#t-bg)"/>

  <!-- river -->
  <path d="M-20,60 C220,140 260,260 480,260 S780,120 990,220" stroke="url(#t-river)" stroke-width="34" fill="none" stroke-linecap="round"/>
  <path d="M-20,60 C220,140 260,260 480,260 S780,120 990,220" stroke="rgba(255,255,255,0.18)" stroke-width="4" fill="none" stroke-dasharray="2 14"/>

  <!-- park -->
  <ellipse cx="230" cy="330" rx="120" ry="80" fill="url(#t-park)"/>
  <circle cx="190" cy="300" r="10" fill="#2e5230"/>
  <circle cx="260" cy="340" r="12" fill="#2e5230"/>
  <circle cx="220" cy="370" r="8" fill="#2e5230"/>

  <!-- main road -->
  <path d="M40,420 C300,380 420,300 480,260 S700,120 920,60" stroke="#39424a" stroke-width="20" fill="none"/>
  <path d="M40,420 C300,380 420,300 480,260 S700,120 920,60" stroke="#c9b25a" stroke-width="2" stroke-dasharray="12 10" fill="none" opacity="0.6"/>

  <!-- buildings cluster around center + civic square -->
  <g fill="#8a6a48">
    <rect x="560" y="300" width="60" height="46" rx="4"/>
    <rect x="640" y="320" width="50" height="40" rx="4"/>
    <rect x="700" y="290" width="46" height="50" rx="4"/>
    <rect x="600" y="360" width="70" height="42" rx="4"/>
    <rect x="500" y="350" width="46" height="40" rx="4"/>
  </g>
  <g fill="#6e88a6">
    <rect x="700" y="150" width="56" height="60" rx="4"/>
    <rect x="770" y="180" width="46" height="50" rx="4"/>
    <rect x="640" y="180" width="42" height="46" rx="4"/>
  </g>
  <g fill="#a6825e">
    <rect x="120" y="120" width="60" height="44" rx="4"/>
    <rect x="60" y="160" width="46" height="40" rx="4"/>
    <rect x="180" y="150" width="42" height="38" rx="4"/>
  </g>

  <!-- town square, highlighted -->
  <circle cx="480" cy="260" r="52" fill="url(#t-glow)"/>
  <rect x="452" y="234" width="56" height="52" rx="6" fill="#ffd678"/>
  <rect x="452" y="234" width="56" height="52" rx="6" fill="none" stroke="#fff3d0" stroke-width="2"/>
</svg>
