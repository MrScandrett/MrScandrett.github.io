<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="An abstract map of a continent seen from high altitude, with a highlighted country and wisps of cloud">
  <title>Your Continent</title>
  <defs>
    <radialGradient id="ct-ocean" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#2a5a86"/>
      <stop offset="60%" stop-color="#153a5c"/>
      <stop offset="100%" stop-color="#050d18"/>
    </radialGradient>
    <linearGradient id="ct-land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ab06a"/>
      <stop offset="100%" stop-color="#5c7838"/>
    </linearGradient>
    <linearGradient id="ct-country" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8aa25c"/>
      <stop offset="100%" stop-color="#586e34"/>
    </linearGradient>
    <radialGradient id="ct-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(255,214,120,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,214,120,0)"/>
    </radialGradient>
    <radialGradient id="ct-cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <rect width="960" height="500" fill="url(#ct-ocean)"/>

  <!-- faint meridian/parallel grid suggesting curvature -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none">
    <ellipse cx="480" cy="250" rx="440" ry="220"/>
    <ellipse cx="480" cy="250" rx="320" ry="200"/>
    <path d="M40,250 H920 M480,30 V470"/>
  </g>

  <!-- continent landmass -->
  <path d="M180,80 C340,10 560,20 700,90 C820,120 880,220 840,300
           C900,360 860,440 740,470 C600,500 400,490 280,440
           C160,460 100,380 150,310 C60,260 90,150 180,80 Z"
        fill="url(#ct-land)" stroke="#3a5222" stroke-width="4"/>
  <path d="M180,80 C340,10 560,20 700,90 C820,120 880,220 840,300
           C900,360 860,440 740,470 C600,500 400,490 280,440
           C160,460 100,380 150,310 C60,260 90,150 180,80 Z"
        fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- your country, nested and highlighted -->
  <path d="M420,170 C500,140 600,155 645,205 C700,215 715,285 680,320
           C705,365 675,420 610,435 C550,455 470,440 430,405
           C370,410 340,360 355,315 C310,290 330,220 420,170 Z"
        fill="url(#ct-country)" stroke="#33481e" stroke-width="3"/>

  <!-- other country outlines, faint -->
  <path d="M230,140 C270,120 320,130 330,170 C350,190 330,230 290,240 C250,250 210,220 210,180 C200,160 210,150 230,140 Z"
        fill="rgba(120,150,90,0.35)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <path d="M700,340 C740,330 780,350 780,390 C790,420 760,450 720,445 C680,440 660,400 670,370 C665,350 680,345 700,340 Z"
        fill="rgba(120,150,90,0.35)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- your city -->
  <circle cx="530" cy="290" r="40" fill="url(#ct-glow)"/>
  <circle cx="530" cy="290" r="6" fill="#ffd678" stroke="#fff3d0" stroke-width="2"/>

  <!-- cloud wisps drifting over the ocean -->
  <ellipse cx="140" cy="420" rx="90" ry="26" fill="url(#ct-cloud)"/>
  <ellipse cx="840" cy="90" rx="100" ry="30" fill="url(#ct-cloud)"/>
  <ellipse cx="880" cy="420" rx="70" ry="20" fill="url(#ct-cloud)"/>
</svg>
