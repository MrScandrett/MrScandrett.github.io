<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="DM Sans, Helvetica, Arial, sans-serif">
<rect width="1200" height="620" fill="#f7f3ea"/>
<text x="600" y="54" text-anchor="middle" font-size="31" font-weight="700" fill="#1d2433">Where the names point</text>
<text x="600" y="84" text-anchor="middle" font-size="17" fill="#4a5163">A schematic west-to-east strip, not a to-scale map. The names first described peoples and styles, not scales.</text>
<rect x="40" y="120" width="260" height="360" rx="16" fill="#e4dcc9"/>
<text x="170.0" y="156" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="2" fill="#4a5163">GREEK MAINLAND</text>
<text x="62" y="210" font-size="28" font-weight="800" fill="#8d3d1f">Locrian</text>
<text x="62" y="242" font-size="17" font-weight="500" fill="#1d2433">Locris, central Greece</text>
<text x="62" y="292" font-size="28" font-weight="800" fill="#8d3d1f">Dorian</text>
<text x="62" y="324" font-size="17" font-weight="500" fill="#1d2433">Dorians: Sparta, Argos,</text>
<text x="62" y="350" font-size="17" font-weight="500" fill="#1d2433">the Peloponnese, Crete</text>
<rect x="320" y="120" width="250" height="360" rx="16" fill="#cfe0ea"/>
<text x="445" y="156" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="2" fill="#4a5163">AEGEAN SEA</text>
<text x="342" y="210" font-size="28" font-weight="800" fill="#8d3d1f">Aeolian</text>
<text x="342" y="242" font-size="17" font-weight="500" fill="#1d2433">Aeolians: Lesbos</text>
<text x="342" y="268" font-size="17" font-weight="500" fill="#1d2433">(home of Sappho)</text>
<rect x="590" y="120" width="230" height="360" rx="16" fill="#e4dcc9"/>
<text x="705" y="156" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="2" fill="#4a5163">ANATOLIAN COAST</text>
<text x="610" y="210" font-size="28" font-weight="800" fill="#8d3d1f">Ionian</text>
<text x="610" y="242" font-size="17" font-weight="500" fill="#1d2433">Ionia: Miletus, Ephesus,</text>
<text x="610" y="268" font-size="17" font-weight="500" fill="#1d2433">Samos</text>
<text x="610" y="318" font-size="28" font-weight="800" fill="#8d3d1f">Aeolian</text>
<text x="610" y="350" font-size="17" font-weight="500" fill="#1d2433">Aeolis, north of Ionia</text>
<rect x="840" y="120" width="320" height="360" rx="16" fill="#e9d6c6"/>
<text x="1000.0" y="156" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="2" fill="#4a5163">INLAND ANATOLIA</text>
<text x="862" y="210" font-size="28" font-weight="800" fill="#8d3d1f">Lydian</text>
<text x="862" y="242" font-size="17" font-weight="500" fill="#1d2433">Lydia: Sardis (King Croesus)</text>
<text x="862" y="292" font-size="28" font-weight="800" fill="#8d3d1f">Phrygian</text>
<text x="862" y="324" font-size="17" font-weight="500" fill="#1d2433">Phrygia: Gordion</text>
<text x="862" y="350" font-size="17" font-weight="500" fill="#1d2433">(King Midas)</text>
<line x1="60" y1="520" x2="1140" y2="520" stroke="#1d2433" stroke-width="3"/>
<polygon points="1140,512 1158,520 1140,528" fill="#1d2433"/><polygon points="60,512 42,520 60,528" fill="#1d2433"/>
<text x="60" y="552" font-size="16" fill="#4a5163">West</text><text x="1140" y="552" text-anchor="end" font-size="16" fill="#4a5163">East</text>
<text x="600" y="590" text-anchor="middle" font-size="16" fill="#1d2433">Mixo-lydian means "mixed Lydian." Hypo- means "below": Hypodorian, Hypophrygian, Hypolydian are later, system-made names.</text>
</svg>