<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="DM Sans, Helvetica, Arial, sans-serif">
<rect width="1200" height="700" fill="#f7f3ea"/>
<text x="600" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#1d2433">Same names, different octaves</text>
<text x="600" y="92" text-anchor="middle" font-size="18" fill="#4a5163">Each row is one white-key octave. The names on the left and right do not line up.</text>
<text x="300" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#8d3d1f">GREEK OCTAVE SPECIES</text>
<text x="300" y="162" text-anchor="middle" font-size="14" fill="#4a5163">Cleonides, c. 2nd century CE (modern white-key reconstruction)</text>
<text x="900" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#154566">MEDIEVAL → MODERN NAMES</text>
<text x="900" y="162" text-anchor="middle" font-size="14" fill="#4a5163">Church modes, c. 900; Glarean, 1547; modern teaching</text>
<rect x="120" y="180" width="960" height="54" rx="10" fill="#fbf8f1"/>
<text x="470" y="215" text-anchor="end" font-size="24" font-weight="800" fill="#6b3fa0">Mixolydian</text>
<line x1="485" y1="208" x2="545" y2="208" stroke="#9a917f" stroke-width="2"/>
<rect x="550" y="186" width="100" height="42" rx="8" fill="#1d2433"/>
<text x="600" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">B – B</text>
<line x1="655" y1="208" x2="715" y2="208" stroke="#9a917f" stroke-width="2"/>
<text x="730" y="215" font-size="24" font-weight="500" fill="#1d2433">Locrian</text>
<rect x="120" y="244" width="960" height="54" rx="10" fill="#efe8da"/>
<text x="470" y="279" text-anchor="end" font-size="24" font-weight="800" fill="#2f7a45">Lydian</text>
<line x1="485" y1="272" x2="545" y2="272" stroke="#9a917f" stroke-width="2"/>
<rect x="550" y="250" width="100" height="42" rx="8" fill="#1d2433"/>
<text x="600" y="279" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">C – C</text>
<line x1="655" y1="272" x2="715" y2="272" stroke="#9a917f" stroke-width="2"/>
<text x="730" y="279" font-size="24" font-weight="500" fill="#1d2433">Ionian</text>
<rect x="120" y="308" width="960" height="54" rx="10" fill="#fbf8f1"/>
<text x="470" y="343" text-anchor="end" font-size="24" font-weight="800" fill="#b5532d">Phrygian</text>
<line x1="485" y1="336" x2="545" y2="336" stroke="#9a917f" stroke-width="2"/>
<rect x="550" y="314" width="100" height="42" rx="8" fill="#1d2433"/>
<text x="600" y="343" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">D – D</text>
<line x1="655" y1="336" x2="715" y2="336" stroke="#9a917f" stroke-width="2"/>
<text x="730" y="343" font-size="24" font-weight="800" fill="#1f5f8b">Dorian</text>
<rect x="120" y="372" width="960" height="54" rx="10" fill="#efe8da"/>
<text x="470" y="407" text-anchor="end" font-size="24" font-weight="800" fill="#1f5f8b">Dorian</text>
<line x1="485" y1="400" x2="545" y2="400" stroke="#9a917f" stroke-width="2"/>
<rect x="550" y="378" width="100" height="42" rx="8" fill="#1d2433"/>
<text x="600" y="407" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">E – E</text>
<line x1="655" y1="400" x2="715" y2="400" stroke="#9a917f" stroke-width="2"/>
<text x="730" y="407" font-size="24" font-weight="800" fill="#b5532d">Phrygian</text>
<rect x="120" y="436" width="960" height="54" rx="10" fill="#fbf8f1"/>
<text x="470" y="471" text-anchor="end" font-size="24" font-weight="500" fill="#1d2433">Hypolydian</text>
<line x1="485" y1="464" x2="545" y2="464" stroke="#9a917f" stroke-width="2"/>
<rect x="550" y="442" width="100" height="42" rx="8" fill="#1d2433"/>
<text x="600" y="471" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">F – F</text>
<line x1="655" y1="464" x2="715" y2="464" stroke="#9a917f" stroke-width="2"/>
<text x="730" y="471" font-size="24" font-weight="800" fill="#2f7a45">Lydian</text>
<rect x="120" y="500" width="960" height="54" rx="10" fill="#efe8da"/>
<text x="470" y="535" text-anchor="end" font-size="24" font-weight="500" fill="#1d2433">Hypophrygian</text>
<line x1="485" y1="528" x2="545" y2="528" stroke="#9a917f" stroke-width="2"/>
<rect x="550" y="506" width="100" height="42" rx="8" fill="#1d2433"/>
<text x="600" y="535" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">G – G</text>
<line x1="655" y1="528" x2="715" y2="528" stroke="#9a917f" stroke-width="2"/>
<text x="730" y="535" font-size="24" font-weight="800" fill="#6b3fa0">Mixolydian</text>
<rect x="120" y="564" width="960" height="54" rx="10" fill="#fbf8f1"/>
<text x="470" y="599" text-anchor="end" font-size="24" font-weight="500" fill="#1d2433">Hypodorian</text>
<line x1="485" y1="592" x2="545" y2="592" stroke="#9a917f" stroke-width="2"/>
<rect x="550" y="570" width="100" height="42" rx="8" fill="#1d2433"/>
<text x="600" y="599" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">A – A</text>
<line x1="655" y1="592" x2="715" y2="592" stroke="#9a917f" stroke-width="2"/>
<text x="730" y="599" font-size="24" font-weight="500" fill="#1d2433">Aeolian</text>
<text x="600" y="672" text-anchor="middle" font-size="17" fill="#1d2433">Dorian moves from E down to D. Phrygian moves from D up to E. Lydian moves from C up to F. Mixolydian moves from B up to G.</text>
</svg>