<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="400" height="225" fill="#ffffff"/>
  <!-- 15% -->
  <g>
    <rect x="30" y="40" width="90" height="90" fill="none" stroke="#3b6fd6" stroke-width="5"/>
    <g stroke="#3b6fd6" stroke-width="2" opacity="0.55">
      <line x1="30" y1="70" x2="120" y2="70"/>
      <line x1="30" y1="100" x2="120" y2="100"/>
    </g>
    <text x="75" y="150" font-size="13" font-weight="700" fill="#8a2900" text-anchor="middle">15%</text>
    <text x="75" y="167" font-size="11" fill="#3a2a1a" text-anchor="middle">Decorative</text>
  </g>
  <!-- 50% grid -->
  <g>
    <rect x="155" y="40" width="90" height="90" fill="none" stroke="#3b6fd6" stroke-width="5"/>
    <g stroke="#3b6fd6" stroke-width="2.5" opacity="0.7">
      <line x1="155" y1="55" x2="245" y2="55"/>
      <line x1="155" y1="70" x2="245" y2="70"/>
      <line x1="155" y1="85" x2="245" y2="85"/>
      <line x1="155" y1="100" x2="245" y2="100"/>
      <line x1="155" y1="115" x2="245" y2="115"/>
      <line x1="170" y1="40" x2="170" y2="130"/>
      <line x1="185" y1="40" x2="185" y2="130"/>
      <line x1="200" y1="40" x2="200" y2="130"/>
      <line x1="215" y1="40" x2="215" y2="130"/>
      <line x1="230" y1="40" x2="230" y2="130"/>
    </g>
    <text x="200" y="150" font-size="13" font-weight="700" fill="#8a2900" text-anchor="middle">50% grid</text>
    <text x="200" y="167" font-size="11" fill="#3a2a1a" text-anchor="middle">Functional</text>
  </g>
  <!-- 100% -->
  <g>
    <rect x="280" y="40" width="90" height="90" fill="#3b6fd6" opacity="0.75"/>
    <text x="325" y="150" font-size="13" font-weight="700" fill="#8a2900" text-anchor="middle">100%</text>
    <text x="325" y="167" font-size="11" fill="#3a2a1a" text-anchor="middle">Max strength</text>
  </g>
  <text x="200" y="200" font-size="12" fill="#a8968a" text-anchor="middle">More infill = more strength, more time, more filament</text>
</svg>
