<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="400" height="225" fill="#ffffff"/>
  <!-- filament spool feeding into hotend -->
  <rect x="60" y="20" width="14" height="70" fill="#8a8f98"/>
  <line x1="67" y1="20" x2="67" y2="0" stroke="#3b6fd6" stroke-width="6"/>
  <text x="30" y="15" font-size="11" fill="#3a2a1a">Solid filament</text>

  <!-- heater block -->
  <rect x="150" y="60" width="100" height="50" rx="6" fill="#ff6b35"/>
  <text x="200" y="90" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">210°C</text>
  <path d="M63,25 C63,60 150,80 150,85" fill="none" stroke="#3b6fd6" stroke-width="6"/>

  <!-- melted droplet from nozzle -->
  <polygon points="185,110 215,110 200,140" fill="#ffb020"/>
  <path d="M195,140 C190,150 205,155 200,165" fill="none" stroke="#ffb020" stroke-width="3" stroke-linecap="round"/>

  <!-- thermometer scale -->
  <g transform="translate(300,30)">
    <rect x="0" y="0" width="14" height="120" rx="7" fill="#ffe3d1" stroke="#ff6b35" stroke-width="2"/>
    <rect x="0" y="60" width="14" height="60" rx="7" fill="#c43d00"/>
    <circle cx="7" cy="128" r="12" fill="#c43d00"/>
    <text x="25" y="20" font-size="11" fill="#3a2a1a">ABS 250°C</text>
    <text x="25" y="70" font-size="11" fill="#3a2a1a">PLA 210°C</text>
    <text x="25" y="118" font-size="11" fill="#3a2a1a">Cold 20°C</text>
  </g>
  <text x="140" y="200" font-size="12" fill="#a8968a" text-anchor="middle">Nozzle melts filament right before it's deposited</text>
</svg>
