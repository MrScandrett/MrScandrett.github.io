<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="400" height="225" fill="#ffffff"/>
  <!-- 2 walls -->
  <g>
    <rect x="35" y="35" width="110" height="110" fill="none" stroke="#3b6fd6" stroke-width="4"/>
    <rect x="43" y="43" width="94" height="94" fill="none" stroke="#5a8ae0" stroke-width="4"/>
    <g stroke="#3b6fd6" stroke-width="1.5" opacity="0.3">
      <line x1="55" y1="55" x2="125" y2="125"/><line x1="125" y1="55" x2="55" y2="125"/>
    </g>
    <text x="90" y="168" font-size="13" font-weight="700" fill="#8a2900" text-anchor="middle">2 walls</text>
    <text x="90" y="185" font-size="11" fill="#3a2a1a" text-anchor="middle">0.8 mm shell</text>
  </g>
  <!-- 5 walls -->
  <g>
    <rect x="220" y="35" width="130" height="130" fill="none" stroke="#3b6fd6" stroke-width="4"/>
    <rect x="228" y="43" width="114" height="114" fill="none" stroke="#4a7bd8" stroke-width="4"/>
    <rect x="236" y="51" width="98" height="98" fill="none" stroke="#5a8ae0" stroke-width="4"/>
    <rect x="244" y="59" width="82" height="82" fill="none" stroke="#6a9af0" stroke-width="4"/>
    <rect x="252" y="67" width="66" height="66" fill="none" stroke="#7aaaff" stroke-width="4"/>
    <g stroke="#3b6fd6" stroke-width="1.5" opacity="0.25">
      <line x1="260" y1="75" x2="310" y2="125"/><line x1="310" y1="75" x2="260" y2="125"/>
    </g>
    <text x="285" y="188" font-size="13" font-weight="700" fill="#8a2900" text-anchor="middle">5 walls</text>
    <text x="285" y="205" font-size="11" fill="#3a2a1a" text-anchor="middle">2.0 mm shell — much stronger</text>
  </g>
</svg>
