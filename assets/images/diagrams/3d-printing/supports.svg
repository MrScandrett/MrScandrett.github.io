<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="400" height="225" fill="#ffffff"/>
  <line x1="20" y1="190" x2="380" y2="190" stroke="#ff6b35" stroke-width="4"/>

  <!-- normal supports: vertical lattice under overhang -->
  <g>
    <path d="M40,60 L140,60 L140,100 L100,130 L40,130 Z" fill="#3b6fd6" opacity="0.85"/>
    <g stroke="#00b8e6" stroke-width="2" opacity="0.6">
      <line x1="55" y1="130" x2="55" y2="190"/>
      <line x1="70" y1="130" x2="70" y2="190"/>
      <line x1="85" y1="130" x2="85" y2="190"/>
    </g>
    <text x="90" y="210" font-size="12" font-weight="700" fill="#8a2900" text-anchor="middle">Normal supports</text>
  </g>

  <!-- tree supports: branching -->
  <g>
    <path d="M240,60 L340,60 L340,100 L300,130 L240,130 Z" fill="#3b6fd6" opacity="0.85"/>
    <path d="M290,190 C290,160 265,150 265,130" fill="none" stroke="#00b8e6" stroke-width="3"/>
    <path d="M290,190 C290,165 310,152 305,130" fill="none" stroke="#00b8e6" stroke-width="3"/>
    <path d="M290,190 C290,175 290,160 288,130" fill="none" stroke="#00b8e6" stroke-width="3"/>
    <text x="290" y="210" font-size="12" font-weight="700" fill="#8a2900" text-anchor="middle">Tree supports</text>
  </g>

  <text x="200" y="35" font-size="12" fill="#a8968a" text-anchor="middle">Overhang beyond ~45° needs support underneath it</text>
</svg>
