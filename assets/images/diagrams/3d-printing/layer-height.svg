<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="400" height="225" fill="#ffffff"/>
  <!-- fine layers stack -->
  <g>
    <text x="80" y="30" font-size="14" font-weight="700" fill="#8a2900" text-anchor="middle">Fine (0.10 mm)</text>
    <g>
      <rect x="35" y="45" width="90" height="6" fill="#3b6fd6"/>
      <rect x="35" y="52" width="90" height="6" fill="#5a8ae0"/>
      <rect x="35" y="59" width="90" height="6" fill="#3b6fd6"/>
      <rect x="35" y="66" width="90" height="6" fill="#5a8ae0"/>
      <rect x="35" y="73" width="90" height="6" fill="#3b6fd6"/>
      <rect x="35" y="80" width="90" height="6" fill="#5a8ae0"/>
      <rect x="35" y="87" width="90" height="6" fill="#3b6fd6"/>
      <rect x="35" y="94" width="90" height="6" fill="#5a8ae0"/>
      <rect x="35" y="101" width="90" height="6" fill="#3b6fd6"/>
      <rect x="35" y="108" width="90" height="6" fill="#5a8ae0"/>
      <rect x="35" y="115" width="90" height="6" fill="#3b6fd6"/>
      <rect x="35" y="122" width="90" height="6" fill="#5a8ae0"/>
    </g>
    <text x="80" y="150" font-size="12" fill="#3a2a1a" text-anchor="middle">Smooth surface</text>
    <text x="80" y="167" font-size="12" fill="#3a2a1a" text-anchor="middle">Slower print</text>
  </g>
  <!-- coarse layers stack -->
  <g>
    <text x="300" y="30" font-size="14" font-weight="700" fill="#8a2900" text-anchor="middle">Draft (0.30 mm)</text>
    <rect x="255" y="45" width="90" height="21" fill="#3b6fd6"/>
    <rect x="255" y="66" width="90" height="21" fill="#5a8ae0"/>
    <rect x="255" y="87" width="90" height="21" fill="#3b6fd6"/>
    <rect x="255" y="108" width="90" height="21" fill="#5a8ae0"/>
    <text x="300" y="150" font-size="12" fill="#3a2a1a" text-anchor="middle">Visible ridges</text>
    <text x="300" y="167" font-size="12" fill="#3a2a1a" text-anchor="middle">Faster print</text>
  </g>
  <!-- height arrow annotation -->
  <line x1="140" y1="45" x2="140" y2="52" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="150" y="52" font-size="11" fill="#c43d00">1 layer</text>
  <line x1="200" y1="150" x2="200" y2="80" stroke="#ffb020" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="200" y="200" font-size="12" fill="#a8968a" text-anchor="middle">Same 60 mm object, fewer vs more slices</text>
</svg>
