<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="400" height="225" fill="#ffffff"/>
  <!-- skirt -->
  <g>
    <line x1="20" y1="150" x2="110" y2="150" stroke="#ff6b35" stroke-width="4"/>
    <rect x="45" y="115" width="30" height="35" fill="#3b6fd6"/>
    <rect x="30" y="145" width="60" height="5" fill="none" stroke="#00b8e6" stroke-width="2" stroke-dasharray="2 2"/>
    <text x="65" y="175" font-size="11" font-weight="700" fill="#8a2900" text-anchor="middle">Skirt</text>
    <text x="65" y="190" font-size="9.5" fill="#3a2a1a" text-anchor="middle">primes nozzle only</text>
  </g>
  <!-- brim -->
  <g>
    <line x1="140" y1="150" x2="250" y2="150" stroke="#ff6b35" stroke-width="4"/>
    <rect x="175" y="115" width="30" height="35" fill="#3b6fd6"/>
    <rect x="160" y="146" width="60" height="4" fill="#5a8ae0"/>
    <text x="190" y="175" font-size="11" font-weight="700" fill="#8a2900" text-anchor="middle">Brim</text>
    <text x="190" y="190" font-size="9.5" fill="#3a2a1a" text-anchor="middle">wider first-layer edge</text>
  </g>
  <!-- raft -->
  <g>
    <line x1="280" y1="150" x2="380" y2="150" stroke="#ff6b35" stroke-width="4"/>
    <rect x="300" y="140" width="60" height="10" fill="#5a8ae0"/>
    <rect x="315" y="105" width="30" height="35" fill="#3b6fd6"/>
    <text x="330" y="175" font-size="11" font-weight="700" fill="#8a2900" text-anchor="middle">Raft</text>
    <text x="330" y="190" font-size="9.5" fill="#3a2a1a" text-anchor="middle">full base platform</text>
  </g>
</svg>
