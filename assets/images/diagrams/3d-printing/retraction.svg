<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="400" height="225" fill="#ffffff"/>
  <!-- before retraction -->
  <g>
    <text x="100" y="30" font-size="13" font-weight="700" fill="#8a2900" text-anchor="middle">Printing</text>
    <rect x="70" y="45" width="16" height="60" fill="#8a8f98"/>
    <rect x="62" y="105" width="32" height="20" fill="#c9ccd2"/>
    <polygon points="70,125 94,125 82,145" fill="#ffb020"/>
    <line x1="78" y1="45" x2="78" y2="108" stroke="#3b6fd6" stroke-width="8"/>
    <text x="100" y="170" font-size="10.5" fill="#3a2a1a" text-anchor="middle">Filament fills the nozzle,</text>
    <text x="100" y="187" font-size="10.5" fill="#3a2a1a" text-anchor="middle">pressure stays high</text>
  </g>
  <!-- after retraction -->
  <g>
    <text x="300" y="30" font-size="13" font-weight="700" fill="#8a2900" text-anchor="middle">Retracted for travel</text>
    <rect x="270" y="45" width="16" height="60" fill="#8a8f98"/>
    <rect x="262" y="105" width="32" height="20" fill="#c9ccd2"/>
    <polygon points="270,125 294,125 282,145" fill="#ffb020"/>
    <line x1="278" y1="45" x2="278" y2="80" stroke="#3b6fd6" stroke-width="8"/>
    <line x1="278" y1="82" x2="290" y2="30" stroke="#c43d00" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="300" y="60" font-size="10" fill="#c43d00" text-anchor="start">pulled back 5 mm</text>
    <text x="300" y="170" font-size="10.5" fill="#3a2a1a" text-anchor="middle">Nozzle pulls filament back</text>
    <text x="300" y="187" font-size="10.5" fill="#3a2a1a" text-anchor="middle">before moving — no ooze</text>
  </g>
</svg>
