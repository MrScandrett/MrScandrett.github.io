<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="400" height="225" fill="#ffffff"/>
  <!-- heated bed, warm, flat part -->
  <g>
    <rect x="30" y="140" width="140" height="14" rx="3" fill="#ff6b35"/>
    <text x="100" y="132" font-size="12" font-weight="700" fill="#8a2900" text-anchor="middle">60°C bed</text>
    <rect x="55" y="105" width="90" height="35" fill="#3b6fd6"/>
    <path d="M35,168 c8,-4 8,4 16,0 c8,-4 8,4 16,0 c8,-4 8,4 16,0 c8,-4 8,4 16,0 c8,-4 8,4 16,0 c8,-4 8,4 16,0" fill="none" stroke="#ffb020" stroke-width="2" opacity="0.7"/>
    <text x="100" y="195" font-size="10.5" fill="#3a2a1a" text-anchor="middle">Layer cools slowly, stays flat</text>
  </g>
  <!-- unheated bed, corner lifting -->
  <g>
    <rect x="230" y="150" width="140" height="14" rx="3" fill="#9aa0aa"/>
    <text x="300" y="142" font-size="12" font-weight="700" fill="#c43d00" text-anchor="middle">Cold bed</text>
    <path d="M255,150 L255,120 L325,105 L325,140 C300,150 270,158 245,150 Z" fill="#3b6fd6"/>
    <text x="300" y="185" font-size="10.5" fill="#3a2a1a" text-anchor="middle">Corners contract and</text>
    <text x="300" y="202" font-size="10.5" fill="#3a2a1a" text-anchor="middle">peel up as it cools fast</text>
  </g>
</svg>
