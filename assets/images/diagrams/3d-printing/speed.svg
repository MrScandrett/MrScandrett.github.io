<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="400" height="225" fill="#ffffff"/>
  <!-- slow, clean line -->
  <text x="120" y="30" font-size="14" font-weight="700" fill="#8a2900" text-anchor="middle">40 mm/s</text>
  <line x1="40" y1="70" x2="200" y2="70" stroke="#3b6fd6" stroke-width="8" stroke-linecap="round"/>
  <g transform="translate(200,70)">
    <rect x="-14" y="-10" width="28" height="20" rx="4" fill="#8a8f98"/>
    <polygon points="-6,10 6,10 0,20" fill="#ffb020"/>
  </g>
  <text x="120" y="105" font-size="11" fill="#3a2a1a" text-anchor="middle">Clean, accurate wall</text>

  <!-- fast, wobbly line -->
  <text x="300" y="130" font-size="14" font-weight="700" fill="#c43d00" text-anchor="middle">200 mm/s</text>
  <path d="M240,170 C260,160 270,182 290,170 C310,158 320,182 340,170 C355,162 358,178 360,170"
        fill="none" stroke="#3b6fd6" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <g transform="translate(360,170)">
    <rect x="-14" y="-10" width="28" height="20" rx="4" fill="#8a8f98"/>
    <polygon points="-6,10 6,10 0,20" fill="#ffb020"/>
  </g>
  <path d="M370,150 l14,0 M370,157 l10,0 M370,164 l14,0" stroke="#9aa0aa" stroke-width="2"/>
  <text x="300" y="205" font-size="11" fill="#3a2a1a" text-anchor="middle">Ringing / ghosting artefacts</text>
</svg>
