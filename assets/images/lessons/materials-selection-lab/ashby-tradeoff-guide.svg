<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="atg-title">
  <title id="atg-title">Ashby Tradeoff Regions for Material Selection</title>
  <rect width="880" height="340" rx="16" fill="#f8fafc"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">How Engineers Read an Ashby Tradeoff Chart</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#475569">Plot competing properties on two axes — then draw a diagonal "best-performance frontier" to eliminate weak options.</text>

  <g transform="translate(86 80)">
    <rect x="0" y="0" width="750" height="212" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Grid -->
    <line x1="150" y1="0" x2="150" y2="212" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="300" y1="0" x2="300" y2="212" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="450" y1="0" x2="450" y2="212" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="600" y1="0" x2="600" y2="212" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="0" y1="53" x2="750" y2="53" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="0" y1="106" x2="750" y2="106" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="0" y1="159" x2="750" y2="159" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Frontier highlight -->
    <polygon points="0,125 0,0 440,0" fill="#10b981" fill-opacity="0.12"/>
    <line x1="0" y1="125" x2="440" y2="0" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="28" y="34" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#065f46">SWEET SPOT: LIGHTWEIGHT &amp; STRONG</text>

    <!-- Regions -->
    <ellipse cx="185" cy="48" rx="74" ry="26" fill="#0284c7" fill-opacity="0.22" stroke="#0284c7" stroke-width="2"/>
    <text x="185" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#0369a1">CFRP Composites</text>

    <ellipse cx="265" cy="116" rx="82" ry="30" fill="#f59e0b" fill-opacity="0.22" stroke="#d97706" stroke-width="2"/>
    <text x="265" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#92400e">Wood / Plywood</text>

    <ellipse cx="470" cy="84" rx="95" ry="34" fill="#6366f1" fill-opacity="0.2" stroke="#4f46e5" stroke-width="2"/>
    <text x="470" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#3730a3">Aluminum / Titanium</text>

    <ellipse cx="640" cy="64" rx="72" ry="28" fill="#475569" fill-opacity="0.2" stroke="#334155" stroke-width="2"/>
    <text x="640" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#1e293b">Steels</text>

    <ellipse cx="148" cy="166" rx="88" ry="26" fill="#ec4899" fill-opacity="0.18" stroke="#db2777" stroke-width="2"/>
    <text x="148" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#9d174d">Polymers / ABS</text>
  </g>

  <text x="460" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" font-weight="800" fill="#334155">Density ρ (g/cm³) — Lighter to the Left →</text>
  <text x="-186" y="34" transform="rotate(-90)" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" font-weight="800" fill="#334155">Strength / Stiffness (↑ Better)</text>
</svg>
