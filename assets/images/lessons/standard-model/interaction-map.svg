<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440"><rect width="1100" height="440" rx="18" fill="#101e30"/><style>text{font-family:system-ui,sans-serif;fill:#e7eef8}.title{font-size:24px;font-weight:700}.label{font-size:19px}.small{font-size:16px;fill:#c0cfdf}.symbol{font-size:32px;font-weight:700}</style><text x="40" y="48" class="title">Which particles participate?</text><text x="40" y="80" class="small">Read across a row. Carriers connect particles with the corresponding interaction charge.</text><text x="350" y="128" class="label">Electromagnetic</text><text x="350" y="158" class="small">photon · γ</text><text x="610" y="128" class="label">Strong</text><text x="610" y="158" class="small">gluons · g</text><text x="860" y="128" class="label">Weak</text><text x="860" y="158" class="small">W⁺ / W⁻ / Z</text><text x="40" y="227" class="label">Quarks</text><rect x="354" y="196" width="132" height="48" rx="24" fill="#a2e3d0"/><text x="420" y="227" text-anchor="middle" class="label" style="fill:#101e30">Yes</text><rect x="594" y="196" width="132" height="48" rx="24" fill="#a2e3d0"/><text x="660" y="227" text-anchor="middle" class="label" style="fill:#101e30">Yes</text><rect x="854" y="196" width="132" height="48" rx="24" fill="#a2e3d0"/><text x="920" y="227" text-anchor="middle" class="label" style="fill:#101e30">Yes</text><text x="40" y="297" class="label">Charged leptons</text><rect x="354" y="266" width="132" height="48" rx="24" fill="#a2e3d0"/><text x="420" y="297" text-anchor="middle" class="label" style="fill:#101e30">Yes</text><rect x="594" y="266" width="132" height="48" rx="24" fill="#23364d"/><text x="660" y="297" text-anchor="middle" class="label" style="fill:#c0cfdf">No</text><rect x="854" y="266" width="132" height="48" rx="24" fill="#a2e3d0"/><text x="920" y="297" text-anchor="middle" class="label" style="fill:#101e30">Yes</text><text x="40" y="367" class="label">Neutrinos</text><rect x="354" y="336" width="132" height="48" rx="24" fill="#23364d"/><text x="420" y="367" text-anchor="middle" class="label" style="fill:#c0cfdf">No</text><rect x="594" y="336" width="132" height="48" rx="24" fill="#23364d"/><text x="660" y="367" text-anchor="middle" class="label" style="fill:#c0cfdf">No</text><rect x="854" y="336" width="132" height="48" rx="24" fill="#a2e3d0"/><text x="920" y="367" text-anchor="middle" class="label" style="fill:#101e30">Yes</text><text x="40" y="418" class="small">Gravity lies outside this chart. The Higgs is a scalar boson, not one of these force carriers.</text></svg>