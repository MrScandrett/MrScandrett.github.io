<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440"><rect width="1100" height="440" rx="18" fill="#101e30"/><style>text{font-family:system-ui,sans-serif;fill:#e7eef8}.title{font-size:24px;font-weight:700}.label{font-size:19px}.small{font-size:16px;fill:#c0cfdf}.symbol{font-size:32px;font-weight:700}</style><text x="40" y="48" class="title">Beta decay: one quark changes, total charge stays the same</text><text x="70" y="112" class="label">Neutron · charge 0</text><text x="570" y="112" class="label">Proton · charge +1</text><g fill="#193650" stroke="#7893b3" stroke-width="2"><circle cx="180" cy="220" r="90"/><circle cx="680" cy="220" r="90"/></g><g class="symbol" text-anchor="middle"><text x="145" y="203">u</text><text x="215" y="203">d</text><text x="180" y="271" fill="#f7d08a">d</text><text x="645" y="203">u</text><text x="715" y="203">d</text><text x="680" y="271">u</text></g><path d="M290 220H560" stroke="#f7d08a" stroke-width="4"/><path d="m545 209 15 11-15 11" fill="none" stroke="#f7d08a" stroke-width="3"/><text x="333" y="186" class="label">Weak interaction</text><text x="322" y="255" class="small">d → u + virtual W⁻</text><text x="803" y="210" class="symbol">+ e⁻ + ν̅ₑ</text><text x="812" y="253" class="small">electron + antineutrino</text><text x="90" y="357" class="title">0 = (+1) + (−1) + 0</text><text x="90" y="393" class="small">The virtual W⁻ connects the quark transition to the two leptons; it is not emitted as a free particle.</text></svg>