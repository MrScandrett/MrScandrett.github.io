<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-label="Diagram comparing a Pivot stick figure's 12-segment rig on the left with its parent-child forward kinematics tree and trig equations on the right.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1100" height="540" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Left Card: The Stick Figure Rig & Handles -->
  <rect x="28" y="28" width="490" height="484" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f172a">1. Stage Rig: Origin, Bones &amp; Handles</text>
  <text x="52" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Orange = Root Position (x, y) · Red = Joint Rotation Angle (θ)</text>

  <!-- Ground line -->
  <line x1="56" y1="440" x2="490" y2="440" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Onion Skin Ghost Figure (previous frame) -->
  <g opacity="0.24" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" fill="none">
    <line x1="215" y1="286" x2="225" y2="222"/>
    <line x1="225" y1="222" x2="232" y2="188"/>
    <circle cx="236" cy="166" r="18" fill="#3b82f6"/>
    <line x1="225" y1="222" x2="188" y2="256"/>
    <line x1="188" y1="256" x2="164" y2="232"/>
    <line x1="215" y1="286" x2="185" y2="358"/>
    <line x1="185" y1="358" x2="165" y2="432"/>
    <line x1="215" y1="286" x2="255" y2="354"/>
    <line x1="255" y1="354" x2="245" y2="432"/>
  </g>
  <text x="86" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563eb">Onion Skin (Frame n−1)</text>

  <!-- Active Stick Figure -->
  <g stroke="#0f172a" stroke-width="13" stroke-linecap="round" fill="none">
    <!-- Seg 0 & 1: Spine -->
    <line x1="270" y1="280" x2="278" y2="244"/>
    <line x1="278" y1="244" x2="286" y2="208"/>
    <!-- Seg 2 & 3: Neck & Head -->
    <line x1="286" y1="208" x2="292" y2="174"/>
    <circle cx="294" cy="162" r="19" fill="#0f172a" stroke="#0f172a" stroke-width="6"/>
    <!-- Seg 4 & 6: Back Arm -->
    <line x1="286" y1="208" x2="242" y2="246"/>
    <line x1="242" y1="246" x2="212" y2="220"/>
    <!-- Seg 5 & 7: Front Arm (highlighted in blue) -->
    <line x1="286" y1="208" x2="342" y2="224" stroke="#2563eb"/>
    <line x1="342" y1="224" x2="388" y2="188" stroke="#3b82f6"/>
    <!-- Seg 8 & 10: Back Leg -->
    <line x1="270" y1="280" x2="236" y2="356"/>
    <line x1="236" y1="356" x2="212" y2="432"/>
    <!-- Seg 9 & 11: Front Leg -->
    <line x1="270" y1="280" x2="322" y2="348"/>
    <line x1="322" y1="348" x2="338" y2="432"/>
  </g>

  <!-- Center of Mass Plumb Line -->
  <line x1="282" y1="262" x2="282" y2="440" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="282" cy="262" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <text x="294" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#059669">Center of Mass Plumb</text>

  <!-- Red Joint Handles -->
  <g fill="#ef4444" stroke="#0f172a" stroke-width="1.8">
    <circle cx="278" cy="244" r="5"/>
    <circle cx="286" cy="208" r="5"/>
    <circle cx="296" cy="142" r="5.5"/>
    <circle cx="242" cy="246" r="5"/>
    <circle cx="212" cy="220" r="5"/>
    <circle cx="342" cy="224" r="6" fill="#facc15"/>
    <circle cx="388" cy="188" r="6" fill="#facc15"/>
    <circle cx="236" cy="356" r="5"/>
    <circle cx="212" cy="432" r="5"/>
    <circle cx="322" cy="348" r="5"/>
    <circle cx="338" cy="432" r="5"/>
  </g>

  <!-- Orange Origin Handle -->
  <circle cx="270" cy="280" r="8" fill="#f97316" stroke="#ffffff" stroke-width="2.2"/>
  <text x="128" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#ea580c">Origin (x, y) →</text>

  <!-- Angle annotation on Front Arm -->
  <text x="352" y="242" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#1d4ed8">Seg 5 (Upper Arm)</text>
  <text x="372" y="176" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#1d4ed8">Seg 7 (Forearm)</text>

  <!-- Right Card: Parent-Child Hierarchy & Forward Kinematics -->
  <rect x="542" y="28" width="530" height="484" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="568" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f172a">2. Parent–Child Tree &amp; Forward Kinematics</text>
  <text x="568" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Rotating a parent joint automatically carries every child segment along</text>

  <!-- Tree Diagram Nodes -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">
    <!-- Root Origin -->
    <rect x="735" y="112" width="146" height="34" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="808" y="134" text-anchor="middle" fill="#c2410c">0: Hip Origin (x, y)</text>

    <!-- Arrows from Root -->
    <line x1="775" y1="146" x2="670" y2="182" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <line x1="840" y1="146" x2="930" y2="182" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Lower Spine & Thighs -->
    <rect x="580" y="186" width="175" height="34" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="667" y="208" text-anchor="middle" fill="#1e40af">Seg 0 → Seg 1 (Spine)</text>

    <rect x="845" y="186" width="175" height="34" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
    <text x="932" y="208" text-anchor="middle" fill="#334155">Seg 8, 9 (L/R Thighs)</text>

    <!-- Arrows from Spine & Thighs -->
    <line x1="630" y1="220" x2="610" y2="258" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <line x1="705" y1="220" x2="755" y2="258" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <line x1="932" y1="220" x2="932" y2="258" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Neck/Head, Upper Arms, Shins -->
    <rect x="556" y="262" width="118" height="34" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
    <text x="615" y="284" text-anchor="middle" fill="#334155">Seg 2, 3 (Head)</text>

    <rect x="690" y="262" width="144" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="762" y="284" text-anchor="middle" fill="#1e3a8a">Seg 4, 5 (Upper Arm)</text>

    <rect x="858" y="262" width="150" height="34" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
    <text x="933" y="284" text-anchor="middle" fill="#334155">Seg 10, 11 (Shins)</text>

    <!-- Arrow to Forearms -->
    <line x1="762" y1="296" x2="762" y2="334" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <rect x="686" y="338" width="152" height="34" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <text x="762" y="360" text-anchor="middle" fill="#854d0e">Seg 6, 7 (Forearm)</text>
  </g>

  <!-- Equations Box -->
  <rect x="568" y="394" width="478" height="96" rx="10" fill="#0f172a"/>
  <text x="588" y="422" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" font-weight="700" fill="#93c5fd">// Forward Kinematics Step (walk parent → child):</text>
  <text x="588" y="448" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" fill="#f8fafc">endX[s] = startX[s] + length[s] * scale * Math.cos(angle[s]);</text>
  <text x="588" y="472" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13.5" fill="#f8fafc">endY[s] = startY[s] + length[s] * scale * Math.sin(angle[s]);</text>
</svg>
