<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Penetrating power: alpha stopped by paper, beta stopped by aluminum, gamma reduced but not stopped by lead">
<rect width="900" height="380" fill="#0a1421"/>
<g font-family="Inter,Arial,sans-serif" fill="#dceaf8">
<text x="450" y="34" font-size="22" font-weight="800" text-anchor="middle">Penetrating power: what stops each radiation?</text>
<rect x="300" y="70" width="14" height="270" fill="#e8e2c8"/><text x="307" y="360" font-size="14" text-anchor="middle">Paper</text>
<rect x="500" y="70" width="34" height="270" fill="#9fb0c4"/><text x="517" y="360" font-size="14" text-anchor="middle">Aluminum (few mm)</text>
<rect x="700" y="70" width="70" height="270" fill="#5b6470"/><text x="735" y="360" font-size="14" text-anchor="middle">Lead / thick concrete</text>
<g stroke-width="5" fill="none" stroke-linecap="round">
<path d="M70 120H296" stroke="#ff7a94"/><circle cx="60" cy="120" r="10" fill="#ff7a94" stroke="none"/><text x="70" y="98" font-size="16" font-weight="800" fill="#ff7a94">α — stopped by paper or skin</text>
<path d="M70 200H496" stroke="#38bdf8"/><circle cx="60" cy="200" r="7" fill="#38bdf8" stroke="none"/><text x="70" y="178" font-size="16" font-weight="800" fill="#38bdf8">β — stopped by aluminum</text>
<path d="M70 280H700" stroke="#f6c35b" stroke-dasharray="1 0"/><path d="M700 280H860" stroke="#f6c35b" stroke-opacity=".35"/><text x="70" y="258" font-size="16" font-weight="800" fill="#f6c35b">γ — passes through both; lead only weakens it</text>
</g></g></svg>
