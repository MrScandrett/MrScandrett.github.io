<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Anatomy of a Petroleum System: Source Rock, Migration, Reservoir, Seal, and Anticlinal Trap">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="sandstone" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#92400e" fill-opacity="0.32"/>
      <circle cx="5" cy="5" r="1.4" fill="#fde68a" fill-opacity="0.55"/>
      <circle cx="15" cy="15" r="1.4" fill="#fde68a" fill-opacity="0.55"/>
      <circle cx="15" cy="5" r="1.1" fill="#fde68a" fill-opacity="0.38"/>
      <circle cx="5" cy="15" r="1.1" fill="#fde68a" fill-opacity="0.38"/>
    </pattern>
    <pattern id="shaleSeal" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="#334155"/>
      <line x1="0" y1="4" x2="24" y2="4" stroke="#64748b" stroke-width="1.2"/>
      <line x1="0" y1="10" x2="24" y2="10" stroke="#1e293b" stroke-width="1.2"/>
    </pattern>
    <pattern id="sourceRock" width="20" height="16" patternUnits="userSpaceOnUse">
      <rect width="20" height="16" fill="#111317"/>
      <line x1="2" y1="5" x2="18" y2="5" stroke="#52525b" stroke-width="1"/>
      <line x1="6" y1="11" x2="14" y2="11" stroke="#71717a" stroke-width="1"/>
      <circle cx="10" cy="8" r="1.2" fill="#4ade80"/>
    </pattern>
    <linearGradient id="oilCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="gasCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="waterCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="reservoirClip">
      <path d="M 0,145 Q 430,86 860,145 L 860,225 Q 430,166 0,225 Z"/>
    </clipPath>
  </defs>

  <rect width="960" height="520" fill="#0b0f14"/>
  <rect x="20" y="20" width="920" height="480" rx="16" fill="none" stroke="#252f38" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="50" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">Anatomy of a Petroleum System: Source, Migration, Reservoir, and Seal</text>
  <text x="50" y="77" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Buoyant hydrocarbons rise from deep source shale until trapped beneath an impermeable caprock arch, sorting horizontally by density.</text>

  <!-- Geological Cross-Section -->
  <g transform="translate(50, 108)">
    <!-- Sky & Surface -->
    <rect x="0" y="-8" width="860" height="38" fill="url(#skyGrad)"/>
    <line x1="0" y1="30" x2="860" y2="30" stroke="#65a30d" stroke-width="3"/>
    <text x="12" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#bef264">Surface Topography &amp; Exploration Derrick</text>

    <!-- Upright A-frame lattice derrick -->
    <path d="M 417,30 L 430,-4 L 443,30 M 421,19 L 439,19 M 425,9 L 435,9" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round"/>
    <line x1="430" y1="-4" x2="430" y2="30" stroke="#f59e0b" stroke-width="1.6"/>
    <!-- Well borehole line reaching oil column -->
    <line x1="430" y1="30" x2="430" y2="152" stroke="#fbbf24" stroke-width="2.4" stroke-dasharray="5 3"/>
    <circle cx="430" cy="152" r="4" fill="#fbbf24"/>

    <!-- Overburden Sedimentary Layers -->
    <path d="M 0,30 L 860,30 L 860,110 Q 430,52 0,110 Z" fill="#1e293b"/>
    <text x="20" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1">Overburden Strata (Sandstone, Silt &amp; Clay)</text>

    <!-- Impermeable Seal / Caprock (Folded Anticline Arch) -->
    <path d="M 0,110 Q 430,52 860,110 L 860,145 Q 430,86 0,145 Z" fill="url(#shaleSeal)"/>
    <text x="695" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fde68a">1. CAPROCK SEAL</text>
    <text x="695" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#e2e8f0">Impermeable Shale</text>

    <!-- Reservoir Sandstone + Horizontal Density-Sorted Fluids clipped inside the anticline -->
    <g clip-path="url(#reservoirClip)">
      <rect x="0" y="80" width="860" height="160" fill="url(#sandstone)"/>
      <rect x="0" y="168" width="860" height="72" fill="url(#waterCol)" fill-opacity="0.72"/>
      <rect x="0" y="136" width="860" height="32" fill="url(#oilCol)" fill-opacity="0.92"/>
      <rect x="0" y="100" width="860" height="36" fill="url(#gasCol)" fill-opacity="0.94"/>
      <line x1="0" y1="136" x2="860" y2="136" stroke="#bae6fd" stroke-width="1.2" stroke-dasharray="4 3"/>
      <line x1="0" y1="168" x2="860" y2="168" stroke="#86efac" stroke-width="1.2" stroke-dasharray="4 3"/>
    </g>
    <!-- Reservoir outline -->
    <path d="M 0,145 Q 430,86 860,145 M 0,225 Q 430,166 860,225" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.65"/>

    <!-- Fluid Column Labels -->
    <text x="430" y="129" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#ffffff">2. NATURAL GAS CAP (Lightest)</text>
    <text x="430" y="157" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#f0fdf4">3. CRUDE OIL COLUMN</text>
    <text x="24" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#bfdbfe">Porous Sandstone (Brine Aquifer)</text>
    <text x="695" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fbbf24">4. RESERVOIR ROCK</text>

    <!-- Intermediate carrier bed & migration paths -->
    <path d="M 0,225 Q 430,166 860,225 L 860,295 L 0,295 Z" fill="#161b22"/>

    <!-- Migration vectors (arrows rising into the reservoir) -->
    <g stroke="#4ade80" stroke-width="2.2" fill="none" stroke-dasharray="6 3">
      <path d="M 210,305 C 235,265 280,245 315,196"/>
      <path d="M 405,305 C 412,265 418,235 422,188"/>
      <path d="M 640,305 C 615,265 570,245 535,196"/>
    </g>
    <polygon points="318,191 309,200 321,202" fill="#4ade80"/>
    <polygon points="423,182 416,192 428,192" fill="#4ade80"/>
    <polygon points="532,191 529,202 541,200" fill="#4ade80"/>
    <text x="430" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#86efac">5. SECONDARY MIGRATION (Buoyancy drives oil &amp; gas upward through pores)</text>

    <!-- Deep Source Rock (Kerogen-rich organic shale) -->
    <rect x="0" y="295" width="860" height="68" fill="url(#sourceRock)"/>
    <rect x="0" y="295" width="860" height="68" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="24" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#86efac">6. ORGANIC-RICH SOURCE ROCK (Black Shale · Marine Plankton &amp; Algae)</text>
    <text x="24" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">Thermal cracking inside the Oil/Gas Window (~60–225 °C, ~2–5 km burial depth)</text>
  </g>
</svg>
