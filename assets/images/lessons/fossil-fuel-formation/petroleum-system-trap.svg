<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Anatomy of a Petroleum System: Source Rock, Migration, Reservoir, Seal, and Anticlinal Trap">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="sandstone" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#d97706" fill-opacity="0.25"/>
      <circle cx="5" cy="5" r="1.5" fill="#fde68a" fill-opacity="0.6"/>
      <circle cx="15" cy="15" r="1.5" fill="#fde68a" fill-opacity="0.6"/>
      <circle cx="15" cy="5" r="1.2" fill="#fde68a" fill-opacity="0.4"/>
      <circle cx="5" cy="15" r="1.2" fill="#fde68a" fill-opacity="0.4"/>
    </pattern>
    <pattern id="shaleSeal" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="#334155"/>
      <line x1="0" y1="4" x2="24" y2="4" stroke="#475569" stroke-width="1.2"/>
      <line x1="0" y1="10" x2="24" y2="10" stroke="#1e293b" stroke-width="1.2"/>
    </pattern>
    <pattern id="sourceRock" width="20" height="16" patternUnits="userSpaceOnUse">
      <rect width="20" height="16" fill="#18181b"/>
      <line x1="2" y1="5" x2="18" y2="5" stroke="#71717a" stroke-width="1"/>
      <line x1="6" y1="11" x2="14" y2="11" stroke="#a1a1aa" stroke-width="1"/>
      <circle cx="10" cy="8" r="1.2" fill="#4ade80"/>
    </pattern>
    <linearGradient id="oilCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="gasCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="waterCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="960" height="520" fill="#0b0f14"/>
  <rect x="20" y="20" width="920" height="480" rx="16" fill="none" stroke="#252f38" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="50" y="56" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">Anatomy of a Petroleum System: Trap, Reservoir, Seal, and Migration</text>
  <text x="50" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Hydrocarbons generated at depth migrate upward by buoyancy through porous rock until halted by an impermeable seal.</text>

  <!-- Ground surface -->
  <g transform="translate(50, 105)">
    <!-- Sky & Surface -->
    <rect x="0" y="0" width="860" height="30" fill="url(#skyGrad)"/>
    <line x1="0" y1="30" x2="860" y2="30" stroke="#65a30d" stroke-width="3"/>
    <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a3e635">Surface Topography / Drilling Derrick Location</text>

    <!-- Derrick icon -->
    <path d="M 430,30 L 415,-5 L 445,-5 Z" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <line x1="430" y1="-5" x2="430" y2="30" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Well borehole line -->
    <line x1="430" y1="30" x2="430" y2="165" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 2"/>

    <!-- Overburden Sedimentary Layers (Shales, Silts) -->
    <path d="M 0,30 Q 430,45 860,30 L 860,110 Q 430,70 0,110 Z" fill="#1e293b"/>
    <text x="60" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">Overburden Strata (Low Permeability Shales &amp; Clays)</text>

    <!-- Impermeable Seal / Caprock (Folded Anticline Arch) -->
    <path d="M 0,110 Q 430,60 860,110 L 860,145 Q 430,95 0,145 Z" fill="url(#shaleSeal)"/>
    <text x="730" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fde68a">1. CAPROCK SEAL</text>
    <text x="730" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Impermeable Shale</text>

    <!-- Reservoir Rock: Folded Sandstone Layer -->
    <!-- Contains Gas cap, Oil column, Water bottom based on density separation -->
    <!-- Gas cap at top of anticline -->
    <path d="M 330,128 Q 430,95 530,128 L 540,150 Q 430,120 320,150 Z" fill="url(#gasCol)"/>
    <text x="430" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">2. NATURAL GAS CAP</text>

    <!-- Oil column below gas -->
    <path d="M 320,150 Q 430,120 540,150 L 565,185 Q 430,150 295,185 Z" fill="url(#oilCol)"/>
    <text x="430" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f0fdf4">3. CRUDE OIL COLUMN</text>

    <!-- Saline Water below oil in reservoir sandstone -->
    <path d="M 0,145 Q 430,95 860,145 L 860,225 Q 430,175 0,225 Z" fill="url(#sandstone)"/>
    <!-- Water highlight -->
    <path d="M 0,165 Q 295,145 295,185 L 295,220 Q 150,223 0,225 Z" fill="url(#waterCol)" fill-opacity="0.75"/>
    <path d="M 565,185 Q 860,165 860,165 L 860,225 Q 710,220 565,220 Z" fill="url(#waterCol)" fill-opacity="0.75"/>
    <text x="80" y="195" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Porous Sandstone (Brine Aquifer)</text>
    <text x="730" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24">4. RESERVOIR ROCK</text>

    <!-- Intermediate carrier bed & migration paths -->
    <path d="M 0,225 Q 430,175 860,225 L 860,285 Q 430,235 0,285 Z" fill="#1e2229"/>

    <!-- Migration vectors (arrows rising into the reservoir) -->
    <g stroke="#4ade80" stroke-width="2" fill="none" stroke-dasharray="6 3">
      <path d="M 220,310 C 240,270 290,250 330,200"/>
      <path d="M 380,310 C 390,270 410,240 420,185"/>
      <path d="M 620,310 C 600,270 560,250 520,200"/>
    </g>
    <!-- Arrowheads -->
    <polygon points="330,195 323,205 335,204" fill="#4ade80"/>
    <polygon points="420,180 414,190 426,189" fill="#4ade80"/>
    <polygon points="520,195 515,204 527,205" fill="#4ade80"/>
    <text x="430" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4ade80">5. SECONDARY MIGRATION (Buoyancy forces oil &amp; gas upward)</text>

    <!-- Deep Source Rock (Kerogen-rich organic shale) -->
    <rect x="0" y="295" width="860" height="65" fill="url(#sourceRock)"/>
    <rect x="0" y="295" width="860" height="65" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="30" y="325" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#86efac">6. ORGANIC-RICH SOURCE ROCK (Black Shale · Marine Plankton &amp; Algae)</text>
    <text x="30" y="345" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Thermal cracking inside the Oil/Gas Window (~60–160°C, 2–4 km burial depth)</text>
  </g>
</svg>
