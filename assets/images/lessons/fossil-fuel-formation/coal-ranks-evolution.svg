<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Geological stages of coalification from peat to anthracite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1317"/>
      <stop offset="100%" stop-color="#07090b"/>
    </linearGradient>
    <linearGradient id="pGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7344"/>
      <stop offset="100%" stop-color="#4d3f23"/>
    </linearGradient>
    <linearGradient id="lGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4224"/>
      <stop offset="100%" stop-color="#322212"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a231b"/>
      <stop offset="100%" stop-color="#14100c"/>
    </linearGradient>
    <linearGradient id="aGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191717"/>
      <stop offset="50%" stop-color="#3d3a3a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="heatArrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bg)"/>
  <rect x="20" y="20" width="920" height="440" rx="16" fill="none" stroke="#252f38" stroke-width="1.5"/>

  <!-- Title & Context -->
  <text x="50" y="58" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">The Coalification Continuum: Rank, Burial, and Organic Metamorphism</text>
  <text x="50" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Progressive devolatilization driven by geothermal heat and overburden pressure over millions of years</text>

  <!-- 4 Columns for Ranks -->
  <!-- 1. Peat -->
  <g transform="translate(50, 110)">
    <rect width="195" height="230" rx="12" fill="#141a21" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="165" height="75" rx="8" fill="url(#pGrad)"/>
    <text x="97" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#fef08a">1. Peat</text>
    <text x="20" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Pre-Coal Organic Layer</text>
    <text x="20" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Carbon: ~50–60%</text>
    <text x="20" y="153" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Moisture: up to 75–90%</text>
    <text x="20" y="171" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Energy: ~10–14 MJ/kg</text>
    <text x="20" y="193" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Visible plant debris, mosses, stems; porous and waterlogged.</text>
  </g>

  <!-- 2. Lignite -->
  <g transform="translate(270, 110)">
    <rect width="195" height="230" rx="12" fill="#141a21" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="165" height="75" rx="8" fill="url(#lGrad)"/>
    <text x="97" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#fde68a">2. Lignite</text>
    <text x="20" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Brown Coal (Lowest Rank)</text>
    <text x="20" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Carbon: ~60–70%</text>
    <text x="20" y="153" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Moisture: ~30–45%</text>
    <text x="20" y="171" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Energy: ~14–19 MJ/kg</text>
    <text x="20" y="193" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Compacted, crumbly; often used in local mine-mouth power plants.</text>
  </g>

  <!-- 3. Bituminous -->
  <g transform="translate(490, 110)">
    <rect width="195" height="230" rx="12" fill="#141a21" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="165" height="75" rx="8" fill="url(#bGrad)"/>
    <text x="97" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">3. Bituminous</text>
    <text x="20" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Soft / Black Coal</text>
    <text x="20" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Carbon: ~75–86%</text>
    <text x="20" y="153" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Moisture: ~5–15%</text>
    <text x="20" y="171" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Energy: ~24–32 MJ/kg</text>
    <text x="20" y="193" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Dense, banded, high heating value; primary fuel for power and steel coking.</text>
  </g>

  <!-- 4. Anthracite -->
  <g transform="translate(710, 110)">
    <rect width="195" height="230" rx="12" fill="#141a21" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="165" height="75" rx="8" fill="url(#aGrad)"/>
    <text x="97" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">4. Anthracite</text>
    <text x="20" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Hard Coal (Metamorphic)</text>
    <text x="20" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Carbon: ~90–97%</text>
    <text x="20" y="153" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Moisture: &lt; 5%</text>
    <text x="20" y="171" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Energy: ~32–35 MJ/kg</text>
    <text x="20" y="193" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Glassy, semi-metallic luster, conchoidal fracture; burns with smokeless blue flame.</text>
  </g>

  <!-- Burial gradient arrow at bottom -->
  <g transform="translate(50, 360)">
    <rect width="855" height="12" rx="6" fill="url(#heatArrow)"/>
    <polygon points="915,366 900,358 900,374" fill="#ef4444"/>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Shallow Burial (~0–1 km) · &lt;50°C · Dewatering</text>
    <text x="430" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">Deep Basin (~2–4 km) · ~100–150°C · Devolatilization (CO₂, CH₄ released)</text>
    <text x="855" y="32" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ef4444">Tectonic / Deep (~4–6+ km) · &gt;200°C · Metamorphism</text>
  </g>
</svg>

