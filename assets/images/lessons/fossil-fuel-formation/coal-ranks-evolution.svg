<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Geological stages of coalification from peat to anthracite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1317"/>
      <stop offset="100%" stop-color="#07090b"/>
    </linearGradient>
    <linearGradient id="pGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7344"/>
      <stop offset="100%" stop-color="#4d3f23"/>
    </linearGradient>
    <linearGradient id="lGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4224"/>
      <stop offset="100%" stop-color="#322212"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a231b"/>
      <stop offset="100%" stop-color="#14100c"/>
    </linearGradient>
    <linearGradient id="aGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f242b"/>
      <stop offset="48%" stop-color="#474d56"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="heatArrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bg)"/>
  <rect x="20" y="20" width="920" height="440" rx="16" fill="none" stroke="#252f38" stroke-width="1.5"/>

  <!-- Title & Context -->
  <text x="50" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">The Coalification Continuum: Rank, Compaction, and Organic Metamorphism</text>
  <text x="50" y="77" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Progressive dewatering and devolatilization driven by geothermal heat and burial pressure over millions of years</text>

  <!-- 1. Peat -->
  <g transform="translate(50, 100)">
    <rect width="195" height="252" rx="12" fill="#141a21" stroke="#334155" stroke-width="1.2"/>
    <rect x="14" y="14" width="167" height="72" rx="8" fill="url(#pGrad)"/>
    <path d="M26,72 Q42,60 62,70 M78,66 Q102,54 126,68 M138,72 Q156,62 170,68" stroke="#c8b074" stroke-width="1.6" fill="none" opacity="0.55"/>
    <text x="97.5" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#fef08a">1. Peat</text>
    <text x="97.5" y="72" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#fde68a">10.0 m bed (uncompacted)</text>
    <text x="16" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Pre-Coal Organic Mat</text>
    <text x="16" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Carbon: ~50–60%</text>
    <text x="16" y="149" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Moisture: up to 75–90%</text>
    <text x="16" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Energy: ~10–14 MJ/kg</text>
    <text x="16" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#cbd5e1">
      <tspan x="16" dy="0">Spongy mosses, stems, and</tspan>
      <tspan x="16" dy="14">roots preserved in anoxic,</tspan>
      <tspan x="16" dy="14">waterlogged swamp beds.</tspan>
    </text>
  </g>

  <!-- 2. Lignite -->
  <g transform="translate(270, 100)">
    <rect width="195" height="252" rx="12" fill="#141a21" stroke="#334155" stroke-width="1.2"/>
    <rect x="14" y="14" width="167" height="72" rx="8" fill="url(#lGrad)"/>
    <line x1="22" y1="68" x2="173" y2="68" stroke="#926a39" stroke-width="1.2" opacity="0.5"/>
    <text x="97.5" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#fde68a">2. Lignite</text>
    <text x="97.5" y="72" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#fed7aa">10 m peat → ~3.5 m seam</text>
    <text x="16" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Brown Coal (Lowest Rank)</text>
    <text x="16" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Carbon: ~60–70%</text>
    <text x="16" y="149" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Moisture: ~30–45%</text>
    <text x="16" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Energy: ~14–19 MJ/kg</text>
    <text x="16" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#cbd5e1">
      <tspan x="16" dy="0">Compacted and crumbly;</tspan>
      <tspan x="16" dy="14">often burned in mine-mouth</tspan>
      <tspan x="16" dy="14">steam power stations.</tspan>
    </text>
  </g>

  <!-- 3. Bituminous -->
  <g transform="translate(490, 100)">
    <rect width="195" height="252" rx="12" fill="#141a21" stroke="#334155" stroke-width="1.2"/>
    <rect x="14" y="14" width="167" height="72" rx="8" fill="url(#bGrad)"/>
    <line x1="20" y1="28" x2="175" y2="28" stroke="#64748b" stroke-width="1" opacity="0.45"/>
    <line x1="20" y1="64" x2="175" y2="64" stroke="#64748b" stroke-width="1" opacity="0.45"/>
    <text x="97.5" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">3. Bituminous</text>
    <text x="97.5" y="72" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#cbd5e1">10 m peat → ~1.1 m seam</text>
    <text x="16" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Dense Black Coal</text>
    <text x="16" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Carbon: ~75–86%</text>
    <text x="16" y="149" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Moisture: ~5–15%</text>
    <text x="16" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Energy: ~24–32 MJ/kg</text>
    <text x="16" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#cbd5e1">
      <tspan x="16" dy="0">Dense, banded coal; primary</tspan>
      <tspan x="16" dy="14">fuel for electricity and</tspan>
      <tspan x="16" dy="14">metallurgical steel coking.</tspan>
    </text>
  </g>

  <!-- 4. Anthracite -->
  <g transform="translate(710, 100)">
    <rect width="195" height="252" rx="12" fill="#141a21" stroke="#334155" stroke-width="1.2"/>
    <rect x="14" y="14" width="167" height="72" rx="8" fill="url(#aGrad)"/>
    <path d="M22,22 L76,22 L38,76 L22,76 Z" fill="#ffffff" opacity="0.06"/>
    <text x="97.5" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">4. Anthracite</text>
    <text x="97.5" y="72" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#7dd3fc">10 m peat → ~0.7 m seam</text>
    <text x="16" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Hard Coal (Metamorphic)</text>
    <text x="16" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Carbon: ~90–97%</text>
    <text x="16" y="149" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Moisture: &lt; 5%</text>
    <text x="16" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Energy: ~32–35 MJ/kg</text>
    <text x="16" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#cbd5e1">
      <tspan x="16" dy="0">Glassy luster, conchoidal</tspan>
      <tspan x="16" dy="14">fracture; burns with a hot,</tspan>
      <tspan x="16" dy="14">nearly smokeless blue flame.</tspan>
    </text>
  </g>

  <!-- Burial gradient arrow at bottom -->
  <g transform="translate(50, 382)">
    <rect width="840" height="12" rx="6" fill="url(#heatArrow)"/>
    <polygon points="858,6 838,-2 838,14" fill="#ef4444"/>
    <text x="0" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#7dd3fc">Shallow Burial (~0–1 km) · &lt;50 °C · Dewatering</text>
    <text x="430" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">Deep Basin (~2–4 km) · ~100–160 °C · Volatiles (CO₂, CH₄) Expelled</text>
    <text x="855" y="34" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#fca5a5">Fold Belt (~4–6 km) · &gt;170 °C · Metamorphism</text>
  </g>
</svg>
