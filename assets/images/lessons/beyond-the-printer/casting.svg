<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" width="1000" height="476" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Casting plaster in a printed mold</title>
  <desc id="d">Four steps. One: print an open mold whose walls taper outward slightly so the cast can come out. Two: coat the inside with a thin layer of release such as petroleum jelly. Three: wearing goggles and a mask, sprinkle plaster into water, stir, pour into the mold and tap out the bubbles. Four: wait until it is set and cool, then flex the mold and lift the cast out. A warning reads: plaster gets warm as it sets, never cast any part of the body.</desc>
  <rect width="1000" height="476" fill="#ffffff"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#0f172a">One print, many copies: casting in a printed mold</text>
  <text x="30" y="70" font-size="16" fill="#334155">Cross-sections. Orange = the printed mold; white = plaster.</text>

  <g font-size="15" fill="#334155">
    <rect x="30" y="92" width="225" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="48" y="122" font-size="18" font-weight="700" fill="#0f172a">1 · Print the mold</text>
    <path d="M60 300 V180 H90 L100 270 H185 L195 180 H225 V300 Z" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5"/>
    <text x="48" y="330">Walls lean out a little</text>
    <text x="48" y="350">(taper), so the cast</text>
    <text x="48" y="370">lifts out. Smooth inside.</text>

    <rect x="270" y="92" width="225" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="288" y="122" font-size="18" font-weight="700" fill="#0f172a">2 · Coat with release</text>
    <path d="M300 300 V180 H330 L340 270 H425 L435 180 H465 V300 Z" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5"/>
    <path d="M331 182 L341 268 H424 L434 182" fill="none" stroke="#ca8a04" stroke-width="5" stroke-linejoin="round"/>
    <text x="288" y="330">A thin film of petroleum</text>
    <text x="288" y="350">jelly in every corner, so</text>
    <text x="288" y="370">plaster can't stick.</text>

    <rect x="510" y="92" width="225" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="528" y="122" font-size="18" font-weight="700" fill="#0f172a">3 · Mix, pour, tap</text>
    <path d="M540 300 V180 H570 L580 270 H665 L675 180 H705 V300 Z" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5"/>
    <path d="M572 196 L580 268 H665 L673 196 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="610" cy="240" r="3" fill="none" stroke="#64748b"/><circle cx="640" cy="225" r="2.5" fill="none" stroke="#64748b"/><circle cx="625" cy="255" r="2" fill="none" stroke="#64748b"/>
    <text x="528" y="330">Sprinkle plaster into</text>
    <text x="528" y="350">water, stir, pour, tap the</text>
    <text x="528" y="370">table to lift the bubbles.</text>

    <rect x="750" y="92" width="225" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="768" y="122" font-size="18" font-weight="700" fill="#0f172a">4 · Wait, then release</text>
    <path d="M780 300 V180 H810 L820 270 H905 L915 180 H945 V300 Z" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5" opacity="0.55"/>
    <path d="M815 160 L823 232 H908 L916 160 Z" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
        <text x="768" y="330">Set and cool to the touch</text>
    <text x="768" y="350">first. Flex the mold and</text>
    <text x="768" y="370">lift the cast straight up.</text>
  </g>

  <rect x="30" y="396" width="940" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="48" y="420" font-size="17" font-weight="700" fill="#991b1b">Plaster gets warm as it sets. Never cast a hand, finger, face or any part of the body.</text>
  <text x="48" y="442" font-size="15" fill="#7f1d1d">Goggles and a dust mask while mixing. Scrape leftovers into the bin: plaster sets in drains.</text>
  <text x="970" y="466" font-size="12" text-anchor="end" fill="#64748b">Original ClassroomOS teaching diagram</text>
</svg>
