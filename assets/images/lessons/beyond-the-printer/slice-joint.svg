<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How two slices lock together</title>
  <desc id="d">Left: slice A has a slot cut from the top down to the middle. Middle: slice B has a slot cut from the bottom up to the middle. Right: B slides down onto A, the two slots meet at the middle, and the slices stand crossed. Each slot is as wide as the board is thick.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#0f172a">The cross-halving joint: half a slot each</text>
  <text x="30" y="70" font-size="16" fill="#334155">Every crossing in a slice-form is this one joint. No glue: the slots hold the slices square.</text>

  <!-- A slice -->
  <text x="160" y="112" font-size="19" font-weight="700" text-anchor="middle" fill="#92400e">Slice A</text>
  <path d="M60 400 V170 Q60 140 90 140 H230 Q260 140 260 170 V400 Z M146 140 V270 H174 V140" fill="#f5d9a8" stroke="#92400e" stroke-width="2.5" fill-rule="evenodd"/>
  <rect x="146" y="138" width="28" height="132" fill="#ffffff" stroke="#92400e" stroke-width="2.5"/>
    <text x="160" y="430" font-size="15" text-anchor="middle" fill="#334155">slot from the <tspan font-weight="700">top</tspan></text>
  <text x="160" y="450" font-size="15" text-anchor="middle" fill="#334155">down to the middle</text>

  <!-- B slice -->
  <text x="430" y="112" font-size="19" font-weight="700" text-anchor="middle" fill="#1e3a8a">Slice B</text>
  <path d="M330 400 V170 Q330 140 360 140 H500 Q530 140 530 170 V400 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="416" y="270" width="28" height="132" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="430" y="430" font-size="15" text-anchor="middle" fill="#334155">slot from the <tspan font-weight="700">bottom</tspan></text>
  <text x="430" y="450" font-size="15" text-anchor="middle" fill="#334155">up to the middle</text>

  <!-- middle line + dims -->
  <line x1="40" y1="270" x2="550" y2="270" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="40" y="262" font-size="14" fill="#475569">middle of the crossing</text>
  <line x1="146" y1="122" x2="174" y2="122" stroke="#0f172a" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="182" y="127" font-size="14" fill="#0f172a">w = board thickness</text>

  <!-- assembled (simple isometric) -->
  <text x="790" y="112" font-size="19" font-weight="700" text-anchor="middle" fill="#0f172a">Slide B down onto A</text>
  <line x1="790" y1="128" x2="790" y2="160" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>
  <!-- A seen at an angle (back half) -->
  <path d="M700 330 L790 375 L790 205 L700 160 Z" fill="#f5d9a8" stroke="#92400e" stroke-width="2.5"/>
  <!-- B crossing -->
  <path d="M700 400 L880 310 L880 140 L700 230 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" opacity="0.95"/>
  <!-- A front half -->
  <path d="M790 375 L880 420 L880 250 L790 205 Z" fill="#f5d9a8" stroke="#92400e" stroke-width="2.5"/>
  <line x1="790" y1="205" x2="790" y2="375" stroke="#0f172a" stroke-width="2"/>
  <text x="790" y="455" font-size="15" text-anchor="middle" fill="#334155">The two half-slots fill one full height:</text>
  <text x="790" y="475" font-size="15" text-anchor="middle" fill="#334155">tops and bottoms line up.</text>

  <text x="30" y="505" font-size="13" fill="#64748b">Original ClassroomOS teaching diagram</text>
</svg>
