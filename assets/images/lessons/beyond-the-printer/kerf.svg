<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Kerf: the width a cut removes</title>
  <desc id="d">Left: a laser follows the drawn line but burns away a strip the width of the kerf, half on each side, so a slot comes out wider than drawn and a tab comes out narrower. Right: to fix it, draw slots narrower by the kerf and tabs wider by the kerf; then both come out at the planned size. A craft knife has almost no kerf.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker>
  </defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#0f172a">Kerf: every cut eats a little board</text>
  <text x="30" y="70" font-size="16" fill="#334155">Kerf drawn 10× bigger than life. A laser's kerf is a few tenths of a millimetre; a sharp knife's is close to zero.</text>

  <rect x="30" y="92" width="455" height="350" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="515" y="92" width="455" height="350" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="124" font-size="19" font-weight="700" fill="#b91c1c">Cut exactly on the drawing</text>
  <text x="535" y="124" font-size="19" font-weight="700" fill="#166534">Draw it kerf-compensated</text>

  <!-- left: slot -->
  <rect x="60" y="150" width="190" height="130" fill="#f5d9a8" stroke="#92400e" stroke-width="2"/>
  <rect x="130" y="150" width="50" height="80" fill="#ffffff"/>
  <path d="M120 150 V240 H190 V150" fill="#ffffff" stroke="none"/>
  <path d="M120 150 V240 H190 V150" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="1 0"/>
  <path d="M130 150 V230 H180 V150" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="155" y="300" font-size="15" text-anchor="middle" fill="#334155">slot comes out <tspan font-weight="700" fill="#b91c1c">wider</tspan></text>
  <text x="155" y="318" font-size="15" text-anchor="middle" fill="#334155">drawn + kerf</text>
  <!-- left: tab -->
  <path d="M290 280 V230 H340 V150 H400 V230 H450 V280 Z" fill="#ffffff" stroke="none"/>
  <path d="M290 280 V230 H345 V155 H395 V230 H450 V280 Z" fill="#f5d9a8" stroke="#dc2626" stroke-width="2"/>
  <path d="M340 230 V150 H400 V230" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="370" y="300" font-size="15" text-anchor="middle" fill="#334155">tab comes out <tspan font-weight="700" fill="#b91c1c">narrower</tspan></text>
  <text x="370" y="318" font-size="15" text-anchor="middle" fill="#334155">drawn − kerf</text>
  <text x="60" y="370" font-size="15" fill="#334155"><tspan font-weight="700">Dashed</tspan> = the line you drew.</text>
  <text x="60" y="392" font-size="15" fill="#334155"><tspan font-weight="700" fill="#dc2626">Red</tspan> = the edge after the cut: half a kerf</text>
  <text x="60" y="412" font-size="15" fill="#334155">burned away on each side of the line.</text>

  <!-- right: compensated -->
  <rect x="545" y="150" width="190" height="130" fill="#f5d9a8" stroke="#92400e" stroke-width="2"/>
  <path d="M605 150 V240 H675 V150" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <path d="M615 150 V230 H665 V150" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="640" y="300" font-size="15" text-anchor="middle" fill="#334155">draw the slot <tspan font-weight="700">narrower</tspan></text>
  <text x="640" y="318" font-size="15" text-anchor="middle" fill="#334155">by the kerf: it cuts to size</text>
  <path d="M775 280 V230 H825 V150 H885 V230 H935 V280 Z" fill="#f5d9a8" stroke="#16a34a" stroke-width="2"/>
  <path d="M820 230 V145 H890 V230" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="855" y="300" font-size="15" text-anchor="middle" fill="#334155">draw the tab <tspan font-weight="700">wider</tspan></text>
  <text x="855" y="318" font-size="15" text-anchor="middle" fill="#334155">by the kerf: it cuts to size</text>
  <text x="545" y="370" font-size="15" fill="#334155"><tspan font-weight="700" fill="#16a34a">Green</tspan> = the edge after the cut.</text>
  <text x="545" y="392" font-size="15" fill="#334155">Same rule for a whole outline: grow it by</text>
  <text x="545" y="412" font-size="15" fill="#334155">half the kerf all the way round.</text>

  <rect x="30" y="452" width="940" height="38" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="48" y="477" font-size="17" fill="#0f172a"><tspan font-weight="700">Measure your kerf:</tspan> cut a slot and measure it with calipers. kerf = measured − drawn.</text>
  <text x="955" y="477" font-size="12" text-anchor="end" fill="#64748b">Original ClassroomOS teaching diagram</text>
</svg>
