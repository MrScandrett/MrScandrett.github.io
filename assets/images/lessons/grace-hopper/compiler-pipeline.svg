<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="gh-pipe-title gh-pipe-desc">
  <title id="gh-pipe-title">Grace Hopper's Compiler Pipeline: English-Like Source Code to Machine Binary</title>
  <desc id="gh-pipe-desc">Four-stage compiler diagram showing how English-like FLOW-MATIC and COBOL statements pass through the Lexer and Symbol Table, Code Generator for symbolic assembly, and 32-bit machine binary executed by the CPU, above an evolution timeline from 1944 Mark I tape to modern languages.</desc>
  <defs>
    <marker id="gh-arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e" />
    </marker>
    <marker id="gh-arr-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="gh-arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309" />
    </marker>
  </defs>

  <rect width="960" height="490" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- Top Header Banner -->
  <rect x="24" y="20" width="912" height="46" rx="10" fill="#0b1220" />
  <text x="42" y="49" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#5eead4">GRACE HOPPER'S COMPILER PIPELINE · ENGLISH-LIKE SOURCE CODE → MACHINE BINARY</text>

  <!-- Stage 1: Source Code -->
  <rect x="24" y="88" width="202" height="278" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
  <rect x="24" y="88" width="202" height="34" rx="12" fill="#ccfbf1" />
  <text x="38" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#134e4a">1. SOURCE CODE</text>
  <text x="38" y="142" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#0f766e">FLOW-MATIC / COBOL</text>

  <rect x="38" y="156" width="174" height="106" rx="8" fill="#0f172a" />
  <text x="50" y="180" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#5eead4">MULTIPLY</text>
  <text x="50" y="200" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#f8fafc">  HOURS BY RATE</text>
  <text x="50" y="220" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#fbbf24">  GIVING PAY.</text>
  <text x="50" y="246" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Human writes words,</text>

  <text x="38" y="286" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Why it mattered:</text>
  <text x="38" y="305" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Accountants &amp; engineers</text>
  <text x="38" y="321" font-family="system-ui, sans-serif" font-size="11" fill="#334155">describe intent without</text>
  <text x="38" y="337" font-family="system-ui, sans-serif" font-size="11" fill="#334155">memorizing hex opcodes.</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="226" y1="226" x2="254" y2="226" stroke="#0f766e" stroke-width="3" marker-end="url(#gh-arr-teal)" />

  <!-- Stage 2: Lexer & Symbol Table -->
  <rect x="260" y="88" width="204" height="278" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
  <rect x="260" y="88" width="204" height="34" rx="12" fill="#e0f2fe" />
  <text x="274" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0c4a6e">2. LEXER &amp; SYMBOLS</text>
  <text x="274" y="142" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#0284c7">TOKENS + ADDRESS MAP</text>

  <rect x="274" y="156" width="176" height="44" rx="7" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5" />
  <text x="284" y="175" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#0369a1">OP: MULTIPLY</text>
  <text x="284" y="191" font-family="ui-monospace, monospace" font-size="10.5" fill="#1e293b">VARS: HOURS, RATE, PAY</text>

  <rect x="274" y="212" width="176" height="92" rx="8" fill="#0f172a" />
  <text x="284" y="232" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#38bdf8">SYMBOL TABLE</text>
  <text x="284" y="252" font-family="ui-monospace, monospace" font-size="11.5" fill="#f8fafc">HOURS  →  0x0104</text>
  <text x="284" y="271" font-family="ui-monospace, monospace" font-size="11.5" fill="#f8fafc">RATE   →  0x0108</text>
  <text x="284" y="290" font-family="ui-monospace, monospace" font-size="11.5" fill="#fbbf24">PAY    →  0x010C</text>

  <text x="274" y="325" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Replaces hand-tracked</text>
  <text x="274" y="341" font-family="system-ui, sans-serif" font-size="11" fill="#334155">memory books automatically.</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="464" y1="226" x2="492" y2="226" stroke="#0284c7" stroke-width="3" marker-end="url(#gh-arr-sky)" />

  <!-- Stage 3: Code Generator (Assembly) -->
  <rect x="498" y="88" width="204" height="278" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2" />
  <rect x="498" y="88" width="204" height="34" rx="12" fill="#fef3c7" />
  <text x="512" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#78350f">3. CODE GENERATOR</text>
  <text x="512" y="142" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#b45309">SYMBOLIC ASSEMBLY</text>

  <rect x="512" y="156" width="176" height="122" rx="8" fill="#0f172a" />
  <text x="522" y="178" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#fde68a">LOAD   R1, [0x0104]</text>
  <text x="522" y="195" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">       ; fetch HOURS</text>
  <text x="522" y="218" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#fde68a">MUL    R1, [0x0108]</text>
  <text x="522" y="235" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">       ; times RATE</text>
  <text x="522" y="258" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#5eead4">STORE  [0x010C], R1</text>

  <text x="512" y="302" font-family="system-ui, sans-serif" font-size="11" fill="#334155">1 English sentence expands</text>
  <text x="512" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#334155">into 3 exact CPU steps</text>
  <text x="512" y="334" font-family="system-ui, sans-serif" font-size="11" fill="#334155">with verified addresses.</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="702" y1="226" x2="730" y2="226" stroke="#b45309" stroke-width="3" marker-end="url(#gh-arr-amber)" />

  <!-- Stage 4: Machine Binary & CPU -->
  <rect x="736" y="88" width="200" height="278" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
  <rect x="736" y="88" width="200" height="34" rx="12" fill="#d1fae5" />
  <text x="750" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#065f46">4. MACHINE BINARY</text>
  <text x="750" y="142" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#047857">32-BIT CPU EXECUTION</text>

  <rect x="748" y="156" width="176" height="106" rx="8" fill="#0f172a" />
  <text x="756" y="176" font-family="ui-monospace, monospace" font-size="9.2" fill="#6ee7b7">00010010 00000001 00000001 00000100</text>
  <text x="756" y="200" font-family="ui-monospace, monospace" font-size="9.2" fill="#6ee7b7">00101100 00000001 00000001 00001000</text>
  <text x="756" y="224" font-family="ui-monospace, monospace" font-size="9.2" fill="#6ee7b7">00011011 00000001 00000001 00001100</text>
  <text x="756" y="248" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#fde68a">96 BITS → R1 = 720</text>

  <rect x="748" y="274" width="176" height="76" rx="8" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.5" />
  <text x="760" y="294" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#065f46">Processor ALU &amp; RAM</text>
  <text x="760" y="313" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e293b">Fetches each 32-bit word,</text>
  <text x="760" y="329" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e293b">executes, writes [0x010C].</text>

  <!-- Bottom Evolution Timeline Bar -->
  <rect x="24" y="388" width="912" height="82" rx="12" fill="#0b1220" />
  <text x="42" y="414" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#38bdf8">EVOLUTION OF PROGRAMMING TRANSLATION</text>

  <g font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">
    <rect x="42" y="426" width="150" height="30" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="117" y="445" text-anchor="middle" fill="#e2e8f0">1944 · Mark I Tape</text>

    <line x1="194" y1="441" x2="216" y2="441" stroke="#38bdf8" stroke-width="2" />
    <rect x="218" y="426" width="166" height="30" rx="6" fill="#134e4a" stroke="#2dd4bf" />
    <text x="301" y="445" text-anchor="middle" fill="#ccfbf1">1952 · A-0 Compiler</text>

    <line x1="386" y1="441" x2="408" y2="441" stroke="#38bdf8" stroke-width="2" />
    <rect x="410" y="426" width="156" height="30" rx="6" fill="#1e3a8a" stroke="#60a5fa" />
    <text x="488" y="445" text-anchor="middle" fill="#dbeafe">1955 · FLOW-MATIC</text>

    <line x1="568" y1="441" x2="590" y2="441" stroke="#38bdf8" stroke-width="2" />
    <rect x="592" y="426" width="132" height="30" rx="6" fill="#78350f" stroke="#fbbf24" />
    <text x="658" y="445" text-anchor="middle" fill="#fef3c7">1959 · COBOL</text>

    <line x1="726" y1="441" x2="748" y2="441" stroke="#38bdf8" stroke-width="2" />
    <rect x="750" y="426" width="168" height="30" rx="6" fill="#312e81" stroke="#a78bfa" />
    <text x="834" y="445" text-anchor="middle" fill="#ede9fe">Today · C, Rust, Swift</text>
  </g>
</svg>
