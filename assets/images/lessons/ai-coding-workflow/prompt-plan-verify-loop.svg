<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="aiw-loop-title aiw-loop-desc">
  <title id="aiw-loop-title">The AI-Assisted Coding Loop: Specify, Diff, Read, Verify</title>
  <desc id="aiw-loop-desc">Four-step workflow cycle showing how developers keep ownership while working with AI tools: state exact behavior and constraints, ask for small focused diffs, inspect every changed line, and verify with tests and browser runs.</desc>
  <defs>
    <marker id="aiw-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">The Disciplined AI Coding Loop (You Stay the Author)</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Prompting without checking spreads hidden bugs; small diffs + real verification keep your project healthy</text>

  <!-- Step 1 -->
  <rect x="28" y="82" width="186" height="176" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="44" y="96" width="90" height="22" rx="11" fill="#4f46e5"/>
  <text x="89" y="111" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">1 · SPECIFY</text>
  <text x="44" y="140" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#1e1b4b">Name Exact Goal</text>
  <text x="44" y="162" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#312e81">• Target file &amp; line area</text>
  <text x="44" y="182" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#312e81">• Expected vs. actual</text>
  <text x="44" y="202" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#312e81">• What must NOT change</text>
  <text x="44" y="238" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#4338ca">Concrete = safer edit</text>

  <path d="M 214 170 L 238 170" stroke="#475569" stroke-width="2" marker-end="url(#aiw-arr)"/>

  <!-- Step 2 -->
  <rect x="242" y="82" width="186" height="176" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <rect x="258" y="96" width="96" height="22" rx="11" fill="#0369a1"/>
  <text x="306" y="111" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">2 · SMALL DIFF</text>
  <text x="258" y="140" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#0c4a6e">Fix One Bug First</text>
  <text x="258" y="162" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#075985">• Ask for a focused patch</text>
  <text x="258" y="182" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#075985">• Avoid full-file rewrites</text>
  <text x="258" y="202" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#075985">• Keep naming consistent</text>
  <text x="258" y="238" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#0369a1">1 change -&gt; clear test</text>

  <path d="M 428 170 L 452 170" stroke="#475569" stroke-width="2" marker-end="url(#aiw-arr)"/>

  <!-- Step 3 -->
  <rect x="456" y="82" width="186" height="176" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <rect x="472" y="96" width="106" height="22" rx="11" fill="#d97706"/>
  <text x="525" y="111" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">3 · READ &amp; TRACE</text>
  <text x="472" y="140" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#78350f">Inspect Every Line</text>
  <text x="472" y="162" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#92400e">• Can you explain WHY it</text>
  <text x="480" y="178" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#92400e">works out loud?</text>
  <text x="472" y="202" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#92400e">• Watch for deleted logic</text>
  <text x="472" y="238" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#b45309">Human Gate #1</text>

  <path d="M 642 170 L 666 170" stroke="#475569" stroke-width="2" marker-end="url(#aiw-arr)"/>

  <!-- Step 4 -->
  <rect x="670" y="82" width="182" height="176" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="686" y="96" width="90" height="22" rx="11" fill="#0f766e"/>
  <text x="731" y="111" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">4 · VERIFY</text>
  <text x="686" y="140" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#064e3b">Run &amp; Stress Test</text>
  <text x="686" y="162" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#065f46">• Open Console + Network</text>
  <text x="686" y="182" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#065f46">• Test edge cases</text>
  <text x="686" y="202" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#065f46">• Check sibling features</text>
  <text x="686" y="238" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#047857">Evidence &gt; confidence</text>

  <!-- Return arrow & Handoff rule -->
  <rect x="28" y="278" width="824" height="78" rx="14" fill="#0f172a"/>
  <text x="48" y="304" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">Session Handoff Rule (Keep Context Fresh)</text>
  <text x="48" y="326" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#e2e8f0">When a chat gets muddy or starts repeating a mistake, open a new conversation with a 3-part Handoff Brief:</text>
  <text x="48" y="344" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#a7f3d0">1) Working features now   2) Exact file/symbol failing   3) Literal error message + what you already ruled out</text>
</svg>
