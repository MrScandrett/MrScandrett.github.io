<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="aiw-triage-title aiw-triage-desc">
  <title id="aiw-triage-title">Bug Triage Funnel Before Asking AI for Help</title>
  <desc id="aiw-triage-desc">Comparison showing a vague unhelpful prompt versus a structured four-step triage packet (exact reproduction, browser/console error, suspect code snippet, and expected output).</desc>
  <rect width="880" height="370" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">How to Debug With AI: Bad Context vs. Diagnostic Packet</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">An AI guesses wildly when given only symptoms — give it reproducible facts</text>

  <!-- Vague prompt -->
  <rect x="28" y="80" width="330" height="262" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <rect x="46" y="96" width="144" height="22" rx="11" fill="#dc2626"/>
  <text x="118" y="111" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">WEAK BUG REPORT</text>
  <rect x="46" y="132" width="294" height="58" rx="9" fill="#ffffff" stroke="#fca5a5"/>
  <text x="60" y="158" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" fill="#991b1b">"My jump is broken!! Fix it."</text>
  <text x="60" y="178" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#b91c1c">No file · No error · No values</text>
  <text x="46" y="218" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#7f1d1d">What goes wrong:</text>
  <text x="46" y="240" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#991b1b">• Model invents missing variable names</text>
  <text x="46" y="260" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#991b1b">• Rewrites working input handlers</text>
  <text x="46" y="280" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#991b1b">• Hides typo bugs under giant patches</text>
  <text x="46" y="316" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#dc2626">Result: 2 new bugs for 1 fixed</text>

  <!-- Diagnostic packet -->
  <rect x="380" y="80" width="472" height="262" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="398" y="96" width="184" height="22" rx="11" fill="#0f766e"/>
  <text x="490" y="111" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">4-PART TRIAGE PACKET</text>

  <rect x="398" y="132" width="212" height="90" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="412" y="154" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#064e3b">1 · Repro Steps</text>
  <text x="412" y="174" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">“Press Space twice while</text>
  <text x="412" y="190" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">player stands on platform.”</text>
  <text x="412" y="210" font-family="JetBrains Mono, monospace" font-size="10" fill="#047857">Triggers bug 100% of time</text>

  <rect x="622" y="132" width="212" height="90" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="636" y="154" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#064e3b">2 · Console Error</text>
  <text x="636" y="174" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#b91c1c">TypeError at player.js:44</text>
  <text x="636" y="190" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#b91c1c">onGround is undefined</text>
  <text x="636" y="210" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#047857">Exact file + line number</text>

  <rect x="398" y="234" width="212" height="90" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="412" y="256" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#064e3b">3 · Minimal Code</text>
  <text x="412" y="276" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">Paste ONLY the 15-line</text>
  <text x="412" y="292" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">updatePlayer() function.</text>
  <text x="412" y="312" font-family="JetBrains Mono, monospace" font-size="10" fill="#047857">Small context = sharp fix</text>

  <rect x="622" y="234" width="212" height="90" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="636" y="256" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#064e3b">4 · Verify Condition</text>
  <text x="636" y="276" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">Single jump lifts to -420,</text>
  <text x="636" y="292" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">double-tap midair ignored.</text>
  <text x="636" y="312" font-family="JetBrains Mono, monospace" font-size="10" fill="#047857">Done = test passes cleanly</text>
</svg>
