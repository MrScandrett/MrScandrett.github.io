<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="cne-title">
  <title id="cne-title">Cosmic Epochs From Big Bang Nucleosynthesis to Modern Galaxies</title>
  <rect width="900" height="310" rx="16" fill="#0f172a"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Cosmic Thermal History: Temperature Falls as Matter Assembles</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#94a3b8">Expanding space stretches photon wavelengths — cooling the universe across 13.8 billion years from quarks to elements to galaxies.</text>

  <defs>
    <linearGradient id="cne-temp" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect x="34" y="76" width="832" height="10" rx="5" fill="url(#cne-temp)"/>

  <g transform="translate(30 104)" font-family="system-ui,sans-serif">
    <rect x="0" y="0" width="154" height="178" rx="12" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
    <text x="14" y="24" font-size="11" font-weight="800" fill="#fdba74">t ≈ 1 second</text>
    <text x="14" y="44" font-size="13" font-weight="800" fill="#ffffff">Hadron Freeze</text>
    <text x="14" y="66" font-size="10.5" fill="#cbd5e1">T ≈ 10¹⁰ K</text>
    <text x="14" y="88" font-size="10.5" fill="#94a3b8">Quarks already bound</text>
    <text x="14" y="103" font-size="10.5" fill="#94a3b8">into protons (p⁺) and</text>
    <text x="14" y="118" font-size="10.5" fill="#94a3b8">neutrons (n⁰) in hot</text>
    <text x="14" y="133" font-size="10.5" fill="#94a3b8">opaque particle soup.</text>

    <rect x="170" y="0" width="154" height="178" rx="12" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
    <text x="184" y="24" font-size="11" font-weight="800" fill="#fde047">t ≈ 3–20 min</text>
    <text x="184" y="44" font-size="13" font-weight="800" fill="#ffffff">BBN Fusion</text>
    <text x="184" y="66" font-size="10.5" fill="#cbd5e1">T ≈ 10⁹ K</text>
    <text x="184" y="88" font-size="10.5" fill="#94a3b8">First nuclei form:</text>
    <text x="184" y="103" font-size="10.5" fill="#fde68a" font-weight="700">~75% H + ~25% He</text>
    <text x="184" y="118" font-size="10.5" fill="#94a3b8">+ trace D &amp; Lithium.</text>
    <text x="184" y="133" font-size="10.5" fill="#94a3b8">Too cold for Carbon.</text>

    <rect x="340" y="0" width="154" height="178" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.8"/>
    <text x="354" y="24" font-size="11" font-weight="800" fill="#86efac">t ≈ 380,000 yr</text>
    <text x="354" y="44" font-size="13" font-weight="800" fill="#ffffff">Recombination</text>
    <text x="354" y="66" font-size="10.5" fill="#cbd5e1">T ≈ 3,000 K</text>
    <text x="354" y="88" font-size="10.5" fill="#94a3b8">Electrons join nuclei</text>
    <text x="354" y="103" font-size="10.5" fill="#94a3b8">into neutral atoms.</text>
    <text x="354" y="118" font-size="10.5" fill="#86efac" font-weight="700">CMB photons escape</text>
    <text x="354" y="133" font-size="10.5" fill="#94a3b8">and cross space.</text>

    <rect x="510" y="0" width="154" height="178" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="524" y="24" font-size="11" font-weight="800" fill="#93c5fd">t ≈ 400 Myr</text>
    <text x="524" y="44" font-size="13" font-weight="800" fill="#ffffff">First Stars</text>
    <text x="524" y="66" font-size="10.5" fill="#cbd5e1">Gravity collapses H/He</text>
    <text x="524" y="88" font-size="10.5" fill="#94a3b8">Stellar cores &amp;</text>
    <text x="524" y="103" font-size="10.5" fill="#94a3b8">supernovae forge C,</text>
    <text x="524" y="118" font-size="10.5" fill="#94a3b8">N, O, Fe — heavier</text>
    <text x="524" y="133" font-size="10.5" fill="#94a3b8">elements for planets.</text>

    <rect x="680" y="0" width="154" height="178" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="694" y="24" font-size="11" font-weight="800" fill="#7dd3fc">t = 13.8 Gyr</text>
    <text x="694" y="44" font-size="13" font-weight="800" fill="#ffffff">Present Cosmos</text>
    <text x="694" y="66" font-size="10.5" fill="#cbd5e1">CMB cooled to 2.73 K</text>
    <text x="694" y="88" font-size="10.5" fill="#94a3b8">Billions of galaxies;</text>
    <text x="694" y="103" font-size="10.5" fill="#94a3b8">stars recycle heavy</text>
    <text x="694" y="118" font-size="10.5" fill="#94a3b8">elements into rocky</text>
    <text x="694" y="133" font-size="10.5" fill="#94a3b8">planets &amp; biosphere.</text>
  </g>
</svg>
