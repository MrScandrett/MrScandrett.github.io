<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="kvap-title">
  <title id="kvap-title">K-12 Visual Art and Design Curriculum Progression</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="920" height="260" rx="16" fill="#f8fafc"/>
  <rect x="20" y="18" width="880" height="224" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="48" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#0f172a">K–12 Visual Art &amp; Design Progression Map</text>
  <text x="40" y="67" font-family="system-ui,sans-serif" font-size="12" fill="#475569">Six developmental stages from early light perception to spatial 3D systems and visual illusions</text>

  <g transform="translate(36 88)" font-family="system-ui,sans-serif">
    <rect x="0" y="0" width="130" height="132" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="12" y="22" font-size="11" font-weight="800" fill="#92400e">01 · K–2</text>
    <text x="12" y="42" font-size="12.5" font-weight="800" fill="#0f172a">Seeing &amp; Light</text>
    <text x="12" y="62" font-size="10.5" fill="#334155">Reflection, eye</text>
    <text x="12" y="76" font-size="10.5" fill="#334155">focus, pinhole</text>
    <text x="12" y="90" font-size="10.5" fill="#334155">camera basics</text>

    <path d="M130,66 L142,66" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M274,66 L286,66" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M418,66 L430,66" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M562,66 L574,66" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M706,66 L718,66" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="144" y="0" width="130" height="132" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="156" y="22" font-size="11" font-weight="800" fill="#9d174d">02 · 3–5</text>
    <text x="156" y="42" font-size="12.5" font-weight="800" fill="#0f172a">Color &amp; Form</text>
    <text x="156" y="62" font-size="10.5" fill="#334155">Complements,</text>
    <text x="156" y="76" font-size="10.5" fill="#334155">Cubist views,</text>
    <text x="156" y="90" font-size="10.5" fill="#334155">woodblock line</text>

    <rect x="288" y="0" width="130" height="132" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="300" y="22" font-size="11" font-weight="800" fill="#1e40af">03 · 6–8</text>
    <text x="300" y="42" font-size="12.5" font-weight="800" fill="#0f172a">Composition</text>
    <text x="300" y="62" font-size="10.5" fill="#334155">Dada collage,</text>
    <text x="300" y="76" font-size="10.5" fill="#334155">visual hierarchy,</text>
    <text x="300" y="90" font-size="10.5" fill="#334155">type &amp; grids</text>

    <rect x="432" y="0" width="130" height="132" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="444" y="22" font-size="11" font-weight="800" fill="#166534">04 · 9–10</text>
    <text x="444" y="42" font-size="12.5" font-weight="800" fill="#0f172a">3D Space</text>
    <text x="444" y="62" font-size="10.5" fill="#334155">Origami math,</text>
    <text x="444" y="76" font-size="10.5" fill="#334155">PBR meshes,</text>
    <text x="444" y="90" font-size="10.5" fill="#334155">VR curation</text>

    <rect x="576" y="0" width="130" height="132" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="588" y="22" font-size="11" font-weight="800" fill="#5b21b6">05 · 10–12</text>
    <text x="588" y="42" font-size="12.5" font-weight="800" fill="#0f172a">Media Systems</text>
    <text x="588" y="62" font-size="10.5" fill="#334155">Photo layers,</text>
    <text x="588" y="76" font-size="10.5" fill="#334155">cel animation,</text>
    <text x="588" y="90" font-size="10.5" fill="#334155">audio-visuals</text>

    <rect x="720" y="0" width="130" height="132" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="732" y="22" font-size="11" font-weight="800" fill="#9a3412">06 · 11–12</text>
    <text x="732" y="42" font-size="12.5" font-weight="800" fill="#0f172a">Perception</text>
    <text x="732" y="62" font-size="10.5" fill="#334155">Gestalt clues,</text>
    <text x="732" y="76" font-size="10.5" fill="#334155">depth heuristics,</text>
    <text x="732" y="90" font-size="10.5" fill="#334155">visual proof</text>
  </g>
</svg>
