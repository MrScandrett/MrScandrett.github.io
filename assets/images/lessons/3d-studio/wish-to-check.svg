<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d">
<title id="t">From a vague wish to a checkable requirement</title>
<desc id="d">Four boxes in a row: a user's wish, the thing to measure, the test, and the pass line, using the tape-holder example.</desc>
<rect width="1000" height="420" fill="#ffffff"/>
<style>
.h{font:800 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
.k{font:800 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f766e;letter-spacing:1.5px}
.b{font:500 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1e293b}
.s{font:500 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
.q{font:italic 600 18px Georgia,serif;fill:#7c2d12}
</style>
<text x="40" y="44" class="h">A wish is where requirements start, not where they end</text>
<g>
<rect x="30" y="80" width="215" height="250" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="48" y="108" class="k">1 · THE WISH</text>
<text x="48" y="146" class="q">“It should hold</text>
<text x="48" y="170" class="q">my tape and not</text>
<text x="48" y="194" class="q">fall over.”</text>
<text x="48" y="236" class="s">Real, but you can't</text>
<text x="48" y="256" class="s">test it: hold how?</text>
<text x="48" y="276" class="s">fall over when?</text>
</g>
<path d="M252 205 h22" stroke="#0f766e" stroke-width="4"/><path d="M272 195 l14 10 l-14 10z" fill="#0f766e"/>
<g>
<rect x="292" y="80" width="215" height="250" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="310" y="108" class="k">2 · A NUMBER + UNIT</text>
<text x="310" y="146" class="b">Measure the user's</text>
<text x="310" y="168" class="b">own roll with calipers:</text>
<rect x="318" y="190" width="70" height="70" rx="35" fill="none" stroke="#0f172a" stroke-width="3"/>
<circle cx="353" cy="225" r="13" fill="none" stroke="#0f172a" stroke-width="2"/>
<rect x="404" y="190" width="22" height="70" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
<path d="M398 274 h34" stroke="#c2410c" stroke-width="2"/><path d="M398 268 v12 M432 268 v12" stroke="#c2410c" stroke-width="2"/>
<text x="440" y="279" class="s" fill="#c2410c">width</text>
<text x="310" y="306" class="b">19 mm wide · tilt 15°</text>
</g>
<path d="M514 205 h22" stroke="#0f766e" stroke-width="4"/><path d="M534 195 l14 10 l-14 10z" fill="#0f766e"/>
<g>
<rect x="554" y="80" width="215" height="250" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="572" y="108" class="k" style="fill:#1d4ed8">3 · A TEST ANYONE</text>
<text x="572" y="126" class="k" style="fill:#1d4ed8">CAN REPEAT</text>
<text x="572" y="160" class="b">Load the real roll.</text>
<text x="572" y="184" class="b">Raise the board to 15°</text>
<text x="572" y="208" class="b">(stop strip at the low</text>
<text x="572" y="232" class="b">edge so it can't slide).</text>
<text x="572" y="256" class="b">Hold 10 seconds.</text>
<text x="572" y="296" class="s">Same steps, every time.</text>
</g>
<path d="M776 205 h22" stroke="#0f766e" stroke-width="4"/><path d="M796 195 l14 10 l-14 10z" fill="#0f766e"/>
<g>
<rect x="816" y="80" width="160" height="250" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="832" y="108" class="k" style="fill:#15803d">4 · PASS LINE</text>
<text x="832" y="150" class="b">PASS if it</text>
<text x="832" y="174" class="b">stays upright</text>
<text x="832" y="198" class="b">with the roll</text>
<text x="832" y="222" class="b">seated.</text>
<text x="832" y="262" class="b">FAIL if it tips</text>
<text x="832" y="286" class="b">or the roll</text>
<text x="832" y="310" class="b">falls out.</text>
</g>
<rect x="30" y="350" width="946" height="48" rx="12" fill="#0f766e"/>
<text x="50" y="381" style="font:700 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#ffffff">Requirement: “Holds a 19 mm roll of tape and doesn't tip on a 15° slope.” Two people running the test get the same answer.</text>
</svg>
