<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
<title id="t">What goes in a Trio portfolio</title>
<desc id="d">A portfolio page for one object with six panels: plan, editable file, export, test evidence for each Trio trait, before and after revision, and reflection.</desc>
<rect width="1000" height="560" fill="#ffffff"/>
<style>
.h{font:800 19px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
.k{font:800 13px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:1.2px}
.b{font:500 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1e293b}
.s{font:500 12.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
</style>
<text x="30" y="38" class="h">One portfolio page per object: claim → evidence, for every trait it carries</text>
<rect x="20" y="55" width="960" height="485" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<g>
<rect x="40" y="75" width="290" height="200" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/>
<text x="56" y="100" class="k" fill="#0f766e">1 · PLAN</text>
<rect x="56" y="115" width="120" height="90" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/>
<path d="M70 190 h90 M70 190 v-50 h40 l20 -20 h30 v70" fill="none" stroke="#0f172a" stroke-width="2"/>
<path d="M70 200 h90" stroke="#c2410c" stroke-width="1.5"/><text x="96" y="217" class="s" fill="#c2410c">64 mm</text>
<text x="190" y="130" class="b">Trio plan</text>
<text x="190" y="150" class="s">which object shows</text>
<text x="190" y="166" class="s">which trait</text>
<text x="190" y="194" class="b">Sketch with</text>
<text x="190" y="212" class="b">dimensions</text>
<text x="56" y="250" class="s">+ user's requirements (number, unit, test)</text>
</g>
<g>
<rect x="355" y="75" width="290" height="200" rx="12" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
<text x="371" y="100" class="k" fill="#1d4ed8">2 · EDITABLE FILE</text>
<rect x="371" y="118" width="70" height="86" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="381" y="168" class="s">.blend</text>
<rect x="451" y="118" width="70" height="86" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="458" y="160" class="s">.workbench</text><text x="466" y="176" class="s">.json</text>
<rect x="531" y="118" width="96" height="86" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="540" y="160" class="s">Tinkercad /</text><text x="540" y="176" class="s">Onshape link</text>
<text x="371" y="232" class="s">The file you can still change, so the</text>
<text x="371" y="250" class="s">next person (or you) can make version 3.</text>
</g>
<g>
<rect x="670" y="75" width="290" height="200" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
<text x="686" y="100" class="k" fill="#7c3aed">3 · EXPORT + SLICE</text>
<rect x="686" y="118" width="70" height="86" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
<text x="702" y="166" class="s">.stl</text>
<rect x="766" y="118" width="178" height="86" rx="6" fill="#fff" stroke="#7c3aed"/>
<text x="776" y="140" class="s">Slicer record</text>
<text x="776" y="160" class="s">layer 0.2 · walls 3</text>
<text x="776" y="178" class="s">supports off at gaps</text>
<text x="776" y="196" class="s">est. 1 h 20 min · 24 g</text>
<text x="686" y="232" class="s">What the printer actually got, and</text>
<text x="686" y="250" class="s">the settings to print it again.</text>
</g>
<g>
<rect x="40" y="295" width="605" height="160" rx="12" fill="#fff" stroke="#b45309" stroke-width="2"/>
<text x="56" y="320" class="k" fill="#b45309">4 · TEST EVIDENCE FOR EACH TRAIT IT CARRIES</text>
<rect x="56" y="335" width="180" height="104" rx="8" fill="#fff7ed" stroke="#b45309"/>
<text x="68" y="358" class="b">Moves</text>
<text x="68" y="380" class="s">20 tries, tally marks</text>
<text x="68" y="398" class="s">or a short video;</text>
<text x="68" y="416" class="s">nothing separated</text>
<rect x="251" y="335" width="180" height="104" rx="8" fill="#fff7ed" stroke="#b45309"/>
<text x="263" y="358" class="b">Useful</text>
<text x="263" y="380" class="s">user test record:</text>
<text x="263" y="398" class="s">named user, job done,</text>
<text x="263" y="416" class="s">no tip, bend or drop</text>
<rect x="446" y="335" width="183" height="104" rx="8" fill="#fff7ed" stroke="#b45309"/>
<text x="458" y="358" class="b">Likeness</text>
<path d="M560 420 q-10 -40 15 -50 q25 -10 35 20 q8 25 -15 30z" fill="#0f172a"/>
<text x="458" y="380" class="s">silhouette photo +</text>
<text x="458" y="398" class="s">“3 of 3 named it</text>
<text x="458" y="416" class="s">in 3 s”</text>
</g>
<g>
<rect x="670" y="295" width="290" height="160" rx="12" fill="#fff" stroke="#be123c" stroke-width="2"/>
<text x="686" y="320" class="k" fill="#be123c">5 · BEFORE → AFTER</text>
<rect x="686" y="335" width="100" height="70" rx="6" fill="#ffe4e6" stroke="#be123c"/>
<text x="712" y="375" class="s">v1 photo</text>
<path d="M792 370 h22" stroke="#be123c" stroke-width="3"/><path d="M812 362 l10 8 l-10 8z" fill="#be123c"/>
<rect x="828" y="335" width="116" height="70" rx="6" fill="#ffe4e6" stroke="#be123c"/>
<text x="860" y="375" class="s">v2 photo</text>
<text x="686" y="428" class="s">What changed, and which test</text>
<text x="686" y="444" class="s">result or feedback made you change it.</text>
</g>
<rect x="40" y="472" width="920" height="52" rx="12" fill="#0f766e"/>
<text x="58" y="503" style="font:700 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff">6 · Reflection + self-assessment: which trait is strongest, which feedback you acted on, what version 3 would change.</text>
</svg>
