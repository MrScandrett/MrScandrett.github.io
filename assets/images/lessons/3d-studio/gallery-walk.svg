<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
<title id="t">Gallery walk layout</title>
<desc id="d">Six stations around a room, each with the object, a silhouette card, the portfolio and a feedback sheet. Small groups rotate clockwise every few minutes; the designer stays silent and takes notes.</desc>
<rect width="1000" height="520" fill="#ffffff"/>
<style>
.h{font:800 19px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
.b{font:600 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1e293b}
.s{font:500 12.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
.n{font:800 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#ffffff}
</style>
<text x="30" y="38" class="h">Gallery walk: the work speaks first, the designer listens</text>
<rect x="30" y="60" width="600" height="430" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<path d="M150 160 C 330 95, 330 95, 510 160 C 575 270, 575 290, 510 400 C 330 465, 330 465, 150 400 C 85 290, 85 270, 150 160" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="10 8"/>
<path d="M266 121 l-16 -9 v18z" fill="#0f766e" transform="rotate(-12 258 121)"/>
<path d="M395 438 l16 -9 v18z" fill="#0f766e" transform="rotate(-12 403 438)"/>
<g>
<circle cx="150" cy="160" r="34" fill="#0f766e"/><text x="144" y="166" class="n">1</text>
<circle cx="330" cy="105" r="34" fill="#0f766e"/><text x="324" y="111" class="n">2</text>
<circle cx="510" cy="160" r="34" fill="#0f766e"/><text x="504" y="166" class="n">3</text>
<circle cx="510" cy="400" r="34" fill="#0f766e"/><text x="504" y="406" class="n">4</text>
<circle cx="330" cy="455" r="34" fill="#0f766e"/><text x="324" y="461" class="n">5</text>
<circle cx="150" cy="400" r="34" fill="#0f766e"/><text x="144" y="406" class="n">6</text>
</g>
<text x="250" y="270" class="b">Groups of 3–4 rotate</text>
<text x="250" y="290" class="b">clockwise on a timer</text>
<text x="250" y="312" class="s">(about 4 minutes a station)</text>
<rect x="660" y="60" width="315" height="250" rx="16" fill="#fff" stroke="#0f766e" stroke-width="2"/>
<text x="680" y="90" class="b">At every station</text>
<rect x="680" y="106" width="60" height="50" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
<text x="752" y="128" class="s">the object(s), ready to</text><text x="752" y="145" class="s">handle and test</text>
<rect x="680" y="166" width="60" height="50" rx="6" fill="#0f172a"/>
<text x="752" y="188" class="s">a silhouette card</text><text x="752" y="205" class="s">(face-down until flipped)</text>
<rect x="680" y="226" width="60" height="50" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="752" y="248" class="s">the portfolio page(s)</text><text x="752" y="265" class="s">+ a feedback sheet</text>
<rect x="660" y="330" width="315" height="160" rx="16" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="680" y="360" class="b">Each visitor writes one of each</text>
<text x="680" y="390" class="b" style="fill:#0f766e">I notice…</text><text x="770" y="390" class="s">what you can see or test</text>
<text x="680" y="420" class="b" style="fill:#1d4ed8">I wonder…</text><text x="770" y="420" class="s">a real question</text>
<text x="680" y="450" class="b" style="fill:#b45309">What if…</text><text x="770" y="450" class="s">one idea to try next</text>
<text x="680" y="476" class="s">Kind · specific · helpful</text>
</svg>
