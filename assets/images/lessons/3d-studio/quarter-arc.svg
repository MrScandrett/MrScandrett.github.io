<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
<title id="t">The quarter at a glance</title>
<desc id="d">Nine weeks in five phases: see and measure, make it move and work, make it look like something, test with users and revise, and the showcase. Four checkpoints feed the portfolio. The printer queue starts light, peaks in weeks 6 to 8, and empties before the showcase.</desc>
<rect width="1000" height="380" fill="#ffffff"/>
<style>
.h{font:800 19px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
.w{font:700 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}
.p{font:800 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#ffffff}
.s{font:500 12.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
.c{font:800 12.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#b45309}
</style>
<text x="30" y="36" class="h">Nine weeks, 27 class days (Mon · Wed · Fri), one Trio portfolio</text>
<g class="w">
<text x="62" y="70" class="w">Wk 1</text><text x="166" y="70" class="w">Wk 2</text><text x="270" y="70" class="w">Wk 3</text><text x="374" y="70" class="w">Wk 4</text><text x="478" y="70" class="w">Wk 5</text><text x="582" y="70" class="w">Wk 6</text><text x="686" y="70" class="w">Wk 7</text><text x="790" y="70" class="w">Wk 8</text><text x="894" y="70" class="w">Wk 9</text>
</g>
<rect x="40" y="82" width="206" height="44" rx="8" fill="#0f766e"/><text x="52" y="109" class="p">1 · See &amp; measure</text>
<rect x="250" y="82" width="206" height="44" rx="8" fill="#1d4ed8"/><text x="262" y="109" class="p">2 · Make it move &amp; work</text>
<rect x="460" y="82" width="206" height="44" rx="8" fill="#7c3aed"/><text x="472" y="109" class="p">3 · Make it a likeness</text>
<rect x="670" y="82" width="206" height="44" rx="8" fill="#b45309"/><text x="682" y="109" class="p">4 · Test with users, revise</text>
<rect x="880" y="82" width="100" height="44" rx="8" fill="#be123c"/><text x="892" y="109" class="p">5 · Showcase</text>
<g stroke="#e2e8f0" stroke-width="1.5">
<path d="M144 135 V300"/><path d="M248 135 V300"/><path d="M352 135 V300"/><path d="M456 135 V300"/><path d="M560 135 V300"/><path d="M664 135 V300"/><path d="M768 135 V300"/><path d="M872 135 V300"/>
</g>
<text x="40" y="160" class="s">Checkpoints → portfolio</text>
<g>
<path d="M238 150 l8 -10 l8 10 l-8 10z" fill="#b45309"/><text x="196" y="182" class="c">CP1 plan</text>
<path d="M446 150 l8 -10 l8 10 l-8 10z" fill="#b45309"/><text x="388" y="182" class="c">CP2 moves</text>
<path d="M654 150 l8 -10 l8 10 l-8 10z" fill="#b45309"/><text x="606" y="182" class="c">CP3 v1 printed</text>
<path d="M862 150 l8 -10 l8 10 l-8 10z" fill="#b45309"/><text x="790" y="182" class="c">CP4 portfolio draft</text>
</g>
<text x="40" y="214" class="s">Printer queue (relative load)</text>
<path d="M40 300 L144 296 L248 280 L352 262 L456 258 L560 246 L664 222 L768 218 L872 236 L980 300 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="150" y="292" class="s">combs + test coupons</text>
<text x="560" y="214" class="s">v1 prints</text>
<text x="770" y="210" class="s">v2 prints</text>
<text x="884" y="290" class="s">queue closes</text>
<path d="M40 300 H980" stroke="#94a3b8" stroke-width="2"/>
<text x="40" y="335" class="s">Every Friday is Study Hall: share progress, get feedback, finish strong. Plan the queue so the last full print is done by Wednesday of Week 8.</text>
<text x="40" y="358" class="s">Original ClassroomOS teaching diagram. The queue curve is a planning shape, not measured data.</text>
</svg>
