<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t d">
<title id="t">The tilt test and why things tip</title>
<desc id="d">Left: a holder on a board raised to 15 degrees with a stop strip. Right: the tipping rule; an object tips when the line straight down from its centre of mass passes outside its base.</desc>
<rect width="1000" height="480" fill="#ffffff"/>
<style>
.h{font:800 19px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
.b{font:500 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1e293b}
.s{font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
.m{font:700 16px ui-monospace,Menlo,Consolas,monospace;fill:#0f172a}
</style>
<text x="30" y="40" class="h">Test it: a 15° tilt board</text>
<path d="M40 400 L470 400" stroke="#94a3b8" stroke-width="3"/>
<g transform="rotate(-15 60 400)">
<rect x="60" y="388" width="420" height="12" fill="#d6a46b" stroke="#7c4a12" stroke-width="2"/>
<rect x="110" y="368" width="14" height="20" fill="#475569"/>
<rect x="128" y="268" width="120" height="120" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
<circle cx="188" cy="300" r="34" fill="#fff" stroke="#0f172a" stroke-width="3"/>
<circle cx="188" cy="300" r="12" fill="none" stroke="#0f172a" stroke-width="2"/>
</g>
<path d="M180 400 A 120 120 0 0 0 175.9 369" fill="none" stroke="#c2410c" stroke-width="2.5"/>
<text x="185" y="392" class="m" style="fill:#c2410c">15°</text>
<text x="70" y="445" class="s">stop strip (tape or a ruler) so it can't slide</text>
<path d="M150 432 L128 385" stroke="#475569" stroke-width="1.5"/>
<text x="250" y="90" class="b">Check the angle with a</text>
<text x="250" y="110" class="b">protractor or a phone</text>
<text x="250" y="130" class="b">level app. Raise slowly.</text>
<text x="250" y="160" class="b">Pass: upright for 10 s</text>
<text x="250" y="180" class="b">with the real load in it.</text>
<path d="M520 60 V450" stroke="#e2e8f0" stroke-width="2"/>
<text x="550" y="40" class="h">Why it tips: centre of mass vs. base</text>
<g transform="rotate(-25 640 380)">
<rect x="640" y="230" width="90" height="150" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
<circle cx="685" cy="305" r="7" fill="#0f172a"/>
<path d="M640 380 h90" stroke="#0f766e" stroke-width="5"/>
</g>
<path d="M649 293 V383" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="640" cy="380" r="5" fill="#be123c"/>
<path d="M590 383 H790" stroke="#94a3b8" stroke-width="3"/>
<text x="560" y="430" class="s">dashed line from the centre of mass lands</text>
<text x="560" y="448" class="s">inside the base → it rocks back. Outside → it tips.</text>
<rect x="800" y="80" width="180" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="816" y="110" class="b">Tipping angle</text>
<text x="816" y="145" class="m">tan θ = (b ÷ 2) ÷ h</text>
<text x="816" y="180" class="s">b = base width in</text>
<text x="816" y="198" class="s">the tilt direction</text>
<text x="816" y="222" class="s">h = height of the</text>
<text x="816" y="240" class="s">centre of mass</text>
<text x="816" y="272" class="s">Wide base, low mass</text>
<text x="816" y="290" class="s">→ bigger θ → steadier</text>
</svg>
