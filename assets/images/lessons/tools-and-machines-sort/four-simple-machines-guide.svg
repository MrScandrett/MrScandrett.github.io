<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="fsmg-title">
  <title id="fsmg-title">Four Classic Simple Machines</title>
  <rect width="880" height="340" rx="16" fill="#eff6ff"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#1e3a8a">Four Simple Machines That Multiply Effort</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#1d4ed8">Every hand tool trades extra distance for greater force — or changes which direction a push pulls.</text>

  <!-- Wheel & Axle -->
  <g transform="translate(24 78)">
    <rect width="196" height="236" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="16" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#1e40af">1. WHEEL &amp; AXLE</text>
    <circle cx="98" cy="108" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="6"/>
    <circle cx="98" cy="108" r="14" fill="#1e3a8a"/>
    <line x1="58" y1="108" x2="138" y2="108" stroke="#60a5fa" stroke-width="3"/>
    <line x1="98" y1="68" x2="98" y2="148" stroke="#60a5fa" stroke-width="3"/>
    <text x="16" y="180" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Doorknob · Wagon Wheel</text>
    <text x="16" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Turning a wide rim rotates</text>
    <text x="16" y="215" font-family="system-ui,sans-serif" font-size="11" fill="#475569">the inner axle with high torque.</text>
  </g>

  <!-- Inclined Plane -->
  <g transform="translate(236 78)">
    <rect width="196" height="236" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="16" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#1e40af">2. INCLINED PLANE</text>
    <polygon points="30,144 166,144 166,86" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <rect x="86" y="90" width="28" height="20" rx="3" transform="rotate(-23 100 100)" fill="#2563eb"/>
    <line x1="56" y1="126" x2="88" y2="112" stroke="#f97316" stroke-width="3.5"/>
    <text x="16" y="180" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Ramp · Wedge · Screw</text>
    <text x="16" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Spreads a steep lift over a</text>
    <text x="16" y="215" font-family="system-ui,sans-serif" font-size="11" fill="#475569">gentle slope to lower force.</text>
  </g>

  <!-- Lever -->
  <g transform="translate(448 78)">
    <rect width="196" height="236" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="16" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#1e40af">3. LEVER</text>
    <polygon points="94,146 112,114 130,146" fill="#475569"/>
    <rect x="28" y="102" width="144" height="10" rx="4" transform="rotate(-10 112 114)" fill="#f59e0b"/>
    <circle cx="154" cy="96" r="14" fill="#334155"/>
    <path d="M40,68 L40,94" stroke="#ef4444" stroke-width="3.5"/>
    <polygon points="40,101 34,90 46,90" fill="#ef4444"/>
    <text x="16" y="180" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Seesaw · Crowbar · Hammer</text>
    <text x="16" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Long handle pivots on a</text>
    <text x="16" y="215" font-family="system-ui,sans-serif" font-size="11" fill="#475569">fulcrum to lift heavy loads.</text>
  </g>

  <!-- Pulley -->
  <g transform="translate(660 78)">
    <rect width="196" height="236" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="16" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#1e40af">4. PULLEY</text>
    <line x1="56" y1="62" x2="140" y2="62" stroke="#334155" stroke-width="5"/>
    <line x1="98" y1="62" x2="98" y2="86" stroke="#475569" stroke-width="3"/>
    <circle cx="98" cy="88" r="18" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>
    <path d="M80,88 L80,146 M116,88 L116,132" stroke="#d97706" stroke-width="3.5"/>
    <rect x="68" y="126" width="24" height="22" rx="3" fill="#2563eb"/>
    <polygon points="116,144 110,132 122,132" fill="#ef4444"/>
    <text x="16" y="180" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Flagpole · Crane Hook</text>
    <text x="16" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Grooved wheel redirects</text>
    <text x="16" y="215" font-family="system-ui,sans-serif" font-size="11" fill="#475569">downward pull to lift cargo up.</text>
  </g>
</svg>
