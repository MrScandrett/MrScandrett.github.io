<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="pv-par-title pv-par-desc">
  <title id="pv-par-title">Four Patterns of Hebrew Parallelism in Proverbs</title>
  <desc id="pv-par-desc">Diagram comparing Antithetic (15:1 contrast), Synonymous (16:18 intensified echo), Synthetic (27:17 thought completion), and Emblematic (25:11 visual simile) biblical parallelism.</desc>
  <rect width="880" height="390" rx="18" fill="#fffdf8"/>
  <text x="28" y="34" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#2a2723">How Hebrew Wisdom Poetry Makes Music: Parallelism</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6d675d">Instead of end-rhyme, Proverbs pairs Line A with Line B so the second thought contrasts, sharpens, completes, or pictures the first</text>

  <!-- 1: Antithetic -->
  <rect x="28" y="76" width="404" height="136" rx="14" fill="#fff" stroke="#d8cfc0" stroke-width="1.6"/>
  <rect x="44" y="90" width="144" height="22" rx="11" fill="#7d344b"/>
  <text x="116" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">1 · ANTITHETIC (A ↔ B)</text>
  <text x="200" y="105" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#7d344b">Contrast clarifies wisdom</text>
  <text x="44" y="138" font-family="Georgia, serif" font-size="13.5" fill="#166534">A: “A soft answer turneth away wrath:”</text>
  <text x="44" y="162" font-family="Georgia, serif" font-size="13.5" fill="#991b1b">B: “but grievous words stir up anger.”</text>
  <text x="44" y="194" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#6d675d">Proverbs 15:1 · Keyword clue: “but” separates opposite paths</text>

  <!-- 2: Synonymous -->
  <rect x="448" y="76" width="404" height="136" rx="14" fill="#fff" stroke="#d8cfc0" stroke-width="1.6"/>
  <rect x="464" y="90" width="152" height="22" rx="11" fill="#315a70"/>
  <text x="540" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">2 · SYNONYMOUS (A ≈ A+)</text>
  <text x="628" y="105" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#315a70">Second line deepens echo</text>
  <text x="464" y="138" font-family="Georgia, serif" font-size="13.5" fill="#1e3a8a">A: “Pride goeth before destruction,”</text>
  <text x="464" y="162" font-family="Georgia, serif" font-size="13.5" fill="#0369a1">B: “and an haughty spirit before a fall.”</text>
  <text x="464" y="194" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#6d675d">Proverbs 16:18 · Moves from outer destruction to concrete fall</text>

  <!-- 3: Synthetic -->
  <rect x="28" y="228" width="404" height="136" rx="14" fill="#fff" stroke="#d8cfc0" stroke-width="1.6"/>
  <rect x="44" y="242" width="144" height="22" rx="11" fill="#2f7d6d"/>
  <text x="116" y="257" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">3 · SYNTHETIC (A → B)</text>
  <text x="200" y="257" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2f7d6d">Line B completes the idea</text>
  <text x="44" y="290" font-family="Georgia, serif" font-size="13.5" fill="#065f46">A: “Iron sharpeneth iron;”</text>
  <text x="44" y="314" font-family="Georgia, serif" font-size="13.5" fill="#047857">B: “so a man sharpeneth the countenance of his friend.”</text>
  <text x="44" y="346" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#6d675d">Proverbs 27:17 · Applies craft image to mutual growth</text>

  <!-- 4: Emblematic -->
  <rect x="448" y="228" width="404" height="136" rx="14" fill="#fff" stroke="#d8cfc0" stroke-width="1.6"/>
  <rect x="464" y="242" width="152" height="22" rx="11" fill="#a3782f"/>
  <text x="540" y="257" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">4 · EMBLEMATIC (A ⇄ 🖼️)</text>
  <text x="628" y="257" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8a4b12">Idea paired with visible picture</text>
  <text x="464" y="290" font-family="Georgia, serif" font-size="13.5" fill="#78350f">A: “A word fitly spoken”</text>
  <text x="464" y="314" font-family="Georgia, serif" font-size="13.5" fill="#92400e">B: “is like apples of gold in pictures of silver.”</text>
  <text x="464" y="346" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#6d675d">Proverbs 25:11 · Makes timeless speech easy to remember</text>
</svg>
