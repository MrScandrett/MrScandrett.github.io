<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="pv-arch-title pv-arch-desc">
  <title id="pv-arch-title">The Architecture of Proverbs: Seven Collections and Two Bookends</title>
  <desc id="pv-arch-desc">Structural overview diagram of the Book of Proverbs showing Lady Wisdom's opening framing speeches (1-9), Solomonic couplets (10-22), Wise Sayings (22-24), Hezekiah's scribes (25-29), Agur and Lemuel (30-31:9), and the closing acrostic poem (31:10-31).</desc>
  <rect width="880" height="380" rx="18" fill="#fffdf8"/>
  <text x="28" y="34" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#2a2723">A Book With Many Hands: The Seven Sections of Proverbs</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6d675d">Openings and closings frame hundreds of gathered proverbs between two living portraits of Wisdom</text>

  <!-- Opening Bookend Banner -->
  <path d="M 102 80 L 102 68 L 778 68 L 778 80" fill="none" stroke="#8a4b12" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="290" y="58" width="300" height="20" rx="10" fill="#8a4b12"/>
  <text x="440" y="72" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">BOOKENDS: LADY WISDOM (Ch. 1–9) ↔ ESHET CHAYIL (Ch. 31)</text>

  <!-- 1: Ch 1-9 -->
  <rect x="28" y="96" width="194" height="122" rx="12" fill="#f0f5f8" stroke="#315a70" stroke-width="1.8"/>
  <text x="42" y="120" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#315a70">1 · Ch. 1:1–9:18</text>
  <text x="42" y="140" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1f2937">Parent &amp; Lady Wisdom</text>
  <text x="42" y="162" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">10 speeches urging a young</text>
  <text x="42" y="178" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">reader to seek Wisdom over</text>
  <text x="42" y="194" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">shortcuts (Ch. 8 at Creation).</text>

  <!-- 2: Ch 10-22 -->
  <rect x="236" y="96" width="204" height="122" rx="12" fill="#fbf3f6" stroke="#7d344b" stroke-width="1.8"/>
  <text x="250" y="120" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#7d344b">2 · Ch. 10:1–22:16</text>
  <text x="250" y="140" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1f2937">Proverbs of Solomon I</text>
  <text x="250" y="162" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">375 short couplets comparing</text>
  <text x="250" y="178" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">wise vs. foolish speech, work,</text>
  <text x="250" y="194" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">justice, and family daily.</text>

  <!-- 3: Ch 22-24 -->
  <rect x="454" y="96" width="194" height="122" rx="12" fill="#fef8ec" stroke="#a3782f" stroke-width="1.8"/>
  <text x="468" y="120" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#a3782f">3–4 · Ch. 22:17–24:34</text>
  <text x="468" y="140" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1f2937">Sayings of the Wise</text>
  <text x="468" y="162" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">30 numbered teachings in</text>
  <text x="468" y="178" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">dialogue with broader Ancient</text>
  <text x="468" y="194" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">Near Eastern wisdom scribes.</text>

  <!-- 5: Ch 25-29 -->
  <rect x="662" y="96" width="190" height="122" rx="12" fill="#f7f2ef" stroke="#87482f" stroke-width="1.8"/>
  <text x="676" y="120" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#87482f">5 · Ch. 25–29</text>
  <text x="676" y="140" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1f2937">Hezekiah’s Scribes</text>
  <text x="676" y="162" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">Solomon sayings “copied</text>
  <text x="676" y="178" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">out” ~700 BCE — packed with</text>
  <text x="676" y="194" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">vivid imagery &amp; ironies.</text>

  <!-- Row 2: Agur, Lemuel, Acrostic, Canonical dialogue -->
  <rect x="28" y="234" width="268" height="120" rx="12" fill="#f3f3f9" stroke="#50547b" stroke-width="1.8"/>
  <text x="44" y="258" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#50547b">6 · Ch. 30:1–31:9</text>
  <text x="44" y="278" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1f2937">Agur &amp; King Lemuel’s Mother</text>
  <text x="44" y="300" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">Numerical riddles (“three things... yea,</text>
  <text x="44" y="316" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">four”) + royal counsel to speak up for</text>
  <text x="44" y="332" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">the voiceless and judge fairly.</text>

  <rect x="310" y="234" width="266" height="120" rx="12" fill="#f6f1f8" stroke="#67446f" stroke-width="1.8"/>
  <text x="326" y="258" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#67446f">7 · Ch. 31:10–31</text>
  <text x="326" y="278" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1f2937">Acrostic Ode (Eshet Chayil)</text>
  <text x="326" y="300" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">22 verses matching Aleph → Tav, showing</text>
  <text x="326" y="316" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">Lady Wisdom embodied in household skill,</text>
  <text x="326" y="332" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">mercy to the poor, and courage.</text>

  <rect x="590" y="234" width="262" height="120" rx="12" fill="#2a2723"/>
  <text x="606" y="258" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#fbbf24">READING RULE</text>
  <text x="606" y="280" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fffdf8">Proverb ≠ Unconditional Law</text>
  <text x="606" y="302" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#e5dfd5">Paired with Job and Ecclesiastes, a proverb</text>
  <text x="606" y="318" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#e5dfd5">names the wise pattern — even when suffering</text>
  <text x="606" y="334" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#e5dfd5">or timing complicates simple outcomes.</text>
</svg>
