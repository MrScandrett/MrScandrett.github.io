<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">The letter D as a font stores it: straight lines plus cubic Bézier curves</title>
  <desc id="d">A capital D outline. Square dots sit on the outline; round dots are off-curve handles joined to their square dots by thin lines. Four handles shape the outer bowl and four shape the inner hole.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <path fill-rule="evenodd" fill="#dbeafe" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round"
    d="M120 60 L120 500 L250 500 C400 500 470 400 470 280 C470 160 400 60 250 60 Z M190 124 L245 124 C345 124 398 190 398 280 C398 370 345 436 245 436 L190 436 Z"/>
  <g stroke="#c2410c" stroke-width="2.5">
    <line x1="250" y1="500" x2="400" y2="500"/><line x1="470" y1="280" x2="470" y2="400"/>
    <line x1="470" y1="280" x2="470" y2="160"/><line x1="250" y1="60" x2="400" y2="60"/>
    <line x1="245" y1="124" x2="345" y2="124"/><line x1="398" y1="280" x2="398" y2="190"/>
    <line x1="398" y1="280" x2="398" y2="370"/><line x1="245" y1="436" x2="345" y2="436"/>
  </g>
  <g fill="#ffffff" stroke="#c2410c" stroke-width="3">
    <circle cx="400" cy="500" r="8"/><circle cx="470" cy="400" r="8"/><circle cx="470" cy="160" r="8"/><circle cx="400" cy="60" r="8"/>
    <circle cx="345" cy="124" r="8"/><circle cx="398" cy="190" r="8"/><circle cx="398" cy="370" r="8"/><circle cx="345" cy="436" r="8"/>
  </g>
  <g fill="#1d4ed8">
    <rect x="112" y="52" width="16" height="16"/><rect x="112" y="492" width="16" height="16"/><rect x="242" y="492" width="16" height="16"/>
    <rect x="462" y="272" width="16" height="16"/><rect x="242" y="52" width="16" height="16"/>
    <rect x="182" y="116" width="16" height="16"/><rect x="237" y="116" width="16" height="16"/><rect x="390" y="272" width="16" height="16"/>
    <rect x="237" y="428" width="16" height="16"/><rect x="182" y="428" width="16" height="16"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#0f172a">
    <rect x="560" y="70" width="18" height="18" fill="#1d4ed8"/>
    <text x="590" y="86" font-size="21">on-curve point</text>
    <circle cx="569" cy="129" r="9" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
    <text x="590" y="136" font-size="21">off-curve handle</text>
    <text x="560" y="200" font-size="21" font-weight="700">Whole letter: 10 points</text>
    <text x="560" y="228" font-size="21" font-weight="700">+ 8 handles.</text>
    <text x="560" y="276" font-size="19" fill="#334155">The bowl's handles line up</text>
    <text x="560" y="300" font-size="19" fill="#334155">across each square point,</text>
    <text x="560" y="324" font-size="19" fill="#334155">so the curves join with no kink.</text>
    <text x="560" y="372" font-size="19" fill="#334155">The same few numbers print</text>
    <text x="560" y="396" font-size="19" fill="#334155">the letter crisp at any size.</text>
  </g>
</svg>
