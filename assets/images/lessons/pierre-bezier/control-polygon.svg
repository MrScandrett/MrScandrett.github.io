<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-labelledby="t d">
  <title id="t">A cubic Bézier curve and its four control points</title>
  <desc id="d">The curve starts at P0 and ends at P3. It leaves P0 heading toward P1 and arrives at P3 coming from P2, but it does not pass through P1 or P2. The whole curve stays inside the shaded shape made by the four points.</desc>
  <rect width="840" height="470" fill="#ffffff"/>
  <path d="M90 390 L210 80 L630 80 L760 370 Z" fill="#fde7d4" stroke="none"/>
  <path d="M90 390 L210 80 L630 80 L760 370" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M90 390 C210 80 630 80 760 370" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/>
  <g fill="#1d4ed8"><circle cx="90" cy="390" r="12"/><circle cx="760" cy="370" r="12"/></g>
  <g fill="#ffffff" stroke="#1d4ed8" stroke-width="4"><circle cx="210" cy="80" r="11"/><circle cx="630" cy="80" r="11"/></g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#0f172a">
    <text x="40" y="430" font-size="24" font-weight="800">P0 start</text>
    <text x="150" y="58" font-size="24" font-weight="800">P1 handle</text>
    <text x="570" y="58" font-size="24" font-weight="800">P2 handle</text>
    <text x="700" y="415" font-size="24" font-weight="800">P3 end</text>
    <text x="300" y="250" font-size="19" fill="#9a3412">The curve stays inside the shaded</text>
    <text x="300" y="274" font-size="19" fill="#9a3412">shape (the "convex hull").</text>
    <text x="300" y="330" font-size="19" fill="#334155">Dashed line = control polygon.</text>
    <text x="300" y="354" font-size="19" fill="#334155">Move a handle and the curve follows.</text>
  </g>
</svg>
