<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="bfp-arc-title bfp-arc-desc">
  <title id="bfp-arc-title">Six Learning Stages Across One Unfolding Biblical Story</title>
  <desc id="bfp-arc-desc">Diagram mapping the six Bible Foundations Pathway stages across the biblical narrative spine from Creation and Covenant through Exodus, Kingdom and Exile, Jesus and the Gospels, the Early Church, and Wisdom and New Creation.</desc>
  <defs>
    <marker id="bfp-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="390" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">How All 32 Lessons Connect: Six Stages Across One Story</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Geography, manuscripts, worship, prophets, Gospels, and wisdom form one continuous map centered on Jesus</text>

  <!-- Stage 1 -->
  <rect x="28" y="78" width="262" height="128" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <rect x="44" y="92" width="84" height="20" rx="10" fill="#4f46e5"/>
  <text x="86" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">STAGE 1</text>
  <text x="44" y="134" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#1e1b4b">The Biblical World</text>
  <text x="44" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#312e81">Creation, Fall, maps, manuscripts,</text>
  <text x="44" y="170" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#312e81">and how Scripture reached us.</text>
  <text x="44" y="192" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#4338ca">Genesis · Scrolls · Bible Lands</text>

  <path d="M 290 142 L 306 142" stroke="#64748b" stroke-width="2" marker-end="url(#bfp-arr)"/>

  <!-- Stage 2 -->
  <rect x="309" y="78" width="262" height="128" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <rect x="325" y="92" width="84" height="20" rx="10" fill="#0f766e"/>
  <text x="367" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">STAGE 2</text>
  <text x="325" y="134" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#064e3b">Covenant &amp; Presence</text>
  <text x="325" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">Promise to Abraham, Exodus rescue,</text>
  <text x="325" y="170" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">Law, feasts, Tabernacle &amp; Temple.</text>
  <text x="325" y="192" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#047857">Exodus → Deuteronomy · Sanctuary</text>

  <path d="M 571 142 L 587 142" stroke="#64748b" stroke-width="2" marker-end="url(#bfp-arr)"/>

  <!-- Stage 3 -->
  <rect x="590" y="78" width="262" height="128" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="606" y="92" width="84" height="20" rx="10" fill="#d97706"/>
  <text x="648" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">STAGE 3</text>
  <text x="606" y="134" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#78350f">Israel, Kings &amp; Prophets</text>
  <text x="606" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">Judges, David, divided kingdom,</text>
  <text x="606" y="170" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">exile to Babylon, &amp; promised return.</text>
  <text x="606" y="192" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#b45309">Joshua–Kings · Isaiah–Daniel</text>

  <!-- Connector down to Stage 4 -->
  <path d="M 721 206 L 721 218 L 159 218 L 159 226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#bfp-arr)"/>

  <!-- Stage 4: Fulcrum -->
  <rect x="28" y="230" width="262" height="132" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.4"/>
  <rect x="44" y="244" width="144" height="20" rx="10" fill="#b91c1c"/>
  <text x="116" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">STAGE 4 · FULCRUM</text>
  <text x="44" y="286" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#7f1d1d">Jesus &amp; the Kingdom</text>
  <text x="44" y="306" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#991b1b">Sermon on the Mount, parables,</text>
  <text x="44" y="322" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#991b1b">Holy Week, cross, &amp; resurrection.</text>
  <text x="44" y="346" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#b91c1c">Matthew · Mark · Luke · John</text>

  <path d="M 290 296 L 306 296" stroke="#64748b" stroke-width="2" marker-end="url(#bfp-arr)"/>

  <!-- Stage 5 -->
  <rect x="309" y="230" width="262" height="132" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
  <rect x="325" y="244" width="84" height="20" rx="10" fill="#0369a1"/>
  <text x="367" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">STAGE 5</text>
  <text x="325" y="286" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#0c4a6e">Church &amp; Mission</text>
  <text x="325" y="306" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#075985">Pentecost, Roman roads, Paul’s</text>
  <text x="325" y="322" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#075985">letters, &amp; household churches.</text>
  <text x="325" y="346" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#0369a1">Acts · Epistles · Mediterranean</text>

  <path d="M 571 296 L 587 296" stroke="#64748b" stroke-width="2" marker-end="url(#bfp-arr)"/>

  <!-- Stage 6 -->
  <rect x="590" y="230" width="262" height="132" rx="14" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.8"/>
  <rect x="606" y="244" width="84" height="20" rx="10" fill="#7e22ce"/>
  <text x="648" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">STAGE 6</text>
  <text x="606" y="286" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#581c87">Wisdom &amp; New Creation</text>
  <text x="606" y="306" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#6b21a8">Psalms, Job, Proverbs, habits of</text>
  <text x="606" y="322" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#6b21a8">discipleship, &amp; Revelation’s hope.</text>
  <text x="606" y="346" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#7e22ce">Psalms · Proverbs · Revelation</text>
</svg>
