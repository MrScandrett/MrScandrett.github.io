<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">A computer is a connected system</title><desc id="desc">Follow data through input, processing, memory, storage and output.</desc><metadata>Original ClassroomOS instructional diagram. CC0 1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176b62"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176b62"/></marker></defs><rect width="1200" height="620" rx="20" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="54" font-size="34" fill="#17324d" font-weight="700" text-anchor="start">A computer is a connected system</text><text x="40" y="92" font-size="22" fill="#17324d" font-weight="400" text-anchor="start">Follow data through input, processing, memory, storage and output.</text><rect x="45" y="195" width="230" height="145" rx="16" fill="#e5f3ee" stroke="#688395" stroke-width="2"/><text x="67" y="235" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">INPUT</text><text x="67" y="274" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Keys, touch, mic</text><text x="67" y="305" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Data enters</text><rect x="390" y="195" width="420" height="145" rx="16" fill="#e5f3ee" stroke="#688395" stroke-width="2"/><text x="412" y="235" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">CPU · PROCESS</text><text x="412" y="274" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Execute instructions</text><text x="412" y="305" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Registers / cache nearby</text><rect x="925" y="195" width="230" height="145" rx="16" fill="#e5f3ee" stroke="#688395" stroke-width="2"/><text x="947" y="235" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">OUTPUT</text><text x="947" y="274" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Screen, sound</text><text x="947" y="305" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Results leave</text><path d="M280 270 L380 270" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)"/><path d="M820 270 L915 270" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)"/><rect x="390" y="390" width="420" height="140" rx="16" fill="#e5eefc" stroke="#688395" stroke-width="2"/><text x="412" y="430" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">RAM · WORKSPACE</text><text x="412" y="469" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Active programs and data</text><text x="412" y="500" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Lost when power is removed</text><path d="M600 345 L600 380" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="45" y="390" width="230" height="140" rx="16" fill="#fff0d9" stroke="#688395" stroke-width="2"/><text x="67" y="430" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">STORAGE</text><text x="67" y="469" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Saved files / apps</text><text x="67" y="500" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Persists power-off</text><path d="M280 460 L380 460" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="925" y="390" width="230" height="140" rx="16" fill="#eee9fc" stroke="#688395" stroke-width="2"/><text x="947" y="430" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">NETWORK</text><text x="947" y="469" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Wi-Fi / Ethernet</text><text x="947" y="500" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Other computers</text><path d="M820 460 L915 460" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="45" y="150" font-size="24" fill="#17324d" font-weight="400" text-anchor="start">The motherboard connects components. Power runs them; cooling removes heat.</text><text x="40" y="598" font-size="18" fill="#4d6377" font-weight="400" text-anchor="start">CLASSROOMOS · CC0 · Simplified teaching model; not a scale drawing</text></g></svg>