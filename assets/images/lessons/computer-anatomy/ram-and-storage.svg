<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Two places, two different jobs</title><desc id="desc">Predict: which version of a story will remain after shutdown?</desc><metadata>Original ClassroomOS instructional diagram. CC0 1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176b62"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176b62"/></marker></defs><rect width="1200" height="620" rx="20" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="54" font-size="34" fill="#17324d" font-weight="700" text-anchor="start">Two places, two different jobs</text><text x="40" y="92" font-size="22" fill="#17324d" font-weight="400" text-anchor="start">Predict: which version of a story will remain after shutdown?</text><rect x="45" y="135" width="525" height="195" rx="16" fill="#e5eefc" stroke="#688395" stroke-width="2"/><text x="67" y="175" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">RAM = working copy</text><text x="67" y="214" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Open a saved story into RAM.</text><text x="67" y="245" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Edit the current draft here.</text><text x="67" y="276" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Ordinary RAM needs power.</text><rect x="630" y="135" width="525" height="195" rx="16" fill="#fff0d9" stroke="#688395" stroke-width="2"/><text x="652" y="175" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">STORAGE = saved copy</text><text x="652" y="214" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">An SSD or hard disk keeps files.</text><text x="652" y="245" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Save to update the stored version.</text><text x="652" y="276" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Saved data stays when power is off.</text><path d="M560 370 L640 370" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)"/><text x="420" y="375" font-size="22" fill="#17324d" font-weight="700" text-anchor="start">SAVE</text><path d="M640 420 L560 420" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)"/><text x="660" y="427" font-size="22" fill="#17324d" font-weight="700" text-anchor="start">OPEN / LOAD</text><rect x="45" y="465" width="525" height="100" rx="16" fill="#fbe8e4" stroke="#688395" stroke-width="2"/><text x="67" y="505" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">POWER OFF → RAM CLEARS</text><rect x="630" y="465" width="525" height="100" rx="16" fill="#e5f3ee" stroke="#688395" stroke-width="2"/><text x="652" y="505" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">POWER OFF → FILE REMAINS</text><text x="40" y="598" font-size="18" fill="#4d6377" font-weight="400" text-anchor="start">CLASSROOMOS · CC0 · Simplified teaching model; not a scale drawing</text></g></svg>