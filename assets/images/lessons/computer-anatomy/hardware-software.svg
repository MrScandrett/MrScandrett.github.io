<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">From your app to physical circuits</title><desc id="desc">Software gives instructions; hardware carries them out.</desc><metadata>Original ClassroomOS instructional diagram. CC0 1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176b62"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176b62"/></marker></defs><rect width="1200" height="760" rx="20" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="54" font-size="34" fill="#17324d" font-weight="700" text-anchor="start">From your app to physical circuits</text><text x="40" y="92" font-size="22" fill="#17324d" font-weight="400" text-anchor="start">Software gives instructions; hardware carries them out.</text><rect x="210" y="130" width="780" height="95" rx="16" fill="#e5eefc" stroke="#688395" stroke-width="2"/><text x="232" y="170" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">APPLICATION · Browser, game, drawing app</text><rect x="210" y="260" width="780" height="95" rx="16" fill="#e5f3ee" stroke="#688395" stroke-width="2"/><text x="232" y="300" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">OPERATING SYSTEM · Memory, files, permissions</text><rect x="210" y="390" width="780" height="95" rx="16" fill="#eee9fc" stroke="#688395" stroke-width="2"/><text x="232" y="430" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">DRIVERS · Help the OS work with devices</text><rect x="210" y="520" width="780" height="95" rx="16" fill="#fff0d9" stroke="#688395" stroke-width="2"/><text x="232" y="560" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">HARDWARE · CPU, RAM, storage, GPU, devices</text><path d="M600 230 L600 253" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M600 360 L600 383" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M600 490 L600 513" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="210" y="660" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Firmware starts early setup and helps load the operating system.</text><text x="210" y="697" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Layers show responsibilities, not every instruction’s exact route.</text><text x="40" y="738" font-size="18" fill="#4d6377" font-weight="400" text-anchor="start">CLASSROOMOS · CC0 · Simplified teaching model; not a scale drawing</text></g></svg>