<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">The internet connects physical computers</title><desc id="desc">A simplified web trip: request outward, response back.</desc><metadata>Original ClassroomOS instructional diagram. CC0 1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176b62"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176b62"/></marker></defs><rect width="1200" height="640" rx="20" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="54" font-size="34" fill="#17324d" font-weight="700" text-anchor="start">The internet connects physical computers</text><text x="40" y="92" font-size="22" fill="#17324d" font-weight="400" text-anchor="start">A simplified web trip: request outward, response back.</text><rect x="40" y="155" width="260" height="150" rx="16" fill="#e5eefc" stroke="#688395" stroke-width="2"/><text x="62" y="195" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">YOUR DEVICE</text><text x="62" y="234" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Browser + OS</text><text x="62" y="265" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">CPU, RAM, adapter</text><rect x="470" y="155" width="260" height="150" rx="16" fill="#e5f3ee" stroke="#688395" stroke-width="2"/><text x="492" y="195" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">LOCAL ROUTER</text><text x="492" y="234" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Wi-Fi or Ethernet</text><text x="492" y="265" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Router</text><rect x="900" y="155" width="260" height="150" rx="16" fill="#fff0d9" stroke="#688395" stroke-width="2"/><text x="922" y="195" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">WEB SERVER</text><text x="922" y="234" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Physical computer</text><text x="922" y="265" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Website response</text><path d="M310 223 L460 223" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)"/><path d="M740 223 L890 223" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)"/><text x="335" y="195" font-size="22" fill="#17324d" font-weight="400" text-anchor="start">Request</text><text x="755" y="195" font-size="22" fill="#17324d" font-weight="400" text-anchor="start">Internet</text><path d="M890 280 L740 280" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)"/><path d="M460 280 L310 280" fill="none" stroke="#176b62" stroke-width="4" marker-end="url(#arrow)"/><text x="753" y="325" font-size="22" fill="#17324d" font-weight="400" text-anchor="start">Response</text><text x="322" y="325" font-size="22" fill="#17324d" font-weight="400" text-anchor="start">Response</text><rect x="40" y="395" width="530" height="135" rx="16" fill="#eee9fc" stroke="#688395" stroke-width="2"/><text x="62" y="435" font-size="28" fill="#17324d" font-weight="700" text-anchor="start">DNS · FIND AN ADDRESS</text><text x="62" y="474" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Domain name → address records</text><text x="62" y="505" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">A resolver helps locate the server.</text><rect x="630" y="395" width="530" height="135" rx="16" fill="#e5f3ee" stroke="#688395" stroke-width="2"/><text x="652" y="435" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">HTTPS · PROTECT THE CONNECTION</text><text x="652" y="474" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Encrypted data travels across networks.</text><text x="652" y="505" font-size="23" fill="#17324d" font-weight="400" text-anchor="start">Packets carry requests and responses.</text><text x="40" y="574" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">Wi-Fi can work locally even when the internet connection is down.</text><text x="40" y="618" font-size="18" fill="#4d6377" font-weight="400" text-anchor="start">CLASSROOMOS · CC0 · Simplified teaching model; not a scale drawing</text></g></svg>