<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="kal-alt-title kal-alt-desc">
  <title id="kal-alt-title">Kalimba Alternating Left-Right Tine Layout</title>
  <desc id="kal-alt-desc">Diagram of the eight central C-major kalimba tines arranged from left to right as 1-prime, 6, 4, 2, 1, 3, 5, 7, showing how climbing the scale alternates cleanly between the left thumb (even numbers and octave 1-prime) and right thumb (odd numbers).</desc>
  <rect width="860" height="330" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#0f172a" />
  <text x="38" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#bae6fd">ALTERNATING SCALE LAYOUT · LEFT THUMB VS. RIGHT THUMB</text>

  <!-- Left vs Right Badges -->
  <rect x="34" y="68" width="380" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text x="224" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e3a8a">LEFT THUMB ZONE (Tines 2 · 4 · 6 · 1′)</text>

  <rect x="446" y="68" width="380" height="30" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="636" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#92400e">RIGHT THUMB ZONE (Center 1 · 3 · 5 · 7)</text>

  <!-- 8 Tine Bars -->
  <!-- Order: 1' (C5), 6 (A4), 4 (F4), 2 (D4), 1 (C4), 3 (E4), 5 (G4), 7 (B4) -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <!-- 1' -->
    <rect x="44" y="108" width="80" height="104" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
    <text x="84" y="180" font-size="20" font-weight="800" fill="#1e3a8a">1′</text>
    <text x="84" y="200" font-size="11.5" font-weight="700" fill="#1d4ed8">C5 · Step 8</text>
    <!-- 6 -->
    <rect x="142" y="108" width="80" height="122" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
    <text x="182" y="198" font-size="20" font-weight="800" fill="#1e3a8a">6</text>
    <text x="182" y="218" font-size="11.5" font-weight="700" fill="#1d4ed8">A4 · Step 6</text>
    <!-- 4 -->
    <rect x="240" y="108" width="80" height="140" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
    <text x="280" y="216" font-size="20" font-weight="800" fill="#1e3a8a">4</text>
    <text x="280" y="236" font-size="11.5" font-weight="700" fill="#1d4ed8">F4 · Step 4</text>
    <!-- 2 -->
    <rect x="338" y="108" width="80" height="158" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
    <text x="378" y="234" font-size="20" font-weight="800" fill="#1e3a8a">2</text>
    <text x="378" y="254" font-size="11.5" font-weight="700" fill="#1d4ed8">D4 · Step 2</text>

    <!-- 1 (Center anchor) -->
    <rect x="442" y="108" width="80" height="172" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.4" />
    <text x="482" y="246" font-size="22" font-weight="800" fill="#7c2d12">1</text>
    <text x="482" y="268" font-size="11.5" font-weight="700" fill="#92400e">C4 · Root 1</text>
    <!-- 3 -->
    <rect x="540" y="108" width="80" height="150" rx="10" fill="#fef3c7" stroke="#b45306" stroke-width="2" />
    <text x="580" y="226" font-size="20" font-weight="800" fill="#7c2d12">3</text>
    <text x="580" y="246" font-size="11.5" font-weight="700" fill="#92400e">E4 · Step 3</text>
    <!-- 5 -->
    <rect x="638" y="108" width="80" height="132" rx="10" fill="#fef3c7" stroke="#b45306" stroke-width="2" />
    <text x="678" y="208" font-size="20" font-weight="800" fill="#7c2d12">5</text>
    <text x="678" y="228" font-size="11.5" font-weight="700" fill="#92400e">G4 · Step 5</text>
    <!-- 7 -->
    <rect x="736" y="108" width="80" height="114" rx="10" fill="#fef3c7" stroke="#b45306" stroke-width="2" />
    <text x="776" y="190" font-size="20" font-weight="800" fill="#7c2d12">7</text>
    <text x="776" y="210" font-size="11.5" font-weight="700" fill="#92400e">B4 · Step 7</text>
  </g>

  <!-- Alternating Scale Path (1 -> 2 -> 3 -> 4 -> 5 -> 6 -> 7 -> 1') -->
  <path d="M 482 140 L 378 140 L 580 132 L 280 132 L 678 124 L 182 124 L 776 116 L 84 116" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="5 3" />

  <text x="34" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">Scale secret: neighbor tines on the SAME side form thirds (1–3–5 = C major; 2–4–6 = D minor), so chords are just gliding one thumb across!</text>
</svg>