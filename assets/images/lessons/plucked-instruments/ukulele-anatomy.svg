<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="uke-anat-title uke-anat-desc">
  <title id="uke-anat-title">Ukulele Anatomy and High-G Re-Entrant Tuning</title>
  <desc id="uke-anat-desc">Diagram labeling the soprano ukulele's headstock, tuning pegs, bone nut, fingerboard, brass frets, sound hole, bridge, and saddle, paired with a pitch ladder comparing the re-entrant G4-C4-E4-A4 open string tuning.</desc>
  <rect width="860" height="360" rx="16" fill="#fffaf3" stroke="#d6c3aa" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#3b2314" />
  <text x="38" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fde68a">UKULELE ANATOMY · PARTS &amp; HIGH-G RE-ENTRANT TUNING</text>

  <!-- Ukulele Silhouette -->
  <!-- Headstock -->
  <path d="M 55 128 L 122 128 L 132 138 L 132 174 L 122 184 L 55 184 Q 44 156 55 128 Z" fill="#7c3f1d" stroke="#3b2314" stroke-width="2.2" />
  <!-- Tuning Pegs -->
  <g fill="#cbd5e1" stroke="#334155" stroke-width="1.5">
    <circle cx="72" cy="118" r="7" /><rect x="70" y="123" width="4" height="7" />
    <circle cx="104" cy="118" r="7" /><rect x="102" y="123" width="4" height="7" />
    <circle cx="72" cy="194" r="7" /><rect x="70" y="182" width="4" height="7" />
    <circle cx="104" cy="194" r="7" /><rect x="102" y="182" width="4" height="7" />
  </g>
  <!-- Neck & Fingerboard -->
  <rect x="132" y="138" width="246" height="36" fill="#432818" stroke="#2c1810" stroke-width="2" />
  <!-- Nut -->
  <rect x="132" y="138" width="7" height="36" fill="#fef3c7" stroke="#92400e" stroke-width="1" />
  <!-- Frets -->
  <g stroke="#d4d4d8" stroke-width="2">
    <line x1="168" y1="138" x2="168" y2="174" />
    <line x1="196" y1="138" x2="196" y2="174" />
    <line x1="222" y1="138" x2="222" y2="174" />
    <line x1="246" y1="138" x2="246" y2="174" />
    <line x1="268" y1="138" x2="268" y2="174" />
    <line x1="288" y1="138" x2="288" y2="174" />
    <line x1="306" y1="138" x2="306" y2="174" />
    <line x1="322" y1="138" x2="322" y2="174" />
  </g>
  <!-- Fret marker dots -->
  <circle cx="209" cy="156" r="2.6" fill="#fef3c7" />
  <circle cx="257" cy="156" r="2.6" fill="#fef3c7" />
  <circle cx="297" cy="156" r="2.6" fill="#fef3c7" />

  <!-- Body (figure-8 mahogany) -->
  <path d="M 332 132 C 332 94, 396 92, 424 114 C 446 130, 464 128, 486 106 C 530 68, 608 88, 608 156 C 608 224, 530 244, 486 206 C 464 184, 446 182, 424 198 C 396 220, 332 218, 332 180 Z" fill="#b45309" stroke="#5c2d0c" stroke-width="2.5" />
  <!-- Sound hole + rosette -->
  <circle cx="406" cy="156" r="32" fill="#2c1810" stroke="#fde68a" stroke-width="2.5" />
  <circle cx="406" cy="156" r="36" fill="none" stroke="#78350f" stroke-width="1.5" />
  <!-- Bridge & Saddle -->
  <rect x="498" y="130" width="16" height="52" rx="3" fill="#432818" stroke="#2c1810" stroke-width="1.5" />
  <rect x="502" y="134" width="4" height="44" rx="1" fill="#fef3c7" />
  <!-- Four Strings across nut to saddle -->
  <g stroke="#f8fafc" stroke-width="1.2" opacity="0.9">
    <line x1="135" y1="144" x2="504" y2="144" />
    <line x1="135" y1="152" x2="504" y2="152" />
    <line x1="135" y1="160" x2="504" y2="160" />
    <line x1="135" y1="168" x2="504" y2="168" />
  </g>

  <!-- Leader lines & part labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">
    <line x1="88" y1="110" x2="88" y2="80" stroke="#64748b" stroke-width="1.4" />
    <text x="88" y="75" text-anchor="middle">Tuning Pegs</text>

    <line x1="136" y1="136" x2="150" y2="96" stroke="#64748b" stroke-width="1.4" />
    <text x="155" y="92">Nut (Fret 0)</text>

    <line x1="234" y1="136" x2="234" y2="80" stroke="#64748b" stroke-width="1.4" />
    <text x="234" y="75" text-anchor="middle">Frets &amp; Fingerboard</text>

    <line x1="406" y1="120" x2="406" y2="80" stroke="#64748b" stroke-width="1.4" />
    <text x="406" y="75" text-anchor="middle">Sound Hole</text>

    <line x1="506" y1="130" x2="528" y2="80" stroke="#64748b" stroke-width="1.4" />
    <text x="532" y="75">Bridge &amp; Saddle</text>

    <line x1="88" y1="202" x2="88" y2="238" stroke="#64748b" stroke-width="1.4" />
    <text x="88" y="252" text-anchor="middle">Headstock</text>

    <line x1="250" y1="176" x2="250" y2="238" stroke="#64748b" stroke-width="1.4" />
    <text x="250" y="252" text-anchor="middle">Vibrating String Length</text>

    <line x1="458" y1="196" x2="458" y2="238" stroke="#64748b" stroke-width="1.4" />
    <text x="458" y="252" text-anchor="middle">Resonant Soundbox</text>
  </g>

  <!-- Right Panel: High-G Pitch Ladder -->
  <rect x="630" y="72" width="206" height="222" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.8" />
  <text x="646" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#7c2d12">HIGH-G TUNING (G–C–E–A)</text>
  <text x="646" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Order from chin down vs. pitch:</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700">
    <rect x="646" y="128" width="174" height="32" rx="7" fill="#fef3c7" stroke="#d97706" />
    <text x="656" y="148" fill="#7c2d12">4. G4 (392 Hz)</text>
    <text x="810" y="148" text-anchor="end" fill="#b45309">High!</text>

    <rect x="646" y="168" width="174" height="32" rx="7" fill="#eff6ff" stroke="#2563eb" />
    <text x="656" y="188" fill="#1e3a8a">3. C4 (262 Hz)</text>
    <text x="810" y="188" text-anchor="end" fill="#2563eb">Lowest</text>

    <rect x="646" y="208" width="174" height="32" rx="7" fill="#f0fdf4" stroke="#16a34a" />
    <text x="656" y="228" fill="#166534">2. E4 (330 Hz)</text>
    <text x="810" y="228" text-anchor="end" fill="#16a34a">Middle</text>

    <rect x="646" y="248" width="174" height="32" rx="7" fill="#fdf4ff" stroke="#9333ea" />
    <text x="656" y="268" fill="#6b21a8">1. A4 (440 Hz)</text>
    <text x="810" y="268" text-anchor="end" fill="#7e22ce">Highest</text>
  </g>

  <text x="24" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Physics note: shortening a string behind a fret raises pitch by 1 semitone per fret; G4 sits high ("re-entrant") for bright chime.</text>
</svg>