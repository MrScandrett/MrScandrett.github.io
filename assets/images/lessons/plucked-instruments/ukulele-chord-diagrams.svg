<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-labelledby="uke-chords-title uke-chords-desc">
  <title id="uke-chords-title">Four Beginner Ukulele Chord Diagrams and the F-to-G7 Pivot Finger</title>
  <desc id="uke-chords-desc">Vertical ukulele chord boxes for C major (0-0-0-3), F major (2-0-1-0), G7 (0-2-1-2), and A minor (2-0-0-0) in G-C-E-A string order, showing numbered finger dots and highlighting that finger 1 stays anchored on E string fret 1 between F and G7.</desc>
  <rect width="860" height="340" rx="16" fill="#fffaf3" stroke="#d6c3aa" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#1e293b" />
  <text x="38" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fde68a">FIRST FOUR UKULELE CHORDS · G – C – E – A STRING ORDER</text>

  <!-- Chord 1: C -->
  <g transform="translate(32, 74)">
    <rect width="175" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" />
    <text x="87" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">C</text>
    <text x="87" y="42" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">0 – 0 – 0 – 3</text>
    <!-- Nut & Frets -->
    <line x1="42" y1="68" x2="132" y2="68" stroke="#1e293b" stroke-width="4.5" />
    <line x1="42" y1="98" x2="132" y2="98" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="42" y1="128" x2="132" y2="128" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="42" y1="158" x2="132" y2="158" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="42" y1="188" x2="132" y2="188" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Strings -->
    <g stroke="#475569" stroke-width="1.5">
      <line x1="42" y1="68" x2="42" y2="188" /><line x1="72" y1="68" x2="72" y2="188" />
      <line x1="102" y1="68" x2="102" y2="188" /><line x1="132" y1="68" x2="132" y2="188" />
    </g>
    <!-- Open circles -->
    <circle cx="42" cy="56" r="4.5" fill="none" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="72" cy="56" r="4.5" fill="none" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="102" cy="56" r="4.5" fill="none" stroke="#1e293b" stroke-width="1.8" />
    <!-- Finger 3 on A fret 3 -->
    <circle cx="132" cy="143" r="10" fill="#2563eb" />
    <text x="132" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fff">3</text>
    <text x="42" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">G</text>
    <text x="72" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">C</text>
    <text x="102" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">E</text>
    <text x="132" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">A</text>
  </g>

  <!-- Chord 2: F -->
  <g transform="translate(232, 74)">
    <rect width="175" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" />
    <text x="87" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">F</text>
    <text x="87" y="42" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">2 – 0 – 1 – 0</text>
    <line x1="42" y1="68" x2="132" y2="68" stroke="#1e293b" stroke-width="4.5" />
    <line x1="42" y1="98" x2="132" y2="98" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="42" y1="128" x2="132" y2="128" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="42" y1="158" x2="132" y2="158" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="42" y1="188" x2="132" y2="188" stroke="#94a3b8" stroke-width="1.5" />
    <g stroke="#475569" stroke-width="1.5">
      <line x1="42" y1="68" x2="42" y2="188" /><line x1="72" y1="68" x2="72" y2="188" />
      <line x1="102" y1="68" x2="102" y2="188" /><line x1="132" y1="68" x2="132" y2="188" />
    </g>
    <circle cx="72" cy="56" r="4.5" fill="none" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="132" cy="56" r="4.5" fill="none" stroke="#1e293b" stroke-width="1.8" />
    <!-- Finger 2 on G fret 2 -->
    <circle cx="42" cy="113" r="10" fill="#2563eb" />
    <text x="42" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fff">2</text>
    <!-- Finger 1 Anchor on E fret 1 -->
    <circle cx="102" cy="83" r="11" fill="#d97706" stroke="#7c2d12" stroke-width="2" />
    <text x="102" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fff">1</text>
    <text x="42" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">G</text>
    <text x="72" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">C</text>
    <text x="102" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">E</text>
    <text x="132" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">A</text>
  </g>

  <!-- Pivot Bridge F -> G7 -->
  <path d="M 346 157 C 392 135, 488 135, 526 155" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="5 3" />
  <rect x="378" y="116" width="118" height="22" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="437" y="131" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#7c2d12">Pivot: keep 1</text>

  <!-- Chord 3: G7 -->
  <g transform="translate(432, 74)">
    <rect width="175" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" />
    <text x="87" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">G7</text>
    <text x="87" y="42" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">0 – 2 – 1 – 2</text>
    <line x1="42" y1="68" x2="132" y2="68" stroke="#1e293b" stroke-width="4.5" />
    <line x1="42" y1="98" x2="132" y2="98" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="42" y1="128" x2="132" y2="128" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="42" y1="158" x2="132" y2="158" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="42" y1="188" x2="132" y2="188" stroke="#94a3b8" stroke-width="1.5" />
    <g stroke="#475569" stroke-width="1.5">
      <line x1="42" y1="68" x2="42" y2="188" /><line x1="72" y1="68" x2="72" y2="188" />
      <line x1="102" y1="68" x2="102" y2="188" /><line x1="132" y1="68" x2="132" y2="188" />
    </g>
    <circle cx="42" cy="56" r="4.5" fill="none" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="72" cy="113" r="10" fill="#2563eb" /><text x="72" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fff">2</text>
    <circle cx="102" cy="83" r="11" fill="#d97706" stroke="#7c2d12" stroke-width="2" /><text x="102" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fff">1</text>
    <circle cx="132" cy="113" r="10" fill="#2563eb" /><text x="132" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fff">3</text>
    <text x="42" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">G</text>
    <text x="72" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">C</text>
    <text x="102" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">E</text>
    <text x="132" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">A</text>
  </g>

  <!-- Chord 4: Am -->
  <g transform="translate(652, 74)">
    <rect width="175" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" />
    <text x="87" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Am</text>
    <text x="87" y="42" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">2 – 0 – 0 – 0</text>
    <line x1="42" y1="68" x2="132" y2="68" stroke="#1e293b" stroke-width="4.5" />
    <line x1="42" y1="98" x2="132" y2="98" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="42" y1="128" x2="132" y2="128" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="42" y1="158" x2="132" y2="158" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="42" y1="188" x2="132" y2="188" stroke="#94a3b8" stroke-width="1.5" />
    <g stroke="#475569" stroke-width="1.5">
      <line x1="42" y1="68" x2="42" y2="188" /><line x1="72" y1="68" x2="72" y2="188" />
      <line x1="102" y1="68" x2="102" y2="188" /><line x1="132" y1="68" x2="132" y2="188" />
    </g>
    <circle cx="72" cy="56" r="4.5" fill="none" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="102" cy="56" r="4.5" fill="none" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="132" cy="56" r="4.5" fill="none" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="42" cy="113" r="10" fill="#2563eb" /><text x="42" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fff">2</text>
    <text x="42" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">G</text>
    <text x="72" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">C</text>
    <text x="102" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">E</text>
    <text x="132" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">A</text>
  </g>

  <text x="32" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Legend: ○ = open string · numbers = finger (1 index, 2 middle, 3 ring). Keep finger 1 anchored on E1 when switching between F and G7.</text>
</svg>