<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-labelledby="kal-anat-title kal-anat-desc">
  <title id="kal-anat-title">Kalimba Anatomy and Cantilever Tine Physics</title>
  <desc id="kal-anat-desc">Diagram showing a wooden box kalimba with its backrest bar, z-bracket bridge, saddle, central eight C-major tines highlighted inside a 17-tine instrument, resonance sound hole, and an acoustic physics panel explaining why longer tines vibrate more slowly for lower notes.</desc>
  <rect width="860" height="350" rx="16" fill="#fffaf3" stroke="#d6c3aa" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#3b2314" />
  <text x="38" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fde68a">KALIMBA ANATOMY · SOUNDBOX, BRIDGE &amp; TINE VIBRATION PHYSICS</text>

  <!-- Left: 17-tine Wooden Kalimba Body -->
  <rect x="64" y="72" width="290" height="236" rx="22" fill="#b45309" stroke="#5c2d0c" stroke-width="2.5" />
  <rect x="74" y="82" width="270" height="216" rx="16" fill="#c2641a" stroke="#78350f" stroke-width="1.2" />
  <!-- Sound hole -->
  <circle cx="209" cy="242" r="36" fill="#2c1810" stroke="#fde68a" stroke-width="2" />
  <!-- Backrest, Pressure Bar & Saddle -->
  <rect x="86" y="92" width="246" height="8" rx="3" fill="#451a03" />
  <rect x="82" y="106" width="254" height="10" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4" />
  <rect x="86" y="122" width="246" height="6" rx="2" fill="#fde68a" stroke="#92400e" stroke-width="1" />

  <!-- 17 Tines (center 8 highlighted bright silver, outer 9 muted) -->
  <!-- Tine centers from x=105 to x=313 step 13 -->
  <g stroke="#334155" stroke-width="1.2">
    <!-- outer left 4 -->
    <rect x="100" y="96" width="9" height="64" rx="4" fill="#94a3b8" opacity="0.6" />
    <rect x="113" y="96" width="9" height="70" rx="4" fill="#94a3b8" opacity="0.6" />
    <rect x="126" y="96" width="9" height="76" rx="4" fill="#94a3b8" opacity="0.6" />
    <rect x="139" y="96" width="9" height="82" rx="4" fill="#94a3b8" opacity="0.6" />
    <!-- central 8 C4..C5 -->
    <rect x="152" y="96" width="10" height="88" rx="4" fill="#e2e8f0" />
    <rect x="165" y="96" width="10" height="96" rx="4" fill="#e2e8f0" />
    <rect x="178" y="96" width="10" height="104" rx="4" fill="#e2e8f0" />
    <rect x="191" y="96" width="10" height="112" rx="4" fill="#e2e8f0" />
    <rect x="204" y="96" width="10" height="122" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.8" />
    <rect x="217" y="96" width="10" height="108" rx="4" fill="#e2e8f0" />
    <rect x="230" y="96" width="10" height="100" rx="4" fill="#e2e8f0" />
    <rect x="243" y="96" width="10" height="92" rx="4" fill="#e2e8f0" />
    <!-- outer right 5 -->
    <rect x="256" y="96" width="9" height="85" rx="4" fill="#94a3b8" opacity="0.6" />
    <rect x="269" y="96" width="9" height="79" rx="4" fill="#94a3b8" opacity="0.6" />
    <rect x="282" y="96" width="9" height="73" rx="4" fill="#94a3b8" opacity="0.6" />
    <rect x="295" y="96" width="9" height="67" rx="4" fill="#94a3b8" opacity="0.6" />
    <rect x="308" y="96" width="9" height="61" rx="4" fill="#94a3b8" opacity="0.6" />
  </g>
  <!-- Highlight bracket for central 8 tines -->
  <path d="M 152 224 L 152 230 L 253 230 L 253 224" fill="none" stroke="#fef3c7" stroke-width="2" />

  <!-- Labels pointing to Kalimba -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">
    <line x1="336" y1="111" x2="390" y2="94" stroke="#64748b" stroke-width="1.5" />
    <text x="396" y="98">Z-Bracket Pressure Bar (clamps tines)</text>

    <line x1="332" y1="125" x2="390" y2="128" stroke="#64748b" stroke-width="1.5" />
    <text x="396" y="132">Saddle Bridge (transfers vibration to wood)</text>

    <line x1="254" y1="168" x2="390" y2="164" stroke="#64748b" stroke-width="1.5" />
    <text x="396" y="168">Central 8 Tines (1 through 1′ in C Major)</text>

    <line x1="245" y1="246" x2="390" y2="210" stroke="#64748b" stroke-width="1.5" />
    <text x="396" y="214">Sound Hole &amp; Hollow Resonance Box</text>
  </g>

  <!-- Bottom-Right Physics Box -->
  <rect x="396" y="230" width="440" height="86" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" />
  <text x="414" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">WHY LONG TINES SOUND LOW (Cantilever Beam)</text>
  <line x1="418" y1="274" x2="544" y2="274" stroke="#334155" stroke-width="5" stroke-linecap="round" />
  <path d="M 500 264 Q 524 274 500 284" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3 2" />
  <text x="556" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Longer free end = slower back-and-forth swing = <tspan font-weight="800">lower pitch</tspan></text>
  <line x1="418" y1="298" x2="478" y2="298" stroke="#334155" stroke-width="5" stroke-linecap="round" />
  <text x="556" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Shorter free end = faster swing = <tspan font-weight="800">higher pitch</tspan></text>

  <text x="24" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Tuning a real kalimba: tapping a tine inward shortens its vibrating end (sharper); pulling it outward lowers the pitch (flatter).</text>
</svg>