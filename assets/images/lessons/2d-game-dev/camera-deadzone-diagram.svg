<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#1e2238"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0a0c16" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="880" height="480" fill="url(#bgGrad)"/>

  <!-- Title -->
  <g transform="translate(30, 22)">
    <rect width="820" height="46" rx="4" fill="#10121d" stroke="#313752" stroke-width="2" filter="url(#shadow)"/>
    <text x="18" y="28" font-family="'Pixelify Sans', 'DM Sans', sans-serif" font-size="19" font-weight="700" fill="#ffc93c" letter-spacing="1">LESSON 07 · CAMERA DEAD ZONE, SMOOTHING &amp; PARALLAX</text>
    <text x="640" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#73eff7">VIEWPORT &amp; LERP</text>
  </g>

  <!-- Left: Dead Zone & Viewport Framing -->
  <g transform="translate(30, 84)" filter="url(#shadow)">
    <rect width="450" height="366" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="20" y="26" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#73eff7">320×180 VIEWPORT &amp; DEAD ZONE</text>

    <!-- Simulated Viewport Frame -->
    <g transform="translate(45, 46)">
      <!-- Level Backdrop Slice -->
      <rect width="360" height="202" fill="#152438" stroke="#257179" stroke-width="3"/>
      <line x1="0" y1="160" x2="360" y2="160" stroke="#38b764" stroke-width="4"/>

      <!-- Dead Zone Box (Centered) -->
      <!-- Width 56 scaled by 1.125 = 63, Height 48 scaled = 54 -->
      <rect x="148" y="74" width="64" height="54" fill="rgba(255,61,127,0.18)" stroke="#ff3d7f" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="180" y="66" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ff3d7f" text-anchor="middle">DEAD ZONE (56×48)</text>

      <!-- Player inside deadzone -->
      <rect x="170" y="90" width="18" height="24" rx="2" fill="#e4572e"/>
      <text x="179" y="106" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff" text-anchor="middle">📦</text>

      <!-- Lookahead Target Arrow -->
      <line x1="188" y1="102" x2="238" y2="102" stroke="#ffc93c" stroke-width="2.5" marker-end="url(#camArrow)"/>
      <circle cx="240" cy="102" r="4" fill="#ffc93c"/>
      <text x="240" y="120" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ffc93c" text-anchor="middle">LOOKAHEAD</text>

      <!-- Level Bounds Clamping Lines -->
      <line x1="6" y1="0" x2="6" y2="202" stroke="#e4572e" stroke-width="3"/>
      <text x="12" y="30" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#e4572e">CLAMP: x=0</text>
    </g>

    <!-- Technical Rules -->
    <g transform="translate(20, 266)">
      <text x="10" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#fff">1. Dead Zone:</text>
      <text x="110" y="18" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Small hops stay inside box — camera stays still!</text>

      <text x="10" y="38" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#fff">2. Look-Ahead:</text>
      <text x="110" y="38" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Shifts view toward facing direction (see hazards early).</text>

      <text x="10" y="58" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#fff">3. Pixel Snap:</text>
      <text x="110" y="58" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#73eff7">Math.round(cam.x) stops fractional pixel shimmering.</text>

      <text x="10" y="78" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#fff">4. Clamping:</text>
      <text x="110" y="78" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">clamp(x, 0, mapWidth - 320) never shows void.</text>
    </g>
  </g>

  <!-- Right: Multiplane Parallax Layers -->
  <g transform="translate(500, 84)" filter="url(#shadow)">
    <rect width="350" height="366" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="18" y="26" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffcd75">MULTIPLANE PARALLAX SPEEDS</text>
    <text x="18" y="44" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Relative movement creates optical depth illusion:</text>

    <!-- Parallax Layers Visualizer -->
    <g transform="translate(20, 60)">
      <!-- Layer 1: Sky -->
      <g transform="translate(0, 0)">
        <rect width="310" height="44" rx="3" fill="#22304a" stroke="#73eff7" stroke-width="1"/>
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#d8f3f9">SKY DOME</text>
        <rect x="220" y="10" width="76" height="24" rx="2" fill="#141624"/>
        <text x="258" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#73eff7" text-anchor="middle">SPEED: 0.0×</text>
      </g>

      <!-- Layer 2: Far Hills -->
      <g transform="translate(0, 56)">
        <rect width="310" height="44" rx="3" fill="#1c3444" stroke="#9fd8e6" stroke-width="1.5"/>
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#9fd8e6">FAR MOUNTAINS</text>
        <rect x="220" y="10" width="76" height="24" rx="2" fill="#141624"/>
        <text x="258" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#9fd8e6" text-anchor="middle">SPEED: 0.2×</text>
      </g>

      <!-- Layer 3: Near Town -->
      <g transform="translate(0, 112)">
        <rect width="310" height="44" rx="3" fill="#1c483a" stroke="#4fae8e" stroke-width="1.5"/>
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4fae8e">NEAR TOWN</text>
        <rect x="220" y="10" width="76" height="24" rx="2" fill="#141624"/>
        <text x="258" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4fae8e" text-anchor="middle">SPEED: 0.5×</text>
      </g>

      <!-- Layer 4: Playfield -->
      <g transform="translate(0, 168)">
        <rect width="310" height="44" rx="3" fill="#36281c" stroke="#e4572e" stroke-width="2"/>
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffcd75">PLAYFIELD (TILES)</text>
        <rect x="220" y="10" width="76" height="24" rx="2" fill="#141624"/>
        <text x="258" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffc93c" text-anchor="middle">SPEED: 1.0×</text>
      </g>
    </g>

    <!-- Smoothing Formula Callout -->
    <g transform="translate(20, 290)">
      <rect width="310" height="54" rx="3" fill="#10121d" stroke="#257179" stroke-width="1.5"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#73eff7">k = 1 - Math.exp(-smoothing * dt);</text>
      <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#a7f070">cam.x += (targetX - cam.x) * k;</text>
    </g>
  </g>

  <defs>
    <marker id="camArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ffc93c"/>
    </marker>
  </defs>
</svg>
