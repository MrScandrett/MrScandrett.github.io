<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#1e2238"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0a0c16" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="880" height="480" fill="url(#bgGrad)"/>

  <!-- Title -->
  <g transform="translate(30, 22)">
    <rect width="820" height="46" rx="4" fill="#10121d" stroke="#313752" stroke-width="2" filter="url(#shadow)"/>
    <text x="18" y="28" font-family="'Pixelify Sans', 'DM Sans', sans-serif" font-size="19" font-weight="700" fill="#ffc93c" letter-spacing="1">LESSON 06 · AABB COLLISION DETECTION &amp; AXIS SEPARATION</text>
    <text x="640" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#73eff7">SEPARATE X / Y</text>
  </g>

  <!-- Left: Both Axes at Once vs Separate Resolution -->
  <g transform="translate(30, 84)" filter="url(#shadow)">
    <rect width="450" height="366" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="20" y="26" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ff9e7a">THE SEAM SNAG BUG VS SEPARATE AXIS FIX</text>

    <!-- Bug: Both Axes at Once -->
    <g transform="translate(20, 44)">
      <rect width="410" height="136" rx="3" fill="#25181b" stroke="#e4572e" stroke-width="2"/>
      <text x="14" y="22" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#e4572e">BUG: Resolving both axes at once</text>

      <!-- Floor tiles with seam -->
      <g transform="translate(40, 40)">
        <rect x="0" y="40" width="80" height="40" fill="#38b764" stroke="#1a1c2c" stroke-width="1.5"/>
        <rect x="80" y="40" width="80" height="40" fill="#38b764" stroke="#1a1c2c" stroke-width="1.5"/>
        <line x1="80" y1="40" x2="80" y2="80" stroke="#ff3d7f" stroke-width="2" stroke-dasharray="2,2"/>

        <!-- Player Box straddling the seam -->
        <rect x="68" y="25" width="30" height="38" fill="rgba(228,87,46,0.3)" stroke="#e4572e" stroke-width="2"/>
        <text x="83" y="48" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">BOX</text>

        <!-- Sideways push bug arrow -->
        <line x1="68" y1="44" x2="48" y2="44" stroke="#ff3d7f" stroke-width="3" marker-end="url(#colArrow)"/>
        <text x="38" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ff3d7f">ox &lt; oy ➔ pushed back!</text>
      </g>

      <text x="240" y="70" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Overlap x (2px) is smaller</text>
      <text x="240" y="86" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">than overlap y (5px):</text>
      <text x="240" y="104" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#ff9e7a">Courier snags on flat floor!</text>
    </g>

    <!-- Fix: Move X, then Move Y -->
    <g transform="translate(20, 196)">
      <rect width="410" height="142" rx="3" fill="#15241b" stroke="#2f8f57" stroke-width="2"/>
      <text x="14" y="22" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#38b764">FIX: Move X, resolve X. Then move Y, resolve Y.</text>

      <g transform="translate(20, 36)">
        <rect width="170" height="54" rx="2" fill="#1b1e30" stroke="#38b764" stroke-width="1.5"/>
        <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#73eff7">Step 1: moveX(dx)</text>
        <text x="10" y="38" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3">Only pushes against walls</text>
      </g>
      <g transform="translate(210, 36)">
        <rect width="170" height="54" rx="2" fill="#1b1e30" stroke="#38b764" stroke-width="1.5"/>
        <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffcd75">Step 2: moveY(dy)</text>
        <text x="10" y="38" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3">Only pushes against floors</text>
      </g>

      <text x="14" y="112" font-family="'DM Sans', sans-serif" font-size="11" fill="#fff">No guessing direction: you always push back along the axis you moved!</text>
    </g>
  </g>

  <!-- Right: Tunnelling & One-Way Platforms -->
  <!-- Top: Sub-stepping vs Tunnelling -->
  <g transform="translate(500, 84)" filter="url(#shadow)">
    <rect width="350" height="170" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="18" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffc93c">TUNNELLING &amp; SUB-STEPPING</text>

    <!-- Fast drop illustration -->
    <g transform="translate(20, 40)">
      <!-- Start Box -->
      <rect x="30" y="0" width="26" height="26" fill="#3b5dc9" stroke="#fff" stroke-width="1.5"/>
      <!-- Floor (16px high) -->
      <rect x="0" y="44" width="130" height="16" fill="#b86f50" stroke="#1a1c2c" stroke-width="1.5"/>

      <!-- Tunnelling trajectory: jumps straight past floor -->
      <line x1="43" y1="28" x2="43" y2="76" stroke="#ff3d7f" stroke-width="2.5" stroke-dasharray="3,3" marker-end="url(#colArrow)"/>
      <rect x="30" y="78" width="26" height="26" fill="rgba(255,61,127,0.3)" stroke="#ff3d7f" stroke-width="2"/>

      <text x="150" y="24" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#ff9e7a">Fast speed (dy = 36 px)</text>
      <text x="150" y="42" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Skips entirely over 16px</text>
      <text x="150" y="56" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">floor tile in 1 tick!</text>
      <text x="150" y="76" font-family="'JetBrains Mono', monospace" font-size="10" fill="#73eff7">steps = ceil(dy / 4);</text>
      <text x="150" y="92" font-family="'DM Sans', sans-serif" font-size="10" fill="#38b764">Sub-steps ≤ 4 px catch it.</text>
    </g>
  </g>

  <!-- Bottom: One-Way Platforms -->
  <g transform="translate(500, 268)" filter="url(#shadow)">
    <rect width="350" height="182" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="18" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#73eff7">ONE-WAY PLATFORM LOGIC</text>

    <g transform="translate(20, 38)">
      <!-- Plank -->
      <rect x="20" y="40" width="120" height="8" rx="2" fill="#ffc93c" stroke="#1a1c2c" stroke-width="1.5"/>

      <!-- Rising arrow through plank -->
      <line x1="45" y1="70" x2="45" y2="15" stroke="#73eff7" stroke-width="2" marker-end="url(#colArrow)"/>
      <text x="50" y="25" font-family="'JetBrains Mono', monospace" font-size="9" fill="#73eff7">vy &lt; 0 ➔ pass</text>

      <!-- Falling down onto plank -->
      <line x1="110" y1="15" x2="110" y2="38" stroke="#38b764" stroke-width="2" marker-end="url(#colArrow)"/>
      <text x="115" y="25" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38b764">vy &gt; 0 ➔ land</text>

      <text x="160" y="20" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#fff">Two Conditions to Land:</text>
      <text x="160" y="38" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">1. Moving downward (dy &gt; 0)</text>
      <text x="160" y="52" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">2. Feet were above plank</text>
      <text x="160" y="66" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">   top in previous step.</text>

      <text x="160" y="90" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#ffcd75">Hold ↓ + Space: ignores plank</text>
    </g>

    <text x="18" y="156" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Allows hopping upward onto decks while maintaining solid landing.</text>
  </g>

  <defs>
    <marker id="colArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ff3d7f"/>
    </marker>
  </defs>
</svg>
