<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#1e2238"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0a0c16" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="880" height="480" fill="url(#bgGrad)"/>

  <!-- Title -->
  <g transform="translate(30, 22)">
    <rect width="820" height="46" rx="4" fill="#10121d" stroke="#313752" stroke-width="2" filter="url(#shadow)"/>
    <text x="18" y="28" font-family="'Pixelify Sans', 'DM Sans', sans-serif" font-size="19" font-weight="700" fill="#ffc93c" letter-spacing="1">LESSON 08 · ANIMATION STATE MACHINES &amp; PRIORITY ORDER</text>
    <text x="630" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#73eff7">PHYSICS-DRIVEN</text>
  </g>

  <!-- Left: State Machine Node Graph -->
  <g transform="translate(30, 84)" filter="url(#shadow)">
    <rect width="450" height="366" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="20" y="26" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffcd75">STATE MACHINE GRAPH (5 CORE STATES)</text>

    <!-- State Machine Nodes & Transitions -->
    <g transform="translate(40, 50)">
      <!-- Node: IDLE -->
      <g transform="translate(30, 20)">
        <rect width="100" height="44" rx="22" fill="#252a42" stroke="#73eff7" stroke-width="2.5"/>
        <text x="50" y="27" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">💤 IDLE</text>
      </g>

      <!-- Node: RUN -->
      <g transform="translate(240, 20)">
        <rect width="100" height="44" rx="22" fill="#252a42" stroke="#ffc93c" stroke-width="2.5"/>
        <text x="50" y="27" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">🏃 RUN</text>
      </g>

      <!-- Bidirectional Arrow Idle <-> Run -->
      <path d="M 135 34 L 235 34" fill="none" stroke="#73eff7" stroke-width="2" marker-end="url(#smArrow)"/>
      <path d="M 235 50 L 135 50" fill="none" stroke="#ffc93c" stroke-width="2" marker-end="url(#smArrow)"/>
      <text x="185" y="26" font-family="'DM Sans', sans-serif" font-size="9" fill="#c5c0b3" text-anchor="middle">|vx| &gt; 8</text>
      <text x="185" y="66" font-family="'DM Sans', sans-serif" font-size="9" fill="#c5c0b3" text-anchor="middle">|vx| ≤ 8</text>

      <!-- Node: JUMP -->
      <g transform="translate(30, 130)">
        <rect width="100" height="44" rx="22" fill="#252a42" stroke="#e4572e" stroke-width="2.5"/>
        <text x="50" y="27" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">🚀 JUMP</text>
      </g>

      <!-- Node: FALL -->
      <g transform="translate(240, 130)">
        <rect width="100" height="44" rx="22" fill="#252a42" stroke="#3b5dc9" stroke-width="2.5"/>
        <text x="50" y="27" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">🪂 FALL</text>
      </g>

      <!-- Jump -> Fall Arrow -->
      <path d="M 135 152 L 235 152" fill="none" stroke="#e4572e" stroke-width="2" marker-end="url(#smArrow)"/>
      <text x="185" y="144" font-family="'DM Sans', sans-serif" font-size="9" fill="#c5c0b3" text-anchor="middle">vy ≥ 0 (apex reached)</text>

      <!-- Idle/Run -> Jump Arrow -->
      <path d="M 80 68 L 80 124" fill="none" stroke="#e4572e" stroke-width="2" marker-end="url(#smArrow)"/>
      <text x="70" y="98" font-family="'DM Sans', sans-serif" font-size="9" fill="#c5c0b3" text-anchor="end">jump press</text>

      <!-- Node: LAND -->
      <g transform="translate(135, 215)">
        <rect width="100" height="44" rx="22" fill="#252a42" stroke="#2f8f57" stroke-width="2.5"/>
        <text x="50" y="27" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">💥 LAND</text>
      </g>

      <!-- Fall -> Land Arrow -->
      <path d="M 270 178 L 225 214" fill="none" stroke="#2f8f57" stroke-width="2" marker-end="url(#smArrow)"/>
      <text x="260" y="210" font-family="'DM Sans', sans-serif" font-size="9" fill="#c5c0b3">touch floor</text>

      <!-- Land -> Idle / Run Arrow -->
      <path d="M 150 214 L 80 68" fill="none" stroke="#73eff7" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#smArrow)"/>
      <text x="110" y="180" font-family="'DM Sans', sans-serif" font-size="8.5" fill="#c5c0b3">timer &lt;= 0</text>
    </g>

    <text x="20" y="344" font-family="'DM Sans', sans-serif" font-size="11" fill="#c5c0b3">Reset animTime only on state change — resetting every tick freezes at frame 0!</text>
  </g>

  <!-- Right: Priority Rules & The Classic Beginner Bug -->
  <!-- Top: Priority Order -->
  <g transform="translate(500, 84)" filter="url(#shadow)">
    <rect width="350" height="175" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="18" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffcd75">STATE SELECTION PRIORITY ORDER</text>

    <g transform="translate(18, 38)">
      <rect width="314" height="28" rx="2" fill="#2e1b1b" stroke="#e4572e" stroke-width="1.5"/>
      <text x="10" y="19" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#e4572e">1. !onFloor ➔ JUMP or FALL</text>
      <text x="300" y="18" font-family="'DM Sans', sans-serif" font-size="9" fill="#c5c0b3" text-anchor="end">Air beats all</text>
    </g>

    <g transform="translate(18, 70)">
      <rect width="314" height="28" rx="2" fill="#1b2e20" stroke="#2f8f57" stroke-width="1.5"/>
      <text x="10" y="19" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38b764">2. landTimer &gt; 0 ➔ LAND</text>
      <text x="300" y="18" font-family="'DM Sans', sans-serif" font-size="9" fill="#c5c0b3" text-anchor="end">Squash recovery</text>
    </g>

    <g transform="translate(18, 102)">
      <rect width="314" height="28" rx="2" fill="#2e2b1b" stroke="#ffc93c" stroke-width="1.5"/>
      <text x="10" y="19" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#ffc93c">3. |vx| &gt; 8 ➔ RUN</text>
      <text x="300" y="18" font-family="'DM Sans', sans-serif" font-size="9" fill="#c5c0b3" text-anchor="end">Moving on ground</text>
    </g>

    <g transform="translate(18, 134)">
      <rect width="314" height="28" rx="2" fill="#1b252e" stroke="#73eff7" stroke-width="1.5"/>
      <text x="10" y="19" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#73eff7">4. else ➔ IDLE</text>
      <text x="300" y="18" font-family="'DM Sans', sans-serif" font-size="9" fill="#c5c0b3" text-anchor="end">Resting pose</text>
    </g>
  </g>

  <!-- Bottom: The Wall Bug -->
  <g transform="translate(500, 272)" filter="url(#shadow)">
    <rect width="350" height="178" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="18" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ff3d7f">THE "KEYS VS PHYSICS" BUG</text>

    <g transform="translate(18, 38)">
      <rect width="314" height="74" rx="3" fill="#10121d" stroke="#e4572e" stroke-width="1.5"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff9e7a">if (keys.right) setAnim("run"); // WRONG!</text>
      <text x="12" y="38" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Holding [➔] into a solid brick wall:</text>
      <text x="12" y="54" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Velocity is 0, but courier moonwalks into the bricks!</text>
      <text x="12" y="68" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="700" fill="#ffc93c">Rule: Read body velocity, never keyboard keys.</text>
    </g>

    <text x="18" y="136" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#a7f070">sprite.scale.x = facing; // flipX</text>
    <text x="18" y="154" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">One sprite sheet serves both left and right directions.</text>
  </g>

  <defs>
    <marker id="smArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ffc93c"/>
    </marker>
  </defs>
</svg>
