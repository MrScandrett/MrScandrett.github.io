<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#1e2238"/>
    </linearGradient>
    <linearGradient id="act1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4572e"/>
      <stop offset="100%" stop-color="#cd7b28"/>
    </linearGradient>
    <linearGradient id="act2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#af8d22"/>
      <stop offset="100%" stop-color="#2f8f57"/>
    </linearGradient>
    <linearGradient id="act3Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#257179"/>
      <stop offset="100%" stop-color="#6b4fbb"/>
    </linearGradient>
    <linearGradient id="act4Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a53030"/>
      <stop offset="100%" stop-color="#e4572e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0a0c16" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="480" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.07" stroke="#fff" stroke-width="1">
    <line x1="0" y1="60" x2="880" y2="60"/>
    <line x1="0" y1="120" x2="880" y2="120"/>
    <line x1="0" y1="180" x2="880" y2="180"/>
    <line x1="0" y1="240" x2="880" y2="240"/>
    <line x1="0" y1="300" x2="880" y2="300"/>
    <line x1="0" y1="360" x2="880" y2="360"/>
    <line x1="0" y1="420" x2="880" y2="420"/>
    <line x1="110" y1="0" x2="110" y2="480"/>
    <line x1="220" y1="0" x2="220" y2="480"/>
    <line x1="330" y1="0" x2="330" y2="480"/>
    <line x1="440" y1="0" x2="440" y2="480"/>
    <line x1="550" y1="0" x2="550" y2="480"/>
    <line x1="660" y1="0" x2="660" y2="480"/>
    <line x1="770" y1="0" x2="770" y2="480"/>
  </g>

  <!-- Title Banner -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="820" height="46" rx="4" fill="#10121d" stroke="#313752" stroke-width="2" filter="url(#shadow)"/>
    <text x="18" y="28" font-family="'Pixelify Sans', 'DM Sans', sans-serif" font-size="19" font-weight="700" fill="#ffc93c" letter-spacing="1">PIXEL COURIER · 2D GAME DEVELOPMENT PIPELINE</text>
    <text x="630" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#73eff7">10 LESSONS · 4 ACTS</text>
  </g>

  <!-- Act Columns -->
  <!-- ACT I: MAKE THE ART -->
  <g transform="translate(30, 85)" filter="url(#shadow)">
    <rect width="195" height="300" rx="5" fill="#1b1e30" stroke="#e4572e" stroke-width="2"/>
    <rect width="195" height="32" rx="4" fill="url(#act1Grad)"/>
    <text x="97" y="21" font-family="'Pixelify Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">ACT I · THE ART</text>

    <!-- Step 01 -->
    <g transform="translate(10, 42)">
      <rect width="175" height="74" rx="3" fill="#252a42" stroke="#3b4266" stroke-width="1.5"/>
      <rect x="6" y="6" width="22" height="18" rx="2" fill="#e4572e"/>
      <text x="17" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">01</text>
      <text x="34" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffcd75">Pixel Art &amp; Sprites</text>
      <text x="8" y="38" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• 16×16 limited palette</text>
      <text x="8" y="52" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Silhouette &amp; outline</text>
      <text x="8" y="66" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Nearest-neighbour scale</text>
    </g>

    <!-- Step 02 -->
    <g transform="translate(10, 124)">
      <rect width="175" height="74" rx="3" fill="#252a42" stroke="#3b4266" stroke-width="1.5"/>
      <rect x="6" y="6" width="22" height="18" rx="2" fill="#e36a3a"/>
      <text x="17" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">02</text>
      <text x="34" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffcd75">Sprite Sheets</text>
      <text x="8" y="38" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• 4-frame run cycle</text>
      <text x="8" y="52" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Onion skinning</text>
      <text x="8" y="66" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Source rectangle slices</text>
    </g>

    <!-- Step 03 -->
    <g transform="translate(10, 206)">
      <rect width="175" height="82" rx="3" fill="#252a42" stroke="#3b4266" stroke-width="1.5"/>
      <rect x="6" y="6" width="22" height="18" rx="2" fill="#cd7b28"/>
      <text x="17" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">03</text>
      <text x="34" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffcd75">Tilesets &amp; Tilemaps</text>
      <text x="8" y="38" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• 4×3 seam testing</text>
      <text x="8" y="52" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• 2D grid of tile IDs</text>
      <text x="8" y="66" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• 4-bit autotile bitmasks</text>
    </g>
  </g>

  <!-- ACT II: MAKE IT MOVE -->
  <g transform="translate(240, 85)" filter="url(#shadow)">
    <rect width="195" height="300" rx="5" fill="#1b1e30" stroke="#af8d22" stroke-width="2"/>
    <rect width="195" height="32" rx="4" fill="url(#act2Grad)"/>
    <text x="97" y="21" font-family="'Pixelify Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">ACT II · THE PHYSICS</text>

    <!-- Step 04 -->
    <g transform="translate(10, 42)">
      <rect width="175" height="74" rx="3" fill="#252a42" stroke="#3b4266" stroke-width="1.5"/>
      <rect x="6" y="6" width="22" height="18" rx="2" fill="#af8d22"/>
      <text x="17" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">04</text>
      <text x="34" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffcd75">Game Loop &amp; Render</text>
      <text x="8" y="38" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Fixed 60 Hz accumulator</text>
      <text x="8" y="52" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• 320×180 internal view</text>
      <text x="8" y="66" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• 8-layer draw order</text>
    </g>

    <!-- Step 05 -->
    <g transform="translate(10, 124)">
      <rect width="175" height="74" rx="3" fill="#252a42" stroke="#3b4266" stroke-width="1.5"/>
      <rect x="6" y="6" width="22" height="18" rx="2" fill="#749b37"/>
      <text x="17" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">05</text>
      <text x="34" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffcd75">Jump &amp; Movement</text>
      <text x="8" y="38" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Parabolic jump arcs</text>
      <text x="8" y="52" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Coyote time (100 ms)</text>
      <text x="8" y="66" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Jump input buffer</text>
    </g>

    <!-- Step 06 -->
    <g transform="translate(10, 206)">
      <rect width="175" height="82" rx="3" fill="#252a42" stroke="#3b4266" stroke-width="1.5"/>
      <rect x="6" y="6" width="22" height="18" rx="2" fill="#2f8f57"/>
      <text x="17" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">06</text>
      <text x="34" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffcd75">Collision &amp; Response</text>
      <text x="8" y="38" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• AABB overlap detection</text>
      <text x="8" y="52" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Separate X / Y resolving</text>
      <text x="8" y="66" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• One-way &amp; sub-steps</text>
    </g>
  </g>

  <!-- ACT III: MAKE IT A WORLD -->
  <g transform="translate(450, 85)" filter="url(#shadow)">
    <rect width="195" height="300" rx="5" fill="#1b1e30" stroke="#257179" stroke-width="2"/>
    <rect width="195" height="32" rx="4" fill="url(#act3Grad)"/>
    <text x="97" y="21" font-family="'Pixelify Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">ACT III · THE WORLD</text>

    <!-- Step 07 -->
    <g transform="translate(10, 42)">
      <rect width="175" height="74" rx="3" fill="#252a42" stroke="#3b4266" stroke-width="1.5"/>
      <rect x="6" y="6" width="22" height="18" rx="2" fill="#257179"/>
      <text x="17" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">07</text>
      <text x="34" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffcd75">Cameras &amp; Parallax</text>
      <text x="8" y="38" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Dead zone &amp; lookahead</text>
      <text x="8" y="52" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Whole-pixel rounding</text>
      <text x="8" y="66" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Multiplane depth layers</text>
    </g>

    <!-- Step 08 -->
    <g transform="translate(10, 124)">
      <rect width="175" height="74" rx="3" fill="#252a42" stroke="#3b4266" stroke-width="1.5"/>
      <rect x="6" y="6" width="22" height="18" rx="2" fill="#3b5dc9"/>
      <text x="17" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">08</text>
      <text x="34" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffcd75">State Machines</text>
      <text x="8" y="38" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Physics-driven states</text>
      <text x="8" y="52" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Air &gt; Land &gt; Run &gt; Idle</text>
      <text x="8" y="66" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Horizontal flip logic</text>
    </g>

    <!-- Step 09 -->
    <g transform="translate(10, 206)">
      <rect width="175" height="82" rx="3" fill="#252a42" stroke="#3b4266" stroke-width="1.5"/>
      <rect x="6" y="6" width="22" height="18" rx="2" fill="#6b4fbb"/>
      <text x="17" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">09</text>
      <text x="34" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffcd75">Level Design &amp; Juice</text>
      <text x="8" y="38" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Introduce-Develop-Twist</text>
      <text x="8" y="52" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Pacing chart per screen</text>
      <text x="8" y="66" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Squash, particles, shake</text>
    </g>
  </g>

  <!-- ACT IV: SHIP IT -->
  <g transform="translate(660, 85)" filter="url(#shadow)">
    <rect width="190" height="300" rx="5" fill="#1b1e30" stroke="#a53030" stroke-width="2"/>
    <rect width="190" height="32" rx="4" fill="url(#act4Grad)"/>
    <text x="95" y="21" font-family="'Pixelify Sans', sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">ACT IV · RELEASE</text>

    <!-- Step 10 -->
    <g transform="translate(10, 42)">
      <rect width="170" height="246" rx="3" fill="#252a42" stroke="#3b4266" stroke-width="1.5"/>
      <rect x="6" y="6" width="22" height="18" rx="2" fill="#a53030"/>
      <text x="17" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">10</text>
      <text x="34" y="19" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#ffcd75">Menus, Save &amp; Ship</text>

      <text x="10" y="44" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#73eff7">Game Lifecycle:</text>
      <text x="10" y="60" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c5c0b3">Title ➔ Play ➔ Win</text>
      <text x="10" y="74" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c5c0b3">      ↕ Pause</text>

      <line x1="10" y1="88" x2="160" y2="88" stroke="#3b4266" stroke-width="1"/>

      <text x="10" y="106" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#73eff7">Data Durability:</text>
      <text x="10" y="122" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Best delivery time</text>
      <text x="10" y="136" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• Deaths &amp; parcels</text>
      <text x="10" y="150" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">• localStorage persistence</text>

      <line x1="10" y1="164" x2="160" y2="164" stroke="#3b4266" stroke-width="1"/>

      <text x="10" y="182" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#73eff7">Shipped Output:</text>
      <text x="10" y="198" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#ffc93c">★ art.js (student art)</text>
      <text x="10" y="212" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#ffc93c">★ Standalone .zip pack</text>
      <text x="10" y="226" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#ffc93c">★ Works offline anywhere</text>
    </g>
  </g>

  <!-- Flow Arrows connecting the Acts -->
  <g stroke="#ffc93c" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M225 235 L238 235" marker-end="url(#arrow)"/>
    <path d="M435 235 L448 235" marker-end="url(#arrow)"/>
    <path d="M645 235 L658 235" marker-end="url(#arrow)"/>
  </g>

  <!-- Bottom Unifying Hub: Shared Art Store -->
  <g transform="translate(30, 400)" filter="url(#shadow)">
    <rect width="820" height="60" rx="4" fill="#131522" stroke="#73eff7" stroke-width="2"/>
    <rect x="14" y="14" width="32" height="32" rx="3" fill="#257179"/>
    <text x="30" y="35" font-family="'JetBrains Mono', monospace" font-size="18" fill="#fff" text-anchor="middle">📦</text>

    <text x="58" y="28" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#73eff7">SHARED DATA SPINE: window.PixelCourier.store (localStorage)</text>
    <text x="58" y="46" font-family="'DM Sans', sans-serif" font-size="11.5" fill="#c5c0b3">Every lab reads &amp; writes the exact same student art. Sprite drawn in Lesson 01 is animated in 02, explored in 05, and shipped in 10.</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ffc93c"/>
    </marker>
  </defs>
</svg>
