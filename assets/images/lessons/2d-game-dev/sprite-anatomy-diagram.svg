<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#1e2238"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0a0c16" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="480" fill="url(#bgGrad)"/>

  <!-- Title -->
  <g transform="translate(30, 22)">
    <rect width="820" height="46" rx="4" fill="#10121d" stroke="#313752" stroke-width="2" filter="url(#shadow)"/>
    <text x="18" y="28" font-family="'Pixelify Sans', 'DM Sans', sans-serif" font-size="19" font-weight="700" fill="#ffc93c" letter-spacing="1">LESSON 01 · 16×16 SPRITE ANATOMY &amp; DESIGN RULES</text>
    <text x="660" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#73eff7">PIXEL ART BUDGET</text>
  </g>

  <!-- Left Card: 16x16 Pixel Grid Breakdown -->
  <g transform="translate(30, 84)" filter="url(#shadow)">
    <rect width="360" height="366" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="16" y="26" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#73eff7">16×16 GRID BUDGET (256 PIXELS TOTAL)</text>

    <!-- 16x16 Canvas Simulation (each pixel = 16x16 px) -->
    <g transform="translate(24, 42)">
      <!-- Checkerboard BG -->
      <pattern id="checkers" width="16" height="16" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="#20253b"/>
        <rect x="8" width="8" height="8" fill="#292f49"/>
        <rect y="8" width="8" height="8" fill="#292f49"/>
        <rect x="8" y="8" width="8" height="8" fill="#20253b"/>
      </pattern>
      <rect width="256" height="256" fill="url(#checkers)" stroke="#1a1c2c" stroke-width="2"/>

      <!-- Pixel Art Courier Silhouette & Shading (Drawn at scale 16) -->
      <!-- Cap Top (Rows 1-4) -->
      <rect x="80" y="16" width="96" height="16" fill="#1a1c2c"/>
      <rect x="64" y="32" width="16" height="32" fill="#1a1c2c"/>
      <rect x="80" y="32" width="96" height="16" fill="#e4572e"/>
      <rect x="176" y="32" width="16" height="32" fill="#1a1c2c"/>
      <!-- Cap Brim & Visor Shadow -->
      <rect x="80" y="48" width="80" height="16" fill="#e4572e"/>
      <rect x="160" y="48" width="16" height="16" fill="#a53030"/>
      <rect x="176" y="48" width="32" height="16" fill="#1a1c2c"/>
      <!-- Head / Face (Rows 5-8) -->
      <rect x="64" y="64" width="160" height="16" fill="#1a1c2c"/>
      <rect x="64" y="80" width="16" height="48" fill="#1a1c2c"/>
      <rect x="80" y="80" width="96" height="16" fill="#ffcd75"/>
      <rect x="176" y="80" width="16" height="48" fill="#1a1c2c"/>
      <!-- Eye -->
      <rect x="80" y="96" width="48" height="16" fill="#ffcd75"/>
      <rect x="128" y="96" width="16" height="16" fill="#1a1c2c"/>
      <rect x="144" y="96" width="32" height="16" fill="#ffcd75"/>
      <!-- Cheek & chin shadow -->
      <rect x="80" y="112" width="80" height="16" fill="#ffcd75"/>
      <rect x="160" y="112" width="16" height="16" fill="#c28569"/>
      <!-- Collar -->
      <rect x="80" y="128" width="96" height="16" fill="#1a1c2c"/>
      <!-- Torso & Satchel (Rows 9-11) -->
      <rect x="48" y="144" width="32" height="32" fill="#1a1c2c"/>
      <rect x="80" y="144" width="16" height="16" fill="#e4572e"/>
      <rect x="96" y="144" width="32" height="16" fill="#ffc93c"/>
      <rect x="128" y="144" width="48" height="16" fill="#e4572e"/>
      <rect x="176" y="144" width="16" height="16" fill="#1a1c2c"/>
      <rect x="48" y="160" width="16" height="16" fill="#1a1c2c"/>
      <rect x="64" y="160" width="32" height="16" fill="#e4572e"/>
      <rect x="96" y="160" width="32" height="16" fill="#ffc93c"/>
      <rect x="128" y="160" width="48" height="16" fill="#e4572e"/>
      <rect x="176" y="160" width="32" height="16" fill="#1a1c2c"/>
      <!-- Belt & Hands -->
      <rect x="48" y="176" width="16" height="16" fill="#1a1c2c"/>
      <rect x="64" y="176" width="16" height="16" fill="#ffcd75"/>
      <rect x="80" y="176" width="16" height="16" fill="#e4572e"/>
      <rect x="96" y="176" width="32" height="16" fill="#ffc93c"/>
      <rect x="128" y="176" width="48" height="16" fill="#e4572e"/>
      <rect x="176" y="176" width="16" height="16" fill="#ffcd75"/>
      <rect x="192" y="176" width="16" height="16" fill="#1a1c2c"/>
      <rect x="208" y="176" width="16" height="16" fill="#1a1c2c"/>
      <!-- Legs & Feet (Rows 12-15) -->
      <rect x="64" y="192" width="128" height="16" fill="#1a1c2c"/>
      <rect x="64" y="208" width="16" height="32" fill="#1a1c2c"/>
      <rect x="80" y="208" width="32" height="16" fill="#3b5dc9"/>
      <rect x="112" y="208" width="32" height="32" fill="#1a1c2c"/>
      <rect x="144" y="208" width="32" height="16" fill="#3b5dc9"/>
      <rect x="176" y="208" width="16" height="32" fill="#1a1c2c"/>
      <rect x="80" y="224" width="32" height="16" fill="#3b5dc9"/>
      <rect x="144" y="224" width="32" height="16" fill="#3b5dc9"/>
      <!-- Boots (Row 15) -->
      <rect x="64" y="240" width="16" height="16" fill="#1a1c2c"/>
      <rect x="80" y="240" width="32" height="16" fill="#5d3a29"/>
      <rect x="112" y="240" width="32" height="16" fill="#1a1c2c"/>
      <rect x="144" y="240" width="32" height="16" fill="#5d3a29"/>
      <rect x="176" y="240" width="16" height="16" fill="#1a1c2c"/>

      <!-- Inner Green Hitbox Outline (10x14 tiles = 160x224 px) -->
      <rect x="48" y="32" width="160" height="224" fill="none" stroke="#38b764" stroke-width="2.5" stroke-dasharray="6,4"/>
      <text x="128" y="22" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38b764" text-anchor="middle">HITBOX: 10×14 (FAIR PLAY)</text>

      <!-- Row Breakdown Bracket Line -->
      <line x1="264" y1="0" x2="264" y2="192" stroke="#ffc93c" stroke-width="2"/>
      <text x="270" y="100" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#ffc93c">Top 12 rows: HERO</text>
      <line x1="264" y1="192" x2="264" y2="256" stroke="#73eff7" stroke-width="2"/>
      <text x="270" y="228" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#73eff7">Bottom 4: LEGS</text>
    </g>

    <text x="24" y="342" font-family="'DM Sans', sans-serif" font-size="11" fill="#c5c0b3">Green dashed box: physics hitbox (10×14) sits inside the 16×16 drawing.</text>
  </g>

  <!-- Right Side Column: Core Principles -->
  <!-- 1. Silhouette Test -->
  <g transform="translate(410, 84)" filter="url(#shadow)">
    <rect width="440" height="110" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="16" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffc93c">1. THE SILHOUETTE FIRST TEST</text>

    <!-- Silhouette preview -->
    <g transform="translate(20, 36)">
      <rect width="64" height="64" fill="#fbf6ea" stroke="#1a1c2c" stroke-width="1.5"/>
      <text x="32" y="38" font-family="'JetBrains Mono', monospace" font-size="28" fill="#1a1c2c" text-anchor="middle">👤</text>
    </g>
    <g transform="translate(98, 36)">
      <text x="0" y="16" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#fff">If the silhouette fails, colour cannot save it.</text>
      <text x="0" y="34" font-family="'DM Sans', sans-serif" font-size="11" fill="#c5c0b3">• Recognizable posture: cap visor pointing right, forward lean.</text>
      <text x="0" y="50" font-family="'DM Sans', sans-serif" font-size="11" fill="#c5c0b3">• Clear negative space between chin, chest, satchel and legs.</text>
    </g>
  </g>

  <!-- 2. Dark 1px Outline Rule -->
  <g transform="translate(410, 210)" filter="url(#shadow)">
    <rect width="440" height="110" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="16" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#73eff7">2. 1-PIXEL CONTRAST OUTLINE</text>

    <g transform="translate(20, 36)">
      <!-- Light background split -->
      <rect width="32" height="64" fill="#d8f3f9"/>
      <!-- Dark background split -->
      <rect x="32" width="32" height="64" fill="#1a1c2c"/>
      <circle cx="32" cy="32" r="18" fill="#e4572e" stroke="#1a1c2c" stroke-width="3"/>
    </g>
    <g transform="translate(98, 36)">
      <text x="0" y="16" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#fff">A dark perimeter separates sprite from any world tile.</text>
      <text x="0" y="34" font-family="'DM Sans', sans-serif" font-size="11" fill="#c5c0b3">• On day sky (#d8f3f9): character edges stay razor sharp.</text>
      <text x="0" y="50" font-family="'DM Sans', sans-serif" font-size="11" fill="#c5c0b3">• In dark caves or night levels: colors inside outline pop cleanly.</text>
    </g>
  </g>

  <!-- 3. Scaling: Nearest-Neighbour vs Bilinear -->
  <g transform="translate(410, 336)" filter="url(#shadow)">
    <rect width="440" height="114" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="16" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ff9e7a">3. NEAREST-NEIGHBOUR &amp; WHOLE-NUMBER SCALING</text>

    <!-- Visual scaling comparisons -->
    <g transform="translate(20, 38)">
      <!-- Sharp 3x Box -->
      <rect width="58" height="58" fill="#10121d" stroke="#38b764" stroke-width="2"/>
      <rect x="10" y="10" width="19" height="19" fill="#e4572e"/>
      <rect x="29" y="10" width="19" height="19" fill="#ffcd75"/>
      <rect x="10" y="29" width="19" height="19" fill="#ffcd75"/>
      <rect x="29" y="29" width="19" height="19" fill="#3b5dc9"/>
      <text x="29" y="54" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38b764" text-anchor="middle">SHARP 3×</text>
    </g>
    <g transform="translate(90, 38)">
      <!-- Blurry Box -->
      <rect width="58" height="58" fill="#10121d" stroke="#e4572e" stroke-width="2"/>
      <circle cx="29" cy="29" r="16" fill="#e4572e" opacity="0.6"/>
      <circle cx="29" cy="29" r="10" fill="#ffcd75" opacity="0.8"/>
      <text x="29" y="54" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#e4572e" text-anchor="middle">BLURRY</text>
    </g>

    <g transform="translate(162, 38)">
      <text x="0" y="14" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="700" fill="#fff">imageSmoothingEnabled = false;</text>
      <text x="0" y="32" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Bilinear smoothing creates mushy halos around retro art.</text>
      <text x="0" y="48" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Always zoom by integer multiples (2×, 3×, 4×) to prevent wobble.</text>
    </g>
  </g>
</svg>
