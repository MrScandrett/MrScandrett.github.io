<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#1e2238"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0a0c16" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="880" height="480" fill="url(#bgGrad)"/>

  <!-- Title -->
  <g transform="translate(30, 22)">
    <rect width="820" height="46" rx="4" fill="#10121d" stroke="#313752" stroke-width="2" filter="url(#shadow)"/>
    <text x="18" y="28" font-family="'Pixelify Sans', 'DM Sans', sans-serif" font-size="19" font-weight="700" fill="#ffc93c" letter-spacing="1">LESSON 05 · PLATFORMER JUMP ARCS &amp; FORGIVENESS WINDOWS</text>
    <text x="630" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#73eff7">COYOTE &amp; BUFFER</text>
  </g>

  <!-- Left: Jump Arcs Parabola Comparison -->
  <g transform="translate(30, 84)" filter="url(#shadow)">
    <rect width="450" height="366" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="20" y="26" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffcd75">JUMP TRAJECTORY: FULL HOLD VS TAP CUT</text>

    <!-- Canvas Graph -->
    <g transform="translate(40, 50)">
      <!-- Background Grid -->
      <g stroke="#262d47" stroke-width="1">
        <line x1="0" y1="0" x2="370" y2="0"/>
        <line x1="0" y1="44" x2="370" y2="44"/>
        <line x1="0" y1="88" x2="370" y2="88"/>
        <line x1="0" y1="132" x2="370" y2="132"/>
        <line x1="0" y1="176" x2="370" y2="176"/>
        <line x1="0" y1="220" x2="370" y2="220"/>
        <line x1="90" y1="0" x2="90" y2="220"/>
        <line x1="180" y1="0" x2="180" y2="220"/>
        <line x1="270" y1="0" x2="270" y2="220"/>
        <line x1="360" y1="0" x2="360" y2="220"/>
      </g>

      <!-- Floor Line -->
      <line x1="0" y1="220" x2="370" y2="220" stroke="#38b764" stroke-width="4"/>

      <!-- Tile height guides on Y axis -->
      <text x="-8" y="224" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c5c0b3" text-anchor="end">0 px</text>
      <text x="-8" y="174" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c5c0b3" text-anchor="end">1 tile</text>
      <text x="-8" y="126" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c5c0b3" text-anchor="end">2 tiles</text>
      <text x="-8" y="78" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c5c0b3" text-anchor="end">3 tiles</text>

      <!-- Full Jump Parabola (Hold Space) -->
      <!-- Apex at y=76 (44px jump height) -->
      <path d="M 30 220 Q 130 50 170 76 Q 220 110 270 220" fill="none" stroke="#e4572e" stroke-width="3.5"/>
      <!-- Apex Dash Line -->
      <line x1="30" y1="76" x2="360" y2="76" stroke="#e4572e" stroke-width="1.5" stroke-dasharray="4,4"/>
      <circle cx="170" cy="76" r="5" fill="#e4572e"/>
      <text x="180" y="72" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#e4572e">Apex: 44 px (2.7 tiles)</text>

      <!-- Short Tap Parabola (Release Space Early) -->
      <path d="M 30 220 Q 75 140 100 152 Q 135 170 160 220" fill="none" stroke="#73eff7" stroke-width="3" stroke-dasharray="5,3"/>
      <circle cx="100" cy="152" r="4" fill="#73eff7"/>
      <text x="110" y="148" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#73eff7">Tap Hop: vy *= 0.45</text>

      <!-- Formula Legend -->
      <g transform="translate(10, 240)">
        <rect width="350" height="50" rx="3" fill="#10121d" stroke="#257179" stroke-width="1.5"/>
        <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#73eff7">Height = v² ÷ 2g  = 280² ÷ (2 × 900) ≈ 43.5 px</text>
        <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffcd75">Time to top = v ÷ g = 280 ÷ 900 ≈ 311 ms</text>
      </g>
    </g>

    <text x="20" y="348" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Fall multiplier (1.4×) bends the landing curve steeper, eliminating floatiness.</text>
  </g>

  <!-- Right: The Invisible Forgiveness Helpers -->
  <!-- Top: Coyote Time -->
  <g transform="translate(500, 84)" filter="url(#shadow)">
    <rect width="350" height="170" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="18" y="26" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffc93c">COYOTE TIME (~100 ms WINDOW)</text>

    <!-- Platform with ledge -->
    <g transform="translate(24, 44)">
      <!-- Ledge Ground -->
      <rect width="130" height="30" fill="#38b764" stroke="#1a1c2c" stroke-width="1.5"/>
      <rect y="30" width="130" height="30" fill="#5d3a29"/>

      <!-- Courier in mid-air right past the edge -->
      <rect x="145" y="10" width="22" height="28" rx="2" fill="#e4572e"/>
      <text x="156" y="28" font-family="'JetBrains Mono', monospace" font-size="14" fill="#fff" text-anchor="middle">📦</text>

      <!-- Grace Window Zone -->
      <rect x="130" y="0" width="60" height="60" fill="rgba(255,201,60,0.18)" stroke="#ffc93c" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="160" y="52" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#ffc93c" text-anchor="middle">100 ms</text>

      <text x="200" y="22" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#fff">Grace after leaving floor</text>
      <text x="200" y="38" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3">Player pressed jump 20ms</text>
      <text x="200" y="50" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3">after walking off cliff.</text>
    </g>

    <text x="20" y="148" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#73eff7">Without coyote time: feels unresponsive and frustrating.</text>
  </g>

  <!-- Bottom: Jump Buffering -->
  <g transform="translate(500, 268)" filter="url(#shadow)">
    <rect width="350" height="182" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="18" y="26" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#38b764">JUMP BUFFERING (~120 ms WINDOW)</text>

    <g transform="translate(24, 44)">
      <!-- Landing floor -->
      <line x1="0" y1="65" x2="300" y2="65" stroke="#38b764" stroke-width="4"/>

      <!-- Falling courier right before ground -->
      <rect x="70" y="15" width="22" height="28" rx="2" fill="#e4572e"/>
      <text x="81" y="33" font-family="'JetBrains Mono', monospace" font-size="14" fill="#fff" text-anchor="middle">📦</text>

      <!-- Buffer arrow down -->
      <line x1="81" y1="46" x2="81" y2="62" stroke="#73eff7" stroke-width="2" marker-end="url(#jumpArrow)"/>

      <!-- Buffer zone bracket -->
      <rect x="50" y="5" width="62" height="60" fill="rgba(115,239,247,0.15)" stroke="#73eff7" stroke-width="1.5" stroke-dasharray="3,3"/>

      <text x="130" y="24" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#fff">Early press remembered</text>
      <text x="130" y="40" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3">Space pressed 30ms before</text>
      <text x="130" y="52" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3">landing. Executes instantly.</text>
    </g>

    <text x="20" y="156" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#38b764">Together, these two helpers turn "unfair deaths" into smooth flow.</text>
  </g>

  <defs>
    <marker id="jumpArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#73eff7"/>
    </marker>
  </defs>
</svg>
