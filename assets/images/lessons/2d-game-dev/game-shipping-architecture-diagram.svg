<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#1e2238"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0a0c16" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="880" height="480" fill="url(#bgGrad)"/>

  <!-- Title -->
  <g transform="translate(30, 22)">
    <rect width="820" height="46" rx="4" fill="#10121d" stroke="#313752" stroke-width="2" filter="url(#shadow)"/>
    <text x="18" y="28" font-family="'Pixelify Sans', 'DM Sans', sans-serif" font-size="19" font-weight="700" fill="#ffc93c" letter-spacing="1">LESSON 10 · GAME LIFECYCLE, SAVING &amp; STANDALONE SHIPPING</text>
    <text x="660" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#73eff7">RELEASE BUILD</text>
  </g>

  <!-- Left: Game State Machine Flow -->
  <g transform="translate(30, 84)" filter="url(#shadow)">
    <rect width="450" height="366" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="20" y="26" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffcd75">TOP-LEVEL GAME STATE MACHINE</text>

    <!-- State Diagram -->
    <g transform="translate(40, 50)">
      <!-- TITLE SCREEN -->
      <g transform="translate(30, 20)">
        <rect width="130" height="48" rx="4" fill="#252a42" stroke="#ffc93c" stroke-width="2.5"/>
        <text x="65" y="29" font-family="'Pixelify Sans', sans-serif" font-size="14" font-weight="700" fill="#ffc93c" text-anchor="middle">TITLE SCREEN</text>
      </g>

      <!-- Arrow Title -> Play -->
      <path d="M 165 44 L 235 44" fill="none" stroke="#ffc93c" stroke-width="2" marker-end="url(#shipArrow)"/>
      <text x="200" y="36" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c5c0b3" text-anchor="middle">Space</text>

      <!-- PLAY -->
      <g transform="translate(240, 20)">
        <rect width="130" height="48" rx="4" fill="#15241b" stroke="#38b764" stroke-width="2.5"/>
        <text x="65" y="29" font-family="'Pixelify Sans', sans-serif" font-size="14" font-weight="700" fill="#38b764" text-anchor="middle">ACTIVE PLAY</text>
      </g>

      <!-- Bidirectional Arrow Play <-> Pause -->
      <path d="M 285 72 L 285 128" fill="none" stroke="#73eff7" stroke-width="2" marker-end="url(#shipArrow)"/>
      <path d="M 315 128 L 315 72" fill="none" stroke="#73eff7" stroke-width="2" marker-end="url(#shipArrow)"/>
      <text x="330" y="104" font-family="'JetBrains Mono', monospace" font-size="9" fill="#73eff7">P / Esc</text>

      <!-- PAUSED -->
      <g transform="translate(240, 134)">
        <rect width="130" height="48" rx="4" fill="#22304a" stroke="#73eff7" stroke-width="2"/>
        <text x="65" y="29" font-family="'Pixelify Sans', sans-serif" font-size="14" font-weight="700" fill="#73eff7" text-anchor="middle">PAUSED</text>
      </g>

      <!-- Arrow Play -> Win -->
      <path d="M 305 70 C 305 200, 200 240, 165 240" fill="none" stroke="#ffc93c" stroke-width="2" marker-end="url(#shipArrow)"/>
      <text x="320" y="210" font-family="'DM Sans', sans-serif" font-size="9.5" fill="#ffcd75">All parcels &amp; mailbox</text>

      <!-- DELIVERED / WIN -->
      <g transform="translate(30, 216)">
        <rect width="130" height="48" rx="4" fill="#2a1e1b" stroke="#e4572e" stroke-width="2.5"/>
        <text x="65" y="29" font-family="'Pixelify Sans', sans-serif" font-size="14" font-weight="700" fill="#ff9e7a" text-anchor="middle">DELIVERED!</text>
      </g>

      <!-- Replay Arrow Win -> Play -->
      <path d="M 95 214 L 95 74" fill="none" stroke="#e4572e" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#shipArrow)"/>
      <text x="85" y="140" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ff9e7a" text-anchor="end">Space: Replay</text>
    </g>

    <text x="20" y="344" font-family="'DM Sans', sans-serif" font-size="11" fill="#c5c0b3">Only PLAY updates physics. Title, Paused &amp; Win freeze world state cleanly.</text>
  </g>

  <!-- Right: Save Data & Standalone Package -->
  <!-- Top: LocalStorage Save Schema -->
  <g transform="translate(500, 84)" filter="url(#shadow)">
    <rect width="350" height="175" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="18" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#73eff7">DURABLE SAVE DATA (LOCALSTORAGE)</text>

    <g transform="translate(18, 38)">
      <rect width="314" height="88" rx="3" fill="#10121d" stroke="#257179" stroke-width="1.5"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a7f070">// What belongs in save data: Facts, not frame states</text>
      <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#ffcd75">{</text>
      <text x="28" y="54" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fff">"bestTimeSeconds": 24.82,</text>
      <text x="28" y="70" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fff">"totalDeliveries": 12</text>
      <text x="12" y="84" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#ffcd75">}</text>
    </g>

    <text x="18" y="154" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Survives tab close and browser restarts automatically.</text>
  </g>

  <!-- Bottom: Standalone Starter Pack Bundle -->
  <g transform="translate(500, 272)" filter="url(#shadow)">
    <rect width="350" height="178" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="18" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffc93c">STANDALONE ZIP BUNDLE</text>

    <g transform="translate(18, 38)">
      <rect width="314" height="92" rx="3" fill="#141624" stroke="#e4572e" stroke-width="1.5"/>
      <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffcd75">📁 pixel-courier/</text>
      <text x="28" y="40" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">├── index.html       (canvas &amp; loop mount)</text>
      <text x="28" y="56" font-family="'JetBrains Mono', monospace" font-size="10" fill="#73eff7">├── art.js           (YOUR exported art)</text>
      <text x="28" y="72" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">├── game.js          (300-line clean engine)</text>
      <text x="28" y="86" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">└── style.css        (retro CRT styling)</text>
    </g>

    <text x="18" y="156" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#38b764">★ Zero build tools, zero server, zero install. Double click &amp; play!</text>
  </g>

  <defs>
    <marker id="shipArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ffc93c"/>
    </marker>
  </defs>
</svg>
