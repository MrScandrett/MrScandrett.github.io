<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#1e2238"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0a0c16" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="880" height="480" fill="url(#bgGrad)"/>

  <!-- Title -->
  <g transform="translate(30, 22)">
    <rect width="820" height="46" rx="4" fill="#10121d" stroke="#313752" stroke-width="2" filter="url(#shadow)"/>
    <text x="18" y="28" font-family="'Pixelify Sans', 'DM Sans', sans-serif" font-size="19" font-weight="700" fill="#ffc93c" letter-spacing="1">LESSON 02 · 4-FRAME RUN CYCLE &amp; SPRITE SHEET SLICING</text>
    <text x="640" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#73eff7">TIME × FPS CLOCK</text>
  </g>

  <!-- Top Section: The 4 Fundamental Poses -->
  <g transform="translate(30, 84)" filter="url(#shadow)">
    <rect width="820" height="190" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="20" y="26" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#ffcd75">THE 4 KEY POSES OF A PLATFORMER RUN CYCLE</text>

    <!-- Ground Line -->
    <line x1="20" y1="140" x2="800" y2="140" stroke="#38b764" stroke-width="3"/>

    <!-- Sinusoidal Head Bounce Wave Line -->
    <path d="M 115 50 Q 210 65 305 50 T 495 50 T 685 50" fill="none" stroke="#73eff7" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="705" y="44" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#73eff7">1px TORSO BOUNCE</text>

    <!-- Frame 1: Contact A -->
    <g transform="translate(60, 40)">
      <rect width="110" height="120" rx="3" fill="#252a42" stroke="#e4572e" stroke-width="2"/>
      <rect x="6" y="6" width="24" height="18" rx="2" fill="#e4572e"/>
      <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">F0</text>
      <!-- Mini sprite mockup: wide stride -->
      <circle cx="55" cy="40" r="14" fill="#ffcd75" stroke="#1a1c2c" stroke-width="2"/>
      <rect x="42" y="24" width="26" height="8" rx="2" fill="#e4572e"/>
      <rect x="47" y="54" width="16" height="24" fill="#e4572e"/>
      <!-- Legs wide -->
      <line x1="48" y1="78" x2="32" y2="98" stroke="#3b5dc9" stroke-width="5" stroke-linecap="round"/>
      <line x1="62" y1="78" x2="78" y2="98" stroke="#3b5dc9" stroke-width="5" stroke-linecap="round"/>
      <text x="55" y="112" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1. CONTACT (L)</text>
    </g>

    <!-- Frame 2: Passing / Down -->
    <g transform="translate(250, 48)">
      <rect width="110" height="112" rx="3" fill="#252a42" stroke="#af8d22" stroke-width="2"/>
      <rect x="6" y="6" width="24" height="18" rx="2" fill="#af8d22"/>
      <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">F1</text>
      <!-- Bobbed down by 1px -->
      <circle cx="55" cy="40" r="14" fill="#ffcd75" stroke="#1a1c2c" stroke-width="2"/>
      <rect x="42" y="24" width="26" height="8" rx="2" fill="#e4572e"/>
      <rect x="47" y="54" width="16" height="22" fill="#e4572e"/>
      <!-- Legs together -->
      <line x1="52" y1="76" x2="52" y2="92" stroke="#3b5dc9" stroke-width="6" stroke-linecap="round"/>
      <text x="55" y="105" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#ffc93c" text-anchor="middle">2. PASSING (DOWN)</text>
    </g>

    <!-- Frame 3: Contact B -->
    <g transform="translate(440, 40)">
      <rect width="110" height="120" rx="3" fill="#252a42" stroke="#e4572e" stroke-width="2"/>
      <rect x="6" y="6" width="24" height="18" rx="2" fill="#e4572e"/>
      <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">F2</text>
      <!-- Inverted stride -->
      <circle cx="55" cy="40" r="14" fill="#ffcd75" stroke="#1a1c2c" stroke-width="2"/>
      <rect x="42" y="24" width="26" height="8" rx="2" fill="#e4572e"/>
      <rect x="47" y="54" width="16" height="24" fill="#e4572e"/>
      <!-- Legs inverted -->
      <line x1="48" y1="78" x2="78" y2="98" stroke="#3b5dc9" stroke-width="5" stroke-linecap="round"/>
      <line x1="62" y1="78" x2="32" y2="98" stroke="#3b5dc9" stroke-width="5" stroke-linecap="round"/>
      <text x="55" y="112" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3. CONTACT (R)</text>
    </g>

    <!-- Frame 4: Passing / Up -->
    <g transform="translate(630, 48)">
      <rect width="110" height="112" rx="3" fill="#252a42" stroke="#af8d22" stroke-width="2"/>
      <rect x="6" y="6" width="24" height="18" rx="2" fill="#af8d22"/>
      <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">F3</text>
      <!-- Passing other foot -->
      <circle cx="55" cy="40" r="14" fill="#ffcd75" stroke="#1a1c2c" stroke-width="2"/>
      <rect x="42" y="24" width="26" height="8" rx="2" fill="#e4572e"/>
      <rect x="47" y="54" width="16" height="22" fill="#e4572e"/>
      <line x1="55" y1="76" x2="55" y2="92" stroke="#3b5dc9" stroke-width="6" stroke-linecap="round"/>
      <text x="55" y="105" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#ffc93c" text-anchor="middle">4. PASSING (UP)</text>
    </g>

    <!-- Arrow loop -->
    <path d="M 750 95 C 790 95, 790 15, 410 15 C 30 15, 30 95, 50 95" fill="none" stroke="#ffc93c" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- Bottom Section: Sprite Sheet Packing & Timing Math -->
  <!-- Left Box: Sprite Sheet Texture Map -->
  <g transform="translate(30, 286)" filter="url(#shadow)">
    <rect width="400" height="164" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="16" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#73eff7">SPRITE SHEET TEXTURE SLICING</text>

    <!-- Sliced strip graphic -->
    <g transform="translate(20, 38)">
      <rect width="256" height="64" fill="#10121d" stroke="#257179" stroke-width="2"/>
      <!-- Slices -->
      <line x1="64" y1="0" x2="64" y2="64" stroke="#73eff7" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="128" y1="0" x2="128" y2="64" stroke="#73eff7" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="192" y1="0" x2="192" y2="64" stroke="#73eff7" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- Highlighted Source Rect (Frame 1) -->
      <rect x="64" y="0" width="64" height="64" fill="rgba(228,87,46,0.25)" stroke="#e4572e" stroke-width="3"/>
      <text x="32" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c5c0b3" text-anchor="middle">sx: 0</text>
      <text x="96" y="36" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">sx: 16</text>
      <text x="160" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c5c0b3" text-anchor="middle">sx: 32</text>
      <text x="224" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c5c0b3" text-anchor="middle">sx: 48</text>
    </g>

    <text x="20" y="126" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#a7f070">ctx.drawImage(sheet, frame * 16, 0, 16, 16, px, py, 16, 16);</text>
    <text x="20" y="146" font-family="'DM Sans', sans-serif" font-size="11" fill="#c5c0b3">One texture upload to GPU. Sliced on CPU in 1 draw call.</text>
  </g>

  <!-- Right Box: Frame Rate (FPS) Personality -->
  <g transform="translate(450, 286)" filter="url(#shadow)">
    <rect width="400" height="164" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="16" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffc93c">FPS IS CHARACTER PERSONALITY</text>

    <g transform="translate(16, 38)">
      <rect width="112" height="60" rx="3" fill="#252a42" stroke="#3b4266"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#73eff7">6 FPS</text>
      <text x="12" y="36" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3">166 ms / frame</text>
      <text x="12" y="50" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="700" fill="#ffcd75">Casual Jog</text>
    </g>
    <g transform="translate(144, 38)">
      <rect width="112" height="60" rx="3" fill="#252a42" stroke="#2f8f57" stroke-width="2"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38b764">10 FPS</text>
      <text x="12" y="36" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3">100 ms / frame</text>
      <text x="12" y="50" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="700" fill="#38b764">★ Crisp Courier</text>
    </g>
    <g transform="translate(272, 38)">
      <rect width="112" height="60" rx="3" fill="#252a42" stroke="#3b4266"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ff9e7a">16 FPS</text>
      <text x="12" y="36" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3">62 ms / frame</text>
      <text x="12" y="50" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="700" fill="#e4572e">Urgent Sprint</text>
    </g>

    <text x="16" y="126" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#fff">Timing Rule: Time-driven, never frame-driven.</text>
    <text x="16" y="146" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Advancing frames each display tick doubles character speed on 120Hz screens!</text>
  </g>
</svg>
