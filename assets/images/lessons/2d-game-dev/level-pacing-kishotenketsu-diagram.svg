<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#1e2238"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0a0c16" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="880" height="480" fill="url(#bgGrad)"/>

  <!-- Title -->
  <g transform="translate(30, 22)">
    <rect width="820" height="46" rx="4" fill="#10121d" stroke="#313752" stroke-width="2" filter="url(#shadow)"/>
    <text x="18" y="28" font-family="'Pixelify Sans', 'DM Sans', sans-serif" font-size="19" font-weight="700" fill="#ffc93c" letter-spacing="1">LESSON 09 · KISHŌTENKETSU PACING &amp; GAME FEEL JUICE</text>
    <text x="630" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#73eff7">LEVEL DESIGN</text>
  </g>

  <!-- Top: Kishotenketsu Pacing Waveform Chart -->
  <g transform="translate(30, 84)" filter="url(#shadow)">
    <rect width="820" height="194" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="20" y="26" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffcd75">KISHŌTENKETSU 4-ACT LEVEL PACING WAVEFORM</text>

    <!-- Graph Axis & Waveform -->
    <g transform="translate(40, 42)">
      <!-- Baseline -->
      <line x1="0" y1="110" x2="740" y2="110" stroke="#313752" stroke-width="2"/>

      <!-- Tension curve: Introduce (low) -> Develop (rising) -> Twist (peak) -> Rest (valley) -->
      <path d="M 0 100 Q 60 85 140 85 T 320 50 T 520 20 Q 580 20 620 100 T 740 100" fill="none" stroke="#e4572e" stroke-width="4"/>

      <!-- Shaded area under curve -->
      <path d="M 0 100 Q 60 85 140 85 T 320 50 T 520 20 Q 580 20 620 100 T 740 100 L 740 110 L 0 110 Z" fill="rgba(228,87,46,0.15)"/>

      <!-- Markers & Callouts -->
      <!-- 1. Introduce (Ki) -->
      <g transform="translate(90, 85)">
        <circle cx="0" cy="0" r="6" fill="#38b764"/>
        <text x="0" y="-12" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="700" fill="#38b764" text-anchor="middle">1. INTRODUCE</text>
        <text x="0" y="40" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3" text-anchor="middle">Single spike, low stakes</text>
      </g>

      <!-- 2. Develop (Sho) -->
      <g transform="translate(320, 50)">
        <circle cx="0" cy="0" r="6" fill="#ffc93c"/>
        <text x="0" y="-12" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="700" fill="#ffc93c" text-anchor="middle">2. DEVELOP</text>
        <text x="0" y="70" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3" text-anchor="middle">Combine: Spikes before gap</text>
      </g>

      <!-- 3. Twist (Ten) -->
      <g transform="translate(520, 20)">
        <circle cx="0" cy="0" r="6" fill="#e4572e"/>
        <text x="0" y="-10" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="700" fill="#e4572e" text-anchor="middle">3. TWIST (PEAK)</text>
        <text x="0" y="100" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3" text-anchor="middle">Plank over hazard / Parcel drop</text>
      </g>

      <!-- 4. Rest (Ketsu) -->
      <g transform="translate(670, 100)">
        <circle cx="0" cy="0" r="6" fill="#73eff7"/>
        <text x="0" y="-12" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="700" fill="#73eff7" text-anchor="middle">4. REST</text>
        <text x="0" y="24" font-family="'DM Sans', sans-serif" font-size="10" fill="#c5c0b3" text-anchor="middle">Checkpoint flag &amp; relief</text>
      </g>
    </g>
  </g>

  <!-- Bottom: Game Feel & Sight Lines -->
  <!-- Left Box: Sightlines -->
  <g transform="translate(30, 290)" filter="url(#shadow)">
    <rect width="400" height="160" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="18" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#73eff7">SIGHTLINES: 10-TILE REACTION WINDOW</text>

    <g transform="translate(20, 36)">
      <!-- Player & Vision Cone -->
      <rect x="20" y="30" width="20" height="26" rx="2" fill="#e4572e"/>
      <!-- Cone -->
      <polygon points="40,43 280,10 280,76" fill="rgba(115,239,247,0.12)" stroke="#73eff7" stroke-width="1.5" stroke-dasharray="4,4"/>

      <!-- Hazard placed inside cone -->
      <g transform="translate(220, 46)">
        <polygon points="0,15 10,0 20,15" fill="#e4572e"/>
        <polygon points="15,15 25,0 35,15" fill="#e4572e"/>
        <text x="18" y="-4" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ff3d7f" text-anchor="middle">SPIKES</text>
      </g>
    </g>

    <text x="20" y="140" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Place hazards where players can spot them 500 ms before leaping!</text>
  </g>

  <!-- Right Box: Juice Matrix -->
  <g transform="translate(450, 290)" filter="url(#shadow)">
    <rect width="400" height="160" rx="4" fill="#1b1e30" stroke="#3b4266" stroke-width="2"/>
    <text x="18" y="24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#ffc93c">THE 5 JUICE PILLARS</text>

    <g transform="translate(20, 36)">
      <text x="0" y="16" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#ffcd75">• Squash &amp; Stretch:</text>
      <text x="140" y="16" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">scaleY=0.72 on landing, 1.3 on jump</text>

      <text x="0" y="36" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#73eff7">• Particles:</text>
      <text x="140" y="36" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Dust on floor slide; sparkles on parcels</text>

      <text x="0" y="56" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#38b764">• Hit-Stop:</text>
      <text x="140" y="56" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">70 ms freeze on parcel collection</text>

      <text x="0" y="76" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#e4572e">• Screen Shake:</text>
      <text x="140" y="76" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Decaying camera offset on hazard hit</text>

      <text x="0" y="96" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#a7f070">• Sound Synthesis:</text>
      <text x="140" y="96" font-family="'DM Sans', sans-serif" font-size="10.5" fill="#c5c0b3">Square-wave blips with frequency slide</text>
    </g>
  </g>
</svg>
