<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Earth's Global Annual Mean Energy Budget and Greenhouse Radiative Equilibrium">
  <defs>
    <linearGradient id="bgEb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020914"/>
      <stop offset="100%" stop-color="#07182c"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="irGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="backRad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bgEb)"/>
  <rect x="20" y="20" width="920" height="440" rx="16" fill="none" stroke="#1d4d75" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="56" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">Earth's Global Energy Balance &amp; Greenhouse Mechanism</text>
  <text x="50" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#93c5fd">Global mean annual energy flux in Watts per square meter (W/m²) based on IPCC AR6 / Trenberth planetary budgets</text>

  <!-- Space / Atmosphere boundary -->
  <g transform="translate(50, 95)">
    <!-- Top of Atmosphere Line -->
    <line x1="0" y1="20" x2="860" y2="20" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1.5"/>
    <text x="850" y="14" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Top of Atmosphere (Space)</text>

    <!-- Atmosphere Layer -->
    <rect x="0" y="25" width="860" height="190" fill="#0f2942" fill-opacity="0.45" stroke="#1e4f78" stroke-width="1"/>
    <text x="15" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#7dd3fc">ATMOSPHERE &amp; CLOUDS (N₂, O₂, H₂O, CO₂, CH₄)</text>

    <!-- Earth's Surface -->
    <rect x="0" y="225" width="860" height="110" fill="#0c1f17" stroke="#15803d" stroke-width="1.5"/>
    <text x="15" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#86efac">EARTH'S SURFACE (Continents &amp; Oceans · Mean Temp ~15°C)</text>

    <!-- 1. Incoming Solar (Yellow) -->
    <g transform="translate(40, 20)">
      <polygon points="0,0 80,0 80,205 0,205" fill="url(#sunbeam)" fill-opacity="0.85"/>
      <polygon points="80,0 120,0 120,60 80,60" fill="url(#sunbeam)" fill-opacity="0.85"/>
      <!-- Reflected shortwave back to space -->
      <path d="M 80,60 Q 140,20 180,0 L 210,0 Q 140,40 80,75 Z" fill="#fde047"/>
      <polygon points="185,5 210,0 195,15" fill="#fde047"/>
      <text x="40" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f172a">Incoming Solar</text>
      <text x="40" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">340 W/m²</text>
      <text x="150" y="40" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fde047">Reflected ~100 W/m² (Albedo ~0.30)</text>
      <text x="40" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Absorbed: 160 W/m²</text>
    </g>

    <!-- 2. Thermal Infrared Emitted by Surface (Red) -->
    <g transform="translate(360, 225)">
      <!-- Massive upward IR beam -->
      <polygon points="0,0 90,0 90,-160 0,-160" fill="url(#irGrad)" fill-opacity="0.85"/>
      <text x="45" y="-70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Surface Thermal IR</text>
      <text x="45" y="-50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">398 W/m²</text>
      <text x="45" y="-30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fee2e2">(Stefan-Boltzmann: σT⁴)</text>
    </g>

    <!-- 3. Atmospheric Absorption & Window -->
    <g transform="translate(470, 65)">
      <!-- Atmospheric window escape directly to space (~40 W/m²) -->
      <polygon points="0,0 25,0 25,-45 0,-45" fill="#f87171" fill-opacity="0.6"/>
      <polygon points="12,-45 20,-35 4,-35" fill="#f87171"/>
      <text x="35" y="-20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fca5a5">Atmospheric Window: 40 W/m²</text>
    </g>

    <!-- 4. Greenhouse Back-Radiation Downward (Orange) -->
    <g transform="translate(560, 65)">
      <!-- Trapped and re-emitted downward -->
      <polygon points="0,0 85,0 85,160 0,160" fill="url(#backRad)" fill-opacity="0.85"/>
      <polygon points="42,160 30,145 54,145" fill="#ea580c"/>
      <text x="42" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Greenhouse Effect</text>
      <text x="42" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">342 W/m²</text>
      <text x="42" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#fed7aa">Back-Radiation from CO₂, H₂O</text>
    </g>

    <!-- 5. Net Outgoing to Space -->
    <g transform="translate(680, 20)">
      <polygon points="0,45 60,45 60,0 0,0" fill="#f87171" fill-opacity="0.85"/>
      <polygon points="30,0 20,10 40,10" fill="#f87171"/>
      <text x="30" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Net Outgoing IR</text>
      <text x="30" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">240 W/m²</text>
    </g>

    <!-- Bottom summary banner -->
    <rect x="0" y="345" width="860" height="30" rx="6" fill="#081523" stroke="#1d4d75"/>
    <text x="430" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#7dd3fc">Radiative Equilibrium: Net Absorbed Solar (340 - 100 = 240 W/m²) equals Net Outgoing Thermal IR (240 W/m²)</text>
  </g>
</svg>

