<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="spt-title spt-desc">
  <title id="spt-title">States of Matter and Phase Transitions Diagram</title>
  <desc id="spt-desc">Diagram comparing Solid, Liquid, Gas, and Plasma particle arrangements alongside endothermic transitions (melting, vaporization, sublimation, ionization) and exothermic transitions (freezing, condensation, deposition, recombination).</desc>
  <defs>
    <marker id="arrow-endo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-exo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 L8.5 5 L1 8.5 z" fill="#38bdf8" />
    </marker>
    <linearGradient id="enthalpy-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <!-- Opaque dark backdrop for clean contrast inline and in PhotoLightbox -->
  <rect x="0" y="0" width="920" height="340" rx="16" fill="#0c1524" />
  <rect x="1" y="1" width="918" height="338" rx="15" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="1.5" />

  <!-- Subtle header -->
  <text x="460" y="25" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.04em">PHASES OF MATTER &amp; THERMAL TRANSITIONS</text>

  <!-- Top overarching arc: Sublimation (Solid -> Gas) -->
  <path d="M105 94 Q341 34 577 92" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-endo)" />
  <rect x="260" y="42" width="162" height="22" rx="11" fill="#172033" stroke="#f59e0b" stroke-width="1" />
  <text x="341" y="57" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Sublimation (ΔH &gt; 0)</text>

  <!-- 1. SOLID BOX -->
  <g transform="translate(36,96)">
    <rect width="138" height="140" rx="12" fill="#13233a" stroke="#60a5fa" stroke-width="1.8" />
    <text x="69" y="22" text-anchor="middle" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">SOLID</text>
    <!-- Ordered crystal lattice + vibration arcs -->
    <g fill="#60a5fa" stroke="#bfdbfe" stroke-width="1">
      <circle cx="43" cy="52" r="8" /><circle cx="69" cy="52" r="8" /><circle cx="95" cy="52" r="8" />
      <circle cx="43" cy="76" r="8" /><circle cx="69" cy="76" r="8" /><circle cx="95" cy="76" r="8" />
      <circle cx="43" cy="100" r="8" /><circle cx="69" cy="100" r="8" /><circle cx="95" cy="100" r="8" />
    </g>
    <path d="M31 48 q-4 4 0 8 M107 48 q4 4 0 8 M31 96 q-4 4 0 8 M107 96 q4 4 0 8" fill="none" stroke="#93c5fd" stroke-width="1.3" stroke-linecap="round" />
    <text x="69" y="123" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="10">Fixed shape &amp; volume</text>
    <text x="69" y="134" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9.5">Vibrating lattice</text>
  </g>

  <!-- 2. LIQUID BOX -->
  <g transform="translate(272,96)">
    <rect width="138" height="140" rx="12" fill="#112736" stroke="#2dd4bf" stroke-width="1.8" />
    <text x="69" y="22" text-anchor="middle" fill="#5eead4" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">LIQUID</text>
    <!-- Disordered close-packed spheres + slip arrows -->
    <g fill="#2dd4bf" stroke="#99f6e4" stroke-width="1">
      <circle cx="38" cy="70" r="8" /><circle cx="59" cy="60" r="8" /><circle cx="80" cy="72" r="8" />
      <circle cx="100" cy="62" r="8" /><circle cx="46" cy="92" r="8" /><circle cx="68" cy="96" r="8" />
      <circle cx="92" cy="92" r="8" /><circle cx="106" cy="84" r="7.5" /><circle cx="34" cy="88" r="7.5" />
    </g>
    <path d="M46 46 c8 -5 16 -4 23 1 M76 47 c7 -4 14 -3 20 2" fill="none" stroke="#5eead4" stroke-width="1.4" stroke-linecap="round" />
    <text x="69" y="123" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="10">Fixed volume, flows</text>
    <text x="69" y="134" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9.5">Particles slide past</text>
  </g>

  <!-- 3. GAS BOX -->
  <g transform="translate(508,96)">
    <rect width="138" height="140" rx="12" fill="#271d18" stroke="#fbbf24" stroke-width="1.8" />
    <text x="69" y="22" text-anchor="middle" fill="#fcd34d" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">GAS</text>
    <!-- Widely separated spheres + velocity tails -->
    <g stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round">
      <line x1="36" y1="54" x2="54" y2="44" />
      <line x1="94" y1="56" x2="78" y2="70" />
      <line x1="42" y1="95" x2="62" y2="87" />
      <line x1="98" y1="96" x2="80" y2="104" />
    </g>
    <g fill="#f59e0b" stroke="#fde68a" stroke-width="1">
      <circle cx="36" cy="54" r="6.5" />
      <circle cx="96" cy="54" r="6.5" />
      <circle cx="40" cy="96" r="6.5" />
      <circle cx="100" cy="96" r="6.5" />
      <circle cx="69" cy="76" r="6.5" />
    </g>
    <text x="69" y="123" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="10">Fills container volume</text>
    <text x="69" y="134" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9.5">Fast, far apart</text>
  </g>

  <!-- 4. PLASMA BOX -->
  <g transform="translate(744,96)">
    <rect width="138" height="140" rx="12" fill="#2a1529" stroke="#fb7185" stroke-width="1.8" />
    <text x="69" y="22" text-anchor="middle" fill="#fda4af" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">PLASMA</text>
    <!-- Positive ions and free electrons -->
    <g fill="#fb7185" stroke="#fecdd3" stroke-width="1">
      <circle cx="42" cy="58" r="7.5" />
      <circle cx="94" cy="60" r="7.5" />
      <circle cx="66" cy="92" r="7.5" />
    </g>
    <g fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
      <text x="42" y="61.5">+</text><text x="94" y="63.5">+</text><text x="66" y="95.5">+</text>
    </g>
    <!-- Free electrons -->
    <g fill="#38bdf8">
      <circle cx="66" cy="48" r="3" />
      <circle cx="34" cy="86" r="3" />
      <circle cx="102" cy="92" r="3" />
      <circle cx="84" cy="76" r="3" />
    </g>
    <g fill="#bae6fd" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700">
      <text x="72" y="49">e⁻</text>
      <text x="21" y="90">e⁻</text>
      <text x="108" y="95">e⁻</text>
    </g>
    <text x="69" y="123" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="10">Ionized ions &amp; free e⁻</text>
    <text x="69" y="134" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9.5">Conducts electricity</text>
  </g>

  <!-- Gap 1 arrows: Solid <-> Liquid -->
  <line x1="179" y1="142" x2="265" y2="142" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arrow-endo)" />
  <text x="223" y="131" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Melting</text>
  <text x="223" y="156" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9.5">(Fusion)</text>

  <line x1="267" y1="196" x2="181" y2="196" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arrow-exo)" />
  <text x="223" y="185" text-anchor="middle" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Freezing</text>
  <text x="223" y="210" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9.5">(Crystallization)</text>

  <!-- Gap 2 arrows: Liquid <-> Gas -->
  <line x1="415" y1="142" x2="501" y2="142" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arrow-endo)" />
  <text x="459" y="131" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Vaporization</text>
  <text x="459" y="156" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9.5">(Boiling / Evap.)</text>

  <line x1="503" y1="196" x2="417" y2="196" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arrow-exo)" />
  <text x="459" y="185" text-anchor="middle" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Condensation</text>

  <!-- Gap 3 arrows: Gas <-> Plasma -->
  <line x1="651" y1="142" x2="737" y2="142" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arrow-endo)" />
  <text x="695" y="131" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Ionization</text>
  <text x="695" y="156" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9.5">(Very high T / E)</text>

  <line x1="739" y1="196" x2="653" y2="196" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arrow-exo)" />
  <text x="695" y="185" text-anchor="middle" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700">Recombination</text>

  <!-- Bottom overarching arc: Deposition (Gas -> Solid) -->
  <path d="M577 240 Q341 298 107 242" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-exo)" />
  <rect x="260" y="271" width="162" height="22" rx="11" fill="#172033" stroke="#38bdf8" stroke-width="1" />
  <text x="341" y="286" text-anchor="middle" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Deposition (ΔH &lt; 0)</text>

  <!-- Legend & Enthalpy axis -->
  <line x1="56" y1="316" x2="864" y2="316" stroke="url(#enthalpy-grad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="170" cy="330" r="4.5" fill="#f59e0b" />
  <text x="180" y="333.5" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600">Endothermic: heat absorbed (ΔH &gt; 0)</text>
  <circle cx="485" cy="330" r="4.5" fill="#38bdf8" />
  <text x="495" y="333.5" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600">Exothermic: heat released (ΔH &lt; 0)</text>
</svg>
