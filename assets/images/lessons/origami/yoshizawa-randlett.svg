<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="500" aria-labelledby="yr-title yr-desc" role="img">
  <title id="yr-title">The Yoshizawa-Randlett Origami Diagramming System</title>
  <desc id="yr-desc">Standard international symbols and fold lines used to read and communicate origami instructions, invented by Akira Yoshizawa and Samuel Randlett.</desc>
  <defs>
    <filter id="yrShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="foldArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="mArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="500" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">The International Yoshizawa-Randlett Notation</text>
  <text x="40" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Created in the 1950s by grandmaster Akira Yoshizawa and refined by Samuel Randlett to make origami diagrams universally readable without words</text>

  <!-- Grid of 8 symbols -->
  <!-- 1. Valley Fold -->
  <g transform="translate(40, 95)">
    <rect width="210" height="175" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#yrShadow)" />
    <rect width="210" height="28" rx="10" fill="#eff6ff" />
    <text x="12" y="19" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">1. Valley Fold</text>
    <line x1="25" y1="80" x2="185" y2="80" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 5" />
    <!-- Curved fold arrow towards viewer -->
    <path d="M 60 115 Q 105 50 150 115" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#foldArrow)" />
    <text x="12" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Dashed line ( - - - )</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Fold edge forward towards you</text>
  </g>

  <!-- 2. Mountain Fold -->
  <g transform="translate(275, 95)">
    <rect width="210" height="175" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#yrShadow)" />
    <rect width="210" height="28" rx="10" fill="#fef2f2" />
    <text x="12" y="19" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#991b1b">2. Mountain Fold</text>
    <line x1="25" y1="80" x2="185" y2="80" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 3 2 3" />
    <!-- Fold arrow away -->
    <path d="M 60 115 Q 105 145 150 115" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#mArrow)" />
    <text x="12" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Dash-dot-dot ( - ·· - )</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Fold edge backward behind you</text>
  </g>

  <!-- 3. Fold and Unfold -->
  <g transform="translate(510, 95)">
    <rect width="210" height="175" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#yrShadow)" />
    <rect width="210" height="28" rx="10" fill="#f0fdf4" />
    <text x="12" y="19" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534">3. Fold &amp; Unfold</text>
    <line x1="25" y1="80" x2="185" y2="80" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 5" />
    <!-- Two-headed return arrow -->
    <path d="M 65 110 C 105 60, 105 60, 145 110" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#foldArrow)" />
    <path d="M 145 110 C 115 80, 115 80, 85 110" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3 3" />
    <text x="12" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Crease &amp; Open Back</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Make reference crease line only</text>
  </g>

  <!-- 4. Existing Crease -->
  <g transform="translate(745, 95)">
    <rect width="215" height="175" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#yrShadow)" />
    <rect width="215" height="28" rx="10" fill="#f8fafc" />
    <text x="12" y="19" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#334155">4. Existing Crease</text>
    <line x1="25" y1="80" x2="190" y2="80" stroke="#94a3b8" stroke-width="2" />
    <circle cx="107" cy="80" r="4" fill="#94a3b8" />
    <text x="12" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Solid Gray Line ( ── )</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Existing folded fold or crease</text>
  </g>

  <!-- 5. Turn Over / Flip -->
  <g transform="translate(40, 290)">
    <rect width="210" height="175" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#yrShadow)" />
    <rect width="210" height="28" rx="10" fill="#fdf4ff" />
    <text x="12" y="19" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#86198f">5. Turn Over (Flip)</text>
    <!-- Loop arrow -->
    <path d="M 70 85 C 70 45, 140 45, 140 85 C 140 115, 95 105, 95 85" fill="none" stroke="#a21caf" stroke-width="3" marker-end="url(#foldArrow)" />
    <text x="12" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Loop Arrow ↺</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Turn the entire model over</text>
  </g>

  <!-- 6. Rotate -->
  <g transform="translate(275, 290)">
    <rect width="210" height="175" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#yrShadow)" />
    <rect width="210" height="28" rx="10" fill="#fefce8" />
    <text x="12" y="19" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#854d0e">6. Rotate</text>
    <!-- Circular arrows -->
    <path d="M 80 80 A 30 30 0 1 1 130 80" fill="none" stroke="#ca8a04" stroke-width="3" marker-end="url(#foldArrow)" />
    <text x="12" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Circular Arrow ↻</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Rotate paper on the table</text>
  </g>

  <!-- 7. Squash Fold -->
  <g transform="translate(510, 290)">
    <rect width="210" height="175" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#yrShadow)" />
    <rect width="210" height="28" rx="10" fill="#fff7ed" />
    <text x="12" y="19" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#9a3412">7. Squash Fold</text>
    <!-- Open hollow push arrow -->
    <polygon points="105,50 120,70 110,70 110,100 100,100 100,70 90,70" fill="#ea580c" stroke="#9a3412" stroke-width="1.5" />
    <text x="12" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Hollow Arrow ⤋</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Open flap and press flat</text>
  </g>

  <!-- 8. Reverse Fold -->
  <g transform="translate(745, 290)">
    <rect width="215" height="175" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#yrShadow)" />
    <rect width="215" height="28" rx="10" fill="#f0fdfa" />
    <text x="12" y="19" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#115e59">8. Inside Reverse Fold</text>
    <!-- Inverted push arrow -->
    <path d="M 80 80 Q 107 50 135 75" fill="none" stroke="#0d9488" stroke-width="3" marker-end="url(#foldArrow)" />
    <text x="12" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Inside/Outside Reverse</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Push spine between layers (crane neck/head)</text>
  </g>
</svg>
