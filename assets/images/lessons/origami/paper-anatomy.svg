<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">One sheet becomes a structure</title><desc id="desc">Look for edges, layered faces, and the creases that act as hinges.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f5dfba"/><stop offset="1" stop-color="#ce9f67"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#185780" stroke-width="2"/></marker><filter id="fiber"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="12"/><feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 .12 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="soft-light"/><feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#574029" flood-opacity=".18"/></filter></defs><rect width="1000" height="440" rx="12" fill="#faf7ef"/><g font-family="Arial,sans-serif" fill="#594a39"><text x="32" y="42" font-size="26" font-weight="700">One sheet becomes a structure</text><text x="32" y="70" font-size="16">Look for edges, layered faces, and the creases that act as hinges.</text><ellipse cx="260" cy="335" rx="180" ry="18" fill="#594a39" opacity=".08"/><g filter="url(#fiber)" stroke="#80634a" stroke-width="1.5" stroke-linejoin="round"><path d="M80 280L260 115L440 280L260 330Z" fill="url(#paper)"/><path d="M80 280L260 220L260 115" fill="#fff8e8"/><path d="M260 220L440 280L260 330Z" fill="#ba8752"/><path d="M260 115V220L80 280" fill="none" stroke-dasharray="8 6"/></g><g font-size="17"><text x="510" y="135" font-weight="700">Paper has two faces</text><text x="510" y="162">Ochre = front · ivory = reverse</text><path d="M495 150L290 170" fill="none" stroke="#185780" marker-end="url(#arrow)"/><text x="510" y="225" font-weight="700">Creases connect moving panels</text><text x="510" y="252">A fold changes the angle between faces.</text><path d="M495 238L270 220" fill="none" stroke="#185780" marker-end="url(#arrow)"/><text x="510" y="315" font-weight="700">Edges can overlap</text><text x="510" y="342">Check which layer the instruction moves.</text><path d="M495 320L365 300" fill="none" stroke="#185780" marker-end="url(#arrow)"/></g><path d="M32 392H968" stroke="#d8cebb"/><text x="32" y="420" font-size="14">ClassroomOS original illustration · Schematic; paper thickness exaggerated where shown.</text></g></svg>