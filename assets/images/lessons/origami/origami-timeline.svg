<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="480" aria-labelledby="timeline-title timeline-desc" role="img">
  <title id="timeline-title">Historical Evolution of Origami: From Ancient Paper to Computational Geometry</title>
  <desc id="timeline-desc">A timeline diagram chronicling origami milestones from Cai Lun's paper invention in 105 CE to space solar arrays and computational origami algorithms in the 21st century.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="25%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="40" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">The 2,000-Year Evolution of Origami</text>
  <text x="40" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">From sacred Edo ceremonial folds and kindergarten pedagogy to space solar panels and computational mathematics</text>

  <!-- Main Timeline Track -->
  <line x1="60" y1="240" x2="940" y2="240" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Milestone 1: 105 CE -->
  <g transform="translate(90, 240)">
    <circle cx="0" cy="0" r="11" fill="#dc2626" stroke="#ffffff" stroke-width="3" />
    <line x1="0" y1="-12" x2="0" y2="-65" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 3" />
    <rect x="-75" y="-180" width="150" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="-75" y="-180" width="150" height="6" rx="3" fill="#dc2626" />
    <text x="-65" y="-156" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">c. 105 CE · China</text>
    <text x="-65" y="-138" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Invention of Paper</text>
    <text x="-65" y="-118" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Cai Lun standardizes</text>
    <text x="-65" y="-102" font-family="system-ui, sans-serif" font-size="11" fill="#475569">plant-fiber papermaking;</text>
    <text x="-65" y="-86" font-family="system-ui, sans-serif" font-size="11" fill="#475569">earliest folding uses.</text>
  </g>

  <!-- Milestone 2: 610 CE -->
  <g transform="translate(230, 240)">
    <circle cx="0" cy="0" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3" />
    <line x1="0" y1="12" x2="0" y2="65" stroke="#ea580c" stroke-width="2" stroke-dasharray="3 3" />
    <rect x="-75" y="70" width="150" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="-75" y="70" width="150" height="6" rx="3" fill="#ea580c" />
    <text x="-65" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ea580c">610 CE · Japan</text>
    <text x="-65" y="114" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Sacred Paper Craft</text>
    <text x="-65" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Buddhist monk Dokyo</text>
    <text x="-65" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#475569">brings paper; ceremonial</text>
    <text x="-65" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Noshi &amp; Tsutsumi folds.</text>
  </g>

  <!-- Milestone 3: 1797 CE -->
  <g transform="translate(375, 240)">
    <circle cx="0" cy="0" r="11" fill="#d97706" stroke="#ffffff" stroke-width="3" />
    <line x1="0" y1="-12" x2="0" y2="-65" stroke="#d97706" stroke-width="2" stroke-dasharray="3 3" />
    <rect x="-75" y="-180" width="150" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="-75" y="-180" width="150" height="6" rx="3" fill="#d97706" />
    <text x="-65" y="-156" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#d97706">1797 · Edo Period</text>
    <text x="-65" y="-138" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">First Origami Book</text>
    <text x="-65" y="-118" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Hiden Senbazuru Orikata</text>
    <text x="-65" y="-102" font-family="system-ui, sans-serif" font-size="11" fill="#475569">published; folding cranes</text>
    <text x="-65" y="-86" font-family="system-ui, sans-serif" font-size="11" fill="#475569">becomes popular art.</text>
  </g>

  <!-- Milestone 4: 1837 CE -->
  <g transform="translate(515, 240)">
    <circle cx="0" cy="0" r="9" fill="#0284c7" stroke="#ffffff" stroke-width="3" />
    <line x1="0" y1="12" x2="0" y2="65" stroke="#0284c7" stroke-width="2" stroke-dasharray="3 3" />
    <rect x="-75" y="70" width="150" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="-75" y="70" width="150" height="6" rx="3" fill="#0284c7" />
    <text x="-65" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0284c7">1837 · Germany</text>
    <text x="-65" y="114" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Fröbel &amp; Bauhaus</text>
    <text x="-65" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Kindergarten founder uses</text>
    <text x="-65" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#475569">paper geometry; later</text>
    <text x="-65" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#475569">adopted by Bauhaus.</text>
  </g>

  <!-- Milestone 5: 1954 CE -->
  <g transform="translate(655, 240)">
    <circle cx="0" cy="0" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="3" />
    <line x1="0" y1="-12" x2="0" y2="-65" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 3" />
    <rect x="-75" y="-180" width="150" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="-75" y="-180" width="150" height="6" rx="3" fill="#2563eb" />
    <text x="-65" y="-156" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">1954 · Modern Era</text>
    <text x="-65" y="-138" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Akira Yoshizawa</text>
    <text x="-65" y="-118" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Standard notation</text>
    <text x="-65" y="-102" font-family="system-ui, sans-serif" font-size="11" fill="#475569">(Yoshizawa-Randlett) &amp;</text>
    <text x="-65" y="-86" font-family="system-ui, sans-serif" font-size="11" fill="#475569">wet-folding sculpture.</text>
  </g>

  <!-- Milestone 6: 1970–1995 CE -->
  <g transform="translate(795, 240)">
    <circle cx="0" cy="0" r="9" fill="#7c3aed" stroke="#ffffff" stroke-width="3" />
    <line x1="0" y1="12" x2="0" y2="65" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 3" />
    <rect x="-75" y="70" width="150" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="-75" y="70" width="150" height="6" rx="3" fill="#7c3aed" />
    <text x="-65" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7c3aed">1970–1995 · Space</text>
    <text x="-65" y="114" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Miura-ori in Space</text>
    <text x="-65" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Koryo Miura rigid fold;</text>
    <text x="-65" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#475569">deployed on Japan's SFU</text>
    <text x="-65" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#475569">solar array in orbit.</text>
  </g>

  <!-- Milestone 7: 2000s–Present -->
  <g transform="translate(910, 240)">
    <circle cx="0" cy="0" r="11" fill="#9333ea" stroke="#ffffff" stroke-width="3" />
    <line x1="0" y1="-12" x2="0" y2="-65" stroke="#9333ea" stroke-width="2" stroke-dasharray="3 3" />
    <rect x="-85" y="-180" width="160" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="-85" y="-180" width="160" height="6" rx="3" fill="#9333ea" />
    <text x="-75" y="-156" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9333ea">2000s+ · Modern Tech</text>
    <text x="-75" y="-138" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Computational Origami</text>
    <text x="-75" y="-118" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Lang (TreeMaker), Demaine</text>
    <text x="-75" y="-102" font-family="system-ui, sans-serif" font-size="11" fill="#475569">(Fold-and-Cut), medical</text>
    <text x="-75" y="-86" font-family="system-ui, sans-serif" font-size="11" fill="#475569">stents &amp; JWST shields.</text>
  </g>
</svg>
