<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="520" aria-labelledby="mk-title mk-desc" role="img">
  <title id="mk-title">Flat Foldability: Maekawa's and Kawasaki's Theorems</title>
  <desc id="mk-desc">Mathematical diagram illustrating Maekawa's Theorem regarding mountain and valley creases and Kawasaki's Theorem regarding alternating angles at a flat-foldable origami vertex.</desc>
  <defs>
    <filter id="mkShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="1000" height="520" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">The Laws of Flat Foldability</text>
  <text x="40" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Two foundational theorems that govern whether a crease pattern can fold completely flat without paper distortion</text>

  <!-- Left Card: Maekawa's Theorem -->
  <g transform="translate(40, 95)">
    <rect width="440" height="390" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#mkShadow)" />
    <rect width="440" height="38" rx="12" fill="#fef2f2" />
    <text x="18" y="25" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#991b1b">1. Maekawa's Theorem: |M - V| = 2</text>

    <!-- Visual: 4 creases meeting at vertex (3 Mountains, 1 Valley) -->
    <g transform="translate(220, 160)">
      <circle cx="0" cy="0" r="100" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- Vertex Center -->
      <circle cx="0" cy="0" r="7" fill="#0f172a" />

      <!-- Crease 1: M (0 deg) -->
      <line x1="0" y1="0" x2="95" y2="-30" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 3 3 3" />
      <text x="75" y="-45" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626">M₁</text>

      <!-- Crease 2: M (90 deg) -->
      <line x1="0" y1="0" x2="-25" y2="-95" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 3 3 3" />
      <text x="-48" y="-80" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626">M₂</text>

      <!-- Crease 3: M (180 deg) -->
      <line x1="0" y1="0" x2="-95" y2="25" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 3 3 3" />
      <text x="-95" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626">M₃</text>

      <!-- Crease 4: V (270 deg) -->
      <line x1="0" y1="0" x2="25" y2="95" stroke="#2563eb" stroke-width="4" stroke-dasharray="6 4" />
      <text x="35" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#2563eb">V₁</text>
    </g>

    <!-- Explanation Box -->
    <rect x="20" y="275" width="400" height="95" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="32" y="298" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Rule of Mountain &amp; Valley Counts</text>
    <text x="32" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• At any flat-foldable interior vertex, M − V = +2 or −2.</text>
    <text x="32" y="340" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• In this example: 3 Mountains − 1 Valley = 2 (Valid!).</text>
    <text x="32" y="360" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#dc2626">• Consequence: Every interior vertex has an EVEN number of creases (≥4).</text>
  </g>

  <!-- Right Card: Kawasaki's Theorem -->
  <g transform="translate(520, 95)">
    <rect width="440" height="390" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#mkShadow)" />
    <rect width="440" height="38" rx="12" fill="#eff6ff" />
    <text x="18" y="25" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af">2. Kawasaki's Theorem: θ₁ + θ₃ = θ₂ + θ₄ = 180°</text>

    <!-- Visual: 4 sector angles with alternating colored arcs -->
    <g transform="translate(220, 160)">
      <circle cx="0" cy="0" r="100" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <circle cx="0" cy="0" r="7" fill="#0f172a" />

      <!-- Angles: θ1 = 60°, θ2 = 120°, θ3 = 120°, θ4 = 60° -->
      <!-- Line 0: right (0°) -->
      <line x1="0" y1="0" x2="100" y2="0" stroke="#0f172a" stroke-width="2.5" />
      <!-- Line 1: 60° (x=50, y=-86.6) -->
      <line x1="0" y1="0" x2="50" y2="-86.6" stroke="#0f172a" stroke-width="2.5" />
      <!-- Line 2: 180° (x=-100, y=0) -->
      <line x1="0" y1="0" x2="-100" y2="0" stroke="#0f172a" stroke-width="2.5" />
      <!-- Line 3: 300° (x=50, y=86.6) -->
      <line x1="0" y1="0" x2="50" y2="86.6" stroke="#0f172a" stroke-width="2.5" />

      <!-- Sector 1: θ1 = 60° (Odd, blue) -->
      <path d="M 0 0 L 30 0 A 30 30 0 0 0 15 -26 Z" fill="rgba(37,99,235,0.2)" stroke="#2563eb" stroke-width="1.5" />
      <text x="36" y="-18" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#2563eb">θ₁=60°</text>

      <!-- Sector 2: θ2 = 120° (Even, orange) -->
      <path d="M 0 0 L 20 -34.6 A 40 40 0 0 0 -40 0 Z" fill="rgba(234,88,12,0.18)" stroke="#ea580c" stroke-width="1.5" />
      <text x="-25" y="-45" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ea580c">θ₂=120°</text>

      <!-- Sector 3: θ3 = 120° (Odd, blue) -->
      <path d="M 0 0 L -30 0 A 30 30 0 0 0 15 26 Z" fill="rgba(37,99,235,0.2)" stroke="#2563eb" stroke-width="1.5" />
      <text x="-35" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#2563eb">θ₃=120°</text>

      <!-- Sector 4: θ4 = 60° (Even, orange) -->
      <path d="M 0 0 L 20 34.6 A 40 40 0 0 0 40 0 Z" fill="rgba(234,88,12,0.18)" stroke="#ea580c" stroke-width="1.5" />
      <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ea580c">θ₄=60°</text>
    </g>

    <!-- Explanation Box -->
    <rect x="20" y="275" width="400" height="95" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="32" y="298" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Alternating Angle Sum Criterion</text>
    <text x="32" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Sum of Odd Angles: θ₁ + θ₃ = 60° + 120° = <strong fill="#2563eb">180°</strong></text>
    <text x="32" y="340" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Sum of Even Angles: θ₂ + θ₄ = 120° + 60° = <strong fill="#ea580c">180°</strong></text>
    <text x="32" y="360" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#16a34a">• Both equal 180°: The paper can fold flat without crumpling!</text>
  </g>
</svg>
