<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="480" aria-labelledby="cp-title cp-desc" role="img">
  <title id="cp-title">Two-Colorability Theorem of Flat-Foldable Crease Patterns</title>
  <desc id="cp-desc">Diagram demonstrating that every flat-foldable origami crease pattern can be 2-colored like a checkerboard, corresponding to face orientations in the folded state.</desc>
  <defs>
    <filter id="cpShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="1000" height="480" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">The Two-Colorability Theorem</text>
  <text x="40" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">A mathematical property of flat-foldability: any valid flat-foldable crease pattern's faces can always be 2-colored</text>

  <!-- Left: Unfolded Crease Pattern (2-Colored) -->
  <g transform="translate(60, 100)">
    <rect width="400" height="340" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cpShadow)" />
    <rect width="400" height="34" rx="12" fill="#f8fafc" />
    <text x="18" y="23" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Unfolded Crease Pattern (Dual Bipartite Graph)</text>

    <!-- Square paper with traditional Bird Base / Waterbomb crease pattern -->
    <g transform="translate(80, 55)">
      <rect x="0" y="0" width="240" height="240" fill="#ffffff" stroke="#0f172a" stroke-width="2" />

      <!-- 2-colored triangles -->
      <!-- Center is at 120, 120 -->
      <!-- Diagonals and medians create 8 triangles -->
      <polygon points="0,0 120,0 120,120" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 2" />
      <polygon points="120,0 240,0 120,120" fill="#fed7aa" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="8 3" />
      <polygon points="240,0 240,120 120,120" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 2" />
      <polygon points="240,120 240,240 120,120" fill="#fed7aa" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="8 3" />
      <polygon points="240,240 120,240 120,120" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 2" />
      <polygon points="120,240 0,240 120,120" fill="#fed7aa" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="8 3" />
      <polygon points="0,240 0,120 120,120" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 2" />
      <polygon points="0,120 0,0 120,120" fill="#fed7aa" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="8 3" />

      <circle cx="120" cy="120" r="5" fill="#0f172a" />
    </g>

    <text x="25" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#475569">No two adjacent faces sharing a crease line have the same color.</text>
  </g>

  <!-- Right: Physical Meaning in 3D Flat Folded State -->
  <g transform="translate(520, 100)">
    <rect width="420" height="340" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cpShadow)" />
    <rect width="420" height="34" rx="12" fill="#eff6ff" />
    <text x="18" y="23" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1d4ed8">Physical Orientation in the Flat State</text>

    <!-- Side view / layer view -->
    <g transform="translate(40, 70)">
      <rect x="0" y="0" width="340" height="130" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Layer Orientation Law:</text>
      <text x="20" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#1e40af">• All <tspan font-weight="700" fill="#2563eb">Blue</tspan> faces point UP toward the ceiling (+Z)</text>
      <text x="20" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#9a3412">• All <tspan font-weight="700" fill="#ea580c">Orange</tspan> faces point DOWN toward the table (−Z)</text>
      <text x="20" y="105" font-family="system-ui, sans-serif" font-size="11.5" fill="#475569">Because every fold flips the surface normal by 180°, adjacent faces must face opposite directions!</text>
    </g>

    <!-- Summary box -->
    <rect x="30" y="225" width="360" height="85" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="45" y="248" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#166534">Mathematical Equivalence</text>
    <text x="45" y="268" font-family="system-ui, sans-serif" font-size="11.5" fill="#166534">• Any crease pattern with an even degree at every vertex is 2-colorable.</text>
    <text x="45" y="288" font-family="system-ui, sans-serif" font-size="11.5" fill="#166534">• This is directly tied to Euler tours on planar graphs.</text>
  </g>
</svg>
