<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="520" aria-labelledby="miura-title miura-desc" role="img">
  <title id="miura-title">The Miura Fold: Space Engineering &amp; Auxetic Tessellation</title>
  <desc id="miura-desc">Diagram showing the Miura-ori herringbone crease pattern, its rigid folding mechanics, and its application in deployable space solar arrays.</desc>
  <defs>
    <filter id="mShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="1000" height="520" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">The Miura-ori: Origami in Space Engineering</text>
  <text x="40" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Invented in 1970 by astrophysicist Koryo Miura: a rigid origami tessellation that expands with 1 degree of freedom and negative Poisson ratio</text>

  <!-- Left: Crease Pattern Grid -->
  <g transform="translate(40, 95)">
    <rect width="450" height="390" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#mShadow)" />
    <rect width="450" height="38" rx="12" fill="#f0fdf4" />
    <text x="18" y="25" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#166534">The Miura-ori Crease Pattern (Tessellation)</text>

    <!-- Herringbone Pattern -->
    <g transform="translate(45, 60)">
      <!-- Row 1 -->
      <polygon points="0,0 70,25 70,85 0,60" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 3" />
      <polygon points="70,25 140,0 140,60 70,85" fill="#f1f5f9" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 3" />
      <polygon points="140,0 210,25 210,85 140,60" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 3" />
      <polygon points="210,25 280,0 280,60 210,85" fill="#f1f5f9" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 3" />
      <polygon points="280,0 350,25 350,85 280,60" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 3" />

      <!-- Row 2 -->
      <polygon points="0,60 70,85 70,145 0,120" fill="#f1f5f9" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 3" />
      <polygon points="70,85 140,60 140,120 70,145" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 3" />
      <polygon points="70,85 140,60 140,120 70,145" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 3" />
      <polygon points="140,60 210,85 210,145 140,120" fill="#f1f5f9" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 3" />
      <polygon points="210,85 280,60 280,120 210,145" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 3" />
      <polygon points="280,60 350,85 350,145 280,120" fill="#f1f5f9" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 3" />

      <!-- Row 3 -->
      <polygon points="0,120 70,145 70,205 0,180" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 3" />
      <polygon points="70,145 140,120 140,180 70,205" fill="#f1f5f9" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 3" />
      <polygon points="140,120 210,145 210,205 140,180" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 3" />
      <polygon points="210,145 280,120 280,180 210,205" fill="#f1f5f9" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 3" />
      <polygon points="280,120 350,145 350,205 280,180" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 3" />
    </g>

    <!-- Legend -->
    <g transform="translate(35, 290)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 3" />
      <text x="45" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">Mountain Folds (Crest)</text>
      <line x1="200" y1="0" x2="235" y2="0" stroke="#2563eb" stroke-width="3" stroke-dasharray="5 3" />
      <text x="245" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">Valley Folds (Trough)</text>
    </g>

    <text x="25" y="335" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Parallelogram facets remain 100% rigid during movement.</text>
    <text x="25" y="355" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Only the crease hinges bend, minimizing mechanical wear.</text>
    <text x="25" y="375" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#166534">• Folds and unfolds seamlessly with just ONE motion (1 Degree of Freedom).</text>
  </g>

  <!-- Right: Auxetic Mechanics & Space Deployment -->
  <g transform="translate(510, 95)">
    <rect width="450" height="390" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#mShadow)" />
    <rect width="450" height="38" rx="12" fill="#f0f9ff" />
    <text x="18" y="25" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0369a1">Auxetic Behavior &amp; Space Deployment</text>

    <!-- Visual of Stowed vs Deployed -->
    <g transform="translate(30, 60)">
      <!-- Rocket fairing stowed state -->
      <rect x="0" y="0" width="80" height="180" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
      <text x="40" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#64748b">STOWED</text>
      <text x="40" y="50" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#94a3b8">Compact in</text>
      <text x="40" y="65" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#94a3b8">Rocket Fairing</text>
      <!-- Tight pleat lines -->
      <line x1="10" y1="90" x2="70" y2="90" stroke="#0284c7" stroke-width="2" />
      <line x1="10" y1="105" x2="70" y2="105" stroke="#0284c7" stroke-width="2" />
      <line x1="10" y1="120" x2="70" y2="120" stroke="#0284c7" stroke-width="2" />
      <line x1="10" y1="135" x2="70" y2="135" stroke="#0284c7" stroke-width="2" />

      <!-- Deployment Arrow -->
      <path d="M 95 90 L 145 90" fill="none" stroke="#0284c7" stroke-width="3" />
      <polygon points="145,85 155,90 145,95" fill="#0284c7" />
      <text x="125" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#0284c7">Single Pull</text>

      <!-- Deployed Solar Array -->
      <rect x="170" y="0" width="220" height="180" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <text x="280" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#0369a1">DEPLOYED SOLAR ARRAY</text>
      <!-- Photovoltaic grid -->
      <g stroke="#0284c7" stroke-width="1" opacity="0.6">
        <line x1="170" y1="50" x2="390" y2="50" />
        <line x1="170" y1="80" x2="390" y2="80" />
        <line x1="170" y1="110" x2="390" y2="110" />
        <line x1="170" y1="140" x2="390" y2="140" />
        <line x1="225" y1="50" x2="225" y2="170" />
        <line x1="280" y1="50" x2="280" y2="170" />
        <line x1="335" y1="50" x2="335" y2="170" />
      </g>
      <text x="280" y="165" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#0284c7">100× Surface Area Expansion</text>
    </g>

    <!-- Poisson ratio callout -->
    <rect x="20" y="270" width="410" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="32" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Negative Poisson's Ratio (Auxetic Material)</text>
    <text x="32" y="316" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Normal materials shrink sideways when stretched lengthwise.</text>
    <text x="32" y="336" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• The Miura-ori EXPANDS in width when stretched in length!</text>
    <text x="32" y="356" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0284c7">• Tested in orbit on Japan's Space Flyer Unit (SFU) satellite in 1995.</text>
  </g>
</svg>
