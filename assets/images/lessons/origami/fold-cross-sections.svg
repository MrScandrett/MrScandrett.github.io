<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Read the fold from the side</title><desc id="desc">The same crease can become a valley or a mountain. Imagine standing at the edge of the sheet.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f5dfba"/><stop offset="1" stop-color="#ce9f67"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#185780" stroke-width="2"/></marker><filter id="fiber"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="12"/><feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 .12 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="soft-light"/><feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#574029" flood-opacity=".18"/></filter></defs><rect width="1000" height="440" rx="12" fill="#faf7ef"/><g font-family="Arial,sans-serif" fill="#594a39"><text x="32" y="42" font-size="26" font-weight="700">Read the fold from the side</text><text x="32" y="70" font-size="16">The same crease can become a valley or a mountain. Imagine standing at the edge of the sheet.</text><path d="M500 100V367" stroke="#d8cebb"/><g font-size="22" font-weight="700"><text x="75" y="125">Valley: a trough</text><text x="565" y="125">Mountain: a ridge</text></g><g filter="url(#fiber)" stroke="#80634a" stroke-width="1.5" stroke-linejoin="round"><path d="M85 180L250 295L415 180L415 190L250 305L85 190Z" fill="url(#paper)"/><path d="M580 295L745 180L910 295L910 305L745 190L580 305Z" fill="#fff8e8"/></g><g fill="none" stroke="#185780" stroke-width="3" marker-end="url(#arrow)"><path d="M125 255Q115 180 195 185"/><path d="M870 235Q880 310 800 310"/></g><path d="M180 342H320" stroke="#185780" stroke-width="3" stroke-dasharray="10 7"/><path d="M670 342H820" stroke="#9b4c14" stroke-width="3" stroke-dasharray="12 5 2 5 2 5"/><g font-size="16"><text x="140" y="373">Dashed crease symbol</text><text x="640" y="373">Dash-dot-dot crease symbol</text></g><path d="M32 392H968" stroke="#d8cebb"/><text x="32" y="420" font-size="14">ClassroomOS original illustration · Schematic; paper thickness exaggerated where shown.</text></g></svg>