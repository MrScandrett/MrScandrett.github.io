<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 640" width="100%" height="640" aria-labelledby="axioms-title axioms-desc" role="img">
  <title id="axioms-title">The Huzita-Justin-Hatori Axioms of Origami Geometry</title>
  <desc id="axioms-desc">Visual geometric diagram showing the seven formal folding axioms that define origami mathematics, including Axiom 6 which solves cubic equations.</desc>
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1050" height="640" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header -->
  <text x="35" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">The 7 Huzita-Justin-Hatori Axioms</text>
  <text x="35" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">The complete axiomatic basis of origami geometry. Unlike compass and straightedge (degree 2), Axiom 6 solves cubic equations (degree 3)!</text>

  <!-- Axiom 1 -->
  <g transform="translate(35, 90)">
    <rect width="225" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect width="225" height="32" rx="10" fill="#eff6ff" />
    <text x="12" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">Axiom 1 (Line through 2 pts)</text>
    <rect x="22" y="48" width="180" height="130" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <!-- Content: P1, P2 and crease -->
    <circle cx="60" cy="140" r="5" fill="#dc2626" />
    <text x="52" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">P₁</text>
    <circle cx="165" cy="80" r="5" fill="#dc2626" />
    <text x="160" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">P₂</text>
    <line x1="30" y1="157" x2="195" y2="63" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 3" />
    <text x="12" y="200" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Given P₁, P₂:</text>
    <text x="12" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Fold a unique line connecting them.</text>
  </g>

  <!-- Axiom 2 -->
  <g transform="translate(285, 90)">
    <rect width="225" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect width="225" height="32" rx="10" fill="#eff6ff" />
    <text x="12" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">Axiom 2 (Perpendicular Bisector)</text>
    <rect x="22" y="48" width="180" height="130" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <!-- Content: P1 onto P2 -->
    <circle cx="65" cy="113" r="5" fill="#dc2626" />
    <text x="52" y="116" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">P₁</text>
    <circle cx="160" cy="113" r="5" fill="#dc2626" />
    <text x="170" y="116" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">P₂</text>
    <!-- Arrow from P1 to P2 -->
    <path d="M 72 105 Q 112 80 152 105" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)" />
    <line x1="112" y1="52" x2="112" y2="174" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 3" />
    <text x="12" y="200" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Given P₁, P₂:</text>
    <text x="12" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Fold P₁ onto P₂ (midpoint bisector).</text>
  </g>

  <!-- Axiom 3 -->
  <g transform="translate(535, 90)">
    <rect width="225" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect width="225" height="32" rx="10" fill="#eff6ff" />
    <text x="12" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">Axiom 3 (Angle Bisector)</text>
    <rect x="22" y="48" width="180" height="130" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <!-- Content: L1, L2 and bisector crease -->
    <line x1="40" y1="160" x2="180" y2="160" stroke="#0f172a" stroke-width="2" />
    <text x="185" y="164" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">L₁</text>
    <line x1="40" y1="160" x2="160" y2="60" stroke="#0f172a" stroke-width="2" />
    <text x="165" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">L₂</text>
    <line x1="40" y1="160" x2="185" y2="105" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 3" />
    <text x="12" y="200" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Given lines L₁, L₂:</text>
    <text x="12" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Fold L₁ onto L₂ (halves the angle).</text>
  </g>

  <!-- Axiom 4 -->
  <g transform="translate(785, 90)">
    <rect width="225" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect width="225" height="32" rx="10" fill="#eff6ff" />
    <text x="12" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">Axiom 4 (Perpendicular at Point)</text>
    <rect x="22" y="48" width="180" height="130" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <!-- Content: Line L, point P and perpendicular -->
    <line x1="30" y1="140" x2="190" y2="140" stroke="#0f172a" stroke-width="2" />
    <text x="194" y="144" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">L</text>
    <circle cx="120" cy="85" r="5" fill="#dc2626" />
    <text x="130" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">P</text>
    <line x1="120" y1="52" x2="120" y2="174" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 3" />
    <!-- Right angle mark -->
    <path d="M 120 128 L 132 128 L 132 140" fill="none" stroke="#2563eb" stroke-width="1.5" />
    <text x="12" y="200" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Given point P, line L:</text>
    <text x="12" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Fold through P perpendicular to L.</text>
  </g>

  <!-- Axiom 5 -->
  <g transform="translate(35, 360)">
    <rect width="225" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect width="225" height="32" rx="10" fill="#eff6ff" />
    <text x="12" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">Axiom 5 (Point to Line via Pt)</text>
    <rect x="22" y="48" width="180" height="130" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <line x1="30" y1="150" x2="190" y2="150" stroke="#0f172a" stroke-width="2" />
    <text x="194" y="154" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">L</text>
    <circle cx="70" cy="80" r="5" fill="#dc2626" />
    <text x="56" y="78" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">P₁</text>
    <circle cx="150" cy="110" r="5" fill="#dc2626" />
    <text x="160" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">P₂</text>
    <line x1="100" y1="52" x2="175" y2="174" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 3" />
    <text x="12" y="200" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Given P₁, P₂ and L:</text>
    <text x="12" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Fold P₁ onto L passing through P₂.</text>
  </g>

  <!-- Axiom 6 (HIGHLIGHTED - SOLVES CUBICS) -->
  <g transform="translate(285, 360)">
    <rect width="320" height="240" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#cardShadow)" />
    <rect width="320" height="32" rx="10" fill="#fef3c7" />
    <text x="12" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#b45309">★ Axiom 6 (Double Alignment · Solves Cubics!)</text>
    <rect x="20" y="48" width="280" height="130" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1" />
    <!-- 2 lines, 2 points -->
    <line x1="30" y1="70" x2="190" y2="70" stroke="#0f172a" stroke-width="2" />
    <text x="195" y="74" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">L₁</text>
    <line x1="30" y1="160" x2="280" y2="160" stroke="#0f172a" stroke-width="2" />
    <text x="285" y="164" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">L₂</text>
    <circle cx="80" cy="115" r="5" fill="#dc2626" />
    <text x="68" y="115" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">P₁</text>
    <circle cx="210" cy="110" r="5" fill="#dc2626" />
    <text x="220" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">P₂</text>
    <!-- Fold line: simultaneous tangent to 2 parabolas -->
    <line x1="45" y1="170" x2="250" y2="55" stroke="#b45309" stroke-width="3" stroke-dasharray="6 3" />
    <text x="12" y="200" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">Given P₁, P₂ and lines L₁, L₂:</text>
    <text x="12" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">Fold P₁ onto L₁ AND P₂ onto L₂ simultaneously. Trisects angles &amp; doubles cube!</text>
  </g>

  <!-- Axiom 7 -->
  <g transform="translate(630, 360)">
    <rect width="230" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect width="230" height="32" rx="10" fill="#eff6ff" />
    <text x="12" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">Axiom 7 (Point to Line Perp L₂)</text>
    <rect x="22" y="48" width="186" height="130" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
    <line x1="30" y1="150" x2="195" y2="150" stroke="#0f172a" stroke-width="2" />
    <text x="200" y="154" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">L₁</text>
    <line x1="50" y1="55" x2="50" y2="170" stroke="#0f172a" stroke-width="2" />
    <text x="42" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">L₂</text>
    <circle cx="140" cy="90" r="5" fill="#dc2626" />
    <text x="150" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">P</text>
    <line x1="30" y1="120" x2="195" y2="120" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 3" />
    <text x="12" y="200" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Given P and L₁, L₂:</text>
    <text x="12" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Fold P onto L₁ with crease perp to L₂.</text>
  </g>

  <!-- Summary Card on Right -->
  <g transform="translate(885, 360)">
    <rect width="130" height="240" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="12" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af">Summary</text>
    <text x="12" y="54" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Euclid:</text>
    <text x="12" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#3b82f6">• Compass + Ruler</text>
    <text x="12" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#3b82f6">• Quad equations</text>
    <text x="12" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#ef4444">✕ Cannot trisect</text>
    <text x="12" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Origami:</text>
    <text x="12" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#15803d">• 7 Huzita Axioms</text>
    <text x="12" y="162" font-family="system-ui, sans-serif" font-size="11" fill="#15803d">• Cubic equations</text>
    <text x="12" y="178" font-family="system-ui, sans-serif" font-size="11" fill="#16a34a">✓ Trisects 30°, 60°</text>
    <text x="12" y="194" font-family="system-ui, sans-serif" font-size="11" fill="#16a34a">✓ Doubles cube</text>
  </g>
</svg>
