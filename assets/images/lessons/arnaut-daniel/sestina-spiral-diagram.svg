<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="sestina-spiral-title sestina-spiral-desc">
  <title id="sestina-spiral-title">Arnaut Daniel's Sestina Spiral Algorithm (6–1–5–2–4–3)</title>
  <desc id="sestina-spiral-desc">Illuminated manuscript-style diagram tracing the mathematical retrogradatio cruciata permutation of the sestina across six stanzas (order 6-1-5-2-4-3) and into the final three-line tornada.</desc>
  <rect width="860" height="360" rx="16" fill="#fffaf0" stroke="#c6aa77" stroke-width="2.2" />
  <rect x="20" y="16" width="820" height="40" rx="10" fill="#75411f" />
  <text x="38" y="41" font-family="Georgia, serif" font-size="14.5" font-weight="700" fill="#fde68a">RETROGRADATIO CRUCIATA · HOW SIX END WORDS SPIRAL ACROSS SIX STANZAS</text>

  <!-- Left: Fold Rule Diagram (6-1-5-2-4-3) -->
  <rect x="24" y="72" width="290" height="232" rx="12" fill="#fbf1d6" stroke="#b99a5b" stroke-width="1.8" />
  <text x="42" y="96" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#9b2a1c">ONE STEP OF THE SPIRAL RULE</text>
  <text x="42" y="114" font-family="system-ui, sans-serif" font-size="11" fill="#514b42">Take bottom, top, next-bottom, next-top:</text>

  <!-- Stanza 1 Stack -->
  <g font-family="Georgia, serif" font-size="12" font-weight="700" text-anchor="middle">
    <rect x="44" y="130" width="66" height="24" rx="5" fill="#fff" stroke="#b99a5b" /><text x="77" y="147" fill="#1f3f73">1 · intra</text>
    <rect x="44" y="158" width="66" height="24" rx="5" fill="#fff" stroke="#b99a5b" /><text x="77" y="175" fill="#1f3f73">2 · ongla</text>
    <rect x="44" y="186" width="66" height="24" rx="5" fill="#fff" stroke="#b99a5b" /><text x="77" y="203" fill="#1f3f73">3 · arma</text>
    <rect x="44" y="214" width="66" height="24" rx="5" fill="#fff" stroke="#b99a5b" /><text x="77" y="231" fill="#1f3f73">4 · verga</text>
    <rect x="44" y="242" width="66" height="24" rx="5" fill="#fff" stroke="#b99a5b" /><text x="77" y="259" fill="#1f3f73">5 · oncle</text>
    <rect x="44" y="270" width="66" height="24" rx="5" fill="#9b2a1c" /><text x="77" y="287" fill="#fff">6 · cambra</text>
  </g>

  <!-- Fold Crossing Lines -->
  <g fill="none" stroke-width="1.8">
    <path d="M 112 282 C 158 282, 158 142, 206 142" stroke="#9b2a1c" />
    <path d="M 112 142 C 156 142, 156 170, 206 170" stroke="#1f3f73" />
    <path d="M 112 254 C 166 254, 166 198, 206 198" stroke="#b8862b" />
    <path d="M 112 170 C 166 170, 166 226, 206 226" stroke="#234e60" />
    <path d="M 112 226 C 154 226, 154 254, 206 254" stroke="#75411f" />
    <path d="M 112 198 C 154 198, 154 282, 206 282" stroke="#514b42" />
  </g>

  <!-- Stanza 2 Result -->
  <g font-family="Georgia, serif" font-size="12" font-weight="700" text-anchor="middle">
    <rect x="208" y="130" width="84" height="24" rx="5" fill="#9b2a1c" /><text x="250" y="147" fill="#fff">6 · cambra</text>
    <rect x="208" y="158" width="84" height="24" rx="5" fill="#fff" stroke="#1f3f73" /><text x="250" y="175" fill="#1f3f73">1 · intra</text>
    <rect x="208" y="186" width="84" height="24" rx="5" fill="#fff" stroke="#b8862b" /><text x="250" y="203" fill="#75411f">5 · oncle</text>
    <rect x="208" y="214" width="84" height="24" rx="5" fill="#fff" stroke="#234e60" /><text x="250" y="231" fill="#234e60">2 · ongla</text>
    <rect x="208" y="242" width="84" height="24" rx="5" fill="#fff" stroke="#75411f" /><text x="250" y="259" fill="#75411f">4 · verga</text>
    <rect x="208" y="270" width="84" height="24" rx="5" fill="#fff" stroke="#514b42" /><text x="250" y="287" fill="#29251f">3 · arma</text>
  </g>

  <!-- Right: Full 6-Stanza Matrix + Tornada -->
  <rect x="330" y="72" width="506" height="232" rx="12" fill="#ffffff" stroke="#c6aa77" stroke-width="1.8" />
  <text x="348" y="96" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#234e60">FULL 6-STANZA CYCLE (Applying 6–1–5–2–4–3 returns to Stanza 1 after Stanza 6)</text>

  <!-- Headers -->
  <g font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#75411f" text-anchor="middle">
    <text x="368" y="122">Line</text>
    <text x="424" y="122">St. 1</text><text x="482" y="122">St. 2</text>
    <text x="540" y="122">St. 3</text><text x="598" y="122">St. 4</text>
    <text x="656" y="122">St. 5</text><text x="714" y="122">St. 6</text>
    <text x="786" y="122" fill="#9b2a1c">Tornada</text>
  </g>

  <!-- Rows of numbers (tracing word 1 in rubric red, word 6 in lapis blue) -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" text-anchor="middle">
    <text x="368" y="148" fill="#514b42">L1</text>
    <rect x="408" y="133" width="32" height="21" rx="5" fill="#9b2a1c" /><text x="424" y="148" fill="#fff">1</text>
    <rect x="466" y="133" width="32" height="21" rx="5" fill="#1f3f73" /><text x="482" y="148" fill="#fff">6</text>
    <text x="540" y="148" fill="#29251f">3</text><text x="598" y="148" fill="#29251f">5</text>
    <text x="656" y="148" fill="#29251f">4</text><text x="714" y="148" fill="#29251f">2</text>

    <text x="368" y="176" fill="#514b42">L2</text>
    <text x="424" y="176" fill="#29251f">2</text>
    <rect x="466" y="161" width="32" height="21" rx="5" fill="#9b2a1c" /><text x="482" y="176" fill="#fff">1</text>
    <rect x="524" y="161" width="32" height="21" rx="5" fill="#1f3f73" /><text x="540" y="176" fill="#fff">6</text>
    <text x="598" y="176" fill="#29251f">3</text><text x="656" y="176" fill="#29251f">5</text><text x="714" y="176" fill="#29251f">4</text>

    <text x="368" y="204" fill="#514b42">L3</text>
    <text x="424" y="204" fill="#29251f">3</text><text x="482" y="204" fill="#29251f">5</text>
    <text x="540" y="204" fill="#29251f">4</text><text x="598" y="204" fill="#29251f">2</text>
    <rect x="640" y="189" width="32" height="21" rx="5" fill="#9b2a1c" /><text x="656" y="204" fill="#fff">1</text>
    <rect x="698" y="189" width="32" height="21" rx="5" fill="#1f3f73" /><text x="714" y="204" fill="#fff">6</text>

    <text x="368" y="232" fill="#514b42">L4</text>
    <text x="424" y="232" fill="#29251f">4</text><text x="482" y="232" fill="#29251f">2</text>
    <rect x="524" y="217" width="32" height="21" rx="5" fill="#9b2a1c" /><text x="540" y="232" fill="#fff">1</text>
    <rect x="582" y="217" width="32" height="21" rx="5" fill="#1f3f73" /><text x="598" y="232" fill="#fff">6</text>
    <text x="656" y="232" fill="#29251f">3</text><text x="714" y="232" fill="#29251f">5</text>

    <text x="368" y="260" fill="#514b42">L5</text>
    <text x="424" y="260" fill="#29251f">5</text><text x="482" y="260" fill="#29251f">4</text>
    <text x="540" y="260" fill="#29251f">2</text>
    <rect x="582" y="245" width="32" height="21" rx="5" fill="#9b2a1c" /><text x="598" y="260" fill="#fff">1</text>
    <rect x="640" y="245" width="32" height="21" rx="5" fill="#1f3f73" /><text x="656" y="260" fill="#fff">6</text>
    <text x="714" y="260" fill="#29251f">3</text>

    <text x="368" y="288" fill="#514b42">L6</text>
    <rect x="408" y="273" width="32" height="21" rx="5" fill="#1f3f73" /><text x="424" y="288" fill="#fff">6</text>
    <text x="482" y="288" fill="#29251f">3</text><text x="540" y="288" fill="#29251f">5</text>
    <text x="598" y="288" fill="#29251f">4</text><text x="656" y="288" fill="#29251f">2</text>
    <rect x="698" y="273" width="32" height="21" rx="5" fill="#9b2a1c" /><text x="714" y="288" fill="#fff">1</text>

    <!-- Tornada 3 lines -->
    <rect x="746" y="138" width="78" height="44" rx="7" fill="#fbf1d6" stroke="#9b2a1c" />
    <text x="785" y="156" font-size="11" fill="#9b2a1c">T1: 2 · 5</text>
    <text x="785" y="172" font-size="9.5" fill="#514b42">(in + end)</text>

    <rect x="746" y="190" width="78" height="44" rx="7" fill="#fbf1d6" stroke="#9b2a1c" />
    <text x="785" y="208" font-size="11" fill="#9b2a1c">T2: 4 · 3</text>
    <text x="785" y="224" font-size="9.5" fill="#514b42">(in + end)</text>

    <rect x="746" y="242" width="78" height="44" rx="7" fill="#fbf1d6" stroke="#9b2a1c" />
    <text x="785" y="260" font-size="11" fill="#9b2a1c">T3: 6 · 1</text>
    <text x="785" y="276" font-size="9.5" fill="#514b42">(in + end)</text>
  </g>

  <text x="24" y="336" font-family="system-ui, sans-serif" font-size="12" fill="#514b42">Mathematical proof: 6 is not prime, yet the permutation (1→2→4→5→3→6) forms a single 6-cycle—every word visits every line once.</text>
</svg>