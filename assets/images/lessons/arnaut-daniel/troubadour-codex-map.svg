<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="troub-map-title troub-map-desc">
  <title id="troub-map-title">From 12th-Century Occitan Chansonniers to Modern Sestinas</title>
  <desc id="troub-map-desc">Four-stage cultural route showing how Arnaut Daniel's c. 1190 Occitan troubadour invention traveled to Dante in Florence, Petrarch in Renaissance Italy, Elizabethan England via Philip Sidney, and 20th-century poets like Ezra Pound and Elizabeth Bishop.</desc>
  <defs>
    <marker id="tr-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#75411f" />
    </marker>
  </defs>
  <rect width="860" height="320" rx="16" fill="#fffaf0" stroke="#c6aa77" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#234e60" />
  <text x="38" y="40" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fffaf0">EIGHT CENTURIES OF THE SESTINA · FROM TROUBADOUR SONG TO MODERN VERSE</text>

  <!-- Stage 1 -->
  <rect x="24" y="76" width="184" height="192" rx="12" fill="#fbf1d6" stroke="#9b2a1c" stroke-width="2" />
  <text x="38" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#9b2a1c">c. 1190 · AQUITAINE</text>
  <text x="38" y="122" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#29251f">Arnaut Daniel</text>
  <text x="38" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#514b42">Invents the sestina</text>
  <text x="38" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#514b42">in living Occitan.</text>
  <text x="38" y="184" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#1f3f73">“Lo ferm voler…”</text>
  <text x="38" y="210" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">Preserved in illuminated</text>
  <text x="38" y="225" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">songbooks (chansonniers)</text>
  <text x="38" y="240" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">across Europe.</text>

  <line x1="210" y1="172" x2="232" y2="172" stroke="#75411f" stroke-width="2.2" marker-end="url(#tr-arrow)" />

  <!-- Stage 2 -->
  <rect x="238" y="76" width="184" height="192" rx="12" fill="#ffffff" stroke="#b99a5b" stroke-width="1.8" />
  <text x="252" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#234e60">c. 1314 · ITALY</text>
  <text x="252" y="122" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#29251f">Dante &amp; Petrarch</text>
  <text x="252" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#514b42">Dante calls Arnaut “the</text>
  <text x="252" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#514b42">best smith of the mother</text>
  <text x="252" y="176" font-family="system-ui, sans-serif" font-size="11" fill="#514b42">tongue” in Purgatorio 26.</text>
  <text x="252" y="204" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">Petrarch writes nine</text>
  <text x="252" y="220" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">Italian sestinas, spreading</text>
  <text x="252" y="236" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">the form continent-wide.</text>

  <line x1="424" y1="172" x2="446" y2="172" stroke="#75411f" stroke-width="2.2" marker-end="url(#tr-arrow)" />

  <!-- Stage 3 -->
  <rect x="452" y="76" width="184" height="192" rx="12" fill="#ffffff" stroke="#b99a5b" stroke-width="1.8" />
  <text x="466" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#75411f">1580s · ENGLAND</text>
  <text x="466" y="122" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#29251f">Sir Philip Sidney</text>
  <text x="466" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#514b42">Brings the sestina into</text>
  <text x="466" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#514b42">English in his pastoral</text>
  <text x="466" y="176" font-family="system-ui, sans-serif" font-size="11" fill="#514b42">romance <em>Arcadia</em>.</text>
  <text x="466" y="204" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">Even adds a double</text>
  <text x="466" y="220" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">sestina (“Ye goat-herd</text>
  <text x="466" y="236" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">gods”) of 75 lines.</text>

  <line x1="638" y1="172" x2="660" y2="172" stroke="#75411f" stroke-width="2.2" marker-end="url(#tr-arrow)" />

  <!-- Stage 4 -->
  <rect x="666" y="76" width="170" height="192" rx="12" fill="#e7f0ef" stroke="#234e60" stroke-width="2" />
  <text x="680" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#234e60">1900s–TODAY</text>
  <text x="680" y="122" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#29251f">Modern Makers</text>
  <text x="680" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#29251f">Elizabeth Bishop, W. H.</text>
  <text x="680" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#29251f">Auden, and John Ashbery</text>
  <text x="680" y="176" font-family="system-ui, sans-serif" font-size="11" fill="#29251f">turn obsessive repetition</text>
  <text x="680" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#29251f">into memory &amp; storytelling.</text>
  <text x="680" y="222" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#234e60">Your turn in the workshop</text>
  <text x="680" y="238" font-family="system-ui, sans-serif" font-size="10.5" fill="#234e60">below!</text>

  <text x="24" y="298" font-family="system-ui, sans-serif" font-size="12" fill="#514b42">Because the sestina relies on word order rather than rhyme sounds, the exact algorithm survives translation across languages.</text>
</svg>