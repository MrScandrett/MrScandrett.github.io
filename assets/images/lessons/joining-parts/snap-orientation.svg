<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Print orientation for a snap-fit arm</title>
  <desc>Two ways to print the same snap-fit arm. Left: printed lying down, the layer lines run along the arm, so bending stretches each printed strand along its length, which is strong. Right: printed standing up, the layer lines cross the arm, so bending pulls the layers apart at the root and the arm cracks along a layer line.</desc>
  <defs>
    <pattern id="layersH" width="12" height="8" patternUnits="userSpaceOnUse">
      <rect width="12" height="8" fill="#ccfbf1"/>
      <line x1="0" y1="7.5" x2="12" y2="7.5" stroke="#0f766e" stroke-width="1.4"/>
    </pattern>
    <pattern id="layersH2" width="12" height="8" patternUnits="userSpaceOnUse">
      <rect width="12" height="8" fill="#fee2e2"/>
      <line x1="0" y1="7.5" x2="12" y2="7.5" stroke="#b91c1c" stroke-width="1.4"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#fbfaf6"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#1f2937">Which way do the layers run?</text>
  <text x="40" y="80" font-size="17" fill="#4b5563">Same arm, two print orientations. Thin lines are the printed layers.</text>
  <line x1="500" y1="105" x2="500" y2="530" stroke="#d1d5db" stroke-width="2"/>

  <!-- LEFT: flat -->
  <text x="40" y="128" font-size="21" font-weight="700" fill="#0f766e">✓ Printed lying down</text>
  <text x="40" y="152" font-size="16" fill="#1f2937">Layers run along the arm.</text>
  <!-- part: base block and arm lying on plate -->
  <path d="M70 380 L70 300 L130 300 L130 340 L400 340 L428 364 L400 364 L400 380 Z" fill="url(#layersH)" stroke="#0f766e" stroke-width="3" stroke-linejoin="round"/>
  <rect x="40" y="380" width="430" height="14" fill="#9ca3af"/>
  <text x="255" y="414" font-size="14" text-anchor="middle" fill="#4b5563">build plate</text>
  <!-- tension arrows along strands -->
  <line x1="160" y1="322" x2="360" y2="322" stroke="#1f2937" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="260" y="314" font-size="15" text-anchor="middle" fill="#1f2937">bending stretches the strands</text>
  <text x="40" y="452" font-size="16" fill="#1f2937">Each printed strand is pulled along its length,</text>
  <text x="40" y="474" font-size="16" fill="#1f2937">the strongest direction of a print. Whether the</text>
  <text x="40" y="496" font-size="16" fill="#1f2937">hook bends up off the plate or sideways along it,</text>
  <text x="40" y="518" font-size="16" fill="#1f2937">the stretch runs along the strands.</text>

  <!-- RIGHT: upright -->
  <text x="530" y="128" font-size="21" font-weight="700" fill="#b91c1c">✗ Printed standing up</text>
  <text x="530" y="152" font-size="16" fill="#1f2937">Layers stack across the arm.</text>
  <path d="M600 380 L600 330 L700 330 L700 380 Z" fill="url(#layersH2)" stroke="#b91c1c" stroke-width="3"/>
  <path d="M640 330 L640 176 L672 176 L672 330 Z" fill="url(#layersH2)" stroke="#b91c1c" stroke-width="3"/>
  <path d="M672 176 L700 192 L700 210 L672 222 Z" fill="url(#layersH2)" stroke="#b91c1c" stroke-width="3"/>
  <rect x="560" y="380" width="400" height="14" fill="#9ca3af"/>
  <text x="760" y="414" font-size="14" text-anchor="middle" fill="#4b5563">build plate</text>
  <!-- crack at root -->
  <path d="M640 322 L652 324 L646 326 L660 327" fill="none" stroke="#111827" stroke-width="3"/>
  <line x1="624" y1="300" x2="624" y2="270" stroke="#b91c1c" stroke-width="3" marker-end="url(#arR)"/>
  <line x1="624" y1="352" x2="624" y2="372" stroke="#b91c1c" stroke-width="3" marker-end="url(#arR)" opacity="0"/>
  <path d="M700 196 Q760 200 760 240" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="768" y="232" font-size="15" fill="#1f2937">push the hook</text>
  <line x1="668" y1="325" x2="740" y2="300" stroke="#1f2937" stroke-width="1.5"/>
  <text x="744" y="296" font-size="15" font-weight="700" fill="#b91c1c">crack along a layer line</text>
  <text x="744" y="316" font-size="15" fill="#1f2937">at the root (highest strain)</text>
  <text x="530" y="452" font-size="16" fill="#1f2937">Bending now pulls one layer away from the next.</text>
  <text x="530" y="474" font-size="16" fill="#1f2937">Layer-to-layer bonds are the weak direction: Prusa</text>
  <text x="530" y="496" font-size="16" fill="#1f2937">measured printed PLA at about one-third of its</text>
  <text x="530" y="518" font-size="16" fill="#1f2937">along-the-layer tensile strength.</text>
  <text x="960" y="548" font-size="13" text-anchor="end" fill="#6b7280">Original ClassroomOS teaching diagram</text>
</svg>
