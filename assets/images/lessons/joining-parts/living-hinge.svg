<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Living hinge: geometry and why the material matters</title>
  <desc>Left: a box and its lid joined by one thin strip of plastic, the living hinge. The strip is about 0.4 to 0.6 millimetres thick, at least two layers, and the printed strands should run across the fold from the box into the lid. Right: a temperature scale with room temperature marked at 20 degrees Celsius. Polypropylene's glass transition is below room temperature, near minus 10 degrees, while PLA's is near 60 and PETG's near 80, so PLA and PETG are glassy at room temperature and polypropylene is not.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#fbfaf6"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#1f2937">Living hinge: one thin strip that folds</text>
  <text x="40" y="80" font-size="17" fill="#4b5563">The same plastic is the box, the hinge and the lid. No pin, no assembly.</text>

  <!-- box and lid, side view, lid half open -->
  <path d="M60 420 L60 300 L280 300 L280 420 Z" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text x="170" y="370" font-size="18" text-anchor="middle" fill="#0369a1">box</text>
  <!-- hinge web at top right corner -->
  <path d="M280 300 Q300 300 304 284" fill="none" stroke="#c2410c" stroke-width="5"/>
  <!-- lid rotated about 60 degrees -->
  <g transform="translate(304 284) rotate(-62)">
    <rect x="0" y="-24" width="165" height="24" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <text x="82" y="-6" font-size="16" text-anchor="middle" fill="#0369a1">lid</text>
  </g>
  <!-- zoom of hinge -->
  <circle cx="292" cy="296" r="22" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="312" y1="308" x2="352" y2="352" stroke="#c2410c" stroke-width="2"/>
  <rect x="352" y="330" width="250" height="150" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="364" y="354" font-size="15" font-weight="700" fill="#c2410c">Zoom: the hinge, laid flat</text>
  <rect x="368" y="384" width="80" height="40" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <rect x="512" y="384" width="80" height="40" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <rect x="448" y="414" width="64" height="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <line x1="380" y1="419" x2="580" y2="419" stroke="#c2410c" stroke-width="1.5"/>
  <line x1="460" y1="402" x2="500" y2="402" stroke="#1f2937" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="480" y="396" font-size="13" text-anchor="middle" fill="#1f2937">length</text>
  <text x="372" y="446" font-size="13" fill="#1f2937">thickness 0.4–0.6 mm (2+ layers)</text>
  <text x="372" y="466" font-size="13" fill="#1f2937">strands run across the fold →</text>

  <text x="40" y="462" font-size="16" fill="#1f2937">All the bending happens in the strip,</text>
  <text x="40" y="482" font-size="16" fill="#1f2937">so all the strain lives there. Thinner</text>
  <text x="40" y="502" font-size="16" fill="#1f2937">means less strain per fold, but too</text>
  <text x="40" y="522" font-size="16" fill="#1f2937">thin tears. Round the ends of the strip</text>
  <text x="40" y="542" font-size="16" fill="#1f2937">so cracks can't start at a corner.</text>

  <!-- temperature scale -->
  <text x="640" y="128" font-size="19" font-weight="700" fill="#1f2937">Glass transition (Tg)</text>
  <text x="640" y="150" font-size="14" fill="#4b5563">Below Tg the non-crystal part of a plastic is glassy.</text>
  <line x1="700" y1="180" x2="700" y2="500" stroke="#1f2937" stroke-width="3"/>
  <!-- scale: y = 440 - (T)*3 ; T from -20 to 90 -->
  <g font-size="13" fill="#4b5563" text-anchor="end">
    <text x="690" y="504">−20 °C</text>
    <line x1="694" y1="500" x2="706" y2="500" stroke="#1f2937"/>
    <text x="690" y="444">0 °C</text>
    <line x1="694" y1="440" x2="706" y2="440" stroke="#1f2937"/>
    <text x="690" y="324">40 °C</text>
    <line x1="694" y1="320" x2="706" y2="320" stroke="#1f2937"/>
    <text x="690" y="204">80 °C</text>
    <line x1="694" y1="200" x2="706" y2="200" stroke="#1f2937"/>
  </g>
  <!-- room temperature band -->
  <line x1="700" y1="380" x2="980" y2="380" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="975" y="372" font-size="14" font-weight="700" text-anchor="end" fill="#15803d">room temperature ≈ 20 °C</text>
  <!-- PETG ~80 -->
  <circle cx="700" cy="200" r="8" fill="#7c3aed"/>
  <text x="716" y="196" font-size="16" font-weight="700" fill="#7c3aed">PETG ≈ 80 °C</text>
  <text x="716" y="216" font-size="13" fill="#1f2937">glassy at room temp, but tough</text>
  <!-- PLA ~60 -->
  <circle cx="700" cy="260" r="8" fill="#b91c1c"/>
  <text x="716" y="256" font-size="16" font-weight="700" fill="#b91c1c">PLA ≈ 55–60 °C</text>
  <text x="716" y="276" font-size="13" fill="#1f2937">glassy and stiff: each deep fold</text>
  <text x="716" y="292" font-size="13" fill="#1f2937">leaves damage, then a crack</text>
  <!-- PP ~ -10 -->
  <circle cx="700" cy="470" r="8" fill="#0369a1"/>
  <text x="716" y="466" font-size="16" font-weight="700" fill="#0369a1">PP ≈ −10 °C</text>
  <text x="716" y="486" font-size="13" fill="#1f2937">rubbery between its crystals at</text>
  <text x="716" y="502" font-size="13" fill="#1f2937">room temp: folds again and again</text>
  <text x="960" y="548" font-size="13" text-anchor="end" fill="#6b7280">Approximate values. Original ClassroomOS teaching diagram</text>
</svg>
