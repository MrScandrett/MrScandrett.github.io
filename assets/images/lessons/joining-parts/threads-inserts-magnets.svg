<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Printed threads, heat-set inserts, nut traps and magnet pockets</title>
  <desc>Four cross-sections. A printed thread is large and coarse with a chamfer before the first turn. A heat-set brass insert is pressed into a slightly smaller hole with a hot iron, and melted plastic flows into its knurls. A nut trap is a hexagon pocket that stops a metal nut from turning so a bolt can be tightened. A magnet pocket is either a press-fit hole or a sealed pocket: the print pauses, the magnet goes in, and the next layers cover it.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker>
    <pattern id="lay" width="10" height="8" patternUnits="userSpaceOnUse"><rect width="10" height="8" fill="#fed7aa"/><line x1="0" y1="7.5" x2="10" y2="7.5" stroke="#ea580c" stroke-width="1"/></pattern>
  </defs>
  <rect width="1000" height="560" fill="#fbfaf6"/>
  <text x="30" y="46" font-size="27" font-weight="700" fill="#1f2937">Screws, threads and magnets</text>
  <text x="30" y="74" font-size="16" fill="#4b5563">Cross-sections. Orange = printed plastic; grey = metal.</text>
  <g stroke="#e5e7eb" stroke-width="2"><line x1="250" y1="96" x2="250" y2="540"/><line x1="500" y1="96" x2="500" y2="540"/><line x1="750" y1="96" x2="750" y2="540"/></g>

  <!-- 1 printed thread -->
  <text x="30" y="120" font-size="18" font-weight="700" fill="#1f2937">Printed thread</text>
  <path d="M95 160 L155 160 L155 170 L170 182 L155 194 L170 206 L155 218 L170 230 L155 242 L170 254 L155 266 L170 278 L155 290 L162 300 L155 306 L145 316 L105 316 L95 306 L88 300 L80 290 L95 278 L80 266 L95 254 L80 242 L95 230 L80 218 L95 206 L80 194 L95 182 L80 170 L95 160 Z" fill="url(#lay)" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="150" cy="312" r="14" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="190" y1="182" x2="190" y2="206" stroke="#1f2937" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="198" y="198" font-size="13" fill="#1f2937">pitch</text>
  <text x="30" y="350" font-size="14" font-weight="700" fill="#1f2937">Big and coarse:</text>
  <text x="30" y="370" font-size="14" fill="#1f2937">think jar lid, not tiny screw.</text>
  <text x="30" y="392" font-size="14" fill="#1f2937">Print the axis upright so</text>
  <text x="30" y="410" font-size="14" fill="#1f2937">each turn is drawn in layers.</text>
  <text x="30" y="432" font-size="14" fill="#b91c1c">Chamfer the start so the</text>
  <text x="30" y="450" font-size="14" fill="#b91c1c">first turn finds its groove</text>
  <text x="30" y="468" font-size="14" fill="#b91c1c">and the squashed first layer</text>
  <text x="30" y="486" font-size="14" fill="#b91c1c">doesn't jam it.</text>
  <text x="30" y="512" font-size="13" fill="#4b5563">Leave a gap between the male</text>
  <text x="30" y="530" font-size="13" fill="#4b5563">and female threads.</text>

  <!-- 2 heat-set insert -->
  <text x="270" y="120" font-size="18" font-weight="700" fill="#1f2937">Heat-set insert</text>
  <rect x="290" y="210" width="170" height="120" fill="url(#lay)" stroke="#c2410c" stroke-width="2.5"/>
  <rect x="352" y="222" width="46" height="108" fill="#fbfaf6" stroke="#c2410c" stroke-width="2"/>
  <!-- insert -->
  <path d="M347 196 L403 196 L403 250 L347 250 Z" fill="#d1d5db" stroke="#4b5563" stroke-width="2.5"/>
  <g stroke="#4b5563" stroke-width="2"><line x1="347" y1="208" x2="403" y2="214"/><line x1="347" y1="220" x2="403" y2="226"/><line x1="347" y1="232" x2="403" y2="238"/><line x1="347" y1="244" x2="403" y2="250"/></g>
  <rect x="364" y="196" width="22" height="54" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <!-- iron tip -->
  <path d="M362 140 L388 140 L384 186 L366 186 Z" fill="#6b7280" stroke="#1f2937" stroke-width="2"/>
  <line x1="375" y1="186" x2="375" y2="196" stroke="#1f2937" stroke-width="3"/>
  <line x1="420" y1="140" x2="420" y2="190" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
  <text x="428" y="160" font-size="13" fill="#1f2937">hot iron</text>
  <text x="428" y="176" font-size="13" fill="#1f2937">presses</text>
  <text x="270" y="356" font-size="14" fill="#1f2937">A brass sleeve with knurls.</text>
  <text x="270" y="376" font-size="14" fill="#1f2937">The hole is slightly smaller</text>
  <text x="270" y="396" font-size="14" fill="#1f2937">than the insert; heat melts</text>
  <text x="270" y="416" font-size="14" fill="#1f2937">the plastic into the knurls.</text>
  <text x="270" y="442" font-size="14" font-weight="700" fill="#1f2937">Metal threads that take</text>
  <text x="270" y="460" font-size="14" font-weight="700" fill="#1f2937">screwing in and out many</text>
  <text x="270" y="478" font-size="14" font-weight="700" fill="#1f2937">times.</text>
  <text x="270" y="504" font-size="13" fill="#b91c1c">Hot tool: adult or supervised</text>
  <text x="270" y="522" font-size="13" fill="#b91c1c">use only.</text>

  <!-- 3 nut trap -->
  <text x="520" y="120" font-size="18" font-weight="700" fill="#1f2937">Nut trap</text>
  <rect x="540" y="150" width="180" height="180" rx="6" fill="url(#lay)" stroke="#c2410c" stroke-width="2.5"/>
  <polygon points="630,186 682,216 682,276 630,306 578,276 578,216" fill="#fbfaf6" stroke="#c2410c" stroke-width="2.5"/>
  <polygon points="630,194 675,220 675,272 630,298 585,272 585,220" fill="#d1d5db" stroke="#4b5563" stroke-width="2.5"/>
  <circle cx="630" cy="246" r="22" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
  <line x1="585" y1="320" x2="675" y2="320" stroke="#1f2937" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="630" y="314" font-size="12" text-anchor="middle" fill="#1f2937">across flats</text>
  <text x="520" y="356" font-size="14" fill="#1f2937">A hexagon pocket holds a</text>
  <text x="520" y="376" font-size="14" fill="#1f2937">metal nut so it can't turn.</text>
  <text x="520" y="396" font-size="14" fill="#1f2937">An M3 nut is 5.5 mm across</text>
  <text x="520" y="416" font-size="14" fill="#1f2937">flats: try a 5.7–5.8 mm</text>
  <text x="520" y="436" font-size="14" fill="#1f2937">pocket.</text>
  <text x="520" y="462" font-size="14" font-weight="700" fill="#1f2937">Strong, reversible, cheap.</text>
  <text x="520" y="486" font-size="13" fill="#4b5563">Top view shown. Print the</text>
  <text x="520" y="504" font-size="13" fill="#4b5563">pocket opening upward, or</text>
  <text x="520" y="522" font-size="13" fill="#4b5563">as a side slot.</text>

  <!-- 4 magnet pocket -->
  <text x="770" y="120" font-size="18" font-weight="700" fill="#1f2937">Magnet pocket</text>
  <text x="770" y="146" font-size="13" fill="#4b5563">press-fit (open)</text>
  <rect x="780" y="156" width="80" height="70" fill="url(#lay)" stroke="#c2410c" stroke-width="2.5"/>
  <rect x="800" y="156" width="40" height="22" fill="#fbfaf6" stroke="#c2410c" stroke-width="2"/>
  <rect x="802" y="158" width="36" height="18" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
  <text x="880" y="146" font-size="13" fill="#4b5563">sealed (pause)</text>
  <rect x="880" y="156" width="80" height="70" fill="url(#lay)" stroke="#c2410c" stroke-width="2.5"/>
  <rect x="902" y="176" width="36" height="18" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
  <line x1="874" y1="174" x2="966" y2="174" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="770" y="256" font-size="14" fill="#1f2937">Press-fit: pocket ≈ 0.1–0.2 mm</text>
  <text x="770" y="274" font-size="14" fill="#1f2937">wider than the magnet.</text>
  <text x="770" y="300" font-size="14" fill="#1f2937">Sealed: the slicer pauses at</text>
  <text x="770" y="318" font-size="14" fill="#1f2937">the dashed layer, you drop the</text>
  <text x="770" y="336" font-size="14" fill="#1f2937">magnet in, and printing covers</text>
  <text x="770" y="354" font-size="14" fill="#1f2937">it. The pocket must be at least</text>
  <text x="770" y="372" font-size="14" fill="#1f2937">as deep as the magnet is tall,</text>
  <text x="770" y="390" font-size="14" fill="#1f2937">or the nozzle hits it.</text>
  <text x="770" y="416" font-size="14" font-weight="700" fill="#1f2937">Check polarity before you</text>
  <text x="770" y="434" font-size="14" font-weight="700" fill="#1f2937">press or seal: mark the face</text>
  <text x="770" y="452" font-size="14" font-weight="700" fill="#1f2937">that attracts its partner.</text>
  <text x="770" y="478" font-size="13" fill="#b91c1c">Small strong magnets are a</text>
  <text x="770" y="496" font-size="13" fill="#b91c1c">serious swallowing hazard.</text>
  <text x="970" y="548" font-size="12" text-anchor="end" fill="#6b7280">Original ClassroomOS teaching diagram</text>
</svg>
