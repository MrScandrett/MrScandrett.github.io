<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Anatomy of a cantilever snap-fit</title>
  <desc>Side view of a cantilever snap-fit arm. A base on the left holds a flexible arm of length L and thickness t. At the tip a hook sticks down by the undercut y, with a sloped lead-in face and a steeper return face. A mating part with a ledge sits below. The strain is greatest at the root, where the arm meets the base, so the root gets a rounded fillet.</desc>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9aa3ad" stroke-width="2"/>
    </pattern>
    <linearGradient id="strain" x1="0" x2="1">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.45" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#fbfaf6"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1f2937">Anatomy of a cantilever snap-fit</text>
  <text x="40" y="82" font-size="17" fill="#4b5563">Side view. The arm bends up while the hook rides over the ledge, then springs back and catches.</text>

  <!-- base -->
  <rect x="70" y="150" width="150" height="250" fill="url(#hatch)" stroke="#1f2937" stroke-width="3"/>
  <text x="145" y="430" font-size="17" text-anchor="middle" fill="#1f2937">base (rigid part)</text>

  <!-- arm with strain colouring -->
  <path d="M220 200 L730 200 L730 236 L236 236 Q220 236 220 252 Z" fill="url(#strain)" stroke="#1f2937" stroke-width="3"/>
  <!-- hook: steep return face on the left, sloped lead-in face on the right -->
  <path d="M630 236 L642 296 L682 296 L730 236 Z" fill="#16a34a" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>

  <!-- root fillet callout -->
  <circle cx="226" cy="243" r="18" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="5 4"/>
  <line x1="214" y1="262" x2="190" y2="470" stroke="#b91c1c" stroke-width="2"/>
  <text x="60" y="492" font-size="17" font-weight="700" fill="#b91c1c">Root: highest strain.</text>
  <text x="60" y="514" font-size="16" fill="#1f2937">Round it with a fillet so the</text>
  <text x="60" y="534" font-size="16" fill="#1f2937">stress is not focused in a corner.</text>

  <!-- L dimension -->
  <line x1="220" y1="160" x2="220" y2="196" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="636" y1="160" x2="636" y2="196" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="224" y1="172" x2="632" y2="172" stroke="#1f2937" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <rect x="404" y="158" width="48" height="28" fill="#fbfaf6"/>
  <text x="428" y="180" font-size="22" font-weight="700" font-style="italic" text-anchor="middle" fill="#1f2937">L</text>
  <text x="428" y="136" font-size="16" text-anchor="middle" fill="#4b5563">arm length (root to hook)</text>

  <!-- t dimension -->
  <line x1="540" y1="204" x2="540" y2="232" stroke="#fff" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="552" y="225" font-size="21" font-weight="700" font-style="italic" fill="#fff">t</text>
  <text x="240" y="225" font-size="14" font-weight="700" fill="#fff">high strain</text>
  <text x="440" y="225" font-size="14" font-weight="700" fill="#1f2937">lower</text>

  <!-- mating part: a plate with a window the hook drops into -->
  <path d="M440 252 L452 240 L622 240 L622 320 L800 320 L800 240 L950 240 L950 380 L440 380 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/>
  <text x="700" y="352" font-size="17" text-anchor="middle" fill="#1d4ed8">mating part, slid in from the right</text>
  <line x1="930" y1="404" x2="840" y2="404" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ar)"/>
  <text x="935" y="409" font-size="15" fill="#1d4ed8">in</text>

  <!-- y dimension (undercut) -->
  <line x1="688" y1="296" x2="790" y2="296" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="732" y1="240" x2="790" y2="240" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="770" y1="243" x2="770" y2="293" stroke="#1f2937" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="778" y="276" font-size="22" font-weight="700" font-style="italic" fill="#1f2937">y</text>
  <rect x="808" y="262" width="136" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="816" y="283" font-size="15" fill="#1f2937">undercut: how far</text>
  <text x="816" y="302" font-size="15" fill="#1f2937">the hook must lift</text>

  <!-- face labels -->
  <line x1="712" y1="262" x2="790" y2="196" stroke="#1f2937" stroke-width="1.5"/>
  <text x="792" y="168" font-size="16" font-weight="700" fill="#1f2937">lead-in face</text>
  <text x="792" y="188" font-size="15" fill="#4b5563">gentle slope = easy push</text>
  <line x1="636" y1="270" x2="600" y2="300" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="452" y="286" width="150" height="26" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="462" y="305" font-size="16" font-weight="700" fill="#1f2937">return face</text>
  <text x="250" y="408" font-size="15" fill="#1f2937">Return face steep (near 90°) = locked;</text>
  <text x="250" y="428" font-size="15" fill="#1f2937">sloped (about 45°) = pulls apart.</text>

  <!-- formula -->
  <rect x="370" y="440" width="590" height="100" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="665" y="476" font-size="22" font-weight="700" text-anchor="middle" fill="#0f766e">strain at the root  ε = 1.5 · t · y / L²</text>
  <text x="665" y="504" font-size="16" text-anchor="middle" fill="#1f2937">Thicker arm or bigger undercut → more strain. Longer arm → far less.</text>
  <text x="665" y="526" font-size="14" text-anchor="middle" fill="#4b5563">Rectangular arm of constant thickness. Original ClassroomOS teaching diagram.</text>

</svg>
