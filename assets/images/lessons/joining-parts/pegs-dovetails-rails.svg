<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Pegs, holes, dovetails and slide-in rails</title>
  <desc>Four cross-sections. One: a peg inside a hole with a ring of clearance; press fit, slip fit and loose fit need different gaps per side. Two: a hole printed on its side sags at the top, so it is drawn as a teardrop with a 45 degree roof. Three: a dovetail tail inside its socket with an even gap on each slanted face and a small chamfer at the bottom edge to clear the squashed first layer. Four: a T-shaped rail sliding in a slot with a small bump that clicks into a dimple to hold it in place.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#fbfaf6"/>
  <text x="40" y="46" font-size="27" font-weight="700" fill="#1f2937">Shapes that hold by fitting</text>
  <text x="40" y="74" font-size="16" fill="#4b5563">Cross-sections. Blue = one part, orange = the part it fits into. Gaps are drawn larger than real.</text>
  <line x1="500" y1="94" x2="500" y2="580" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="30" y1="336" x2="970" y2="336" stroke="#e5e7eb" stroke-width="2"/>

  <!-- 1 peg & hole -->
  <text x="40" y="118" font-size="19" font-weight="700" fill="#1f2937">1 · Peg and hole</text>
  <rect x="60" y="140" width="170" height="170" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
  <circle cx="145" cy="225" r="58" fill="#fbfaf6" stroke="#c2410c" stroke-width="3"/>
  <circle cx="145" cy="225" r="48" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="145" cy="225" r="38" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="193" y1="225" x2="203" y2="225" stroke="#1f2937" stroke-width="2"/>
  <text x="250" y="160" font-size="15" font-weight="700" fill="#1f2937">Gap per side = (hole − peg) ÷ 2</text>
  <text x="250" y="182" font-size="14" fill="#1f2937">(starting points from Measure and Fit;</text>
  <text x="250" y="200" font-size="14" fill="#1f2937">print a test for your printer)</text>
  <text x="250" y="228" font-size="14" fill="#1f2937"><tspan font-weight="700">press</tspan> ≈ 0.05–0.15 mm: stays put</text>
  <text x="250" y="250" font-size="14" fill="#1f2937"><tspan font-weight="700">slip</tspan> ≈ 0.2–0.3 mm: slides, no wobble</text>
  <text x="250" y="272" font-size="14" fill="#1f2937"><tspan font-weight="700">loose</tspan> ≈ 0.35–0.5 mm: turns freely</text>
  <text x="250" y="300" font-size="13" fill="#4b5563">dashed ring = chamfered peg tip</text>

  <!-- 2 teardrop -->
  <text x="530" y="118" font-size="19" font-weight="700" fill="#1f2937">2 · A hole printed on its side</text>
  <rect x="550" y="150" width="130" height="150" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
  <path d="M590 235 A25 25 0 0 0 640 235 Q640 205 615 205 Q592 210 590 235 Z" fill="#fbfaf6" stroke="#c2410c" stroke-width="3"/>
  <path d="M600 214 Q607 222 615 224 Q623 222 630 214" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="615" y="320" font-size="13" text-anchor="middle" fill="#b91c1c">round: roof sags</text>
  <rect x="740" y="150" width="130" height="150" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
  <path d="M780 240 A25 25 0 1 0 830 240 L805 205 Z" fill="#fbfaf6" stroke="#c2410c" stroke-width="3"/>
  <text x="805" y="320" font-size="13" text-anchor="middle" fill="#15803d">teardrop: 45° roof prints</text>
  <text x="885" y="200" font-size="14" fill="#1f2937">Each new</text>
  <text x="885" y="218" font-size="14" fill="#1f2937">layer must</text>
  <text x="885" y="236" font-size="14" fill="#1f2937">rest on the</text>
  <text x="885" y="254" font-size="14" fill="#1f2937">one below.</text>
  <line x1="710" y1="130" x2="710" y2="300" stroke="#9ca3af" stroke-width="1"/>
  <text x="720" y="140" font-size="12" fill="#6b7280">↑ print direction</text>

  <!-- 3 dovetail -->
  <text x="40" y="366" font-size="19" font-weight="700" fill="#1f2937">3 · Dovetail (slides in, can't lift out)</text>
  <path d="M60 560 L60 400 L150 400 L130 470 L270 470 L250 400 L340 400 L340 560 Z" fill="#fed7aa" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M110 372 L290 372 L290 396 L245 396 L264 465 L136 465 L155 396 L110 396 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/>
  
  <text x="358" y="420" font-size="14" fill="#1f2937">Even gap on both</text>
  <text x="358" y="438" font-size="14" fill="#1f2937">slanted faces,</text>
  <text x="358" y="456" font-size="14" fill="#1f2937">≈ 0.2–0.3 mm each</text>
  <circle cx="136" cy="466" r="12" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="358" y="494" font-size="14" fill="#b91c1c">Chamfer the bottom</text>
  <text x="358" y="512" font-size="14" fill="#b91c1c">edge: the squashed</text>
  <text x="358" y="530" font-size="14" fill="#b91c1c">first layer (elephant's</text>
  <text x="358" y="548" font-size="14" fill="#b91c1c">foot) jams the slide.</text>
  <line x1="148" y1="472" x2="354" y2="500" stroke="#b91c1c" stroke-width="1.2"/>

  <!-- 4 rail with detent -->
  <text x="530" y="366" font-size="19" font-weight="700" fill="#1f2937">4 · Slide-in rail with a click stop</text>
  <path d="M550 560 L550 400 L640 400 L640 430 L600 430 L600 470 L760 470 L760 430 L720 430 L720 400 L810 400 L810 560 Z" fill="#fed7aa" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M646 384 L714 384 L714 424 L754 424 L754 464 L606 464 L606 424 L646 424 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="680" cy="470" r="6" fill="#1d4ed8"/>
  <text x="826" y="420" font-size="14" fill="#1f2937">T-rail: can't lift</text>
  <text x="826" y="438" font-size="14" fill="#1f2937">out, only slide.</text>
  <text x="826" y="470" font-size="14" fill="#1d4ed8">A small bump</text>
  <text x="826" y="488" font-size="14" fill="#1d4ed8">(≈ 0.3–0.5 mm) clicks</text>
  <text x="826" y="506" font-size="14" fill="#1d4ed8">into a dimple at the</text>
  <text x="826" y="524" font-size="14" fill="#1d4ed8">end: a tiny snap-fit.</text>
  <line x1="688" y1="474" x2="822" y2="480" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="960" y="590" font-size="13" text-anchor="end" fill="#6b7280">Original ClassroomOS teaching diagram</text>
</svg>
