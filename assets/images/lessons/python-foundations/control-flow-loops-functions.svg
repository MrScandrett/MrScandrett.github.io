<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="pf-cf-title pf-cf-desc">
  <title id="pf-cf-title">Python Control Flow: Conditionals, Loops, and Functions</title>
  <desc id="pf-cf-desc">Three-panel diagram illustrating if/elif/else first-match branching, for i in range(4) iteration stopping before 4 alongside while update rules, and function parameters returning a computed output.</desc>
  <defs>
    <marker id="pf-cf-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Control Flow: Decide (if), Repeat (for / while), and Reuse (def)</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Every Python program combines these three shapes to choose paths and avoid repeating code</text>

  <!-- Panel 1: Conditionals -->
  <rect x="28" y="76" width="262" height="278" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="46" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#78350f">1 · First-Match Waterfall</text>
  <text x="46" y="122" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#92400e">score = 72</text>

  <rect x="46" y="136" width="130" height="36" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="111" y="158" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#0f172a">if score &gt;= 90</text>
  <path d="M 176 154 L 204 154" stroke="#475569" stroke-width="1.5" marker-end="url(#pf-cf-arr)"/>
  <text x="242" y="158" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">False → skip A</text>

  <path d="M 111 172 L 111 194" stroke="#475569" stroke-width="1.8" marker-end="url(#pf-cf-arr)"/>

  <rect x="46" y="198" width="130" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="111" y="220" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#14532d">elif score &gt;= 70</text>
  <path d="M 176 216 L 204 216" stroke="#16a34a" stroke-width="2" marker-end="url(#pf-cf-arr)"/>
  <rect x="208" y="198" width="66" height="36" rx="8" fill="#16a34a"/>
  <text x="241" y="220" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#fff">Print B</text>

  <path d="M 111 234 L 111 256" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="46" y="258" width="130" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="111" y="279" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8">else (skipped!)</text>

  <text x="46" y="318" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">Only ONE branch ever runs.</text>
  <text x="46" y="335" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#92400e">First True wins; rest are ignored.</text>

  <!-- Panel 2: Loops -->
  <rect x="309" y="76" width="262" height="278" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="327" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0c4a6e">2 · Zero-Based Loops</text>
  <text x="327" y="124" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0369a1">for i in range(4):</text>

  <g font-family="JetBrains Mono, monospace" font-size="12" font-weight="800">
    <circle cx="352" cy="160" r="18" fill="#0284c7"/><text x="352" y="164" text-anchor="middle" fill="#fff">0</text>
    <path d="M 370 160 L 390 160" stroke="#0284c7" stroke-width="2" marker-end="url(#pf-cf-arr)"/>
    <circle cx="410" cy="160" r="18" fill="#0284c7"/><text x="410" y="164" text-anchor="middle" fill="#fff">1</text>
    <path d="M 428 160 L 448 160" stroke="#0284c7" stroke-width="2" marker-end="url(#pf-cf-arr)"/>
    <circle cx="468" cy="160" r="18" fill="#0284c7"/><text x="468" y="164" text-anchor="middle" fill="#fff">2</text>
    <path d="M 486 160 L 506 160" stroke="#0284c7" stroke-width="2" marker-end="url(#pf-cf-arr)"/>
    <circle cx="526" cy="160" r="18" fill="#0284c7"/><text x="526" y="164" text-anchor="middle" fill="#fff">3</text>
  </g>
  <text x="440" y="196" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369a1">Stops BEFORE 4 (4 iterations)</text>

  <rect x="327" y="216" width="226" height="118" rx="10" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="341" y="238" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0c4a6e">while count &lt; 3:</text>
  <text x="341" y="258" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">1. Test condition (True?)</text>
  <text x="341" y="276" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">2. Run indented body</text>
  <text x="341" y="294" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#dc2626">3. count += 1 (MUST update!)</text>
  <text x="341" y="316" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">No update → infinite loop</text>

  <!-- Panel 3: Functions -->
  <rect x="590" y="76" width="262" height="278" rx="14" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.8"/>
  <text x="608" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#581c87">3 · Reusable Functions</text>
  <rect x="608" y="122" width="226" height="44" rx="9" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="622" y="142" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#7e22ce">Call Input:  square(5)</text>
  <text x="622" y="158" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">5 binds to parameter n</text>

  <path d="M 721 166 L 721 190" stroke="#7e22ce" stroke-width="2" marker-end="url(#pf-cf-arr)"/>

  <rect x="608" y="194" width="226" height="68" rx="10" fill="#7e22ce"/>
  <text x="622" y="218" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#f3e8ff">def square(n):</text>
  <text x="634" y="240" font-family="JetBrains Mono, monospace" font-size="12" fill="#ffffff">return n * n</text>

  <path d="M 721 262 L 721 286" stroke="#7e22ce" stroke-width="2" marker-end="url(#pf-cf-arr)"/>

  <rect x="608" y="290" width="226" height="46" rx="9" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="622" y="311" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" fill="#15803d">Return Value:  25</text>
  <text x="622" y="327" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">return hands value back; print shows text</text>
</svg>
