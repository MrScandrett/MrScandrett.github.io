<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="pf-vt-title pf-vt-desc">
  <title id="pf-vt-title">Python Variables, Data Types, and Operators in Memory</title>
  <desc id="pf-vt-desc">Diagram mapping Python variable labels to typed objects (str, int, float, bool, list) and contrasting string concatenation ("3" + "4" = "34") against integer math and modulo division.</desc>
  <defs>
    <marker id="pf-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Variables Point to Typed Objects (And Quotes Change Everything)</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">In Python, = binds a name label to a value object whose type determines how operators behave</text>

  <!-- Variable bindings -->
  <rect x="28" y="76" width="440" height="278" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Name Labels  →  Typed Values</text>

  <!-- Row 1: str -->
  <rect x="48" y="118" width="128" height="34" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="112" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#065f46">robot_name</text>
  <path d="M 176 135 L 222 135" stroke="#475569" stroke-width="2" marker-end="url(#pf-arr)"/>
  <rect x="228" y="118" width="218" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="242" y="140" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">"Byte"</text>
  <rect x="382" y="124" width="54" height="22" rx="6" fill="#0f766e"/>
  <text x="409" y="139" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#fff">str</text>

  <!-- Row 2: int -->
  <rect x="48" y="162" width="128" height="34" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="112" y="184" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#1e3a8a">battery</text>
  <path d="M 176 179 L 222 179" stroke="#475569" stroke-width="2" marker-end="url(#pf-arr)"/>
  <rect x="228" y="162" width="218" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="242" y="184" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">87</text>
  <rect x="382" y="168" width="54" height="22" rx="6" fill="#2563eb"/>
  <text x="409" y="183" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#fff">int</text>

  <!-- Row 3: float -->
  <rect x="48" y="206" width="128" height="34" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="112" y="228" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#312e81">gravity</text>
  <path d="M 176 223 L 222 223" stroke="#475569" stroke-width="2" marker-end="url(#pf-arr)"/>
  <rect x="228" y="206" width="218" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="242" y="228" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">9.8</text>
  <rect x="382" y="212" width="54" height="22" rx="6" fill="#4f46e5"/>
  <text x="409" y="227" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#fff">float</text>

  <!-- Row 4: bool -->
  <rect x="48" y="250" width="128" height="34" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="112" y="272" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#78350f">is_ready</text>
  <path d="M 176 267 L 222 267" stroke="#475569" stroke-width="2" marker-end="url(#pf-arr)"/>
  <rect x="228" y="250" width="218" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="242" y="272" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">True  (or 10 &gt; 3)</text>
  <rect x="382" y="256" width="54" height="22" rx="6" fill="#d97706"/>
  <text x="409" y="271" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#fff">bool</text>

  <!-- Row 5: list -->
  <rect x="48" y="294" width="128" height="34" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="112" y="316" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#7f1d1d">scores</text>
  <path d="M 176 311 L 222 311" stroke="#475569" stroke-width="2" marker-end="url(#pf-arr)"/>
  <rect x="228" y="294" width="218" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="242" y="316" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">[9, 10, 8]</text>
  <rect x="382" y="300" width="54" height="22" rx="6" fill="#dc2626"/>
  <text x="409" y="315" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#fff">list</text>

  <!-- Right Panel 1: Quotes trap -->
  <rect x="490" y="76" width="362" height="132" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="510" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#7c2d12">Type Trap: "42" vs. 42</text>
  <rect x="510" y="116" width="154" height="72" rx="9" fill="#ffffff" stroke="#fdba74"/>
  <text x="522" y="138" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#9a3412">"3" + "4"</text>
  <text x="522" y="158" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" fill="#c2410c">→ "34"</text>
  <text x="522" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7c2d12">Text glued together</text>

  <rect x="678" y="116" width="154" height="72" rx="9" fill="#ffffff" stroke="#fdba74"/>
  <text x="690" y="138" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#065f46">3 + 4</text>
  <text x="690" y="158" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" fill="#047857">→ 7</text>
  <text x="690" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#065f46">Numeric addition</text>

  <!-- Right Panel 2: // vs % -->
  <rect x="490" y="222" width="362" height="132" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="510" y="248" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#312e81">Division Helpers: // vs. % on 17 ÷ 5</text>
  <rect x="510" y="264" width="154" height="72" rx="9" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="522" y="286" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#3730a3">17 // 5</text>
  <text x="522" y="306" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" fill="#4338ca">→ 3</text>
  <text x="522" y="324" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4f46e5">Floor quotient only</text>

  <rect x="678" y="264" width="154" height="72" rx="9" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="690" y="286" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#3730a3">17 % 5</text>
  <text x="690" y="306" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" fill="#4338ca">→ 2</text>
  <text x="690" y="324" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4f46e5">Leftover remainder</text>
</svg>
