<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="tab-sg-title tab-sg-desc">
  <title id="tab-sg-title">Text Adventure Worlds as a Directed State Graph</title>
  <desc id="tab-sg-desc">Graph diagram showing how rooms act as nodes, exits act as directed edges, locked doors act as conditional edges requiring an item or flag, and breadth-first search checks room reachability.</desc>
  <defs>
    <marker id="tab-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="tab-arr-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">How a Text Adventure Works Inside: A Directed State Graph</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Rooms are graph nodes, exits are edges, items/flags unlock conditional edges, and BFS verifies every node is reachable</text>

  <!-- Start Room -->
  <rect x="44" y="138" width="152" height="84" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <rect x="56" y="148" width="60" height="18" rx="9" fill="#0f766e"/>
  <text x="86" y="160" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#fff">START</text>
  <text x="56" y="186" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#064e3b">Entry Hall</text>
  <text x="56" y="206" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#047857">id: "hall"</text>

  <!-- Library (West / Up) -->
  <rect x="276" y="84" width="166" height="84" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="292" y="114" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Old Library</text>
  <text x="292" y="134" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">Item: brass_key</text>
  <text x="292" y="152" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#64748b">take key -&gt; inv</text>

  <!-- Basement (South) -->
  <rect x="276" y="206" width="166" height="84" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <rect x="290" y="216" width="70" height="18" rx="9" fill="#334155"/>
  <text x="325" y="228" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#fff">DARK ROOM</text>
  <text x="290" y="254" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Cellar</text>
  <text x="290" y="274" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">Needs: flashlight</text>

  <!-- Office / Win Room -->
  <rect x="530" y="138" width="162" height="84" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="544" y="148" width="64" height="18" rx="9" fill="#d97706"/>
  <text x="576" y="160" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#fff">WIN GOAL</text>
  <text x="544" y="186" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#78350f">Locked Study</text>
  <text x="544" y="206" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#92400e">exit state check</text>

  <!-- Orphan Bug Room -->
  <rect x="724" y="88" width="128" height="82" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="788" y="114" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#991b1b">ORPHAN ROOM</text>
  <text x="788" y="134" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#7f1d1d">Secret Vault</text>
  <text x="788" y="154" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#b91c1c">No incoming edge!</text>

  <!-- Graph edges -->
  <path d="M 196 164 L 270 126" stroke="#475569" stroke-width="2" marker-end="url(#tab-arr)"/>
  <text x="224" y="136" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#334155">north</text>

  <path d="M 196 196 L 270 242" stroke="#475569" stroke-width="2" marker-end="url(#tab-arr)"/>
  <text x="218" y="236" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#334155">down</text>

  <path d="M 442 126 L 524 166" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#tab-arr-gold)"/>
  <rect x="444" y="106" width="106" height="22" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="497" y="121" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#92400e">east · needs key</text>

  <!-- BFS Reachability explainer box -->
  <rect x="44" y="306" width="808" height="52" rx="12" fill="#0f172a"/>
  <text x="64" y="328" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#38bdf8">Graph Checker (Breadth-First Search):</text>
  <text x="64" y="346" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Starts at cfg.start and follows every exit edge. Any room never visited (red dashed) or lacking a return exit becomes a design bug players hit.</text>
</svg>
