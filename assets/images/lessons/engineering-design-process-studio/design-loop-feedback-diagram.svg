<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="dlfd-title">
  <title id="dlfd-title">Iterative Engineering Design Loop with Test Feedback</title>
  <rect width="880" height="300" rx="16" fill="#fff7ed"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#7c2d12">The Engineering Design Loop</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#9a3412">When a prototype fails weight, drop, or remote release constraints, evidence routes directly back to earlier decisions.</text>

  <defs>
    <marker id="dl-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#c2410c"/>
    </marker>
    <marker id="dl-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <g font-family="system-ui,sans-serif">
    <rect x="28" y="92" width="144" height="92" rx="12" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <text x="100" y="116" text-anchor="middle" font-size="11" font-weight="800" fill="#c2410c">1 · DEFINE</text>
    <text x="100" y="138" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Brief &amp; Limits</text>
    <text x="100" y="156" text-anchor="middle" font-size="10.5" fill="#475569">≤700 g empty rig</text>
    <text x="100" y="170" text-anchor="middle" font-size="10.5" fill="#475569">2 m impact · remote</text>

    <line x1="172" y1="138" x2="196" y2="138" stroke="#c2410c" stroke-width="2.2" marker-end="url(#dl-arr)"/>

    <rect x="198" y="92" width="144" height="92" rx="12" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <text x="270" y="116" text-anchor="middle" font-size="11" font-weight="800" fill="#c2410c">2 · MODEL</text>
    <text x="270" y="138" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Select Frame</text>
    <text x="270" y="156" text-anchor="middle" font-size="10.5" fill="#475569">Carbon · Aluminum</text>
    <text x="270" y="170" text-anchor="middle" font-size="10.5" fill="#475569">3D-Printed PLA</text>

    <line x1="342" y1="138" x2="366" y2="138" stroke="#c2410c" stroke-width="2.2" marker-end="url(#dl-arr)"/>

    <rect x="368" y="92" width="144" height="92" rx="12" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <text x="440" y="116" text-anchor="middle" font-size="11" font-weight="800" fill="#c2410c">3 · PROTOTYPE</text>
    <text x="440" y="138" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Release Latch</text>
    <text x="440" y="156" text-anchor="middle" font-size="10.5" fill="#475569">Servo · Magnet</text>
    <text x="440" y="170" text-anchor="middle" font-size="10.5" fill="#475569">Manual Spring Pin</text>

    <line x1="512" y1="138" x2="536" y2="138" stroke="#c2410c" stroke-width="2.2" marker-end="url(#dl-arr)"/>

    <rect x="538" y="92" width="144" height="92" rx="12" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <text x="610" y="116" text-anchor="middle" font-size="11" font-weight="800" fill="#c2410c">4 · TEST</text>
    <text x="610" y="138" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Verify Limits</text>
    <text x="610" y="156" text-anchor="middle" font-size="10.5" fill="#475569">Lift check &amp; 2 m drop</text>
    <text x="610" y="170" text-anchor="middle" font-size="10.5" fill="#475569">Remote release trial</text>

    <line x1="682" y1="138" x2="706" y2="138" stroke="#c2410c" stroke-width="2.2" marker-end="url(#dl-arr)"/>

    <rect x="708" y="92" width="144" height="92" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="780" y="116" text-anchor="middle" font-size="11" font-weight="800" fill="#4338ca">5 · ITERATE</text>
    <text x="780" y="138" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Log &amp; Redesign</text>
    <text x="780" y="156" text-anchor="middle" font-size="10.5" fill="#312e81">Targeted change</text>
    <text x="780" y="170" text-anchor="middle" font-size="10.5" fill="#312e81">from test failure</text>

    <!-- Iteration loop back -->
    <path d="M780,184 L780,244 L270,244 L270,188" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#dl-loop)"/>
    <path d="M440,244 L440,188" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#dl-loop)"/>
    <rect x="366" y="230" width="320" height="26" rx="13" fill="#4f46e5"/>
    <text x="526" y="247" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">FEEDBACK LOOP: REVISE FRAME OR LATCH</text>
  </g>
</svg>
