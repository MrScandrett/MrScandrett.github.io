<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="iptm-title">
  <title id="iptm-title">IoT Wireless Protocol Range vs Power vs Bandwidth Map</title>
  <rect width="880" height="320" rx="16" fill="#f8fafc"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">IoT Wireless Protocol Tradeoff Map</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#475569">Physics locks radios in a three-way trade between communication range, battery longevity, and data speed.</text>

  <g transform="translate(88 80)">
    <rect width="750" height="196" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="250" y1="0" x2="250" y2="196" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="500" y1="0" x2="500" y2="196" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="0" y1="65" x2="750" y2="65" stroke="#f1f5f9" stroke-width="1.5"/>
    <line x1="0" y1="130" x2="750" y2="130" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Bluetooth -->
    <circle cx="115" cy="60" r="34" fill="#3b82f6" fill-opacity="0.18" stroke="#2563eb" stroke-width="2.5"/>
    <text x="115" y="57" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" font-weight="800" fill="#1e3a8a">Bluetooth</text>
    <text x="115" y="73" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#1e40af">10 m · Good battery</text>

    <!-- Wi-Fi -->
    <circle cx="290" cy="40" r="34" fill="#ef4444" fill-opacity="0.18" stroke="#dc2626" stroke-width="2.5"/>
    <text x="290" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" font-weight="800" fill="#991b1b">Wi-Fi</text>
    <text x="290" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#7f1d1d">50 m · Fast · Wall Power</text>

    <!-- Zigbee -->
    <circle cx="330" cy="132" r="38" fill="#10b981" fill-opacity="0.18" stroke="#059669" stroke-width="2.5"/>
    <text x="330" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" font-weight="800" fill="#065f46">Zigbee / Thread</text>
    <text x="330" y="144" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#047857">Mesh hops · Coin cell yrs</text>

    <!-- LoRaWAN -->
    <circle cx="645" cy="152" r="42" fill="#8b5cf6" fill-opacity="0.18" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="645" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" font-weight="800" fill="#4c1d95">LoRaWAN / LTE-M</text>
    <text x="645" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#5b21b6">Miles · Low bytes/hr</text>
  </g>

  <text x="463" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#334155">Operating Range (Meters → Miles)</text>
  <text x="-178" y="36" transform="rotate(-90)" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#334155">Data Throughput (Bytes/hr → HD Video)</text>
</svg>
