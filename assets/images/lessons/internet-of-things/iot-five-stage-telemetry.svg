<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" role="img" aria-labelledby="ifst-title">
  <title id="ifst-title">Five-Stage IoT Telemetry Loop</title>
  <rect width="920" height="270" rx="16" fill="#0f172a"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#f8fafc">The 5-Stage IoT Telemetry Pipeline</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#94a3b8">Physical sensor readings travel through local compute, radio transport, and cloud routing before alerting a human or triggering an actuator.</text>

  <defs>
    <marker id="iot-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <g font-family="system-ui,sans-serif">
    <rect x="28" y="86" width="150" height="122" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="103" y="110" text-anchor="middle" font-size="11" font-weight="800" fill="#fbbf24">STAGE 1</text>
    <text x="103" y="132" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Sensor</text>
    <text x="103" y="154" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Measures temperature,</text>
    <text x="103" y="169" text-anchor="middle" font-size="10.5" fill="#cbd5e1">motion, light, or soil</text>
    <text x="103" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#fde68a">Analog / Digital Raw</text>

    <line x1="178" y1="147" x2="202" y2="147" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#iot-arr)"/>

    <rect x="206" y="86" width="150" height="122" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="281" y="110" text-anchor="middle" font-size="11" font-weight="800" fill="#7dd3fc">STAGE 2</text>
    <text x="281" y="132" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">MCU</text>
    <text x="281" y="154" text-anchor="middle" font-size="10.5" fill="#cbd5e1">UNO R4 / ESP32 reads</text>
    <text x="281" y="169" text-anchor="middle" font-size="10.5" fill="#cbd5e1">pin values, packs JSON</text>
    <text x="281" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#bae6fd">Edge Logic</text>

    <line x1="356" y1="147" x2="380" y2="147" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#iot-arr)"/>

    <rect x="384" y="86" width="150" height="122" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="459" y="110" text-anchor="middle" font-size="11" font-weight="800" fill="#c7d2fe">STAGE 3</text>
    <text x="459" y="132" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Network</text>
    <text x="459" y="154" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Wi-Fi, Zigbee mesh,</text>
    <text x="459" y="169" text-anchor="middle" font-size="10.5" fill="#cbd5e1">BLE, or LoRaWAN radio</text>
    <text x="459" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#ddd6fe">Encrypted Packets</text>

    <line x1="534" y1="147" x2="558" y2="147" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#iot-arr)"/>

    <rect x="562" y="86" width="150" height="122" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="637" y="110" text-anchor="middle" font-size="11" font-weight="800" fill="#86efac">STAGE 4</text>
    <text x="637" y="132" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Cloud</text>
    <text x="637" y="154" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Broker stores logs,</text>
    <text x="637" y="169" text-anchor="middle" font-size="10.5" fill="#cbd5e1">checks automation rules</text>
    <text x="637" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#bbf7d0">MQTT / HTTPS</text>

    <line x1="712" y1="147" x2="736" y2="147" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#iot-arr)"/>

    <rect x="740" y="86" width="152" height="122" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <text x="816" y="110" text-anchor="middle" font-size="11" font-weight="800" fill="#fbcfe8">STAGE 5</text>
    <text x="816" y="132" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">App / Actuator</text>
    <text x="816" y="154" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Dashboard alert or</text>
    <text x="816" y="169" text-anchor="middle" font-size="10.5" fill="#cbd5e1">relay switch toggles</text>
    <text x="816" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#fce7f3">Human or Relay</text>

    <path d="M816,208 L816,242 L103,242 L103,212" fill="none" stroke="#34d399" stroke-width="2.2" stroke-dasharray="6 4"/>
    <text x="460" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#6ee7b7">FEEDBACK: RETURN COMMAND TRIGGERS RELAY, FAN, OR VALVE (IF RULE MATCHES)</text>
  </g>
</svg>
