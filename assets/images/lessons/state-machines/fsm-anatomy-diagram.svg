<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="fsm-anat-title fsm-anat-desc">
  <title id="fsm-anat-title">Anatomy of a Deterministic Finite State Machine: 5-Tuple and Transition Table</title>
  <desc id="fsm-anat-desc">Diagram explaining the five parts of a finite state machine M = (Q, Sigma, delta, q0, F): start arrow into Even0, labeled curved transitions on bits 0 and 1, self-loops, accepting double ring on Even0, and the matching state transition table on the right.</desc>
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309" />
    </marker>
  </defs>

  <rect width="960" height="480" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect x="24" y="20" width="912" height="46" rx="10" fill="#0f172a" />
  <text x="42" y="49" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#e2f5e7">ANATOMY OF AN FSM · M = (Q, Σ, δ, q₀, F)</text>

  <!-- Left panel: State Graph -->
  <rect x="24" y="82" width="528" height="278" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="42" y="108" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">STATE GRAPH (EVEN-ZEROS DFA)</text>

  <!-- Start entry arrow -->
  <text x="44" y="218" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f766e">START (q₀)</text>
  <line x1="48" y1="230" x2="128" y2="230" stroke="#0f766e" stroke-width="3" marker-end="url(#arr-teal)" />

  <!-- Self loop on Even0 (top) -->
  <path d="M 164 186 C 142 126, 212 126, 190 186" fill="none" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr-dark)" />
  <rect x="150" y="114" width="54" height="24" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
  <text x="177" y="130" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#0c4a6e">bit = 1</text>

  <!-- Self loop on Odd0 (top) -->
  <path d="M 404 186 C 382 126, 452 126, 430 186" fill="none" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr-dark)" />
  <rect x="390" y="114" width="54" height="24" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
  <text x="417" y="130" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#0c4a6e">bit = 1</text>

  <!-- Curved arrow Even0 -> Odd0 (upper arc) -->
  <path d="M 222 208 Q 297 166 372 208" fill="none" stroke="#b45309" stroke-width="2.6" marker-end="url(#arr-amber)" />
  <rect x="270" y="168" width="54" height="24" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="297" y="184" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#78350f">bit = 0</text>

  <!-- Curved arrow Odd0 -> Even0 (lower arc) -->
  <path d="M 372 252 Q 297 294 222 252" fill="none" stroke="#0f766e" stroke-width="2.6" marker-end="url(#arr-teal)" />
  <rect x="270" y="264" width="54" height="24" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="297" y="280" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#14532d">bit = 0</text>

  <!-- State Even0 (accepting double circle) -->
  <circle cx="177" cy="230" r="46" fill="#dcfce7" stroke="#15803d" stroke-width="3" />
  <circle cx="177" cy="230" r="39" fill="none" stroke="#15803d" stroke-width="2" />
  <text x="177" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#14532d">Even0</text>
  <text x="177" y="244" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#166534">ACCEPT (F)</text>

  <!-- State Odd0 -->
  <circle cx="417" cy="230" r="44" fill="#ffe4e6" stroke="#be123c" stroke-width="3" />
  <text x="417" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#881337">Odd0</text>
  <text x="417" y="244" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#9f1239">REJECT</text>

  <!-- Callouts at bottom of left box -->
  <text x="44" y="328" font-family="system-ui, sans-serif" font-size="12" fill="#334155">• Curved opposite edges keep labels readable without crossing.</text>
  <text x="44" y="346" font-family="system-ui, sans-serif" font-size="12" fill="#334155">• Double ring marks an accepting state (F = {Even0}).</text>

  <!-- Right panel: Transition Table -->
  <rect x="572" y="82" width="364" height="278" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="592" y="108" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">TRANSITION FUNCTION δ(state, input)</text>

  <!-- Table headers -->
  <rect x="592" y="124" width="324" height="36" rx="6" fill="#0f172a" />
  <text x="612" y="147" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Current State</text>
  <text x="752" y="147" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#93c5fd">on '0'</text>
  <text x="858" y="147" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#86efac">on '1'</text>

  <!-- Row 1 -->
  <rect x="592" y="164" width="324" height="44" fill="#f0fdf4" stroke="#cbd5e1" />
  <text x="612" y="191" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#14532d">→ Even0  ★</text>
  <text x="752" y="191" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#9a3412">Odd0</text>
  <text x="858" y="191" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#14532d">Even0</text>

  <!-- Row 2 -->
  <rect x="592" y="208" width="324" height="44" fill="#fff1f2" stroke="#cbd5e1" />
  <text x="612" y="235" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#881337">Odd0</text>
  <text x="752" y="235" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#14532d">Even0</text>
  <text x="858" y="235" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#881337">Odd0</text>

  <text x="592" y="280" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Example trace: "1010"</text>
  <text x="592" y="302" font-family="ui-monospace, monospace" font-size="12" fill="#1e293b">Even0 —[1]→ Even0 —[0]→ Odd0</text>
  <text x="592" y="322" font-family="ui-monospace, monospace" font-size="12" fill="#1e293b">      —[1]→ Odd0  —[0]→ Even0 ★</text>
  <text x="592" y="344" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">Result: Accepted (2 zeros is even)</text>

  <!-- Bottom 5-tuple legend strip -->
  <rect x="24" y="376" width="912" height="84" rx="12" fill="#0f172a" />
  <text x="44" y="403" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#7dd3fc">Q = {Even0, Odd0}   ·   Σ = {0, 1}   ·   q₀ = Even0   ·   F = {Even0}</text>
  <text x="44" y="426" font-family="system-ui, sans-serif" font-size="12.5" fill="#e2e8f0">δ (delta) maps every (state, symbol) pair to at most one next state. Complete tables never leave an input unhandled.</text>
  <text x="44" y="446" font-family="system-ui, sans-serif" font-size="12.5" fill="#94a3b8">Only 1 bit of memory (even vs. odd count of zeros) is needed, no matter how many millions of bits arrive.</text>
</svg>
