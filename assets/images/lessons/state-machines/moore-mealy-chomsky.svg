<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="mm-title mm-desc">
  <title id="mm-title">Moore vs. Mealy State Machines and the Memory Wall Hierarchy</title>
  <desc id="mm-desc">Two-part computer science diagram. Top compares Moore machines whose output belongs to the state against Mealy machines whose output belongs to the transition arrow, detecting the bit pair 10 in 3 versus 2 states. Bottom illustrates the Memory Wall showing why finite state machines need finite memory while pushdown automata add a stack and Turing machines add an infinite tape.</desc>
  <defs>
    <marker id="mm-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="mm-arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d" />
    </marker>
  </defs>

  <rect width="960" height="500" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect x="24" y="18" width="912" height="44" rx="10" fill="#111827" />
  <text x="42" y="46" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" font-weight="700" fill="#fde68a">MOORE vs. MEALY OUTPUTS · AND THE FINITE MEMORY WALL</text>

  <!-- Top Left: Moore -->
  <rect x="24" y="76" width="448" height="202" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="42" y="102" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0c4a6e">MOORE MACHINE (1956) · OUTPUT INSIDE STATE</text>
  <text x="42" y="121" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Needs 3 states to detect "10" (extra state holds output 1).</text>

  <circle cx="88" cy="186" r="32" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5" />
  <text x="88" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0c4a6e">S0</text>
  <text x="88" y="199" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0369a1">out: 0</text>

  <circle cx="242" cy="186" r="32" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" />
  <text x="242" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#78350f">S1</text>
  <text x="242" y="199" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#b45309">out: 0</text>

  <circle cx="396" cy="186" r="34" fill="#dcfce7" stroke="#15803d" stroke-width="2.5" />
  <circle cx="396" cy="186" r="28" fill="none" stroke="#15803d" stroke-width="1.5" />
  <text x="396" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#14532d">S10</text>
  <text x="396" y="199" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#15803d">out: 1</text>

  <line x1="120" y1="186" x2="206" y2="186" stroke="#1e293b" stroke-width="2.2" marker-end="url(#mm-arrow)" />
  <text x="163" y="177" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0f172a">in: 1</text>

  <line x1="274" y1="186" x2="358" y2="186" stroke="#15803d" stroke-width="2.2" marker-end="url(#mm-arrow-green)" />
  <text x="316" y="177" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#14532d">in: 0</text>

  <path d="M 396 220 Q 242 262 88 220" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#mm-arrow)" />
  <text x="242" y="258" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569">in: 0 → S0 (or 1 → S1)</text>

  <!-- Top Right: Mealy -->
  <rect x="488" y="76" width="448" height="202" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="506" y="102" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#7c2d12">MEALY MACHINE (1955) · OUTPUT ON TRANSITION</text>
  <text x="506" y="121" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Needs only 2 states: emits "1" directly on the 1 → 0 arrow.</text>

  <circle cx="600" cy="190" r="35" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5" />
  <text x="600" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0c4a6e">M0</text>
  <text x="600" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#0369a1">idle</text>

  <circle cx="820" cy="190" r="35" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" />
  <text x="820" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#78350f">M1</text>
  <text x="820" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#b45309">saw 1</text>

  <path d="M 632 172 Q 710 132 788 172" fill="none" stroke="#1e293b" stroke-width="2.3" marker-end="url(#mm-arrow)" />
  <rect x="673" y="132" width="74" height="22" rx="11" fill="#f1f5f9" stroke="#64748b" />
  <text x="710" y="147" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#0f172a">1 / out=0</text>

  <path d="M 788 208 Q 710 248 632 208" fill="none" stroke="#15803d" stroke-width="2.6" marker-end="url(#mm-arrow-green)" />
  <rect x="670" y="228" width="80" height="22" rx="11" fill="#dcfce7" stroke="#16a34a" />
  <text x="710" y="243" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="800" fill="#14532d">0 / out=1</text>

  <!-- Bottom: Memory Wall Hierarchy -->
  <rect x="24" y="294" width="912" height="188" rx="12" fill="#0f172a" />
  <text x="44" y="322" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#38bdf8">THE MEMORY WALL: WHAT AN FSM CAN REMEMBER — AND WHERE IT STOPS</text>

  <!-- Tier 1 -->
  <rect x="44" y="340" width="272" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
  <text x="60" y="365" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#e0f2fe">1. Finite State Machine</text>
  <text x="60" y="386" font-family="ui-monospace, monospace" font-size="11.5" fill="#7dd3fc">Memory: O(1) fixed states</text>
  <text x="60" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">✓ Traffic lights, locks, regex</text>
  <text x="60" y="430" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">✓ Even/odd zero counting</text>
  <text x="60" y="450" font-family="system-ui, sans-serif" font-size="12" fill="#fda4af">✗ Unbounded nested ()()</text>

  <!-- Arrow 1->2 -->
  <line x1="316" y1="402" x2="344" y2="402" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#mm-arrow-green)" />

  <!-- Tier 2 -->
  <rect x="344" y="340" width="272" height="124" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.8" />
  <text x="360" y="365" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#fef3c7">2. Pushdown Automaton</text>
  <text x="360" y="386" font-family="ui-monospace, monospace" font-size="11.5" fill="#fde68a">Memory: FSM + LIFO Stack</text>
  <text x="360" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">✓ Balanced parentheses ((( )))</text>
  <text x="360" y="430" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">✓ Nested HTML / JSON parsing</text>
  <text x="360" y="450" font-family="system-ui, sans-serif" font-size="12" fill="#fda4af">✗ Cross-checked triple counts</text>

  <!-- Arrow 2->3 -->
  <line x1="616" y1="402" x2="644" y2="402" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#mm-arrow-green)" />

  <!-- Tier 3 -->
  <rect x="644" y="340" width="272" height="124" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.8" />
  <text x="660" y="365" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#dcfce7">3. Turing Machine (1936)</text>
  <text x="660" y="386" font-family="ui-monospace, monospace" font-size="11.5" fill="#86efac">Memory: FSM + Infinite Tape</text>
  <text x="660" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">✓ Read &amp; write anywhere on tape</text>
  <text x="660" y="430" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">✓ Universal computation</text>
  <text x="660" y="450" font-family="system-ui, sans-serif" font-size="12" fill="#86efac">✓ Foundation of modern CPUs</text>
</svg>
