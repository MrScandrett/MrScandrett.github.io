<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" overflow="hidden" role="img" aria-labelledby="ae-title ae-desc">
  <title id="ae-title">Amelia Earhart: 1937 World Flight & Pacific Navigation</title>
  <desc id="ae-desc">Equatorial world map tracing Amelia Earhart and Fred Noonan's 1937 flight in the Lockheed Model 10-E Electra from Oakland across South America, Africa, Asia, Australia, and the fateful leg to Howland Island.</desc>
  <rect width="1000" height="580" fill="#0c2440"/>
  <!-- Graticule -->
  <path d="M100,0V580 M300,0V580 M500,0V580 M700,0V580 M900,0V580 M0,145H1000 M0,290H1000 M0,435H1000" stroke="#1c3d5a" stroke-width="1" stroke-dasharray="4 6" fill="none"/>
  <text x="20" y="285" fill="#e5a93c" font-family="system-ui,sans-serif" font-size="12" font-weight="bold">0° EQUATORIAL FLIGHT PATH</text>
  <!-- World land silhouettes simplified for global aeronautical schematic -->
  <!-- Americas -->
  <path d="M120,120 Q160,110 190,160 Q210,210 240,250 Q270,300 280,360 Q260,440 220,500 Q190,460 210,380 Q190,300 160,260 Q120,240 100,180 Z" fill="#163228" stroke="#2a5a48" stroke-width="1.5"/>
  <!-- Africa & Europe -->
  <path d="M390,110 Q450,100 480,140 Q530,160 520,240 Q540,320 510,400 Q470,470 420,440 Q390,360 380,260 Q340,230 360,160 Z" fill="#163228" stroke="#2a5a48" stroke-width="1.5"/>
  <!-- Asia & Australia -->
  <path d="M550,110 Q660,100 780,120 Q840,160 830,240 Q770,280 750,330 Q790,380 810,460 Q750,470 700,420 Q680,360 670,300 Q600,260 550,220 Z" fill="#163228" stroke="#2a5a48" stroke-width="1.5"/>
  <!-- Completed Flight Legs in Bright Orange -->
  <!-- Oakland -> Miami -> San Juan -> Natal -> Dakar -> Khartoum -> Karachi -> Calcutta -> Singapore -> Darwin -> Lae -->
  <path d="M110,180 L180,210 L210,235 L280,310 L380,260 L490,260 L580,245 L640,260 L700,310 L750,400 L810,340" fill="none" stroke="#f5882c" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Final Leg: Lae to Howland Island (Cyan Dashed) -->
  <path d="M810,340 L930,290" fill="none" stroke="#4ee2ec" stroke-width="3.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <!-- Intended completion: Howland -> Hawaii -> Oakland -->
  <path d="M930,290 L980,240 M20,240 L110,180" fill="none" stroke="#608599" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- Waypoints -->
  <!-- Oakland -->
  <circle cx="110" cy="180" r="5" fill="#f5882c" stroke="#fff" stroke-width="1.5"/>
  <text x="60" y="170" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="bold">Oakland (Start, June 1)</text>
  <!-- Miami -->
  <circle cx="180" cy="210" r="4" fill="#f5882c" stroke="#fff" stroke-width="1.5"/>
  <text x="165" y="195" fill="#ffd3a8" font-family="system-ui,sans-serif" font-size="11">Miami</text>
  <!-- Natal -->
  <circle cx="280" cy="310" r="4" fill="#f5882c" stroke="#fff" stroke-width="1.5"/>
  <text x="235" y="325" fill="#ffd3a8" font-family="system-ui,sans-serif" font-size="11">Natal (Brazil)</text>
  <!-- Dakar -->
  <circle cx="380" cy="260" r="4" fill="#f5882c" stroke="#fff" stroke-width="1.5"/>
  <text x="345" y="280" fill="#ffd3a8" font-family="system-ui,sans-serif" font-size="11">Dakar</text>
  <!-- Khartoum -->
  <circle cx="490" cy="260" r="4" fill="#f5882c" stroke="#fff" stroke-width="1.5"/>
  <text x="470" y="245" fill="#ffd3a8" font-family="system-ui,sans-serif" font-size="11">Khartoum</text>
  <!-- Karachi -->
  <circle cx="580" cy="245" r="4" fill="#f5882c" stroke="#fff" stroke-width="1.5"/>
  <text x="560" y="230" fill="#ffd3a8" font-family="system-ui,sans-serif" font-size="11">Karachi</text>
  <!-- Singapore -->
  <circle cx="700" cy="310" r="4" fill="#f5882c" stroke="#fff" stroke-width="1.5"/>
  <text x="670" y="330" fill="#ffd3a8" font-family="system-ui,sans-serif" font-size="11">Singapore</text>
  <!-- Darwin -->
  <circle cx="750" cy="400" r="4" fill="#f5882c" stroke="#fff" stroke-width="1.5"/>
  <text x="730" y="420" fill="#ffd3a8" font-family="system-ui,sans-serif" font-size="11">Darwin</text>
  <!-- Lae -->
  <circle cx="810" cy="340" r="6" fill="#f5882c" stroke="#fff" stroke-width="2"/>
  <text x="795" y="320" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">Lae (Depart July 2)</text>
  <!-- Howland Island Target Area -->
  <circle cx="930" cy="290" r="8" fill="none" stroke="#ff5252" stroke-width="2.5"/>
  <circle cx="930" cy="290" r="3" fill="#4ee2ec" stroke="#fff" stroke-width="1"/>
  <text x="870" y="270" fill="#ff8a80" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">Howland Island (Target)</text>
  <!-- 157-337 Sun Line of Position -->
  <line x1="915" y1="325" x2="945" y2="255" stroke="#ffeb3b" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="920" y="345" fill="#fff59d" font-family="system-ui,sans-serif" font-size="11" font-weight="bold">Line 157°–337°</text>
  <text x="845" y="365" fill="#7dc4e0" font-family="system-ui,sans-serif" font-size="11">2,556 miles over ocean</text>
  <!-- Legend Banner -->
  <rect x="24" y="24" width="370" height="115" rx="6" fill="#071626" stroke="#244b43" stroke-width="1.5"/>
  <text x="40" y="48" fill="#fff" font-family="system-ui,sans-serif" font-size="15" font-weight="bold">Amelia Earhart: 1937 Electra 10-E Flight</text>
  <line x1="40" y1="70" x2="70" y2="70" stroke="#f5882c" stroke-width="3.5"/>
  <text x="80" y="74" fill="#e1e7ec" font-family="system-ui,sans-serif" font-size="12">Completed legs: 22,000+ miles flown</text>
  <line x1="40" y1="94" x2="70" y2="94" stroke="#4ee2ec" stroke-width="3.5" stroke-dasharray="6 4"/>
  <text x="80" y="98" fill="#e1e7ec" font-family="system-ui,sans-serif" font-size="12">Final leg: Lae to Howland Island (2,556 mi)</text>
</svg>