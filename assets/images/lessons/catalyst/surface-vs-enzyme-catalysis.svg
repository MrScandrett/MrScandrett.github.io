<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="svec-title">
  <title id="svec-title">Heterogeneous Surface vs. Biological Enzyme Catalysis</title>
  <rect width="880" height="310" rx="16" fill="#f8fafc"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">Two Physical Ways Catalysts Lower Activation Barriers</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#475569">Both metal surfaces and living enzymes weaken target bonds by holding molecules in exact alignment — and leave ready to repeat.</text>

  <!-- Left: Pt/Pd Surface -->
  <g transform="translate(26 76)" font-family="system-ui,sans-serif">
    <rect width="402" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="16" y="28" font-size="13.5" font-weight="800" fill="#0369a1">Heterogeneous Surface (Pt / Rh / Pd)</text>
    <!-- Metal lattice -->
    <rect x="26" y="132" width="350" height="32" rx="6" fill="#64748b"/>
    <circle cx="70" cy="148" r="7" fill="#cbd5e1"/><circle cx="115" cy="148" r="7" fill="#cbd5e1"/>
    <circle cx="160" cy="148" r="7" fill="#cbd5e1"/><circle cx="205" cy="148" r="7" fill="#cbd5e1"/>
    <circle cx="250" cy="148" r="7" fill="#cbd5e1"/><circle cx="295" cy="148" r="7" fill="#cbd5e1"/>
    <circle cx="340" cy="148" r="7" fill="#cbd5e1"/>
    <!-- Adsorbed molecules breaking bond -->
    <circle cx="122" cy="116" r="11" fill="#334155"/><circle cx="152" cy="116" r="11" fill="#ef4444"/>
    <line x1="133" y1="116" x2="141" y2="116" stroke="#f59e0b" stroke-width="3" stroke-dasharray="2 2"/>
    <text x="137" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">CO adsorbs onto Pt</text>
    <circle cx="265" cy="116" r="11" fill="#ef4444"/><circle cx="295" cy="116" r="11" fill="#ef4444"/>
    <text x="280" y="92" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">O₂ splits cleanly</text>
    <text x="201" y="190" text-anchor="middle" font-size="11" fill="#475569">Exhaust honeycomb catalyzes CO → CO₂ at lower heat</text>
  </g>

  <!-- Right: Biological Enzyme -->
  <g transform="translate(452 76)" font-family="system-ui,sans-serif">
    <rect width="402" height="210" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="16" y="28" font-size="13.5" font-weight="800" fill="#15803d">Enzyme Active Site (Biological Catalyst)</text>
    <!-- Enzyme cradle -->
    <path d="M56,158 C56,82 135,82 145,112 L185,112 C195,82 280,82 280,158 Z" fill="#86efac" stroke="#16a34a" stroke-width="2.5"/>
    <text x="168" y="144" text-anchor="middle" font-size="11" font-weight="800" fill="#14532d">ENZYME (e.g. Catalase)</text>
    <!-- Substrate fitting active pocket -->
    <rect x="148" y="76" width="38" height="28" rx="6" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <text x="167" y="94" text-anchor="middle" font-size="10" font-weight="800" fill="#0f172a">H₂O₂</text>
    <line x1="286" y1="108" x2="322" y2="108" stroke="#16a34a" stroke-width="2.5"/>
    <polygon points="328,108 320,103 320,113" fill="#16a34a"/>
    <circle cx="352" cy="92" r="11" fill="#bae6fd" stroke="#0284c7"/><text x="352" y="96" text-anchor="middle" font-size="8.5" font-weight="800">H₂O</text>
    <circle cx="352" cy="126" r="11" fill="#fde047" stroke="#ca8a04"/><text x="352" y="130" text-anchor="middle" font-size="8.5" font-weight="800">O₂</text>
    <text x="201" y="190" text-anchor="middle" font-size="11" fill="#475569">Specific 3D pocket converts millions of molecules per second</text>
  </g>
</svg>
