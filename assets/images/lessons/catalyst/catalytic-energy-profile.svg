<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="cep-title">
  <title id="cep-title">Catalyzed vs. Uncatalyzed Activation Energy Profile</title>
  <rect width="860" height="320" rx="16" fill="#f8fafc"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">Why a Catalyst Speeds Up Reactions Without Changing ΔH</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#475569">Reactants and products end at identical energies — the catalyst opens an alternative reaction mechanism with a lower Eₐ hill.</text>

  <g transform="translate(88 76)" font-family="system-ui,sans-serif">
    <rect width="730" height="202" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    <line x1="20" y1="82" x2="700" y2="82" stroke="#cbd5e1" stroke-dasharray="4 4"/>
    <line x1="20" y1="154" x2="700" y2="154" stroke="#cbd5e1" stroke-dasharray="4 4"/>

    <!-- Uncatalyzed curve (high hill) -->
    <path d="M40,82 L170,82 C260,82 300,18 365,18 C430,18 465,154 555,154 L685,154" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="7 5"/>
    <!-- Catalyzed curve (lower double bump intermediate) -->
    <path d="M40,82 L170,82 C240,82 275,48 320,48 C350,48 355,66 375,66 C395,66 405,52 435,52 C475,52 495,154 555,154 L685,154" fill="none" stroke="#16a34a" stroke-width="4"/>

    <text x="105" y="72" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Reactants</text>
    <text x="625" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Products</text>

    <!-- Ea comparison arrows -->
    <line x1="365" y1="82" x2="365" y2="21" stroke="#dc2626" stroke-width="2"/>
    <text x="374" y="34" font-size="11.5" font-weight="800" fill="#dc2626">Uncatalyzed Eₐ (high barrier)</text>

    <line x1="295" y1="82" x2="295" y2="50" stroke="#15803d" stroke-width="2"/>
    <text x="200" y="106" font-size="11.5" font-weight="800" fill="#15803d">Catalyzed Eₐ (lower hill)</text>

    <!-- Constant Delta H -->
    <line x1="655" y1="82" x2="655" y2="154" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="645" y="122" text-anchor="end" font-size="11.5" font-weight="800" fill="#4338ca">ΔH unchanged!</text>
  </g>
  <text x="453" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#334155">Reaction Coordinate (Progress →)</text>
  <text x="-178" y="34" transform="rotate(-90)" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#334155">Potential Energy</text>
</svg>
