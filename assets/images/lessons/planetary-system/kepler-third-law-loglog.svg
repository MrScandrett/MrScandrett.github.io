<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-labelledby="k3l-title">
  <title id="k3l-title">Kepler's Third Law Harmonic Line on Log-Log Axes</title>
  <rect width="860" height="340" rx="16" fill="#0f172a"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Kepler's Third Law: T² = a³ Across Every Planet</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#94a3b8">When plotted on logarithmic scales, orbital period T (years) vs. distance a (AU) forms a straight line of slope 3/2.</text>

  <g transform="translate(88 78)" font-family="system-ui,sans-serif">
    <rect width="730" height="208" rx="8" fill="#1e293b" stroke="#334155"/>
    <!-- Grid ticks -->
    <line x1="0" y1="52" x2="730" y2="52" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="104" x2="730" y2="104" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="156" x2="730" y2="156" stroke="#334155" stroke-width="1"/>
    <line x1="182" y1="0" x2="182" y2="208" stroke="#334155" stroke-width="1"/>
    <line x1="365" y1="0" x2="365" y2="208" stroke="#334155" stroke-width="1"/>
    <line x1="547" y1="0" x2="547" y2="208" stroke="#334155" stroke-width="1"/>

    <!-- T^2 = a^3 exact diagonal -->
    <line x1="40" y1="194" x2="690" y2="18" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4"/>

    <!-- Data points positioned along exact T = a^1.5 log mapping -->
    <circle cx="90" cy="180" r="5" fill="#94a3b8"/>
    <text x="90" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e2e8f0">Mercury (0.39 AU)</text>

    <circle cx="176" cy="157" r="5.5" fill="#fde047"/>
    <text x="176" y="146" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fde68a">Venus (0.72 AU)</text>

    <circle cx="242" cy="139" r="6.5" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="262" y="137" font-size="11" font-weight="800" fill="#93c5fd">Earth (1 AU, 1 yr)</text>

    <circle cx="312" cy="120" r="5.5" fill="#ef4444"/>
    <text x="312" y="109" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fca5a5">Mars (1.52 AU)</text>

    <circle cx="480" cy="75" r="8" fill="#fb923c"/>
    <text x="480" y="62" text-anchor="middle" font-size="11" font-weight="800" fill="#fed7aa">Jupiter (5.2 AU, 11.9 yr)</text>

    <circle cx="566" cy="51" r="7" fill="#eab308"/>
    <text x="566" y="38" text-anchor="middle" font-size="11" font-weight="800" fill="#fef08a">Saturn (9.5 AU, 29.5 yr)</text>

    <circle cx="670" cy="24" r="6" fill="#38bdf8"/>
    <text x="642" y="18" text-anchor="end" font-size="11" font-weight="800" fill="#7dd3fc">Neptune (30 AU, 165 yr)</text>
  </g>

  <text x="453" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#cbd5e1">Semi-Major Axis a (AU, log scale)</text>
  <text x="-182" y="32" transform="rotate(-90)" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#cbd5e1">Orbital Period T (years, log scale)</text>
</svg>
