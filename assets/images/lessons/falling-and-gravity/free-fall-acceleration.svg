<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="fg-title fg-desc">
  <title id="fg-title">Physics of Falling and Gravity: Vacuum vs Air Resistance</title>
  <desc id="fg-desc">Side-by-side physics diagram comparing a heavy hammer and a light feather falling in a vacuum chamber (identical acceleration g) versus falling through air (feather slowed by aerodynamic drag).</desc>
  <defs>
    <linearGradient id="vac-tube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="air-tube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#080e1a"/>
  
  <!-- Subtle Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <path d="M0 60h960M0 120h960M0 180h960M0 240h960M0 300h960M0 360h960M0 420h960M0 480h960"/>
    <path d="M60 0v540M120 0v540M180 0v540M240 0v540M300 0v540M360 0v540M420 0v540M480 0v540M540 0v540M600 0v540M660 0v540M720 0v540M780 0v540M840 0v540M900 0v540"/>
  </g>

  <!-- Title & Description -->
  <text x="40" y="44" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">FREE-FALL ACCELERATION: GALILEO'S EXPERIMENT &amp; VACUUM DYNAMICS</text>
  <text x="40" y="68" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">In a vacuum, all masses accelerate at the exact same rate (g = 9.8 m/s²). Air resistance masks this fundamental law.</text>

  <!-- Divider between chambers -->
  <line x1="480" y1="85" x2="480" y2="430" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ==================== LEFT CHAMBER: VACUUM ==================== -->
  <g transform="translate(60, 90)">
    <!-- Tube border -->
    <rect x="0" y="0" width="380" height="335" rx="14" fill="url(#vac-tube)" stroke="#0284c7" stroke-width="2"/>
    <rect x="15" y="12" width="145" height="24" rx="6" fill="#0369a1"/>
    <text x="87" y="28" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#f0f9ff" text-anchor="middle">VACUUM CHAMBER</text>
    <text x="170" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">(Air Removed · Drag = 0)</text>

    <!-- Stroboscopic Free-Fall Timeline: t = 0, t = 0.4s, t = 0.7s, t = 1.0s -->
    <!-- Distance d = 1/2 * g * t^2. Positions y = 60, 105, 185, 290 -->

    <!-- Timestamp T = 0.0s (Release) -->
    <text x="45" y="65" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">t = 0.0 s</text>
    <!-- Hammer at (140, 60) -->
    <rect x="135" y="55" width="22" height="12" rx="2" fill="#94a3b8"/>
    <rect x="143" y="67" width="6" height="20" rx="1.5" fill="#f59e0b"/>
    <!-- Feather at (250, 60) -->
    <path d="M250,55 c8,8 12,20 10,26 c-3,3 -10,0 -12,-6 c-2,-6 -1,-14 2,-20 z" fill="#38bdf8"/>
    <line x1="250" y1="55" x2="246" y2="82" stroke="#e0f2fe" stroke-width="1.5"/>

    <!-- Timestamp T = 0.4s -->
    <text x="45" y="125" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">t = 0.4 s</text>
    <!-- Hammer at (140, 115) -->
    <rect x="135" y="110" width="22" height="12" rx="2" fill="#94a3b8" opacity="0.6"/>
    <rect x="143" y="122" width="6" height="20" rx="1.5" fill="#f59e0b" opacity="0.6"/>
    <!-- Feather at (250, 115) -->
    <path d="M250,110 c8,8 12,20 10,26 c-3,3 -10,0 -12,-6 c-2,-6 -1,-14 2,-20 z" fill="#38bdf8" opacity="0.6"/>
    <line x1="250" y1="110" x2="246" y2="137" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6"/>
    <!-- Synchronized alignment line -->
    <line x1="165" y1="125" x2="235" y2="125" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Timestamp T = 0.7s -->
    <text x="45" y="205" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">t = 0.7 s</text>
    <!-- Hammer at (140, 195) -->
    <rect x="135" y="190" width="22" height="12" rx="2" fill="#94a3b8" opacity="0.75"/>
    <rect x="143" y="202" width="6" height="20" rx="1.5" fill="#f59e0b" opacity="0.75"/>
    <!-- Feather at (250, 195) -->
    <path d="M250,190 c8,8 12,20 10,26 c-3,3 -10,0 -12,-6 c-2,-6 -1,-14 2,-20 z" fill="#38bdf8" opacity="0.75"/>
    <line x1="250" y1="190" x2="246" y2="217" stroke="#e0f2fe" stroke-width="1.5" opacity="0.75"/>
    <line x1="165" y1="205" x2="235" y2="205" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Timestamp T = 1.0s (Simultaneous Landing) -->
    <text x="45" y="295" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">t = 1.0 s</text>
    <!-- Hammer at (140, 280) -->
    <rect x="135" y="275" width="22" height="12" rx="2" fill="#f1f5f9"/>
    <rect x="143" y="287" width="6" height="20" rx="1.5" fill="#fbbf24"/>
    <!-- Feather at (250, 280) -->
    <path d="M250,275 c8,8 12,20 10,26 c-3,3 -10,0 -12,-6 c-2,-6 -1,-14 2,-20 z" fill="#38bdf8"/>
    <line x1="250" y1="275" x2="246" y2="302" stroke="#e0f2fe" stroke-width="2"/>
    <!-- Solid Landing Alignment Bar -->
    <line x1="120" y1="305" x2="280" y2="305" stroke="#34d399" stroke-width="3"/>
    <text x="200" y="324" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#34d399" text-anchor="middle">SIMULTANEOUS IMPACT</text>
  </g>

  <!-- ==================== RIGHT CHAMBER: AIR ==================== -->
  <g transform="translate(520, 90)">
    <!-- Tube border -->
    <rect x="0" y="0" width="380" height="335" rx="14" fill="url(#air-tube)" stroke="#d97706" stroke-width="2"/>
    <rect x="15" y="12" width="135" height="24" rx="6" fill="#b45309"/>
    <text x="82" y="28" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#fef3c7" text-anchor="middle">AIR ATMOSPHERE</text>
    <text x="160" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fcd34d">(Fluid Drag F_drag &gt; 0)</text>

    <!-- Air drag resistance swirls -->
    <path d="M230,120 c8,-6 14,-2 18,4 M265,122 c-6,-6 -12,-3 -16,3" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M225,180 c10,-6 16,-2 22,5 M270,182 c-8,-6 -14,-3 -18,4" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Timestamp T = 0.0s -->
    <text x="45" y="65" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">t = 0.0 s</text>
    <rect x="135" y="55" width="22" height="12" rx="2" fill="#94a3b8"/>
    <rect x="143" y="67" width="6" height="20" rx="1.5" fill="#f59e0b"/>
    <path d="M250,55 c8,8 12,20 10,26 c-3,3 -10,0 -12,-6 c-2,-6 -1,-14 2,-20 z" fill="#38bdf8"/>
    <line x1="250" y1="55" x2="246" y2="82" stroke="#e0f2fe" stroke-width="1.5"/>

    <!-- Timestamp T = 0.4s -->
    <text x="45" y="125" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">t = 0.4 s</text>
    <!-- Hammer falling normally -->
    <rect x="135" y="110" width="22" height="12" rx="2" fill="#94a3b8" opacity="0.6"/>
    <rect x="143" y="122" width="6" height="20" rx="1.5" fill="#f59e0b" opacity="0.6"/>
    <!-- Feather already lagging -->
    <path d="M245,95 c8,8 12,20 10,26 c-3,3 -10,0 -12,-6 c-2,-6 -1,-14 2,-20 z" fill="#38bdf8" opacity="0.6"/>
    <line x1="245" y1="95" x2="241" y2="122" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6"/>

    <!-- Timestamp T = 0.7s -->
    <text x="45" y="205" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">t = 0.7 s</text>
    <rect x="135" y="190" width="22" height="12" rx="2" fill="#94a3b8" opacity="0.75"/>
    <rect x="143" y="202" width="6" height="20" rx="1.5" fill="#f59e0b" opacity="0.75"/>
    <!-- Feather floating slowly at terminal velocity -->
    <path d="M248,150 c8,8 12,20 10,26 c-3,3 -10,0 -12,-6 c-2,-6 -1,-14 2,-20 z" fill="#38bdf8" opacity="0.75"/>
    <line x1="248" y1="150" x2="244" y2="177" stroke="#e0f2fe" stroke-width="1.5" opacity="0.75"/>

    <!-- Timestamp T = 1.0s -->
    <text x="45" y="295" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">t = 1.0 s</text>
    <!-- Hammer hits floor first -->
    <rect x="135" y="275" width="22" height="12" rx="2" fill="#f1f5f9"/>
    <rect x="143" y="287" width="6" height="20" rx="1.5" fill="#fbbf24"/>
    <text x="146" y="324" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">Landed</text>

    <!-- Feather still drifting midway -->
    <path d="M250,210 c8,8 12,20 10,26 c-3,3 -10,0 -12,-6 c-2,-6 -1,-14 2,-20 z" fill="#38bdf8"/>
    <line x1="250" y1="210" x2="246" y2="237" stroke="#e0f2fe" stroke-width="2"/>
    <text x="250" y="258" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">Terminal Velocity</text>
    <text x="250" y="274" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle">(Drifting slowly)</text>
  </g>

  <!-- Key Concept Summary Cards -->
  <rect x="40" y="440" width="880" height="76" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <g transform="translate(60, 456)" font-family="Inter, system-ui, sans-serif">
    <!-- Point 1 -->
    <text x="0" y="18" font-size="12" font-weight="700" fill="#38bdf8">MASS CANCELS OUT: a = F/m = (mg)/m = g</text>
    <text x="0" y="36" font-size="11.5" font-weight="400" fill="#cbd5e1">Heavier objects feel more gravitational force, but have exactly proportionally more inertia.</text>

    <!-- Point 2 -->
    <text x="350" y="18" font-size="12" font-weight="700" fill="#fde047">APOLLO 15 MOON TEST (1971)</text>
    <text x="350" y="36" font-size="11.5" font-weight="400" fill="#cbd5e1">Commander David Scott dropped a 1.3 kg falcon feather &amp; aluminum hammer simultaneously on the Moon.</text>

    <!-- Point 3 -->
    <text x="650" y="18" font-size="12" font-weight="700" fill="#f43f5e">AIR RESISTANCE (DRAG)</text>
    <text x="650" y="36" font-size="11.5" font-weight="400" fill="#cbd5e1">Drag grows with v². When F_drag = F_gravity, acceleration stops (terminal velocity).</text>
  </g>
</svg>

