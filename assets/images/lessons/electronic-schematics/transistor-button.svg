<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" role="img" aria-labelledby="title desc"><title id="title">Pushbutton transistor LED driver</title><desc id="desc">B1+ → R1 → D1 anode; D1 cathode → Q1 collector. Q1 emitter → B1−. B1+ → SW1 → R2 → Q1 base; R3 joins the base to B1−.</desc><rect width="850" height="520" fill="#f5f9fc"/><g stroke="#17394e" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="25" y="33" font-size="23">Pushbutton transistor LED driver</text><path d="M70 80H600 M70 80V220 M70 265V430H600 M600 350V430"/><path d="M48 220H92 M58 235H82 M70 235V250 M48 250H92 M58 265H82"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="20" y="185" font-size="18">B1</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="20" y="205" font-size="16">4 × AA</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="85" y="226" font-size="18">+</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="85" y="266" font-size="18">−</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="300" y="64" font-size="18">+6 V</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="300" y="453" font-size="18">0 V / battery −</text><path d="M600 80v15 M600 155v15"/><rect x="590" y="95" width="20" height="60" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="620" y="128" font-size="16">R1 1 kΩ</text><path d="M600 170V185"/><path d="M600 185v15 M600 225v15 M587 225h26 M620 203l18-18 m-7 0h7v7 M627 216l18-18 m-7 0h7v7"/><path d="M587 200h26l-13 25z" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="650" y="215" font-size="16">D1 red LED</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="573" y="197" font-size="14">A</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="573" y="237" font-size="14">K</text><path d="M600 240V250"/><path d="M530 275V325 M530 285L600 250 M530 315L600 350"/><polygon points="600,350 581,345 589,332" fill="#17394e"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="615" y="285" font-size="18">Q1 2N3904</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="615" y="306" font-size="16">NPN</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="510" y="293" font-size="15">B</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="610" y="247" font-size="15">C</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="612" y="349" font-size="15">E</text><path d="M180 80V170 M180 210V300H285"/><path d="M180 170l-22 35"/><circle cx="180" cy="170" r="4" fill="#17394e"/><circle cx="180" cy="210" r="4" fill="#17394e"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="80" y="195" font-size="17">SW1</text><path d="M285 300h15 M360 300h15"/><rect x="300" y="290" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="285" y="277" font-size="16">R2 10 kΩ</text><path d="M375 300H530 M470 300V330"/><path d="M470 330v15 M470 405v15"/><rect x="460" y="345" width="20" height="60" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="490" y="378" font-size="16">R3 100 kΩ</text><path d="M470 420V430"/><circle cx="180" cy="80" r="4" fill="#17394e"/><circle cx="470" cy="300" r="4" fill="#17394e"/><circle cx="470" cy="430" r="4" fill="#17394e"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="25" y="490" font-size="16">Button → base current → collector path conducts → LED on.</text></g></svg>