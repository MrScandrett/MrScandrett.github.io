<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">Automatic model night-light</title><desc id="desc">A light-dependent resistor and a fixed resistor form a sensor divider. The Uno turns on an LED in darkness.</desc><rect width="820" height="440" fill="#f5f9fc"/><g fill="#17394e" font-family="Arial,sans-serif"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="28" y="35" font-size="23">Automatic model night-light</text></g><g stroke="#17394e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="35" y="90" width="170" height="275" rx="6" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="60" y="120" font-size="18">U1 Arduino Uno</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="60" y="148" font-size="16">USB powered</text><path d="M205 180H370 M430 180H530 M530 180H630 M730 180H770V310H205 M530 180V250H205"/><path d="M350 180h20 m60 0h20"/><rect x="370" y="170" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="365" y="156" font-size="16">LDR1 photoresistor</text><path d="M630 180h20 m60 0h20"/><rect x="650" y="170" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="645" y="156" font-size="16">R1 10 kΩ</text><circle cx="530" cy="180" r="4" fill="#17394e"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="155" y="170" font-size="16">5V</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="155" y="240" font-size="16">A0</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="145" y="300" font-size="16">GND</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="155" y="340" font-size="16">D9</text><path d="M205 350H330"/><path d="M330 350h20 m60 0h20"/><rect x="350" y="340" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="345" y="326" font-size="16">R2 330 Ω</text><path d="M430 350H520"/><path d="M520 350h15 m25 0h20 M560 337v26 M566 336l12-12 m-5 0h5v5 M575 344l12-12 m-5 0h5v5"/><path d="M535 337l25 13-25 13z" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="520" y="385" font-size="16">D1 red LED</text><path d="M580 350H730"/><path d="M730 350H770V310"/><path d="M410 125l-25 25 m0-7v7h7 M440 125l-25 25 m0-7v7h7"/><circle cx="770" cy="310" r="4" fill="#17394e"/></g><g fill="#526a78" font-family="Arial,sans-serif"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="28" y="421" font-size="15">Less light → higher LDR resistance → lower A0 voltage in this divider.</text></g></svg>