<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">Knob-controlled reading light</title><desc id="desc">A potentiometer supplies an analog input; the Uno changes LED brightness using pulse-width modulation.</desc><rect width="820" height="440" fill="#f5f9fc"/><g fill="#17394e" font-family="Arial,sans-serif"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="28" y="35" font-size="23">Knob-controlled reading light</text></g><g stroke="#17394e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="35" y="90" width="170" height="275" rx="6" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="60" y="120" font-size="18">U1 Arduino Uno</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="60" y="148" font-size="16">USB powered</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="155" y="185" font-size="16">5V</text><path d="M205 190H270V80H440 M440 80V100 M440 240V250 M440 270V310H270 M270 310H205 M495 170H570V260H205"/><rect x="427" y="100" width="26" height="140" fill="white"/><path d="M495 170l-55 0 m10-7-10 7 10 7"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="460" y="95" font-size="16">RV1 10 kΩ</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="495" y="155" font-size="16">wiper → A0</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="155" y="255" font-size="16">A0</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="150" y="303" font-size="16">GND</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="155" y="340" font-size="16">D9</text><path d="M205 350H330"/><path d="M330 350h20 m60 0h20"/><rect x="350" y="340" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="345" y="326" font-size="16">R1 330 Ω</text><path d="M430 350H520"/><path d="M520 350h15 m25 0h20 M560 337v26 M566 336l12-12 m-5 0h5v5 M575 344l12-12 m-5 0h5v5"/><path d="M535 337l25 13-25 13z" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="520" y="385" font-size="16">D1 red LED</text><path d="M580 350H730"/><path d="M730 350V310H270"/><path d="M440 250Q455 260 440 270"/><circle cx="440" cy="310" r="4" fill="#17394e"/></g><g fill="#526a78" font-family="Arial,sans-serif"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="28" y="421" font-size="15">RV1 is an input voltage divider. D9 is PWM, not a steady analog voltage.</text></g></svg>