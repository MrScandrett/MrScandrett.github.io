<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">Three-stage signal tower</title><desc id="desc">Three LEDs announce stop, wait, and go in sequence. Build a miniature crossing signal or a classroom activity timer.</desc><rect width="820" height="440" fill="#f5f9fc"/><g fill="#17394e" font-family="Arial,sans-serif"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="28" y="35" font-size="23">Three-stage signal tower</text></g><g stroke="#17394e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="35" y="90" width="170" height="240" rx="6" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="60" y="120" font-size="18">U1 Arduino Uno</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="60" y="148" font-size="16">USB powered</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="155" y="180" font-size="16">D8</text><path d="M205 190H330"/><path d="M330 190h20 m60 0h20"/><rect x="350" y="180" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="345" y="166" font-size="16">R1 330 Ω</text><path d="M430 190H520"/><path d="M520 190h15 m25 0h20 M560 177v26 M566 176l12-12 m-5 0h5v5 M575 184l12-12 m-5 0h5v5"/><path d="M535 177l25 13-25 13z" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="520" y="225" font-size="16">D1 red LED</text><path d="M580 190H730"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="155" y="250" font-size="16">D9</text><path d="M205 260H330"/><path d="M330 260h20 m60 0h20"/><rect x="350" y="250" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="345" y="236" font-size="16">R2 330 Ω</text><path d="M430 260H520"/><path d="M520 260h15 m25 0h20 M560 247v26 M566 246l12-12 m-5 0h5v5 M575 254l12-12 m-5 0h5v5"/><path d="M535 247l25 13-25 13z" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="520" y="295" font-size="16">D2 red LED</text><path d="M580 260H730"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="155" y="320" font-size="16">D10</text><path d="M205 330H330"/><path d="M330 330h20 m60 0h20"/><rect x="350" y="320" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="345" y="306" font-size="16">R3 330 Ω</text><path d="M430 330H520"/><path d="M520 330h15 m25 0h20 M560 317v26 M566 316l12-12 m-5 0h5v5 M575 324l12-12 m-5 0h5v5"/><path d="M535 317l25 13-25 13z" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="520" y="365" font-size="16">D3 red LED</text><path d="M580 330H730"/><path d="M730 190V350H240V340 M240 320V310H205"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="148" y="300" font-size="16">GND</text><path d="M240 320Q255 330 240 340"/><circle cx="730" cy="260" r="4" fill="#17394e"/><circle cx="730" cy="330" r="4" fill="#17394e"/></g><g fill="#526a78" font-family="Arial,sans-serif"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="28" y="421" font-size="15">Three outputs, three resistors, one shared ground return.</text></g></svg>