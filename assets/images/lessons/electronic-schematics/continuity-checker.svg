<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
<title id="title">Continuity checker schematic</title><desc id="desc">Two AA cells, a 220 ohm resistor, red LED, and two test probes in series. Touching the probes together closes the circuit.</desc>
<rect width="760" height="270" fill="#f5f9fc"/><g stroke="#17394e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M80 70H220 M275 70H400 M450 70H565 M645 70H680V205H80V140 M80 70V90 M80 120V140"/>
<path d="M80 90v12 M62 102h36 M70 114h20 M80 114v6"/><rect x="220" y="55" width="55" height="30" rx="2" fill="#fff"/>
<path d="M400 70h15 M430 54v32 M415 55l15 15-15 15z M430 70h20 M438 55l15-16 m-7 17 15-16 M565 70l23 12 M645 70l-23 12"/>
<circle cx="565" cy="70" r="4" fill="#17394e"/><circle cx="645" cy="70" r="4" fill="#17394e"/>
</g><g fill="#17394e" font-family="Arial,sans-serif" font-size="17" font-weight="700"><text x="40" y="40">B1  2 × AA ≈ 3 V</text><text x="215" y="117">R1  220 Ω</text><text x="395" y="117">D1 red LED</text><text x="550" y="117">P1      P2</text><text x="308" y="235">Battery − / return</text></g><text x="470" y="160" fill="#526a78" font-family="Arial,sans-serif" font-size="15">Test only unpowered parts.</text><text x="40" y="256" fill="#526a78" font-family="Arial,sans-serif" font-size="14">A conductor between P1 and P2 completes the loop; an open wire leaves D1 dark.</text>
</svg>
