<title id="title">Pocket light schematic</title><desc id="desc">Two AA cells in series supply three volts. A switch, 100 ohm resistor, and red LED form one series loop back to the battery.</desc>
<rect width="760" height="260" fill="#f5f9fc"/><g stroke="#17394e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M80 70H185 M245 70H350 M405 70H475 M525 70H655V195H80V140 M80 70V91 M80 121V140"/>
<path d="M80 91v12 M62 103h36 M70 115h20 M80 115v6"/><circle cx="185" cy="70" r="4" fill="#17394e"/><circle cx="245" cy="70" r="4" fill="#17394e"/><path d="M185 70l54-24"/><rect x="350" y="55" width="55" height="30" rx="2" fill="#fff"/>
<path d="M475 70h15 M505 54v32 M490 55l15 15-15 15z M505 70h20 M513 55l15-16 m-7 17 15-16"/>
</g><g fill="#17394e" font-family="Arial,sans-serif" font-size="17" font-weight="700"><text x="40" y="40">B1  2 × AA ≈ 3 V</text><text x="180" y="118">SW1</text><text x="350" y="118">R1  100 Ω</text><text x="465" y="118">D1 red LED</text><text x="305" y="223">Battery − / return</text><text x="94" y="100">+</text><text x="94" y="136">−</text></g><text x="40" y="244" fill="#526a78" font-family="Arial,sans-serif" font-size="14">LED anode faces the resistor; LED cathode (bar) faces battery negative.</text>
