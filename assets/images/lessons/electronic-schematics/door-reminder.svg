<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc">
<title id="title">Door-open reminder schematic</title><desc id="desc">An Arduino Uno powered by USB uses its internal pull-up on D2. A normally open reed switch closes from D2 to ground when the door magnet is near. D9 drives a 220 ohm resistor and LED to ground.</desc>
<rect width="820" height="330" fill="#f5f9fc"/>
<g stroke="#17394e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="65" y="55" width="250" height="240" rx="8" fill="#e5f0f4"/>
<path d="M315 125H430 M480 125H555 M585 125H670V280 M315 230H420 M480 230H550V280 M315 280H715"/>
<rect x="430" y="110" width="50" height="30" fill="#fff"/>
<path d="M555 125h10 M585 108v34 M565 109l20 16-20 16z M585 125h10 M594 108l15-15 m-7 17 15-15"/>
<circle cx="420" cy="230" r="4" fill="#17394e"/><circle cx="480" cy="230" r="4" fill="#17394e"/><path d="M420 230l54-23"/>
<circle cx="550" cy="280" r="5" fill="#17394e"/><circle cx="670" cy="280" r="5" fill="#17394e"/>
<path d="M700 280v16 m-13 0h26 m-20 7h14 m-8 7h2"/>
</g>
<g fill="#17394e" font-family="Arial,sans-serif" font-weight="700">
<text x="89" y="91" font-size="22">U1 Arduino Uno</text><text x="90" y="134" font-size="18">D9 → output</text><text x="90" y="238" font-size="18">D2 ← INPUT_PULLUP</text><text x="90" y="283" font-size="16">USB power + GND</text>
<text x="419" y="96" font-size="17">R1 220 Ω</text><text x="558" y="96" font-size="17">D1 LED</text><text x="406" y="267" font-size="16">SW1 NO reed</text><text x="675" y="252" font-size="16">GND</text>
</g>
<text x="55" y="322" fill="#526a78" font-family="Arial,sans-serif" font-size="14">Door closed: magnet closes SW1, D2 reads LOW. Door open: SW1 opens, D2 reads HIGH.</text>
</svg>
