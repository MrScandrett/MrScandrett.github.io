<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">Either-switch call light</title><desc id="desc">Either button can complete the circuit. Make a call light that can be operated from two desks.</desc><rect width="820" height="440" fill="#f5f9fc"/><g fill="#17394e" font-family="Arial,sans-serif"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="28" y="35" font-size="23">Either-switch call light</text></g><g stroke="#17394e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M90 110H180 M90 110V160 M90 205V300H710V110H660 M180 110V210 M260 110V210"/><path d="M180 110h15 m50 0h15 M195 110l45-18"/><circle cx="195" cy="110" r="3" fill="#17394e"/><circle cx="245" cy="110" r="3" fill="#17394e"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="185" y="142" font-size="16">SW1</text><path d="M180 210h15 m50 0h15 M195 210l45-18"/><circle cx="195" cy="210" r="3" fill="#17394e"/><circle cx="245" cy="210" r="3" fill="#17394e"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="185" y="242" font-size="16">SW2</text><circle cx="180" cy="110" r="4" fill="#17394e"/><circle cx="260" cy="110" r="4" fill="#17394e"/><path d="M260 110H320"/><path d="M320 110h20 m60 0h20"/><rect x="340" y="100" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="335" y="86" font-size="16">R1 100 Ω</text><path d="M420 110H540"/><path d="M540 110h15 m25 0h20 M580 97v26 M586 96l12-12 m-5 0h5v5 M595 104l12-12 m-5 0h5v5"/><path d="M555 97l25 13-25 13z" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="540" y="145" font-size="16">D1 red LED</text><path d="M600 110H660"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="30" y="85" font-size="18">B1 +3 V</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="30" y="325" font-size="18">B1 − / 0 V</text><path d="M68 160H112 M78 175H102 M90 175V190 M68 190H112 M78 205H102"/><text x="116" y="164" fill="#17394e" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="116" y="210" fill="#17394e" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text></g><g fill="#526a78" font-family="Arial,sans-serif"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="28" y="421" font-size="15">OR: SW1 and SW2 are parallel; R1 still limits all LED current.</text></g></svg>