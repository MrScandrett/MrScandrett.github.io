<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">Two-room model-house lighting</title><desc id="desc">Two independent branches light two rooms. Each LED gets its own current-limiting resistor.</desc><rect width="820" height="440" fill="#f5f9fc"/><g fill="#17394e" font-family="Arial,sans-serif"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="28" y="35" font-size="23">Two-room model-house lighting</text></g><g stroke="#17394e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M90 110H250 M90 110V160 M90 205V300H710V110H610 M250 110V210 M610 110V210"/><path d="M250 110h20 m60 0h20"/><rect x="270" y="100" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="265" y="86" font-size="16">R1 220 Ω</text><path d="M350 110H460"/><path d="M460 110h15 m25 0h20 M500 97v26 M506 96l12-12 m-5 0h5v5 M515 104l12-12 m-5 0h5v5"/><path d="M475 97l25 13-25 13z" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="460" y="145" font-size="16">D1 red</text><path d="M520 110H610"/><path d="M250 210h20 m60 0h20"/><rect x="270" y="200" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="265" y="186" font-size="16">R2 220 Ω</text><path d="M350 210H460"/><path d="M460 210h15 m25 0h20 M500 197v26 M506 196l12-12 m-5 0h5v5 M515 204l12-12 m-5 0h5v5"/><path d="M475 197l25 13-25 13z" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="460" y="245" font-size="16">D2 red</text><path d="M520 210H610"/><circle cx="250" cy="110" r="4" fill="#17394e"/><circle cx="610" cy="110" r="4" fill="#17394e"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="30" y="85" font-size="18">B1 +3 V</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="30" y="325" font-size="18">B1 − / 0 V</text><path d="M68 160H112 M78 175H102 M90 175V190 M68 190H112 M78 205H102"/><text x="116" y="164" fill="#17394e" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="116" y="210" fill="#17394e" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text></g><g fill="#526a78" font-family="Arial,sans-serif"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="28" y="421" font-size="15">Parallel branches share voltage. Each LED needs its own resistor.</text></g></svg>