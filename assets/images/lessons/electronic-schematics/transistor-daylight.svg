-family="Arial,sans-serif" x="573" y="237" font-size="14">K</text><path d="M600 240V250"/><path d="M530 275V325 M530 285L600 250 M530 315L600 350"/><polygon points="600,350 581,345 589,332" fill="#17394e"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="615" y="285" font-size="18">Q1 2N3904</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="615" y="306" font-size="16">NPN</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="510" y="293" font-size="15">B</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="610" y="247" font-size="15">C</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="612" y="349" font-size="15">E</text><path d="M180 80V110 M180 200V300H285 M180 300V330 M180 420V430"/><path d="M180 110v15 M180 185v15"/><rect x="170" y="125" width="20" height="60" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="200" y="158" font-size="16">LDR1</text><path d="M125 122l27 27 m-8 0h8v-8 M125 150l27 27 m-8 0h8v-8"/><path d="M180 330v15 M180 405v15"/><rect x="170" y="345" width="20" height="60" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="200" y="378" font-size="16">R2 10 kΩ</text><path d="M285 300h15 M360 300h15"/><rect x="300" y="290" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="285" y="277" font-size="16">R3 4.7 kΩ</text><path d="M375 300H530"/><circle cx="180" cy="80" r="4" fill="#17394e"/><circle cx="180" cy="300" r="4" fill="#17394e"/><circle cx="180" cy="430" r="4" fill="#17394e"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="195" y="280" font-size="16">SENSE</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="25" y="490" font-size="16">Light raises SENSE here: compare the LDR position with the night-light.</text></g></svg>