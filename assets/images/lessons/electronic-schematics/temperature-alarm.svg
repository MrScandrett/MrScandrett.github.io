<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
<title id="title">Filtered thermistor temperature alarm schematic</title><desc id="desc">The Uno five volt rail feeds a 10 kilohm resistor over a 10 kilohm NTC thermistor. The divider node connects through a one kilohm filter resistor to A0 with a 100 nanofarad capacitor to ground. D9 carries the DRIVE net label; a matching DRIVE label feeds a one kilohm resistor into the gate of a 2N7000 N-channel MOSFET, and a 100 kilohm resistor pulls the gate to ground. The MOSFET switches a five volt buzzer from the five volt rail. A flyback diode sits across the buzzer with its cathode at five volts, and a 100 nanofarad capacitor spans five volts and ground.</desc>
<rect width="980" height="520" fill="#f5f9fc"/>
<g stroke="#17394e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- U1 and its pins -->
  <rect x="35" y="90" width="195" height="365" rx="8" fill="#e5f0f4"/>
  <path d="M230 120H260V70 M230 430H260V450"/>
  <!-- rails -->
  <path d="M260 70H950 M260 450H950"/>
  <!-- A0 filter: A0 pin, C1, R2 -->
  <path d="M230 240H355 M400 240H420 M320 240V280 M320 292V450"/>
  <rect x="355" y="228" width="45" height="24" fill="#fff"/>
  <path d="M300 280H340 M300 292H340"/>
  <!-- divider: R1 over TH1 -->
  <path d="M420 70V110 M420 160V300 M420 350V450"/>
  <rect x="408" y="110" width="24" height="50" fill="#fff"/>
  <rect x="408" y="300" width="24" height="50" fill="#fff"/>
  <path d="M396 360L444 290H458"/>
  <!-- DRIVE net labels -->
  <path d="M230 330H238"/>
  <path d="M238 318H283L296 330L283 342H238Z" fill="#dcecf1"/>
  <path d="M543 348H598V372H543L530 360Z" fill="#dcecf1"/>
  <!-- R3 to gate, R4 pull-down -->
  <path d="M598 360H612 M657 360H735 M690 360V385 M690 425V450"/>
  <rect x="612" y="348" width="45" height="24" fill="#fff"/>
  <rect x="678" y="385" width="24" height="40" fill="#fff"/>
  <!-- Q1 N-channel enhancement MOSFET -->
  <path d="M735 340V380"/>
  <path d="M746 334V347 M746 354V366 M746 373V386"/>
  <path d="M746 340H775V300 M746 380H775V450 M746 360H775V380"/>
  <path d="M750 360L762 354V366Z" fill="#17394e"/>
  <!-- BZ1 buzzer between +5 V and drain -->
  <path d="M775 70V170 M775 220V300"/>
  <rect x="752" y="170" width="46" height="50" rx="4" fill="#fff"/>
  <path d="M762 186H772 M767 181V191"/>
  <path d="M760 210Q775 198 790 210"/>
  <!-- D1 flyback across buzzer, cathode toward +5 V -->
  <path d="M775 120H860V180 M860 210V260H775"/>
  <path d="M845 210H875L860 182Z" fill="#fff"/>
  <path d="M845 180H875"/>
  <!-- C2 bypass -->
  <path d="M950 70V250 M950 262V450 M930 250H970 M930 262H970"/>
  <!-- ground symbol on the return rail -->
  <path d="M520 450V470 M502 470H538 M509 478H531 M516 486H524"/>
  <!-- junction dots -->
  <g fill="#17394e" stroke="none">
    <circle cx="320" cy="240" r="5"/><circle cx="420" cy="240" r="5"/><circle cx="690" cy="360" r="5"/>
    <circle cx="775" cy="120" r="5"/><circle cx="775" cy="260" r="5"/><circle cx="420" cy="70" r="5"/>
    <circle cx="775" cy="70" r="5"/><circle cx="320" cy="450" r="5"/><circle cx="420" cy="450" r="5"/>
    <circle cx="690" cy="450" r="5"/><circle cx="775" cy="450" r="5"/><circle cx="520" cy="450" r="5"/>
  </g>
</g>
<g fill="#17394e" font-family="Arial,sans-serif" font-weight="700">
  <text x="48" y="80" font-size="20">U1 Arduino Uno</text>
  <text x="200" y="126" font-size="16" text-anchor="end">5V</text><text x="200" y="246" font-size="16" text-anchor="end">A0</text>
  <text x="200" y="336" font-size="16" text-anchor="end">D9</text><text x="200" y="436" font-size="16" text-anchor="end">GND</text>
  <text x="262" y="335" font-size="12" text-anchor="middle">DRIVE</text><text x="568" y="365" font-size="12" text-anchor="middle">DRIVE</text>
  <text x="378" y="218" font-size="15" text-anchor="middle">R2 1 kΩ</text>
  <text x="348" y="284" font-size="15">C1</text><text x="348" y="301" font-size="13">100 nF</text>
  <text x="446" y="132" font-size="15">R1 10 kΩ</text><text x="446" y="150" font-size="13">fixed</text>
  <text x="464" y="296" font-size="15">−t°</text>
  <text x="446" y="330" font-size="15">TH1 10 kΩ</text><text x="446" y="348" font-size="13">NTC, B ≈ 3950</text>
  <text x="634" y="338" font-size="15" text-anchor="middle">R3 1 kΩ</text>
  <text x="668" y="403" font-size="15" text-anchor="end">R4</text><text x="668" y="420" font-size="13" text-anchor="end">100 kΩ</text>
  <text x="724" y="356" font-size="13" text-anchor="end">G</text><text x="784" y="318" font-size="13">D</text><text x="784" y="420" font-size="13">S</text>
  <text x="800" y="352" font-size="15">Q1</text><text x="800" y="370" font-size="13">2N7000</text>
  <text x="702" y="200" font-size="15" text-anchor="end">BZ1</text><text x="702" y="216" font-size="12" text-anchor="end">5 V active</text>
  <text x="884" y="196" font-size="15">D1</text><text x="884" y="212" font-size="12">1N4148</text>
  <text x="940" y="292" font-size="15" text-anchor="end">C2</text><text x="940" y="308" font-size="12" text-anchor="end">100 nF</text>
  <text x="560" y="58" font-size="17">+5 V rail</text><text x="560" y="440" font-size="17">GND rail</text>
</g>
<text x="35" y="508" fill="#526a78" font-family="Arial,sans-serif" font-size="13">Matching DRIVE labels join D9 to R3 with no drawn wire. D1's bar (cathode) faces +5 V. Check your MOSFET's G-D-S pin order in its datasheet.</text>
</svg>
