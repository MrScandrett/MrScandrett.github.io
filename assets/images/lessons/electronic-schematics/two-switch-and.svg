<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="title desc"><title id="title">Two-switch permission light</title><desc id="desc">The LED lights only when both switches are closed. Model two people giving permission for a classroom display.</desc><rect width="820" height="440" fill="#f5f9fc"/><g fill="#17394e" font-family="Arial,sans-serif"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="28" y="35" font-size="23">Two-switch permission light</text></g><g stroke="#17394e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M90 100H180 M90 100V160 M90 205V290H710V100H660"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="32" y="92" font-size="18">B1 +3 V</text><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="32" y="315" font-size="18">B1 − / 0 V</text><path d="M180 100h15 m50 0h15 M195 100l45-18"/><circle cx="195" cy="100" r="3" fill="#17394e"/><circle cx="245" cy="100" r="3" fill="#17394e"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="185" y="132" font-size="16">SW1</text><path d="M260 100h15 m50 0h15 M275 100l45-18"/><circle cx="275" cy="100" r="3" fill="#17394e"/><circle cx="325" cy="100" r="3" fill="#17394e"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="265" y="132" font-size="16">SW2</text><path d="M320 100h20 m60 0h20"/><rect x="340" y="90" width="60" height="20" fill="white"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="350" y="76" font-size="16">R1 100 Ω</text><path d="M420 100H540"/><path d="M540 100h15 m25 0h20 M580 87v26 M586 86l12-12 m-5 0h5v5 M595 94l12-12 m-5 0h5v5"/><path d="M555 87l25 13-25 13z" fill="#e8f0f5"/><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="540" y="135" font-size="16">D1 red LED</text><path d="M600 100H660"/><path d="M68 160H112 M78 175H102 M90 175V190 M68 190H112 M78 205H102"/><text x="116" y="164" fill="#17394e" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="116" y="210" fill="#17394e" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text></g><g fill="#526a78" font-family="Arial,sans-serif"><text fill="#17394e" stroke="none" font-family="Arial,sans-serif" x="28" y="421" font-size="15">AND: SW1 and SW2 must both close. Cathode bar faces the return.</text></g></svg>