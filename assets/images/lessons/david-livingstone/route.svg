<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" overflow="hidden" role="img" aria-labelledby="dl-title dl-desc">
  <title id="dl-title">David Livingstone: African Journeys and Watersheds (1841–1873)</title>
  <desc id="dl-desc">Map of southern and central Africa showing Livingstone's transcontinental journeys, Victoria Falls, the Zambezi, Great Lakes, Nyangwe, and Chuma and Susi's memorial trek to the coast.</desc>
  <rect width="1000" height="640" fill="#0c2440"/>
  <!-- Graticule lines -->
  <path d="M100,0V640 M300,0V640 M500,0V640 M700,0V640 M900,0V640 M0,160H1000 M0,320H1000 M0,480H1000" stroke="#1c3d5a" stroke-width="1" stroke-dasharray="4 6" fill="none"/>
  <!-- Equator & Tropics labels -->
  <text x="20" y="155" fill="#5b8296" font-family="system-ui,sans-serif" font-size="12">0° Equator</text>
  <text x="20" y="475" fill="#5b8296" font-family="system-ui,sans-serif" font-size="12">Tropic of Capricorn (23.5° S)</text>
  <!-- Stylized Africa Continental Coastline -->
  <path d="M220,40 Q180,90 140,160 Q110,210 130,280 Q150,330 180,390 Q210,440 230,510 Q260,580 320,620 Q360,635 410,620 Q480,590 530,530 Q580,470 630,410 Q680,350 710,290 Q750,230 790,160 Q820,110 800,70 L760,40 Z" fill="#163228" stroke="#2a5a48" stroke-width="2"/>
  <!-- Atlantic and Indian Oceans -->
  <text x="60" y="420" fill="#36648b" font-family="system-ui,sans-serif" font-size="18" font-weight="bold" letter-spacing="2">ATLANTIC OCEAN</text>
  <text x="740" y="450" fill="#36648b" font-family="system-ui,sans-serif" font-size="18" font-weight="bold" letter-spacing="2">INDIAN OCEAN</text>
  <!-- Major Lakes -->
  <!-- Lake Victoria -->
  <path d="M570,180 C585,170 605,175 615,190 C620,210 595,225 580,220 C565,215 560,195 570,180 Z" fill="#0c2440" stroke="#4ba3c7" stroke-width="1.5"/>
  <text x="625" y="195" fill="#7dc4e0" font-family="system-ui,sans-serif" font-size="12">L. Victoria</text>
  <!-- Lake Tanganyika -->
  <path d="M510,240 C520,260 535,320 545,360 C535,365 525,325 515,260 Z" fill="#0c2440" stroke="#4ba3c7" stroke-width="1.5"/>
  <text x="440" y="300" fill="#7dc4e0" font-family="system-ui,sans-serif" font-size="12">L. Tanganyika</text>
  <!-- Lake Malawi (Nyasa) -->
  <path d="M575,370 C585,400 590,440 590,460 C580,455 575,415 570,380 Z" fill="#0c2440" stroke="#4ba3c7" stroke-width="1.5"/>
  <text x="600" y="420" fill="#7dc4e0" font-family="system-ui,sans-serif" font-size="12">L. Malawi (Nyasa)</text>
  <!-- Lake Bangweulu -->
  <circle cx="495" cy="395" r="12" fill="#0c2440" stroke="#4ba3c7" stroke-width="1.5"/>
  <text x="425" y="415" fill="#7dc4e0" font-family="system-ui,sans-serif" font-size="11">L. Bangweulu</text>
  <!-- River Networks -->
  <!-- Zambezi River (entering Indian Ocean at Quelimane) -->
  <path d="M390,370 Q430,360 410,400 T440,430 T510,445 T580,465 T640,460 T670,480" fill="none" stroke="#3898b3" stroke-width="2.5" stroke-linecap="round"/>
  <text x="500" y="460" fill="#7dc4e0" font-family="system-ui,sans-serif" font-size="13" font-style="italic">Zambezi River</text>
  <!-- Lualaba (Upper Congo) River flowing North -->
  <path d="M460,370 Q450,310 440,240 Q430,190 400,160" fill="none" stroke="#3898b3" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="380" y="225" fill="#7dc4e0" font-family="system-ui,sans-serif" font-size="12" font-style="italic">Lualaba (Congo)</text>
  <!-- Shire River -->
  <path d="M585,455 Q595,475 620,470" fill="none" stroke="#3898b3" stroke-width="1.5"/>
  <!-- Livingstone Route 1: Coast-to-Coast (1852–1856) -->
  <!-- Cape Town/Kuruman -> Sesheke/Victoria Falls -> Luanda (West) -> back across to Quelimane (East) -->
  <path d="M340,580 L360,520 L380,480 L440,430 L350,380 L250,330 L195,300" fill="none" stroke="#e5a93c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M195,300 L250,330 L350,380 L440,430 L510,445 L580,465 L665,475" fill="none" stroke="#e5a93c" stroke-width="3" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Route 2: Central Lakes and Nile search (1866–1873) -->
  <path d="M685,380 L590,375 L530,330 L520,270 L450,250 L520,270 L515,350 L495,395" fill="none" stroke="#e05a47" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Route 3: Chuma & Susi 1,500-mile memorial transport of remains & journals (1873) -->
  <path d="M495,395 Q560,370 610,340 Q650,320 680,310" fill="none" stroke="#9be382" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
  <!-- Waypoint Markers -->
  <!-- Luanda -->
  <circle cx="195" cy="300" r="5" fill="#e5a93c" stroke="#fff" stroke-width="1.5"/>
  <text x="130" y="295" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">Luanda (1854)</text>
  <!-- Victoria Falls / Mosi-oa-Tunya -->
  <circle cx="440" cy="430" r="6" fill="#e5a93c" stroke="#fff" stroke-width="2"/>
  <text x="380" y="450" fill="#ffe699" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">Mosi-oa-Tunya (Victoria Falls, 1855)</text>
  <!-- Quelimane -->
  <circle cx="665" cy="475" r="5" fill="#e5a93c" stroke="#fff" stroke-width="1.5"/>
  <text x="675" y="480" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">Quelimane (1856)</text>
  <!-- Ujiji -->
  <circle cx="520" cy="270" r="6" fill="#e05a47" stroke="#fff" stroke-width="2"/>
  <text x="532" y="270" fill="#ffb3a7" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">Ujiji (Stanley meeting, 1871)</text>
  <!-- Nyangwe -->
  <circle cx="450" cy="250" r="5" fill="#e05a47" stroke="#fff" stroke-width="1.5"/>
  <text x="355" y="255" fill="#ffb3a7" font-family="system-ui,sans-serif" font-size="12" font-weight="bold">Nyangwe (1871)</text>
  <!-- Chitambo's Village (Death) -->
  <circle cx="495" cy="395" r="6" fill="#9be382" stroke="#fff" stroke-width="2"/>
  <text x="420" y="385" fill="#b8f5a4" font-family="system-ui,sans-serif" font-size="12" font-weight="bold">Chitambo (1873)</text>
  <!-- Bagamoyo / Zanzibar -->
  <circle cx="680" cy="310" r="6" fill="#9be382" stroke="#fff" stroke-width="2"/>
  <text x="692" y="315" fill="#b8f5a4" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">Bagamoyo (Coast arrival 1874)</text>
  <!-- Cape Town / Kuruman -->
  <circle cx="340" cy="580" r="5" fill="#e5a93c" stroke="#fff" stroke-width="1.5"/>
  <text x="260" y="595" fill="#fff" font-family="system-ui,sans-serif" font-size="12">Kuruman / Cape Town</text>
  <!-- Legend Banner -->
  <rect x="24" y="24" width="360" height="120" rx="6" fill="#071626" stroke="#244b43" stroke-width="1.5"/>
  <text x="40" y="48" fill="#fff" font-family="system-ui,sans-serif" font-size="15" font-weight="bold">David Livingstone: African Expeditions</text>
  <line x1="40" y1="68" x2="70" y2="68" stroke="#e5a93c" stroke-width="3"/>
  <text x="80" y="72" fill="#e1e7ec" font-family="system-ui,sans-serif" font-size="12">1852–1856: Coast-to-Coast Transcontinental</text>
  <line x1="40" y1="90" x2="70" y2="90" stroke="#e05a47" stroke-width="2.5"/>
  <text x="80" y="94" fill="#e1e7ec" font-family="system-ui,sans-serif" font-size="12">1866–1873: Central Lakes & Watershed</text>
  <line x1="40" y1="112" x2="70" y2="112" stroke="#9be382" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="80" y="116" fill="#e1e7ec" font-family="system-ui,sans-serif" font-size="12">1873–1874: Chuma & Susi's 1,500-mile trek</text>
</svg>