<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="ev-pyr-title ev-pyr-desc">
  <title id="ev-pyr-title">Hierarchy of Evidence Strength and Occam's Razor</title>
  <desc id="ev-pyr-desc">Four-tier pyramid ranking evidence from weak single anecdotes at the bottom through observational patterns and controlled trials up to independent replication at the top, paired with an Occam's Razor comparison box.</desc>
  <rect width="860" height="320" rx="16" fill="#fffaf0" stroke="#c6aa77" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#2f2a22" />
  <text x="38" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fff0c9">EVIDENCE LADDER · STRONGER CLAIMS NEED STRONGER EVIDENCE</text>

  <!-- Pyramid Tiers -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <!-- Top: Independent Replication -->
    <polygon points="270,74 370,122 170,122" fill="#0d7a72" stroke="#075d57" stroke-width="1.8" />
    <text x="270" y="113" font-size="10.5" font-weight="800" fill="#ffffff">INDEPENDENT REPLICATION</text>

    <!-- Tier 2: Controlled Testing -->
    <polygon points="164,128 376,128 416,174 124,174" fill="#2563eb" stroke="#1e40af" stroke-width="1.8" />
    <text x="270" y="149" font-size="11.5" font-weight="800" fill="#ffffff">CONTROLLED EXPERIMENTS</text>
    <text x="270" y="165" font-size="10" fill="#dbeafe">Blinded groups · measured hits &amp; misses</text>

    <!-- Tier 3: Systematic Observation -->
    <polygon points="118,180 422,180 462,226 78,226" fill="#d97706" stroke="#92400e" stroke-width="1.8" />
    <text x="270" y="201" font-size="11.5" font-weight="800" fill="#ffffff">SYSTEMATIC RECORDS &amp; ARCHIVES</text>
    <text x="270" y="217" font-size="10" fill="#fef3c7">Primary documents · full before/after counts</text>

    <!-- Base: Single Anecdote -->
    <polygon points="72,232 468,232 508,280 32,280" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8" />
    <text x="270" y="254" font-size="11.5" font-weight="800" fill="#991b1b">ANECDOTES &amp; UNCHECKED RUMORS</text>
    <text x="270" y="270" font-size="10" fill="#7f1d1d">“It worked for my cousin” · Starting clue only, never final proof</text>
  </g>

  <!-- Right Panel: Occam's Razor -->
  <rect x="526" y="74" width="310" height="206" rx="12" fill="#ffffff" stroke="#0d7a72" stroke-width="2" />
  <text x="544" y="100" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#075d57">OCCAM'S RAZOR</text>
  <text x="544" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#5f574c">William of Ockham (c. 1287–1347)</text>

  <rect x="544" y="132" width="274" height="58" rx="8" fill="#eaf6f2" stroke="#0d7a72" stroke-width="1.2" />
  <text x="556" y="152" font-size="11" font-weight="800" fill="#075d57">Explanation A (Fewest leaps)</text>
  <text x="556" y="169" font-size="10.5" fill="#2f2a22">Matches facts using mechanisms we</text>
  <text x="556" y="183" font-size="10.5" fill="#2f2a22">can already observe and test first.</text>

  <rect x="544" y="198" width="274" height="68" rx="8" fill="#fff0f0" stroke="#dc2626" stroke-width="1.2" />
  <text x="556" y="218" font-size="11" font-weight="800" fill="#991b1b">Explanation B (Extra assumptions)</text>
  <text x="556" y="235" font-size="10.5" fill="#2f2a22">Requires secret conspiracies or invisible</text>
  <text x="556" y="249" font-size="10.5" fill="#2f2a22">forces that never appear under controlled</text>
  <text x="556" y="263" font-size="10.5" fill="#2f2a22">checks.</text>

  <text x="32" y="304" font-family="system-ui, sans-serif" font-size="11.5" fill="#5f574c">Occam's Razor does not guarantee the simpler story is right—it tells us which hypothesis to test thoroughly first.</text>
</svg>