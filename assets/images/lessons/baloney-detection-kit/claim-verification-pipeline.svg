<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="bdk-pipe-title bdk-pipe-desc">
  <title id="bdk-pipe-title">Claim Verification Pipeline: Pause, Check, Decide</title>
  <desc id="bdk-pipe-desc">Five-step critical-thinking workflow inspired by Carl Sagan's Baloney Detection Kit: 1. Isolate the Claim, 2. Trace the Original Source, 3. Check Independent Replication and Measurement, 4. Apply Occam's Razor and Falsifiability, 5. Hold Provisional Confidence before sharing.</desc>
  <defs>
    <marker id="bdk-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9a6500" />
    </marker>
  </defs>
  <rect width="860" height="280" rx="16" fill="#fffaf0" stroke="#c6aa77" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#2f2a22" />
  <text x="38" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fff0c9">BALONEY DETECTION WORKFLOW · HOW TO TEST A CLAIM BEFORE YOU SHARE</text>

  <g font-family="system-ui, sans-serif">
    <!-- Step 1 -->
    <rect x="22" y="74" width="144" height="148" rx="10" fill="#ffffff" stroke="#9a6500" stroke-width="2" />
    <text x="34" y="96" font-size="11" font-weight="800" fill="#9a6500">1. ISOLATE CLAIM</text>
    <text x="34" y="118" font-size="11.5" font-weight="700" fill="#2f2a22">What exactly is</text>
    <text x="34" y="134" font-size="11.5" font-weight="700" fill="#2f2a22">being asserted?</text>
    <text x="34" y="160" font-size="10.5" fill="#5f574c">Separate observable</text>
    <text x="34" y="176" font-size="10.5" fill="#5f574c">facts from scary or</text>
    <text x="34" y="192" font-size="10.5" fill="#5f574c">exciting headlines.</text>
    <line x1="168" y1="148" x2="188" y2="148" stroke="#9a6500" stroke-width="2.2" marker-end="url(#bdk-arrow)" />

    <!-- Step 2 -->
    <rect x="192" y="74" width="144" height="148" rx="10" fill="#ffffff" stroke="#0d7a72" stroke-width="2" />
    <text x="204" y="96" font-size="11" font-weight="800" fill="#0d7a72">2. TRACE SOURCE</text>
    <text x="204" y="118" font-size="11.5" font-weight="700" fill="#2f2a22">Who says so, and</text>
    <text x="204" y="134" font-size="11.5" font-weight="700" fill="#2f2a22">where did it start?</text>
    <text x="204" y="160" font-size="10.5" fill="#5f574c">100 reposts of one</text>
    <text x="204" y="176" font-size="10.5" fill="#5f574c">rumor still equal</text>
    <text x="204" y="192" font-size="10.5" fill="#5f574c">only ONE source.</text>
    <line x1="338" y1="148" x2="358" y2="148" stroke="#9a6500" stroke-width="2.2" marker-end="url(#bdk-arrow)" />

    <!-- Step 3 -->
    <rect x="362" y="74" width="144" height="148" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="374" y="96" font-size="11" font-weight="800" fill="#1d4ed8">3. CHECK DATA</text>
    <text x="374" y="118" font-size="11.5" font-weight="700" fill="#2f2a22">Can strangers</text>
    <text x="374" y="134" font-size="11.5" font-weight="700" fill="#2f2a22">measure &amp; repeat?</text>
    <text x="374" y="160" font-size="10.5" fill="#5f574c">Count both the hits</text>
    <text x="374" y="176" font-size="10.5" fill="#5f574c">and misses—not just</text>
    <text x="374" y="192" font-size="10.5" fill="#5f574c">hand-picked stories.</text>
    <line x1="508" y1="148" x2="528" y2="148" stroke="#9a6500" stroke-width="2.2" marker-end="url(#bdk-arrow)" />

    <!-- Step 4 -->
    <rect x="532" y="74" width="144" height="148" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
    <text x="544" y="96" font-size="11" font-weight="800" fill="#6d28d9">4. TEST RIVALS</text>
    <text x="544" y="118" font-size="11.5" font-weight="700" fill="#2f2a22">What else could</text>
    <text x="544" y="134" font-size="11.5" font-weight="700" fill="#2f2a22">explain the result?</text>
    <text x="544" y="160" font-size="10.5" fill="#5f574c">Ask what evidence</text>
    <text x="544" y="176" font-size="10.5" fill="#5f574c">would prove it wrong</text>
    <text x="544" y="192" font-size="10.5" fill="#5f574c">(falsifiability test).</text>
    <line x1="678" y1="148" x2="698" y2="148" stroke="#9a6500" stroke-width="2.2" marker-end="url(#bdk-arrow)" />

    <!-- Step 5 -->
    <rect x="702" y="74" width="136" height="148" rx="10" fill="#eaf6f2" stroke="#0d7a72" stroke-width="2.2" />
    <text x="714" y="96" font-size="11" font-weight="800" fill="#075d57">5. DECIDE</text>
    <text x="714" y="118" font-size="11.5" font-weight="700" fill="#0b514d">Match certainty</text>
    <text x="714" y="134" font-size="11.5" font-weight="700" fill="#0b514d">to the evidence.</text>
    <text x="714" y="160" font-size="10.5" fill="#075d57">Pause sharing if</text>
    <text x="714" y="176" font-size="10.5" fill="#075d57">checks fail; keep an</text>
    <text x="714" y="192" font-size="10.5" fill="#075d57">open, curious mind.</text>
  </g>

  <text x="24" y="254" font-family="system-ui, sans-serif" font-size="12" fill="#5f574c">Golden rule: Extraordinary or urgent claims need proportionally stronger, independent evidence before you pass them on.</text>
</svg>