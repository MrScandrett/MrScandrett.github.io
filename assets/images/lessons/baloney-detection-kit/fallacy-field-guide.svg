<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="fallacy-guide-title fallacy-guide-desc">
  <title id="fallacy-guide-title">Field Guide to Eight Common Reasoning Traps and Fallacies</title>
  <desc id="fallacy-guide-desc">Eight-card visual field guide illustrating Confirmation Bias, Anecdote vs. Data, Appeal to Authority, False Dilemma, Cherry-Picking, Bandwagon Effect, Unfalsifiable Shield, and Correlation vs. Causation.</desc>
  <rect width="860" height="360" rx="16" fill="#fffaf0" stroke="#c6aa77" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#2f2a22" />
  <text x="38" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fff0c9">FIELD GUIDE · EIGHT THINKING TRAPS TO SPOT IN THE WILD</text>

  <g font-family="system-ui, sans-serif">
    <!-- Row 1 -->
    <rect x="24" y="70" width="194" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6" />
    <text x="38" y="92" font-size="12" font-weight="800" fill="#92400e">1. Confirmation Bias</text>
    <circle cx="56" cy="118" r="10" fill="#0d7a72" /><circle cx="82" cy="118" r="10" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="2 2" />
    <text x="102" y="122" font-size="10.5" font-weight="700" fill="#0d7a72">Keep</text>
    <text x="140" y="122" font-size="10.5" fill="#94a3b8">Ignore</text>
    <text x="38" y="148" font-size="10.5" fill="#5f574c">Noticing clues that agree</text>
    <text x="38" y="164" font-size="10.5" fill="#5f574c">with us while overlooking</text>
    <text x="38" y="180" font-size="10.5" fill="#5f574c">ones that don't.</text>

    <rect x="230" y="70" width="194" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" />
    <text x="244" y="92" font-size="12" font-weight="800" fill="#1e40af">2. Anecdote ≠ Data</text>
    <rect x="244" y="108" width="14" height="18" rx="3" fill="#2563eb" />
    <text x="266" y="121" font-size="10.5" font-weight="700" fill="#1e40af">1 story vs. 1,000 cases</text>
    <text x="244" y="148" font-size="10.5" fill="#5f574c">A personal story matters,</text>
    <text x="244" y="164" font-size="10.5" fill="#5f574c">but cannot show how</text>
    <text x="244" y="180" font-size="10.5" fill="#5f574c">often something works.</text>

    <rect x="436" y="70" width="194" height="120" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6" />
    <text x="450" y="92" font-size="12" font-weight="800" fill="#6d28d9">3. Authority Shield</text>
    <polygon points="462,107 474,113 472,126 462,131 452,126 450,113" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" />
    <text x="484" y="122" font-size="10.5" font-weight="700" fill="#6d28d9">“Trust the title”</text>
    <text x="450" y="148" font-size="10.5" fill="#5f574c">Real experts invite tests;</text>
    <text x="450" y="164" font-size="10.5" fill="#5f574c">shielded jargon shuts</text>
    <text x="450" y="180" font-size="10.5" fill="#5f574c">down honest questions.</text>

    <rect x="642" y="70" width="194" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6" />
    <text x="656" y="92" font-size="12" font-weight="800" fill="#991b1b">4. False Dilemma</text>
    <rect x="656" y="108" width="44" height="18" rx="4" fill="#fee2e2" stroke="#dc2626" /><text x="678" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">A</text>
    <rect x="708" y="108" width="44" height="18" rx="4" fill="#fee2e2" stroke="#dc2626" /><text x="730" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">B</text>
    <rect x="760" y="108" width="58" height="18" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3 2" /><text x="789" y="121" text-anchor="middle" font-size="10" fill="#475569">C, D?</text>
    <text x="656" y="148" font-size="10.5" fill="#5f574c">Forcing an “either/or”</text>
    <text x="656" y="164" font-size="10.5" fill="#5f574c">choice while hiding</text>
    <text x="656" y="180" font-size="10.5" fill="#5f574c">other real possibilities.</text>

    <!-- Row 2 -->
    <rect x="24" y="204" width="194" height="120" rx="10" fill="#ffffff" stroke="#0d7a72" stroke-width="1.6" />
    <text x="38" y="226" font-size="12" font-weight="800" fill="#075d57">5. Cherry-Picking</text>
    <circle cx="50" cy="252" r="5" fill="#16a34a" /><circle cx="66" cy="252" r="5" fill="#cbd5e1" /><circle cx="82" cy="252" r="5" fill="#cbd5e1" /><circle cx="98" cy="252" r="5" fill="#16a34a" /><circle cx="114" cy="252" r="5" fill="#cbd5e1" />
    <text x="38" y="282" font-size="10.5" fill="#5f574c">Showing only the hits</text>
    <text x="38" y="298" font-size="10.5" fill="#5f574c">while hiding every failed</text>
    <text x="38" y="314" font-size="10.5" fill="#5f574c">prediction or trial.</text>

    <rect x="230" y="204" width="194" height="120" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.6" />
    <text x="244" y="226" font-size="12" font-weight="800" fill="#92400e">6. Bandwagon Trap</text>
    <text x="244" y="255" font-size="11" font-weight="700" fill="#b45309">100K Likes ≠ Proof</text>
    <text x="244" y="282" font-size="10.5" fill="#5f574c">Treating viral popularity</text>
    <text x="244" y="298" font-size="10.5" fill="#5f574c">as evidence when everyone</text>
    <text x="244" y="314" font-size="10.5" fill="#5f574c">copies the same rumor.</text>

    <rect x="436" y="204" width="194" height="120" rx="10" fill="#ffffff" stroke="#991b1b" stroke-width="1.6" />
    <text x="450" y="226" font-size="12" font-weight="800" fill="#991b1b">7. Unfalsifiable Loop</text>
    <text x="450" y="255" font-size="11" font-weight="700" fill="#b91c1c">“Failure proves it too!”</text>
    <text x="450" y="282" font-size="10.5" fill="#5f574c">A claim built so no test</text>
    <text x="450" y="298" font-size="10.5" fill="#5f574c">could ever prove it false</text>
    <text x="450" y="314" font-size="10.5" fill="#5f574c">cannot be verified.</text>

    <rect x="642" y="204" width="194" height="120" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6" />
    <text x="656" y="226" font-size="12" font-weight="800" fill="#0f766e">8. Coincidence vs. Cause</text>
    <text x="656" y="255" font-size="11" font-weight="700" fill="#0f766e">A before B  ≠  A caused B</text>
    <text x="656" y="282" font-size="10.5" fill="#5f574c">Two events happening</text>
    <text x="656" y="298" font-size="10.5" fill="#5f574c">near each other don't</text>
    <text x="656" y="314" font-size="10.5" fill="#5f574c">prove one caused the other.</text>
  </g>
</svg>