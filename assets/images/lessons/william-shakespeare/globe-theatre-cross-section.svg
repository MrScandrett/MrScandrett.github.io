<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="globe-title globe-desc">
  <title id="globe-title">Cutaway Architecture of the 1599 Globe Theatre</title>
  <desc id="globe-desc">Architectural cross-section of Shakespeare's 1599 Globe Theatre labeling the open daylight sky, thatch galleries (3 tiers), tiring-house balcony, heavens painted canopy above the thrust stage, trapdoor hell below, and the standing groundlings' yard.</desc>
  <rect width="860" height="360" rx="16" fill="#fffaf0" stroke="#d6c3aa" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#603148" />
  <text x="38" y="40" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fde68a">THE 1599 GLOBE THEATRE · DAYLIGHT OPEN-AIR PLAYHOUSE</text>

  <!-- Daylight Sky Opening -->
  <rect x="190" y="64" width="370" height="58" rx="8" fill="#e0f2fe" stroke="#7dd3fc" stroke-dasharray="4 3" />
  <text x="375" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#0369a1">OPEN DAYLIGHT SKY (No electric lights · 2 PM shows)</text>

  <!-- Left 3-Tier Gallery Wall -->
  <polygon points="48,90 190,104 190,126 48,116" fill="#b45309" stroke="#78350f" stroke-width="1.6" />
  <rect x="64" y="116" width="126" height="174" fill="#fef3c7" stroke="#78350f" stroke-width="2" />
  <line x1="64" y1="174" x2="190" y2="174" stroke="#78350f" stroke-width="2" />
  <line x1="64" y1="232" x2="190" y2="232" stroke="#78350f" stroke-width="2" />
  <text x="127" y="149" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7c2d12">Upper Gallery</text>
  <text x="127" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7c2d12">Middle Gallery</text>
  <text x="127" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7c2d12">Lower Gallery</text>

  <!-- Tiring House & Heavens Canopy (Right) -->
  <polygon points="365,126 575,92 595,118 365,146" fill="#92400e" stroke="#451a03" stroke-width="1.8" />
  <rect x="374" y="138" width="176" height="22" fill="#1e3a8a" stroke="#f59e0b" stroke-width="1.2" />
  <text x="462" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#fde68a">“THE HEAVENS” (Star Canopy)</text>

  <!-- Tiring house wall + Balcony -->
  <rect x="465" y="158" width="110" height="132" fill="#f5e8d8" stroke="#78350f" stroke-width="2" />
  <rect x="472" y="170" width="96" height="44" fill="#e7d6be" stroke="#78350f" stroke-width="1.4" />
  <text x="520" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#603148">Balcony / Upper</text>
  <text x="520" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#251d25">(Juliet's scene)</text>
  <rect x="498" y="226" width="44" height="62" rx="2" fill="#78350f" />
  <text x="520" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#fff">Tiring</text>
  <text x="520" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#fff">House</text>

  <!-- Thrust Stage Platform -->
  <rect x="330" y="248" width="142" height="16" fill="#d97706" stroke="#78350f" stroke-width="2" />
  <!-- Pillars holding Heavens -->
  <rect x="372" y="160" width="9" height="88" fill="#b45309" stroke="#78350f" />
  <!-- Understage Hell -->
  <rect x="334" y="264" width="134" height="26" fill="#251d25" stroke="#603148" stroke-width="1.6" />
  <text x="401" y="281" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#fca5a5">“HELL” (Trapdoor below)</text>

  <!-- Yard (Groundlings) -->
  <rect x="190" y="264" width="140" height="26" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
  <text x="260" y="281" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#1e293b">YARD (1-penny Groundlings)</text>

  <!-- Right Callout Card -->
  <rect x="608" y="72" width="230" height="222" rx="12" fill="#ffffff" stroke="#603148" stroke-width="1.8" />
  <text x="624" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#603148">WHY IT SHAPED THE TEXT</text>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#251d25">
    <text x="624" y="122" font-weight="700">1. No scenery or blackouts:</text>
    <text x="624" y="138" fill="#514b42">Characters paint night, forests,</text>
    <text x="624" y="153" fill="#514b42">and storms directly in verse.</text>

    <text x="624" y="180" font-weight="700">2. Groundlings surround stage:</text>
    <text x="624" y="196" fill="#514b42">Asides &amp; soliloquies speak</text>
    <text x="624" y="211" fill="#514b42">eye-to-eye with 3,000 listeners.</text>

    <text x="624" y="238" font-weight="700">3. Fast flow between scenes:</text>
    <text x="624" y="254" fill="#514b42">One group exits a door as the</text>
    <text x="624" y="269" fill="#514b42">next enters—zero curtains.</text>
  </g>

  <text x="48" y="330" font-family="system-ui, sans-serif" font-size="12" fill="#514b42">Because the actors shared the same daylight as the audience, theatre felt like a live conversation rather than an isolated movie screen.</text>
</svg>