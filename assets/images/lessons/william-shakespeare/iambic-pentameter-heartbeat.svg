<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="iambic-title iambic-desc">
  <title id="iambic-title">Iambic Pentameter Heartbeat Waveform and Irregular Line Signals</title>
  <desc id="iambic-desc">Waveform scansion of five iambs (da-DUM repeated five times, 10 syllables) in Sonnet 18, contrasted with Macbeth's broken 11-syllable feminine ending or mid-line caesura showing emotional stress.</desc>
  <rect width="860" height="320" rx="16" fill="#1c1520" stroke="#986423" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#2f2334" />
  <text x="38" y="40" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fde68a">THE HEARTBEAT METER · REGULAR IAMBIC PENTAMETER VS. BROKEN PULSE</text>

  <!-- Regular 5-beat Heartbeat Waveform -->
  <text x="34" y="80" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#f6c879">1. STEADY HEARTBEAT (Sonnet 18: 5 Iambic Feet = 10 Syllables)</text>
  <polyline points="42,144 92,144 114,98 136,144 188,144 210,98 232,144 284,144 306,98 328,144 380,144 402,98 424,144 476,144 498,98 520,144" fill="none" stroke="#f6c879" stroke-width="2.6" />
  <g font-family="Georgia, serif" font-size="12" text-anchor="middle">
    <text x="72" y="166" fill="#e8dbe8">Shall</text><text x="114" y="166" font-weight="800" fill="#ffe6a3">I</text>
    <text x="168" y="166" fill="#e8dbe8">com-</text><text x="210" y="166" font-weight="800" fill="#ffe6a3">PARE</text>
    <text x="264" y="166" fill="#e8dbe8">thee</text><text x="306" y="166" font-weight="800" fill="#ffe6a3">TO</text>
    <text x="360" y="166" fill="#e8dbe8">a</text><text x="402" y="166" font-weight="800" fill="#ffe6a3">SUM-</text>
    <text x="456" y="166" fill="#e8dbe8">mer's</text><text x="498" y="166" font-weight="800" fill="#ffe6a3">DAY?</text>
  </g>
  <rect x="556" y="96" width="278" height="72" rx="10" fill="#2a202f" stroke="#5a3d56" />
  <text x="572" y="118" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#f6c879">1 foot = 1 iamb (da-DUM)</text>
  <text x="572" y="137" font-family="system-ui, sans-serif" font-size="11" fill="#e8dbe8">Easy to memorize on stage &amp;</text>
  <text x="572" y="153" font-family="system-ui, sans-serif" font-size="11" fill="#e8dbe8">close to natural English speech.</text>

  <!-- Broken Pulse / Actor Clue -->
  <rect x="34" y="192" width="800" height="86" rx="12" fill="#2a202f" stroke="#e06c75" stroke-width="1.8" />
  <text x="52" y="216" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#fca5a5">2. WHEN SHAKESPEARE BREAKS THE BEAT (Actor Stage Direction Built Into the Meter)</text>
  <text x="52" y="242" font-family="Georgia, serif" font-size="13.5" fill="#fdfaf6">“To <tspan font-weight="800" fill="#ffe6a3">BE</tspan>, or <tspan font-weight="800" fill="#ffe6a3">NOT</tspan> to <tspan font-weight="800" fill="#ffe6a3">BE</tspan> <tspan font-weight="800" fill="#fca5a5">//</tspan> that <tspan font-weight="800" fill="#ffe6a3">IS</tspan> the <tspan font-weight="800" fill="#ffe6a3">QUES</tspan>-<tspan fill="#fca5a5">tion”</tspan></text>
  <text x="52" y="264" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5c4">Notice the 11th unstressed syllable (“-tion”) plus the mid-line pause (caesura //): Hamlet's mind hesitates, unable to lock onto a clean stop.</text>

  <text x="34" y="302" font-family="system-ui, sans-serif" font-size="11.8" fill="#c4b5c4">Rule for performers: count the stresses first—every missed beat or extra syllable signals a breath, turn, or emotional shock.</text>
</svg>