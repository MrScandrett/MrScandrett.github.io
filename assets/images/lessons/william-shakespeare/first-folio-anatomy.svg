<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="folio-title folio-desc">
  <title id="folio-title">The 1623 First Folio: How Paper Folding and Genre Preserved 36 Plays</title>
  <desc id="folio-desc">Diagram comparing folio vs. quarto paper folding alongside the 1623 First Folio's three genre divisions—Comedies, Histories, and Tragedies—highlighting the 18 plays printed for the first time.</desc>
  <rect width="860" height="330" rx="16" fill="#fffaf0" stroke="#d6c3aa" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#251d25" />
  <text x="38" y="40" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fde68a">THE 1623 FIRST FOLIO · BOOK ANATOMY &amp; PLAYS RESCUED FOR PRINT</text>

  <!-- Left: Folio vs Quarto Folding -->
  <rect x="24" y="72" width="320" height="214" rx="12" fill="#ffffff" stroke="#986423" stroke-width="1.8" />
  <text x="42" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#603148">WHY IT IS CALLED A “FOLIO”</text>

  <!-- Folio fold -->
  <rect x="42" y="114" width="124" height="72" rx="4" fill="#faf1e7" stroke="#603148" stroke-width="1.8" />
  <line x1="104" y1="114" x2="104" y2="186" stroke="#986423" stroke-width="2" stroke-dasharray="4 3" />
  <text x="73" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#251d25">p. 1</text>
  <text x="135" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#251d25">p. 2</text>
  <text x="182" y="138" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#603148">Folio (1 fold)</text>
  <text x="182" y="156" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">Large prestige volume</text>
  <text x="182" y="172" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">2 leaves = 4 pages</text>

  <!-- Quarto fold -->
  <rect x="42" y="202" width="124" height="68" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6" />
  <line x1="104" y1="202" x2="104" y2="270" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 3" />
  <line x1="42" y1="236" x2="166" y2="236" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 3" />
  <text x="182" y="224" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#334155">Quarto (2 folds)</text>
  <text x="182" y="242" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">Pocket single-play</text>
  <text x="182" y="258" font-family="system-ui, sans-serif" font-size="10.5" fill="#514b42">4 leaves = 8 pages</text>

  <!-- Right: 3 Genres & 18 Saved Plays -->
  <rect x="362" y="72" width="474" height="214" rx="12" fill="#ffffff" stroke="#603148" stroke-width="1.8" />
  <text x="380" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#603148">36 PLAYS ORGANIZED INTO THREE GENRES (18 NEVER BEFORE PRINTED)</text>

  <rect x="380" y="114" width="140" height="154" rx="10" fill="#fef3c7" stroke="#d97706" />
  <text x="450" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#7c2d12">Comedies (14)</text>
  <text x="392" y="162" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">First saved in Folio:</text>
  <text x="392" y="180" font-family="system-ui, sans-serif" font-size="10.5" fill="#451a03">• The Tempest</text>
  <text x="392" y="196" font-family="system-ui, sans-serif" font-size="10.5" fill="#451a03">• Twelfth Night</text>
  <text x="392" y="212" font-family="system-ui, sans-serif" font-size="10.5" fill="#451a03">• As You Like It</text>
  <text x="392" y="228" font-family="system-ui, sans-serif" font-size="10.5" fill="#451a03">• Measure for Measure</text>
  <text x="392" y="244" font-family="system-ui, sans-serif" font-size="10.5" fill="#451a03">• The Winter's Tale</text>

  <rect x="530" y="114" width="140" height="154" rx="10" fill="#eff6ff" stroke="#2563eb" />
  <text x="600" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1e3a8a">Histories (10)</text>
  <text x="542" y="162" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">Ordered by English reign:</text>
  <text x="542" y="180" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e293b">• King John (new)</text>
  <text x="542" y="196" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e293b">• Richard II &amp; III</text>
  <text x="542" y="212" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e293b">• Henry IV, Pts 1–2</text>
  <text x="542" y="228" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e293b">• Henry V &amp; VI</text>
  <text x="542" y="244" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e293b">• Henry VIII (new)</text>

  <rect x="680" y="114" width="140" height="154" rx="10" fill="#fdf2f8" stroke="#603148" />
  <text x="750" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#603148">Tragedies (12)</text>
  <text x="692" y="162" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#831843">First saved in Folio:</text>
  <text x="692" y="180" font-family="system-ui, sans-serif" font-size="10.5" fill="#251d25">• Macbeth</text>
  <text x="692" y="196" font-family="system-ui, sans-serif" font-size="10.5" fill="#251d25">• Julius Caesar</text>
  <text x="692" y="212" font-family="system-ui, sans-serif" font-size="10.5" fill="#251d25">• Antony &amp; Cleopatra</text>
  <text x="692" y="228" font-family="system-ui, sans-serif" font-size="10.5" fill="#251d25">• Coriolanus</text>
  <text x="692" y="244" font-family="system-ui, sans-serif" font-size="10.5" fill="#251d25">• Cymbeline</text>

  <text x="24" y="310" font-family="system-ui, sans-serif" font-size="12" fill="#514b42">Without Heminge &amp; Condell's 1623 First Folio, half of Shakespeare's plays existed only as actor promptbooks and would have vanished.</text>
</svg>