<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="tt-ig-title tt-ig-desc">
  <title id="tt-ig-title">Alan Turing's 1950 Imitation Game Architecture</title>
  <desc id="tt-ig-desc">Diagram showing Respondent A (AI Machine) and Respondent B (Human) separated by a text-only barrier wall from Interrogator C (Human Judge), who evaluates observable language rather than hidden inner consciousness.</desc>
  <defs>
    <marker id="tt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
    <marker id="tt-arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="880" height="390" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">The Imitation Game (Turing, 1950): Testing Behavior Through a Text Wall</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Physical identity is hidden so the interrogator must judge strictly by conversational evidence</text>

  <!-- Respondent A: AI -->
  <rect x="28" y="80" width="250" height="122" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="42" y="92" width="108" height="22" rx="11" fill="#4f46e5"/>
  <text x="96" y="107" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">RESPONDENT A</text>
  <text x="42" y="136" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e1b4b">Computing Machine</text>
  <text x="42" y="156" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#312e81">Tries to answer convincingly so Judge C</text>
  <text x="42" y="173" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#312e81">cannot reliably distinguish it from B.</text>
  <text x="42" y="191" font-family="JetBrains Mono, monospace" font-size="11" fill="#4338ca">No voice · No body · Text stream only</text>

  <!-- Respondent B: Human -->
  <rect x="28" y="218" width="250" height="122" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="42" y="230" width="108" height="22" rx="11" fill="#0f766e"/>
  <text x="96" y="245" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">RESPONDENT B</text>
  <text x="42" y="274" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#064e3b">Human Foil</text>
  <text x="42" y="294" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#065f46">Answers naturally from lived experience,</text>
  <text x="42" y="311" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#065f46">common sense, humor, or honest uncertainty.</text>
  <text x="42" y="329" font-family="JetBrains Mono, monospace" font-size="11" fill="#047857">Same teletype interface as A</text>

  <!-- Barrier Wall -->
  <rect x="352" y="78" width="114" height="262" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="409" y="106" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#38bdf8">ISOLATION</text>
  <text x="409" y="122" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#38bdf8">BARRIER</text>
  <line x1="368" y1="142" x2="450" y2="142" stroke="#334155" stroke-dasharray="4 4"/>
  <rect x="364" y="156" width="90" height="44" rx="8" fill="#1e293b"/>
  <text x="409" y="175" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Stripped Out:</text>
  <text x="409" y="191" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Face, voice, speed</text>
  <rect x="364" y="214" width="90" height="58" rx="8" fill="#1e293b"/>
  <text x="409" y="233" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">Passed Across:</text>
  <text x="409" y="249" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Typed Q &amp; A</text>
  <text x="409" y="263" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">transcripts only</text>
  <text x="409" y="304" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Blinds the test</text>
  <text x="409" y="319" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">to appearance</text>

  <!-- Arrows between rooms and judge -->
  <path d="M 278 130 L 348 130" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#tt-arrow)"/>
  <path d="M 348 148 L 282 148" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#tt-arrow)"/>
  <path d="M 278 272 L 348 272" stroke="#0f766e" stroke-width="2.5" marker-end="url(#tt-arrow-teal)"/>
  <path d="M 348 290 L 282 290" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#tt-arrow-teal)"/>

  <path d="M 466 175 L 542 175" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#tt-arrow)"/>
  <path d="M 542 195 L 470 195" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#tt-arrow)"/>
  <path d="M 466 245 L 542 245" stroke="#0f766e" stroke-width="2.5" marker-end="url(#tt-arrow-teal)"/>
  <path d="M 542 265 L 470 265" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#tt-arrow-teal)"/>

  <!-- Judge C -->
  <rect x="546" y="80" width="306" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="562" y="94" width="122" height="22" rx="11" fill="#0f172a"/>
  <text x="623" y="109" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">INTERROGATOR C</text>
  <text x="562" y="138" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Human Judge</text>
  <rect x="562" y="150" width="274" height="82" rx="10" fill="#f1f5f9"/>
  <text x="574" y="170" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">Diagnostic Probes:</text>
  <text x="574" y="189" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">• Follow-up memory &amp; self-correction</text>
  <text x="574" y="206" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">• Physical commonsense ("Drop a glass?")</text>
  <text x="574" y="223" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">• Poetry explanation &amp; irony</text>

  <rect x="562" y="244" width="274" height="82" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="574" y="264" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#92400e">Verdict = Behavioral Evidence</text>
  <text x="574" y="282" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#78350f">Tests whether A matches human dialogue</text>
  <text x="574" y="298" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#78350f">rate-of-mistake — does not verify inner</text>
  <text x="574" y="314" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#78350f">experience or grounded comprehension.</text>

  <!-- Bottom takeaway -->
  <text x="440" y="370" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Turing replaced the vague question “Can machines think?” with an observable behavioral game.</text>
</svg>
