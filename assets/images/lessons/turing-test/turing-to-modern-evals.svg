<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="tt-ev-title tt-ev-desc">
  <title id="tt-ev-title">From Single Imitation Test to Modern Multi-Axis AI Evaluation</title>
  <desc id="tt-ev-desc">Comparison showing why the single 1950 Turing Test cannot measure modern AI systems and how contemporary evaluation spans reasoning, accuracy, robustness, and safety.</desc>
  <rect width="880" height="390" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Why Modern AI Evaluation Goes Beyond a Single Chat Test</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Fluent imitation can mask hallucinations and brittleness — modern benchmarks separate four distinct axes</text>

  <!-- Left: 1950 Screen -->
  <rect x="28" y="78" width="290" height="278" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <rect x="44" y="94" width="160" height="22" rx="11" fill="#ea580c"/>
  <text x="124" y="109" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">1950 · SINGLE AXIS</text>
  <text x="44" y="140" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800" fill="#7c2d12">Conversational Plausibility</text>
  <text x="44" y="164" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#9a3412">• One human judge asks free-form</text>
  <text x="54" y="180" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#9a3412">questions across 5 minutes.</text>
  <text x="44" y="206" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#9a3412">• Blind Spot 1: ELIZA Effect — humans</text>
  <text x="54" y="222" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#9a3412">project mind onto warm phrasing.</text>
  <text x="44" y="248" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#9a3412">• Blind Spot 2: Confident falsehoods</text>
  <text x="54" y="264" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#9a3412">sound “human-like” even when wrong.</text>
  <rect x="44" y="286" width="258" height="52" rx="9" fill="#ffedd5" stroke="#fdba74"/>
  <text x="56" y="307" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#7c2d12">Useful for: dialogue &amp; social framing</text>
  <text x="56" y="325" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#9a3412">Insufficient for: truth, reliability, capability</text>

  <!-- Arrow -->
  <path d="M 326 216 L 368 216" stroke="#64748b" stroke-width="3"/>
  <polygon points="366,209 378,216 366,223" fill="#64748b"/>

  <!-- Right: 4-Axis Eval Suite -->
  <rect x="384" y="78" width="468" height="278" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="402" y="94" width="210" height="22" rx="11" fill="#4f46e5"/>
  <text x="507" y="109" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">MODERN AI EVALUATION SUITE</text>

  <!-- Axis 1 -->
  <rect x="402" y="130" width="210" height="100" rx="11" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="416" y="153" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#312e81">1 · Reasoning &amp; Logic</text>
  <text x="416" y="173" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#3730a3">Multi-step coding, math, and</text>
  <text x="416" y="189" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#3730a3">unfamiliar constraint puzzles.</text>
  <text x="416" y="212" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#4338ca">Not memorized patterns</text>

  <!-- Axis 2 -->
  <rect x="626" y="130" width="210" height="100" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="640" y="153" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#064e3b">2 · Factual Accuracy</text>
  <text x="640" y="173" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">Source verification, abstention,</text>
  <text x="640" y="189" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">and knowing what you don't know.</text>
  <text x="640" y="212" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#047857">Fluency != Truth</text>

  <!-- Axis 3 -->
  <rect x="402" y="242" width="210" height="100" rx="11" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="416" y="265" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0c4a6e">3 · Robustness</text>
  <text x="416" y="285" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#075985">Reworded prompts, noisy data,</text>
  <text x="416" y="301" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#075985">and adversarial edge cases.</text>
  <text x="416" y="324" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#0369a1">Consistent under shift</text>

  <!-- Axis 4 -->
  <rect x="626" y="242" width="210" height="100" rx="11" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="640" y="265" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#7f1d1d">4 · Safety &amp; Fairness</text>
  <text x="640" y="285" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#991b1b">Equitable outputs across groups</text>
  <text x="640" y="301" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#991b1b">and resistance to prompt attacks.</text>
  <text x="640" y="324" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#b91c1c">Tested before release</text>
</svg>
