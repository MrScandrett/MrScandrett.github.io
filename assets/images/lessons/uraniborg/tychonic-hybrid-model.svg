<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="thm-title">
  <title id="thm-title">Tycho Brahe's Geo-Heliocentric Hybrid System</title>
  <rect width="880" height="340" rx="16" fill="#0b1120"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#f8fafc">The Tychonic System: Planets Orbit the Sun, While Sun Orbiting Earth</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#94a3b8">Brahe's geometric compromise kept a stationary Earth (zero parallax observed) while preserving all Copernican planetary motions.</text>

  <g transform="translate(275 184)">
    <!-- Moon & Sun orbits centered on Earth -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/>
    <circle cx="0" cy="0" r="98" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Earth center -->
    <circle cx="0" cy="0" r="13" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
    <text x="0" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#93c5fd">EARTH (Stationary)</text>

    <!-- Moon -->
    <circle cx="-36" cy="0" r="5" fill="#cbd5e1"/>
    <text x="-44" y="-8" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#cbd5e1">Moon</text>

    <!-- Sun centered orbital hub -->
    <g transform="translate(98 0)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#38bdf8" stroke-width="1.3"/>
      <circle cx="0" cy="0" r="54" fill="none" stroke="#38bdf8" stroke-width="1.3"/>
      <circle cx="0" cy="0" r="118" fill="none" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="4 3"/>
      <circle cx="0" cy="0" r="154" fill="none" stroke="#a855f7" stroke-width="1.3" stroke-dasharray="4 3"/>

      <circle cx="0" cy="0" r="16" fill="#facc15" stroke="#fde047" stroke-width="2.5"/>
      <text x="0" y="-22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#fde047">SUN</text>

      <circle cx="24" cy="-18" r="4" fill="#94a3b8"/>
      <text x="31" y="-16" font-family="system-ui,sans-serif" font-size="9.5" fill="#e2e8f0">Mercury</text>

      <circle cx="38" cy="38" r="5.5" fill="#fde68a"/>
      <text x="46" y="42" font-family="system-ui,sans-serif" font-size="9.5" fill="#e2e8f0">Venus</text>

      <circle cx="-86" cy="-81" r="5" fill="#ef4444"/>
      <text x="-86" y="-92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fca5a5">Mars (crosses Earth-Sun ring)</text>

      <circle cx="154" cy="0" r="8" fill="#c084fc"/>
      <text x="154" y="-14" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#e9d5ff">Jupiter / Saturn</text>
    </g>
  </g>

  <!-- Right Key Box -->
  <g transform="translate(650 86)" font-family="system-ui,sans-serif">
    <rect width="206" height="224" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="16" y="28" font-size="12.5" font-weight="800" fill="#f8fafc">Why Astronomers Used It</text>
    <text x="16" y="54" font-size="11" fill="#86efac">✓ Explained full Venus phases</text>
    <text x="16" y="76" font-size="11" fill="#86efac">✓ Required no stellar parallax</text>
    <text x="16" y="98" font-size="11" fill="#86efac">✓ Shattered solid crystal</text>
    <text x="28" y="114" font-size="11" fill="#86efac">spheres (Mars crosses orbit)</text>
    <line x1="16" y1="134" x2="190" y2="134" stroke="#334155"/>
    <text x="16" y="158" font-size="11.5" font-weight="800" fill="#fbbf24">Fatal Flaw Later Found:</text>
    <text x="16" y="178" font-size="10.5" fill="#cbd5e1">Required a tiny planet to</text>
    <text x="16" y="194" font-size="10.5" fill="#cbd5e1">swing the massive Sun around</text>
    <text x="16" y="210" font-size="10.5" fill="#cbd5e1">Earth every single year.</text>
  </g>
</svg>
