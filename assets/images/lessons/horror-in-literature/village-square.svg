<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">A sunny New England village green with an unexplained black box</title>
  <desc id="desc">Detailed historical illustration of a tranquil New England village green on a bright summer morning. Town buildings and elms surround a central stool bearing an antique black box with piles of river stones nearby.</desc>
  <defs>
    <!-- Sky & atmospheric gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ea5e0"/>
      <stop offset="35%" stop-color="#7fc1ec"/>
      <stop offset="70%" stop-color="#bfe0f8"/>
      <stop offset="100%" stop-color="#eaf3fb"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffef0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffea9f" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#ffd56b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffd56b" stop-opacity="0"/>
    </radialGradient>
    <!-- Ground & lawn gradients -->
    <linearGradient id="lawnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#608b42"/>
      <stop offset="40%" stop-color="#4e7935"/>
      <stop offset="100%" stop-color="#345722"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfbe9b"/>
      <stop offset="50%" stop-color="#dfd0b2"/>
      <stop offset="100%" stop-color="#cfbe9b"/>
    </linearGradient>
    <!-- Building gradients -->
    <linearGradient id="townHallGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2ded4"/>
      <stop offset="40%" stop-color="#f5f3ec"/>
      <stop offset="100%" stop-color="#ded8cc"/>
    </linearGradient>
    <linearGradient id="roofSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#424c55"/>
      <stop offset="100%" stop-color="#2a323a"/>
    </linearGradient>
    <linearGradient id="redBarnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8c2f2d"/>
      <stop offset="60%" stop-color="#a63d3a"/>
      <stop offset="100%" stop-color="#732422"/>
    </linearGradient>
    <!-- Black box materials -->
    <linearGradient id="boxWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2a29"/>
      <stop offset="50%" stop-color="#1b1a19"/>
      <stop offset="100%" stop-color="#121110"/>
    </linearGradient>
    <linearGradient id="boxWoodSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#181716"/>
      <stop offset="100%" stop-color="#0a0a09"/>
    </linearGradient>
    <linearGradient id="boxChipped" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6c42"/>
      <stop offset="100%" stop-color="#5a4123"/>
    </linearGradient>
    <!-- River stone gradients -->
    <radialGradient id="stoneGrad1" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d0d5d2"/>
      <stop offset="60%" stop-color="#89918f"/>
      <stop offset="100%" stop-color="#555c5a"/>
    </radialGradient>
    <radialGradient id="stoneGrad2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e0d5c1"/>
      <stop offset="55%" stop-color="#a89a80"/>
      <stop offset="100%" stop-color="#695e4a"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="960" height="420" fill="url(#skyGrad)"/>

  <!-- Morning Sun & Radiant Glow -->
  <circle cx="780" cy="110" r="140" fill="url(#sunGlow)"/>
  <circle cx="780" cy="110" r="42" fill="#fffcee"/>

  <!-- Distant Fluffy Summer Clouds -->
  <g fill="#ffffff" opacity="0.75">
    <path d="M120 160 Q135 130 165 135 Q190 120 225 130 Q255 125 270 145 Q285 160 270 175 Q120 175 120 160 Z"/>
    <path d="M480 120 Q500 95 530 102 Q555 90 585 100 Q615 95 635 115 Q650 135 630 150 Q480 150 480 120 Z" opacity="0.6"/>
  </g>

  <!-- Distant Blue Ridge Hills -->
  <path d="M0 320 Q220 285 460 305 T960 295 V420 H0 Z" fill="#6c939e" opacity="0.45"/>
  <path d="M0 335 Q280 310 580 330 T960 315 V440 H0 Z" fill="#4d7c66" opacity="0.5"/>

  <!-- Village Backdrop: Colonial Architecture -->
  <!-- Left House (New England Saltbox / Farmhouse) -->
  <g>
    <!-- Foundation -->
    <rect x="52" y="325" width="138" height="15" fill="#69655f"/>
    <!-- Main walls (warm ochre clapboard) -->
    <polygon points="55,325 55,250 124,195 190,250 190,325" fill="#d9be8b" stroke="#877148" stroke-width="1.5"/>
    <!-- Clapboard lines -->
    <path d="M55 260h135 M55 275h135 M55 290h135 M55 305h135 M55 320h135" stroke="#be9f67" stroke-width="1"/>
    <!-- Roof with eaves -->
    <polygon points="45,254 124,190 200,254 194,260 124,202 51,260" fill="url(#roofSlate)"/>
    <!-- Chimney -->
    <rect x="145" y="172" width="22" height="42" fill="#8c382b" stroke="#521f17" stroke-width="1.5"/>
    <rect x="142" y="168" width="28" height="6" fill="#4a1811"/>
    <!-- Windows with muntins (panes) -->
    <rect x="74" y="265" width="24" height="32" fill="#f8fbff" stroke="#333" stroke-width="1.5"/>
    <path d="M86 265v32 M74 281h24" stroke="#555" stroke-width="1"/>
    <rect x="146" y="265" width="24" height="32" fill="#f8fbff" stroke="#333" stroke-width="1.5"/>
    <path d="M158 265v32 M146 281h24" stroke="#555" stroke-width="1"/>
    <!-- Front Door -->
    <rect x="108" y="280" width="26" height="45" fill="#45271a" stroke="#22120b" stroke-width="1.5"/>
    <circle cx="113" cy="304" r="1.8" fill="#d4af37"/>
  </g>

  <!-- Center Building: The Town Meetinghouse / Church with Belfry Steeple -->
  <g>
    <!-- Foundation -->
    <rect x="360" y="318" width="210" height="15" fill="#757774"/>
    <!-- Portico Pediment & Columns -->
    <rect x="365" y="225" width="200" height="95" fill="url(#townHallGrad)" stroke="#9c9586" stroke-width="1.5"/>
    <!-- Clapboards -->
    <path d="M365 240h200 M365 255h200 M365 270h200 M365 285h200 M365 300h200 M365 315h200" stroke="#d1cbbe" stroke-width="1"/>
    <!-- Pediment Gable Triangle -->
    <polygon points="355,225 465,150 575,225" fill="#f2efe9" stroke="#9c9586" stroke-width="2"/>
    <polygon points="368,220 465,158 562,220" fill="#e0dbcf"/>
    <!-- Round Attic Window (Oculus) -->
    <circle cx="465" cy="190" r="14" fill="#6baed6" stroke="#48443b" stroke-width="2"/>
    <path d="M465 176v28 M451 190h28" stroke="#f2efe9" stroke-width="1.5"/>
    <!-- Belfry Tower -->
    <rect x="440" y="98" width="50" height="55" fill="#f8f6f0" stroke="#756f62" stroke-width="1.5"/>
    <!-- Belfry Louvers / Bell Opening -->
    <rect x="450" y="108" width="30" height="34" rx="4" fill="#2d3339" stroke="#666" stroke-width="1"/>
    <!-- Bronze Bell inside -->
    <ellipse cx="465" cy="126" rx="8" ry="10" fill="#c49a45"/>
    <!-- Steeple Spire -->
    <polygon points="435,98 465,30 495,98" fill="#4d5963" stroke="#2c343b" stroke-width="1.5"/>
    <!-- Weathervane -->
    <path d="M465 30V12 M457 18h16" stroke="#d4af37" stroke-width="2"/>
    <polygon points="465,12 472,15 465,18" fill="#d4af37"/>
    <!-- Meetinghouse Columns (Four Doric pillars) -->
    <rect x="382" y="235" width="14" height="85" fill="#ffffff" stroke="#b0aba0" stroke-width="1"/>
    <rect x="424" y="235" width="14" height="85" fill="#ffffff" stroke="#b0aba0" stroke-width="1"/>
    <rect x="492" y="235" width="14" height="85" fill="#ffffff" stroke="#b0aba0" stroke-width="1"/>
    <rect x="534" y="235" width="14" height="85" fill="#ffffff" stroke="#b0aba0" stroke-width="1"/>
    <!-- Double Entrance Doors -->
    <rect x="450" y="265" width="30" height="55" fill="#243328" stroke="#101812" stroke-width="2"/>
    <line x1="465" y1="265" x2="465" y2="320" stroke="#101812" stroke-width="1.5"/>
    <circle cx="462" cy="295" r="1.5" fill="#d4af37"/>
    <circle cx="468" cy="295" r="1.5" fill="#d4af37"/>
  </g>

  <!-- Right Building: General Store / Post Office -->
  <g>
    <!-- Foundation -->
    <rect x="730" y="322" width="165" height="15" fill="#686560"/>
    <!-- Red Clapboard Store -->
    <polygon points="735,322 735,240 820,185 895,240 895,322" fill="url(#redBarnGrad)" stroke="#521b1a" stroke-width="1.5"/>
    <polygon points="726,242 820,178 904,242 896,248 820,192 734,248" fill="url(#roofSlate)"/>
    <!-- Store Front Porch Awning -->
    <polygon points="730,270 890,270 900,285 725,285" fill="#2e4d3a" stroke="#1a2e22" stroke-width="1.5"/>
    <!-- Porch Posts -->
    <line x1="740" y1="285" x2="740" y2="325" stroke="#ded8cc" stroke-width="4"/>
    <line x1="810" y1="285" x2="810" y2="325" stroke="#ded8cc" stroke-width="4"/>
    <line x1="885" y1="285" x2="885" y2="325" stroke="#ded8cc" stroke-width="4"/>
    <!-- Display Windows -->
    <rect x="752" y="286" width="46" height="30" fill="#eaf4fc" stroke="#444" stroke-width="1.5"/>
    <rect x="826" y="286" width="46" height="30" fill="#eaf4fc" stroke="#444" stroke-width="1.5"/>
  </g>

  <!-- Lush Village Trees (American Elms and Sugar Maples) -->
  <!-- Left Majestic Elm -->
  <g>
    <!-- Trunk & main branches -->
    <path d="M255 335 C250 280 230 240 215 200 C235 230 260 260 270 335 Z" fill="#3b2b1d"/>
    <path d="M232 230 C200 205 170 185 145 180 C175 190 205 215 225 240 Z" fill="#3b2b1d"/>
    <path d="M245 215 C265 185 295 160 320 150 C295 175 270 200 255 225 Z" fill="#3b2b1d"/>
    <!-- Foliage Canopies (layered greens with sunlight highlights) -->
    <ellipse cx="160" cy="180" rx="65" ry="45" fill="#325a24"/>
    <ellipse cx="165" cy="175" rx="55" ry="38" fill="#457833"/>
    <ellipse cx="170" cy="168" rx="42" ry="28" fill="#629e46"/>

    <ellipse cx="305" cy="155" rx="70" ry="50" fill="#2c5220"/>
    <ellipse cx="300" cy="148" rx="60" ry="42" fill="#3e6f2c"/>
    <ellipse cx="295" cy="140" rx="48" ry="32" fill="#58913d"/>

    <ellipse cx="230" cy="145" rx="85" ry="60" fill="#284d1c"/>
    <ellipse cx="235" cy="138" rx="72" ry="50" fill="#3a6927"/>
    <ellipse cx="240" cy="128" rx="58" ry="38" fill="#58943c"/>
    <ellipse cx="245" cy="120" rx="40" ry="25" fill="#7ab854" opacity="0.85"/>
  </g>

  <!-- Right Maple Tree -->
  <g>
    <path d="M685 340 C680 285 665 240 655 195 C675 230 690 270 700 340 Z" fill="#36281a"/>
    <ellipse cx="650" cy="185" rx="75" ry="55" fill="#295424"/>
    <ellipse cx="655" cy="178" rx="62" ry="44" fill="#3b7234"/>
    <ellipse cx="660" cy="168" rx="48" ry="32" fill="#59994b"/>
    <ellipse cx="665" cy="160" rx="35" ry="22" fill="#78be64" opacity="0.85"/>
  </g>

  <!-- Stone Wall / Picket Fence in Midground -->
  <g>
    <!-- Fieldstone boundary wall -->
    <path d="M0 340 Q180 330 360 338 T720 335 T960 342" stroke="#686359" stroke-width="8" stroke-dasharray="14 3" fill="none"/>
    <path d="M0 340 Q180 330 360 338 T720 335 T960 342" stroke="#8c8577" stroke-width="5" stroke-dasharray="10 6" fill="none"/>
    <!-- Picket fence along church yard -->
    <path d="M220 340 L350 340" stroke="#d5d0c4" stroke-width="4"/>
    <path d="M225 330v15 M240 330v15 M255 330v15 M270 330v15 M285 330v15 M300 330v15 M315 330v15 M330 330v15 M345 330v15" stroke="#f0ebe1" stroke-width="3"/>
  </g>

  <!-- Village Green Lawn (Foreground & Middleground) -->
  <path d="M0 342 C240 328 480 328 960 342 V680 H0 Z" fill="url(#lawnGrad)"/>

  <!-- Meandering Village Gravel Pathway -->
  <path d="M120 680 C260 550 380 430 465 330 C490 330 510 330 525 330 C480 440 640 570 820 680 Z" fill="url(#pathGrad)" opacity="0.6"/>

  <!-- Subtle Tree Shadows on the Lawn -->
  <ellipse cx="290" cy="380" rx="140" ry="35" fill="#1e3612" opacity="0.32" transform="rotate(-6 290 380)"/>
  <ellipse cx="660" cy="385" rx="110" ry="30" fill="#1e3612" opacity="0.3" transform="rotate(8 660 385)"/>

  <!-- FOREGROUND FOCUS: Three-Legged Stool, The Black Box, and River Stones -->

  <!-- Stool and Box Cast Shadow (Stretching toward bottom-left in morning light) -->
  <g opacity="0.45">
    <ellipse cx="420" cy="565" rx="145" ry="38" fill="#14260e"/>
    <polygon points="480,500 320,555 420,580 490,520" fill="#14260e"/>
  </g>

  <!-- The Three-Legged Wooden Stool -->
  <g>
    <!-- Stool Back Leg -->
    <polygon points="475,475 468,545 476,545 481,475" fill="#4d3521" stroke="#2e1f13" stroke-width="1"/>
    <!-- Stool Left Leg -->
    <polygon points="435,475 410,552 420,554 445,475" fill="#66462c" stroke="#382516" stroke-width="1.2"/>
    <!-- Stool Right Leg -->
    <polygon points="515,475 540,550 530,553 505,475" fill="#543924" stroke="#2e1f13" stroke-width="1.2"/>
    <!-- Stool Round Seat Surface -->
    <ellipse cx="475" cy="475" rx="55" ry="18" fill="#805938" stroke="#422c19" stroke-width="2"/>
    <ellipse cx="475" cy="472" rx="52" ry="16" fill="#9c6d45"/>
    <ellipse cx="472" cy="471" rx="46" ry="13" fill="#b37f52" opacity="0.7"/>
    <!-- Wood grain / aged rings on seat rim -->
    <path d="M440 473 Q475 482 510 473" stroke="#5a3d24" stroke-width="1" fill="none" opacity="0.6"/>
  </g>

  <!-- The Weathered Black Wooden Box -->
  <!-- Box Base & Isometric Form -->
  <g id="black-box">
    <!-- Top Face of Box -->
    <polygon points="475,372 545,404 475,436 405,404" fill="url(#boxWood)" stroke="#1a1817" stroke-width="1.5"/>
    <!-- Chipped paint exposing antique wood on top edge -->
    <path d="M425 412 L455 398 L450 395 L420 409 Z" fill="url(#boxChipped)" opacity="0.9"/>
    <path d="M510 390 L535 401 L530 404 L505 393 Z" fill="url(#boxChipped)" opacity="0.85"/>
    <!-- Ballot / Slip Slot on Top Face -->
    <polygon points="465,400 488,410 483,413 460,403" fill="#000000" stroke="#333333" stroke-width="1"/>

    <!-- Left (Shadowed) Side Face of Box -->
    <polygon points="405,404 475,436 475,492 405,460" fill="url(#boxWoodSide)" stroke="#1a1817" stroke-width="1.5"/>
    <!-- Wood splinters and scuffs on left face -->
    <path d="M410 415 L418 450 L414 452 L408 418 Z" fill="url(#boxChipped)" opacity="0.6"/>
    <path d="M440 440 L452 478 L448 480 L436 442 Z" fill="url(#boxChipped)" opacity="0.7"/>

    <!-- Right (Lit) Side Face of Box -->
    <polygon points="475,436 545,404 545,460 475,492" fill="#262524" stroke="#1a1817" stroke-width="1.5"/>
    <!-- Chipped edge revealing wood on corner -->
    <path d="M473 436 L477 436 L476 492 L473 492 Z" fill="url(#boxChipped)" opacity="0.8"/>
    <path d="M520 418 L538 426 L536 432 L518 424 Z" fill="url(#boxChipped)" opacity="0.75"/>

    <!-- Antique Iron Hasp / Latch -->
    <polygon points="472,430 478,430 477,448 473,448" fill="#525456" stroke="#222" stroke-width="1"/>
    <circle cx="475" cy="445" r="2.5" fill="#1b1c1d"/>
  </g>

  <!-- Piles of Smooth River Stones in the Grass -->
  <!-- Stone Pile 1: Right foreground pile gathered by the boys -->
  <g id="stone-pile-right">
    <!-- Stones shadow -->
    <ellipse cx="615" cy="575" rx="55" ry="18" fill="#1e3612" opacity="0.45"/>

    <!-- Bottom Layer Stones -->
    <ellipse cx="585" cy="576" rx="20" ry="12" fill="url(#stoneGrad1)" stroke="#444b49" stroke-width="1" transform="rotate(-8 585 576)"/>
    <ellipse cx="615" cy="580" rx="24" ry="14" fill="url(#stoneGrad2)" stroke="#524838" stroke-width="1" transform="rotate(4 615 580)"/>
    <ellipse cx="645" cy="575" rx="19" ry="11" fill="url(#stoneGrad1)" stroke="#444b49" stroke-width="1" transform="rotate(15 645 575)"/>

    <!-- Middle Layer Stones -->
    <ellipse cx="598" cy="565" rx="18" ry="11" fill="url(#stoneGrad2)" stroke="#524838" stroke-width="1" transform="rotate(10 598 565)"/>
    <ellipse cx="628" cy="566" rx="19" ry="12" fill="url(#stoneGrad1)" stroke="#444b49" stroke-width="1" transform="rotate(-6 628 566)"/>

    <!-- Top Cap Stone -->
    <ellipse cx="612" cy="554" rx="16" ry="10" fill="url(#stoneGrad1)" stroke="#3f4543" stroke-width="1" transform="rotate(-2 612 554)"/>
    <!-- Highlight sheen on smooth water-worn stone -->
    <ellipse cx="608" cy="551" rx="8" ry="3.5" fill="#ffffff" opacity="0.5" transform="rotate(-5 608 551)"/>
  </g>

  <!-- Stone Pile 2: Smaller left pile -->
  <g id="stone-pile-left">
    <ellipse cx="340" cy="585" rx="42" ry="14" fill="#1e3612" opacity="0.4"/>
    <ellipse cx="325" cy="586" rx="16" ry="10" fill="url(#stoneGrad2)" stroke="#524838" stroke-width="1" transform="rotate(-12 325 586)"/>
    <ellipse cx="352" cy="587" rx="17" ry="11" fill="url(#stoneGrad1)" stroke="#444b49" stroke-width="1" transform="rotate(8 352 587)"/>
    <ellipse cx="338" cy="578" rx="15" ry="9" fill="url(#stoneGrad1)" stroke="#3f4543" stroke-width="1" transform="rotate(2 338 578)"/>
    <ellipse cx="335" cy="576" rx="7" ry="3" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Blades of green grass around stones and stool legs -->
  <g stroke="#61993b" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M405 558 L402 548 M407 558 L408 546 M412 559 L416 550"/>
    <path d="M532 555 L530 545 M535 556 L538 546 M540 557 L545 549"/>
    <path d="M570 582 L566 572 M573 584 L575 573 M658 578 L662 568 M665 580 L670 571"/>
    <path d="M312 590 L308 580 M364 590 L368 581"/>
  </g>
</svg>