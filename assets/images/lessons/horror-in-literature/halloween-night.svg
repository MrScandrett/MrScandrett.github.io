<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" fill="none" aria-hidden="true">
  <defs>
    <!-- Moon glow gradients -->
    <radialGradient id="moon-outer-glow" cx="68%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffbe53" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#f29438" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#b84b25" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#b84b25" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon-body" cx="42%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#fff5dc"/>
      <stop offset="55%" stop-color="#fcd087"/>
      <stop offset="88%" stop-color="#e89e43"/>
      <stop offset="100%" stop-color="#c96f24"/>
    </radialGradient>
    <linearGradient id="cloud-wisp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#462338" stop-opacity="0"/>
      <stop offset="30%" stop-color="#69314c" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#69314c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#462338" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hill-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2233" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#24101d" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Distant twilight hills -->
  <path d="M0 220 Q80 198 170 215 T360 205 V260 H0 Z" fill="url(#hill-grad)"/>
  <path d="M0 236 Q110 224 220 238 T360 226 V260 H0 Z" fill="#1e0c1a" opacity="0.8"/>

  <!-- Outer ambient moon halo -->
  <circle cx="252" cy="98" r="92" fill="url(#moon-outer-glow)"/>
  <circle cx="252" cy="98" r="66" fill="#f8b656" opacity="0.25"/>

  <!-- Detailed Harvest Moon Disc -->
  <circle cx="252" cy="98" r="48" fill="url(#moon-body)"/>

  <!-- Lunar Maria / Surface Texture -->
  <g fill="#c4782b" opacity="0.28">
    <ellipse cx="242" cy="84" rx="14" ry="10" transform="rotate(-15 242 84)"/>
    <ellipse cx="266" cy="78" rx="11" ry="8" transform="rotate(20 266 78)"/>
    <ellipse cx="236" cy="106" rx="12" ry="15" transform="rotate(10 236 106)"/>
    <ellipse cx="264" cy="112" rx="16" ry="11" transform="rotate(-25 264 112)"/>
    <circle cx="249" cy="96" r="6"/>
    <circle cx="274" cy="94" r="5"/>
  </g>

  <!-- Atmospheric clouds drifting across moon -->
  <path d="M190 92 C215 84 250 86 280 94 C295 98 320 95 330 90 C310 98 285 104 260 101 C235 98 205 102 190 92 Z" fill="url(#cloud-wisp)"/>
  <path d="M210 115 C235 110 265 112 295 120 C270 123 245 121 225 125 C218 123 213 118 210 115 Z" fill="url(#cloud-wisp)" opacity="0.7"/>

  <!-- Detailed Bats in Flight -->
  <!-- Bat 1: Large foreground bat crossing near moon -->
  <g fill="#2a1224" stroke="#180715" stroke-width="0.75" stroke-linejoin="round">
    <!-- Body & head -->
    <path d="M118 92 C118 89 120 86 122 86 C124 86 126 89 126 92 C126 96 124 100 122 101 C120 100 118 96 118 92 Z"/>
    <!-- Ears -->
    <polygon points="120,86 119,82 121,85"/>
    <polygon points="124,86 125,82 123,85"/>
    <!-- Left Wing (scalloped anatomical flight membrane) -->
    <path d="M120 89 C112 78 98 75 82 82 C89 87 91 95 86 102 C94 99 99 104 98 111 C105 106 112 110 119 96 Z"/>
    <!-- Right Wing -->
    <path d="M124 89 C132 78 146 75 162 82 C155 87 153 95 158 102 C150 99 145 104 146 111 C139 106 132 110 125 96 Z"/>
  </g>

  <!-- Bat 2: Mid-ground bat swooping at left -->
  <g fill="#3b1a32" opacity="0.95">
    <ellipse cx="64" cy="132" rx="2.5" ry="5"/>
    <polygon points="62.5,128 62,125 63.5,127"/>
    <polygon points="65.5,128 66,125 64.5,127"/>
    <path d="M63 130 C56 122 44 120 32 125 C37 129 38 135 34 140 C41 138 45 142 44 147 C50 143 56 146 62 135 Z"/>
    <path d="M65 130 C72 122 84 120 96 125 C91 129 90 135 94 140 C87 138 83 142 84 147 C78 143 72 146 66 135 Z"/>
  </g>

  <!-- Bat 3: High distant bat banking right -->
  <g fill="#4e2440" opacity="0.8">
    <ellipse cx="198" cy="62" rx="2" ry="3.5" transform="rotate(-15 198 62)"/>
    <path d="M197 61 C192 55 183 54 174 57 C178 60 178 65 175 68 C180 67 183 70 183 74 C187 71 192 73 196 65 Z"/>
    <path d="M199 61 C205 56 214 56 222 61 C218 64 216 68 219 72 C214 70 210 72 210 76 C206 72 202 73 198 65 Z"/>
  </g>

  <!-- Bat 4 & 5: Distant silhouettes -->
  <path d="M152 42 C147 38 140 38 134 40 C138 43 141 46 145 44 C148 47 152 45 156 42 C161 40 166 41 170 43 C166 40 160 38 155 42 Z" fill="#582a46" opacity="0.65"/>
  <path d="M294 146 C290 143 285 143 280 145 C283 147 286 149 289 148 C291 150 294 149 297 147 C300 146 304 147 307 148 C304 146 299 144 295 147 Z" fill="#4a223a" opacity="0.6"/>

  <!-- Gnarled Gothic Oak / Willow Branch framing left & top -->
  <g fill="#1a0a16" stroke="#120610" stroke-width="0.5">
    <!-- Main gnarled branch entering from top-left -->
    <path d="M0 0 Q45 28 85 38 T140 45 Q125 50 100 48 T40 38 Q18 32 0 25 Z"/>
    <!-- Twisting sub-branches -->
    <path d="M52 32 Q70 18 92 12 Q82 22 64 36 Z"/>
    <path d="M78 37 Q95 56 112 62 Q102 54 88 41 Z"/>
    <path d="M112 43 Q138 34 165 31 Q150 38 128 46 Z"/>
    <path d="M132 45 Q148 58 158 64 Q146 56 138 48 Z"/>
    <!-- Delicate barren twigs -->
    <path d="M88 14 Q98 8 108 5" stroke="#1a0a16" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M102 58 Q118 72 126 80" stroke="#1a0a16" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M158 32 Q174 28 186 24" stroke="#1a0a16" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Hanging Spanish moss / autumn leaves -->
    <path d="M68 38 C66 48 70 56 69 64 C68 58 65 50 66 38 Z" fill="#251020"/>
    <path d="M96 46 C94 58 97 68 95 78 C93 70 91 58 93 45 Z" fill="#251020"/>
    <path d="M122 47 C120 56 123 64 121 72 C120 65 118 56 119 46 Z" fill="#251020"/>
  </g>
</svg>