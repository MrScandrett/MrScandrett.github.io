<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="mc-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c4eaf1" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#24788f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#03111a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mc-ocean" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#12485c"/>
      <stop offset="40%" stop-color="#082b38"/>
      <stop offset="100%" stop-color="#020e14"/>
    </linearGradient>
    <linearGradient id="mc-hull" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d291e"/>
      <stop offset="50%" stop-color="#21150e"/>
      <stop offset="100%" stop-color="#0c0704"/>
    </linearGradient>
    <linearGradient id="mc-sail" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e1edf0"/>
      <stop offset="100%" stop-color="#adc5cc"/>
    </linearGradient>
  </defs>

  <!-- Open Atlantic Nocturnal Seascape Sky -->
  <rect width="320" height="320" fill="#03111a"/>

  <!-- Crescent Moon in Sea Fog -->
  <circle cx="250" cy="65" r="45" fill="url(#mc-moon)"/>
  <circle cx="250" cy="65" r="18" fill="#eaf6f7"/>
  <circle cx="256" cy="62" r="16" fill="#03111a"/>

  <!-- Distant Ocean Fog Wisps -->
  <path d="M0 160 C70 150 140 170 210 155 T320 150" stroke="#7fd0e0" stroke-width="1.5" opacity="0.3" fill="none"/>
  <path d="M0 185 C80 175 160 195 240 180 T320 175" stroke="#7fd0e0" stroke-width="2" opacity="0.2" fill="none"/>

  <!-- THE GHOST BRIGANTINE UNDER FULL CANVAS (The Mary Celeste) -->
  <g id="brigantine-mary-celeste" filter="drop-shadow(0 8px 18px rgba(0,0,0,0.8))">
    <!-- Ship Hull (Sheer line, clipper bow, transom) -->
    <path d="M45 205 C95 210 185 210 255 198 L248 220 C185 228 95 226 55 215 Z" fill="url(#mc-hull)" stroke="#050302" stroke-width="1.5"/>
    <!-- Hull Gold Copper Stripe -->
    <path d="M48 210 C95 215 185 215 252 205" stroke="#7fd0e0" stroke-width="1.5" fill="none"/>

    <!-- Bowsprit & Jibboom Spar (Extending forward from stem) -->
    <line x1="45" y1="205" x2="8" y2="182" stroke="#4a3728" stroke-width="3"/>

    <!-- Foremast (Square-Rigged Foremast) -->
    <line x1="95" y1="210" x2="95" y2="55" stroke="#3b2b1d" stroke-width="3"/>
    <!-- Yards (Horizontal cross-spars) -->
    <line x1="65" y1="170" x2="125" y2="170" stroke="#241a11" stroke-width="2"/>
    <line x1="68" y1="125" x2="122" y2="125" stroke="#241a11" stroke-width="1.8"/>
    <line x1="72" y1="85" x2="118" y2="85" stroke="#241a11" stroke-width="1.5"/>

    <!-- Mainmast (Taller Aft Mast) -->
    <line x1="175" y1="208" x2="175" y2="40" stroke="#3b2b1d" stroke-width="3.2"/>
    <line x1="145" y1="165" x2="205" y2="165" stroke="#241a11" stroke-width="2"/>
    <line x1="150" y1="115" x2="200" y2="115" stroke="#241a11" stroke-width="1.8"/>
    <line x1="155" y1="75" x2="195" y2="75" stroke="#241a11" stroke-width="1.5"/>

    <!-- Standing Rigging (Shrouds, Stays & Ratlines) -->
    <g stroke="#1a140e" stroke-width="0.75" opacity="0.6">
      <line x1="95" y1="55" x2="8" y2="182"/>
      <line x1="95" y1="85" x2="18" y2="190"/>
      <line x1="175" y1="40" x2="95" y2="90"/>
      <line x1="95" y1="85" x2="80" y2="208"/>
      <line x1="95" y1="85" x2="110" y2="208"/>
      <line x1="175" y1="75" x2="160" y2="206"/>
      <line x1="175" y1="75" x2="190" y2="206"/>
    </g>

    <!-- Billowing White Canvas Sails (Caught in the ocean trade wind) -->
    <!-- Jib & Flying Jib Sails (Triangles off bowsprit) -->
    <polygon points="12,185 92,130 92,175" fill="url(#mc-sail)" stroke="#557580" stroke-width="0.75"/>
    <polygon points="32,195 92,150 92,185" fill="url(#mc-sail)" stroke="#557580" stroke-width="0.75"/>

    <!-- Foremast Square Sails -->
    <!-- Fore Course (Lower) -->
    <path d="M66 172 C80 182 110 182 124 172 L120 198 C108 204 82 204 70 198 Z" fill="url(#mc-sail)" stroke="#557580" stroke-width="0.75"/>
    <!-- Fore Topsail (Middle) -->
    <path d="M69 127 C80 137 110 137 121 127 L124 168 C110 174 80 174 66 168 Z" fill="url(#mc-sail)" stroke="#557580" stroke-width="0.75"/>
    <!-- Fore Topgallant (Top) -->
    <path d="M73 87 C82 95 108 95 117 87 L120 123 C110 128 80 128 70 123 Z" fill="url(#mc-sail)" stroke="#557580" stroke-width="0.75"/>

    <!-- Mainmast Fore-and-Aft Mainsail (Spanker / Gaff Sail) -->
    <polygon points="175,95 240,118 235,190 175,198" fill="url(#mc-sail)" stroke="#557580" stroke-width="1"/>
    <!-- Main Topsail -->
    <path d="M152 117 C165 125 185 125 198 117 L202 162 C185 168 165 168 148 162 Z" fill="url(#mc-sail)" stroke="#557580" stroke-width="0.75"/>
    <path d="M156 77 C165 85 185 85 194 77 L198 113 C185 118 165 118 152 113 Z" fill="url(#mc-sail)" stroke="#557580" stroke-width="0.75"/>

    <!-- The Abandoned Helm / Ship Wheel on Aft Deck (Silent Mystery) -->
    <g transform="translate(225, 188)">
      <circle cx="6" cy="6" r="6" stroke="#4a3728" stroke-width="1.2" fill="none"/>
      <line x1="6" y1="0" x2="6" y2="12" stroke="#4a3728" stroke-width="1.2"/>
      <line x1="0" y1="6" x2="12" y2="6" stroke="#4a3728" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Surging Atlantic Swell & Sea Foam at Cutwater -->
  <path d="M0 215 Q60 200 120 218 T240 210 T320 220 V320 H0 Z" fill="url(#mc-ocean)"/>
  <path d="M0 235 Q80 220 160 240 T320 230 V320 H0 Z" fill="#08222d"/>

  <!-- Frothing White Sea Foam -->
  <path d="M40 215 C48 212 55 218 62 216 C55 220 48 222 42 225 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M55 218 Q90 224 130 220" stroke="#7fd0e0" stroke-width="2" fill="none" opacity="0.6"/>
</svg>