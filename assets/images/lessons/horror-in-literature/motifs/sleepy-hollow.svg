<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="sh-moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe699" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ffaa3b" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#e8651a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2c1a44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sh-moon" cx="40%" cy="38%" r="60%">
