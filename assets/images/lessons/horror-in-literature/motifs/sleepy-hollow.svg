    <path d="M210 262 L218 266 L224 263 L230 267 L236 262 L242 267 L248 263 L254 266 L260 262 L254 274 L246 270 L240 274 L235 269 L230 274 L224 270 L216 274 Z" fill="#fff9b8" stroke="#d35400" stroke-width="1.5"/>
