<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="ed-dawn" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffd36e" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#8ba1b5" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#34424e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#141a20" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ed-brass" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="40%" stop-color="#ffd36e"/>
      <stop offset="80%" stop-color="#b58d2a"/>
      <stop offset="100%" stop-color="#594109"/>
    </linearGradient>
    <linearGradient id="ed-lens" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#d6edff" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#8ec5fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="ed-mud" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#3b3225"/>
      <stop offset="100%" stop-color="#1f1a13"/>
    </linearGradient>
  </defs>

  <!-- Staffordshire Morning Mist Backdrop -->
  <rect width="320" height="320" fill="#141a20"/>
  <circle cx="160" cy="110" r="100" fill="url(#ed-dawn)"/>

  <!-- Distant Great Wyrley Church Spire in the Dawn Mist -->
  <polygon points="155,75 160,35 165,75" fill="#4d5f6e" opacity="0.6"/>
  <rect x="156" y="75" width="8" height="25" fill="#4d5f6e" opacity="0.6"/>

  <!-- Converging Railway Tracks (Forensic Search Scene) -->
  <g stroke="#2c3a45" stroke-width="2">
    <!-- Left Iron Rail -->
    <line x1="160" y1="100" x2="35" y2="320" stroke="#718696" stroke-width="3"/>
    <!-- Right Iron Rail -->
    <line x1="160" y1="100" x2="285" y2="320" stroke="#718696" stroke-width="3"/>

    <!-- Wooden Railway Ties / Sleepers (Perspective spacing) -->
    <line x1="156" y1="112" x2="164" y2="112" stroke="#3d3023" stroke-width="2"/>
    <line x1="152" y1="126" x2="168" y2="126" stroke="#3d3023" stroke-width="2.5"/>
    <line x1="145" y1="145" x2="175" y2="145" stroke="#3d3023" stroke-width="3"/>
    <line x1="135" y1="170" x2="185" y2="170" stroke="#3d3023" stroke-width="4"/>
    <line x1="120" y1="205" x2="200" y2="205" stroke="#3d3023" stroke-width="5"/>
    <line x1="95" y1="250" x2="225" y2="250" stroke="#3d3023" stroke-width="6"/>
    <line x1="60" y1="305" x2="260" y2="305" stroke="#3d3023" stroke-width="7"/>
  </g>

  <!-- Muddy Stile Ground Layer in Foreground -->
  <polygon points="0,260 320,260 320,320 0,320" fill="url(#ed-mud)" opacity="0.95"/>

  <!-- Arthur Conan Doyle's Brass Magnifying Glass (Observing physical evidence) -->
  <g id="forensic-magnifier" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.8))">
    <!-- Knurled Brass Handle -->
    <polygon points="215,225 285,295 275,305 205,235" fill="url(#ed-brass)" stroke="#473408" stroke-width="2"/>
    <line x1="225" y1="245" x2="265" y2="285" stroke="#fff4b8" stroke-width="2"/>

    <!-- Circular Beveled Brass Frame -->
    <circle cx="160" cy="180" r="62" fill="none" stroke="url(#ed-brass)" stroke-width="6"/>
    <circle cx="160" cy="180" r="59" fill="none" stroke="#382906" stroke-width="1.5"/>

    <!-- Magnified Ground Area Inside Lens -->
    <circle cx="160" cy="180" r="58" fill="#4d3e2a"/>

    <!-- Physical Evidence: Clear Muddy Boot Tread & Hoof Print (Magnified) -->
    <g transform="translate(135, 150)">
      <!-- Boot Sole Tread -->
      <path d="M12 8 C16 4 28 4 32 8 C36 15 36 30 32 38 C30 42 26 44 22 44 C18 44 14 42 12 38 C8 30 8 15 12 8 Z" fill="#1f1810" stroke="#0d0a07" stroke-width="1.5"/>
      <!-- Grid Tread Lug Marks -->
      <line x1="16" y1="12" x2="28" y2="12" stroke="#4d3e2a" stroke-width="1.5"/>
      <line x1="14" y1="18" x2="30" y2="18" stroke="#4d3e2a" stroke-width="1.5"/>
      <line x1="14" y1="24" x2="30" y2="24" stroke="#4d3e2a" stroke-width="1.5"/>
      <line x1="15" y1="30" x2="29" y2="30" stroke="#4d3e2a" stroke-width="1.5"/>
      <!-- Separate Heel Impression -->
      <rect x="15" y="47" width="14" height="10" rx="2" fill="#1f1810" stroke="#0d0a07" stroke-width="1.2"/>
    </g>

    <!-- Glass Lens Reflections & Optical Glare -->
    <circle cx="160" cy="180" r="58" fill="url(#ed-lens)"/>
    <path d="M125 142 C145 132 175 135 195 148" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- Metric / Imperial Forensic Scale Bar (Scientific Investigation) -->
  <g transform="translate(30, 275)">
    <rect x="0" y="0" width="80" height="8" fill="#f5eedc" stroke="#222" stroke-width="1"/>
    <rect x="0" y="0" width="10" height="8" fill="#111"/>
    <rect x="20" y="0" width="10" height="8" fill="#111"/>
    <rect x="40" y="0" width="10" height="8" fill="#111"/>
    <rect x="60" y="0" width="10" height="8" fill="#111"/>
  </g>
</svg>