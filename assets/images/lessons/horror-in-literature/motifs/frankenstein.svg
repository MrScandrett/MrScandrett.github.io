<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="fr-spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7ff0ff"/>
      <stop offset="70%" stop-color="#00aacc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a1a24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fr-brass" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#6e5512"/>
    </linearGradient>
    <linearGradient id="fr-glass" x1="0%" y1="0%" x2="1" y2="0">
      <stop offset="0%" stop-color="#80d4ea" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4da6bf" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="fr-mountain" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#2d4250"/>
      <stop offset="50%" stop-color="#17242e"/>
      <stop offset="100%" stop-color="#0b1217"/>
    </linearGradient>
  </defs>

  <!-- Alpine Night Storm Sky -->
  <rect width="320" height="320" fill="#091218"/>

  <!-- Jagged Mont Blanc & Glacier Peaks in Distance -->
  <polygon points="0,210 65,130 110,175 185,95 240,160 320,110 320,320 0,320" fill="url(#fr-mountain)"/>
  <!-- Glacial Ice Ridge Highlights -->
  <polygon points="185,95 188,145 160,185 185,150" fill="#aee6f2" opacity="0.35"/>
  <polygon points="65,130 70,165 50,195 65,170" fill="#aee6f2" opacity="0.3"/>

  <!-- Atmospheric Ionization Rings -->
  <ellipse cx="160" cy="140" rx="90" ry="90" fill="url(#fr-spark-glow)" opacity="0.6"/>
  <circle cx="160" cy="140" r="55" stroke="#7ff0ff" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Laboratory Spark Gap Electrodes (Galvanic Apparatus) -->
  <!-- Left Brass Conductor Pillar -->
  <g id="left-electrode">
    <!-- Stepped Brass Base -->
    <rect x="35" y="260" width="40" height="15" fill="url(#fr-brass)" stroke="#42330a" stroke-width="1.5"/>
    <!-- Fluted Glass Insulator Column -->
    <rect x="47" y="160" width="16" height="100" fill="url(#fr-glass)" stroke="#2b5e6e" stroke-width="1.2"/>
    <ellipse cx="55" cy="180" rx="12" ry="5" fill="url(#fr-glass)"/>
    <ellipse cx="55" cy="210" rx="12" ry="5" fill="url(#fr-glass)"/>
    <ellipse cx="55" cy="240" rx="12" ry="5" fill="url(#fr-glass)"/>
    <!-- Terminal Rod extending right toward center -->
    <rect x="52" y="136" width="6" height="24" fill="url(#fr-brass)"/>
    <line x1="55" y1="140" x2="105" y2="140" stroke="url(#fr-brass)" stroke-width="5"/>
    <!-- Brass Spark Sphere -->
    <circle cx="108" cy="140" r="14" fill="url(#fr-brass)" stroke="#42330a" stroke-width="1.5"/>
    <circle cx="104" cy="136" r="4" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Right Brass Conductor Pillar -->
  <g id="right-electrode">
    <rect x="245" y="260" width="40" height="15" fill="url(#fr-brass)" stroke="#42330a" stroke-width="1.5"/>
    <rect x="257" y="160" width="16" height="100" fill="url(#fr-glass)" stroke="#2b5e6e" stroke-width="1.2"/>
    <ellipse cx="265" cy="180" rx="12" ry="5" fill="url(#fr-glass)"/>
    <ellipse cx="265" cy="210" rx="12" ry="5" fill="url(#fr-glass)"/>
    <ellipse cx="265" cy="240" rx="12" ry="5" fill="url(#fr-glass)"/>
    <rect x="262" y="136" width="6" height="24" fill="url(#fr-brass)"/>
    <line x1="265" y1="140" x2="215" y2="140" stroke="url(#fr-brass)" stroke-width="5"/>
    <circle cx="212" cy="140" r="14" fill="url(#fr-brass)" stroke="#42330a" stroke-width="1.5"/>
    <circle cx="208" cy="136" r="4" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- THE GALVANIC SPARK / ELECTRIC ARC (The Spark of Being) -->
  <g id="galvanic-lightning">
    <!-- Outer Glow Lightning Arc -->
    <path d="M122 140 L135 125 L145 145 L158 115 L170 152 L185 130 L198 140" stroke="#7ff0ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
    <!-- Intense White Core Arc -->
    <path d="M122 140 L135 125 L145 145 L158 115 L170 152 L185 130 L198 140" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Forked Tendrils branching off arc -->
    <path d="M145 145 L140 168 L148 180" stroke="#7ff0ff" stroke-width="1.8" fill="none"/>
    <path d="M158 115 L165 92 L158 80" stroke="#7ff0ff" stroke-width="1.8" fill="none"/>
    <path d="M170 152 L178 172 L172 188" stroke="#7ff0ff" stroke-width="1.8" fill="none"/>
    <path d="M185 130 L192 110 L188 98" stroke="#7ff0ff" stroke-width="1.8" fill="none"/>
  </g>

  <!-- Heavy Laboratory Bench Surface -->
  <rect x="0" y="275" width="320" height="45" fill="#141a20" stroke="#080c10" stroke-width="2"/>
  <line x1="0" y1="275" x2="320" y2="275" stroke="#3fd8ec" stroke-width="1" opacity="0.4"/>
</svg>