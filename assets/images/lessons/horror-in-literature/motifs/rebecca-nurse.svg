<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="rn-wood" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#3d3023"/>
      <stop offset="50%" stop-color="#241c14"/>
      <stop offset="100%" stop-color="#120e0a"/>
    </linearGradient>
    <linearGradient id="rn-sunbeam" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8d6" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffd36e" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#d6b34a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#131313" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rn-bible" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#fdfcf7"/>
      <stop offset="100%" stop-color="#dfd6c0"/>
    </linearGradient>
    <linearGradient id="rn-gold" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="50%" stop-color="#d6b34a"/>
      <stop offset="100%" stop-color="#735c1a"/>
    </linearGradient>
  </defs>

  <!-- Salem 1692 Heavy Timber Meetinghouse Chamber -->
  <rect width="320" height="320" fill="#111111"/>

  <!-- Leaded Diamond-Pane Meetinghouse Window (Upper-Left) -->
  <g stroke="#3a3a3a" stroke-width="1.5" fill="#1f2326">
    <rect x="25" y="20" width="90" height="110" rx="3"/>
    <!-- Diamond lattice lead cames -->
    <path d="M25 50 L70 20 L115 50 L70 80 Z"/>
    <path d="M25 80 L70 50 L115 80 L70 110 Z"/>
    <path d="M25 110 L70 80 L115 110 L70 130 Z"/>
    <line x1="70" y1="20" x2="70" y2="130" stroke="#555" stroke-width="2"/>
    <line x1="25" y1="75" x2="115" y2="75" stroke="#555" stroke-width="2"/>
  </g>

  <!-- Divine Sunbeam Pouring Through Leaded Window (Exposing False Witness) -->
  <polygon points="35,25 110,25 295,300 120,320" fill="url(#rn-sunbeam)" opacity="0.6"/>

  <!-- Heavy Puritan Oak Communion / Magistrate Table -->
  <polygon points="15,225 305,225 320,320 0,320" fill="url(#rn-wood)" stroke="#080605" stroke-width="2"/>
  <line x1="0" y1="240" x2="320" y2="240" stroke="#4a3b2b" stroke-width="2"/>

  <!-- THE 39 NEIGHBORS' BRAVE PETITION FOR REBECCA NURSE -->
  <g transform="translate(42, 238) rotate(-7)">
    <polygon points="0,0 95,-6 102,52 6,58" fill="#eae2cb" stroke="#6e6349" stroke-width="1"/>
    <!-- Petition text lines -->
    <path d="M12,6 h75 M12,14 h72 M12,22 h76 M12,30 h70 M12,38 h60" stroke="#332a1e" stroke-width="1" opacity="0.6"/>
    <!-- Neighbor signature columns -->
    <path d="M15,44 h20 M42,44 h22 M70,44 h18" stroke="#1f180f" stroke-width="1.2" opacity="0.75"/>
    <!-- Red sealing wax mark -->
    <circle cx="86" cy="46" r="6" fill="#8c1a1a"/>
  </g>

  <!-- Antique Iron Inkwell and Upright Goose Quill -->
  <g transform="translate(148, 222)">
    <!-- Pewter / Iron Inkpot -->
    <rect x="8" y="16" width="18" height="14" rx="2" fill="#2d2d2d" stroke="#111" stroke-width="1"/>
    <ellipse cx="17" cy="16" rx="7" ry="2" fill="#444"/>
    <!-- White Goose Feather Quill standing upright -->
    <path d="M17 16 C22 0 45 -25 55 -40 C48 -25 32 -10 19 16 Z" fill="#ffffff" stroke="#c2bcb0" stroke-width="0.75"/>
    <line x1="17" y1="16" x2="55" y2="-40" stroke="#ded8cc" stroke-width="1"/>
  </g>

  <!-- THE OPEN GENEVA BIBLE (Deuteronomy 19:15: One witness shall not rise against a man) -->
  <g id="geneva-bible" transform="translate(182, 195) rotate(4)">
    <!-- Dark Calfskin Leather Binding -->
    <polygon points="0,28 55,10 110,28 105,68 55,48 5,68" fill="#241910" stroke="#0f0a06" stroke-width="1.5"/>
    <!-- Left Open Page -->
    <polygon points="5,25 52,10 52,48 5,64" fill="url(#rn-bible)" stroke="#877a61" stroke-width="1"/>
    <path d="M10,22 h36 M10,28 h36 M10,34 h36 M10,40 h36 M10,46 h30" stroke="#241d13" stroke-width="1" opacity="0.6"/>
    <!-- Right Open Page -->
    <polygon points="58,10 105,25 105,64 58,48" fill="url(#rn-bible)" stroke="#877a61" stroke-width="1"/>
    <path d="M64,22 h36 M64,28 h36 M64,34 h36 M64,40 h36 M64,46 h28" stroke="#241d13" stroke-width="1" opacity="0.6"/>
    <!-- Golden Ribbon Marker -->
    <path d="M55 10 Q62 30 54 62" stroke="url(#rn-gold)" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Dignified Silhouette of Rebecca Nurse's White Linen Puritan Bonnet (Coif) in the Light -->
  <g transform="translate(230, 85)" opacity="0.85" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))">
    <!-- Gentle Coif Cap Profile -->
    <path d="M35 15 C15 15 5 35 10 65 C15 78 28 85 45 82 C55 80 60 70 58 50 C55 25 45 15 35 15 Z" fill="#fcfaf2" stroke="#d5cebd" stroke-width="1.2"/>
    <path d="M30 45 C28 58 35 72 45 76" stroke="#e8e2d3" stroke-width="1.5" fill="none"/>
    <!-- Bonnet Ribbon Ties -->
    <path d="M25 80 C20 95 15 108 22 120" stroke="#fcfaf2" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>