<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="bm-cameo-skin" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fff8f5"/>
      <stop offset="50%" stop-color="#fae3dc"/>
      <stop offset="100%" stop-color="#e8bfb5"/>
    </radialGradient>
    <radialGradient id="bm-hand-mark" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff4766"/>
      <stop offset="45%" stop-color="#d41539"/>
      <stop offset="85%" stop-color="#8c0a20"/>
      <stop offset="100%" stop-color="#540513"/>
    </radialGradient>
    <linearGradient id="bm-gold-frame" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#a68020"/>
      <stop offset="100%" stop-color="#594008"/>
    </linearGradient>
    <linearGradient id="bm-elixir" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#ffccd5" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#e63956" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#99142d" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Ornate Alchemical Cameo Frame -->
  <g id="cameo-portrait">
    <!-- Cast Shadow -->
    <ellipse cx="160" cy="165" rx="98" ry="118" fill="#1a080d" opacity="0.7"/>

    <!-- Outer Gold Filigree Bezel -->
    <ellipse cx="160" cy="155" rx="95" ry="115" fill="url(#bm-gold-frame)" stroke="#382504" stroke-width="2"/>
    <ellipse cx="160" cy="155" rx="88" ry="108" fill="#24080f"/>
    <!-- Beaded Filigree Ring -->
    <ellipse cx="160" cy="155" rx="84" ry="104" stroke="url(#bm-gold-frame)" stroke-width="2" stroke-dasharray="3 4" fill="none"/>

    <!-- Porcelain Cameo Oval (Georgiana's Cheek) -->
    <ellipse cx="160" cy="155" rx="78" ry="98" fill="url(#bm-cameo-skin)"/>

    <!-- THE CRIMSON HAND (The Fatal Birth-mark) -->
    <!-- Modeled with delicate anatomy: miniature fairy hand on the pale cheek -->
    <g id="crimson-hand" transform="translate(130, 115) scale(0.95)" filter="drop-shadow(0 2px 6px rgba(161,15,42,0.45))">
      <!-- Palm mass -->
      <path d="M22 45 C15 38 18 24 28 22 C38 20 45 28 48 38 C50 48 42 56 32 55 C25 54 22 50 22 45 Z" fill="url(#bm-hand-mark)"/>

      <!-- Thumb (curving gracefully to left) -->
      <path d="M24 35 C15 32 8 38 6 44 C5 48 10 50 16 46 C22 42 24 38 24 35 Z" fill="url(#bm-hand-mark)"/>

      <!-- Index Finger -->
      <path d="M25 24 C24 14 26 4 30 1 C33 -2 36 2 36 10 C36 16 34 22 32 25 Z" fill="url(#bm-hand-mark)"/>

      <!-- Middle Finger (Longest) -->
      <path d="M33 22 C34 11 38 -1 42 -4 C45 -6 48 -2 47 8 C46 15 42 22 40 24 Z" fill="url(#bm-hand-mark)"/>

      <!-- Ring Finger -->
      <path d="M41 24 C44 14 49 4 53 1 C56 -1 58 3 57 11 C55 17 50 24 47 26 Z" fill="url(#bm-hand-mark)"/>

      <!-- Little Finger -->
      <path d="M48 29 C53 22 59 14 63 12 C66 10 68 14 65 20 C62 26 56 32 53 34 Z" fill="url(#bm-hand-mark)"/>

      <!-- Soft Rosy Aura around the birth-mark -->
      <circle cx="38" cy="28" r="32" fill="#ff4766" opacity="0.12"/>
    </g>
  </g>

  <!-- Alchemical Glassware & Botanical Flora Entwined -->
  <!-- Glass Alembic Condenser Coil (Right foreground) -->
  <g id="alchemical-retort">
    <!-- Glass Bulb with glowing elixir -->
    <ellipse cx="235" cy="235" rx="35" ry="32" fill="url(#bm-elixir)" stroke="#ffffff" stroke-width="1.2"/>
    <ellipse cx="230" cy="225" rx="16" ry="8" fill="#ffffff" opacity="0.6"/>
    <!-- Glass Condenser Neck / Tube rising -->
    <path d="M225 205 C220 170 245 150 250 120" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.75"/>
    <path d="M225 205 C220 170 245 150 250 120" stroke="#e63956" stroke-width="1.5" fill="none"/>
    <!-- Rising Elixir Bubbles -->
    <circle cx="232" cy="242" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="242" cy="232" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="225" cy="228" r="2.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- The Mortal White Lily (Left foreground, with one decaying petal) -->
  <g id="white-lily" transform="translate(42, 195) rotate(-15)">
    <!-- Lily Petals -->
    <path d="M35 35 C20 15 10 0 18 -15 C26 -2 35 15 35 35 Z" fill="#ffffff" stroke="#c9bfb7" stroke-width="1"/>
    <path d="M35 35 C45 10 60 -5 68 -2 C65 15 50 25 35 35 Z" fill="#fcfaf7" stroke="#c9bfb7" stroke-width="1"/>
    <path d="M35 35 C15 25 0 20 -8 28 C5 36 20 38 35 35 Z" fill="#ffffff" stroke="#c9bfb7" stroke-width="1"/>
    <!-- Golden Pollen Stamens -->
    <line x1="35" y1="35" x2="30" y2="12" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="30" cy="12" r="2" fill="#d4af37"/>
    <line x1="35" y1="35" x2="42" y2="14" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="42" cy="14" r="2" fill="#d4af37"/>
    <!-- One Decaying Petal Drooping (Nature asserting mortality) -->
    <path d="M35 35 C42 45 52 55 58 65 C48 60 40 50 35 35 Z" fill="#9c7849" stroke="#664d29" stroke-width="1"/>
  </g>
</svg>