<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="wow-sunset" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff7b3d"/>
      <stop offset="35%" stop-color="#ab3211"/>
      <stop offset="70%" stop-color="#4d1205"/>
      <stop offset="100%" stop-color="#140401"/>
    </radialGradient>
    <radialGradient id="wow-heat-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff176"/>
      <stop offset="60%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wow-metal" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#54595e"/>
      <stop offset="45%" stop-color="#2c3033"/>
      <stop offset="100%" stop-color="#131517"/>
    </linearGradient>
    <linearGradient id="wow-weed" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#a8192d"/>
      <stop offset="100%" stop-color="#40060e"/>
    </linearGradient>
  </defs>

  <!-- Fiery Surrey Sunset with Martian Smoke -->
  <rect width="320" height="320" fill="url(#wow-sunset)"/>

  <!-- Distant Martian Red Planet in Upper Sky -->
  <circle cx="260" cy="55" r="16" fill="#c43d23"/>
  <circle cx="258" cy="53" r="14" fill="#e05334"/>
  <circle cx="255" cy="50" r="4" fill="#ffffff" opacity="0.3"/>

  <!-- Distant English Countryside Silhouette & Surrey Church Spire -->
  <polygon points="0,270 95,255 180,265 240,240 248,215 256,240 280,250 320,245 320,320 0,320" fill="#0d0402"/>

  <!-- Creeping Martian Red Weed Tendrils in Foreground -->
  <g fill="none" stroke="url(#wow-weed)" stroke-width="3" stroke-linecap="round">
    <path d="M0 290 Q45 270 85 285 T170 275 T260 295 T320 280"/>
    <path d="M20 310 Q65 295 110 305 T200 295 T290 310"/>
    <!-- Climbing Tendril Branches -->
    <path d="M60 280 C65 260 55 245 48 235" stroke-width="2"/>
    <path d="M140 280 C145 255 160 240 168 225" stroke-width="2"/>
    <path d="M280 290 C285 270 275 255 268 240" stroke-width="2"/>
  </g>

  <!-- THE MARTIAN FIGHTING-MACHINE TRIPOD -->
  <g id="martian-tripod" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.8))">
    <!-- Back Stride Leg -->
    <path d="M152 110 L195 185 L225 270" stroke="#1c1f21" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="195" cy="185" r="6" fill="#2c3033" stroke="#0f1112" stroke-width="1.5"/>

    <!-- Left Foreground Stride Leg -->
    <path d="M142 112 L105 180 L75 275" stroke="url(#wow-metal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="105" cy="180" r="7" fill="#42474d" stroke="#14171a" stroke-width="1.5"/>
    <!-- Articulated foot pad -->
    <ellipse cx="75" cy="275" rx="8" ry="3" fill="#14171a"/>

    <!-- Right Foreground Stride Leg -->
    <path d="M158 112 L180 178 L205 275" stroke="url(#wow-metal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="180" cy="178" r="7" fill="#42474d" stroke="#14171a" stroke-width="1.5"/>
    <ellipse cx="205" cy="275" rx="8" ry="3" fill="#14171a"/>

    <!-- Carapace Hood / Armored Head of the Tripod -->
    <path d="M125 105 C125 78 175 78 175 105 C175 120 165 128 150 128 C135 128 125 120 125 105 Z" fill="url(#wow-metal)" stroke="#0e1012" stroke-width="2"/>

    <!-- Green Glowing Visual Sensor / Observation Eye -->
    <ellipse cx="150" cy="98" rx="14" ry="7" fill="#103828" stroke="#0e1012" stroke-width="1"/>
    <ellipse cx="150" cy="98" rx="11" ry="5" fill="#48d689"/>
    <ellipse cx="150" cy="98" rx="5" ry="2" fill="#ffffff"/>

    <!-- Jointed Tentacles Draping Beneath Head -->
    <path d="M138 125 C132 145 140 165 135 185" stroke="#2c3033" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M162 125 C168 145 160 165 165 185" stroke="#2c3033" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Heat-Ray Generator Projector Arm -->
    <line x1="165" y1="115" x2="195" y2="125" stroke="#42474d" stroke-width="4"/>
    <circle cx="196" cy="125" r="7" fill="#d97706" stroke="#14171a" stroke-width="1.5"/>

    <!-- SEARING HEAT-RAY BEAM (Focus of destruction) -->
    <!-- Concentrated beam blast -->
    <line x1="196" y1="125" x2="275" y2="255" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round"/>
    <line x1="196" y1="125" x2="275" y2="255" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Beam muzzle flare & impact burst -->
    <circle cx="196" cy="125" r="14" fill="url(#wow-heat-glow)"/>
    <circle cx="275" cy="255" r="18" fill="url(#wow-heat-glow)"/>
  </g>
</svg>