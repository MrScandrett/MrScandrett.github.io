<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="usher-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f2d5"/>
      <stop offset="50%" stop-color="#b8cca0" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#6b856e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#17201d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="usher-stone" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#4a5e56"/>
      <stop offset="50%" stop-color="#2c3a35"/>
      <stop offset="100%" stop-color="#161f1c"/>
    </linearGradient>
    <linearGradient id="usher-fissure-glow" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#ff7373"/>
      <stop offset="60%" stop-color="#d93b3b"/>
      <stop offset="100%" stop-color="#801010"/>
    </linearGradient>
    <linearGradient id="usher-tarn" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#16221e"/>
      <stop offset="40%" stop-color="#0e1714"/>
      <stop offset="100%" stop-color="#050a08"/>
    </linearGradient>
  </defs>

  <!-- Oppressive Pale Moon Behind Central Spire -->
  <circle cx="160" cy="85" r="70" fill="url(#usher-moon)"/>
  <circle cx="160" cy="85" r="32" fill="#dcebc7" opacity="0.8"/>

  <!-- Low Slate Storm Clouds -->
  <path d="M0 60 C60 45 120 75 190 55 C250 40 280 65 320 50 L320 0 L0 0 Z" fill="#1b2622" opacity="0.6"/>
  <path d="M0 90 C70 80 150 100 230 85 C280 75 300 95 320 85 L320 0 L0 0 Z" fill="#141d1a" opacity="0.4"/>

  <!-- THE GOTHIC HOUSE OF USHER -->
  <g id="usher-manor">
    <!-- Left Tower with Spire & Machicolations -->
    <polygon points="55,105 75,35 95,105" fill="#222e29" stroke="#121a17" stroke-width="1.5"/>
    <rect x="52" y="105" width="46" height="120" fill="url(#usher-stone)" stroke="#121a17" stroke-width="1.5"/>
    <!-- Battlements -->
    <rect x="50" y="102" width="10" height="8" fill="#36453f"/>
    <rect x="70" y="102" width="10" height="8" fill="#36453f"/>
    <rect x="90" y="102" width="10" height="8" fill="#36453f"/>
    <!-- Left Eyelike Arched Windows -->
    <path d="M68 130 C68 122 82 122 82 130 V155 H68 Z" fill="#d5e8b3" opacity="0.85" stroke="#121a17" stroke-width="1.5"/>
    <line x1="75" y1="125" x2="75" y2="155" stroke="#121a17" stroke-width="1"/>
    <line x1="68" y1="142" x2="82" y2="142" stroke="#121a17" stroke-width="1"/>

    <!-- Right Tower with Spire -->
    <polygon points="225,105 245,35 265,105" fill="#222e29" stroke="#121a17" stroke-width="1.5"/>
    <rect x="222" y="105" width="46" height="120" fill="url(#usher-stone)" stroke="#121a17" stroke-width="1.5"/>
    <rect x="220" y="102" width="10" height="8" fill="#36453f"/>
    <rect x="240" y="102" width="10" height="8" fill="#36453f"/>
    <rect x="260" y="102" width="10" height="8" fill="#36453f"/>
    <!-- Right Eyelike Arched Windows -->
    <path d="M238 130 C238 122 252 122 252 130 V155 H238 Z" fill="#d5e8b3" opacity="0.85" stroke="#121a17" stroke-width="1.5"/>
    <line x1="245" y1="125" x2="245" y2="155" stroke="#121a17" stroke-width="1"/>
    <line x1="238" y1="142" x2="252" y2="142" stroke="#121a17" stroke-width="1"/>

    <!-- Center Great Hall & Soaring Central Gable -->
    <polygon points="98,135 160,65 222,135" fill="#273630" stroke="#121a17" stroke-width="1.5"/>
    <rect x="98" y="135" width="124" height="90" fill="url(#usher-stone)" stroke="#121a17" stroke-width="1.5"/>
    <!-- Central Gothic Lancet Window -->
    <path d="M148 115 C148 95 172 95 172 115 V150 H148 Z" fill="#d5e8b3" opacity="0.9" stroke="#121a17" stroke-width="1.5"/>
    <line x1="160" y1="100" x2="160" y2="150" stroke="#121a17" stroke-width="1"/>
    <line x1="148" y1="130" x2="172" y2="130" stroke="#121a17" stroke-width="1"/>
    <!-- Great Arched Portal Entrance -->
    <path d="M145 190 C145 175 175 175 175 190 V225 H145 Z" fill="#0c1210" stroke="#121a17" stroke-width="2"/>

    <!-- Overgrown Fungi & Faint Sedges on Masonry -->
    <path d="M52 210 Q65 195 75 225 M222 212 Q235 198 248 225" stroke="#5c7a62" stroke-width="2" fill="none"/>
  </g>

  <!-- THE ZIGZAG FISSURE (Splitting the mansion from roofline to tarn) -->
  <g id="the-fissure">
    <!-- Glowing red stress fracture -->
    <path d="M160 65 L155 92 L164 118 L152 145 L168 178 L156 205 L162 225" stroke="url(#usher-fissure-glow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Fissure crack shadow -->
    <path d="M161 65 L156 92 L165 118 L153 145 L169 178 L157 205 L163 225" stroke="#000000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- THE BLACK AND LURID TARN (Mirror surface reflecting the house) -->
  <rect x="0" y="225" width="320" height="95" fill="url(#usher-tarn)"/>
  <line x1="0" y1="225" x2="320" y2="225" stroke="#3b4d46" stroke-width="1.5"/>

  <!-- Inverted Reflection of Manor in the Tarn Waters -->
  <g opacity="0.35" transform="translate(0, 450) scale(1, -1)">
    <polygon points="55,105 75,35 95,105" fill="#1f2c27"/>
    <rect x="52" y="105" width="46" height="120" fill="#25332e"/>
    <polygon points="225,105 245,35 265,105" fill="#1f2c27"/>
    <rect x="222" y="105" width="46" height="120" fill="#25332e"/>
    <polygon points="98,135 160,65 222,135" fill="#22302a"/>
    <rect x="98" y="135" width="124" height="90" fill="#25332e"/>
    <path d="M68 130 C68 122 82 122 82 130 V155 H68 Z" fill="#d5e8b3" opacity="0.5"/>
    <path d="M238 130 C238 122 252 122 252 130 V155 H238 Z" fill="#d5e8b3" opacity="0.5"/>
    <path d="M148 115 C148 95 172 95 172 115 V150 H148 Z" fill="#d5e8b3" opacity="0.6"/>
    <!-- Inverted Fissure in Water -->
    <path d="M160 65 L155 92 L164 118 L152 145 L168 178 L156 205 L162 225" stroke="#d93b3b" stroke-width="2" fill="none"/>
  </g>

  <!-- Ripples on Tarn Surface -->
  <g stroke="#567064" stroke-width="1" opacity="0.6" fill="none">
    <ellipse cx="160" cy="235" rx="55" ry="4"/>
    <ellipse cx="140" cy="250" rx="80" ry="5"/>
    <ellipse cx="180" cy="268" rx="110" ry="6"/>
    <ellipse cx="150" cy="288" rx="135" ry="7"/>
  </g>
</svg>