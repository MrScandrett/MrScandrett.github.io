<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="gb-glow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff99bb" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#c43d68" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#3d1522" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06130d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gb-ribbon" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd4e5"/>
      <stop offset="35%" stop-color="#ff8fb8"/>
      <stop offset="70%" stop-color="#e65c8a"/>
      <stop offset="100%" stop-color="#b32d59"/>
    </linearGradient>
    <linearGradient id="gb-forest" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#143022"/>
      <stop offset="50%" stop-color="#0b1c14"/>
      <stop offset="100%" stop-color="#040b08"/>
    </linearGradient>
    <linearGradient id="gb-fire" x1="0%" y1="1" x2="0%" y2="0">
      <stop offset="0%" stop-color="#ffaa3b"/>
      <stop offset="50%" stop-color="#e84a27"/>
      <stop offset="100%" stop-color="#801515" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark Primeval Forest Backdrop -->
  <rect width="320" height="320" fill="url(#gb-forest)"/>

  <!-- Distant Blazing Witch Altar Glow in the Forest Depths -->
  <circle cx="230" cy="180" r="100" fill="url(#gb-glow)"/>
  <!-- Smoky Altar Embers -->
  <polygon points="215,220 225,140 235,170 245,130 255,220" fill="url(#gb-fire)" opacity="0.45"/>
  <circle cx="228" cy="148" r="2" fill="#ffd4e5" opacity="0.8"/>
  <circle cx="242" cy="138" r="2.5" fill="#ffd4e5" opacity="0.8"/>
  <circle cx="235" cy="120" r="1.5" fill="#ffb3cf" opacity="0.6"/>

  <!-- Towering Hemlock and Pine Silhouettes -->
  <g fill="#08140e" stroke="#030805" stroke-width="0.5">
    <!-- Trunk Left -->
    <path d="M15 0 L25 320 H0 V0 Z"/>
    <!-- Branch Left -->
    <path d="M22 65 C45 60 75 75 105 70 C85 78 55 82 22 80 Z"/>
    <path d="M23 125 C55 118 90 135 125 125 C100 136 65 140 23 138 Z"/>
    <!-- Trunk Center-Left -->
    <path d="M85 0 L95 320 H70 V0 Z"/>
    <path d="M92 90 C120 85 155 100 185 92 C160 102 125 105 92 102 Z"/>
    <path d="M80 160 C55 170 35 185 15 205 C35 195 60 185 82 178 Z"/>
    <!-- Right Foreground Gnarled Tree -->
    <path d="M295 0 C285 80 290 160 280 240 C275 280 260 305 250 320 H320 V0 Z"/>
    <path d="M285 75 C255 70 220 82 190 75 C218 85 252 86 284 88 Z"/>
    <path d="M280 145 C245 140 210 155 180 150 C210 160 245 160 278 158 Z"/>
  </g>

  <!-- The Traveler's Serpent-Like Walking Staff at Base -->
  <g id="serpent-staff">
    <path d="M45 285 C85 272 135 295 185 278 C230 264 270 280 295 270" stroke="#3b2612" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Carved Snake Head Feature on Staff -->
    <path d="M285 272 C295 268 305 270 308 274 C305 278 295 278 288 276 Z" fill="#24170a" stroke="#120c05" stroke-width="1"/>
    <circle cx="302" cy="272" r="1.2" fill="#ff8fb8"/>
  </g>

  <!-- FAITH'S PINK SATIN RIBBON (Fluttering Down from the Boughs) -->
  <g id="pink-ribbon" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.7))">
    <!-- Ribbon Bow Knot -->
    <ellipse cx="160" cy="115" rx="8" ry="7" fill="#b32d59"/>
    <circle cx="160" cy="115" r="5" fill="#ff8fb8"/>

    <!-- Left Loop of Bow -->
    <path d="M156 113 C140 95 110 85 105 105 C100 125 130 130 154 118 Z" fill="url(#gb-ribbon)" stroke="#80193b" stroke-width="1.2"/>
    <!-- Inner fold highlight -->
    <path d="M148 111 C135 100 118 95 114 106 C112 115 128 120 146 116 Z" fill="#ffd4e5" opacity="0.6"/>

    <!-- Right Loop of Bow -->
    <path d="M164 113 C180 95 210 85 215 105 C220 125 190 130 166 118 Z" fill="url(#gb-ribbon)" stroke="#80193b" stroke-width="1.2"/>
    <path d="M172 111 C185 100 202 95 206 106 C208 115 192 120 174 116 Z" fill="#ffd4e5" opacity="0.6"/>

    <!-- Left Flowing Satin Tail (graceful S-curve floating in the breeze) -->
    <path d="M157 120 C145 140 125 155 132 178 C138 200 118 215 110 235 L122 238 C132 218 152 205 144 182 C138 160 156 142 163 122 Z" fill="url(#gb-ribbon)" stroke="#80193b" stroke-width="1"/>
    <!-- Satin highlight line -->
    <path d="M160 122 C148 142 128 158 135 180 C140 202 122 218 116 236" stroke="#fff0f6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Right Flowing Satin Tail (swirling toward foreground) -->
    <path d="M163 120 C175 145 198 165 188 192 C180 215 195 235 205 255 L195 258 C182 238 168 215 176 190 C184 165 165 142 159 122 Z" fill="url(#gb-ribbon)" stroke="#80193b" stroke-width="1"/>
    <path d="M161 122 C172 146 195 167 185 192 C178 214 192 236 200 256" stroke="#fff0f6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>
</svg>