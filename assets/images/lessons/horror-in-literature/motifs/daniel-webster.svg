<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="dw-sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1b3354"/>
      <stop offset="50%" stop-color="#0f1b2e"/>
      <stop offset="100%" stop-color="#060b13"/>
    </radialGradient>
    <linearGradient id="dw-brass" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="40%" stop-color="#e8c76a"/>
      <stop offset="80%" stop-color="#a68430"/>
      <stop offset="100%" stop-color="#594210"/>
    </linearGradient>
    <linearGradient id="dw-parchment" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#dfd0ab"/>
      <stop offset="70%" stop-color="#b8a172"/>
      <stop offset="100%" stop-color="#3b2612"/>
    </linearGradient>
    <linearGradient id="dw-fire" x1="0%" y1="1" x2="0%" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffcc00"/>
      <stop offset="70%" stop-color="#ff4400"/>
      <stop offset="100%" stop-color="#8c0000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- New Hampshire Night Sky -->
  <rect width="320" height="320" fill="url(#dw-sky)"/>

  <!-- Mount Monadnock Distant Silhouette -->
  <polygon points="0,230 75,175 145,210 210,165 285,215 320,195 320,320 0,320" fill="#0b1320"/>

  <!-- Northern Stars -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="85" cy="55" r="1.5"/>
    <circle cx="120" cy="42" r="1"/>
    <circle cx="160" cy="30" r="2"/>
    <circle cx="215" cy="48" r="1.2"/>
    <circle cx="255" cy="65" r="1.5"/>
    <circle cx="190" cy="75" r="1"/>
  </g>

  <!-- Heavy Oak Table / Courtroom Bar -->
  <polygon points="20,270 300,270 320,320 0,320" fill="#171e29" stroke="#0a0d12" stroke-width="1.5"/>
  <line x1="0" y1="285" x2="320" y2="285" stroke="#253245" stroke-width="2"/>

  <!-- THE BURNING DEED / MORTGAGE CONTRACT (Jabez Stone's bargain) -->
  <g id="burning-contract" transform="translate(45, 235) rotate(-8)">
    <polygon points="0,0 85,-10 95,45 10,55" fill="url(#dw-parchment)" stroke="#5e492b" stroke-width="1"/>
    <!-- Blackletter text lines -->
    <path d="M12,5 h60 M12,12 h65 M12,19 h55 M12,26 h62" stroke="#261b0f" stroke-width="1.2" opacity="0.6" stroke-dasharray="4 2 6 2"/>
    <!-- The Faustian Blood Signature Seal -->
    <circle cx="72" cy="38" r="7" fill="#8c1212"/>
    <!-- Burning Edge with Glowing Fire & Ash -->
    <polygon points="75,-12 95,-10 98,25 72,15" fill="url(#dw-fire)"/>
    <polygon points="85,15 102,40 88,48 76,28" fill="url(#dw-fire)"/>
    <!-- Embers floating upward -->
    <circle cx="82" cy="-18" r="1.5" fill="#ffcc00"/>
    <circle cx="95" cy="-8" r="2" fill="#ffcc00"/>
    <circle cx="104" cy="12" r="1.5" fill="#ff8800"/>
  </g>

  <!-- THE MAJESTIC BRASS SCALES OF JUSTICE -->
  <g id="scales-of-justice" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.7))">
    <!-- Molded Stepped Base -->
    <ellipse cx="160" cy="275" rx="38" ry="10" fill="url(#dw-brass)" stroke="#42300b" stroke-width="1.5"/>
    <ellipse cx="160" cy="271" rx="28" ry="7" fill="url(#dw-brass)"/>

    <!-- Fluted Central Brass Column / Pillar -->
    <rect x="156" y="75" width="8" height="195" fill="url(#dw-brass)" stroke="#42300b" stroke-width="1"/>
    <line x1="160" y1="75" x2="160" y2="270" stroke="#fff0aa" stroke-width="1.5"/>

    <!-- Center Fulcrum & Acorn / Eagle Finial -->
    <circle cx="160" cy="75" r="8" fill="url(#dw-brass)" stroke="#42300b" stroke-width="1.5"/>
    <polygon points="156,67 160,55 164,67" fill="url(#dw-brass)" stroke="#42300b" stroke-width="1"/>

    <!-- Perfectly Balanced Horizontal Beam -->
    <polygon points="65,77 160,73 255,77 255,81 160,77 65,81" fill="url(#dw-brass)" stroke="#42300b" stroke-width="1.2"/>
    <circle cx="65" cy="79" r="4" fill="url(#dw-brass)" stroke="#42300b" stroke-width="1"/>
    <circle cx="255" cy="79" r="4" fill="url(#dw-brass)" stroke="#42300b" stroke-width="1"/>

    <!-- Left Suspended Pan (Truth & Freedom) -->
    <!-- Triple Chains -->
    <line x1="65" y1="81" x2="42" y2="155" stroke="url(#dw-brass)" stroke-width="1.2"/>
    <line x1="65" y1="81" x2="65" y2="155" stroke="url(#dw-brass)" stroke-width="1.2"/>
    <line x1="65" y1="81" x2="88" y2="155" stroke="url(#dw-brass)" stroke-width="1.2"/>
    <!-- Brass Pan Dish -->
    <path d="M38 155 C38 178 92 178 92 155 Z" fill="url(#dw-brass)" stroke="#42300b" stroke-width="1.5"/>
    <ellipse cx="65" cy="155" rx="27" ry="6" fill="#a68430" stroke="#42300b" stroke-width="1"/>
    <!-- Radiant Holy Light in Left Pan -->
    <ellipse cx="65" cy="154" rx="18" ry="4" fill="#ffffff" opacity="0.75"/>

    <!-- Right Suspended Pan (Sin & The Adversary) -->
    <!-- Triple Chains -->
    <line x1="255" y1="81" x2="232" y2="155" stroke="url(#dw-brass)" stroke-width="1.2"/>
    <line x1="255" y1="81" x2="255" y2="155" stroke="url(#dw-brass)" stroke-width="1.2"/>
    <line x1="255" y1="81" x2="278" y2="155" stroke="url(#dw-brass)" stroke-width="1.2"/>
    <!-- Brass Pan Dish -->
    <path d="M228 155 C228 178 282 178 282 155 Z" fill="url(#dw-brass)" stroke="#42300b" stroke-width="1.5"/>
    <ellipse cx="255" cy="155" rx="27" ry="6" fill="#a68430" stroke="#42300b" stroke-width="1"/>
  </g>
</svg>