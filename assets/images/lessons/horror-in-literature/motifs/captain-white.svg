<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="cw-moonbeam" cx="30%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d5e3ed" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#55697a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0e0507" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cw-door" x1="0%" y1="0%" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1217"/>
      <stop offset="60%" stop-color="#452028"/>
      <stop offset="100%" stop-color="#140609"/>
    </linearGradient>
    <linearGradient id="cw-brass" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="50%" stop-color="#d9a87a"/>
      <stop offset="100%" stop-color="#694524"/>
    </linearGradient>
    <linearGradient id="cw-bible" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#faf5ea"/>
      <stop offset="100%" stop-color="#cfbe9b"/>
    </linearGradient>
  </defs>

  <!-- Dark Salem Nocturnal Chamber -->
  <rect width="320" height="320" fill="#0c0406"/>

  <!-- Heavy Molded Salem Doorway Arch (Left) -->
  <path d="M0 0 H140 V320 H0 Z" fill="#14070a"/>
  <!-- Open Doorway revealing moonlit exterior -->
  <path d="M25 40 Q75 15 125 40 V320 H25 Z" fill="#080a10" stroke="#2b1117" stroke-width="2"/>

  <!-- The Shaft of Pale Moonbeam Streaming Across the Floor -->
  <polygon points="45,40 120,40 320,290 140,320" fill="url(#cw-moonbeam)" opacity="0.6"/>

  <!-- Wooden Floorboards -->
  <line x1="0" y1="240" x2="320" y2="240" stroke="#210c11" stroke-width="2"/>
  <line x1="0" y1="270" x2="320" y2="270" stroke="#210c11" stroke-width="2"/>
  <line x1="0" y1="300" x2="320" y2="300" stroke="#210c11" stroke-width="2"/>

  <!-- THE DISTORTED SHADOW OF GUILT (Proverbs 28:1: The wicked flee when no one pursues) -->
  <!-- Long elongated shadow stretching across moonlit floor -->
  <path d="M55 220 C65 205 78 200 85 210 C92 215 95 240 120 250 C160 265 210 270 270 280 C240 288 180 285 130 275 C95 268 70 260 55 250 Z" fill="#050102" opacity="0.85"/>

  <!-- Antique Mahogany Lectern Table in Foreground -->
  <polygon points="135,175 305,175 320,320 120,320" fill="#1c0b0f" stroke="#0a0305" stroke-width="2"/>
  <line x1="135" y1="175" x2="305" y2="175" stroke="#4a1d25" stroke-width="2.5"/>

  <!-- THE OPEN HOLY BIBLE (Divine Conscience & Testimony) -->
  <g id="holy-bible" transform="translate(170, 185)">
    <!-- Leather Binding -->
    <polygon points="0,22 45,8 90,22 86,52 45,35 4,52" fill="#3b151e" stroke="#1a060a" stroke-width="1.5"/>
    <!-- Left Open Page -->
    <polygon points="4,20 43,8 43,36 4,48" fill="url(#cw-bible)" stroke="#6e5737" stroke-width="0.75"/>
    <path d="M8 18h30 M8 24h30 M8 30h30 M8 36h25" stroke="#3b2b1a" stroke-width="1" opacity="0.6"/>
    <!-- Right Open Page -->
    <polygon points="47,8 86,20 86,48 47,36" fill="url(#cw-bible)" stroke="#6e5737" stroke-width="0.75"/>
    <path d="M52 18h30 M52 24h30 M52 30h30 M52 36h22" stroke="#3b2b1a" stroke-width="1" opacity="0.6"/>
    <!-- Scarlet Bookmark Ribbon -->
    <path d="M45 8 Q50 25 44 48" stroke="#a8192d" stroke-width="2" fill="none"/>
  </g>

  <!-- Brass Candlestick with Flickering Flame -->
  <g id="brass-candlestick" transform="translate(280, 150)">
    <!-- Brass Dish & Stem -->
    <ellipse cx="14" cy="48" rx="14" ry="4" fill="url(#cw-brass)" stroke="#38210e" stroke-width="1"/>
    <rect x="12" y="24" width="4" height="24" fill="url(#cw-brass)"/>
    <ellipse cx="14" cy="24" rx="5" ry="2" fill="url(#cw-brass)"/>
    <!-- White Wax Candle -->
    <rect x="12" y="8" width="4" height="16" fill="#fcf9ee" stroke="#ded8c3" stroke-width="0.5"/>
    <!-- Black Wick -->
    <line x1="14" y1="8" x2="14" y2="4" stroke="#222"/>
    <!-- Flickering Flame in Draft -->
    <path d="M14 4 C11 2 10 -4 14 -8 C18 -4 17 2 14 4 Z" fill="#ffb833"/>
    <circle cx="14" cy="-2" r="2" fill="#ffffff"/>
  </g>

  <!-- Faint Translucent Scales of Justice suspended in the Moonbeam -->
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.4" fill="none" transform="translate(180, 50)">
    <line x1="45" y1="10" x2="45" y2="70"/>
    <line x1="10" y1="20" x2="80" y2="20"/>
    <!-- Left Pan -->
    <line x1="10" y1="20" x2="0" y2="45"/>
    <line x1="10" y1="20" x2="20" y2="45"/>
    <path d="M0 45 Q10 52 20 45 Z" fill="#ffffff" opacity="0.2"/>
    <!-- Right Pan -->
    <line x1="80" y1="20" x2="70" y2="45"/>
    <line x1="80" y1="20" x2="90" y2="45"/>
    <path d="M70 45 Q80 52 90 45 Z" fill="#ffffff" opacity="0.2"/>
  </g>
</svg>