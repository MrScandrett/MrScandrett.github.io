<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="tth-pulse-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d5a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a81320" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a050a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tth-heart-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6b76"/>
      <stop offset="50%" stop-color="#c9182b"/>
      <stop offset="90%" stop-color="#730a15"/>
      <stop offset="100%" stop-color="#3d0309"/>
    </radialGradient>
    <linearGradient id="tth-board" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#2b151a"/>
      <stop offset="50%" stop-color="#190a0d"/>
      <stop offset="100%" stop-color="#0d0406"/>
    </linearGradient>
    <linearGradient id="tth-crack-light" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="60%" stop-color="#ff4d5a"/>
      <stop offset="100%" stop-color="#800a14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Concentric Acoustic Sonic Pulse Waves (Heartbeat reverberation) -->
  <g stroke="#ff4d5a" stroke-width="1.5" fill="none">
    <circle cx="160" cy="140" r="45" opacity="0.8" stroke-width="2"/>
    <circle cx="160" cy="140" r="70" opacity="0.6" stroke-dasharray="6 4"/>
    <circle cx="160" cy="140" r="95" opacity="0.4" stroke-dasharray="8 6"/>
    <circle cx="160" cy="140" r="120" opacity="0.25" stroke-dasharray="10 8"/>
    <circle cx="160" cy="140" r="145" opacity="0.12"/>
  </g>

  <!-- Ambient Pulsing Red Glow -->
  <circle cx="160" cy="140" r="65" fill="url(#tth-pulse-glow)"/>

  <!-- Anatomical Heart Silhouette with Arching Great Vessels -->
  <g id="anatomical-heart" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
    <!-- Aorta and Pulmonary Artery trunks rising from top -->
    <!-- Superior Vena Cava (Right) -->
    <path d="M178 95 C176 80 178 68 184 55 L196 58 C192 70 190 82 192 95 Z" fill="#9c1524" stroke="#540810" stroke-width="1.5"/>
    <!-- Aortic Arch (Curving high center) -->
    <path d="M152 92 C148 72 152 52 165 42 C178 32 192 40 195 55 C186 52 176 56 170 68 C166 76 166 85 168 92 Z" fill="#c9182b" stroke="#540810" stroke-width="1.5"/>
    <!-- Brachiocephalic branches branching off arch -->
    <rect x="168" y="34" width="5" height="12" fill="#c9182b" transform="rotate(-10 168 34)"/>
    <rect x="178" y="36" width="5" height="12" fill="#c9182b"/>
    <rect x="187" y="42" width="5" height="10" fill="#c9182b" transform="rotate(15 187 42)"/>
    <!-- Pulmonary Trunk (Left) -->
    <path d="M135 90 C130 75 125 65 118 55 L130 50 C138 62 142 74 146 90 Z" fill="#80101d" stroke="#540810" stroke-width="1.5"/>

    <!-- Main Muscular Ventricular Body -->
    <path d="M125 95 C105 105 92 125 96 148 C100 172 120 198 145 220 C154 228 160 234 163 234 C166 234 172 228 182 218 C208 192 228 165 226 138 C224 115 208 98 188 95 C178 94 170 98 162 104 C154 97 140 92 125 95 Z" fill="url(#tth-heart-grad)" stroke="#4a040b" stroke-width="2"/>

    <!-- Coronary Arteries & Veins (Delicate branching across the muscle) -->
    <g stroke="#ff949c" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M162 106 Q158 135 152 165 Q148 190 156 218"/>
      <!-- Branches -->
      <path d="M158 125 Q145 135 132 142"/>
      <path d="M156 145 Q142 158 128 166"/>
      <path d="M154 170 Q142 182 136 195"/>
      <path d="M154 138 Q168 145 184 148"/>
      <path d="M152 162 Q168 172 188 180"/>
      <path d="M153 186 Q165 195 174 204"/>
    </g>

    <!-- Blue Deoxygenated Venous Vessel Accent -->
    <path d="M165 110 Q168 138 166 170 Q162 195 159 215" stroke="#4868a8" stroke-width="1.2" fill="none" opacity="0.6"/>
  </g>

  <!-- Old Victorian Chamber Floorboards Beneath -->
  <g id="floorboards">
    <!-- Board seams & Planks -->
    <rect x="0" y="240" width="320" height="24" fill="url(#tth-board)"/>
    <line x1="0" y1="240" x2="320" y2="240" stroke="#050102" stroke-width="3"/>
    <!-- Iron Square Nailheads -->
    <rect x="42" y="248" width="4" height="4" fill="#665245"/>
    <rect x="135" y="248" width="4" height="4" fill="#665245"/>
    <rect x="228" y="248" width="4" height="4" fill="#665245"/>
    <rect x="295" y="248" width="4" height="4" fill="#665245"/>

    <rect x="0" y="264" width="320" height="26" fill="url(#tth-board)"/>
    <line x1="0" y1="264" x2="320" y2="264" stroke="#050102" stroke-width="3"/>
    <rect x="75" y="274" width="4" height="4" fill="#665245"/>
    <rect x="180" y="274" width="4" height="4" fill="#665245"/>
    <rect x="260" y="274" width="4" height="4" fill="#665245"/>

    <rect x="0" y="290" width="320" height="30" fill="url(#tth-board)"/>
    <line x1="0" y1="290" x2="320" y2="290" stroke="#050102" stroke-width="3"/>
    <rect x="30" y="302" width="4" height="4" fill="#665245"/>
    <rect x="120" y="302" width="4" height="4" fill="#665245"/>
    <rect x="210" y="302" width="4" height="4" fill="#665245"/>

    <!-- One Floorboard Slightly Ajar / Cracked Open with Light Piercing Through -->
    <polygon points="120,264 205,262 205,266 120,268" fill="#ffd56b"/>
    <polygon points="120,262 140,215 185,215 205,262" fill="url(#tth-crack-light)" opacity="0.45"/>
  </g>
</svg>