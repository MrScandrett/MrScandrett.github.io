<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="nb-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5c4"/>
      <stop offset="50%" stop-color="#e8c24a" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#6a2b9a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1b0b27" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nb-wood" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#4a3223"/>
      <stop offset="50%" stop-color="#2c1e15"/>
      <stop offset="100%" stop-color="#18100a"/>
    </linearGradient>
    <linearGradient id="nb-hat" x1="0%" y1="0%" x2="1" y2="0">
      <stop offset="0%" stop-color="#241433"/>
      <stop offset="45%" stop-color="#4a256e"/>
      <stop offset="75%" stop-color="#7338aa"/>
      <stop offset="100%" stop-color="#1d0e2b"/>
    </linearGradient>
    <linearGradient id="nb-gold" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="60%" stop-color="#e8c24a"/>
      <stop offset="100%" stop-color="#8c6a12"/>
    </linearGradient>
  </defs>

  <!-- Ambient Purple Twilight Moon -->
  <circle cx="160" cy="110" r="85" fill="url(#nb-moon)"/>
  <circle cx="160" cy="110" r="38" fill="#fff6cc" opacity="0.75"/>

  <!-- Covered Bridge Timber Truss Architecture -->
  <g id="bridge-timbers" stroke="#1f112e" stroke-width="2">
    <!-- Bridge Roof Canopy -->
    <polygon points="20,70 160,35 300,70 290,90 160,58 30,90" fill="#241433"/>
    <!-- Heavy King Post & Struts -->
    <line x1="160" y1="58" x2="160" y2="180" stroke="#351d4a" stroke-width="10"/>
    <line x1="45" y1="85" x2="160" y2="150" stroke="#351d4a" stroke-width="7"/>
    <line x1="275" y1="85" x2="160" y2="150" stroke="#351d4a" stroke-width="7"/>
    <!-- Side Timber Railing Posts -->
    <rect x="35" y="80" width="16" height="180" fill="url(#nb-wood)"/>
    <rect x="269" y="80" width="16" height="180" fill="url(#nb-wood)"/>
    <line x1="35" y1="180" x2="285" y2="180" stroke="#2c1e15" stroke-width="6"/>
  </g>

  <!-- Bridge Wooden Plank Floor -->
  <polygon points="10,260 310,260 320,320 0,320" fill="url(#nb-wood)" stroke="#120b06" stroke-width="2"/>
  <line x1="0" y1="280" x2="320" y2="280" stroke="#120b06" stroke-width="1.5"/>
  <line x1="0" y1="300" x2="320" y2="300" stroke="#120b06" stroke-width="1.5"/>

  <!-- THE IRON TURNSTILE AT THE BRIDGE EXIT (Toby Dammit's fatal wager) -->
  <g id="the-turnstile">
    <!-- Cast Shadow -->
    <ellipse cx="160" cy="285" rx="65" ry="18" fill="#08030d" opacity="0.85"/>

    <!-- Central Vertical Iron Post & Flanged Base -->
    <polygon points="152,285 168,285 165,160 155,160" fill="#1f2329" stroke="#0e1014" stroke-width="1.5"/>
    <ellipse cx="160" cy="285" rx="16" ry="6" fill="#2d333b" stroke="#0e1014" stroke-width="1.5"/>
    <circle cx="160" cy="160" r="9" fill="#3a424d" stroke="#0e1014" stroke-width="1.5"/>

    <!-- Four Rotating Cross-Arms (Isometric projection) -->
    <!-- Back Arm -->
    <polygon points="157,162 163,162 161,120 159,120" fill="#181c21" stroke="#0b0d0f" stroke-width="1"/>
    <!-- Left Arm -->
    <polygon points="156,163 158,168 85,188 84,183" fill="#2d333b" stroke="#0e1014" stroke-width="1.5"/>
    <circle cx="85" cy="185" r="3.5" fill="#e8c24a"/>
    <!-- Right Arm -->
    <polygon points="164,163 162,168 235,188 236,183" fill="#3a424d" stroke="#0e1014" stroke-width="1.5"/>
    <circle cx="235" cy="185" r="3.5" fill="#e8c24a"/>
    <!-- Front Arm -->
    <polygon points="158,166 162,166 164,228 156,228" fill="#4d5766" stroke="#0e1014" stroke-width="1.5"/>
    <circle cx="160" cy="228" r="4.5" fill="#e8c24a"/>
  </g>

  <!-- The Gentleman in Black's Paraphernalia -->
  <!-- Dramatic Victorian High Top Hat with Gold Band -->
  <g transform="translate(68, 142) rotate(-12)">
    <!-- Brim -->
    <ellipse cx="40" cy="65" rx="38" ry="12" fill="#1d0e2b" stroke="#0d0514" stroke-width="1.5"/>
    <!-- Crown -->
    <path d="M14 62 L18 10 C18 6 62 6 62 10 L66 62 Z" fill="url(#nb-hat)" stroke="#0d0514" stroke-width="1.5"/>
    <!-- Top Flat Disc -->
    <ellipse cx="40" cy="10" rx="22" ry="6" fill="#34184f" stroke="#0d0514" stroke-width="1"/>
    <!-- Gold Ribbon Band -->
    <path d="M15 54 C25 60 55 60 65 54 L66 62 C55 68 25 68 14 62 Z" fill="url(#nb-gold)" stroke="#6e5209" stroke-width="0.75"/>
  </g>

  <!-- Antique Open Leather Ledger Book with Wager Entries & Golden Feather Quill -->
  <g transform="translate(192, 195) rotate(14)">
    <!-- Leather Cover -->
    <polygon points="0,25 45,5 90,25 86,58 45,38 4,58" fill="#3d1f14" stroke="#1f0d07" stroke-width="1.5"/>
    <!-- Open Parchment Pages -->
    <polygon points="4,22 43,6 43,36 4,54" fill="#ede2c2" stroke="#8c7849" stroke-width="1"/>
    <polygon points="47,6 86,22 86,54 47,36" fill="#f5ecd5" stroke="#8c7849" stroke-width="1"/>
    <!-- Red Ribbon Bookmarker -->
    <path d="M45 6 Q50 25 42 48" stroke="#a31728" stroke-width="2" fill="none"/>
    <!-- Golden Feather Quill resting across pages -->
    <path d="M22 48 C35 35 55 22 78 8 C68 18 52 28 42 42 Z" fill="url(#nb-gold)" stroke="#664d08" stroke-width="0.75"/>
    <line x1="22" y1="48" x2="16" y2="55" stroke="#fff0aa" stroke-width="1.5"/>
  </g>

  <!-- Stylized Black Raven Perched on Bridge Rafter -->
  <g transform="translate(235, 78)">
    <ellipse cx="14" cy="12" rx="8" ry="12" fill="#12071a" transform="rotate(25 14 12)"/>
    <circle cx="10" cy="2" r="5" fill="#12071a"/>
    <polygon points="6,2 0,4 6,6" fill="#e8c24a"/>
    <circle cx="9" cy="1" r="1" fill="#fff"/>
    <path d="M18 12 L28 26 L22 28 Z" fill="#12071a"/>
  </g>
</svg>