<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="lot-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fff5b3"/>
      <stop offset="70%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffa000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lot-box-top" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#302e2c"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="lot-box-side" x1="0%" y1="0%" x2="1" y2="0">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="lot-wood-chip" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#9e7b47"/>
      <stop offset="100%" stop-color="#5c421f"/>
    </linearGradient>
    <radialGradient id="lot-stone" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e0e5e2"/>
      <stop offset="55%" stop-color="#919996"/>
      <stop offset="100%" stop-color="#4d5451"/>
    </radialGradient>
  </defs>

  <!-- Radiant June Summer Sunburst (Irony of a bright clear morning) -->
  <circle cx="160" cy="80" r="75" fill="url(#lot-sun)"/>
  <g stroke="#f2c14e" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="160" y1="0" x2="160" y2="25"/>
    <line x1="216" y1="24" x2="198" y2="42"/>
    <line x1="240" y1="80" x2="215" y2="80"/>
    <line x1="216" y1="136" x2="198" y2="118"/>
    <line x1="160" y1="160" x2="160" y2="135"/>
    <line x1="104" y1="136" x2="122" y2="118"/>
    <line x1="80" y1="80" x2="105" y2="80"/>
    <line x1="104" y1="24" x2="122" y2="42"/>
  </g>

  <!-- Lush Village Green Lawn -->
  <path d="M0 250 Q160 238 320 250 V320 H0 Z" fill="#4d7335"/>
  <path d="M0 268 Q160 258 320 268 V320 H0 Z" fill="#365423"/>

  <!-- Three-Legged Stool -->
  <g id="the-stool">
    <!-- Cast Shadow on grass -->
    <ellipse cx="150" cy="290" rx="75" ry="18" fill="#1b2e10" opacity="0.6"/>

    <!-- Stool Legs -->
    <polygon points="120,225 95,282 103,284 128,225" fill="#523924" stroke="#2e1d0f" stroke-width="1"/>
    <polygon points="195,225 220,282 212,284 188,225" fill="#47311e" stroke="#2e1d0f" stroke-width="1"/>
    <polygon points="158,225 156,275 163,275 164,225" fill="#382617" stroke="#2e1d0f" stroke-width="1"/>

    <!-- Round Stool Seat -->
    <ellipse cx="160" cy="225" rx="55" ry="15" fill="#7a5433" stroke="#3d2714" stroke-width="1.5"/>
    <ellipse cx="160" cy="223" rx="52" ry="13" fill="#8f633c"/>
  </g>

  <!-- THE WEATHERED BLACK WOODEN BOX -->
  <g id="black-wooden-box">
    <!-- Top Face -->
    <polygon points="160,135 218,162 160,188 102,162" fill="url(#lot-box-top)" stroke="#0a0a09" stroke-width="1.5"/>
    <!-- Chipped paint exposing wood grain on top corners -->
    <polygon points="112,162 128,155 125,152 108,158" fill="url(#lot-wood-chip)"/>
    <polygon points="188,150 208,158 205,161 185,152" fill="url(#lot-wood-chip)"/>
    <!-- Slip Slot in Top for Slips of Paper -->
    <polygon points="150,158 170,167 166,169 146,160" fill="#000000" stroke="#262626" stroke-width="1"/>

    <!-- Left (Shadowed) Side Face -->
    <polygon points="102,162 160,188 160,238 102,212" fill="url(#lot-box-side)" stroke="#0a0a09" stroke-width="1.5"/>
    <!-- Wood splinters / chips on left face -->
    <path d="M106 172 L114 205 L110 206 L104 175 Z" fill="url(#lot-wood-chip)" opacity="0.8"/>
    <path d="M132 195 L144 225 L140 227 L128 198 Z" fill="url(#lot-wood-chip)" opacity="0.7"/>

    <!-- Right Side Face -->
    <polygon points="160,188 218,162 218,212 160,238" fill="#242220" stroke="#0a0a09" stroke-width="1.5"/>
    <path d="M165 195 L175 230 L172 232 L162 197 Z" fill="url(#lot-wood-chip)" opacity="0.8"/>
    <path d="M198 178 L212 186 L210 190 L196 182 Z" fill="url(#lot-wood-chip)" opacity="0.75"/>

    <!-- Iron Hasp on Front Seam -->
    <rect x="158" y="184" width="4" height="15" fill="#525456" stroke="#141414" stroke-width="0.75"/>
    <circle cx="160" cy="196" r="2" fill="#141414"/>
  </g>

  <!-- Piles of Smooth Rounded River Stones in Grass -->
  <g id="smooth-river-stones">
    <!-- Shadow -->
    <ellipse cx="245" cy="285" rx="35" ry="12" fill="#1b2e10" opacity="0.5"/>
    <!-- Layered Stones -->
    <ellipse cx="228" cy="286" rx="14" ry="9" fill="url(#lot-stone)" stroke="#383d3b" stroke-width="1" transform="rotate(-6 228 286)"/>
    <ellipse cx="252" cy="288" rx="16" ry="10" fill="url(#lot-stone)" stroke="#383d3b" stroke-width="1" transform="rotate(5 252 288)"/>
    <ellipse cx="240" cy="278" rx="13" ry="8" fill="url(#lot-stone)" stroke="#383d3b" stroke-width="1"/>
    <!-- Specular highlight on river stone -->
    <ellipse cx="237" cy="276" rx="6" ry="2.5" fill="#ffffff" opacity="0.6"/>

    <!-- Left smaller stone pile -->
    <ellipse cx="78" cy="290" rx="12" ry="8" fill="url(#lot-stone)" stroke="#383d3b" stroke-width="1" transform="rotate(8 78 290)"/>
    <ellipse cx="64" cy="292" rx="10" ry="6" fill="url(#lot-stone)" stroke="#383d3b" stroke-width="1"/>
  </g>
</svg>