<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="cw-cosmic" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a0f1c"/>
      <stop offset="50%" stop-color="#240509"/>
      <stop offset="100%" stop-color="#0a0204"/>
    </radialGradient>
    <linearGradient id="cw-curtain-left" x1="0%" y1="0%" x2="1" y2="0">
      <stop offset="0%" stop-color="#590a16"/>
      <stop offset="40%" stop-color="#a8192d"/>
      <stop offset="70%" stop-color="#e6223d"/>
      <stop offset="100%" stop-color="#40060e"/>
    </linearGradient>
    <linearGradient id="cw-curtain-right" x1="1" y1="0%" x2="0%" y2="0">
      <stop offset="0%" stop-color="#590a16"/>
      <stop offset="40%" stop-color="#a8192d"/>
      <stop offset="70%" stop-color="#e6223d"/>
      <stop offset="100%" stop-color="#40060e"/>
    </linearGradient>
    <linearGradient id="cw-worm" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="40%" stop-color="#c0152b"/>
      <stop offset="80%" stop-color="#730514"/>
      <stop offset="100%" stop-color="#380108"/>
    </linearGradient>
    <linearGradient id="cw-gold" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#fff2b3"/>
      <stop offset="50%" stop-color="#e5b342"/>
      <stop offset="100%" stop-color="#8a6114"/>
    </linearGradient>
  </defs>

  <!-- Cosmic Background Sky of the Celestial Theater -->
  <rect width="320" height="320" fill="url(#cw-cosmic)"/>

  <!-- Stars & Constellations in Upper Arch -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="160" cy="45" r="1.5"/>
    <circle cx="130" cy="38" r="1"/>
    <circle cx="190" cy="42" r="1.2"/>
    <circle cx="105" cy="55" r="1.5"/>
    <circle cx="215" cy="52" r="1"/>
    <circle cx="80" cy="70" r="1.2"/>
    <circle cx="240" cy="68" r="1.5"/>
    <circle cx="150" cy="65" r="1"/>
    <circle cx="172" cy="72" r="1.2"/>
  </g>

  <!-- Weeping Seraph Silhouettes in Heavenly Balcony -->
  <g stroke="#ffd9a0" stroke-width="1.2" opacity="0.4" fill="none">
    <!-- Arch of Balcony -->
    <path d="M60 85 Q160 50 260 85"/>
    <!-- Seraph 1 (Left) with bowed head and draped wings -->
    <path d="M100 82 C95 65 80 50 72 45 C78 60 88 72 96 82 Z" fill="#ffd9a0" opacity="0.2"/>
    <circle cx="106" cy="68" r="4" fill="#ffd9a0" opacity="0.4"/>
    <!-- Seraph 2 (Right) -->
    <path d="M220 82 C225 65 240 50 248 45 C242 60 232 72 224 82 Z" fill="#ffd9a0" opacity="0.2"/>
    <circle cx="214" cy="68" r="4" fill="#ffd9a0" opacity="0.4"/>
  </g>

  <!-- Baroque Proscenium Theater Stage Arch -->
  <path d="M30 320 V95 Q160 55 290 95 V320" stroke="url(#cw-gold)" stroke-width="4" fill="none"/>
  <path d="M22 320 V90 Q160 48 298 90 V320" stroke="#5c4314" stroke-width="1.5" fill="none"/>

  <!-- Classical Wooden Stage Floor -->
  <polygon points="25,270 295,270 320,320 0,320" fill="#29120e" stroke="#120604" stroke-width="1.5"/>
  <line x1="50" y1="270" x2="30" y2="320" stroke="#170906" stroke-width="1.5"/>
  <line x1="110" y1="270" x2="100" y2="320" stroke="#170906" stroke-width="1.5"/>
  <line x1="160" y1="270" x2="160" y2="320" stroke="#170906" stroke-width="1.5"/>
  <line x1="210" y1="270" x2="220" y2="320" stroke="#170906" stroke-width="1.5"/>
  <line x1="270" y1="270" x2="290" y2="320" stroke="#170906" stroke-width="1.5"/>

  <!-- Fallen Marionette on Stage (Symbolizing the human mimes) -->
  <g stroke="#b8935c" stroke-width="1.5" fill="none" opacity="0.8">
    <circle cx="95" cy="275" r="5" fill="#8c6a38"/>
    <line x1="95" y1="280" x2="90" y2="295"/>
    <line x1="90" y1="288" x2="80" y2="282"/>
    <line x1="90" y1="288" x2="102" y2="292"/>
    <line x1="90" y1="295" x2="82" y2="308"/>
    <line x1="90" y1="295" x2="98" y2="306"/>
    <!-- Broken puppet control strings hanging loose -->
    <line x1="95" y1="275" x2="105" y2="245" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.5"/>
    <line x1="80" y1="282" x2="72" y2="240" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.5"/>
  </g>

  <!-- The Conqueror Worm: Serpentine red monster coiled on the stage -->
  <g id="conqueror-worm-beast">
    <!-- Cast Shadow -->
    <ellipse cx="180" cy="285" rx="75" ry="18" fill="#080102" opacity="0.8"/>

    <!-- Coiled Segmented Body (Back loop) -->
    <path d="M120 270 C110 240 145 225 180 230 C215 235 245 255 235 280 C230 295 210 300 185 295 C150 288 128 275 120 270 Z" fill="url(#cw-worm)" stroke="#4d050d" stroke-width="2"/>

    <!-- Chitinous segment plates -->
    <g stroke="#ff7d8c" stroke-width="1.5" fill="none" opacity="0.75">
      <path d="M135 248 C145 238 165 240 172 252"/>
      <path d="M165 234 C180 232 198 238 206 250"/>
      <path d="M198 245 C215 248 226 260 224 274"/>
      <path d="M152 278 C170 285 190 285 204 276"/>
    </g>

    <!-- Worm Head Rearing Upward in Triumph -->
    <path d="M210 265 C225 245 238 220 230 195 C224 178 205 174 195 186 C186 198 190 225 195 245 Z" fill="url(#cw-worm)" stroke="#4d050d" stroke-width="2"/>
    <!-- Head crown / crest -->
    <polygon points="198,172 205,182 214,175 218,185 228,178 222,192 196,190" fill="url(#cw-gold)" stroke="#523a0a" stroke-width="1"/>
    <!-- Glowing Eye -->
    <circle cx="205" cy="188" r="3.5" fill="#ffea75" stroke="#7a0a14" stroke-width="1"/>
    <circle cx="205" cy="188" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Heavy Theater Velvet Drapes Descending (Curtain of Death) -->
  <!-- Left Velvet Swag & Pelmet -->
  <path d="M0 0 H160 C140 35 110 50 75 52 C45 54 20 42 0 35 Z" fill="url(#cw-curtain-left)"/>
  <path d="M0 0 V270 C30 250 55 210 50 160 C46 120 25 80 0 50 Z" fill="url(#cw-curtain-left)" stroke="#38040a" stroke-width="1.5"/>
  <!-- Gold Fringe on Left Valance -->
  <path d="M0 35 C20 42 45 54 75 52 C110 50 140 35 160 0" stroke="url(#cw-gold)" stroke-width="3" stroke-dasharray="3 2" fill="none"/>

  <!-- Right Velvet Swag & Pelmet -->
  <path d="M160 0 H320 C300 35 270 50 235 52 C205 54 180 42 160 35 Z" fill="url(#cw-curtain-right)"/>
  <path d="M320 0 V270 C290 250 265 210 270 160 C274 120 295 80 320 50 Z" fill="url(#cw-curtain-right)" stroke="#38040a" stroke-width="1.5"/>
  <path d="M160 0 C180 35 205 42 235 52 C270 50 300 35 320 35" stroke="url(#cw-gold)" stroke-width="3" stroke-dasharray="3 2" fill="none"/>

  <!-- Velvet Tie-Back Tassels -->
  <g fill="url(#cw-gold)" stroke="#523a0a" stroke-width="1">
    <!-- Left Tassel -->
    <circle cx="48" cy="175" r="4"/>
    <polygon points="44,178 52,178 55,200 41,200"/>
    <!-- Right Tassel -->
    <circle cx="272" cy="175" r="4"/>
    <polygon points="268,178 276,178 279,200 265,200"/>
  </g>
</svg>