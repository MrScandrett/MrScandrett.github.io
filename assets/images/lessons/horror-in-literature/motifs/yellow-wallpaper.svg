<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="yw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e687"/>
      <stop offset="100%" stop-color="#deb826"/>
    </linearGradient>
  </defs>

  <!-- Base Sulfur Ochre Surface -->
  <rect width="120" height="120" fill="url(#yw-bg)"/>

  <!-- Sub-Pattern: Subtle Barred Cell Lattice (Tiling every 20px) -->
  <g stroke="#997a00" stroke-width="0.75" opacity="0.35">
    <line x1="0" y1="20" x2="120" y2="20"/>
    <line x1="0" y1="40" x2="120" y2="40"/>
    <line x1="0" y1="60" x2="120" y2="60"/>
    <line x1="0" y1="80" x2="120" y2="80"/>
    <line x1="0" y1="100" x2="120" y2="100"/>

    <line x1="20" y1="0" x2="20" y2="120"/>
    <line x1="40" y1="0" x2="40" y2="120"/>
    <line x1="60" y1="0" x2="60" y2="120"/>
    <line x1="80" y1="0" x2="80" y2="120"/>
    <line x1="100" y1="0" x2="100" y2="120"/>
  </g>

  <!-- Victorian Gothic Revival Arabesque Damask (Seamless Center Motif) -->
  <!-- Central Sprawling Acanthus / Fungal Rosette -->
  <g fill="#705300" stroke="#473400" stroke-width="0.75">
    <!-- Center Medallion Bud -->
    <path d="M60 48 C52 40 46 52 60 62 C74 52 68 40 60 48 Z"/>
    <circle cx="60" cy="54" r="3" fill="#ffd83b"/>

    <!-- Upper Flourishing Horns / Vines (Reaching up toward top edge) -->
    <path d="M60 48 C55 32 38 24 28 32 C22 38 26 46 34 42 C44 38 52 42 56 50 Z"/>
    <path d="M60 48 C65 32 82 24 92 32 C98 38 94 46 86 42 C76 38 68 42 64 50 Z"/>

    <!-- Lower Tendrils curving downward -->
    <path d="M60 62 C52 75 35 78 28 72 C22 66 26 58 34 62 C44 68 54 65 58 56 Z"/>
    <path d="M60 62 C68 75 85 78 92 72 C98 66 94 58 86 62 C76 68 66 65 62 56 Z"/>

    <!-- Subdued creeping silhouette hands hidden in the foliage -->
    <path d="M42 50 C36 48 30 52 26 58 C30 56 36 56 40 54 Z" fill="#523c00"/>
    <path d="M78 50 C84 48 90 52 94 58 C90 56 84 56 80 54 Z" fill="#523c00"/>
  </g>

  <!-- Seamless Corner Motifs (Centered at 0,0 - 120,0 - 0,120 - 120,120) -->
  <!-- Top-Left Corner (0,0) -->
  <g fill="#705300" stroke="#473400" stroke-width="0.75">
    <path d="M0 12 C8 15 15 8 12 0 C16 4 18 14 10 18 C4 20 0 16 0 12 Z"/>
    <path d="M12 0 C15 8 8 15 0 12"/>
    <circle cx="0" cy="0" r="4" fill="#ffd83b"/>
  </g>
  <!-- Top-Right Corner (120,0) -->
  <g fill="#705300" stroke="#473400" stroke-width="0.75">
    <path d="M120 12 C112 15 105 8 108 0 C104 4 102 14 110 18 C116 20 120 16 120 12 Z"/>
    <circle cx="120" cy="0" r="4" fill="#ffd83b"/>
  </g>
  <!-- Bottom-Left Corner (0,120) -->
  <g fill="#705300" stroke="#473400" stroke-width="0.75">
    <path d="M0 108 C8 105 15 112 12 120 C16 116 18 106 10 102 C4 100 0 104 0 108 Z"/>
    <circle cx="0" cy="120" r="4" fill="#ffd83b"/>
  </g>
  <!-- Bottom-Right Corner (120,120) -->
  <g fill="#705300" stroke="#473400" stroke-width="0.75">
    <path d="M120 108 C112 105 105 112 108 120 C104 116 102 106 110 102 C116 100 120 104 120 108 Z"/>
    <circle cx="120" cy="120" r="4" fill="#ffd83b"/>
  </g>

  <!-- Seamless Border Edge Connectors (Tiling X at y=60, Tiling Y at x=60) -->
  <!-- Left/Right Edge (x=0 & x=120, y=60) -->
  <path d="M0 54 C8 50 14 55 12 60 C14 65 8 70 0 66 Z" fill="#705300"/>
  <path d="M120 54 C112 50 106 55 108 60 C106 65 112 70 120 66 Z" fill="#705300"/>
  <!-- Top/Bottom Edge (y=0 & y=120, x=60) -->
  <path d="M54 0 C50 8 55 14 60 12 C65 14 70 8 66 0 Z" fill="#705300"/>
  <path d="M54 120 C50 112 55 106 60 108 C65 106 70 112 66 120 Z" fill="#705300"/>
</svg>