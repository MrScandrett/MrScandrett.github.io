<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="mp-fire-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe699" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f0b35a" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#9e5616" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a120a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mp-spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffe082"/>
      <stop offset="80%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mp-paw-skin" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#735432"/>
      <stop offset="40%" stop-color="#543b20"/>
      <stop offset="100%" stop-color="#302010"/>
    </linearGradient>
    <linearGradient id="mp-parchment" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#d9c298"/>
      <stop offset="100%" stop-color="#a68e65"/>
    </linearGradient>
  </defs>

  <!-- Talismanic Sigil Ring Background -->
  <g stroke="#f0b35a" stroke-width="1" opacity="0.25" fill="none">
    <circle cx="160" cy="160" r="130"/>
    <circle cx="160" cy="160" r="118" stroke-dasharray="4 6"/>
    <polygon points="160,35 272,198 88,118 232,118 48,198"/>
  </g>

  <!-- Victorian Letter / Telegram on Table -->
  <g transform="rotate(-6 160 220)">
    <polygon points="65,190 255,178 262,268 72,280" fill="url(#mp-parchment)" stroke="#665235" stroke-width="1.5"/>
    <!-- Faint handwritten script lines -->
    <path d="M85 204h150 M85 218h140 M85 232h145 M85 246h130 M85 260h80" stroke="#4a371e" stroke-width="1.2" opacity="0.45" stroke-dasharray="5 3 8 2"/>
    <!-- Red sealing wax stamp -->
    <circle cx="230" cy="245" r="14" fill="#8c1d18" stroke="#520f0c" stroke-width="1"/>
    <circle cx="230" cy="245" r="9" fill="#a82823"/>
  </g>

  <!-- Cast Shadow of Paw -->
  <ellipse cx="165" cy="225" rx="60" ry="24" fill="#0e0905" opacity="0.75"/>

  <!-- The Mummified Monkey Paw -->
  <g id="the-paw">
    <!-- Wrist & Palm mass -->
    <path d="M125 245 C120 220 126 185 142 165 C155 150 178 152 188 168 C198 185 204 220 196 248 Z" fill="url(#mp-paw-skin)" stroke="#26170a" stroke-width="2"/>
    <!-- Palm creases and ancient leathery folds -->
    <path d="M138 200 C150 192 168 190 182 196" stroke="#26170a" stroke-width="2" fill="none"/>
    <path d="M142 215 C155 210 170 210 180 218" stroke="#26170a" stroke-width="1.5" fill="none"/>
    <path d="M135 185 C142 178 152 176 160 179" stroke="#26170a" stroke-width="1.5" fill="none"/>

    <!-- Thumb (Curled inward) -->
    <path d="M130 205 C115 198 105 182 108 168 C110 156 122 154 130 165 C136 174 138 188 135 205 Z" fill="url(#mp-paw-skin)" stroke="#26170a" stroke-width="1.5"/>
    <!-- Thumb Claw -->
    <path d="M109 168 C104 162 102 152 106 145 C108 152 114 158 116 162 Z" fill="#211509" stroke="#120b05" stroke-width="1"/>

    <!-- Index Finger (Arching upward in grasping tension) -->
    <path d="M138 168 C132 145 128 118 134 98 C138 84 150 86 152 100 C154 116 152 142 150 165 Z" fill="url(#mp-paw-skin)" stroke="#26170a" stroke-width="1.5"/>
    <path d="M134 98 C132 90 134 82 138 75 C141 84 146 90 148 96 Z" fill="#211509" stroke="#120b05" stroke-width="1"/>
    <!-- Knuckle wrinkles -->
    <path d="M134 132 Q142 136 150 132" stroke="#26170a" stroke-width="1.5" fill="none"/>
    <path d="M135 110 Q142 113 148 110" stroke="#26170a" stroke-width="1.2" fill="none"/>

    <!-- Middle Finger (Longest, poised at center) -->
    <path d="M152 162 C154 135 156 102 164 80 C168 68 178 70 180 82 C181 102 176 135 170 162 Z" fill="url(#mp-paw-skin)" stroke="#26170a" stroke-width="1.5"/>
    <path d="M164 80 C164 70 168 62 172 54 C175 64 178 72 178 78 Z" fill="#211509" stroke="#120b05" stroke-width="1"/>
    <path d="M156 122 Q166 126 174 122" stroke="#26170a" stroke-width="1.5" fill="none"/>
    <path d="M160 98 Q168 101 176 98" stroke="#26170a" stroke-width="1.2" fill="none"/>

    <!-- Ring Finger -->
    <path d="M172 165 C178 142 184 115 192 98 C196 86 206 90 205 102 C202 120 194 145 186 168 Z" fill="url(#mp-paw-skin)" stroke="#26170a" stroke-width="1.5"/>
    <path d="M192 98 C194 90 198 82 204 76 C204 85 204 92 202 98 Z" fill="#211509" stroke="#120b05" stroke-width="1"/>
    <path d="M178 135 Q186 138 194 135" stroke="#26170a" stroke-width="1.5" fill="none"/>

    <!-- Little Finger (Curled tightly inward) -->
    <path d="M188 175 C198 160 210 148 218 140 C225 134 232 142 226 152 C218 165 206 182 195 192 Z" fill="url(#mp-paw-skin)" stroke="#26170a" stroke-width="1.5"/>
    <path d="M218 140 C224 136 230 132 235 128 C232 135 228 142 224 146 Z" fill="#211509" stroke="#120b05" stroke-width="1"/>

    <!-- Ancient binding cord around wrist -->
    <path d="M125 238 C140 245 175 246 195 240" stroke="#a6804b" stroke-width="3" fill="none"/>
    <path d="M126 244 C142 251 176 252 196 246" stroke="#876231" stroke-width="2.5" fill="none"/>
  </g>

  <!-- The Three Wishes: Glowing Ethereal Wisps floating above the claws -->
  <!-- Wish 1: Above middle finger -->
  <g transform="translate(172, 42)">
    <circle cx="0" cy="0" r="22" fill="url(#mp-spark)" opacity="0.85"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>
  <!-- Wish 2: Above index finger -->
  <g transform="translate(138, 64)">
    <circle cx="0" cy="0" r="18" fill="url(#mp-spark)" opacity="0.75"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>
  <!-- Wish 3: Above ring finger -->
  <g transform="translate(204, 65)">
    <circle cx="0" cy="0" r="18" fill="url(#mp-spark)" opacity="0.75"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>
</svg>