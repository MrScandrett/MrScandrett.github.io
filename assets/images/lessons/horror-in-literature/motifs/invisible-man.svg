<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="im-blizzard" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#384956"/>
      <stop offset="50%" stop-color="#1e2933"/>
      <stop offset="100%" stop-color="#0f151a"/>
    </radialGradient>
    <linearGradient id="im-coat" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#424f59"/>
      <stop offset="45%" stop-color="#263138"/>
      <stop offset="100%" stop-color="#12181c"/>
    </linearGradient>
    <linearGradient id="im-hat" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#2a343b"/>
      <stop offset="100%" stop-color="#101518"/>
    </linearGradient>
    <linearGradient id="im-gauze" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#dce6ed"/>
      <stop offset="100%" stop-color="#99a8b3"/>
    </linearGradient>
  </defs>

  <!-- Iping Winter Blizzard Sky -->
  <rect width="320" height="320" fill="url(#im-blizzard)"/>

  <!-- Swirling Blizzard Wind Streamers -->
  <g stroke="#ffffff" opacity="0.35" stroke-linecap="round" fill="none">
    <path d="M0 60 C80 50 160 85 240 65 T320 50" stroke-width="1.5"/>
    <path d="M0 120 C70 105 140 145 220 120 T320 110" stroke-width="2"/>
    <path d="M0 180 C90 165 180 200 270 175 T320 170" stroke-width="1.5"/>
    <path d="M0 240 C60 230 150 260 240 235 T320 230" stroke-width="2"/>
  </g>

  <!-- Flying Snowflakes in the Gale -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="45" cy="45" r="2"/>
    <circle cx="85" cy="85" r="1.5"/>
    <circle cx="135" cy="35" r="2.5"/>
    <circle cx="185" cy="75" r="1.5"/>
    <circle cx="235" cy="40" r="2"/>
    <circle cx="285" cy="95" r="1.5"/>
    <circle cx="65" cy="165" r="1.5"/>
    <circle cx="265" cy="185" r="2"/>
    <circle cx="40" cy="275" r="2.5"/>
    <circle cx="295" cy="265" r="1.8"/>
  </g>

  <!-- THE INVISIBLE MAN (Clothes with an Empty Void Inside) -->
  <g id="unseen-traveler" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.85))">
    <!-- Heavy Wool Overcoat (Turned-up Collar & Broad Shoulders) -->
    <path d="M80 320 L95 240 C105 210 130 195 135 180 L145 220 L160 235 L175 220 L185 180 C190 195 215 210 225 240 L240 320 Z" fill="url(#im-coat)" stroke="#0a0e10" stroke-width="2"/>

    <!-- High Standing Coat Lapels framing the neck -->
    <!-- Left Lapel -->
    <polygon points="105,210 135,180 142,225 118,245" fill="#36424a" stroke="#0a0e10" stroke-width="1.5"/>
    <!-- Right Lapel -->
    <polygon points="215,210 185,180 178,225 202,245" fill="#36424a" stroke="#0a0e10" stroke-width="1.5"/>

    <!-- Unraveling White Medical Gauze Bandages Loosely Around Collar -->
    <!-- Bandage loop 1 -->
    <path d="M125 185 C140 195 180 195 195 185 C190 195 175 208 145 205 C132 202 125 192 125 185 Z" fill="url(#im-gauze)" stroke="#52606b" stroke-width="1"/>
    <!-- Bandage trailing tail fluttering in the blizzard -->
    <path d="M195 188 C215 192 235 185 255 178 L252 188 C232 196 215 200 192 195 Z" fill="url(#im-gauze)" stroke="#52606b" stroke-width="1"/>

    <!-- THE EMPTY VOID: Blizzard Snow Winds blow straight through where the head should be! -->
    <!-- (Notice: No flesh or head geometry exists between the hat and collar) -->

    <!-- Dark Round Spectacles / Goggles (Floating in mid-air!) -->
    <g id="dark-goggles">
      <!-- Left Glass Lens -->
      <circle cx="138" cy="132" r="16" fill="#080b0d" stroke="#94a3b8" stroke-width="2.5"/>
      <!-- Glass reflection highlight on dark lens -->
      <path d="M128 126 C134 122 144 124 148 130" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

      <!-- Right Glass Lens -->
      <circle cx="182" cy="132" r="16" fill="#080b0d" stroke="#94a3b8" stroke-width="2.5"/>
      <path d="M172 126 C178 122 188 124 192 130" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

      <!-- Connecting Bridge & Wire Side Temples -->
      <line x1="154" y1="132" x2="166" y2="132" stroke="#94a3b8" stroke-width="3"/>
      <!-- Temples hooking into thin air -->
      <path d="M122 132 C115 130 110 125 106 120" stroke="#94a3b8" stroke-width="2" fill="none"/>
      <path d="M198 132 C205 130 210 125 214 120" stroke="#94a3b8" stroke-width="2" fill="none"/>
    </g>

    <!-- Wide-Brimmed Dark Felt Fedora Hat (Hovering above the spectacles) -->
    <g id="fedora-hat">
      <!-- Curved Brim -->
      <ellipse cx="160" cy="98" rx="75" ry="20" fill="url(#im-hat)" stroke="#0a0e10" stroke-width="2"/>
      <ellipse cx="160" cy="96" rx="72" ry="17" fill="#242c33"/>

      <!-- Hat Crown with Center Crease -->
      <path d="M115 95 C115 62 130 52 145 58 C155 62 165 62 175 58 C190 52 205 62 205 95 Z" fill="url(#im-hat)" stroke="#0a0e10" stroke-width="2"/>
      <!-- Crown Crease Dent -->
      <path d="M142 58 C152 64 168 64 178 58" stroke="#101518" stroke-width="3" fill="none"/>

      <!-- Black Silk Ribbon Band -->
      <path d="M115 94 C135 100 185 100 205 94 L205 88 C185 94 135 94 115 88 Z" fill="#080b0d"/>

      <!-- Frost / Snow Settling on Hat Brim -->
      <path d="M105 94 C130 92 190 92 215 94" stroke="#ffffff" stroke-width="2" opacity="0.65" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>