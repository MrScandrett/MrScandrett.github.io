<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="gvhp-title">
  <title id="gvhp-title">Why Venus Proved Heliocentrism: Geocentric Epicycle vs. Heliocentric Orbit</title>
  <rect width="880" height="340" rx="16" fill="#0f172a"/>
  <text x="28" y="36" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#f8fafc">The Crucial Test: Phases of Venus (Galileo, 1610)</text>
  <text x="28" y="56" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Only when Venus orbits the Sun inside Earth's orbit can an observer on Earth see BOTH tiny full phases and huge crescents.</text>

  <!-- Left Panel: Ptolemaic Geocentric -->
  <g transform="translate(26 76)">
    <rect width="402" height="240" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="16" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#fca5a5">Ptolemy (Geocentric): Venus Stays Crescent</text>

    <!-- Sun orbit -->
    <circle cx="200" cy="186" r="14" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
    <text x="200" y="213" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#93c5fd">Earth</text>

    <!-- Epicycle guide -->
    <circle cx="200" cy="112" r="46" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="200" y1="186" x2="200" y2="54" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Sun behind epicycle -->
    <circle cx="200" cy="50" r="14" fill="#facc15" stroke="#fde047" stroke-width="2"/>
    <text x="222" y="54" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fde047">Sun</text>

    <!-- Venus crescent positions always in front of Sun -->
    <circle cx="164" cy="112" r="9" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M164,103 A9,9 0 0,1 171,117 A7,9 0 0,0 164,103 Z" fill="#fef08a"/>
    <circle cx="236" cy="112" r="9" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M236,103 A9,9 0 0,0 229,117 A7,9 0 0,1 236,103 Z" fill="#fef08a"/>

    <text x="200" y="229" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#fecaca">Never passes behind the Sun — NO full/gibbous phase</text>
  </g>

  <!-- Right Panel: Copernican Heliocentric -->
  <g transform="translate(452 76)">
    <rect width="402" height="240" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.8"/>
    <text x="16" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#86efac">Copernicus (Heliocentric): Full Phase Cycle</text>

    <!-- Sun centered -->
    <circle cx="200" cy="116" r="16" fill="#facc15" stroke="#fde047" stroke-width="2"/>
    <text x="200" y="143" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#fde047">Sun</text>

    <!-- Venus orbit -->
    <circle cx="200" cy="116" r="52" fill="none" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Earth below -->
    <circle cx="200" cy="198" r="12" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
    <text x="220" y="202" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#93c5fd">Earth</text>

    <!-- Far / Small / Nearly Full Venus -->
    <circle cx="200" cy="64" r="6" fill="#fef08a" stroke="#ffffff" stroke-width="1"/>
    <text x="200" y="51" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" fill="#cbd5e1">Far: Small &amp; Nearly Full</text>

    <!-- Side Half Phase -->
    <circle cx="148" cy="116" r="8" fill="#334155" stroke="#e2e8f0" stroke-width="1.3"/>
    <path d="M148,108 A8,8 0 0,1 148,124 Z" fill="#fef08a"/>
    <text x="108" y="119" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" fill="#cbd5e1">Quarter</text>

    <!-- Near / Large Crescent Venus -->
    <circle cx="200" cy="168" r="11" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M192,160 A11,11 0 0,1 209,163 A11,8 0 0,0 192,160 Z" fill="#fef08a"/>
    <text x="278" y="172" font-family="system-ui,sans-serif" font-size="9.5" fill="#86efac">Near: Large Thin Crescent</text>

    <text x="200" y="229" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#bbf7d0">Matches Galileo's telescope observations 100%</text>
  </g>
</svg>
