<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="mod-map-title mod-map-desc">
  <title id="mod-map-title">Tonicization versus Pivot-Chord Modulation</title>
  <desc id="mod-map-desc">Two-row comparison distinguishing temporary tonicization (C to D7 to G then returning via G7 back to C) from true pivot-chord modulation (C through shared Am acting as both vi in C and ii in G, then D7 to G and confirming in G).</desc>
  <defs>
    <marker id="mod-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>
  <rect width="860" height="330" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#0f172a" />
  <text x="38" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#bae6fd">TONICIZATION VS. MODULATION · VISITING A NEIGHBOR VS. MOVING HOUSE</text>

  <!-- Row 1: Tonicization -->
  <rect x="24" y="70" width="812" height="106" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8" />
  <text x="42" y="94" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e40af">1. TONICIZATION (Temporary Spotlight in Key of C)</text>
  <g transform="translate(42, 108)" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="0" y="0" width="110" height="52" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="2" />
    <text x="55" y="23" font-size="15" font-weight="800" fill="#065f46">C (I)</text>
    <text x="55" y="40" font-size="10.5" fill="#047857">Home</text>
    <line x1="112" y1="26" x2="144" y2="26" stroke="#334155" stroke-width="2" marker-end="url(#mod-arrow)" />

    <rect x="150" y="0" width="136" height="52" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text x="218" y="23" font-size="15" font-weight="800" fill="#92400e">D7 (V7/V)</text>
    <text x="218" y="40" font-size="10.5" fill="#b45309">F♯ spotlights G</text>
    <line x1="288" y1="26" x2="320" y2="26" stroke="#334155" stroke-width="2" marker-end="url(#mod-arrow)" />

    <rect x="326" y="0" width="110" height="52" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="381" y="23" font-size="15" font-weight="800" fill="#1e40af">G (V)</text>
    <text x="381" y="40" font-size="10.5" fill="#1d4ed8">Brief visit</text>
    <line x1="438" y1="26" x2="470" y2="26" stroke="#334155" stroke-width="2" marker-end="url(#mod-arrow)" />

    <rect x="476" y="0" width="126" height="52" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2" />
    <text x="539" y="23" font-size="15" font-weight="800" fill="#9a3412">G7 (V7)</text>
    <text x="539" y="40" font-size="10.5" fill="#c2410c">F♮ pulls home</text>
    <line x1="604" y1="26" x2="636" y2="26" stroke="#334155" stroke-width="2" marker-end="url(#mod-arrow)" />

    <rect x="642" y="0" width="128" height="52" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="2" />
    <text x="706" y="23" font-size="15" font-weight="800" fill="#065f46">C (I)</text>
    <text x="706" y="40" font-size="10.5" fill="#047857">Still home!</text>
  </g>

  <!-- Row 2: Pivot Modulation -->
  <rect x="24" y="190" width="812" height="114" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
  <text x="42" y="214" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f766e">2. PIVOT-CHORD MODULATION (Key of C → Key of G)</text>
  <g transform="translate(42, 228)" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="0" y="0" width="110" height="58" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="2" />
    <text x="55" y="24" font-size="15" font-weight="800" fill="#065f46">C (I in C)</text>
    <text x="55" y="42" font-size="10.5" fill="#047857">Old key</text>
    <line x1="112" y1="29" x2="140" y2="29" stroke="#334155" stroke-width="2" marker-end="url(#mod-arrow)" />

    <rect x="146" y="0" width="176" height="58" rx="9" fill="#fdf4ff" stroke="#9333ea" stroke-width="2.4" />
    <text x="234" y="21" font-size="15" font-weight="800" fill="#6b21a8">Am · PIVOT</text>
    <text x="234" y="38" font-size="10.5" font-weight="700" fill="#7e22ce">vi in C  =  ii in G</text>
    <text x="234" y="51" font-size="9.5" fill="#581c87">Bridge shared by both keys</text>
    <line x1="324" y1="29" x2="352" y2="29" stroke="#334155" stroke-width="2" marker-end="url(#mod-arrow)" />

    <rect x="358" y="0" width="128" height="58" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text x="422" y="24" font-size="15" font-weight="800" fill="#92400e">D7 (V7 in G)</text>
    <text x="422" y="42" font-size="10.5" fill="#b45309">Confirms F♯</text>
    <line x1="488" y1="29" x2="516" y2="29" stroke="#334155" stroke-width="2" marker-end="url(#mod-arrow)" />

    <rect x="522" y="0" width="116" height="58" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2" />
    <text x="580" y="24" font-size="15" font-weight="800" fill="#1e40af">G (I in G)</text>
    <text x="580" y="42" font-size="10.5" fill="#1d4ed8">New home</text>
    <line x1="640" y1="29" x2="668" y2="29" stroke="#334155" stroke-width="2" marker-end="url(#mod-arrow)" />

    <rect x="674" y="0" width="98" height="58" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
    <text x="723" y="24" font-size="13.5" font-weight="800" fill="#1e40af">C–D7–G</text>
    <text x="723" y="42" font-size="10" fill="#1d4ed8">Stays in G</text>
  </g>
</svg>