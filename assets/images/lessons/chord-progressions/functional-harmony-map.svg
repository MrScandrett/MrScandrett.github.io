<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-labelledby="fhm-title fhm-desc">
  <title id="fhm-title">Functional Harmony Flow and Cadence Endings in Major Keys</title>
  <desc id="fhm-desc">Harmonic gravity flow chart showing how chords move between Tonic Home (I, vi, iii), Predominant Away (IV, ii), and Dominant Pull (V, vii diminished), alongside Authentic (V to I), Half (ending on V), and Deceptive (V to vi) cadence diagrams.</desc>
  <defs>
    <marker id="fhm-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>
  <rect width="860" height="350" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#0f172a" />
  <text x="38" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fde68a">HARMONIC GRAVITY MAP · FUNCTIONAL ZONES &amp; THREE CADENCES</text>

  <!-- Zone 1: Tonic Home -->
  <rect x="24" y="72" width="230" height="148" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2" />
  <text x="139" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#065f46">TONIC · HOME</text>
  <text x="139" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#047857">Stable rest &amp; departure</text>
  <circle cx="88" cy="162" r="30" fill="#ffffff" stroke="#059669" stroke-width="2.4" />
  <text x="88" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#065f46">I</text>
  <text x="88" y="177" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#047857">C</text>
  <circle cx="176" cy="146" r="22" fill="#ffffff" stroke="#db2777" stroke-width="1.8" />
  <text x="176" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#9d174d">vi</text>
  <circle cx="176" cy="192" r="20" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" />
  <text x="176" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#5b21b6">iii</text>

  <!-- Arrows Home -> Away -> Pull -->
  <line x1="258" y1="146" x2="306" y2="146" stroke="#334155" stroke-width="2.4" marker-end="url(#fhm-arrow)" />

  <!-- Zone 2: Predominant Away -->
  <rect x="314" y="72" width="230" height="148" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text x="429" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e40af">PREDOMINANT · AWAY</text>
  <text x="429" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1d4ed8">Motion &amp; harmonic lift</text>
  <circle cx="384" cy="162" r="27" fill="#ffffff" stroke="#16a34a" stroke-width="2.2" />
  <text x="384" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#166534">IV</text>
  <text x="384" y="177" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#15803d">F</text>
  <circle cx="476" cy="162" r="27" fill="#ffffff" stroke="#2563eb" stroke-width="2.2" />
  <text x="476" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e40af">ii</text>
  <text x="476" y="177" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#1d4ed8">Dm</text>

  <line x1="548" y1="146" x2="596" y2="146" stroke="#334155" stroke-width="2.4" marker-end="url(#fhm-arrow)" />

  <!-- Zone 3: Dominant Pull -->
  <rect x="604" y="72" width="232" height="148" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="720" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#92400e">DOMINANT · PULL</text>
  <text x="720" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#b45309">Tritone tension seeking I</text>
  <circle cx="678" cy="162" r="28" fill="#ffffff" stroke="#d97706" stroke-width="2.4" />
  <text x="678" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#92400e">V7</text>
  <text x="678" y="177" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#b45309">G7</text>
  <circle cx="768" cy="162" r="24" fill="#ffffff" stroke="#dc2626" stroke-width="1.8" />
  <text x="768" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#991b1b">vii°</text>
  <text x="768" y="177" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#b91c1c">Bdim</text>

  <!-- Return arc Pull -> Home -->
  <path d="M 678 220 C 678 250, 88 250, 88 225" fill="none" stroke="#059669" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#fhm-arrow)" />
  <rect x="330" y="232" width="198" height="20" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4" />
  <text x="429" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#065f46">Authentic Resolution (V → I)</text>

  <!-- Bottom: 3 Cadence Boxes -->
  <rect x="24" y="266" width="260" height="66" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.8" />
  <text x="38" y="288" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#065f46">Authentic Cadence (V → I)</text>
  <text x="38" y="306" font-family="system-ui, sans-serif" font-size="11" fill="#334155">B→C and F→E resolve cleanly.</text>
  <text x="38" y="321" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Feels like arriving home (period).</text>

  <rect x="300" y="266" width="260" height="66" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.8" />
  <text x="314" y="288" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#92400e">Half Cadence (… → V)</text>
  <text x="314" y="306" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Pauses on active dominant pull.</text>
  <text x="314" y="321" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Leaves a question open (comma).</text>

  <rect x="576" y="266" width="260" height="66" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.8" />
  <text x="590" y="288" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#9d174d">Deceptive Cadence (V → vi)</text>
  <text x="590" y="306" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Keeps C and E, substitutes A bass.</text>
  <text x="590" y="321" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Bittersweet detour; delays ending.</text>
</svg>