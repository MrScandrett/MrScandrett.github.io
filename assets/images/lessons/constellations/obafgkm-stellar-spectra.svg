<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="oss-title">
  <title id="oss-title">Morgan-Keenan O B A F G K M Stellar Spectral Classes</title>
  <rect width="880" height="300" rx="16" fill="#040b18"/>
  <text x="28" y="36" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#e2e8f0">O B A F G K M: Reading Star Surface Temperature From Light</text>
  <text x="28" y="56" font-family="system-ui,sans-serif" font-size="12" fill="#7f9fc0">Stars range from 30,000 K blue-white giants to 3,000 K red dwarfs — and absorption dark lines fingerprint their chemistry.</text>

  <g transform="translate(26 78)" font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="0" y="0" width="110" height="196" rx="10" fill="#0b182e" stroke="#38bdf8"/>
    <circle cx="55" cy="42" r="22" fill="#93c5fd"/><text x="55" y="84" font-size="16" font-weight="800" fill="#93c5fd">O</text>
    <text x="55" y="106" font-size="11" fill="#e2e8f0">30,000+ K</text><text x="55" y="126" font-size="10" fill="#94a3b8">Ionized He</text><text x="55" y="144" font-size="10" fill="#7dd3fc">Alnitak (Orion)</text>

    <rect x="119" y="0" width="110" height="196" rx="10" fill="#0b182e" stroke="#60a5fa"/>
    <circle cx="174" cy="42" r="19" fill="#bfdbfe"/><text x="174" y="84" font-size="16" font-weight="800" fill="#bfdbfe">B</text>
    <text x="174" y="106" font-size="11" fill="#e2e8f0">10,000–30k K</text><text x="174" y="126" font-size="10" fill="#94a3b8">Neutral He, H</text><text x="174" y="144" font-size="10" fill="#93c5fd">Rigel · Spica</text>

    <rect x="238" y="0" width="110" height="196" rx="10" fill="#0b182e" stroke="#e2e8f0"/>
    <circle cx="293" cy="42" r="17" fill="#f8fafc"/><text x="293" y="84" font-size="16" font-weight="800" fill="#f8fafc">A</text>
    <text x="293" y="106" font-size="11" fill="#e2e8f0">7,500–10k K</text><text x="293" y="126" font-size="10" fill="#94a3b8">Strongest H lines</text><text x="293" y="144" font-size="10" fill="#e2e8f0">Sirius · Vega</text>

    <rect x="357" y="0" width="110" height="196" rx="10" fill="#0b182e" stroke="#fef08a"/>
    <circle cx="412" cy="42" r="16" fill="#fef9c3"/><text x="412" y="84" font-size="16" font-weight="800" fill="#fef9c3">F</text>
    <text x="412" y="106" font-size="11" fill="#e2e8f0">6,000–7,500 K</text><text x="412" y="126" font-size="10" fill="#94a3b8">Ca II, weaker H</text><text x="412" y="144" font-size="10" fill="#fef08a">Polaris · Procyon</text>

    <rect x="476" y="0" width="110" height="196" rx="10" fill="#0b182e" stroke="#facc15" stroke-width="2"/>
    <circle cx="531" cy="42" r="15" fill="#fde047"/><text x="531" y="84" font-size="16" font-weight="800" fill="#fde047">G</text>
    <text x="531" y="106" font-size="11" fill="#e2e8f0">5,200–6,000 K</text><text x="531" y="126" font-size="10" fill="#94a3b8">Ionized metals, Fe</text><text x="531" y="144" font-size="10" font-weight="800" fill="#fde047">Our Sun (G2V)</text>

    <rect x="595" y="0" width="110" height="196" rx="10" fill="#0b182e" stroke="#fb923c"/>
    <circle cx="650" cy="42" r="14" fill="#fdba74"/><text x="650" y="84" font-size="16" font-weight="800" fill="#fdba74">K</text>
    <text x="650" y="106" font-size="11" fill="#e2e8f0">3,700–5,200 K</text><text x="650" y="126" font-size="10" fill="#94a3b8">Neutral metals</text><text x="650" y="144" font-size="10" fill="#fed7aa">Aldebaran · Arcturus</text>

    <rect x="714" y="0" width="114" height="196" rx="10" fill="#0b182e" stroke="#ef4444"/>
    <circle cx="771" cy="42" r="13" fill="#fca5a5"/><text x="771" y="84" font-size="16" font-weight="800" fill="#fca5a5">M</text>
    <text x="771" y="106" font-size="11" fill="#e2e8f0">&lt; 3,700 K</text><text x="771" y="126" font-size="10" fill="#94a3b8">TiO molecules</text><text x="771" y="144" font-size="10" fill="#fecaca">Betelgeuse · Proxima</text>
  </g>
</svg>
