<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" role="img" aria-labelledby="ams-title">
  <title id="ams-title">Astronomical Apparent Magnitude Logarithmic Scale</title>
  <rect width="880" height="280" rx="16" fill="#040b18"/>
  <text x="28" y="36" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#e2e8f0">Apparent Magnitude Scale (Smaller Numbers = Brighter Sky Objects)</text>
  <text x="28" y="56" font-family="system-ui,sans-serif" font-size="12" fill="#7f9fc0">Each 1.0 step multiplies brightness by 2.512×; a 5.0-magnitude jump spans an exact 100× factor in light flux.</text>

  <rect x="44" y="96" width="792" height="12" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="74" cy="102" r="14" fill="#facc15"/>
  <circle cx="195" cy="102" r="11" fill="#e2e8f0"/>
  <circle cx="325" cy="102" r="7.5" fill="#7dd3fc"/>
  <circle cx="465" cy="102" r="5" fill="#bae6fd"/>
  <circle cx="620" cy="102" r="3" fill="#64748b"/>
  <circle cx="795" cy="102" r="2" fill="#475569"/>

  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="74" y="138" font-size="12" font-weight="800" fill="#fde047">Sun (−26.7)</text>
    <text x="74" y="154" font-size="10" fill="#94a3b8">Daylight reference</text>

    <text x="195" y="138" font-size="12" font-weight="800" fill="#f8fafc">Full Moon (−12.7)</text>
    <text x="195" y="154" font-size="10" fill="#94a3b8">~400,000× fainter than Sun</text>

    <text x="325" y="138" font-size="12" font-weight="800" fill="#7dd3fc">Sirius (−1.46)</text>
    <text x="325" y="154" font-size="10" fill="#94a3b8">Brightest night star</text>

    <text x="465" y="138" font-size="12" font-weight="800" fill="#bae6fd">Polaris (+2.0)</text>
    <text x="465" y="154" font-size="10" fill="#94a3b8">Mid-bright nav star</text>

    <text x="620" y="138" font-size="12" font-weight="800" fill="#fca5a5">Eye Limit (+6.0)</text>
    <text x="620" y="154" font-size="10" fill="#94a3b8">Dark rural sky limit</text>

    <text x="795" y="138" font-size="12" font-weight="800" fill="#c4b5fd">Hubble / JWST (+30)</text>
    <text x="795" y="154" font-size="10" fill="#94a3b8">~4 billion× fainter than eye</text>

    <rect x="44" y="190" width="792" height="46" rx="10" fill="#0b182e" stroke="#1e3a5f"/>
    <text x="440" y="218" font-size="12.5" font-weight="700" fill="#2dd4bf">Key Rule: Going from m = +1.0 (Aldebaran) to m = +6.0 (faintest naked-eye star) is 5 magnitudes = 100× dimmer</text>
  </g>
</svg>
