<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="zep-title">
  <title id="zep-title">Earth's Orbit Projected Against the Ecliptic Zodiac</title>
  <rect width="880" height="320" rx="16" fill="#040b18"/>
  <text x="28" y="36" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#e2e8f0">Why the Sun Traces the Zodiac Along the Ecliptic</text>
  <text x="28" y="56" font-family="system-ui,sans-serif" font-size="12" fill="#7f9fc0">As Earth orbits the Sun, our line of sight past the Sun points sequentially toward the 12 zodiac constellations.</text>

  <g transform="translate(440 176)" font-family="system-ui,sans-serif">
    <!-- Outer zodiac ring -->
    <circle cx="0" cy="0" r="118" fill="none" stroke="#334155" stroke-width="20" stroke-opacity="0.45"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4 4"/>
    <!-- Earth orbit -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Sun -->
    <circle cx="0" cy="0" r="15" fill="#facc15" stroke="#fde047" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0f172a">SUN</text>

    <!-- Earth positions (Winter vs Summer sightline) -->
    <circle cx="-52" cy="0" r="7" fill="#2563eb" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="-76" y="-12" text-anchor="middle" font-size="10" font-weight="700" fill="#93c5fd">Earth (June)</text>
    <line x1="-52" y1="0" x2="118" y2="0" stroke="#f6b73c" stroke-width="2" stroke-dasharray="5 3"/>

    <text x="148" y="4" font-size="11.5" font-weight="800" fill="#fde047">Sun appears in Gemini / Taurus</text>
    <text x="-148" y="4" text-anchor="end" font-size="11.5" font-weight="800" fill="#7dd3fc">Midnight overhead: Sagittarius</text>
    <text x="0" y="-130" text-anchor="middle" font-size="11" font-weight="700" fill="#cbd5e1">Virgo · Leo · Cancer</text>
    <text x="0" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#cbd5e1">Pisces · Aquarius · Capricornus</text>
  </g>
</svg>
