<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-label="Moku-hanga: The Four Steps and Precision Kentō Registration of Japanese Woodblock Printing">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfa868"/>
      <stop offset="50%" stop-color="#c88b48"/>
      <stop offset="100%" stop-color="#b07232"/>
    </linearGradient>
    <linearGradient id="cherryBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d48c5b"/>
      <stop offset="100%" stop-color="#9a5327"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f2ece1"/>
    </linearGradient>
    <linearGradient id="blueInk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e3a6c"/>
      <stop offset="100%" stop-color="#1d5c9f"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #fcfaf6; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #1c2434; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #526071; }
    .card { fill: #ffffff; stroke: #e2d9cd; stroke-width: 1.5; rx: 14px; }
    .step-num { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #0d5f8a; letter-spacing: 0.05em; }
    .step-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1c2434; }
    .role-jp { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #8a572c; }
    .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #4a5568; line-height: 1.5; }
    .diag-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; fill: #2c3e50; }
    .kento-callout { fill: #c0392b; font-weight: 700; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
  </style>

  <!-- Background -->
  <rect width="1000" height="680" class="bg"/>

  <!-- Header -->
  <g transform="translate(40, 42)">
    <text class="title" x="0" y="0">Moku-hanga (木版画): The Woodblock Production System</text>
    <text class="subtitle" x="0" y="24">Four collaborative masters and the mechanical kentō registration marks that aligned over a dozen color layers to within 0.5 mm.</text>
  </g>

  <!-- Step 1: Eshi (Artist) -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect class="card" width="215" height="280"/>
    <text class="step-num" x="18" y="28">STEP 1 · 01</text>
    <text class="step-title" x="18" y="52">The Master Painter</text>
    <text class="role-jp" x="18" y="70">Eshi (絵師) · Hokusai</text>
    
    <!-- Illustration: Hanshita-e brush drawing on thin washi -->
    <g transform="translate(18, 85)">
      <rect x="0" y="0" width="179" height="100" fill="url(#paperGrad)" stroke="#d9cdbe" rx="6"/>
      <!-- Fine brushwork sketch simulation -->
      <path d="M 20 80 Q 40 20 80 40 T 140 30 Q 160 50 150 75" fill="none" stroke="#1a202c" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 60 70 Q 90 55 120 70" fill="none" stroke="#1a202c" stroke-width="1.8"/>
      <path d="M 85 45 L 95 65 L 105 60" fill="none" stroke="#1a202c" stroke-width="1.5"/>
      <!-- Seal -->
      <rect x="145" y="15" width="16" height="22" fill="#c0392b" opacity="0.85" rx="2"/>
    </g>
    
    <text class="body-text" x="18" y="210">Designs the master drawing</text>
    <text class="body-text" x="18" y="228"><tspan font-weight="600" fill="#1c2434">(hanshita-e)</tspan> in black sumi</text>
    <text class="body-text" x="18" y="246">ink on ultra-thin, translucent</text>
    <text class="body-text" x="18" y="264">mulberry washi paper.</text>
  </g>

  <!-- Step 2: Horishi (Carver) -->
  <g transform="translate(275, 95)" filter="url(#shadow)">
    <rect class="card" width="215" height="280"/>
    <text class="step-num" x="18" y="28">STEP 2 · 02</text>
    <text class="step-title" x="18" y="52">The Block Carver</text>
    <text class="role-jp" x="18" y="70">Horishi (彫師)</text>
    
    <!-- Illustration: Carved cherry wood block -->
    <g transform="translate(18, 85)">
      <rect x="0" y="0" width="179" height="100" fill="url(#cherryBlock)" stroke="#83421c" rx="6"/>
      <!-- Wood grain -->
      <line x1="10" y1="20" x2="169" y2="20" stroke="#b86b36" stroke-width="1" opacity="0.4"/>
      <line x1="10" y1="50" x2="169" y2="50" stroke="#b86b36" stroke-width="1" opacity="0.4"/>
      <line x1="10" y1="80" x2="169" y2="80" stroke="#b86b36" stroke-width="1" opacity="0.4"/>
      <!-- Raised relief lines -->
      <path d="M 30 75 Q 50 30 90 45 T 150 35" fill="none" stroke="#ffe3c2" stroke-width="3" stroke-linecap="round"/>
      <path d="M 30 75 Q 50 30 90 45 T 150 35" fill="none" stroke="#4a220f" stroke-width="1.8"/>
      <!-- Chisel (Hangi-to) -->
      <path d="M 120 70 L 165 40 L 155 35 L 110 65 Z" fill="#718096" stroke="#2d3748" stroke-width="1"/>
      <rect x="145" y="25" width="25" height="12" rx="2" fill="#d69e2e" transform="rotate(-33 145 25)"/>
    </g>
    
    <text class="body-text" x="18" y="210">Pastes hanshita-e face down</text>
    <text class="body-text" x="18" y="228">on mountain cherry wood.</text>
    <text class="body-text" x="18" y="246">Carves away blank negative</text>
    <text class="body-text" x="18" y="264">space with microscopic chisels.</text>
  </g>

  <!-- Step 3: Surishi (Printer) -->
  <g transform="translate(510, 95)" filter="url(#shadow)">
    <rect class="card" width="215" height="280"/>
    <text class="step-num" x="18" y="28">STEP 3 · 03</text>
    <text class="step-title" x="18" y="52">The Master Printer</text>
    <text class="role-jp" x="18" y="70">Surishi (摺師)</text>
    
    <!-- Illustration: Inking & rubbing with baren -->
    <g transform="translate(18, 85)">
      <rect x="0" y="0" width="179" height="100" fill="url(#paperGrad)" stroke="#d9cdbe" rx="6"/>
      <rect x="15" y="15" width="149" height="70" fill="url(#blueInk)" rx="3" opacity="0.85"/>
      <!-- Baren (bamboo skin rubbing disc) -->
      <ellipse cx="120" cy="50" rx="26" ry="26" fill="#8c6239" stroke="#5d3e1e" stroke-width="2"/>
      <ellipse cx="120" cy="50" rx="19" ry="19" fill="#b0895c" stroke="#5d3e1e" stroke-width="1"/>
      <path d="M 105 50 Q 120 30 135 50" fill="none" stroke="#402a14" stroke-width="3"/>
    </g>
    
    <text class="body-text" x="18" y="210">Applies water-based pigment</text>
    <text class="body-text" x="18" y="228">and rice-flour paste (nori).</text>
    <text class="body-text" x="18" y="246">Rubs damp paper with a</text>
    <text class="body-text" x="18" y="264">bamboo-sheath <tspan font-weight="600" fill="#1c2434">baren</tspan> disc.</text>
  </g>

  <!-- Step 4: Hanmoto (Publisher) -->
  <g transform="translate(745, 95)" filter="url(#shadow)">
    <rect class="card" width="215" height="280"/>
    <text class="step-num" x="18" y="28">STEP 4 · 04</text>
    <text class="step-title" x="18" y="52">The Publisher</text>
    <text class="role-jp" x="18" y="70">Hanmoto (版元) · Eijudō</text>
    
    <!-- Illustration: Stacks of finished prints sold to public -->
    <g transform="translate(18, 85)">
      <rect x="10" y="20" width="159" height="70" fill="#e2e8f0" stroke="#cbd5e1" rx="4"/>
      <rect x="15" y="15" width="149" height="70" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <rect x="20" y="10" width="139" height="70" fill="url(#paperGrad)" stroke="#cbd5e1" rx="4"/>
      <!-- Wave preview on top sheet -->
      <path d="M 30 65 Q 60 25 90 40 T 145 35" fill="none" stroke="#0e3a6c" stroke-width="2"/>
      <circle cx="115" cy="52" r="6" fill="#c0392b"/>
      <!-- Price coin badge -->
      <rect x="110" y="55" width="40" height="18" rx="9" fill="#2b6cb0"/>
      <text x="130" y="68" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">16 MON</text>
    </g>
    
    <text class="body-text" x="18" y="210">Finances and coordinates the</text>
    <text class="body-text" x="18" y="228">entire project. Sells prints to</text>
    <text class="body-text" x="18" y="246">townsfolk for ~16 mon (the</text>
    <text class="body-text" x="18" y="264">cost of a double bowl of soba!).</text>
  </g>

  <!-- Bottom Detailed Section: Kentō Mechanical Registration -->
  <g transform="translate(40, 395)" filter="url(#shadow)">
    <rect class="card" width="920" height="255"/>
    
    <!-- Left: Cherry Woodblock Anatomy -->
    <g transform="translate(25, 20)">
      <text class="step-title" x="0" y="10">The Engineering of Kentō (見当): Sub-Millimeter Registration</text>
      <text class="body-text" x="0" y="32">Because each woodblock was printed wet and independently, paper would stretch and shrink. Japanese craftsmen solved</text>
      <text class="body-text" x="0" y="48">multi-color registration by carving two permanent raised reference notches directly into every single cherry wood block.</text>

      <!-- The Woodblock diagram -->
      <g transform="translate(20, 65)">
        <!-- Wood block base -->
        <rect x="0" y="0" width="380" height="120" fill="url(#woodGrad)" stroke="#8c5825" stroke-width="2" rx="4"/>
        <!-- Inner image relief area -->
        <rect x="35" y="18" width="310" height="84" fill="#faf6ef" stroke="#aa7338" stroke-width="1.5" rx="2"/>
        <text x="190" y="65" font-family="sans-serif" font-size="12" fill="#8c5825" text-anchor="middle" font-weight="600">Carved Relief Image Area (Hangi)</text>
        
        <!-- Kagi-kento (L-shaped corner guide) -->
        <path d="M 0 100 L 22 100 L 22 120" fill="none" stroke="#c0392b" stroke-width="4.5"/>
        <rect x="0" y="98" width="24" height="22" fill="#c0392b" opacity="0.2"/>
        <circle cx="22" cy="100" r="4" fill="#c0392b"/>
        
        <!-- Hikitsuke-kento (Straight side guide) -->
        <line x1="260" y1="120" x2="310" y2="120" stroke="#c0392b" stroke-width="4.5"/>
        <line x1="260" y1="116" x2="310" y2="116" stroke="#c0392b" stroke-width="2"/>
        
        <!-- Callout arrows and labels -->
        <!-- Corner label -->
        <line x1="22" y1="100" x2="22" y2="140" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
        <text class="kento-callout" x="22" y="154" text-anchor="start">1. Kagi-kentō (鉤見当)</text>
        <text class="diag-label" x="22" y="168" fill="#555">Right-angle corner stops paper X &amp; Y</text>

        <!-- Side label -->
        <line x1="285" y1="120" x2="285" y2="140" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
        <text class="kento-callout" x="285" y="154" text-anchor="middle">2. Hikitsuke-kentō (引付見当)</text>
        <text class="diag-label" x="285" y="168" text-anchor="middle" fill="#555">Straight edge prevents paper skew &amp; rotation</text>
      </g>
    </g>

    <!-- Right: Result comparison (Perfect Kentō vs Slippage) -->
    <g transform="translate(500, 30)">
      <rect x="0" y="0" width="395" height="205" fill="#f8fafc" stroke="#e2e8f0" rx="10"/>
      
      <!-- Box 1: Correctly Registered -->
      <g transform="translate(18, 18)">
        <text class="diag-label" x="0" y="12" fill="#2e7d32">✓ PERFECT KENTŌ ALIGNMENT</text>
        <!-- Simulation: Clean boundary between lines and blue wash -->
        <rect x="0" y="24" width="165" height="110" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
        <path d="M 15 110 C 40 40, 80 50, 150 90" fill="#1d5c9f" opacity="0.85"/>
        <path d="M 15 110 C 40 40, 80 50, 150 90" fill="none" stroke="#111827" stroke-width="2.5"/>
        <text x="10" y="150" font-family="sans-serif" font-size="11" fill="#4b5563">Colors fit inside keyblock outlines</text>
        <text x="10" y="164" font-family="sans-serif" font-size="11" fill="#4b5563">with sub-millimeter precision.</text>
      </g>

      <!-- Box 2: Misregistered (Kentō slip) -->
      <g transform="translate(210, 18)">
        <text class="diag-label" x="0" y="12" fill="#c0392b">✗ MISREGISTERED (PAPER SLIPPED)</text>
        <!-- Simulation: Offset blue wash bleeding past black line -->
        <rect x="0" y="24" width="165" height="110" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
        <path d="M 23 118 C 48 48, 88 58, 158 98" fill="#1d5c9f" opacity="0.6"/>
        <path d="M 15 110 C 40 40, 80 50, 150 90" fill="none" stroke="#111827" stroke-width="2.5"/>
        <text x="10" y="150" font-family="sans-serif" font-size="11" fill="#c0392b" font-weight="600">Color bleed &amp; white gaps</text>
        <text x="10" y="164" font-family="sans-serif" font-size="11" fill="#4b5563">Ghosting when alignment slips >0.5mm.</text>
      </g>
    </g>
  </g>
</svg>

