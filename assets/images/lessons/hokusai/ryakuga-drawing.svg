<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Hokusai's Ryakuga Haya-oshi: Drawing Through Compass Circles and Rulers">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .bg-ry { fill: #fcf9f2; }
    .title-ry { font-family: system-ui, -apple-system, sans-serif; font-size: 23px; font-weight: 800; fill: #1e293b; }
    .sub-ry { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #475569; }
    .panel-ry { fill: #ffffff; stroke: #e2d8c3; stroke-width: 1.5; rx: 12px; }
    .label-ry { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .kanji-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #854d0e; }
    .body-ry { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; line-height: 1.45; }
    .geo-guideline { stroke: #e11d48; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .geo-guideline-blue { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .brush-line { stroke: #18181b; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  </style>

  <rect width="1000" height="640" class="bg-ry"/>

  <!-- Title -->
  <g transform="translate(45, 42)">
    <text class="title-ry" x="0" y="0">Ryakuga Haya-oshi (略画早指南, 1812): Quick Drawing with Compass &amp; Ruler</text>
    <text class="sub-ry" x="0" y="24">In 1812, Hokusai published an instructional treatise demonstrating how any organic creature can be mathematically drafted using circles, lines, and squares.</text>
  </g>

  <!-- 3 Study Panels -->
  <!-- Study 1: The Sparrow (Suzume) -->
  <g transform="translate(45, 95)" filter="url(#cardShadow)">
    <rect class="panel-ry" width="285" height="400"/>
    <text class="label-ry" x="20" y="32">1. The Flying Sparrow</text>
    <text class="kanji-sub" x="20" y="50">Suzume (雀) · Built from 3 Circles</text>

    <!-- Drawing canvas -->
    <g transform="translate(20, 68)">
      <rect width="245" height="220" rx="8" fill="#faf6ed" stroke="#ded0b6"/>
      
      <!-- Compass circles (Red dashed) -->
      <!-- Head circle -->
      <circle cx="85" cy="85" r="32" class="geo-guideline"/>
      <!-- Body circle -->
      <circle cx="130" cy="120" r="48" class="geo-guideline"/>
      <!-- Wing arc circle -->
      <circle cx="160" cy="70" r="42" class="geo-guideline-blue"/>

      <!-- Center points -->
      <circle cx="85" cy="85" r="3" fill="#e11d48"/>
      <circle cx="130" cy="120" r="3" fill="#e11d48"/>
      <circle cx="160" cy="70" r="3" fill="#2563eb"/>

      <!-- Sparrow Brush Silhouette -->
      <!-- Beak -->
      <polygon points="56,85 44,82 56,80" fill="#18181b"/>
      <!-- Head contour -->
      <path d="M 56 80 C 65 58, 105 60, 115 80" class="brush-line"/>
      <!-- Eye -->
      <circle cx="68" cy="80" r="3.5" fill="#18181b"/>
      <!-- Throat & Belly -->
      <path d="M 56 85 C 75 110, 110 165, 170 145" class="brush-line"/>
      <!-- Back & Tail -->
      <path d="M 115 80 C 145 90, 175 110, 210 135 L 225 140 L 200 148" class="brush-line"/>
      <!-- Wing Up -->
      <path d="M 115 85 C 135 45, 170 35, 195 48 C 180 70, 160 85, 135 95" fill="#f4ece1" stroke="#18181b" stroke-width="2.2"/>
      <path d="M 160 50 L 175 58 M 150 62 L 165 70" stroke="#18181b" stroke-width="1.8"/>
      <!-- Cheek patch -->
      <ellipse cx="78" cy="88" rx="5" ry="3.5" fill="#18181b"/>
    </g>

    <text class="body-ry" x="20" y="315"><tspan font-weight="700" fill="#e11d48">Geometric Recipe:</tspan></text>
    <text class="body-ry" x="20" y="333">1. Draw two overlapping circles for the</text>
    <text class="body-ry" x="20" y="349">   head (r=1) and torso (r=1.5).</text>
    <text class="body-ry" x="20" y="365">2. Sweep a third circle's tangent arc to</text>
    <text class="body-ry" x="20" y="381">   generate the dynamic wing curvature.</text>
  </g>

  <!-- Study 2: Torii Gate & Perspective -->
  <g transform="translate(355, 95)" filter="url(#cardShadow)">
    <rect class="panel-ry" width="285" height="400"/>
    <text class="label-ry" x="20" y="32">2. Shrine Torii &amp; Mount Fuji</text>
    <text class="kanji-sub" x="20" y="50">Shintō Gateway · Equilateral Triangle</text>

    <!-- Drawing canvas -->
    <g transform="translate(20, 68)">
      <rect width="245" height="220" rx="8" fill="#faf6ed" stroke="#ded0b6"/>
      
      <!-- Triangular Grid (Red dashed) -->
      <polygon points="122,30 25,190 220,190" class="geo-guideline"/>
      <line x1="122" y1="30" x2="122" y2="190" class="geo-guideline-blue"/>

      <!-- Mount Fuji background -->
      <path d="M 80 140 Q 122 85 165 140" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M 110 102 Q 122 96 134 102" fill="#ffffff"/>

      <!-- Torii Gate Inked (Structured on triangle) -->
      <!-- Upper lintel (Kasagi) with curve -->
      <path d="M 35 68 Q 122 74 210 68 L 210 76 Q 122 82 35 76 Z" fill="#b91c1c" stroke="#18181b" stroke-width="2"/>
      <!-- Lower tie beam (Nuki) -->
      <rect x="52" y="90" width="140" height="9" fill="#b91c1c" stroke="#18181b" stroke-width="1.8"/>
      <!-- Two pillars (Hashira) tapered along the triangle legs! -->
      <polygon points="68,76 77,76 83,190 70,190" fill="#b91c1c" stroke="#18181b" stroke-width="1.8"/>
      <polygon points="176,76 167,76 161,190 174,190" fill="#b91c1c" stroke="#18181b" stroke-width="1.8"/>
      <!-- Base stones -->
      <rect x="65" y="190" width="22" height="8" rx="2" fill="#64748b"/>
      <rect x="157" y="190" width="22" height="8" rx="2" fill="#64748b"/>
    </g>

    <text class="body-ry" x="20" y="315"><tspan font-weight="700" fill="#e11d48">Geometric Recipe:</tspan></text>
    <text class="body-ry" x="20" y="333">1. Erect an equilateral triangle base.</text>
    <text class="body-ry" x="20" y="349">2. Slant the pillars precisely parallel to</text>
    <text class="body-ry" x="20" y="365">   the triangle's outer diagonals to give</text>
    <text class="body-ry" x="20" y="381">   the gateway architectural stability.</text>
  </g>

  <!-- Study 3: The Fisherman & Net -->
  <g transform="translate(665, 95)" filter="url(#cardShadow)">
    <rect class="panel-ry" width="285" height="400"/>
    <text class="label-ry" x="20" y="32">3. The Seated Fisherman</text>
    <text class="kanji-sub" x="20" y="50">Ryōshi (漁師) · Square &amp; Rhombus</text>

    <!-- Drawing canvas -->
    <g transform="translate(20, 68)">
      <rect width="245" height="220" rx="8" fill="#faf6ed" stroke="#ded0b6"/>
      
      <!-- Square & Circles Geometry -->
      <rect x="75" y="70" width="95" height="95" class="geo-guideline" transform="rotate(15 122 117)"/>
      <circle cx="105" cy="55" r="22" class="geo-guideline-blue"/>
      <line x1="45" y1="185" x2="200" y2="40" class="geo-guideline" stroke-dasharray="2 2"/>

      <!-- Seated figure brushwork -->
      <!-- Conical Straw Hat (Sugegasa) -->
      <polygon points="105,35 65,58 145,58" fill="#d97706" stroke="#18181b" stroke-width="2"/>
      <!-- Face profile -->
      <circle cx="100" cy="65" r="10" fill="#fbcfe8"/>
      <path d="M 96 68 Q 102 70 106 66" class="brush-line"/>
      <!-- Bent Back & Kimono -->
      <path d="M 85 62 C 60 90, 65 140, 90 160" class="brush-line"/>
      <!-- Crossed legs base -->
      <path d="M 90 160 C 120 170, 160 165, 165 145 C 160 130, 125 130, 110 125" class="brush-line"/>
      <!-- Arm holding pole -->
      <path d="M 95 85 L 125 110 L 135 105" class="brush-line"/>
      <!-- Bamboo fishing pole angled on diagonal -->
      <line x1="50" y1="180" x2="195" y2="45" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
      <path d="M 195 45 Q 215 110 220 175" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2"/>
    </g>

    <text class="body-ry" x="20" y="315"><tspan font-weight="700" fill="#2563eb">Geometric Recipe:</tspan></text>
    <text class="body-ry" x="20" y="333">1. Inscribe the torso within a rotated</text>
    <text class="body-ry" x="20" y="349">   square to balance center of mass.</text>
    <text class="body-ry" x="20" y="365">2. Run the fishing rod directly along the</text>
    <text class="body-ry" x="20" y="381">   major diagonal to convey dynamic pull.</text>
  </g>

  <!-- Bottom Teaching Note -->
  <g transform="translate(45, 520)">
    <rect width="905" height="90" rx="10" fill="#1e293b"/>
    <text x="25" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#facc15">HOKUSAI'S PEDAGOGICAL PHILOSOPHY</text>
    <text x="25" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#f1f5f9">"This book is to show that anyone can learn to draw by combining the circle and the square. A compass and a ruler</text>
    <text x="25" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#cbd5e1">are the basic tools that unlock all natural shapes: humans, beasts, architecture, and waves." — Katsushika Hokusai, 1812.</text>
  </g>
</svg>

