<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Timeline of Katsushika Hokusai: 89 Years of Constant Reinvention and Mastery">
  <defs>
    <filter id="tlShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .bg-tl { fill: #fdfbf7; }
    .title-tl { font-family: system-ui, -apple-system, sans-serif; font-size: 23px; font-weight: 800; fill: #1e293b; }
    .sub-tl { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #475569; }
    .tl-year { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 800; fill: #0284c7; }
    .tl-name-badge { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
    .tl-h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
    .tl-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #475569; line-height: 1.45; }
    .quote-box { fill: #0f2b46; rx: 10px; }
  </style>

  <rect width="1000" height="620" class="bg-tl"/>

  <!-- Title -->
  <g transform="translate(45, 42)">
    <text class="title-tl" x="0" y="0">Katsushika Hokusai (1760–1849): 89 Years of Reinvention</text>
    <text class="sub-tl" x="0" y="24">Over 30 artistic pseudonyms, 93 home relocations, and a lifelong refusal to declare himself satisfied with his skill.</text>
  </g>

  <!-- Central Backbone Line -->
  <line x1="80" y1="260" x2="920" y2="260" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

  <!-- Milestone 1: 1760 -->
  <g transform="translate(80, 110)">
    <rect width="125" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#tlShadow)"/>
    <rect x="10" y="10" width="60" height="18" rx="4" fill="#0284c7"/>
    <text class="tl-name-badge" x="40" y="23" text-anchor="middle">1760</text>
    <text class="tl-h" x="10" y="48">Born in Edo</text>
    <text class="tl-desc" x="10" y="68">Born in Katsushika</text>
    <text class="tl-desc" x="10" y="84">district of Edo.</text>
    <text class="tl-desc" x="10" y="100">Apprenticed to wood carver.</text>
    <!-- Connector -->
    <line x1="62" y1="120" x2="62" y2="150" stroke="#0284c7" stroke-width="2"/>
    <circle cx="62" cy="150" r="5" fill="#0284c7"/>
  </g>

  <!-- Milestone 2: 1779 -->
  <g transform="translate(205, 290)">
    <!-- Connector -->
    <line x1="62" y1="0" x2="62" y2="-30" stroke="#0284c7" stroke-width="2"/>
    <circle cx="62" cy="-30" r="5" fill="#0284c7"/>
    <rect width="125" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#tlShadow)"/>
    <rect x="10" y="10" width="75" height="18" rx="4" fill="#854d0e"/>
    <text class="tl-name-badge" x="47" y="23" text-anchor="middle">SHUNRŌ · 1779</text>
    <text class="tl-h" x="10" y="48">Actor Prints</text>
    <text class="tl-desc" x="10" y="68">Trains with master</text>
    <text class="tl-desc" x="10" y="84">Katsukawa Shunshō;</text>
    <text class="tl-desc" x="10" y="100">masters kabuki prints.</text>
  </g>

  <!-- Milestone 3: 1798 -->
  <g transform="translate(330, 110)">
    <rect width="125" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#tlShadow)"/>
    <rect x="10" y="10" width="80" height="18" rx="4" fill="#0d9488"/>
    <text class="tl-name-badge" x="50" y="23" text-anchor="middle">HOKUSAI · 1798</text>
    <text class="tl-h" x="10" y="48">Independence</text>
    <text class="tl-desc" x="10" y="68">Adopts "North Studio"</text>
    <text class="tl-desc" x="10" y="84">(honoring Polaris);</text>
    <text class="tl-desc" x="10" y="100">leaves guild traditions.</text>
    <!-- Connector -->
    <line x1="62" y1="120" x2="62" y2="150" stroke="#0284c7" stroke-width="2"/>
    <circle cx="62" cy="150" r="5" fill="#0284c7"/>
  </g>

  <!-- Milestone 4: 1812–1814 -->
  <g transform="translate(460, 290)">
    <!-- Connector -->
    <line x1="62" y1="0" x2="62" y2="-30" stroke="#0284c7" stroke-width="2"/>
    <circle cx="62" cy="-30" r="5" fill="#0284c7"/>
    <rect width="135" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#tlShadow)"/>
    <rect x="10" y="10" width="75" height="18" rx="4" fill="#7c3aed"/>
    <text class="tl-name-badge" x="47" y="23" text-anchor="middle">TAITO · 1814</text>
    <text class="tl-h" x="10" y="48">Hokusai Manga</text>
    <text class="tl-desc" x="10" y="68">Draws 15 volumes</text>
    <text class="tl-desc" x="10" y="84">and 4,000 sketches;</text>
    <text class="tl-desc" x="10" y="100">teaches geometry.</text>
  </g>

  <!-- Milestone 5: 1830–1832 -->
  <g transform="translate(595, 90)">
    <rect width="150" height="140" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#tlShadow)"/>
    <rect x="10" y="10" width="70" height="18" rx="4" fill="#0284c7"/>
    <text class="tl-name-badge" x="45" y="23" text-anchor="middle">IITSU · 1830</text>
    <text class="tl-h" x="10" y="48">Thirty-Six Views</text>
    <text class="tl-desc" x="10" y="68">Age 70! Creates</text>
    <text class="tl-desc" x="10" y="84"><tspan font-weight="700" fill="#0f2b46">The Great Wave</tspan> and</text>
    <text class="tl-desc" x="10" y="100"><tspan font-weight="700" fill="#b91c1c">Red Fuji</tspan> using</text>
    <text class="tl-desc" x="10" y="116">Prussian Blue.</text>
    <!-- Connector -->
    <line x1="75" y1="140" x2="75" y2="170" stroke="#0284c7" stroke-width="2"/>
    <circle cx="75" cy="170" r="5" fill="#0284c7"/>
  </g>

  <!-- Milestone 6: 1834 -->
  <g transform="translate(745, 290)">
    <!-- Connector -->
    <line x1="62" y1="0" x2="62" y2="-30" stroke="#0284c7" stroke-width="2"/>
    <circle cx="62" cy="-30" r="5" fill="#0284c7"/>
    <rect width="135" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#tlShadow)"/>
    <rect x="10" y="10" width="85" height="18" rx="4" fill="#dc2626"/>
    <text class="tl-name-badge" x="52" y="23" text-anchor="middle">MANJI · 1834</text>
    <text class="tl-h" x="10" y="48">Gakyō Rōjin</text>
    <text class="tl-desc" x="10" y="68">Calls himself "Old</text>
    <text class="tl-desc" x="10" y="84">Man Mad About Art";</text>
    <text class="tl-desc" x="10" y="100">writes famous manifesto.</text>
  </g>

  <!-- Milestone 7: 1849 -->
  <g transform="translate(880, 110)">
    <rect width="90" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#tlShadow)"/>
    <rect x="10" y="10" width="55" height="18" rx="4" fill="#334155"/>
    <text class="tl-name-badge" x="37" y="23" text-anchor="middle">1849</text>
    <text class="tl-h" x="10" y="48">Passing</text>
    <text class="tl-desc" x="10" y="68">Dies at 89.</text>
    <text class="tl-desc" x="10" y="86">"Grant me</text>
    <text class="tl-desc" x="10" y="102">5 more years..."</text>
    <!-- Connector -->
    <line x1="45" y1="120" x2="45" y2="150" stroke="#0284c7" stroke-width="2"/>
    <circle cx="45" cy="150" r="5" fill="#0284c7"/>
  </g>

  <!-- Famous Quote Box at Bottom -->
  <g transform="translate(45, 450)">
    <rect width="910" height="145" class="quote-box"/>
    <text x="30" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">HOKUSAI'S FAMOUS 1834 CREDO · FROM ONE HUNDRED VIEWS OF MOUNT FUJI</text>
    <text x="30" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">"From the age of six I had a passion for copying forms; until seventy, nothing that I drew was worthy of notice.</text>
    <text x="30" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">At seventy-three I began to fathom the approximate structure of animals, insects, fish, and plants.</text>
    <text x="30" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">At eighty I shall have made further progress; at ninety I will penetrate the secret of things; at one hundred I shall have reached a divine condition,</text>
    <text x="30" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#facc15">and at one hundred and ten, every dot and every stroke will be alive."</text>
  </g>
</svg>

