<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-label="The Geometry of The Great Wave: Logarithmic Spirals, Framing Triangles, and Fractal Self-Similarity">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143454"/>
      <stop offset="60%" stop-color="#0b1e33"/>
      <stop offset="100%" stop-color="#061220"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#19487c"/>
      <stop offset="50%" stop-color="#123861"/>
      <stop offset="100%" stop-color="#0d2847"/>
    </linearGradient>
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f1f5"/>
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-geo { fill: #0d1b2a; }
    .title-geo { font-family: system-ui, -apple-system, sans-serif; font-size: 23px; font-weight: 800; fill: #ffffff; }
    .subtitle-geo { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #94a3b8; }
    .geo-legend-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .geo-legend-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #cbd5e1; line-height: 1.4; }
  </style>

  <!-- Background -->
  <rect width="1000" height="680" class="bg-geo"/>

  <!-- Header -->
  <g transform="translate(45, 42)">
    <text class="title-geo" x="0" y="0">Mathematical Composition of Under the Wave off Kanagawa</text>
    <text class="subtitle-geo" x="0" y="24">Logarithmic spirals, nested framing triangles, and scale-invariant fractal spray analyzed through modern geometry.</text>
  </g>

  <!-- Main Canvas Preview (Left 620px) -->
  <g transform="translate(45, 85)">
    <!-- Base Wave Composition Sketch -->
    <rect x="0" y="0" width="580" height="420" rx="10" fill="#f4ebd9" stroke="#334155" stroke-width="2"/>

    <!-- Soft sky bokashi -->
    <rect x="0" y="0" width="580" height="180" fill="#c3daf0" opacity="0.35"/>
    <path d="M 0 180 Q 290 240 580 180 L 580 0 L 0 0 Z" fill="#99bddf" opacity="0.4"/>

    <!-- Distant Mount Fuji (Small triangle in trough) -->
    <!-- Base shadow -->
    <path d="M 270 330 L 298 250 L 326 330 Z" fill="#2d425c"/>
    <!-- Snow peak -->
    <path d="M 290 272 L 298 250 L 306 272 Q 298 276 290 272 Z" fill="#ffffff"/>

    <!-- Small Secondary Wave (Fore) -->
    <path d="M 0 420 Q 80 340 180 370 Q 250 390 320 420 Z" fill="#1b497a"/>

    <!-- Primary Great Wave Body -->
    <path d="M 0 420 C 60 410, 140 370, 160 300 C 180 230, 140 120, 220 80 C 270 50, 380 90, 420 170 C 428 186, 425 210, 400 220 C 370 232, 345 200, 360 170 C 340 160, 300 175, 260 215 C 220 255, 180 330, 230 420 Z" fill="url(#waveFill)"/>

    <!-- White Wave Foam Crest & Claws -->
    <path d="M 180 100 Q 220 70 270 65 Q 350 70 410 130 C 428 148, 435 175, 415 195 C 400 208, 385 190, 395 175 C 375 165, 350 180, 335 195 Q 310 220, 290 250 Q 260 300, 220 330" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Foam Claws (Claw 1, 2, 3) -->
    <path d="M 410 130 Q 425 110 440 120 Q 425 135 415 145" fill="#ffffff"/>
    <path d="M 370 85 Q 385 65 395 78 Q 380 95 365 100" fill="#ffffff"/>
    <path d="M 320 68 Q 330 48 342 58 Q 330 75 318 80" fill="#ffffff"/>
    <path d="M 270 65 Q 275 42 288 50 Q 280 68 268 75" fill="#ffffff"/>

    <!-- Boat 1 (slender cargo boat caught in swell) -->
    <path d="M 190 380 Q 280 350 370 340 L 375 348 Q 280 360 185 390 Z" fill="#d49e6a" stroke="#8a5a2a" stroke-width="1.5"/>

    <!-- OVERLAY 1: LOGARITHMIC SPIRAL (Gold glowing curve) -->
    <path d="M 410 175 
             C 410 150, 390 120, 350 100 
             C 290 70, 210 90, 160 160 
             C 100 244, 110 330, 150 400 
             C 180 452, 250 480, 340 470" 
          fill="none" stroke="#f59e0b" stroke-width="3.5" filter="url(#glowGold)" stroke-dasharray="8 4"/>
    <circle cx="370" cy="190" r="5" fill="#f59e0b" filter="url(#glowGold)"/>

    <!-- OVERLAY 2: FRAMING TRIANGLES (Cyan geometry) -->
    <!-- Large Wave Triangle -->
    <polygon points="50,420 420,130 520,420" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="6 4"/>
    <!-- Distant Mount Fuji Triangle -->
    <polygon points="265,335 298,245 331,335" fill="none" stroke="#38bdf8" stroke-width="2"/>

    <!-- Points and Anchor Labels -->
    <circle cx="420" cy="130" r="4" fill="#06b6d4"/>
    <circle cx="298" cy="245" r="4" fill="#38bdf8"/>

    <!-- Angle annotation for Fuji -->
    <path d="M 285 335 A 15 15 0 0 1 292 320" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Bottom note in canvas -->
    <rect x="15" y="375" width="220" height="30" rx="6" fill="#0f172acc" stroke="#334155"/>
    <text x="25" y="395" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Golden Ratio Spiral: r = a · e^(bθ)</text>
  </g>

  <!-- Side Legend Cards (Right 320px) -->
  <g transform="translate(650, 85)">
    <!-- Card 1: Logarithmic Spiral -->
    <g transform="translate(0, 0)">
      <rect width="305" height="130" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="24" cy="26" r="8" fill="#f59e0b"/>
      <text class="geo-legend-title" x="42" y="31">1. The Logarithmic Spiral</text>
      <text class="geo-legend-desc" x="20" y="60">The towering wave conforms to a logarithmic</text>
      <text class="geo-legend-desc" x="20" y="78">(equiangular) spiral, where the radius grows</text>
      <text class="geo-legend-desc" x="20" y="96">exponentially with angle: <tspan fill="#f59e0b" font-weight="700">r = a · e^(bθ)</tspan>.</text>
      <text class="geo-legend-desc" x="20" y="114">This curve governs galactic arms &amp; nautilus shells.</text>
    </g>

    <!-- Card 2: Nested Triangles -->
    <g transform="translate(0, 145)">
      <rect width="305" height="130" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <polygon points="24,18 31,34 17,34" fill="#06b6d4"/>
      <text class="geo-legend-title" x="42" y="31">2. Nested Triangular Framing</text>
      <text class="geo-legend-desc" x="20" y="60">Notice Mount Fuji in the distance: a static,</text>
      <text class="geo-legend-desc" x="20" y="78">sacred triangle centered exactly inside the</text>
      <text class="geo-legend-desc" x="20" y="96">eye of a chaotic, crashing water triangle.</text>
      <text class="geo-legend-desc" x="20" y="114">Permanence framed by violent transience.</text>
    </g>

    <!-- Card 3: Fractal Self-Similarity -->
    <g transform="translate(0, 290)">
      <rect width="305" height="130" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="24" cy="26" r="8" fill="#a855f7"/>
      <text class="geo-legend-title" x="42" y="31">3. Fractal Foam Claws</text>
      <text class="geo-legend-desc" x="20" y="60">The crest does not break smoothly. It fractures</text>
      <text class="geo-legend-desc" x="20" y="78">into secondary finger-like claws, which branch</text>
      <text class="geo-legend-desc" x="20" y="96">into tertiary droplets — exhibiting <tspan fill="#d8b4fe" font-weight="700">fractal</tspan></text>
      <text class="geo-legend-desc" x="20" y="114"><tspan fill="#d8b4fe" font-weight="700">self-similarity</tspan> 150 years before Mandelbrot.</text>
    </g>
  </g>

  <!-- Bottom Interactive Prompt / Quote Banner -->
  <g transform="translate(45, 525)">
    <rect width="910" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">COMPOSITIONAL INSIGHT · WESTERN PERSPECTIVE MEETS JAPANESE SPATIAL DEPTH</text>
    <text x="25" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Hokusai studied European copperplate engravings imported secretly through the Dutch trading post in Dejima, Nagasaki.</text>
    <text x="25" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">He combined Western deep linear perspective (low horizon, dramatic foreshortening) with traditional Japanese decorative flatness,</text>
    <text x="25" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">creating an unprecedented vortex that pulls the viewer's eye directly into the heart of the storm.</text>
  </g>
</svg>

