<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="The Chemistry of Prussian Blue: Molecular Lattice, Intervalence Charge Transfer, and UV Lightfastness">
  <defs>
    <linearGradient id="prussianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b46"/>
      <stop offset="50%" stop-color="#003153"/>
      <stop offset="100%" stop-color="#001829"/>
    </linearGradient>
    <filter id="shadowChem" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.1"/>
    </filter>
  </defs>

  <style>
    .bg-chem { fill: #f8fafc; }
    .title-ch { font-family: system-ui, -apple-system, sans-serif; font-size: 23px; font-weight: 800; fill: #0f172a; }
    .sub-ch { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #475569; }
    .panel-ch { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 12px; }
    .h-ch { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .body-ch { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; line-height: 1.5; }
    .chem-formula { font-family: "Courier New", monospace; font-size: 14px; font-weight: bold; fill: #003153; }
  </style>

  <rect width="1000" height="640" class="bg-chem"/>

  <!-- Title -->
  <g transform="translate(45, 42)">
    <text class="title-ch" x="0" y="0">The Science of Prussian Blue (Bero-ai / べろ藍)</text>
    <text class="sub-ch" x="0" y="24">How a synthetic inorganic dye discovered in Berlin in 1704 revolutionized Japanese ukiyo-e printing through coordination chemistry.</text>
  </g>

  <!-- Left Card: The Coordination Crystal Lattice -->
  <g transform="translate(45, 95)" filter="url(#shadowChem)">
    <rect class="panel-ch" width="460" height="390"/>
    <text class="h-ch" x="22" y="32">1. The Face-Centered Cubic Coordination Lattice</text>
    <text class="chem-formula" x="22" y="55">Fe³⁺₄ [ Fe²⁺(CN)₆ ]₃ · x H₂O</text>

    <!-- Lattice Diagram -->
    <g transform="translate(45, 75)">
      <!-- 3D Perspective Box -->
      <polygon points="50,60 170,20 290,60 170,100" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <polygon points="50,60 170,100 170,220 50,180" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
      <polygon points="170,100 290,60 290,180 170,220" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Connecting Cyanide Ligand Bonds (-C≡N-) -->
      <line x1="50" y1="60" x2="170" y2="100" stroke="#64748b" stroke-width="3"/>
      <line x1="170" y1="100" x2="290" y2="60" stroke="#64748b" stroke-width="3"/>
      <line x1="50" y1="180" x2="170" y2="220" stroke="#64748b" stroke-width="3"/>
      <line x1="170" y1="220" x2="290" y2="180" stroke="#64748b" stroke-width="3"/>
      <line x1="170" y1="100" x2="170" y2="220" stroke="#64748b" stroke-width="3"/>
      <line x1="50" y1="60" x2="50" y2="180" stroke="#64748b" stroke-width="3"/>
      <line x1="290" y1="60" x2="290" y2="180" stroke="#64748b" stroke-width="3"/>

      <!-- Fe(III) ions (Golden Rust orange) -->
      <circle cx="50" cy="60" r="14" fill="#ea580c" stroke="#9a3412" stroke-width="2"/>
      <text x="50" y="64" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Fe³⁺</text>

      <circle cx="290" cy="60" r="14" fill="#ea580c" stroke="#9a3412" stroke-width="2"/>
      <text x="290" y="64" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Fe³⁺</text>

      <circle cx="170" cy="220" r="14" fill="#ea580c" stroke="#9a3412" stroke-width="2"/>
      <text x="170" y="224" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Fe³⁺</text>

      <!-- Fe(II) ions (Deep Cyan Blue) -->
      <circle cx="170" cy="100" r="14" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
      <text x="170" y="104" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Fe²⁺</text>

      <circle cx="50" cy="180" r="14" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
      <text x="50" y="184" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Fe²⁺</text>

      <circle cx="290" cy="180" r="14" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
      <text x="290" y="184" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Fe²⁺</text>

      <!-- Cyanide bridge label -->
      <rect x="75" y="86" width="60" height="20" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="105" y="100" fill="#334155" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">- C ≡ N -</text>
    </g>

    <!-- Intervalence explanation -->
    <text class="body-ch" x="22" y="325"><tspan font-weight="700" fill="#003153">Intervalence Charge-Transfer (IVCT):</tspan></text>
    <text class="body-ch" x="22" y="342">When photons of red/orange light (~680 nm) hit the crystal,</text>
    <text class="body-ch" x="22" y="358">an electron hops from Fe²⁺ to Fe³⁺ via the cyanide bridge.</text>
    <text class="body-ch" x="22" y="374">Red is absorbed with near-100% efficiency; pure deep blue is reflected!</text>
  </g>

  <!-- Right Card: Lightfastness Comparison (UV Exposure) -->
  <g transform="translate(525, 95)" filter="url(#shadowChem)">
    <rect class="panel-ch" width="430" height="390"/>
    <text class="h-ch" x="22" y="32">2. Lightfastness &amp; Chemical Stability Over Time</text>
    <text class="sub-ch" x="22" y="52">Comparison across 200 years of environmental exposure</text>

    <!-- Graph: Retained Hue vs Time (Years) -->
    <g transform="translate(45, 80)">
      <!-- Axes -->
      <line x1="30" y1="180" x2="340" y2="180" stroke="#64748b" stroke-width="1.5"/>
      <line x1="30" y1="180" x2="30" y2="20" stroke="#64748b" stroke-width="1.5"/>
      
      <!-- Axis Labels -->
      <text x="30" y="198" fill="#64748b" font-family="sans-serif" font-size="10">0 yrs</text>
      <text x="130" y="198" fill="#64748b" font-family="sans-serif" font-size="10">50 yrs</text>
      <text x="230" y="198" fill="#64748b" font-family="sans-serif" font-size="10">100 yrs</text>
      <text x="320" y="198" fill="#64748b" font-family="sans-serif" font-size="10">200 yrs</text>
      <text x="25" y="15" fill="#64748b" font-family="sans-serif" font-size="10">100% Color</text>
      <text x="25" y="105" fill="#64748b" font-family="sans-serif" font-size="10">50%</text>

      <!-- Prussian Blue Curve (Steady at ~98%) -->
      <path d="M 30 25 L 340 32" fill="none" stroke="#003153" stroke-width="4"/>
      <circle cx="340" cy="32" r="5" fill="#003153"/>
      <text x="220" y="24" fill="#003153" font-family="sans-serif" font-size="11" font-weight="bold">Prussian Blue (96%)</text>

      <!-- Plant Indigo (Ai) Curve (Degrades to 55%) -->
      <path d="M 30 25 Q 120 70 200 100 T 340 125" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 3"/>
      <circle cx="340" cy="125" r="4" fill="#2563eb"/>
      <text x="230" y="115" fill="#2563eb" font-family="sans-serif" font-size="11" font-weight="bold">Natural Indigo (52%)</text>

      <!-- Dayflower Blue (Tsuyukusa) Curve (Fades to 10%) -->
      <path d="M 30 25 Q 80 120 180 160 T 340 172" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/>
      <circle cx="340" cy="172" r="4" fill="#94a3b8"/>
      <text x="180" y="155" fill="#64748b" font-family="sans-serif" font-size="11">Dayflower Blue (8%)</text>
    </g>

    <!-- Contrast Table / Comparison Points -->
    <g transform="translate(22, 290)">
      <rect width="386" height="78" rx="8" fill="#f1f5f9"/>
      <text x="14" y="22" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#003153">Why Hokusai Switched in 1830:</text>
      <text x="14" y="40" font-family="sans-serif" font-size="11" fill="#334155">• Traditional indigo turned muddy gray-green upon aging.</text>
      <text x="14" y="56" font-family="sans-serif" font-size="11" fill="#334155">• Prussian blue dissolved smoothly with nori (rice paste) for bokashi.</text>
      <text x="14" y="72" font-family="sans-serif" font-size="11" fill="#334155">• Allowed 4 distinct shades of blue on a single woodblock set!</text>
    </g>
  </g>

  <!-- Bottom Historical Context Banner -->
  <g transform="translate(45, 505)">
    <rect width="910" height="105" rx="10" fill="#00213b"/>
    <text x="25" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#38bdf8">GLOBAL TRADE DURING SAKOKU (NATIONAL ISOLATION)</text>
    <text x="25" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">Even though Tokugawa Japan banned foreign contact under the Sakoku edicts, the Dutch East India Company maintained an artificial island trading post</text>
    <text x="25" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">at Dejima in Nagasaki. By 1829, Chinese and Dutch merchants began importing Prussian Blue at drastically reduced prices.</text>
    <text x="25" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0">Hokusai and his publisher Eijudō seized this chemical breakthrough, advertising Thirty-Six Views of Mount Fuji as printed in authentic "Bero-ai"!</text>
  </g>
</svg>

