<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="kbpm-title">
  <title id="kbpm-title">Kuiper Belt Orbital Populations From 30 AU to 100 AU</title>
  <rect width="900" height="330" rx="16" fill="#090d1a"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#f8fafc">The Architecture of the Kuiper Belt (30–50+ AU)</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#94a3b8">Neptune's orbital migration sculpted outer icy bodies into three distinct populations beyond 30 AU.</text>

  <!-- Distance scale -->
  <g transform="translate(50 92)" font-family="system-ui,sans-serif">
    <line x1="0" y1="168" x2="800" y2="168" stroke="#475569" stroke-width="2"/>
    <!-- AU marks -->
    <text x="20" y="190" text-anchor="middle" font-size="11" fill="#fde047" font-weight="800">0 AU (Sun)</text>
    <circle cx="20" cy="112" r="14" fill="#facc15"/>

    <line x1="150" y1="60" x2="150" y2="174" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="150" cy="112" r="9" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
    <text x="150" y="190" text-anchor="middle" font-size="11" font-weight="800" fill="#93c5fd">30 AU · Neptune</text>

    <!-- 3:2 Plutinos Band (~39.4 AU) -->
    <rect x="235" y="64" width="110" height="96" rx="10" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="290" y="84" text-anchor="middle" font-size="12" font-weight="800" fill="#7dd3fc">3:2 Plutinos</text>
    <text x="290" y="102" text-anchor="middle" font-size="10.5" fill="#e2e8f0">~39.4 AU</text>
    <text x="290" y="120" text-anchor="middle" font-size="10" fill="#cbd5e1">Pluto &amp; Charon</text>
    <text x="290" y="135" text-anchor="middle" font-size="10" fill="#cbd5e1">(2 orbits per 3 Neptune)</text>

    <!-- Classical Belt Band (~42-48 AU) -->
    <rect x="360" y="64" width="180" height="96" rx="10" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="450" y="84" text-anchor="middle" font-size="12" font-weight="800" fill="#ddd6fe">Classical Belt</text>
    <text x="450" y="102" text-anchor="middle" font-size="10.5" fill="#e2e8f0">42 – 48 AU</text>
    <text x="450" y="120" text-anchor="middle" font-size="10" fill="#cbd5e1">Arrokoth · Makemake</text>
    <text x="450" y="135" text-anchor="middle" font-size="10" fill="#cbd5e1">Haumea (near-circular)</text>

    <!-- Scattered Disk (50-100+ AU) -->
    <rect x="556" y="42" width="234" height="118" rx="10" fill="#f97316" fill-opacity="0.14" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="673" y="66" text-anchor="middle" font-size="12" font-weight="800" fill="#fdba74">Scattered Disk (50 – 100+ AU)</text>
    <text x="673" y="86" text-anchor="middle" font-size="10.5" fill="#e2e8f0">Eris (~68 AU avg, reaches 97 AU)</text>
    <text x="673" y="104" text-anchor="middle" font-size="10" fill="#cbd5e1">Elliptical, tilted orbits flung outward by</text>
    <text x="673" y="119" text-anchor="middle" font-size="10" fill="#cbd5e1">close gravitational encounters with Neptune</text>
    <text x="673" y="139" text-anchor="middle" font-size="10" font-weight="700" fill="#fed7aa">Source of many short-period comets</text>

    <text x="450" y="190" text-anchor="middle" font-size="11" fill="#cbd5e1">45 AU (Arrokoth)</text>
    <text x="673" y="190" text-anchor="middle" font-size="11" fill="#fdba74">50 → 100+ AU (Eris / Scattered)</text>
  </g>
</svg>
