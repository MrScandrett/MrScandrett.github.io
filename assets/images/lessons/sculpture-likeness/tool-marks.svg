<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Six cross-sections of a marble surface: pitted by a point chisel, grooved by a claw chisel, faceted by a flat chisel, holed by a drill, smoothed by a rasp, and glossy after polishing.">
<rect width="1000" height="520" fill="#f7f5ee"/><path d="M0 0h1000v8H0z" fill="#1e5f69"/>
<text x="42" y="53" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#193f49">Every tool leaves its own mark</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#49636b">Each cross-section shows the stone surface a tool leaves. Sculptors read these marks to see how far a carving has come.</text>
