<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="A Venn diagram of three traits, moves while staying in one piece, useful tool, and likeness, with three example plans that cover all three.">
<rect width="1000" height="520" fill="#f7f5ee"/><path d="M0 0h1000v8H0z" fill="#1e5f69"/>
<text x="42" y="53" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#193f49">Three traits, any combination</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#49636b">This quarter every student shows all three. One object can carry all three, or spread them across two or three prints.</text>
<circle cx="230" cy="250" r="118" fill="#2f7fa8" fill-opacity=".22" stroke="#2f7fa8" stroke-width="3"/><circle cx="370" cy="250" r="118" fill="#d9822b" fill-opacity=".22" stroke="#d9822b" stroke-width="3"/><circle cx="300" cy="365" r="118" fill="#7b5aa6" fill-opacity=".22" stroke="#7b5aa6" stroke-width="3"/><text x="178" y="205" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1d4f69" text-anchor="middle">MOVES</text><text x="178" y="226" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="400" fill="#1d4f69" text-anchor="middle">stays in one</text><text x="178" y="243" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="400" fill="#1d4f69" text-anchor="middle">printed piece</text><text x="422" y="205" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7a420d" text-anchor="middle">USEFUL</text><text x="422" y="226" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="400" fill="#7a420d" text-anchor="middle">does a real</text><text x="422" y="243" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="400" fill="#7a420d" text-anchor="middle">job for a user</text><text x="300" y="425" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#4a3170" text-anchor="middle">LIKENESS</text><text x="300" y="446" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="400" fill="#4a3170" text-anchor="middle">recognisable as</text><text x="300" y="463" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="400" fill="#4a3170" text-anchor="middle">something else</text><circle cx="300" cy="292" r="22" fill="#fff" stroke="#193f49" stroke-width="2.5"/><text x="300" y="298" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#193f49" text-anchor="middle">3</text><rect x="560" y="112" width="398" height="104" rx="16" fill="#fff" stroke="#bdd0cc" stroke-width="2"/><text x="580" y="144" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#193f49" text-anchor="start">One object, all three</text><text x="580" y="170" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">A turtle tape dispenser whose shell</text><text x="580" y="190" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">hinges open on a print-in-place pin.</text><circle cx="930" cy="139" r="8" fill="#7b5aa6"/><circle cx="910" cy="139" r="8" fill="#d9822b"/><circle cx="890" cy="139" r="8" fill="#2f7fa8"/><rect x="560" y="230" width="398" height="104" rx="16" fill="#fff" stroke="#bdd0cc" stroke-width="2"/><text x="580" y="262" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#193f49" text-anchor="start">Two objects</text><text x="580" y="288" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">A phone stand with a turning base,</text><text x="580" y="308" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">plus a carved owl paperweight.</text><circle cx="930" cy="257" r="8" fill="#7b5aa6"/><circle cx="900" cy="257" r="8" fill="#d9822b"/><circle cx="880" cy="257" r="8" fill="#2f7fa8"/><rect x="560" y="348" width="398" height="104" rx="16" fill="#fff" stroke="#bdd0cc" stroke-width="2"/><text x="580" y="380" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#193f49" text-anchor="start">Three objects</text><text x="580" y="406" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">A print-in-place chain, a cable clip,</text><text x="580" y="426" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">and a portrait bust.</text><circle cx="930" cy="375" r="8" fill="#7b5aa6"/><circle cx="900" cy="375" r="8" fill="#d9822b"/><circle cx="870" cy="375" r="8" fill="#2f7fa8"/><text x="560" y="490" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1e5f69" text-anchor="start">Rule: every trait appears at least once in what you hand in.</text></svg>
