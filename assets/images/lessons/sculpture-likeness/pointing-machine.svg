<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="A plaster bust with marked points, a pointing machine that measures the depth of one point, and a marble block drilled to that depth with the figure shown inside it.">
<rect width="1000" height="520" fill="#f7f5ee"/><path d="M0 0h1000v8H0z" fill="#1e5f69"/>
<text x="42" y="53" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#193f49">The pointing machine copies a model, point by point</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#49636b">From the 1800s, workshops used it to turn a plaster model into marble. The machine only measures; the carver still cuts.</text>
<rect x="42" y="110" width="276" height="330" rx="16" fill="#fff" stroke="#bdd0cc" stroke-width="2"/><text x="60" y="142" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#193f49" text-anchor="start">1 · The plaster model</text><path d="M180 190 c-34 0 -52 26 -52 58 c0 22 8 36 18 46 l-2 18 c-30 6 -54 20 -60 44 h188 c-6 -24 -30 -38 -60 -44 l-2 -18 c10 -10 18 -24 18 -46 c0 -32 -18 -58 -50 -58 z" fill="#ece8df" stroke="#8d8370" stroke-width="3"/><path d="M155 217l10 10M165 217l-10 10" stroke="#b7354a" stroke-width="2.5"/><path d="M193 209l10 10M203 209l-10 10" stroke="#b7354a" stroke-width="2.5"/><path d="M171 255l10 10M181 255l-10 10" stroke="#b7354a" stroke-width="2.5"/><path d="M145 295l10 10M155 295l-10 10" stroke="#b7354a" stroke-width="2.5"/><path d="M207 295l10 10M217 295l-10 10" stroke="#b7354a" stroke-width="2.5"/><path d="M123 345l10 10M133 345l-10 10" stroke="#b7354a" stroke-width="2.5"/><path d="M227 347l10 10M237 347l-10 10" stroke="#b7354a" stroke-width="2.5"/><path d="M175 325l10 10M185 325l-10 10" stroke="#b7354a" stroke-width="2.5"/><text x="60" y="410" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">Mark points on the high spots:</text><text x="60" y="428" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">nose, brow, chin, shoulders.</text><rect x="362" y="110" width="276" height="330" rx="16" fill="#fff" stroke="#bdd0cc" stroke-width="2"/><text x="380" y="142" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#193f49" text-anchor="start">2 · Measure one point</text><path d="M420 190 h160 M500 190 v170 M430 360 h140" stroke="#40647a" stroke-width="6" stroke-linecap="round"/><circle cx="420" cy="190" r="8" fill="#e4aa72" stroke="#895a4b" stroke-width="2"/><circle cx="580" cy="190" r="8" fill="#e4aa72" stroke="#895a4b" stroke-width="2"/><circle cx="500" cy="360" r="8" fill="#e4aa72" stroke="#895a4b" stroke-width="2"/><path d="M500 270 h70" stroke="#40647a" stroke-width="4"/><path d="M570 270 l46 22" stroke="#193f49" stroke-width="4" stroke-linecap="round"/><circle cx="616" cy="292" r="4" fill="#b7354a"/><text x="380" y="392" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">Three anchors fix the machine;</text><text x="380" y="410" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">the needle slides until it</text><text x="380" y="428" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">touches the point. Lock it.</text><rect x="682" y="110" width="276" height="330" rx="16" fill="#fff" stroke="#bdd0cc" stroke-width="2"/><text x="700" y="142" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#193f49" text-anchor="start">3 · Drill, then carve to it</text><rect x="730" y="170" width="180" height="210" fill="#e7e2d6" stroke="#8d8370" stroke-width="3"/><path d="M820 196 c-34 0 -52 26 -52 58 c0 22 8 36 18 46 l-2 18 c-30 6 -54 20 -60 44 h188 c-6 -24 -30 -38 -60 -44 l-2 -18 c10 -10 18 -24 18 -46 c0 -32 -18 -58 -50 -58 z" fill="none" stroke="#1e5f69" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M730 230 h22" stroke="#5a4e3c" stroke-width="7" stroke-linecap="round"/><path d="M730 300 h30" stroke="#5a4e3c" stroke-width="7" stroke-linecap="round"/><path d="M910 240 h-24" stroke="#5a4e3c" stroke-width="7" stroke-linecap="round"/><path d="M910 330 h-18" stroke="#5a4e3c" stroke-width="7" stroke-linecap="round"/><path d="M820 170 v30" stroke="#5a4e3c" stroke-width="7" stroke-linecap="round"/><text x="700" y="410" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">Drill each point a little short;</text><text x="700" y="428" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">carve down to the hole bottoms.</text><text x="42" y="478" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1e5f69" text-anchor="start">The Marble Studio’s Points view is this machine: each dot shows how much stone still stands over one point of the model.</text></svg>
