<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Four owls: a blocky silhouette, then rounded big masses, then eyes, beak and feathers, and finally the same owl as a black silhouette.">
<rect width="1000" height="520" fill="#f7f5ee"/><path d="M0 0h1000v8H0z" fill="#1e5f69"/>
<text x="42" y="53" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#193f49">Build a likeness big → medium → small</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#49636b">Get the shape that is recognisable from across the room first. Details come last, and only if the big forms are right.</text>
<rect x="42" y="110" width="212" height="330" rx="16" fill="#fff" stroke="#bdd0cc" stroke-width="2"/><text x="58" y="142" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#193f49" text-anchor="start">1 · Block in</text><path d="M90 390 L86 250 L100 190 L108 165 L124 186 h48 L188 165 L196 190 L210 250 L206 390 Z" fill="#e7e2d6" stroke="#8d8370" stroke-width="3" stroke-linejoin="round"/><text x="58" y="428" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">Silhouette and proportions.</text><rect x="277" y="110" width="212" height="330" rx="16" fill="#fff" stroke="#bdd0cc" stroke-width="2"/><text x="293" y="142" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#193f49" text-anchor="start">2 · Big forms</text><ellipse cx="383" cy="315" rx="62" ry="78" fill="#e7e2d6" stroke="#8d8370" stroke-width="3"/><ellipse cx="383" cy="222" rx="56" ry="46" fill="#e7e2d6" stroke="#8d8370" stroke-width="3"/><path d="M339 196 L343 162 L361 186 Z M427 196 L423 162 L405 186 Z" fill="#e7e2d6" stroke="#8d8370" stroke-width="3" stroke-linejoin="round"/><text x="293" y="428" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-anchor="start">Egg body, head, ear tufts.</text><rect x="512" y="110" width="212" height="330" rx="16" fill="#fff" stroke="#bdd0cc" stroke-width="2"/><text x="528" y="142" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#193f49" text-anchor="start">3 · Details</text><ellipse cx="618" cy="315" rx="62" ry="78" fill="#e7e2d6" stroke="#8d8370" stroke-width="3"/><ellipse cx="618" cy="222" rx="56" ry="46" fill="#e7e2d6" stroke="#8d8370" stroke-width="3"/><path d="M574 196 L578 162 L596 186 Z M662 196 L658 162 L640 186 Z" fill="#e7e2d6" stroke="#8d8370" stroke-width="3" stroke-linejoin="round"/><path d="M560 290 q-12 50 8 92 M676 290 q12 50 -8 92" fill="none" stroke="#8d8370" stroke-width="3"/><circle cx="596" cy="222" r="19" fill="#f4f1ea" stroke="#8d8370" stroke-width="2.5"/><circle cx="596" cy="223" r="7" fill="#5a4e3c"/><circle cx="640" cy="222" r="19" fill="#f4f1ea" stroke="#8d8370" stroke-width="2.5"/><circle cx="640" cy="223" r="7" fill="#5a4e3c"/><path d="M612 240 L618 258 L624 240 Z" fill="#c9a36b" stroke="#8d8370" stroke-width="2"/><path d="M580 290 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M596 290 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M612 290 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M628 290 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M644 290 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M580 310 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M596 310 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M612 310 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M628 310 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M644 310 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M580 330 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M596 330 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M612 330 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M628 330 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M644 330 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M580 350 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M596 350 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M612 350 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M628 350 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><path d="M644 350 q6 8 12 0" fill="none" stroke="#a69b86" stroke-width="2"/><text x="528" y="428" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#294c54" text-a