<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="snd-title snd-desc">
  <title id="snd-title">Physics of Sound and Vibration: Longitudinal Pressure Waves</title>
  <desc id="snd-desc">Diagram showing how a vibrating acoustic source creates alternating zones of air molecule compression and rarefaction, mapped directly to a continuous sinusoidal pressure wave.</desc>
  <defs>
    <linearGradient id="sine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="comp-shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="prong-metal" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#080e1a"/>
  
  <!-- Subtle Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <path d="M0 60h960M0 120h960M0 180h960M0 240h960M0 300h960M0 360h960M0 420h960M0 480h960"/>
    <path d="M60 0v540M120 0v540M180 0v540M240 0v540M300 0v540M360 0v540M420 0v540M480 0v540M540 0v540M600 0v540M660 0v540M720 0v540M780 0v540M840 0v540M900 0v540"/>
  </g>

  <!-- Title & Description -->
  <text x="40" y="44" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">ANATOMY OF A SOUND WAVE: VIBRATION &amp; AIR PRESSURE</text>
  <text x="40" y="68" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Mechanical vibrations displace medium particles, propagating energy as alternating compressions and rarefactions.</text>

  <!-- Vibrating Acoustic Source (Tuning Fork) -->
  <g transform="translate(60, 110)">
    <!-- Base stem and handle -->
    <rect x="25" y="80" width="14" height="60" rx="4" fill="url(#prong-metal)"/>
    <path d="M12,20 v50 c0,15 15,20 20,20 h0 c5,0 20,-5 20,-20 v-50" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <!-- Left prong -->
    <rect x="6" y="-10" width="12" height="75" rx="3" fill="#cbd5e1"/>
    <!-- Right prong (vibrating) -->
    <rect x="46" y="-10" width="12" height="75" rx="3" fill="#cbd5e1"/>
    <!-- Vibration motion blur arcs -->
    <path d="M64,5 c4,-3 8,-3 12,0 M64,25 c5,-3 10,-3 15,0 M64,45 c4,-3 8,-3 12,0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M40,5 c-4,-3 -8,-3 -12,0 M40,25 c-5,-3 -10,-3 -15,0 M40,45 c-4,-3 -8,-3 -12,0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <text x="32" y="160" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Vibrating Source</text>
    <text x="32" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">(Tuning Fork, 440 Hz)</text>
  </g>

  <!-- Propagation Arrow -->
  <g transform="translate(180, 105)">
    <line x1="0" y1="0" x2="720" y2="0" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 6"/>
    <polygon points="726,0 714,-5 714,5" fill="#f59e0b"/>
    <text x="360" y="-10" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">DIRECTION OF WAVE ENERGY TRAVEL (Longitudinal Propagation · v ≈ 343 m/s in air)</text>
  </g>

  <!-- Compression Shading Zones (repeating with period 240px: centers at 270, 510, 750) -->
  <rect x="210" y="125" width="120" height="130" rx="8" fill="url(#comp-shade)"/>
  <rect x="450" y="125" width="120" height="130" rx="8" fill="url(#comp-shade)"/>
  <rect x="690" y="125" width="120" height="130" rx="8" fill="url(#comp-shade)"/>

  <!-- Molecular Particle Field (y from 135 to 245) -->
  <!-- Zone 1: Compression near 270 -->
  <g fill="#e0f2fe" opacity="0.95">
    <!-- Center 270: dense -->
    <circle cx="260" cy="145" r="2.5"/><circle cx="268" cy="155" r="3"/><circle cx="275" cy="140" r="2.5"/><circle cx="265" cy="170" r="3"/><circle cx="272" cy="180" r="2.5"/>
    <circle cx="262" cy="195" r="3"/><circle cx="278" cy="205" r="2.5"/><circle cx="266" cy="220" r="3"/><circle cx="274" cy="235" r="2.5"/>
    <circle cx="255" cy="160" r="2.5"/><circle cx="282" cy="165" r="3"/><circle cx="258" cy="185" r="2.5"/><circle cx="285" cy="190" r="2.5"/>
    <circle cx="270" cy="150" r="3"/><circle cx="269" cy="210" r="3"/><circle cx="271" cy="225" r="2.5"/><circle cx="270" cy="175" r="3"/>
    <circle cx="252" cy="148" r="2"/><circle cx="288" cy="152" r="2"/><circle cx="250" cy="215" r="2"/><circle cx="289" cy="218" r="2"/>

    <!-- Center 510: dense -->
    <circle cx="500" cy="145" r="2.5"/><circle cx="508" cy="155" r="3"/><circle cx="515" cy="140" r="2.5"/><circle cx="505" cy="170" r="3"/><circle cx="512" cy="180" r="2.5"/>
    <circle cx="502" cy="195" r="3"/><circle cx="518" cy="205" r="2.5"/><circle cx="506" cy="220" r="3"/><circle cx="514" cy="235" r="2.5"/>
    <circle cx="495" cy="160" r="2.5"/><circle cx="522" cy="165" r="3"/><circle cx="498" cy="185" r="2.5"/><circle cx="525" cy="190" r="2.5"/>
    <circle cx="510" cy="150" r="3"/><circle cx="509" cy="210" r="3"/><circle cx="511" cy="225" r="2.5"/><circle cx="510" cy="175" r="3"/>
    <circle cx="492" cy="148" r="2"/><circle cx="528" cy="152" r="2"/><circle cx="490" cy="215" r="2"/><circle cx="529" cy="218" r="2"/>

    <!-- Center 750: dense -->
    <circle cx="740" cy="145" r="2.5"/><circle cx="748" cy="155" r="3"/><circle cx="755" cy="140" r="2.5"/><circle cx="745" cy="170" r="3"/><circle cx="752" cy="180" r="2.5"/>
    <circle cx="742" cy="195" r="3"/><circle cx="758" cy="205" r="2.5"/><circle cx="746" cy="220" r="3"/><circle cx="754" cy="235" r="2.5"/>
    <circle cx="735" cy="160" r="2.5"/><circle cx="762" cy="165" r="3"/><circle cx="738" cy="185" r="2.5"/><circle cx="765" cy="190" r="2.5"/>
    <circle cx="750" cy="150" r="3"/><circle cx="749" cy="210" r="3"/><circle cx="751" cy="225" r="2.5"/><circle cx="750" cy="175" r="3"/>
  </g>

  <!-- Rarefactions (sparse zones centered at 390 and 630) -->
  <g fill="#64748b" opacity="0.6">
    <circle cx="370" cy="150" r="2"/><circle cx="405" cy="165" r="2"/><circle cx="385" cy="190" r="2"/><circle cx="410" cy="215" r="2"/>
    <circle cx="365" cy="225" r="2"/><circle cx="395" cy="140" r="2"/><circle cx="610" cy="150" r="2"/><circle cx="645" cy="165" r="2"/>
    <circle cx="625" cy="190" r="2"/><circle cx="650" cy="215" r="2"/><circle cx="605" cy="225" r="2"/><circle cx="635" cy="140" r="2"/>
  </g>

  <!-- Labels for particle field -->
  <text x="270" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">COMPRESSION (+P)</text>
  <text x="390" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">RAREFACTION (−P)</text>
  <text x="510" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">COMPRESSION (+P)</text>
  <text x="630" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">RAREFACTION (−P)</text>
  <text x="750" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">COMPRESSION (+P)</text>

  <!-- Pressure Waveform Axis (y = 355 is equilibrium baseline P₀) -->
  <g transform="translate(180, 355)">
    <!-- Baseline -->
    <line x1="0" y1="0" x2="720" y2="0" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="-12" y="4" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8" text-anchor="end">Equilibrium P₀</text>

    <!-- Vertical Pressure Axis -->
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#64748b" stroke-width="1.5"/>
    <text x="-12" y="-48" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="end">+P (Peak)</text>
    <text x="-12" y="52" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="end">−P (Trough)</text>

    <!-- Continuous Sine Wave: Period = 240px. Peaks at x = 90 (absolute 270), 330 (510), 570 (750) -->
    <!-- Troughs at x = 210 (390), 450 (630) -->
    <!-- d="M 0,0 C 25,-48 65,-48 90,-48 C 115,-48 155,0 180,0 C 205,0 245,48 270,48 C 295,48 335,0 360,0 ..." -->
    <path d="M 0,0 
             C 30,-50 60,-50 90,-50 
             C 120,-50 150,0 180,0 
             C 210,0 240,50 270,50 
             C 300,50 330,0 360,0 
             C 390,0 420,-50 450,-50 
             C 480,-50 510,0 540,0 
             C 570,0 600,50 630,50 
             C 660,50 690,0 720,0"
          fill="none" stroke="url(#sine-grad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Peak and trough alignment dashed drop lines -->
    <line x1="90" y1="-85" x2="90" y2="-50" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="270" y1="-85" x2="270" y2="50" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="330" y1="-85" x2="330" y2="-50" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Amplitude Bracket at First Peak -->
    <line x1="90" y1="0" x2="90" y2="-50" stroke="#a855f7" stroke-width="2"/>
    <circle cx="90" cy="-50" r="4" fill="#a855f7"/>
    <text x="100" y="-22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">Amplitude (A = Volume / Loudness)</text>

    <!-- Wavelength Dimension Line between Peak 1 (90) and Peak 2 (330) -->
    <line x1="90" y1="-65" x2="330" y2="-65" stroke="#fde047" stroke-width="2"/>
    <polygon points="90,-65 100,-69 100,-61" fill="#fde047"/>
    <polygon points="330,-65 320,-69 320,-61" fill="#fde047"/>
    <text x="210" y="-72" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#fde047" text-anchor="middle">WAVELENGTH (λ = Distance between peaks)</text>
  </g>

  <!-- Key Concept Summary Cards -->
  <rect x="40" y="440" width="880" height="76" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <g transform="translate(60, 456)" font-family="Inter, system-ui, sans-serif">
    <!-- Point 1 -->
    <text x="0" y="18" font-size="12" font-weight="700" fill="#38bdf8">LONGITUDINAL MOTION</text>
    <text x="0" y="36" font-size="11.5" font-weight="400" fill="#cbd5e1">Molecules oscillate back and forth parallel to the wave; they don't travel across the room.</text>

    <!-- Point 2 -->
    <text x="310" y="18" font-size="12" font-weight="700" fill="#fde047">FREQUENCY &amp; PITCH (v = f · λ)</text>
    <text x="310" y="36" font-size="11.5" font-weight="400" fill="#cbd5e1">Higher vibration frequency creates shorter wavelengths and higher perceived musical pitch.</text>

    <!-- Point 3 -->
    <text x="630" y="18" font-size="12" font-weight="700" fill="#f43f5e">MEDIUM REQUIRED</text>
    <text x="630" y="36" font-size="11.5" font-weight="400" fill="#cbd5e1">Sound requires matter (air, water, steel). In a vacuum, no molecules exist to transmit pressure.</text>
  </g>
</svg>

