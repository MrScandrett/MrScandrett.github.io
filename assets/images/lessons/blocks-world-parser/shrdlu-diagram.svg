<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f8f9fa"/>
  <rect x="100" y="400" width="600" height="20" fill="#ced4da" stroke="#343a40" stroke-width="4"/>
  <path d="M100 400 L150 350 L750 350 L700 400 Z" fill="#e9ecef" stroke="#343a40" stroke-width="4"/>
  
  <!-- Red Block A -->
  <rect x="250" y="270" width="80" height="80" fill="#fa5252" stroke="#343a40" stroke-width="4"/>
  <path d="M250 270 L280 240 L360 240 L330 270 Z" fill="#ff8787" stroke="#343a40" stroke-width="4"/>
  <path d="M330 270 L360 240 L360 320 L330 350 Z" fill="#c92a2a" stroke="#343a40" stroke-width="4"/>
  <text x="280" y="325" font-family="monospace" font-size="32" font-weight="bold" fill="#fff">A</text>

  <!-- Green Block B (on top of A) -->
  <rect x="250" y="190" width="80" height="80" fill="#40c057" stroke="#343a40" stroke-width="4"/>
  <path d="M250 190 L280 160 L360 160 L330 190 Z" fill="#69db7c" stroke="#343a40" stroke-width="4"/>
  <path d="M330 190 L360 160 L360 240 L330 270 Z" fill="#2b8a3e" stroke="#343a40" stroke-width="4"/>
  <text x="280" y="245" font-family="monospace" font-size="32" font-weight="bold" fill="#fff">B</text>

  <!-- Blue Pyramid C -->
  <path d="M450 350 L530 350 L490 270 Z" fill="#228be6" stroke="#343a40" stroke-width="4"/>
  <path d="M450 350 L490 270 L510 260 L470 340 Z" fill="#74c0fc" stroke="#343a40" stroke-width="4" opacity="0.8"/>
  <text x="480" y="335" font-family="monospace" font-size="28" font-weight="bold" fill="#fff">C</text>

  <!-- Yellow Block D -->
  <rect x="580" y="290" width="60" height="60" fill="#fab005" stroke="#343a40" stroke-width="4"/>
  <path d="M580 290 L600 270 L660 270 L640 290 Z" fill="#ffe066" stroke="#343a40" stroke-width="4"/>
  <path d="M640 290 L660 270 L660 330 L640 350 Z" fill="#e67700" stroke="#343a40" stroke-width="4"/>
  <text x="600" y="335" font-family="monospace" font-size="28" font-weight="bold" fill="#343a40">D</text>

  <!-- Title & Retro UI Box -->
  <rect x="30" y="30" width="280" height="90" fill="#fff" stroke="#343a40" stroke-width="4"/>
  <text x="45" y="65" font-family="monospace" font-size="20" font-weight="bold" fill="#343a40">> PICK UP THE</text>
  <text x="45" y="95" font-family="monospace" font-size="20" font-weight="bold" fill="#343a40">> GREEN BLOCK.</text>
  
  <rect x="490" y="30" width="280" height="60" fill="#212529" stroke="#343a40" stroke-width="4"/>
  <text x="505" y="65" font-family="monospace" font-size="20" font-weight="bold" fill="#38d9a9">OK.</text>

</svg>
