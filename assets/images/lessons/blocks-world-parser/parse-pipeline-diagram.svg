<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="bw-pipe-title bw-pipe-desc">
  <title id="bw-pipe-title">Four Stages of a Blocks World Parser and Executor</title>
  <desc id="bw-pipe-desc">Flow diagram separating text normalization, grammar matching into a structured record, world-state precondition checks, and separating syntax failures from world-rule failures.</desc>
  <defs>
    <marker id="bw-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">From English Sentence to Physical Action: The 4-Stage Pipeline</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Understanding a sentence's structure (Syntax) is completely separate from whether the blocks allow it (World State)</text>

  <!-- Stage 1 -->
  <rect x="28" y="78" width="182" height="162" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="42" y="92" width="84" height="20" rx="10" fill="#475569"/>
  <text x="84" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">1 · TOKENIZE</text>
  <text x="42" y="132" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">Split &amp; Normalize</text>
  <rect x="42" y="144" width="154" height="32" rx="6" fill="#f1f5f9"/>
  <text x="119" y="164" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#0f172a">"  Move A onto B "</text>
  <text x="42" y="196" font-family="JetBrains Mono, monospace" font-size="11" fill="#0f766e">["move","a","onto","b"]</text>
  <text x="42" y="216" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">Lowercase + collapse</text>
  <text x="42" y="230" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">spaces; keep order.</text>

  <path d="M 210 158 L 234 158" stroke="#475569" stroke-width="2" marker-end="url(#bw-arr)"/>

  <!-- Stage 2 -->
  <rect x="238" y="78" width="194" height="162" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="252" y="92" width="96" height="20" rx="10" fill="#4f46e5"/>
  <text x="300" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">2 · PARSE RULE</text>
  <text x="252" y="132" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#1e1b4b">Match Word Slots</text>
  <text x="252" y="156" font-family="JetBrains Mono, monospace" font-size="11" fill="#312e81">action:      "move"</text>
  <text x="252" y="174" font-family="JetBrains Mono, monospace" font-size="11" fill="#047857">source:      "a"</text>
  <text x="252" y="192" font-family="JetBrains Mono, monospace" font-size="11" fill="#6d28d9">relation:    "onto"</text>
  <text x="252" y="210" font-family="JetBrains Mono, monospace" font-size="11" fill="#0369a1">destination: "b"</text>
  <text x="252" y="230" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#4338ca">No blocks move during parse</text>

  <path d="M 432 158 L 456 158" stroke="#475569" stroke-width="2" marker-end="url(#bw-arr)"/>

  <!-- Stage 3 -->
  <rect x="460" y="78" width="186" height="162" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="474" y="92" width="106" height="20" rx="10" fill="#0f766e"/>
  <text x="527" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">3 · DATA RECORD</text>
  <text x="474" y="132" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#064e3b">Build Instruction</text>
  <rect x="474" y="146" width="158" height="72" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="484" y="164" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#065f46">{</text>
  <text x="494" y="179" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#065f46">action: "move_onto",</text>
  <text x="494" y="194" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#065f46">source: "A",</text>
  <text x="494" y="209" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#065f46">destination: "B" }</text>

  <path d="M 646 158 L 670 158" stroke="#475569" stroke-width="2" marker-end="url(#bw-arr)"/>

  <!-- Stage 4 -->
  <rect x="674" y="78" width="178" height="162" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="688" y="92" width="96" height="20" rx="10" fill="#d97706"/>
  <text x="736" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">4 · EXECUTE</text>
  <text x="688" y="132" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#78350f">Check World Rules</text>
  <text x="688" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">1. Does A exist?</text>
  <text x="688" y="172" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">2. Does B exist?</text>
  <text x="688" y="190" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">3. Are A &amp; B clear?</text>
  <text x="688" y="208" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">4. Is hand empty?</text>
  <text x="688" y="230" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#b45309">Only then move stack!</text>

  <!-- Three failure types comparison -->
  <rect x="28" y="258" width="264" height="96" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="44" y="280" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#991b1b">Syntax Failure (Stage 2)</text>
  <text x="44" y="299" font-family="JetBrains Mono, monospace" font-size="11" fill="#b91c1c">"move onto A B"</text>
  <text x="44" y="318" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">Words exist, order breaks rule.</text>
  <text x="44" y="335" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">Stopped before Stage 3.</text>

  <rect x="308" y="258" width="264" height="96" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="324" y="280" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#9a3412">Reference Failure (Stage 4a)</text>
  <text x="324" y="299" font-family="JetBrains Mono, monospace" font-size="11" fill="#c2410c">"move Z to table"</text>
  <text x="324" y="318" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#7c2d12">Grammar succeeds cleanly!</text>
  <text x="324" y="335" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#7c2d12">Fails because Block Z isn't in world.</text>

  <rect x="588" y="258" width="264" height="96" rx="12" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="604" y="280" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#075985">Precondition Failure (Stage 4b)</text>
  <text x="604" y="299" font-family="JetBrains Mono, monospace" font-size="11" fill="#0369a1">"move B to table"</text>
  <text x="604" y="318" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#0c4a6e">Grammar &amp; objects exist, but A sits</text>
  <text x="604" y="335" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#0c4a6e">on B — clear A first!</text>
</svg>
