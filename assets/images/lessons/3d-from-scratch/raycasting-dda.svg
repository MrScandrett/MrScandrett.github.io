<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Diagram comparing top-down 2D grid raycasting with first-person 3D column rendering, illustrating ray casting, grid DDA stepping, and the cosine fisheye correction.">
  <!-- Background -->
  <rect width="1000" height="560" fill="#0f172a"/>
  <rect width="1000" height="8" fill="#3b82f6"/>

  <!-- Title & Lede -->
  <text x="40" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#f8fafc">2D Raycasting: A Flat Map Turned into 3D Depth</text>
  <text x="40" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">One ray per vertical screen column. Distance to the wall sets the slice height on screen.</text>

  <!-- Divider Line -->
  <line x1="500" y1="100" x2="500" y2="520" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- LEFT: 2D Overhead Map -->
  <text x="250" y="125" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#38bdf8" text-anchor="middle">Top-Down 2D Map (Memory)</text>

  <!-- Grid Cells -->
  <g stroke="#1e293b" stroke-width="1.5">
    <rect x="70" y="150" width="360" height="340" fill="#020617"/>
    <!-- Grid lines -->
    <path d="M130 150 v340 M190 150 v340 M250 150 v340 M310 150 v340 M370 150 v340"/>
    <path d="M70 206 h360 M70 263 h360 M70 320 h360 M70 376 h360 M70 433 h360"/>
  </g>

  <!-- Solid Walls on Map -->
  <g fill="#475569" stroke="#94a3b8" stroke-width="1.5">
    <rect x="70" y="150" width="60" height="56"/>
    <rect x="130" y="150" width="60" height="56"/>
    <rect x="190" y="150" width="60" height="56"/>
    <rect x="250" y="150" width="60" height="56"/>
    <rect x="310" y="150" width="60" height="56"/>
    <rect x="370" y="150" width="60" height="56"/>

    <rect x="70" y="206" width="60" height="56"/>
    <rect x="370" y="206" width="60" height="56"/>

    <rect x="250" y="263" width="60" height="56" fill="#3b82f6" stroke="#60a5fa"/>
    <rect x="370" y="263" width="60" height="56"/>

    <rect x="70" y="433" width="360" height="57"/>
  </g>

  <!-- Player -->
  <circle cx="160" cy="380" r="12" fill="#ef4444"/>
  <line x1="160" y1="380" x2="250" y2="280" stroke="#f87171" stroke-width="2.5"/>

  <!-- Ray Fan -->
  <line x1="160" y1="380" x2="190" y2="206" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5"/>
  <line x1="160" y1="380" x2="220" y2="206" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5"/>
  <line x1="160" y1="380" x2="250" y2="263" stroke="#fbbf24" stroke-width="3"/>
  <line x1="160" y1="380" x2="280" y2="263" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5"/>
  <line x1="160" y1="380" x2="310" y2="263" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5"/>
  <line x1="160" y1="380" x2="370" y2="280" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5"/>

  <!-- Hit Point Dot -->
  <circle cx="250" cy="263" r="5" fill="#fbbf24"/>
  <text x="145" y="415" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ef4444">Player</text>
  <text x="250" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">Hit (x, y)</text>

  <!-- RIGHT: 3D First-Person View -->
  <text x="740" y="125" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#38bdf8" text-anchor="middle">First-Person 3D Display</text>

  <g>
    <!-- Viewport Frame -->
    <rect x="540" y="150" width="400" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Sky & Floor -->
    <rect x="541" y="151" width="398" height="129" fill="#0f172a"/>
    <rect x="541" y="280" width="398" height="129" fill="#334155"/>
    <line x1="541" y1="280" x2="939" y2="280" stroke="#475569" stroke-width="1"/>

    <!-- 3D Wall Columns Drawn -->
    <!-- Far background walls -->
    <rect x="560" y="240" width="80" height="80" fill="#1e3a8a"/>
    <rect x="840" y="235" width="80" height="90" fill="#1e3a8a"/>

    <!-- Closer blue obstacle wall -->
    <rect x="640" y="195" width="160" height="170" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>

    <!-- Highlighted Active Ray Slice -->
    <rect x="715" y="195" width="8" height="170" fill="#fbbf24"/>
    <line x1="719" y1="180" x2="719" y2="195" stroke="#fbbf24" stroke-width="2"/>
    <text x="719" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle">Ray Slice</text>
  </g>

  <!-- Fisheye Explanation Box -->
  <rect x="540" y="430" width="400" height="85" rx="8" fill="#020617" stroke="#334155" stroke-width="1.5"/>
  <text x="555" y="455" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">The Fisheye Fix:</text>
  <text x="555" y="478" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#f8fafc">dist_corrected = dist_raw × cos(rayAngle - playerAngle)</text>
  <text x="555" y="500" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Without cosine correction, flat walls curve like a curved bowl.</text>
</svg>
