<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Diagram of software raytracing optics: camera rays pass through screen pixels to hit 3D spheres, casting shadow rays toward lights and specular reflection rays into the scene.">
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="lightGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="rgba(250, 204, 21, 0)"/>
    </radialGradient>
    <marker id="rayArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3b82f6"/>
    </marker>
    <marker id="shadowArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
    <marker id="reflArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#0b0f19"/>
  <rect width="1000" height="8" fill="#6366f1"/>

  <!-- Title & Lede -->
  <text x="40" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#f8fafc">Raytracing: Simulating the True Physics of Light in Reverse</text>
  <text x="40" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Instead of projecting shapes forward to the screen, raytracers cast rays backward from eyes into the scene.</text>

  <!-- Camera / Eye -->
  <circle cx="100" cy="330" r="10" fill="#6366f1"/>
  <circle cx="100" cy="330" r="18" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="100" y="375" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#818cf8" text-anchor="middle">Eye / Camera</text>

  <!-- Virtual Screen with Pixels -->
  <rect x="220" y="210" width="16" height="220" rx="4" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="2"/>
  <rect x="222" y="316" width="12" height="12" fill="#38bdf8"/>
  <text x="228" y="195" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#818cf8" text-anchor="middle">Pixel Grid</text>
  <text x="228" y="450" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Screen (x, y)</text>

  <!-- Primary Camera Ray -->
  <line x1="100" y1="330" x2="520" y2="300" stroke="#38bdf8" stroke-width="3" marker-end="url(#rayArr)"/>
  <text x="340" y="300" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">1 · Primary Ray (P = O + tD)</text>

  <!-- 3D Sphere -->
  <ellipse cx="580" cy="455" rx="100" ry="25" fill="rgba(0, 0, 0, 0.4)"/>
  <circle cx="580" cy="340" r="95" fill="url(#sphereGrad)" stroke="#1e40af" stroke-width="2"/>
  <text x="580" y="390" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#eff6ff" text-anchor="middle">3D Sphere</text>

  <!-- Hit Point on Sphere -->
  <circle cx="520" cy="300" r="6" fill="#f43f5e"/>
  <text x="490" y="275" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f43f5e">Hit Point (P)</text>

  <!-- Normal Vector N -->
  <line x1="520" y1="300" x2="480" y2="240" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="465" y="235" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">Normal N</text>

  <!-- Light Source -->
  <circle cx="780" cy="140" r="40" fill="url(#lightGrad)"/>
  <circle cx="780" cy="140" r="10" fill="#fef08a"/>
  <text x="780" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#facc15" text-anchor="middle">Point Light Source</text>

  <!-- Shadow Ray toward Light -->
  <line x1="520" y1="300" x2="770" y2="150" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#shadowArr)"/>
  <text x="690" y="240" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f59e0b">2 · Shadow Ray</text>
  <text x="690" y="260" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">(Unblocked = Lit)</text>

  <!-- Reflection Bounce Ray -->
  <line x1="520" y1="300" x2="680" y2="190" stroke="#10b981" stroke-width="2.5" marker-end="url(#reflArr)"/>
  <text x="560" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#34d399">3 · Reflection Ray R</text>

  <!-- Mirror / Secondary Object in Background -->
  <rect x="740" y="280" width="180" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="830" y="360" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">Reflected Wall</text>

  <!-- Bottom Explanatory Card -->
  <rect x="50" y="475" width="900" height="65" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <text x="75" y="500" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#818cf8">Raytracing vs Rasterization:</text>
  <text x="75" y="522" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Rasterization is fast (projects triangles forward to GPU); Raytracing is physically accurate (naturally produces true shadows, mirrors, and glass refraction).</text>
</svg>
