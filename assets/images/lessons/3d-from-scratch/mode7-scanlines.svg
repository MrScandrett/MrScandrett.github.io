<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Diagram showing Mode 7 affine floor rendering: horizontal scanlines drawn from the horizon to the bottom of the screen calculate ground distance Z and sample (U,V) texture coordinates.">
  <!-- Background -->
  <rect width="1000" height="560" fill="#f8fafc"/>
  <rect width="1000" height="8" fill="#8b5cf6"/>

  <!-- Title & Lede -->
  <text x="40" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#0f172a">Mode 7: Perspective Ground from Horizontal Scanlines</text>
  <text x="40" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#475569">Instead of vertical wall stripes, retro 16-bit chips drew horizontal floor lines with distance-scaled textures.</text>

  <!-- Left Side: Screen Space (Horizontal Scanlines) -->
  <text x="250" y="125" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#7c3aed" text-anchor="middle">Screen View (Scanlines)</text>
  <rect x="70" y="150" width="360" height="260" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>

  <!-- Sky area -->
  <rect x="72" y="152" width="356" height="100" fill="#312e81"/>
  <!-- Horizon Line -->
  <line x1="72" y1="252" x2="428" y2="252" stroke="#a78bfa" stroke-width="2"/>
  <text x="250" y="244" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c4b5fd" text-anchor="middle">Horizon (Vanishing Line)</text>

  <!-- Ground Scanlines -->
  <g stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.5">
    <line x1="72" y1="265" x2="428" y2="265"/>
    <line x1="72" y1="282" x2="428" y2="282"/>
    <line x1="72" y1="305" x2="428" y2="305"/>
    <line x1="72" y1="335" x2="428" y2="335"/>
    <line x1="72" y1="375" x2="428" y2="375"/>
  </g>

  <!-- Highlighted Scanline -->
  <rect x="72" y="333" width="356" height="6" fill="#f59e0b"/>
  <circle cx="250" cy="336" r="4" fill="#f59e0b"/>
  <text x="440" y="341" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#d97706">Scanline y</text>

  <!-- Ground Perspective Convergence Lines -->
  <path d="M250 252 L120 410" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M250 252 L380 410" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M250 252 L250 410" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Right Side: 2D Texture Map (Sampling Space) -->
  <text x="740" y="125" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#7c3aed" text-anchor="middle">World Texture Space (U, V)</text>
  <rect x="560" y="150" width="360" height="260" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Checkerboard Floor Texture Map -->
  <g opacity="0.8">
    <rect x="600" y="170" width="280" height="220" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M670 170 v220 M740 170 v220 M810 170 v220" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M600 225 h280 M600 280 h280 M600 335 h280" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="600" y="170" width="70" height="55" fill="#c7d2fe"/>
    <rect x="740" y="170" width="70" height="55" fill="#c7d2fe"/>
    <rect x="670" y="225" width="70" height="55" fill="#c7d2fe"/>
    <rect x="810" y="225" width="70" height="55" fill="#c7d2fe"/>
    <rect x="600" y="280" width="70" height="55" fill="#c7d2fe"/>
    <rect x="740" y="280" width="70" height="55" fill="#c7d2fe"/>
    <rect x="670" y="335" width="70" height="55" fill="#c7d2fe"/>
    <rect x="810" y="335" width="70" height="55" fill="#c7d2fe"/>
  </g>

  <!-- Sampled Line in Texture Space -->
  <line x1="620" y1="290" x2="860" y2="290" stroke="#d97706" stroke-width="4"/>
  <circle cx="620" cy="290" r="5" fill="#d97706"/>
  <circle cx="860" cy="290" r="5" fill="#d97706"/>
  <text x="740" y="280" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">Sampled Texture Segment (U1, V) → (U2, V)</text>

  <!-- Bottom Explanatory Box -->
  <rect x="70" y="440" width="850" height="85" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="95" y="468" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a">The Distance Formula Per Scanline:</text>
  <text x="95" y="492" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#7c3aed">GroundDistance Z = (CameraHeight × ProjectionDist) / (ScanlineY - HorizonY)</text>
  <text x="95" y="513" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#475569">Near the horizon (small denominator), distance shoots to infinity; at the bottom of the screen, distance is close.</text>
</svg>
