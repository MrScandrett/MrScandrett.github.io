<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Diagram of 3D perspective projection using similar triangles: a camera at the origin looks toward a 3D point P(X,Y,Z). The light ray pierces the 2D projection screen at distance d (FOV), yielding screen coordinate x' = X * (d / Z).">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0066cc"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#dc2626"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#f8fafc"/>
  <rect width="1000" height="8" fill="#0284c7"/>

  <!-- Title & Lede -->
  <text x="40" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0f172a">How 3D Becomes 2D: Perspective Division</text>
  <text x="40" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#475569">Similar triangles prove why distant objects shrink: screen position is world coordinate divided by depth Z.</text>

  <!-- Ground Grid Reference -->
  <path d="M80 430 L920 430" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M80 430 L220 330 L920 330" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Optical Axis (Z-axis) -->
  <line x1="100" y1="280" x2="880" y2="280" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-dark)"/>
  <text x="895" y="285" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#334155">+Z (Depth)</text>

  <!-- Camera / Eye -->
  <circle cx="120" cy="280" r="9" fill="#0284c7"/>
  <circle cx="120" cy="280" r="16" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="120" y="320" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0284c7" text-anchor="middle">Camera (0, 0, 0)</text>

  <!-- Projection Screen (Distance d / FOV) -->
  <rect x="300" y="140" width="16" height="280" rx="4" fill="rgba(56, 189, 248, 0.25)" stroke="#0284c7" stroke-width="2"/>
  <line x1="308" y1="130" x2="308" y2="430" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="308" y="120" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0284c7" text-anchor="middle">Screen Plane</text>
  <text x="308" y="452" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0369a1" text-anchor="middle">Distance d (FOV)</text>

  <!-- Distance d measurement line -->
  <line x1="120" y1="410" x2="300" y2="410" stroke="#0284c7" stroke-width="2" marker-end="url(#arr)"/>
  <text x="210" y="402" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0284c7" text-anchor="middle">d = FOV</text>

  <!-- 3D Point P(X, Y, Z) -->
  <circle cx="760" cy="160" r="10" fill="#dc2626"/>
  <line x1="760" y1="160" x2="760" y2="280" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="775" y="155" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#dc2626">Point P (X, Y, Z)</text>
  <text x="775" y="225" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Height = Y</text>

  <!-- Z Distance measurement line -->
  <line x1="120" y1="475" x2="760" y2="475" stroke="#334155" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="440" y="468" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Total Depth = Z</text>

  <!-- Sight Line (Projection Ray) -->
  <line x1="120" y1="280" x2="760" y2="160" stroke="#dc2626" stroke-width="3"/>

  <!-- Screen Intersection Point (x', y') -->
  <circle cx="308" cy="245" r="7" fill="#2563eb"/>
  <line x1="308" y1="245" x2="308" y2="280" stroke="#2563eb" stroke-width="2"/>
  <circle cx="308" cy="280" r="4" fill="#0284c7"/>
  <text x="290" y="240" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#2563eb" text-anchor="end">Screen (x', y')</text>
  <text x="325" y="265" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">y' = Screen Y</text>

  <!-- Similar Triangles Shading -->
  <polygon points="120,280 308,280 308,245" fill="rgba(37, 99, 235, 0.15)"/>
  <polygon points="120,280 760,280 760,160" fill="rgba(220, 38, 38, 0.08)"/>

  <!-- Formula Callout Box -->
  <rect x="490" y="325" width="470" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="510" y="355" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a">The Similar Triangles Ratio:</text>
  <text x="510" y="380" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#0284c7">y' / d = Y / Z   ⇒   y' = Y × (d / Z)</text>
  <text x="510" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569">As depth Z doubles, screen distance from center halves.</text>
</svg>
