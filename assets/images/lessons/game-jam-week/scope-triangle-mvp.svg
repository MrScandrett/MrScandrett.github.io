<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="gj-mvp-title gj-mvp-desc">
  <title id="gj-mvp-title">Game Jam Scope Bullseye: MVP Core vs. Nice-to-Have vs. Cut List</title>
  <desc id="gj-mvp-desc">Concentric target diagram contrasting the Must-Ship playable core loop (inner ring), safe polish (middle ring), and high-risk trap features saved for version 2 (outer danger ring).</desc>
  <rect width="880" height="370" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Discipline Your Scope: Ship the Core Ring First</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">A finished 1-mechanic game always beats an unplayable 10-feature dream stuck on Friday morning</text>

  <!-- Concentric rings on left -->
  <circle cx="215" cy="212" r="134" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="215" cy="212" r="92" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="215" cy="212" r="50" fill="#0f766e" stroke="#065f46" stroke-width="2.5"/>
  <text x="215" y="208" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#fff">MVP CORE</text>
  <text x="215" y="224" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#d1fae5">Day 2 Target</text>
  <text x="215" y="142" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#92400e">DAY 3–4 POLISH</text>
  <text x="215" y="98" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#991b1b">CUT FOR V2!</text>

  <!-- Right explanations -->
  <rect x="388" y="78" width="464" height="82" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="406" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#064e3b">Inner Ring · Playable MVP (Non-Negotiable)</text>
  <text x="406" y="124" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#065f46">One core verb (jump / dodge / aim) + one enemy + win/lose loop + Restart button.</text>
  <text x="406" y="143" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#047857">Rule: If it works with rectangles, the game design works.</text>

  <rect x="388" y="172" width="464" height="82" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="406" y="196" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#78350f">Middle Ring · High-ROI Polish (Only After MVP Works)</text>
  <text x="406" y="218" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#92400e">Score HUD, hit sound effect, flash feedback, difficulty curve, clean start screen.</text>
  <text x="406" y="237" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#b45309">Add 1 feature at a time and test right away.</text>

  <rect x="388" y="266" width="464" height="82" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="406" y="290" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#7f1d1d">Outer Ring · Jam Killers (Write on Cut List Immediately)</text>
  <text x="406" y="312" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#991b1b">Online multiplayer, branching RPG inventory, procedural levels, 3D graphics from zero.</text>
  <text x="406" y="331" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#dc2626">Save these exciting ideas for a post-jam update.</text>
</svg>
