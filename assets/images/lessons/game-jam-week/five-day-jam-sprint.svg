<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="gj-spr-title gj-spr-desc">
  <title id="gj-spr-title">Five-Day Game Jam Sprint Roadmap</title>
  <desc id="gj-spr-desc">Timeline diagram covering Monday pitch and GDD, Tuesday playable core loop with placeholder rectangles, Wednesday features and sprites, Thursday polish and bug freeze, and Friday live showcase.</desc>
  <rect width="880" height="370" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">The 5-Day Game Jam Sprint: Playable First, Polish Last</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Teams fail when they polish menus on Tuesday — ship an ugly playable loop first</text>

  <!-- Connecting bar -->
  <line x1="90" y1="116" x2="790" y2="116" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Day 1 -->
  <circle cx="106" cy="116" r="22" fill="#4f46e5"/><text x="106" y="121" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#fff">MON</text>
  <rect x="34" y="152" width="146" height="190" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="1.6"/>
  <text x="48" y="176" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#312e81">1 · Design</text>
  <text x="48" y="194" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#4338ca">No Code Yet</text>
  <text x="48" y="218" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#3730a3">• Half-page GDD</text>
  <text x="48" y="236" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#3730a3">• 3 screen sketches</text>
  <text x="48" y="254" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#3730a3">• 5-item asset list</text>
  <text x="48" y="272" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#3730a3">• Cut list written</text>

  <!-- Day 2 -->
  <circle cx="272" cy="116" r="22" fill="#0f766e"/><text x="272" y="121" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#fff">TUE</text>
  <rect x="198" y="152" width="148" height="190" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="212" y="176" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#064e3b">2 · Core Loop</text>
  <text x="212" y="194" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#047857">Ugly &amp; Playable</text>
  <text x="212" y="218" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">• Player movement</text>
  <text x="212" y="236" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">• Box placeholders</text>
  <text x="212" y="254" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">• One obstacle/enemy</text>
  <text x="212" y="272" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">• Working Lose state</text>

  <!-- Day 3 -->
  <circle cx="438" cy="116" r="22" fill="#0284c7"/><text x="438" y="121" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#fff">WED</text>
  <rect x="364" y="152" width="148" height="190" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="378" y="176" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#0c4a6e">3 · Features</text>
  <text x="378" y="194" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#0369a1">Real Sprites + SFX</text>
  <text x="378" y="218" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#075985">• Score / HP / Timer</text>
  <text x="378" y="236" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#075985">• Hit/win sound FX</text>
  <text x="378" y="254" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#075985">• Pacing ramp</text>
  <text x="378" y="272" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#075985">• Swap in real art</text>

  <!-- Day 4 -->
  <circle cx="604" cy="116" r="22" fill="#d97706"/><text x="604" y="121" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#fff">THU</text>
  <rect x="530" y="152" width="148" height="190" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="544" y="176" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#78350f">4 · Polish</text>
  <text x="544" y="194" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#b45309">FEATURE FREEZE!</text>
  <text x="544" y="218" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">• Start + Restart UI</text>
  <text x="544" y="236" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">• Flash / screen shake</text>
  <text x="544" y="254" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">• Fix top 3 playtest</text>
  <text x="552" y="270" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">bugs (zero new scope)</text>

  <!-- Day 5 -->
  <circle cx="772" cy="116" r="22" fill="#dc2626"/><text x="772" y="121" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#fff">FRI</text>
  <rect x="696" y="152" width="156" height="190" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="1.6"/>
  <text x="710" y="176" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#7f1d1d">5 · Showcase</text>
  <text x="710" y="194" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#b91c1c">Ship &amp; Demo</text>
  <text x="710" y="218" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#991b1b">• 2nd-PC test run</text>
  <text x="710" y="236" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#991b1b">• 60s pitch + live play</text>
  <text x="710" y="254" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#991b1b">• Backup build ZIP</text>
  <text x="710" y="272" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#991b1b">• Playtest peer builds</text>
</svg>
