<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071b2b" />
      <stop offset="100%" stop-color="#04121e" />
    </linearGradient>
    <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c5364" />
      <stop offset="100%" stop-color="#203a43" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="420" rx="14" fill="url(#bgGrad)" />
  <rect width="638" height="418" x="1" y="1" rx="13" fill="none" stroke="rgba(120, 180, 240, 0.16)" stroke-width="1.5" />

  <!-- Title & Kicker -->
  <text x="32" y="34" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#7fc7ff" letter-spacing="0.1em">EVIDENCE: CONTINENTAL SHELF FIT &amp; GEOLOGIC BELTS</text>
  <text x="32" y="58" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Matching Mountain Belts &amp; Ancient Cratons</text>

  <!-- Diagram Container -->
  <g transform="translate(30, 70)">
    <!-- Continental Shelf Outlines (Bullard 1965 fit at 1,000 m depth) -->
    <!-- South America Continental Shelf -->
    <path d="M 80 50 C 130 40, 175 75, 180 115 C 185 155, 170 195, 150 230 C 135 255, 115 280, 105 290 C 100 280, 95 240, 85 210 C 75 170, 70 130, 80 95 Z" fill="#1b4965" opacity="0.4" stroke="#48dbfb" stroke-width="2" stroke-dasharray="4,4" />

    <!-- South America Land -->
    <path d="M 90 60 C 130 55, 165 85, 170 120 C 175 160, 160 200, 140 235 C 125 260, 108 280, 100 288 C 95 280, 90 245, 80 215 C 70 175, 75 135, 85 100 Z" fill="url(#landGrad)" stroke="#54a0ff" stroke-width="1.5" />
    <text x="110" y="150" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#ffffff">South</text>
    <text x="110" y="165" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#ffffff">America</text>

    <!-- Africa Continental Shelf -->
    <path d="M 183 80 C 215 55, 275 50, 305 80 C 325 105, 310 150, 295 180 C 285 215, 270 250, 245 280 C 220 290, 205 250, 195 210 C 188 160, 180 120, 183 80 Z" fill="#1b4965" opacity="0.4" stroke="#48dbfb" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Africa Land -->
    <path d="M 190 90 C 215 68, 268 62, 295 90 C 315 115, 300 155, 285 185 C 275 220, 260 255, 235 280 C 215 288, 202 250, 193 210 C 187 165, 184 125, 190 90 Z" fill="url(#landGrad)" stroke="#54a0ff" stroke-width="1.5" />
    <text x="245" y="155" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Africa</text>

    <!-- Geological Matching Belts -->
    <!-- 1. Ancient Pre-Cambrian Craton (Orange / Gold core) -->
    <path d="M 140 100 C 160 105, 190 105, 215 95 C 220 125, 200 145, 175 140 C 150 135, 135 120, 140 100 Z" fill="#f39c12" opacity="0.75" stroke="#e67e22" stroke-width="1.5" />
    <text x="178" y="122" font-family="Inter, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">Sao Luis / West Africa Craton</text>

    <!-- 2. Mountain Belt Orogeny (Crimson / Red Belt) -->
    <path d="M 115 220 C 135 215, 170 210, 210 205 C 220 220, 205 235, 175 238 C 145 240, 125 235, 115 220 Z" fill="#e74c3c" opacity="0.8" stroke="#c0392b" stroke-width="1.5" />
    <text x="165" y="230" font-family="Inter, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">Cape / Sierra Orogenic Belt</text>

    <!-- 3. Glacial striations / Karoo Ice Sheet Arrows -->
    <g stroke="#ffffff" stroke-width="1.8" fill="none">
      <path d="M 160 265 L 140 250" />
      <polyline points="144,248 138,249 141,255" />
      <path d="M 185 260 L 205 245" />
      <polyline points="201,244 207,244 204,250" />
      <path d="M 172 275 L 172 255" />
      <polyline points="168,258 172,253 176,258" />
    </g>
    <text x="175" y="285" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" fill="#74b9ff" text-anchor="middle">Glacial striations radiate from single polar center</text>
  </g>

  <!-- Legend Box on Right -->
  <g transform="translate(390, 80)">
    <rect width="215" height="235" rx="10" fill="rgba(8, 28, 46, 0.88)" stroke="rgba(140, 190, 240, 0.22)" stroke-width="1" />
    <text x="14" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#8bc8ff" letter-spacing="0.08em">GEOLOGIC EVIDENCE</text>

    <!-- Item 1: Continental Shelf -->
    <line x1="14" y1="46" x2="36" y2="46" stroke="#48dbfb" stroke-width="2" stroke-dasharray="3,3" />
    <text x="44" y="46" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">1,000 m Shelf Edge (Bullard Fit)</text>
    <text x="44" y="58" font-family="Inter, sans-serif" font-size="8.5" fill="#9bb3c7">True continental boundary fits seamlessly</text>

    <!-- Item 2: Cratons -->
    <rect x="14" y="78" width="16" height="12" rx="2" fill="#f39c12" />
    <text x="44" y="86" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">Ancient Rock Belts (&gt;2 Ga)</text>
    <text x="44" y="98" font-family="Inter, sans-serif" font-size="8.5" fill="#9bb3c7">Identical rock ages match across seam</text>

    <!-- Item 3: Mountain Belts -->
    <rect x="14" y="118" width="16" height="12" rx="2" fill="#e74c3c" />
    <text x="44" y="126" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">Folded Mountain Chains</text>
    <text x="44" y="138" font-family="Inter, sans-serif" font-size="8.5" fill="#9bb3c7">Appalachian &amp; Caledonian belts align</text>

    <!-- Item 4: Glacial Striations -->
    <line x1="14" y1="160" x2="36" y2="152" stroke="#74b9ff" stroke-width="2" />
    <polyline points="33,150 37,152 35,156" stroke="#74b9ff" stroke-width="2" fill="none" />
    <text x="44" y="160" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">Glacial Scratch Marks</text>
    <text x="44" y="172" font-family="Inter, sans-serif" font-size="8.5" fill="#9bb3c7">Flow outward from ancient ice sheet</text>

    <!-- Summary note -->
    <path d="M 12 190 L 203 190" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="14" y="206" font-family="Inter, sans-serif" font-size="8.5" fill="#a4c2db">Bullard (1965): Fit at shelf edge</text>
    <text x="14" y="218" font-family="Inter, sans-serif" font-size="8.5" fill="#a4c2db">leaves less than 1° average mismatch.</text>
  </g>

  <!-- Explanatory footer note -->
  <text x="32" y="398" font-family="Inter, sans-serif" font-size="10" fill="rgba(195, 220, 240, 0.65)">Coastline shapes match at continental shelf edges, while ancient mountain belts and glacial striations align continuously.</text>
</svg>
