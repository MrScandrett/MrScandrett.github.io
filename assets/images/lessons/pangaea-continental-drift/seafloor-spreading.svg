<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a263d" />
      <stop offset="60%" stop-color="#051422" />
      <stop offset="100%" stop-color="#020a12" />
    </linearGradient>
    <linearGradient id="magmaGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="60%" stop-color="#ffa502" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="mantleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1805" />
      <stop offset="100%" stop-color="#230e03" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="420" rx="14" fill="url(#oceanBg)" />
  <rect width="638" height="418" x="1" y="1" rx="13" fill="none" stroke="rgba(120, 180, 240, 0.16)" stroke-width="1.5" />

  <!-- Title & Kicker -->
  <text x="32" y="34" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#7fc7ff" letter-spacing="0.1em">EVIDENCE: SEAFLOOR SPREADING &amp; PALEOMAGNETISM</text>
  <text x="32" y="58" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Symmetrical Magnetic Stripes at Mid-Ocean Ridges</text>

  <!-- Ocean Water Indicator -->
  <text x="50" y="95" font-family="Inter, sans-serif" font-size="11" font-style="italic" fill="rgba(140, 190, 230, 0.5)">Ocean Water (3,000–5,000 m depth)</text>

  <!-- Seafloor Topography / Mid-Ocean Ridge -->
  <g transform="translate(0, 110)">
    <!-- Mantle Base -->
    <path d="M 30 180 Q 200 160, 300 120 L 320 135 L 340 120 Q 440 160, 610 180 L 610 240 L 30 240 Z" fill="url(#mantleGrad)" />

    <!-- Upwelling Magma Chamber in Ridge Center -->
    <path d="M 290 230 Q 320 140, 320 130 Q 320 140, 350 230 Z" fill="url(#magmaGlow)" opacity="0.9" />

    <!-- Oceanic Crust Slices (Magnetic Polarity Stripes) -->
    <!-- Symmetric pairs radiating out from ridge center (x=320) -->

    <!-- Pair 4 (Oldest, e.g. 30 Ma) - Normal (Cyan) -->
    <polygon points="40,180 110,172 110,205 40,210" fill="#00d2d3" stroke="#01a3a4" stroke-width="1" />
    <polygon points="530,172 600,180 600,210 530,205" fill="#00d2d3" stroke="#01a3a4" stroke-width="1" />

    <!-- Pair 3 (20 Ma) - Reversed (Dark Slate / Amber) -->
    <polygon points="110,172 180,162 180,198 110,205" fill="#576574" stroke="#222f3e" stroke-width="1" />
    <polygon points="460,162 530,172 530,205 460,198" fill="#576574" stroke="#222f3e" stroke-width="1" />

    <!-- Pair 2 (10 Ma) - Normal (Cyan) -->
    <polygon points="180,162 250,145 250,185 180,198" fill="#00d2d3" stroke="#01a3a4" stroke-width="1" />
    <polygon points="390,145 460,162 460,198 390,185" fill="#00d2d3" stroke="#01a3a4" stroke-width="1" />

    <!-- Pair 1 (5 Ma) - Reversed (Dark Slate) -->
    <polygon points="250,145 295,130 295,175 250,185" fill="#576574" stroke="#222f3e" stroke-width="1" />
    <polygon points="345,130 390,145 390,185 345,175" fill="#576574" stroke="#222f3e" stroke-width="1" />

    <!-- Center (0 Ma / Present) - Normal (Bright Cyan with Magma Injection) -->
    <polygon points="295,130 320,138 345,130 340,170 300,170" fill="#00d2d3" stroke="#54a0ff" stroke-width="1.5" />

    <!-- Mid-Ocean Ridge Crest Label & Line -->
    <line x1="320" y1="65" x2="320" y2="125" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="320" cy="132" r="4" fill="#ff4757" />
    <text x="320" y="55" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#ff7675" text-anchor="middle">RIDGE AXIS (CENTRAL RIFT)</text>
    <text x="320" y="70" font-family="Inter, sans-serif" font-size="9" fill="#dfe6e9" text-anchor="middle">New crust forms here (0 Ma)</text>

    <!-- Plate Spreading Motion Arrows -->
    <g stroke="#ffffff" stroke-width="2.5" fill="none">
      <!-- Left plate moving west -->
      <line x1="230" y1="110" x2="160" y2="110" />
      <polyline points="172,103 158,110 172,117" />

      <!-- Right plate moving east -->
      <line x1="410" y1="110" x2="480" y2="110" />
      <polyline points="468,103 482,110 468,117" />
    </g>
    <text x="195" y="98" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Plate motion</text>
    <text x="445" y="98" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Plate motion</text>

    <!-- Convection Arrows in Mantle -->
    <path d="M 280 230 C 260 200, 240 190, 210 200" stroke="#ff9f43" stroke-width="2" fill="none" stroke-dasharray="3,3" />
    <path d="M 360 230 C 380 200, 400 190, 430 200" stroke="#ff9f43" stroke-width="2" fill="none" stroke-dasharray="3,3" />
    <text x="320" y="225" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffa502" text-anchor="middle">Upwelling Asthenosphere</text>
  </g>

  <!-- Legend & Magnetic Polarity Explanation -->
  <g transform="translate(40, 345)">
    <!-- Normal Polarity -->
    <rect x="0" y="0" width="22" height="14" rx="3" fill="#00d2d3" />
    <text x="30" y="11" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Normal magnetic polarity (compass points north)</text>

    <!-- Reversed Polarity -->
    <rect x="0" y="22" width="22" height="14" rx="3" fill="#576574" />
    <text x="30" y="33" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Reversed magnetic polarity (compass points south)</text>

    <text x="360" y="22" font-family="Inter, sans-serif" font-size="10" fill="rgba(200, 225, 245, 0.75)">
      Vine–Matthews–Morley (1963): Symmetrical stripes prove new seafloor spreads outward continuously.
    </text>
  </g>
</svg>
