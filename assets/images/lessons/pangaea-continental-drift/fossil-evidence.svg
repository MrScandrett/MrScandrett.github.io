<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071b2b" />
      <stop offset="100%" stop-color="#04121e" />
    </linearGradient>
    <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5235" />
      <stop offset="100%" stop-color="#1b3824" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Deep Ocean Background -->
  <rect width="640" height="420" rx="14" fill="url(#bgGrad)" />
  <rect width="638" height="418" x="1" y="1" rx="13" fill="none" stroke="rgba(120, 180, 240, 0.16)" stroke-width="1.5" />

  <!-- Title & Kicker -->
  <text x="32" y="34" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#7fc7ff" letter-spacing="0.1em">EVIDENCE: FOSSIL CORRELATION</text>
  <text x="32" y="58" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Identical Fossils Across Separate Southern Continents</text>

  <!-- Continents in Reassembled Gondwana Fit -->
  <g filter="url(#shadow)" transform="translate(40, 45)">
    <!-- South America -->
    <path d="M 90 90 C 130 85, 160 110, 165 145 C 170 180, 155 220, 140 255 C 125 285, 105 310, 95 320 C 90 310, 85 270, 75 240 C 65 200, 60 160, 70 125 Z" fill="url(#landGrad)" stroke="#4a8559" stroke-width="1.5" />
    <text x="100" y="180" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#d7f0db" text-anchor="middle">South America</text>

    <!-- Africa -->
    <path d="M 166 110 C 190 90, 250 85, 275 110 C 295 135, 280 180, 265 210 C 255 245, 240 280, 215 310 C 190 320, 175 280, 165 240 C 160 190, 162 145, 166 110 Z" fill="url(#landGrad)" stroke="#4a8559" stroke-width="1.5" />
    <text x="225" y="170" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#d7f0db" text-anchor="middle">Africa</text>

    <!-- Madagascar -->
    <path d="M 275 235 C 285 240, 285 260, 280 270 C 275 275, 270 265, 272 250 Z" fill="url(#landGrad)" stroke="#4a8559" stroke-width="1" />

    <!-- India -->
    <path d="M 265 185 C 285 175, 310 185, 315 210 C 310 235, 285 245, 270 230 C 260 215, 260 195, 265 185 Z" fill="url(#landGrad)" stroke="#4a8559" stroke-width="1.5" />
    <text x="290" y="210" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#d7f0db" text-anchor="middle">India</text>

    <!-- Antarctica -->
    <path d="M 180 315 C 230 300, 310 305, 350 315 C 380 325, 360 355, 310 355 C 250 355, 180 345, 180 315 Z" fill="url(#landGrad)" stroke="#4a8559" stroke-width="1.5" />
    <text x="265" y="340" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#d7f0db" text-anchor="middle">Antarctica</text>

    <!-- Australia -->
    <path d="M 335 240 C 365 230, 395 250, 400 280 C 390 310, 360 320, 335 305 C 325 280, 325 255, 335 240 Z" fill="url(#landGrad)" stroke="#4a8559" stroke-width="1.5" />
    <text x="365" y="275" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#d7f0db" text-anchor="middle">Australia</text>

    <!-- Continuous Fossil Distribution Bands -->
    <!-- 1. Cynognathus (orange band across central SA and central Africa) -->
    <path d="M 85 160 C 120 155, 175 145, 230 140" fill="none" stroke="#ff9f43" stroke-width="11" stroke-linecap="round" opacity="0.82" />

    <!-- 2. Mesosaurus (cyan/blue band across southern SA and southern Africa) -->
    <path d="M 95 235 C 130 230, 165 225, 205 230" fill="none" stroke="#0abde3" stroke-width="11" stroke-linecap="round" opacity="0.82" />

    <!-- 3. Lystrosaurus (purple/magenta band across Africa, India, Antarctica) -->
    <path d="M 235 210 C 255 220, 275 215, 290 225 C 295 250, 280 290, 270 325" fill="none" stroke="#ee5253" stroke-width="11" stroke-linecap="round" opacity="0.82" />

    <!-- 4. Glossopteris (emerald green band across all southern continents) -->
    <path d="M 105 285 C 150 285, 210 295, 255 320 C 295 330, 340 310, 365 285" fill="none" stroke="#10ac84" stroke-width="13" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Legend Box on Right -->
  <g transform="translate(440, 75)">
    <rect width="180" height="230" rx="10" fill="rgba(8, 28, 46, 0.88)" stroke="rgba(140, 190, 240, 0.22)" stroke-width="1" />
    <text x="14" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#8bc8ff" letter-spacing="0.08em">FOSSIL SPECIES</text>

    <!-- Item 1: Cynognathus -->
    <circle cx="20" cy="46" r="6" fill="#ff9f43" />
    <text x="32" y="46" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Cynognathus</text>
    <text x="32" y="58" font-family="Inter, sans-serif" font-size="9" fill="#9bb3c7">Triassic land reptile (3 m)</text>

    <!-- Item 2: Mesosaurus -->
    <circle cx="20" cy="86" r="6" fill="#0abde3" />
    <text x="32" y="86" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Mesosaurus</text>
    <text x="32" y="98" font-family="Inter, sans-serif" font-size="9" fill="#9bb3c7">Freshwater lake reptile</text>

    <!-- Item 3: Lystrosaurus -->
    <circle cx="20" cy="126" r="6" fill="#ee5253" />
    <text x="32" y="126" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Lystrosaurus</text>
    <text x="32" y="138" font-family="Inter, sans-serif" font-size="9" fill="#9bb3c7">Land-dwelling herbivore</text>

    <!-- Item 4: Glossopteris -->
    <circle cx="20" cy="166" r="6" fill="#10ac84" />
    <text x="32" y="166" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Glossopteris</text>
    <text x="32" y="178" font-family="Inter, sans-serif" font-size="9" fill="#9bb3c7">Subpolar seed fern tree</text>

    <!-- Summary note -->
    <path d="M 12 196 L 168 196" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="14" y="212" font-family="Inter, sans-serif" font-size="8.5" fill="#a4c2db">None could swim across ocean</text>
  </g>

  <!-- Explanatory footer note -->
  <text x="32" y="398" font-family="Inter, sans-serif" font-size="10" fill="rgba(195, 220, 240, 0.65)">Alfred Wegener (1912): Continental drift explained these continuous fossil belts across modern 3,000-mile ocean gaps.</text>
</svg>
