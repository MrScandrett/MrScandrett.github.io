<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" overflow="hidden" role="img" aria-labelledby="mp-title mp-desc">
  <title id="mp-title">Marco Polo: Silk Road & Maritime Return (1271–1295)</title>
  <desc id="mp-desc">Geographic route map of Eurasia illustrating Marco Polo's 24-year journey from Venice across the Silk Road to Shangdu and Khanbaliq, and his maritime return through the Indian Ocean.</desc>
  <rect width="1000" height="580" fill="#0c2440"/>
  <path d="M100,0V580 M300,0V580 M500,0V580 M700,0V580 M900,0V580 M0,150H1000 M0,300H1000 M0,450H1000" stroke="#1c3d5a" stroke-width="1" stroke-dasharray="4 6" fill="none"/>
  <!-- Stylized Eurasia & Africa Coastline -->
  <path d="M40,240 Q60,190 90,160 Q120,130 160,120 Q210,120 250,150 Q300,160 330,120 Q390,90 460,80 Q560,70 690,80 Q800,90 870,140 Q920,200 900,280 Q870,330 830,360 Q800,390 770,360 Q730,310 700,260 Q660,250 630,280 Q590,320 540,300 Q500,280 470,260 Q430,260 390,290 Q350,330 300,340 Q250,350 200,380 Q160,320 120,300 Q80,280 40,240 Z" fill="#1a3328" stroke="#2f5e49" stroke-width="2"/>
  <!-- Mediterranean & Black Sea -->
  <path d="M120,220 Q160,210 200,230 Q240,240 280,230 Q240,260 180,260 Q130,250 120,220 Z" fill="#0c2440" stroke="#387896" stroke-width="1.5"/>
  <text x="160" y="245" fill="#5b94ad" font-family="system-ui,sans-serif" font-size="11">Mediterranean</text>
  <!-- Indian Ocean / South China Sea -->
  <text x="480" y="460" fill="#36648b" font-family="system-ui,sans-serif" font-size="18" font-weight="bold" letter-spacing="2">INDIAN OCEAN</text>
  <text x="800" y="430" fill="#36648b" font-family="system-ui,sans-serif" font-size="14" font-weight="bold">South China Sea</text>
  <!-- Outbound Overland Route (1271–1275) in Gold -->
  <!-- Venice -> Acre -> Tabriz -> Hormuz -> Balkh -> Kashgar -> Dunhuang -> Shangdu -> Khanbaliq -->
  <path d="M165,215 L245,260 L310,245 L350,320 L420,250 L490,240 L570,235 L680,230 L760,205 L790,220" fill="none" stroke="#f5ba42" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- In Service of Yuan Dynasty (Green Dashed) -->
  <path d="M790,220 L780,290 L740,340" fill="none" stroke="#52c485" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <!-- Return Maritime Route (1291–1295) in Cyan -->
  <!-- Quanzhou (Zaiton) -> Champa -> Sumatra -> Sri Lanka -> India Malabar -> Hormuz -> Trebizond -> Constantinople -> Venice -->
  <path d="M780,290 L810,360 L750,420 L700,450 L630,420 L550,370 L480,340 L350,320 L300,250 L240,225 L165,215" fill="none" stroke="#38c6d9" stroke-width="3" stroke-dasharray="7 4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Waypoints -->
  <!-- Venice -->
  <circle cx="165" cy="215" r="6" fill="#f5ba42" stroke="#fff" stroke-width="2"/>
  <text x="110" y="205" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">Venice (1271/1295)</text>
  <!-- Acre -->
  <circle cx="245" cy="260" r="5" fill="#f5ba42" stroke="#fff" stroke-width="1.5"/>
  <text x="210" y="285" fill="#ffe599" font-family="system-ui,sans-serif" font-size="12">Acre</text>
  <!-- Tabriz -->
  <circle cx="310" cy="245" r="5" fill="#f5ba42" stroke="#fff" stroke-width="1.5"/>
  <text x="290" y="230" fill="#ffe599" font-family="system-ui,sans-serif" font-size="12">Tabriz</text>
  <!-- Hormuz -->
  <circle cx="350" cy="320" r="5" fill="#f5ba42" stroke="#fff" stroke-width="1.5"/>
  <text x="360" y="335" fill="#ffe599" font-family="system-ui,sans-serif" font-size="12">Hormuz</text>
  <!-- Balkh & Pamirs -->
  <circle cx="420" cy="250" r="5" fill="#f5ba42" stroke="#fff" stroke-width="1.5"/>
  <text x="400" y="235" fill="#ffe599" font-family="system-ui,sans-serif" font-size="12">Pamirs / Balkh</text>
  <!-- Kashgar / Taklamakan -->
  <circle cx="490" cy="240" r="5" fill="#f5ba42" stroke="#fff" stroke-width="1.5"/>
  <text x="460" y="265" fill="#ffe599" font-family="system-ui,sans-serif" font-size="12">Kashgar</text>
  <!-- Dunhuang -->
  <circle cx="570" cy="235" r="5" fill="#f5ba42" stroke="#fff" stroke-width="1.5"/>
  <text x="545" y="220" fill="#ffe599" font-family="system-ui,sans-serif" font-size="12">Dunhuang</text>
  <!-- Shangdu -->
  <circle cx="760" cy="205" r="6" fill="#f5ba42" stroke="#fff" stroke-width="2"/>
  <text x="730" y="190" fill="#ffe599" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">Shangdu (Summer Palace)</text>
  <!-- Khanbaliq (Dadu / Beijing) -->
  <circle cx="790" cy="220" r="6" fill="#f5ba42" stroke="#fff" stroke-width="2"/>
  <text x="805" y="225" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">Khanbaliq (1275–1291)</text>
  <!-- Quanzhou (Zaiton) -->
  <circle cx="780" cy="290" r="5" fill="#38c6d9" stroke="#fff" stroke-width="1.5"/>
  <text x="795" y="295" fill="#9ee8f2" font-family="system-ui,sans-serif" font-size="12">Quanzhou (Zaiton)</text>
  <!-- Sumatra -->
  <circle cx="700" cy="450" r="5" fill="#38c6d9" stroke="#fff" stroke-width="1.5"/>
  <text x="710" y="465" fill="#9ee8f2" font-family="system-ui,sans-serif" font-size="12">Sumatra (5-month wait)</text>
  <!-- Sri Lanka / India -->
  <circle cx="550" cy="370" r="5" fill="#38c6d9" stroke="#fff" stroke-width="1.5"/>
  <text x="500" y="395" fill="#9ee8f2" font-family="system-ui,sans-serif" font-size="12">Malabar Coast</text>
  <!-- Legend Banner -->
  <rect x="24" y="24" width="360" height="110" rx="6" fill="#071626" stroke="#244b43" stroke-width="1.5"/>
  <text x="40" y="48" fill="#fff" font-family="system-ui,sans-serif" font-size="15" font-weight="bold">Marco Polo: The 24-Year Journey</text>
  <line x1="40" y1="70" x2="70" y2="70" stroke="#f5ba42" stroke-width="3.5"/>
  <text x="80" y="74" fill="#e1e7ec" font-family="system-ui,sans-serif" font-size="12">1271–1275: Outbound Silk Road overland</text>
  <line x1="40" y1="94" x2="70" y2="94" stroke="#38c6d9" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="80" y="98" fill="#e1e7ec" font-family="system-ui,sans-serif" font-size="12">1291–1295: Return maritime Silk Road</text>
</svg>