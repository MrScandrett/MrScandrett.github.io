<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Three decay modes: alpha, beta-minus and gamma, each shown with parent nucleus, emitted particle and daughter nucleus">
<rect width="900" height="460" fill="#0a1421"/>
<g font-family="Inter,Arial,sans-serif" fill="#dceaf8">
<text x="450" y="34" font-size="22" font-weight="800" text-anchor="middle">Three ways a nucleus settles down</text>
<!-- alpha -->
<g transform="translate(0,60)"><text x="40" y="30" font-size="18" font-weight="800" fill="#ff7a94">ALPHA (α)</text>
<circle cx="190" cy="80" r="46" fill="#3a1c26" stroke="#ff7a94" stroke-width="3"/><text x="190" y="76" font-size="20" font-weight="800" text-anchor="middle">²³⁸U</text><text x="190" y="98" font-size="12" text-anchor="middle" opacity=".7">Z=92  N=146</text>
<path d="M250 80h110" stroke="#dceaf8" stroke-width="3"/><path d="M352 72l12 8-12 8" fill="none" stroke="#dceaf8" stroke-width="3"/>
<circle cx="440" cy="80" r="40" fill="#231a2c" stroke="#b09fff" stroke-width="3"/><text x="440" y="76" font-size="20" font-weight="800" text-anchor="middle">²³⁴Th</text><text x="440" y="98" font-size="12" text-anchor="middle" opacity=".7">Z=90  N=144</text>
<text x="500" y="86" font-size="26" font-weight="800">+</text>
<g transform="translate(560,80)"><circle cx="-9" cy="-9" r="10" fill="#ff7a94"/><circle cx="9" cy="-9" r="10" fill="#7aa2ff"/><circle cx="-9" cy="9" r="10" fill="#7aa2ff"/><circle cx="9" cy="9" r="10" fill="#ff7a94"/></g>
<text x="600" y="86" font-size="16" font-weight="700">⁴He (2 p + 2 n)</text>
<text x="40" y="150" font-size="14" opacity=".75">Z falls by 2, A falls by 4 — the atom moves two boxes LEFT on the periodic table.</text></g>
<!-- beta -->
<g transform="translate(0,215)"><text x="40" y="30" font-size="18" font-weight="800" fill="#38bdf8">BETA-MINUS (β⁻)</text>
<circle cx="190" cy="80" r="42" fill="#12283a" stroke="#38bdf8" stroke-width="3"/><text x="190" y="76" font-size="20" font-weight="800" text-anchor="middle">¹⁴C</text><text x="190" y="98" font-size="12" text-anchor="middle" opacity=".7">Z=6  N=8</text>
<path d="M250 80h110" stroke="#dceaf8" stroke-width="3"/><path d="M352 72l12 8-12 8" fill="none" stroke="#dceaf8" stroke-width="3"/>
<circle cx="440" cy="80" r="42" fill="#231a2c" stroke="#b09fff" stroke-width="3"/><text x="440" y="76" font-size="20" font-weight="800" text-anchor="middle">¹⁴N</text><text x="440" y="98" font-size="12" text-anchor="middle" opacity=".7">Z=7  N=7</text>
<text x="500" y="86" font-size="26" font-weight="800">+</text>
<circle cx="545" cy="80" r="8" fill="#38bdf8"/><text x="565" y="86" font-size="16" font-weight="700">electron + antineutrino</text>
<text x="40" y="150" font-size="14" opacity=".75">A unchanged, Z rises by 1 — a neutron became a proton. One box RIGHT.</text></g>
<!-- gamma -->
<g transform="translate(0,370)"><text x="40" y="30" font-size="18" font-weight="800" fill="#f6c35b">GAMMA (γ)</text>
<circle cx="190" cy="50" r="30" fill="#33290f" stroke="#f6c35b" stroke-width="3" stroke-dasharray="6 4"/><text x="190" y="56" font-size="16" font-weight="800" text-anchor="middle">⁶⁰Ni*</text>
<path d="M235 50h100" stroke="#dceaf8" stroke-width="3"/><path d="M327 42l12 8-12 8" fill="none" stroke="#dceaf8" stroke-width="3"/>
<circle cx="390" cy="50" r="30" fill="#231a2c" stroke="#b09fff" stroke-width="3"/><text x="390" y="56" font-size="16" font-weight="800" text-anchor="middle">⁶⁰Ni</text>
<path d="M430 50q14-18 28 0t28 0t28 0t28 0" fill="none" stroke="#f6c35b" stroke-width="3"/><text x="560" y="56" font-size="16" font-weight="700">photon (pure energy)</text>
<text x="40" y="100" font-size="14" opacity=".75">Z and A unchanged — the nucleus only sheds extra energy (* = excited state).</text></g>
</g></svg>
