<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">Four nuclear decay modes</title><desc id="desc">Four rows compare alpha, beta minus, beta plus and gamma emission. Each shows a parent, daughter, emitted radiation, and changes to proton number Z and mass number A.</desc>
<rect width="1000" height="680" rx="18" fill="#08101b"/>
<g font-family="Inter,Arial,sans-serif" fill="#eaf4ff">
<text x="40" y="48" font-size="28" font-weight="800">What changes when a nucleus decays?</text>
<text x="40" y="77" font-size="16" fill="#b9cde0">Read the parent → daughter, then compare atomic number Z and mass number A.</text>
<g transform="translate(32,102)"><rect width="936" height="126" rx="14" fill="#19202f" stroke="#a14b65"/><rect width="7" height="126" rx="3" fill="#ff7a94"/><text x="28" y="34" fill="#ff9fb0" font-size="20" font-weight="800">α  ALPHA</text><text x="28" y="68" font-size="25" font-weight="800">²³⁸₉₂U  →  ²³⁴₉₀Th  +  ⁴₂He</text><text x="28" y="101" fill="#c7d7e7" font-size="16">Helium nucleus leaves: 2 protons + 2 neutrons.</text><rect x="680" y="24" width="224" height="76" rx="10" fill="#3c2030"/><text x="792" y="54" text-anchor="middle" font-size="19" font-weight="800">Z − 2    A − 4</text><text x="792" y="79" text-anchor="middle" font-size="14" fill="#ffd1da">new element</text></g>
<g transform="translate(32,244)"><rect width="936" height="126" rx="14" fill="#142739" stroke="#2e8db8"/><rect width="7" height="126" rx="3" fill="#38bdf8"/><text x="28" y="34" fill="#7cdaff" font-size="20" font-weight="800">β⁻  BETA MINUS</text><text x="28" y="68" font-size="25" font-weight="800">¹⁴₆C  →  ¹⁴₇N  +  ⁰₋₁e  +  ν̄</text><text x="28" y="101" fill="#c7d7e7" font-size="16">A neutron becomes a proton; an electron and antineutrino leave.</text><rect x="680" y="24" width="224" height="76" rx="10" fill="#173d53"/><text x="792" y="54" text-anchor="middle" font-size="19" font-weight="800">Z + 1    A same</text><text x="792" y="79" text-anchor="middle" font-size="14" fill="#b9edff">new element</text></g>
<g transform="translate(32,386)"><rect width="936" height="126" rx="14" fill="#173228" stroke="#32966a"/><rect width="7" height="126" rx="3" fill="#4fdc9a"/><text x="28" y="34" fill="#91f3bf" font-size="20" font-weight="800">β⁺  BETA PLUS</text><text x="28" y="68" font-size="25" font-weight="800">²²₁₁Na  →  ²²₁₀Ne  +  ⁰₊₁e  +  ν</text><text x="28" y="101" fill="#c7d7e7" font-size="16">A proton becomes a neutron; a positron and neutrino leave.</text><rect x="680" y="24" width="224" height="76" rx="10" fill="#194732"/><text x="792" y="54" text-anchor="middle" font-size="19" font-weight="800">Z − 1    A same</text><text x="792" y="79" text-anchor="middle" font-size="14" fill="#c4ffdb">new element</text></g>
<g transform="translate(32,528)"><rect width="936" height="126" rx="14" fill="#312a18" stroke="#ac8532"/><rect width="7" height="126" rx="3" fill="#f6c35b"/><text x="28" y="34" fill="#ffe19b" font-size="20" font-weight="800">γ  GAMMA</text><text x="28" y="68" font-size="25" font-weight="800">⁹⁹ᵐ₄₃Tc  →  ⁹⁹₄₃Tc  +  γ</text><text x="28" y="101" fill="#c7d7e7" font-size="16">An excited nucleus releases a photon; nucleon counts stay put.</text><rect x="680" y="24" width="224" height="76" rx="10" fill="#4a3a1d"/><text x="792" y="54" text-anchor="middle" font-size="19" font-weight="800">Z same    A same</text><text x="792" y="79" text-anchor="middle" font-size="14" fill="#ffe9b3">same element</text></g>
</g></svg>
