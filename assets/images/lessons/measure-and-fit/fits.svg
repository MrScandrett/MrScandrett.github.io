<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d">
<title id="t">Press fit, slip fit and loose fit</title>
<desc id="d">Three printed holes seen from above with the same pencil in each. In the press fit the gap is almost nothing, in the slip fit there is a thin even ring of air, and in the loose fit a wider ring lets the pencil wobble or turn. Gaps are drawn about forty times larger than life.</desc>
<rect width="1000" height="420" fill="#fbfaf6"/>
<rect x="15" y="12" width="310" height="395" rx="14" fill="none" stroke="#d6d3c8" stroke-width="1.5"/>
<text x="170" y="46" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#b42318">Press fit</text>
<text x="170" y="70" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#334155">stays put; push it in</text>
<rect x="50" y="74" width="240" height="202" rx="10" fill="#d7e6f3" stroke="#2f5d86" stroke-width="2"/>
<circle cx="170" cy="175" r="73" fill="#ffffff" stroke="#2f5d86" stroke-width="2"/>
<circle cx="170" cy="175" r="70" fill="#f2c94c" stroke="#8a6d1b" stroke-width="2"/>
<circle cx="170" cy="175" r="10" fill="#374151"/>
<text x="170" y="314" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#111827"><tspan font-weight="700">Gap per side:</tspan> 0.05–0.15 mm</text>
<text x="170" y="338" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#334155">Hole = item +0.1–0.3 mm</text>
<rect x="345" y="12" width="310" height="395" rx="14" fill="none" stroke="#d6d3c8" stroke-width="1.5"/>
<text x="500" y="46" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#a15c00">Slip fit</text>
<text x="500" y="70" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#334155">slides in and out, no wobble</text>
<rect x="380" y="67" width="240" height="216" rx="10" fill="#d7e6f3" stroke="#2f5d86" stroke-width="2"/>
<circle cx="500" cy="175" r="80" fill="#ffffff" stroke="#2f5d86" stroke-width="2"/>
<circle cx="500" cy="175" r="70" fill="#f2c94c" stroke="#8a6d1b" stroke-width="2"/>
<circle cx="500" cy="175" r="10" fill="#374151"/>
<path d="M570 175 H580" stroke="#a15c00" stroke-width="2.5"/>
<text x="500" y="321" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#111827"><tspan font-weight="700">Gap per side:</tspan> 0.20–0.30 mm</text>
<text x="500" y="345" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#334155">Hole = item +0.4–0.6 mm</text>
<rect x="675" y="12" width="310" height="395" rx="14" fill="none" stroke="#d6d3c8" stroke-width="1.5"/>
<text x="830" y="46" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1d6b45">Loose fit</text>
<text x="830" y="70" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#334155">drops in, turns, wobbles</text>
<rect x="710" y="59" width="240" height="232" rx="10" fill="#d7e6f3" stroke="#2f5d86" stroke-width="2"/>
<circle cx="830" cy="175" r="88" fill="#ffffff" stroke="#2f5d86" stroke-width="2"/>
<circle cx="830" cy="175" r="70" fill="#f2c94c" stroke="#8a6d1b" stroke-width="2"/>
<circle cx="830" cy="175" r="10" fill="#374151"/>
<path d="M900 175 H918" stroke="#1d6b45" stroke-width="2.5"/>
<text x="830" y="329" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#111827"><tspan font-weight="700">Gap per side:</tspan> 0.35–0.50 mm</text>
<text x="830" y="353" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#334155">Hole = item +0.7–1.0 mm</text>
<text x="985" y="414" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563">Top view, gaps exaggerated. Starting points for PLA; your fit test coupon decides. Original ClassroomOS teaching diagram.</text>
</svg>