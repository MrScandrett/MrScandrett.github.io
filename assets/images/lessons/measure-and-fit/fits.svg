<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Press, slip and loose fits</title>
  <desc id="d">Three cross-sections of a round peg in a printed hole. The press fit has the smallest gap, the slip fit a bit more, and the loose fit the most, 0.35 to 0.50 millimetres per side. Gaps are drawn much larger than life.</desc>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="30" y="40" font-size="26" font-weight="700" fill="#0f172a">Three fits for a printed hole (gap per side, PLA, 0.4 mm nozzle)</text>
  <text x="30" y="68" font-size="16" fill="#334155">Gaps drawn about 20× bigger than life so you can see them. The item is the same size in all three.</text>
  <g>
    <!-- panel frames -->
    <rect x="30" y="92" width="300" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="350" y="92" width="300" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="670" y="92" width="300" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  </g>
  <!-- press -->
  <g transform="translate(180 236)">
    <rect x="-110" y="-110" width="220" height="220" rx="8" fill="#9ec5e8" stroke="#2f5d86" stroke-width="2"/>
    <circle r="72" fill="#ffffff" stroke="#2f5d86" stroke-width="2"/>
    <circle r="70" fill="#f2c94c" stroke="#8a6d1b" stroke-width="2"/>
    <path d="M70 0 H72" stroke="#d9480f" stroke-width="3"/>
  </g>
  <!-- slip -->
  <g transform="translate(500 236)">
    <rect x="-110" y="-110" width="220" height="220" rx="8" fill="#9ec5e8" stroke="#2f5d86" stroke-width="2"/>
    <circle r="75" fill="#ffffff" stroke="#2f5d86" stroke-width="2"/>
    <circle r="70" fill="#f2c94c" stroke="#8a6d1b" stroke-width="2"/>
    <path d="M70 0 H75" stroke="#d9480f" stroke-width="3"/>
  </g>
  <!-- loose -->
  <g transform="translate(820 236)">
    <rect x="-110" y="-110" width="220" height="220" rx="8" fill="#9ec5e8" stroke="#2f5d86" stroke-width="2"/>
    <circle r="79" fill="#ffffff" stroke="#2f5d86" stroke-width="2"/>
    <circle cx="-4" cy="3" r="70" fill="#f2c94c" stroke="#8a6d1b" stroke-width="2"/>
    <path d="M66 3 H79" stroke="#d9480f" stroke-width="3"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#334155">
    <text x="180" y="240">item</text><text x="500" y="240">item</text><text x="816" y="242">item</text>
  </g>
  <g text-anchor="middle">
    <text x="180" y="390" font-size="22" font-weight="700" fill="#0f172a">Press</text>
    <text x="180" y="412" font-size="16" fill="#b8410c" font-weight="700">0.05–0.15 mm</text>
    <text x="500" y="390" font-size="22" font-weight="700" fill="#0f172a">Slip</text>
    <text x="500" y="412" font-size="16" fill="#b8410c" font-weight="700">0.20–0.30 mm</text>
    <text x="820" y="390" font-size="22" font-weight="700" fill="#0f172a">Loose</text>
    <text x="820" y="412" font-size="16" fill="#b8410c" font-weight="700">0.35–0.50 mm</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#334155">
    <text x="180" y="448">Push it in; it stays put.</text>
    <text x="180" y="470">Magnets, pegs that must not fall out.</text>
    <text x="500" y="448">Slides by hand, no wobble.</text>
    <text x="500" y="470">Lids, sliding drawers, swappable parts.</text>
    <text x="820" y="448">Drops in, turns freely.</text>
    <text x="820" y="470">Axles, hinges, print-in-place parts.</text>
  </g>
</svg>
