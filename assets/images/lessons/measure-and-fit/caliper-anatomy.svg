<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Parts of a caliper</title>
  <desc id="d">A caliper with its outside jaws, inside jaws, depth rod, main scale, vernier scale, thumb roller and lock screw labelled. Orange marks the faces that touch the object for each kind of measurement.</desc>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="30" y="40" font-size="26" font-weight="700" fill="#0f172a">One tool, three ways to measure</text>
  <text x="30" y="68" font-size="16" fill="#334155">Orange = the two faces that touch the object. Each pair reads the same scale.</text>

  <!-- beam -->
  <rect x="150" y="200" width="800" height="40" fill="#d5dbe1" stroke="#4b5563" stroke-width="2"/>
  <g stroke="#1f2933" stroke-width="1.4">
    <path d="M190 200v14M206 200v8M222 200v8M238 200v8M254 200v8M270 200v11M286 200v8M302 200v8M318 200v8M334 200v8M350 200v14M366 200v8M382 200v8M398 200v8M414 200v8M430 200v11M446 200v8M462 200v8M478 200v8M494 200v8M510 200v14M526 200v8M542 200v8M558 200v8M574 200v8M590 200v11M606 200v8M622 200v8M638 200v8M654 200v8M670 200v14M686 200v8M702 200v8M718 200v8M734 200v8M750 200v11M766 200v8M782 200v8M798 200v8M814 200v8M830 200v14M846 200v8M862 200v8M878 200v8M894 200v8M910 200v11"/>
  </g>
  <!-- fixed head: outside jaw down, inside jaw up -->
  <path d="M120 160 H190 V200 H120 Z" fill="#d5dbe1" stroke="#4b5563" stroke-width="2"/>
  <path d="M120 240 H190 V420 L176 446 L150 360 L120 330 Z" fill="#d5dbe1" stroke="#4b5563" stroke-width="2"/>
  <path d="M190 160 V96 L204 110 L208 160 Z" fill="#d5dbe1" stroke="#4b5563" stroke-width="2"/>
  <!-- slider -->
  <path d="M330 176 H520 V264 H330 Z" fill="#c9d0d8" stroke="#374151" stroke-width="2"/>
  <rect x="340" y="206" width="170" height="28" fill="#f8fafc" stroke="#64748b"/>
  <g stroke="#111827" stroke-width="1.4"><path d="M346 206v14M363 206v9M380 206v9M397 206v9M414 206v9M431 206v14M448 206v9M465 206v9M482 206v9M499 206v14"/></g>
  <path d="M330 264 H372 V330 L344 420 L330 446 Z" fill="#c9d0d8" stroke="#374151" stroke-width="2"/>
  <path d="M330 176 V96 L316 110 L312 176 Z" fill="#c9d0d8" stroke="#374151" stroke-width="2"/>
  <ellipse cx="425" cy="276" rx="26" ry="9" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
  <rect x="412" y="160" width="26" height="16" rx="3" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
  <!-- depth rod -->
  <rect x="950" y="216" width="40" height="8" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>

  <!-- orange measuring faces -->
  <g stroke="#d9480f" stroke-width="5" stroke-linecap="round">
    <path d="M190 246 V418"/><path d="M330 270 V418"/>
    <path d="M190 100 V158"/><path d="M330 100 V170"/>
    <path d="M950 210 V230"/><path d="M990 214 V226"/>
  </g>
  <!-- object in outside jaws -->
  <circle cx="260" cy="330" r="68" fill="#f2c94c" fill-opacity="0.55" stroke="#8a6d1b" stroke-width="2"/>
  <text x="260" y="336" font-size="15" text-anchor="middle" fill="#5b4511">object</text>

  <!-- labels -->
  <g font-size="17" fill="#0f172a">
    <text x="214" y="486" font-weight="700">Outside jaws</text>
    <text x="214" y="506" fill="#475569">width, thickness, outside Ø</text>
    <text x="40" y="104" font-weight="700">Inside jaws</text>
    <text x="40" y="124" fill="#475569">hole Ø, slot width</text>
    <text x="826" y="296" font-weight="700">Depth rod</text>
    <text x="826" y="316" fill="#475569">how deep a hole is</text>
    <text x="620" y="176" font-weight="700">Main scale (mm)</text>
    <text x="530" y="300" font-weight="700">Vernier scale</text>
    <text x="530" y="320" fill="#475569">or a digital display</text>
    <text x="460" y="128" font-weight="700">Lock screw</text>
    <text x="468" y="372" font-weight="700">Thumb roller</text>
  </g>
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M150 104 H186"/><path d="M700 182 V198"/><path d="M528 296 L508 230"/>
    <path d="M500 132 L438 162"/><path d="M500 356 L440 282"/><path d="M880 280 L960 228"/>
  </g>
</svg>
