<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
  <title id="t">Parts of a caliper</title>
  <desc id="d">A caliper with its outside jaws, inside jaws, depth rod, main scale, vernier scale, thumb roller and lock screw labelled.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#b9c1ca"/>
    </linearGradient>
    <pattern id="mm" width="4.6" height="40" patternUnits="userSpaceOnUse" x="218">
      <line x1="0.3" y1="0" x2="0.3" y2="9" stroke="#1f2933" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1000" height="470" fill="#fbfaf6"/>
  <!-- beam -->
  <rect x="120" y="150" width="790" height="40" fill="url(#steel)" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="218" y="150" width="672" height="10" fill="url(#mm)"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">
    <text x="218" y="174">0</text><text x="264" y="174">1</text><text x="310" y="174">2</text><text x="356" y="174">3</text><text x="586" y="174">8</text><text x="632" y="174">9</text><text x="678" y="174">10</text><text x="724" y="174">11</text><text x="770" y="174">12</text><text x="816" y="174">13</text><text x="862" y="174">14</text>
  </g>
  <!-- fixed head and jaws -->
  <path d="M120 105 H200 V150 H120 Z" fill="url(#steel)" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M120 190 H200 V385 L188 400 L150 300 L120 260 Z" fill="url(#steel)" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M200 105 V40 L212 52 L215 105 Z" fill="url(#steel)" stroke="#4b5563" stroke-width="1.5"/>
  <!-- slider -->
  <rect x="380" y="135" width="170" height="70" rx="6" fill="#d9dee4" stroke="#374151" stroke-width="1.5"/>
  <rect x="392" y="160" width="146" height="22" fill="#f8fafc" stroke="#64748b"/>
  <g stroke="#1f2933" stroke-width="0.9">
    <line x1="398" y1="160" x2="398" y2="172"/><line x1="410.6" y1="160" x2="410.6" y2="168"/><line x1="423.2" y1="160" x2="423.2" y2="168"/><line x1="435.8" y1="160" x2="435.8" y2="168"/><line x1="448.4" y1="160" x2="448.4" y2="168"/><line x1="461" y1="160" x2="461" y2="172"/><line x1="473.6" y1="160" x2="473.6" y2="168"/><line x1="486.2" y1="160" x2="486.2" y2="168"/><line x1="498.8" y1="160" x2="498.8" y2="168"/><line x1="511.4" y1="160" x2="511.4" y2="168"/><line x1="524" y1="160" x2="524" y2="172"/>
  </g>
  <path d="M380 205 H412 V300 L392 400 L380 385 Z" fill="url(#steel)" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M365 135 L368 52 L380 40 V135 Z" fill="url(#steel)" stroke="#4b5563" stroke-width="1.5"/>
  <circle cx="430" cy="222" r="15" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <g stroke="#374151" stroke-width="1"><line x1="420" y1="214" x2="440" y2="230"/><line x1="420" y1="222" x2="440" y2="222"/><line x1="420" y1="230" x2="440" y2="214"/></g>
  <rect x="495" y="118" width="22" height="17" rx="3" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <!-- depth rod -->
  <rect x="910" y="166" width="62" height="6" fill="#b9c1ca" stroke="#4b5563"/>
  <!-- measuring-face highlights -->
  <g stroke="#d9480f" stroke-width="4" stroke-linecap="round">
    <line x1="200" y1="196" x2="200" y2="380"/><line x1="380" y1="210" x2="380" y2="380"/>
    <line x1="200" y1="48" x2="200" y2="100"/><line x1="380" y1="48" x2="380" y2="100"/>
    <line x1="972" y1="164" x2="972" y2="174"/>
  </g>
  <!-- labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#111827">
    <g stroke="#475569" stroke-width="1.2" fill="none">
      <path d="M296 300 H210"/><path d="M296 300 H372"/>
      <path d="M290 70 H210"/><path d="M290 70 H372"/>
      <path d="M941 210 V178"/>
      <path d="M478 270 L440 234"/>
      <path d="M560 98 L516 120"/>
      <path d="M700 118 V150"/>
      <path d="M600 230 L540 182"/>
    </g>
    <text x="296" y="292" text-anchor="middle" font-weight="700">Outside jaws</text>
    <text x="296" y="322" text-anchor="middle" font-size="14">grip around a pencil, coin or phone</text>
    <text x="296" y="62" text-anchor="middle" font-weight="700">Inside jaws</text>
    <text x="296" y="30" text-anchor="middle" font-size="14">spread inside a hole or tape core</text>
    <text x="940" y="230" text-anchor="middle" font-weight="700">Depth rod</text>
    <text x="940" y="250" text-anchor="middle" font-size="14">depth of a cup</text>
    <text x="480" y="282" font-weight="700">Thumb roller</text>
    <text x="566" y="96" font-weight="700">Lock screw</text>
    <text x="700" y="110" text-anchor="middle" font-weight="700">Main scale (mm)</text>
    <text x="606" y="244" font-weight="700">Vernier scale</text>
    <text x="606" y="264" font-size="14">reads the part of a millimetre</text>
  </g>
  <text x="980" y="455" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">Orange edges = measuring faces. Original ClassroomOS teaching diagram.</text>
</svg>
