<title id="t">Reading a 0.05 mm vernier scale: 16.35 mm</title>
<desc id="d">The vernier zero sits just past 16 on the main scale. The seventh vernier line lines up exactly with a main-scale line, so the reading is 16 plus 7 times 0.05, which is 16.35 millimetres.</desc>
