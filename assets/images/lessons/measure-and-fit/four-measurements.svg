<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
  <title id="t">Four ways to measure with one caliper</title>
  <desc id="d">Outside jaws close on a pencil, inside jaws spread in a tape core, the depth rod reaches the bottom of a cup, and the step faces measure the height of a ledge.</desc>
  <defs>
    <linearGradient id="st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1f4"/><stop offset="1" stop-color="#b9c1ca"/></linearGradient>
  </defs>
  <rect width="1000" height="380" fill="#fbfaf6"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#111827">
    <!-- panel frames -->
    <g fill="none" stroke="#d6d3c8" stroke-width="1.5">
      <rect x="10" y="10" width="235" height="360" rx="12"/><rect x="258" y="10" width="235" height="360" rx="12"/>
      <rect x="506" y="10" width="235" height="360" rx="12"/><rect x="754" y="10" width="235" height="360" rx="12"/>
    </g>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <text x="127" y="42">1 · Outside</text><text x="375" y="42">2 · Inside</text><text x="623" y="42">3 · Depth</text><text x="871" y="42">4 · Step</text>
    </g>

    <!-- 1 outside: beam, two jaws down, hexagon pencil between -->
    <rect x="40" y="80" width="190" height="22" fill="url(#st)" stroke="#4b5563"/>
    <path d="M40 102 H90 V240 L80 255 L40 150 Z" fill="url(#st)" stroke="#4b5563"/>
    <path d="M152 70 H215 V112 H178 V240 L166 255 L152 240 Z" fill="#d9dee4" stroke="#374151"/>
    <polygon points="121,152 136,178 121,204 91,204 90,178 91,152" fill="#f2c94c" stroke="#8a6d1b" stroke-width="2"/>
    <circle cx="121" cy="178" r="5" fill="#374151"/>
    <g stroke="#d9480f" stroke-width="4"><line x1="90" y1="140" x2="90" y2="230"/><line x1="152" y1="140" x2="152" y2="230"/></g>
    <text x="127" y="292" font-size="15" text-anchor="middle">Jaws close on the item.</text>
    <text x="127" y="314" font-size="15" text-anchor="middle">Measure deep in the jaws,</text>
    <text x="127" y="336" font-size="15" text-anchor="middle">square to the item.</text>

    <!-- 2 inside: ring around two upward jaws -->
    <rect x="285" y="200" width="190" height="22" fill="url(#st)" stroke="#4b5563"/>
    <path d="M330 200 V110 L340 98 L342 200 Z" fill="url(#st)" stroke="#4b5563"/>
    <path d="M420 200 V110 L408 98 L406 200 Z" fill="#d9dee4" stroke="#374151"/>
    <path d="M300 92 H450 V170 H436 V106 H314 V170 H300 Z" fill="#cfe3f5" stroke="#2f5d86" stroke-width="2"/>
    <g stroke="#d9480f" stroke-width="4"><line x1="330" y1="112" x2="330" y2="166"/><line x1="420" y1="112" x2="420" y2="166"/></g>
    <text x="375" y="138" font-size="13" text-anchor="middle" fill="#2f5d86">tape core (cut away)</text>
    <text x="375" y="272" font-size="15" text-anchor="middle">Jaws spread inside a hole.</text>
    <text x="375" y="294" font-size="15" text-anchor="middle">Rock gently to find the</text>
    <text x="375" y="316" font-size="15" text-anchor="middle">widest reading across</text>
    <text x="375" y="338" font-size="15" text-anchor="middle">the middle.</text>

    <!-- 3 depth: caliper standing on a cup rim, rod to bottom -->
    <path d="M555 150 H590 V260 H656 V150 H691 V286 H555 Z" fill="#e7d8c2" stroke="#7a5c2e" stroke-width="2"/>
    <rect x="606" y="70" width="24" height="80" fill="url(#st)" stroke="#4b5563"/>
    <rect x="615" y="150" width="6" height="110" fill="#9ca3af" stroke="#4b5563"/>
    <g stroke="#d9480f" stroke-width="4"><line x1="596" y1="150" x2="640" y2="150"/><line x1="612" y1="260" x2="624" y2="260"/></g>
    <text x="623" y="314" font-size="15" text-anchor="middle">Rest the end on the rim;</text>
    <text x="623" y="336" font-size="15" text-anchor="middle">slide the rod to the floor.</text>

    <!-- 4 step: stepped block, caliper end faces -->
    <path d="M800 260 H960 V200 H880 V160 H800 Z" fill="#e7d8c2" stroke="#7a5c2e" stroke-width="2"/>
    <rect x="884" y="80" width="22" height="80" fill="url(#st)" stroke="#4b5563"/>
    <rect x="910" y="80" width="40" height="120" fill="#d9dee4" stroke="#374151"/>
    <g stroke="#d9480f" stroke-width="4"><line x1="884" y1="160" x2="906" y2="160"/><line x1="912" y1="200" x2="948" y2="200"/></g>
    <path d="M972 160 V200" stroke="#111827" stroke-width="1.5"/>
    <line x1="962" y1="160" x2="982" y2="160" stroke="#111827"/><line x1="962" y1="200" x2="982" y2="200" stroke="#111827"/>
    <text x="871" y="292" font-size="15" text-anchor="middle">Beam end on the high step,</text>
    <text x="871" y="314" font-size="15" text-anchor="middle">slider face on the low one:</text>
    <text x="871" y="336" font-size="15" text-anchor="middle">the gap is the step height.</text>
  </g>
  <text x="990" y="376" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4b5563">Orange = measuring faces. Original ClassroomOS teaching diagram.</text>
</svg>
