<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d">
<title id="t">Why printed holes come out small</title>
<desc id="d">Three causes. One: a CAD cylinder is a polygon, so its flat sides sit inside the true circle. Two: the plastic bead around a hole spreads into the hole. Three: the squashed first layer bulges into the hole at the bottom.</desc>
<rect width="1000" height="430" fill="#fbfaf6"/>
<rect x="15" y="12" width="310" height="370" rx="14" fill="none" stroke="#d6d3c8" stroke-width="1.5"/>
<text x="170" y="44" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111827">1 · Flat sides</text>
<rect x="345" y="12" width="310" height="370" rx="14" fill="none" stroke="#d6d3c8" stroke-width="1.5"/>
<text x="500" y="44" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111827">2 · Beads spread inward</text>
<rect x="675" y="12" width="310" height="370" rx="14" fill="none" stroke="#d6d3c8" stroke-width="1.5"/>
<text x="830" y="44" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111827">3 · Squashed first layer</text>
<circle cx="170" cy="190" r="105" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>
<polygon points="275.0,190.0 254.9,251.7 202.4,289.9 137.6,289.9 85.1,251.7 65.0,190.0 85.1,128.3 137.6,90.1 202.4,90.1 254.9,128.3" fill="#f2c94c" fill-opacity="0.25" stroke="#b8410c" stroke-width="2.5"/>
<circle cx="170" cy="190" r="99.9" fill="#f2c94c" stroke="#8a6d1b" stroke-width="2"/>
<text x="170" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827">pin touches</text><text x="170" y="214" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827">the flats</text>
<text x="170" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827">A 20-sided 8 mm "circle" is</text>
<text x="170" y="350" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827">only 7.90 mm across its flats.</text>
<text x="170" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#475569">(10 sides drawn so you can see it)</text>
<line x1="510" y1="90" x2="510" y2="300" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="516" y="84" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d4ed8">modelled hole edge</text>
<rect x="380" y="110" width="44" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="424" y="110" width="44" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="468" y="110" width="56" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="380" y="146" width="44" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="424" y="146" width="44" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="468" y="146" width="56" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="380" y="182" width="44" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="424" y="182" width="44" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="468" y="182" width="56" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="380" y="218" width="44" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="424" y="218" width="44" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="468" y="218" width="56" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="380" y="254" width="44" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="424" y="254" width="44" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="468" y="254" width="56" height="34" rx="16" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<path d="M510 310 H524" stroke="#b8410c" stroke-width="3"/>
<text x="515" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827">Plastic squashes sideways; the</text>
<text x="515" y="350" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827">innermost bead bulges past the</text>
<text x="515" y="370" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827">edge into the hole.</text>

<rect x="710" y="90" width="90" height="190" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<rect x="890" y="90" width="90" height="190" fill="#f2994a" stroke="#9a4d12" stroke-width="1.5"/>
<path d="M800 262 Q816 268 814 280 H800 Z" fill="#c2410c"/>
<path d="M890 262 Q874 268 876 280 H890 Z" fill="#c2410c"/>
<rect x="695" y="280" width="300" height="10" fill="#94a3b8"/>
<text x="845" y="140" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827">hole</text>
<path d="M845 248 L820 268" stroke="#111827" stroke-width="1.2"/>
<text x="845" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111827">"elephant's foot"</text>
<text x="845" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827">The first layer is pressed flat</text>
<text x="845" y="350" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827">onto the bed, so the bottom of</text>
<text x="845" y="370" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111827">a hole is the tightest part.</text>

</svg>