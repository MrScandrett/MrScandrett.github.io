<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="vs-anat-title vs-anat-desc">
  <title id="vs-anat-title">VS Code Game-Dev Workspace Anatomy</title>
  <desc id="vs-anat-desc">Annotated mockup of Visual Studio Code showing the Activity Bar, Explorer file tree (index.html, game.js, style.css), code editor with red squiggle diagnostics, Live Server Go Live button, and DevTools Console error panel.</desc>
  <rect width="880" height="390" rx="18" fill="#0f172a"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Meet Your Code Cockpit: VS Code + Live Server + Console</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8">Know where files live, where syntax squiggles warn you, and where runtime clues appear</text>

  <!-- IDE Frame -->
  <rect x="28" y="72" width="824" height="292" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.8"/>
  <!-- Activity Bar -->
  <rect x="28" y="72" width="44" height="264" rx="12" fill="#0f172a"/>
  <rect x="38" y="88" width="24" height="24" rx="5" fill="#38bdf8"/>
  <text x="50" y="104" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#082f49">📁</text>
  <rect x="38" y="126" width="24" height="24" rx="5" fill="#334155"/>
  <text x="50" y="142" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e2e8f0">🔍</text>
  <rect x="38" y="164" width="24" height="24" rx="5" fill="#334155"/>
  <text x="50" y="180" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e2e8f0">🧩</text>

  <!-- Explorer Panel -->
  <rect x="72" y="72" width="174" height="264" fill="#162032" stroke="#334155"/>
  <text x="86" y="96" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#94a3b8">EXPLORER · MY-GAME</text>
  <rect x="82" y="108" width="154" height="26" rx="5" fill="#0284c7"/>
  <text x="94" y="125" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#fff">index.html</text>
  <text x="94" y="150" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#cbd5e1">style.css</text>
  <text x="94" y="172" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#cbd5e1">game.js</text>
  <text x="94" y="194" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#64748b">assets/player.png</text>
  <rect x="82" y="218" width="154" height="102" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="92" y="238" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1 · Extensions Needed</text>
  <text x="92" y="256" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Live Server (auto-reload)</text>
  <text x="92" y="274" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Prettier (clean indent)</text>
  <text x="92" y="298" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Always open the FOLDER,</text>
  <text x="92" y="312" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#94a3b8">not a stray loose file.</text>

  <!-- Code Editor -->
  <rect x="246" y="72" width="332" height="176" fill="#0b1322" stroke="#334155"/>
  <rect x="246" y="72" width="120" height="26" fill="#1e293b"/>
  <text x="306" y="89" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#38bdf8">index.html</text>
  <text x="262" y="118" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#7dd3fc">1  let x = 40;</text>
  <text x="262" y="138" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#e2e8f0">2  const hero = query("#hero");</text>
  <text x="262" y="158" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#fca5a5">3  if (key == ArrowRight) x += 20</text>
  <!-- red squiggle -->
  <path d="M 358 162 Q 363 166 368 162 T 378 162 T 388 162 T 398 162 T 408 162 T 418 162" fill="none" stroke="#ef4444" stroke-width="2"/>
  <rect x="262" y="176" width="300" height="58" rx="8" fill="#3b181f" stroke="#ef4444"/>
  <text x="274" y="196" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#fecaca">2 · Red Squiggle Warning (Before You Run)</text>
  <text x="274" y="214" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#fca5a5">VS Code flags missing quotes around "ArrowRight"</text>
  <text x="274" y="228" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#fca5a5">and unclosed tags while you type.</text>

  <!-- Terminal / Console -->
  <rect x="246" y="248" width="332" height="88" fill="#0f172a" stroke="#334155"/>
  <text x="262" y="268" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">3 · TERMINAL / PROBLEMS · DevTools Console (F12)</text>
  <text x="262" y="288" font-family="JetBrains Mono, monospace" font-size="11" fill="#fca5a5">Uncaught ReferenceError: hreo is not defined</text>
  <text x="262" y="306" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#94a3b8">at index.html:14:9  ← Exact line clue!</text>
  <text x="262" y="324" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#38bdf8">Read the FIRST red line slowly; skip guessing.</text>

  <!-- Live Browser Preview panel -->
  <rect x="578" y="72" width="274" height="264" fill="#162032" stroke="#334155"/>
  <text x="594" y="96" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#a7f3d0">4 · LIVE BROWSER (localhost:5500)</text>
  <rect x="594" y="108" width="242" height="162" rx="10" fill="#101827" stroke="#475569"/>
  <text x="715" y="136" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#e2e8f0">Click here, then use ← and →</text>
  <text x="715" y="198" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="40">🛸</text>
  <rect x="594" y="282" width="242" height="42" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="606" y="300" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#a7f3d0">Right-click index.html → Open with</text>
  <text x="606" y="315" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#d1fae5">Live Server (Ctrl/⌘ + S reloads page)</text>

  <!-- Status bar -->
  <rect x="28" y="336" width="824" height="28" rx="6" fill="#007acc"/>
  <text x="44" y="354" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#fff">main*   |   0 Errors   |   Prettier: ✓</text>
  <text x="836" y="354" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" fill="#fff">Go Live :5500 ●</text>
</svg>
