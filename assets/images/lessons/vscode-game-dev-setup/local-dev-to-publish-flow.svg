<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img" aria-labelledby="vs-flow-title vs-flow-desc">
  <title id="vs-flow-title">The Four-Step Edit-Save-Test Loop and Bug Clue Checklist</title>
  <desc id="vs-flow-desc">Cycle diagram showing Change One Thing, Save with Ctrl+S or Cmd+S, Test in Live Browser, and Inspect Console Clues before shipping to GitHub Pages.</desc>
  <defs>
    <marker id="vs-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="880" height="350" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">The Habit That Prevents Lost Hours: Tight Edit → Save → Test Cycles</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Test every 5–10 lines instead of writing an entire file blind</text>

  <rect x="28" y="80" width="186" height="162" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="44" y="108" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="800" fill="#1d4ed8">STEP 1 · CHANGE</text>
  <text x="44" y="134" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e3a8a">Edit One Small Piece</text>
  <text x="44" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1e40af">Swap sprite speed or</text>
  <text x="44" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1e40af">add one key listener.</text>
  <text x="44" y="218" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#2563eb">1 change = 1 clue</text>

  <path d="M 214 160 L 238 160" stroke="#0284c7" stroke-width="2.2" marker-end="url(#vs-arr)"/>

  <rect x="242" y="80" width="186" height="162" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="258" y="108" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="800" fill="#047857">STEP 2 · SAVE</text>
  <text x="258" y="134" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="#064e3b">Write to Disk</text>
  <text x="258" y="158" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#065f46">Ctrl+S / ⌘+S</text>
  <text x="258" y="178" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#065f46">Check the white dot</text>
  <text x="258" y="196" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#065f46">on the file tab is gone!</text>

  <path d="M 428 160 L 452 160" stroke="#0284c7" stroke-width="2.2" marker-end="url(#vs-arr)"/>

  <rect x="456" y="80" width="186" height="162" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="472" y="108" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="800" fill="#b45309">STEP 3 · TEST</text>
  <text x="472" y="134" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="#78350f">Run on Live Server</text>
  <text x="472" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#92400e">Click canvas to focus.</text>
  <text x="472" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#92400e">Press controls &amp; watch</text>
  <text x="472" y="194" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#92400e">console (F12).</text>

  <path d="M 642 160 L 666 160" stroke="#0284c7" stroke-width="2.2" marker-end="url(#vs-arr)"/>

  <rect x="670" y="80" width="182" height="162" rx="14" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
  <text x="686" y="108" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="800" fill="#7e22ce">STEP 4 · DECIDE</text>
  <text x="686" y="134" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="#581c87">Keep or Inspect</text>
  <text x="686" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b21a8">Works? Commit or</text>
  <text x="686" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b21a8">move to next feature.</text>
  <text x="686" y="194" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b21a8">Broken? Read F12 clue.</text>

  <!-- Bottom backup / publish bar -->
  <rect x="28" y="262" width="824" height="64" rx="12" fill="#0f172a"/>
  <text x="48" y="288" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#38bdf8">Ready to Share Your Project?</text>
  <text x="48" y="309" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#cbd5e1">Local Folder (VS Code)  →  git add .  →  git commit -m "add level 1"  →  git push  →  GitHub Pages Live URL</text>
</svg>
