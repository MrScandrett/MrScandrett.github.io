<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <linearGradient id="clayBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7efe1"/>
      <stop offset="100%" stop-color="#ebdcc6"/>
    </linearGradient>
    <linearGradient id="reedGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4ba88"/>
      <stop offset="50%" stop-color="#bfa26c"/>
      <stop offset="100%" stop-color="#9d7f49"/>
    </linearGradient>
    <linearGradient id="wedgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1f14"/>
      <stop offset="100%" stop-color="#4d3b28"/>
    </linearGradient>
    <filter id="clayShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#432c11" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background tablet card -->
  <rect width="880" height="440" rx="16" fill="url(#clayBg)" stroke="#c2a47a" stroke-width="2"/>
  
  <!-- Header Banner -->
  <g transform="translate(30, 26)">
    <text font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#23465e">ANATOMY OF THE CUNEIFORM WEDGE &amp; REED STYLUS</text>
    <text y="22" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#65513e">Simplified teaching model of how a cut reed can press wedge-shaped marks into damp clay.</text>
  </g>

  <!-- Left Column: The Reed Stylus (gi-gur) -->
  <g transform="translate(30, 85)">
    <!-- Card box -->
    <rect width="250" height="320" rx="12" fill="#fdfaf3" stroke="#d5be9b" stroke-width="1.5" filter="url(#clayShadow)"/>
    <text x="125" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#302419">The Giant Reed Stylus</text>
    <text x="125" y="46" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#65513e">Cut reed tip · illustrative</text>

    <!-- Reed illustration -->
    <g transform="translate(85, 70)">
      <!-- Long stem -->
      <path d="M 10,0 L 40,0 L 40,160 L 10,160 Z" fill="url(#reedGrad)" stroke="#8c6f3c" stroke-width="1.5"/>
      <line x1="10" y1="50" x2="40" y2="50" stroke="#8c6f3c" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="10" y1="110" x2="40" y2="110" stroke="#8c6f3c" stroke-width="1" stroke-dasharray="2,2"/>
      <!-- Triangular beveled tip -->
      <polygon points="10,160 40,160 25,200" fill="#a4824d" stroke="#6e5127" stroke-width="1.5"/>
      <polygon points="10,160 25,200 15,190" fill="#caa96c"/>
      <!-- Highlight -->
      <line x1="14" y1="10" x2="14" y2="150" stroke="#f4e6c9" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Stylus Callouts -->
    <text x="125" y="290" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4d3b28">Beveled triangular cross-section</text>
    <text x="125" y="306" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#65513e">Reed species not specified</text>
  </g>

  <!-- Right Area: The 3 Fundamental Wedge Strokes -->
  <g transform="translate(300, 85)">
    <!-- Vertical Wedge (Diš) -->
    <g transform="translate(0, 0)">
      <rect width="170" height="320" rx="12" fill="#fdfaf3" stroke="#d5be9b" stroke-width="1.5" filter="url(#clayShadow)"/>
      <text x="85" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#23465e">1 · Vertical Wedge</text>
      <text x="85" y="44" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#65513e">diš · numeral "1"</text>
      
      <!-- Clay strike zone -->
      <rect x="20" y="60" width="130" height="150" rx="8" fill="#e9d9be" stroke="#c4ad8a"/>
      <!-- Vertical Wedge Shape -->
      <g transform="translate(85, 80)">
        <polygon points="0,0 -16,16 16,16" fill="url(#wedgeGrad)"/>
        <polygon points="-8,16 8,16 0,105" fill="url(#wedgeGrad)"/>
        <!-- Head / Tail highlight -->
        <circle cx="0" cy="8" r="3" fill="#ecd2a4" opacity="0.6"/>
      </g>
      
      <text x="85" y="235" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#302419">Downward Push</text>
      <text x="85" y="255" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#65513e">Tip held upright; angle</text>
      <text x="85" y="270" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#65513e">tilted forward to sink</text>
      <text x="85" y="285" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#65513e">the head; tail fades out.</text>
      <text x="85" y="305" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#23465e">Also personal name marker</text>
    </g>

    <!-- Horizontal Wedge (Aš / Išten) -->
    <g transform="translate(185, 0)">
      <rect width="170" height="320" rx="12" fill="#fdfaf3" stroke="#d5be9b" stroke-width="1.5" filter="url(#clayShadow)"/>
      <text x="85" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#23465e">2 · Horizontal Wedge</text>
      <text x="85" y="44" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#65513e">aš / išten · cross stroke</text>
      
      <!-- Clay strike zone -->
      <rect x="20" y="60" width="130" height="150" rx="8" fill="#e9d9be" stroke="#c4ad8a"/>
      <!-- Horizontal Wedge Shape -->
      <g transform="translate(40, 135)">
        <polygon points="0,0 16,-16 16,16" fill="url(#wedgeGrad)"/>
        <polygon points="16,-8 16,8 90,0" fill="url(#wedgeGrad)"/>
        <circle cx="8" cy="0" r="3" fill="#ecd2a4" opacity="0.6"/>
      </g>
      
      <text x="85" y="235" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#302419">Side-Edge Stroke</text>
      <text x="85" y="255" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#65513e">Stylus tilted 90° right;</text>
      <text x="85" y="270" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#65513e">left edge pressed deep,</text>
      <text x="85" y="285" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#65513e">shaft lifted rightward.</text>
      <text x="85" y="305" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#23465e">Used in crossbars &amp; vowels</text>
    </g>

    <!-- Corner Wedge / Winkelhaken (U) -->
    <g transform="translate(370, 0)">
      <rect width="180" height="320" rx="12" fill="#fdfaf3" stroke="#d5be9b" stroke-width="1.5" filter="url(#clayShadow)"/>
      <text x="90" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#23465e">3 · Angle Wedge</text>
      <text x="90" y="44" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#65513e">u / winkelhaken · "10"</text>
      
      <!-- Clay strike zone -->
      <rect x="25" y="60" width="130" height="150" rx="8" fill="#e9d9be" stroke="#c4ad8a"/>
      <!-- Winkelhaken Shape -->
      <g transform="translate(90, 115)">
        <polygon points="0,0 -26,-24 0,-14 26,-24" fill="url(#wedgeGrad)"/>
        <polygon points="-26,-24 0,-14 0,28" fill="url(#wedgeGrad)"/>
        <polygon points="26,-24 0,-14 0,28" fill="#3a2a1a"/>
        <circle cx="0" cy="-6" r="3" fill="#ecd2a4" opacity="0.6"/>
      </g>
      
      <text x="90" y="235" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#302419">Corner Notch Strike</text>
      <text x="90" y="255" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#65513e">Stylus corner driven into</text>
      <text x="90" y="270" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#65513e">clay at 45° angle, leaving</text>
      <text x="90" y="285" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#65513e">an arrowhead notch.</text>
      <text x="90" y="305" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#23465e">Signifies 10 in numbers</text>
    </g>
  </g>
</svg>
