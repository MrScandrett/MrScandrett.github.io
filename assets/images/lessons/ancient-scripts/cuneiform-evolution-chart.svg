<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="chartBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ec"/>
      <stop offset="100%" stop-color="#eee1cc"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#432c11" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="540" rx="16" fill="url(#chartBg)" stroke="#c2a47a" stroke-width="2"/>

  <!-- Title & Intro -->
  <g transform="translate(32, 28)">
    <text font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="21" fill="#23465e">SCHEMATIC EVOLUTION OF CUNEIFORM SIGNS</text>
    <text y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#65513e">Teaching sketches: stages and dates are approximate, not tracings of individual tablets.</text>
  </g>

  <!-- Epoch Headers (4 columns) -->
  <g transform="translate(180, 80)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="165" height="52" rx="8" fill="#e8d6bb" stroke="#c0a67e"/>
      <text x="82" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#23465e">1 · PICTOGRAPH</text>
      <text x="82" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a4530">c. 3200 BCE · Uruk IV</text>
    </g>
    <!-- Stage 2 -->
    <g transform="translate(180, 0)">
      <rect width="165" height="52" rx="8" fill="#e8d6bb" stroke="#c0a67e"/>
      <text x="82" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#23465e">2 · REORIENTED</text>
      <text x="82" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a4530">3rd millennium BCE</text>
    </g>
    <!-- Stage 3 -->
    <g transform="translate(360, 0)">
      <rect width="165" height="52" rx="8" fill="#e8d6bb" stroke="#c0a67e"/>
      <text x="82" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#23465e">3 · EARLY WEDGES</text>
      <text x="82" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a4530">3rd millennium BCE</text>
    </g>
    <!-- Stage 4 -->
    <g transform="translate(540, 0)">
      <rect width="165" height="52" rx="8" fill="#e8d6bb" stroke="#c0a67e"/>
      <text x="82" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#23465e">4 · ASSYRIAN / STANDARD</text>
      <text x="82" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a4530">c. 700 BCE · Nineveh</text>
    </g>
  </g>

  <!-- Row 1: SAG (Head) -->
  <g transform="translate(32, 145)">
    <!-- Label -->
    <rect width="135" height="80" rx="8" fill="#fdfbf7" stroke="#d5be9b" filter="url(#cardShadow)"/>
    <text x="67" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#302419">SAG</text>
    <text x="67" y="50" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#65513e">head / chief</text>
    <text x="67" y="66" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#23465e">Unicode: U+12295</text>

    <!-- Stage 1 (Head drawing profile) -->
    <g transform="translate(180, 0)">
      <rect width="165" height="80" rx="8" fill="#fdfbf7" stroke="#e0cbb2"/>
      <path d="M 70,20 C 95,20 105,35 105,48 C 105,58 95,68 85,68 C 82,75 75,76 65,76 L 65,58 C 55,58 50,45 50,38 C 50,26 60,20 70,20 Z" fill="none" stroke="#3a2717" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="82" cy="38" r="3" fill="#3a2717"/>
    </g>
    <!-- Stage 2 (Rotated 90 degrees) -->
    <g transform="translate(360, 0)">
      <rect width="165" height="80" rx="8" fill="#fdfbf7" stroke="#e0cbb2"/>
      <g transform="translate(82, 40) rotate(90)">
        <path d="M 0,-20 C 25,-20 35,-5 35,8 C 35,18 25,28 15,28 C 12,35 5,36 -5,36 L -5,18 C -15,18 -20,5 -20,-2 C -20,-14 -10,-20 0,-20 Z" fill="none" stroke="#3a2717" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="12" cy="-2" r="3" fill="#3a2717"/>
      </g>
    </g>
    <!-- Stage 3 (Early Wedges) -->
    <g transform="translate(540, 0)">
      <rect width="165" height="80" rx="8" fill="#fdfbf7" stroke="#e0cbb2"/>
      <!-- Wedges forming head boundary -->
      <polygon points="55,30 115,30 110,36 60,36" fill="#3a2717"/>
      <polygon points="55,36 61,36 61,65 55,65" fill="#3a2717"/>
      <polygon points="61,65 110,65 105,59 66,59" fill="#3a2717"/>
      <polygon points="110,36 116,36 116,65 110,65" fill="#3a2717"/>
      <polygon points="75,40 100,40 96,44 78,44" fill="#3a2717"/>
      <polygon points="75,50 100,50 96,54 78,54" fill="#3a2717"/>
    </g>
    <!-- Stage 4 (Assyrian 𒊕) -->
    <g transform="translate(720, 0)">
      <rect width="165" height="80" rx="8" fill="#fdfbf7" stroke="#e0cbb2"/>
      <text x="82" y="55" text-anchor="middle" font-family="'Cuneiform', serif" font-size="44" fill="#302419">𒊕</text>
    </g>
  </g>

  <!-- Row 2: ŠE (Barley / Grain) -->
  <g transform="translate(32, 240)">
    <!-- Label -->
    <rect width="135" height="80" rx="8" fill="#fdfbf7" stroke="#d5be9b" filter="url(#cardShadow)"/>
    <text x="67" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#302419">ŠE</text>
    <text x="67" y="50" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#65513e">barley / grain</text>
    <text x="67" y="66" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#23465e">Unicode: U+122BA</text>

    <!-- Stage 1 (Ear of barley) -->
    <g transform="translate(180, 0)">
      <rect width="165" height="80" rx="8" fill="#fdfbf7" stroke="#e0cbb2"/>
      <line x1="82" y1="18" x2="82" y2="68" stroke="#3a2717" stroke-width="2.5"/>
      <line x1="82" y1="28" x2="66" y2="20" stroke="#3a2717" stroke-width="2"/>
      <line x1="82" y1="28" x2="98" y2="20" stroke="#3a2717" stroke-width="2"/>
      <line x1="82" y1="40" x2="64" y2="32" stroke="#3a2717" stroke-width="2"/>
      <line x1="82" y1="40" x2="100" y2="32" stroke="#3a2717" stroke-width="2"/>
      <line x1="82" y1="52" x2="66" y2="44" stroke="#3a2717" stroke-width="2"/>
      <line x1="82" y1="52" x2="98" y2="44" stroke="#3a2717" stroke-width="2"/>
    </g>
    <!-- Stage 2 (Rotated 90 degrees) -->
    <g transform="translate(360, 0)">
      <rect width="165" height="80" rx="8" fill="#fdfbf7" stroke="#e0cbb2"/>
      <g transform="translate(82, 40) rotate(90)">
        <line x1="0" y1="-25" x2="0" y2="25" stroke="#3a2717" stroke-width="2.5"/>
        <line x1="0" y1="-15" x2="-16" y2="-23" stroke="#3a2717" stroke-width="2"/>
        <line x1="0" y1="-15" x2="16" y2="-23" stroke="#3a2717" stroke-width="2"/>
        <line x1="0" y1="-3" x2="-18" y2="-11" stroke="#3a2717" stroke-width="2"/>
        <line x1="0" y1="-3" x2="18" y2="-11" stroke="#3a2717" stroke-width="2"/>
        <line x1="0" y1="9" x2="-16" y2="1" stroke="#3a2717" stroke-width="2"/>
        <line x1="0" y1="9" x2="16" y2="1" stroke="#3a2717" stroke-width="2"/>
      </g>
    </g>
    <!-- Stage 3 (Early Wedges) -->
    <g transform="translate(540, 0)">
      <rect width="165" height="80" rx="8" fill="#fdfbf7" stroke="#e0cbb2"/>
      <polygon points="50,40 115,40 110,45 55,45" fill="#3a2717"/>
      <polygon points="70,30 85,38 72,42" fill="#3a2717"/>
      <polygon points="90,30 105,38 92,42" fill="#3a2717"/>
      <polygon points="70,52 85,44 72,40" fill="#3a2717"/>
      <polygon points="90,52 105,44 92,40" fill="#3a2717"/>
    </g>
    <!-- Stage 4 (Assyrian 𒊺) -->
    <g transform="translate(720, 0)">
      <rect width="165" height="80" rx="8" fill="#fdfbf7" stroke="#e0cbb2"/>
      <text x="82" y="55" text-anchor="middle" font-family="'Cuneiform', serif" font-size="44" fill="#302419">𒊺</text>
    </g>
  </g>

  <!-- Row 3: AN (Star / Sky / God) -->
  <g transform="translate(32, 335)">
    <!-- Label -->
    <rect width="135" height="80" rx="8" fill="#fdfbf7" stroke="#d5be9b" filter="url(#cardShadow)"/>
    <text x="67" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#302419">AN / DINGIR</text>
    <text x="67" y="50" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#65513e">sky / deity</text>
    <text x="67" y="66" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#23465e">Unicode: U+1202D</text>

    <!-- Stage 1 (8-pointed star) -->
    <g transform="translate(180, 0)">
      <rect width="165" height="80" rx="8" fill="#fdfbf7" stroke="#e0cbb2"/>
      <line x1="82" y1="18" x2="82" y2="62" stroke="#3a2717" stroke-width="2.5"/>
      <line x1="60" y1="40" x2="104" y2="40" stroke="#3a2717" stroke-width="2.5"/>
      <line x1="66" y1="24" x2="98" y2="56" stroke="#3a2717" stroke-width="2"/>
      <line x1="98" y1="24" x2="66" y2="56" stroke="#3a2717" stroke-width="2"/>
    </g>
    <!-- Stage 2 (Rotated 90 degrees - star is symmetric) -->
    <g transform="translate(360, 0)">
      <rect width="165" height="80" rx="8" fill="#fdfbf7" stroke="#e0cbb2"/>
      <g transform="translate(82, 40) rotate(45)">
        <line x1="0" y1="-22" x2="0" y2="22" stroke="#3a2717" stroke-width="2.5"/>
        <line x1="-22" y1="0" x2="22" y2="0" stroke="#3a2717" stroke-width="2.5"/>
        <line x1="-16" y1="-16" x2="16" y2="16" stroke="#3a2717" stroke-width="2"/>
        <line x1="16" y1="-16" x2="-16" y2="16" stroke="#3a2717" stroke-width="2"/>
      </g>
    </g>
    <!-- Stage 3 (Early Wedges forming rays) -->
    <g transform="translate(540, 0)">
      <rect width="165" height="80" rx="8" fill="#fdfbf7" stroke="#e0cbb2"/>
      <polygon points="56,40 108,40 104,44 60,44" fill="#3a2717"/>
      <polygon points="82,20 86,20 86,60 82,60" fill="#3a2717"/>
      <polygon points="68,26 96,54 93,57 65,29" fill="#3a2717"/>
      <polygon points="96,26 68,54 65,51 93,23" fill="#3a2717"/>
    </g>
    <!-- Stage 4 (Assyrian 𒀭) -->
    <g transform="translate(720, 0)">
      <rect width="165" height="80" rx="8" fill="#fdfbf7" stroke="#e0cbb2"/>
      <text x="82" y="55" text-anchor="middle" font-family="'Cuneiform', serif" font-size="44" fill="#302419">𒀭</text>
    </g>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(32, 435)">
    <rect width="853" height="75" rx="8" fill="#fdfaf3" stroke="#d5be9b"/>
    <text x="20" y="24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#23465e">THE TWO MATERIAL REVOLUTIONS OF MESOPOTAMIAN WRITING:</text>
    <text x="20" y="44" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4d3b28">1. <tspan font-weight="600">The 90° Turn (c. 2800 BCE):</tspan> Writing right-to-left in vertical columns caused scribes' hands to smudge wet clay. Turning signs 90° enabled clean left-to-right writing.</text>
    <text x="20" y="62" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4d3b28">2. <tspan font-weight="600">The Wedge Stylus (c. 2500 BCE):</tspan> Drawing lines dragged moist clay and made burrs. Stamping triangular reeds was faster, cleaner, and standardized the script.</text>
  </g>
</svg>
