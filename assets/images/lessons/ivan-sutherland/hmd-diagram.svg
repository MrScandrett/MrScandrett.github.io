<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">How the 1968 head-mounted display worked</title>
  <desc id="d">A person wears a headset hung from a ceiling arm. Small picture tubes beside each eye send computer-drawn lines through see-through optics, so a wireframe cube appears to float in the real room. The arm measures where the head points.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <!-- ceiling -->
  <rect x="40" y="24" width="520" height="18" fill="#cbd5e1"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="60" y1="24" x2="76" y2="42"/><line x1="100" y1="24" x2="116" y2="42"/><line x1="140" y1="24" x2="156" y2="42"/><line x1="180" y1="24" x2="196" y2="42"/><line x1="220" y1="24" x2="236" y2="42"/><line x1="260" y1="24" x2="276" y2="42"/><line x1="300" y1="24" x2="316" y2="42"/><line x1="340" y1="24" x2="356" y2="42"/><line x1="380" y1="24" x2="396" y2="42"/><line x1="420" y1="24" x2="436" y2="42"/><line x1="460" y1="24" x2="476" y2="42"/><line x1="500" y1="24" x2="516" y2="42"/>
  </g>
  <!-- tracker arm -->
  <rect x="268" y="42" width="44" height="20" rx="4" fill="#475569"/>
  <rect x="280" y="62" width="20" height="110" fill="#64748b"/>
  <rect x="284" y="150" width="12" height="70" fill="#334155"/>
  <circle cx="290" cy="226" r="9" fill="#0e7490"/>
  <path d="M290 226 L250 262" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <!-- head (profile, facing right) -->
  <path d="M190 300 C190 250 230 228 270 232 C320 236 344 270 344 306 C344 322 352 330 358 342 C362 350 356 356 348 356 L342 356 C344 372 340 384 330 388 C334 398 330 410 318 412 C306 414 296 420 292 440 L292 470 L210 470 L214 430 C196 410 190 360 190 300 Z" fill="#f1e4d8" stroke="#1f2937" stroke-width="3"/>
  <!-- headset band -->
  <path d="M196 290 C220 250 300 240 336 280" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <!-- CRT tube beside eye -->
  <g transform="translate(222 286) rotate(-8)">
    <rect x="0" y="0" width="92" height="30" rx="6" fill="#1e293b"/>
    <path d="M92 2 L118 -6 L118 36 L92 28 Z" fill="#334155"/>
  </g>
  <!-- half-silvered optic -->
  <line x1="352" y1="262" x2="388" y2="320" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="330" cy="300" r="5" fill="#1f2937"/>
  <!-- light paths -->
  <path d="M342 278 L368 290" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M368 290 L336 300" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M600 300 L372 296" stroke="#f59e0b" stroke-width="3" stroke-dasharray="2 6"/>
  <!-- virtual wireframe cube in the room -->
  <g fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round">
    <path d="M600 240 L700 240 L700 340 L600 340 Z"/>
    <path d="M640 210 L740 210 L740 310 L640 310 Z" stroke-dasharray="7 6"/>
    <path d="M600 240 L640 210 M700 240 L740 210 M700 340 L740 310 M600 340 L640 310"/>
  </g>
  <!-- floor -->
  <line x1="40" y1="500" x2="860" y2="500" stroke="#cbd5e1" stroke-width="4"/>
  <!-- labels -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#0f172a">
    <text x="330" y="88" font-size="19" font-weight="700">1. Ceiling arm tracks the head</text>
    <text x="330" y="112" font-size="16" fill="#334155">Sliding, turning joints measure where you</text>
    <text x="330" y="132" font-size="16" fill="#334155">look. Sutherland joked it was the</text>
    <text x="330" y="152" font-size="16" fill="#334155">"Sword of Damocles" hanging overhead.</text>
    <text x="48" y="372" font-size="19" font-weight="700">2. A tiny picture</text>
    <text x="48" y="394" font-size="19" font-weight="700">tube per eye</text>
    <text x="48" y="418" font-size="16" fill="#334155">Each eye gets its</text>
    <text x="48" y="438" font-size="16" fill="#334155">own view: 3D depth.</text>
    <text x="400" y="430" font-size="19" font-weight="700">3. See-through optics</text>
    <text x="400" y="454" font-size="16" fill="#334155">Glass that reflects the tube's lines and</text>
    <text x="400" y="474" font-size="16" fill="#334155">lets the real room through (augmented reality).</text>
    <text x="596" y="190" font-size="19" font-weight="700" fill="#15803d">4. A line-drawn cube</text>
    <text x="596" y="372" font-size="16" fill="#334155">Turn your head and the computer</text>
    <text x="596" y="392" font-size="16" fill="#334155">redraws it, so it seems to stay put.</text>
  </g>
</svg>
