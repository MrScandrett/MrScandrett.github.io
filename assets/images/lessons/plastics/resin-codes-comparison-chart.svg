<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="rcc-title">
  <title id="rcc-title">The Seven Resin Identification Codes Comparison</title>
  <rect width="880" height="310" rx="16" fill="#f8fafc"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">Resin Identification Codes (#1–#7): Density, Uses &amp; Recyclability</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#475569">The stamped triangle identifies polymer chemistry (not an automatic recycling guarantee).</text>

  <g transform="translate(24 76)" font-family="system-ui,sans-serif">
    <rect x="0" y="0" width="112" height="210" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="56" cy="30" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="56" y="36" text-anchor="middle" font-size="15" font-weight="900" fill="#166534">1</text>
    <text x="56" y="64" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">PET / PETE</text>
    <text x="56" y="88" text-anchor="middle" font-size="10" fill="#475569">ρ = 1.38 g/cm³</text>
    <text x="56" y="106" text-anchor="middle" font-size="10" fill="#0369a1">Sinks in water</text>
    <text x="56" y="138" text-anchor="middle" font-size="10" fill="#334155">Water bottles,</text><text x="56" y="152" text-anchor="middle" font-size="10" fill="#334155">fleece fiber</text>
    <text x="56" y="190" text-anchor="middle" font-size="10" font-weight="800" fill="#15803d">Widely Recycled</text>

    <rect x="120" y="0" width="112" height="210" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="176" cy="30" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="176" y="36" text-anchor="middle" font-size="15" font-weight="900" fill="#166534">2</text>
    <text x="176" y="64" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">HDPE</text>
    <text x="176" y="88" text-anchor="middle" font-size="10" fill="#475569">ρ = 0.95 g/cm³</text>
    <text x="176" y="106" text-anchor="middle" font-size="10" fill="#0284c7">Floats on water</text>
    <text x="176" y="138" text-anchor="middle" font-size="10" fill="#334155">Milk jugs,</text><text x="176" y="152" text-anchor="middle" font-size="10" fill="#334155">detergent tubs</text>
    <text x="176" y="190" text-anchor="middle" font-size="10" font-weight="800" fill="#15803d">Widely Recycled</text>

    <rect x="240" y="0" width="112" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    <circle cx="296" cy="30" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="296" y="36" text-anchor="middle" font-size="15" font-weight="900" fill="#334155">3</text>
    <text x="296" y="64" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">PVC</text>
    <text x="296" y="88" text-anchor="middle" font-size="10" fill="#475569">ρ = 1.38 g/cm³</text>
    <text x="296" y="106" text-anchor="middle" font-size="10" fill="#475569">Sinks (Cl⁻ chain)</text>
    <text x="296" y="138" text-anchor="middle" font-size="10" fill="#334155">Plumbing pipe,</text><text x="296" y="152" text-anchor="middle" font-size="10" fill="#334155">wire jackets</text>
    <text x="296" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">Rare Curbside</text>

    <rect x="360" y="0" width="112" height="210" rx="10" fill="#ffffff" stroke="#eab308" stroke-width="1.8"/>
    <circle cx="416" cy="30" r="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="416" y="36" text-anchor="middle" font-size="15" font-weight="900" fill="#854d0e">4</text>
    <text x="416" y="64" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">LDPE</text>
    <text x="416" y="88" text-anchor="middle" font-size="10" fill="#475569">ρ = 0.92 g/cm³</text>
    <text x="416" y="106" text-anchor="middle" font-size="10" fill="#0284c7">Floats (Branched)</text>
    <text x="416" y="138" text-anchor="middle" font-size="10" fill="#334155">Films, wraps,</text><text x="416" y="152" text-anchor="middle" font-size="10" fill="#334155">squeeze bottles</text>
    <text x="416" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#a16207">Drop-Off Film</text>

    <rect x="480" y="0" width="112" height="210" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
    <circle cx="536" cy="30" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="536" y="36" text-anchor="middle" font-size="15" font-weight="900" fill="#166534">5</text>
    <text x="536" y="64" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">PP</text>
    <text x="536" y="88" text-anchor="middle" font-size="10" fill="#475569">ρ = 0.90 g/cm³</text>
    <text x="536" y="106" text-anchor="middle" font-size="10" fill="#0284c7">Floats (Lightest)</text>
    <text x="536" y="138" text-anchor="middle" font-size="10" fill="#334155">Yogurt tubs,</text><text x="536" y="152" text-anchor="middle" font-size="10" fill="#334155">bottle caps</text>
    <text x="536" y="190" text-anchor="middle" font-size="10" font-weight="800" fill="#15803d">Often Recycled</text>

    <rect x="600" y="0" width="112" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    <circle cx="656" cy="30" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="656" y="36" text-anchor="middle" font-size="15" font-weight="900" fill="#991b1b">6</text>
    <text x="656" y="64" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">PS</text>
    <text x="656" y="88" text-anchor="middle" font-size="10" fill="#475569">ρ = 1.05 g/cm³</text>
    <text x="656" y="106" text-anchor="middle" font-size="10" fill="#475569">Rigid / Foam</text>
    <text x="656" y="138" text-anchor="middle" font-size="10" fill="#334155">Foam coolers,</text><text x="656" y="152" text-anchor="middle" font-size="10" fill="#334155">CD jewel cases</text>
    <text x="656" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">Seldom Recycled</text>

    <rect x="720" y="0" width="112" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    <circle cx="776" cy="30" r="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="776" y="36" text-anchor="middle" font-size="15" font-weight="900" fill="#5b21b6">7</text>
    <text x="776" y="64" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">OTHER</text>
    <text x="776" y="88" text-anchor="middle" font-size="10" fill="#475569">Mixed / Bio</text>
    <text x="776" y="106" text-anchor="middle" font-size="10" fill="#475569">PC · ABS · PLA</text>
    <text x="776" y="138" text-anchor="middle" font-size="10" fill="#334155">3D-print filament,</text><text x="776" y="152" text-anchor="middle" font-size="10" fill="#334155">safety goggles</text>
    <text x="776" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">Special Facilities</text>
  </g>
</svg>
