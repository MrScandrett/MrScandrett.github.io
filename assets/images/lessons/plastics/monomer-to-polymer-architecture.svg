<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="mpa-title">
  <title id="mpa-title">Monomers to Thermoplastics vs. Cross-Linked Thermosets</title>
  <rect width="880" height="340" rx="16" fill="#f8fafc"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">How Chain Architecture Shapes Plastic Behavior</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#475569">Identical small monomers assemble into slideable chains (thermoplastics) or locked 3D networks (thermosets).</text>

  <!-- 1. Monomer -->
  <g transform="translate(24 78)">
    <rect width="184" height="236" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="14" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#0369a1">1 · Monomer</text>
    <text x="14" y="44" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Ethylene (C₂H₄)</text>
    <circle cx="62" cy="112" r="14" fill="#334155"/><text x="62" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#ffffff">C</text>
    <circle cx="122" cy="112" r="14" fill="#334155"/><text x="122" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#ffffff">C</text>
    <line x1="76" y1="108" x2="108" y2="108" stroke="#0f172a" stroke-width="3"/>
    <line x1="76" y1="116" x2="108" y2="116" stroke="#0f172a" stroke-width="3"/>
    <text x="92" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">Double bond opens to</text>
    <text x="92" y="177" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">link thousands of repeat</text>
    <text x="92" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">units end-to-end.</text>
  </g>

  <!-- 2. Linear HDPE -->
  <g transform="translate(222 78)">
    <rect width="206" height="236" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="14" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#1e40af">2 · Linear (HDPE #2)</text>
    <text x="14" y="44" font-family="system-ui,sans-serif" font-size="11" fill="#1d4ed8">Tightly packed chains</text>
    <path d="M22,84 L184,84 M22,102 L184,102 M22,120 L184,120 M22,138 L184,138" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <text x="103" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Thermoplastic: Meltable</text>
    <text x="103" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">Stiff, dense milk jugs;</text>
    <text x="103" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">chains slide when heated.</text>
  </g>

  <!-- 3. Branched LDPE -->
  <g transform="translate(442 78)">
    <rect width="206" height="236" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="14" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#854d0e">3 · Branched (LDPE #4)</text>
    <text x="14" y="44" font-family="system-ui,sans-serif" font-size="11" fill="#a16207">Side branches push apart</text>
    <path d="M20,90 C60,72 130,104 186,86 M48,82 L56,64 M120,94 L132,72" fill="none" stroke="#ca8a04" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M20,132 C70,118 140,148 186,128 M76,128 L66,148 M148,136 L160,152" fill="none" stroke="#ca8a04" stroke-width="4.5" stroke-linecap="round"/>
    <text x="103" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#713f12">Thermoplastic: Flexible</text>
    <text x="103" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">Lower density grocery bags;</text>
    <text x="103" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">easily remolded by heat.</text>
  </g>

  <!-- 4. Cross-linked Thermoset -->
  <g transform="translate(662 78)">
    <rect width="194" height="236" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="14" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#991b1b">4 · Thermoset Network</text>
    <text x="14" y="44" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">Covalent cross-links</text>
    <path d="M24,84 L170,84 M24,116 L170,116 M24,148 L170,148" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="56" y1="84" x2="72" y2="116" stroke="#dc2626" stroke-width="3.5"/>
    <line x1="126" y1="84" x2="112" y2="116" stroke="#dc2626" stroke-width="3.5"/>
    <line x1="88" y1="116" x2="96" y2="148" stroke="#dc2626" stroke-width="3.5"/>
    <line x1="150" y1="116" x2="142" y2="148" stroke="#dc2626" stroke-width="3.5"/>
    <text x="97" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#7f1d1d">Never Melts (Chars)</text>
    <text x="97" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">Epoxies &amp; circuit boards;</text>
    <text x="97" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">cannot be melted flat.</text>
  </g>
</svg>
