<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title description">
<title id="title">Desk helper design study</title>
<desc id="description">An illustrated pencil helper combines an isometric view with top and side studies of opening fit and stability.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#d7e2df" stroke-width="1"/></pattern>
  <pattern id="fine" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0v8" fill="none" stroke="#e4ebe8" stroke-width=".8"/></pattern>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5d6a5"/><stop offset="1" stop-color="#dca16f"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c8805c"/><stop offset="1" stop-color="#a65f4d"/></linearGradient>
  <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#f4c38d"/><stop offset=".5" stop-color="#cf8d62"/><stop offset="1" stop-color="#a96651"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#206873"/></marker>
  <marker id="arrowBack" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto"><path d="M9 0L0 4.5 9 9z" fill="#206873"/></marker>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#264e54" flood-opacity=".2"/></filter>
</defs>
