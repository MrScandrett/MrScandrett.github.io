<rect width="1000" height="520" fill="#f7f5ee"/><path d="M0 0h1000v8H0z" fill="#1e5f69"/>
<text x="42" y="53" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#193f49">A pencil helper you can measure and test</text>
<text x="42" y="83" font-family="Arial,sans-serif" font-size="17" fill="#49636b">Illustrative dimensions only: measure your own item, then revise the base or opening after testing.</text>
<rect x="42" y="114" width="284" height="334" rx="16" fill="#fff" stroke="#bdd0cc" stroke-width="2"/><text x="60" y="148" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#215963">1  MEASURE THE ITEM</text><path d="M173 205v147" stroke="#e2b66c" stroke-width="16" stroke-linecap="round"/><path d="M165 209l8-20 8 20" fill="#555a55"/><path d="M155 257h35M155 284h35" stroke="#284e5b" stroke-width="2"/><path d="M192 265h58" stroke="#284e5b" stroke-width="2" marker-end="url(#arrow)"/><text x="77" y="405" font-family="Arial,sans-serif" font-size="15" fill="#294c54">Example pencil: 8 mm wide</text><path d="M338 282h36" stroke="#40647a" stroke-width="4" marker-end="url(#arrow)"/><rect x="378" y="114" width="284" height="334" rx="16" fill="#fff" stroke="#bdd0cc" stroke-width="2"/><text x="396" y="148" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#215963">2  PLAN THE HOLDER</text><rect x="429" y="205" width="190" height="141" rx="9" fill="#e8b689" stroke="#45646b" stroke-width="4"/><circle cx="525" cy="275" r="14" fill="#f7f5ee" stroke="#45646b" stroke-width="4"/><path d="M429 365h190m-190-11v21m190-21v21" stroke="#45646b" stroke-width="2"/><path d="M482 275h25m35 0h25" stroke="#2e7c83" stroke-width="3" marker-end="url(#arrow)"/><text x="433" y="395" font-family="Arial,sans-serif" font-size="15" fill="#294c54">Base 70 mm · opening 10 mm</text><path d="M674 282h36" stroke="#40647a" stroke-width="4" marker-end="url(#arrow)"/><rect x="716" y="114" width="284" height="334" rx="16" fill="#fff" stroke="#bdd0cc" stroke-width="2"/><text x="734" y="148" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#215963">3  TEST AND REVISE</text><path d="M756 347l84-40 97 38-85 42z" fill="#e8b689" stroke="#45646b" stroke-width="3"/><path d="M756 347v19l96 43v-22zM852 387l85-42v20l-85 44z" fill="#c98a68" stroke="#45646b" stroke-width="3"/><path d="M807 300v42q24 11 48 0v-42" fill="#d39a71" stroke="#45646b" stroke-width="3"/><ellipse cx="831" cy="300" rx="24" ry="11" fill="#f5d7ad" stroke="#45646b" stroke-width="3"/><ellipse cx="831" cy="300" rx="11" ry="5" fill="#f7f5ee"/><path d="M831 299V211" stroke="#d2a25f" stroke-width="13" stroke-linecap="round"/><path d="M824 211l7-18 7 18" fill="#555a55"/><path d="M923 277q-14-25-35-25" fill="none" stroke="#bd4d4e" stroke-width="3" marker-end="url(#arrow)"/><text x="740" y="437" font-family="Arial,sans-serif" font-size="15" fill="#294c54">Nudge it. Does it tip?</text>
<text x="955" y="500" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#587078">ClassroomOS · original teaching diagram</text></svg>