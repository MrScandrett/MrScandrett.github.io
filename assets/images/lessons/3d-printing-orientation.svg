<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">The same L-shaped bracket in two orientations</title>
  <desc id="desc">At left, a bracket stands on a narrow edge with a long overhang that may need support. At right, the same bracket is rotated 180 degrees, so a broad face rests on the build plate and the vertical arm rises from it.</desc>
  <defs>
    <pattern id="support" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#55afc3" stroke-width="2"/></pattern>
  </defs>
  <rect width="1000" height="430" rx="28" fill="#fff9f4"/>
  <text x="44" y="47" fill="#283745" font-family="system-ui,sans-serif" font-size="25" font-weight="800">One bracket, two build-plate choices</text>
  <text x="44" y="83" fill="#455565" font-family="system-ui,sans-serif" font-size="17">Rotate the model; keep the printer profile the same when comparing.</text>
  <rect x="42" y="105" width="438" height="280" rx="18" fill="#fff" stroke="#e4c9b8" stroke-width="2"/>
  <rect x="520" y="105" width="438" height="280" rx="18" fill="#fff" stroke="#e4c9b8" stroke-width="2"/>
  <text x="65" y="140" fill="#7f320e" font-family="system-ui,sans-serif" font-size="21" font-weight="800">A · Narrow contact</text>
  <text x="543" y="140" fill="#245744" font-family="system-ui,sans-serif" font-size="21" font-weight="800">B · Broad contact</text>
  <line x1="62" y1="324" x2="462" y2="324" stroke="#455565" stroke-width="8" stroke-linecap="round"/>
  <line x1="540" y1="324" x2="940" y2="324" stroke="#455565" stroke-width="8" stroke-linecap="round"/>
  <path d="M112 183H364V237H175V324H112Z" fill="#f28b51" stroke="#8a3b13" stroke-width="3"/>
  <path d="M175 237H364V324H175Z" fill="url(#support)" stroke="#55afc3" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M830 324H578V270H767V183H830Z" fill="#f28b51" stroke="#8a3b13" stroke-width="3"/>
  <path d="M112 340H175" stroke="#b83e12" stroke-width="5"/>
  <path d="M578 340H830" stroke="#268267" stroke-width="5"/>
  <text x="65" y="367" fill="#344a58" font-family="system-ui,sans-serif" font-size="17">Hatched area: support may be needed</text>
  <text x="543" y="367" fill="#344a58" font-family="system-ui,sans-serif" font-size="17">Flat base: inspect first-layer contact</text>
  <text x="300" y="411" fill="#5c6870" font-family="system-ui,sans-serif" font-size="14">Schematic only · actual supports, strength, time and material depend on the sliced model and printer profile</text>
</svg>
