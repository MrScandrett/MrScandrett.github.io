<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="s16x-title">
  <title id="s16x-title">Water Expansion Factor (1600x) and Watt Condenser Breakthrough</title>
  <rect width="880" height="320" rx="16" fill="#0f172a"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#f8fafc">The Chemistry Behind Steam Power: Phase Change Expansion (~1,600×)</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#94a3b8">Breaking hydrogen bonds turns compact liquid H₂O into ~1,600× volume steam — creating force to push a piston.</text>

  <!-- Left: 1 mL Liquid -> 1600 mL Steam -->
  <g transform="translate(26 78)" font-family="system-ui,sans-serif">
    <rect width="402" height="218" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="800" fill="#7dd3fc">Phase Volume Jump at 100 °C</text>

    <rect x="44" y="132" width="38" height="38" rx="4" fill="#0284c7" stroke="#bae6fd" stroke-width="2"/>
    <text x="63" y="190" text-anchor="middle" font-size="11" font-weight="800" fill="#e2e8f0">1 mL Liquid</text>

    <line x1="100" y1="150" x2="152" y2="150" stroke="#f97316" stroke-width="3"/>
    <polygon points="159,150 148,144 148,156" fill="#f97316"/>
    <text x="128" y="138" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fbbf24">+ Heat</text>

    <rect x="174" y="54" width="196" height="122" rx="10" fill="#e0f2fe" fill-opacity="0.12" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="212" cy="86" r="4" fill="#bae6fd"/><circle cx="256" cy="72" r="4" fill="#bae6fd"/>
    <circle cx="308" cy="102" r="4" fill="#bae6fd"/><circle cx="344" cy="78" r="4" fill="#bae6fd"/>
    <circle cx="232" cy="126" r="4" fill="#bae6fd"/><circle cx="286" cy="144" r="4" fill="#bae6fd"/>
    <circle cx="332" cy="152" r="4" fill="#bae6fd"/><circle cx="198" cy="154" r="4" fill="#bae6fd"/>
    <text x="272" y="118" text-anchor="middle" font-size="15" font-weight="900" fill="#fde047">~1,600 mL Steam</text>
    <text x="272" y="198" text-anchor="middle" font-size="11" fill="#cbd5e1">Rapid gas expansion pushes piston upward</text>
  </g>

  <!-- Right: Newcomen vs Watt Separate Condenser -->
  <g transform="translate(452 78)" font-family="system-ui,sans-serif">
    <rect width="402" height="218" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="800" fill="#fbbf24">Watt's Separate Condenser (~4× Less Coal)</text>

    <rect x="26" y="48" width="166" height="114" rx="8" fill="#0b1120" stroke="#475569"/>
    <text x="109" y="70" text-anchor="middle" font-size="11.5" font-weight="800" fill="#fca5a5">Newcomen (1712)</text>
    <text x="109" y="92" text-anchor="middle" font-size="10.5" fill="#cbd5e1">Heated &amp; sprayed cold</text>
    <text x="109" y="108" text-anchor="middle" font-size="10.5" fill="#cbd5e1">water inside ONE cylinder.</text>
    <text x="109" y="136" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f87171">~75% fuel wasted reheating</text>

    <rect x="208" y="48" width="170" height="114" rx="8" fill="#064e3b" fill-opacity="0.45" stroke="#22c55e" stroke-width="1.8"/>
    <text x="293" y="70" text-anchor="middle" font-size="11.5" font-weight="800" fill="#86efac">James Watt (1769)</text>
    <text x="293" y="92" text-anchor="middle" font-size="10.5" fill="#e2e8f0">Power cylinder stays hot;</text>
    <text x="293" y="108" text-anchor="middle" font-size="10.5" fill="#e2e8f0">2nd vessel stays cold.</text>
    <text x="293" y="136" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4ade80">Vacuum collapse stays crisp</text>

    <text x="201" y="194" text-anchor="middle" font-size="11" fill="#fde68a">Controlling heat transfer &amp; condensation powered industry</text>
  </g>
</svg>
