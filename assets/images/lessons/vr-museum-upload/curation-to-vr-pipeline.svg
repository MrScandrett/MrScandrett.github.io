<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="vrm-pipe-title vrm-pipe-desc">
  <title id="vrm-pipe-title">From Student Research Proposal to VR-Ready Classroom Artifact</title>
  <desc id="vrm-pipe-desc">Five-step curation workflow moving from primary provenance research and open-license check through 3D GLB optimization, teacher review, and deployment inside VR and desktop lessons.</desc>
  <defs>
    <marker id="vrm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="880" height="370" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">How Student Curation Becomes a Permanent VR Learning Object</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Accuracy, copyright clarity, and VR performance matter just as much as how cool the model looks</text>

  <rect x="28" y="82" width="150" height="190" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="42" y="108" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" fill="#4338ca">1 · RESEARCH</text>
  <text x="42" y="130" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e1b4b">Provenance</text>
  <text x="42" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#312e81">What object or specimen</text>
  <text x="42" y="170" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#312e81">is this, who made it, &amp;</text>
  <text x="42" y="186" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#312e81">when does it date from?</text>
  <text x="42" y="250" font-family="JetBrains Mono, monospace" font-size="10" fill="#4f46e5">Museum / NASA / archive</text>

  <path d="M 178 176 L 194 176" stroke="#6366f1" stroke-width="2" marker-end="url(#vrm-arr)"/>

  <rect x="198" y="82" width="150" height="190" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="212" y="108" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" fill="#047857">2 · RIGHTS</text>
  <text x="212" y="130" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#064e3b">Open License</text>
  <text x="212" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">Verify Public Domain,</text>
  <text x="212" y="170" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">CC0, or CC BY(-SA)</text>
  <text x="212" y="186" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">+ record exact URL &amp; credit.</text>
  <text x="212" y="250" font-family="JetBrains Mono, monospace" font-size="10" fill="#059669">Zero unverified steals</text>

  <path d="M 348 176 L 364 176" stroke="#6366f1" stroke-width="2" marker-end="url(#vrm-arr)"/>

  <rect x="368" y="82" width="150" height="190" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="382" y="108" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" fill="#b45309">3 · INSPECT</text>
  <text x="382" y="130" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#78350f">GLB Metrics</text>
  <text x="382" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">Check triangle budget,</text>
  <text x="382" y="170" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">Y-up origin, 1m scale,</text>
  <text x="382" y="186" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">&amp; file size &lt; 50 MB.</text>
  <text x="382" y="250" font-family="JetBrains Mono, monospace" font-size="10" fill="#d97706">Test in inspector ↑</text>

  <path d="M 518 176 L 534 176" stroke="#6366f1" stroke-width="2" marker-end="url(#vrm-arr)"/>

  <rect x="538" y="82" width="150" height="190" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="552" y="108" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" fill="#0369a1">4 · CONTEXT</text>
  <text x="552" y="130" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0c4a6e">Teaching Card</text>
  <text x="552" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#075985">Write plain-language</text>
  <text x="552" y="170" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#075985">notes telling classmates</text>
  <text x="552" y="186" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#075985">what to notice &amp; ask.</text>
  <text x="552" y="250" font-family="JetBrains Mono, monospace" font-size="10" fill="#0284c7">Links to exact lesson</text>

  <path d="M 688 176 L 704 176" stroke="#6366f1" stroke-width="2" marker-end="url(#vrm-arr)"/>

  <rect x="708" y="82" width="144" height="190" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.8"/>
  <text x="722" y="108" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" fill="#c084fc">5 · PUBLISH</text>
  <text x="722" y="130" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8fafc">Live Everywhere</text>
  <text x="722" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Teacher optimizes asset</text>
  <text x="722" y="170" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">into Quest VR, mobile,</text>
  <text x="722" y="186" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">&amp; ClassroomOS pages.</text>
  <text x="722" y="250" font-family="JetBrains Mono, monospace" font-size="10" fill="#a7f3d0">Credit preserved ✓</text>

  <!-- Bottom note -->
  <rect x="28" y="290" width="824" height="58" rx="12" fill="#0f172a"/>
  <text x="48" y="314" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#c084fc">Curator Rule: An Unexplained Model Isn’t an Exhibit Yet</text>
  <text x="48" y="333" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Every proposal needs BOTH clean media metadata (source, author, license, GLB units) AND a student-written teaching explanation.</text>
</svg>
