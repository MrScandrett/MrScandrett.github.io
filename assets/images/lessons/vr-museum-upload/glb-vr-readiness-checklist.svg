<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="vrm-spec-title vrm-spec-desc">
  <title id="vrm-spec-title">VR-Ready GLB Artifact Technical Standards: 1m Scale, Origin Pivot, and Triangle Budget</title>
  <desc id="vrm-spec-desc">Diagram showing human-scale 1-meter GLB units beside a 1.7m visitor, Y-up coordinate axes, pedestal base origin (0,0,0), under 50 MB package cap, and clean PBR material setup.</desc>
  <rect width="880" height="370" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Technical Standards: What Makes a 3D GLB File VR-Ready?</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Real-time headsets render 90 frames per second per eye — clean scale, origin pivots, and tight budgets keep exhibits smooth</text>

  <!-- Left: Human Scale & Axis Blueprint -->
  <rect x="28" y="76" width="414" height="270" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.8"/>
  <text x="48" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8fafc">Real-World Scale (1 Unit = 1 Meter · Y-Up)</text>

  <!-- Floor plane grid -->
  <line x1="56" y1="296" x2="414" y2="296" stroke="#64748b" stroke-width="2.5"/>
  <!-- Visitor 1.7m -->
  <circle cx="122" cy="158" r="16" fill="#38bdf8"/>
  <rect x="106" y="178" width="32" height="62" rx="10" fill="#38bdf8"/>
  <rect x="108" y="242" width="12" height="54" rx="4" fill="#0284c7"/>
  <rect x="124" y="242" width="12" height="54" rx="4" fill="#0284c7"/>
  <text x="122" y="316" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#7dd3fc">VR Visitor (~1.7 m)</text>

  <!-- Pedestal + Artifact -->
  <rect x="242" y="216" width="84" height="80" rx="4" fill="#334155" stroke="#64748b"/>
  <polygon points="284,136 322,208 246,208" fill="#a855f7" stroke="#f3e8ff" stroke-width="2"/>
  <!-- Pivot origin dot -->
  <circle cx="284" cy="216" r="6" fill="#fbbf24" stroke="#fff" stroke-width="1.5"/>
  <text x="336" y="220" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#fbbf24">Pivot (0,0,0) at base!</text>

  <!-- Y axis & Height arrows -->
  <line x1="204" y1="296" x2="204" y2="144" stroke="#22c55e" stroke-width="2"/>
  <polygon points="204,136 199,146 209,146" fill="#22c55e"/>
  <text x="196" y="148" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#4ade80">+Y Up</text>
  <line x1="204" y1="296" x2="246" y2="296" stroke="#ef4444" stroke-width="2.5"/>
  <text x="284" y="316" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#e2e8f0">Correct waist/eye scale</text>

  <!-- Right: 4 Requirement Cards -->
  <rect x="460" y="76" width="392" height="60" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="476" y="99" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#064e3b">1 · Binary GLB Packaging (.glb, Not Loose Folder)</text>
  <text x="476" y="119" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">Bundles geometry, normals, and textures in a single portable file &lt; 50 MB.</text>

  <rect x="460" y="146" width="392" height="60" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="476" y="169" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e1b4b">2 · Poly Count Target (~10k–80k Triangles)</text>
  <text x="476" y="189" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#312e81">Multi-million-triangle raw laser scans drop mobile VR below comfortable 90 Hz.</text>

  <rect x="460" y="216" width="392" height="60" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="476" y="239" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#78350f">3 · Clean Base Pivot &amp; Facing Direction</text>
  <text x="476" y="259" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#92400e">Place bottom center at (0, 0, 0) so exhibits sit cleanly on gallery pedestals.</text>

  <rect x="460" y="286" width="392" height="60" rx="11" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="476" y="309" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#0c4a6e">4 · Right-Sized PBR Textures (1K–2K max)</text>
  <text x="476" y="329" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#075985">Base color, roughness, and normal maps hold crisp detail without stalling downloads.</text>
</svg>
