<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#1f2937">
<rect x="20" y="250" width="440" height="16" rx="3" fill="#4b5563"/><rect x="20" y="250" width="440" height="3" fill="#9ca3af"/>
<path d="M70 210 Q 80 236 120 240 L 360 240 Q 400 236 410 210 L 410 180 Q 404 200 380 204 L 100 204 Q 76 200 70 180 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<line x1="110" y1="212" x2="370" y2="212" stroke="#d97706" stroke-width="1"/><line x1="110" y1="220" x2="370" y2="220" stroke="#d97706" stroke-width="1"/><line x1="110" y1="228" x2="370" y2="228" stroke="#d97706" stroke-width="1"/>
<line x1="200" y1="170" x2="120" y2="170" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><line x1="280" y1="170" x2="360" y2="170" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="240" y="160" text-anchor="middle"  font-weight="600" font-size="15">cooling plastic shrinks</text>
