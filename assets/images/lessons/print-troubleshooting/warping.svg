<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t">
<title id="t">Warping: the corners of a long flat print curl up off the build plate as the plastic cools and shrinks</title>
<defs>
