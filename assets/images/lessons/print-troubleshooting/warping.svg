<text x="30" y="110"  fill="#b91c1c" font-weight="600" font-size="15">corner lifts</text>
<text x="450" y="110" text-anchor="end" fill="#b91c1c" font-weight="600" font-size="15">corner lifts</text>
<path d="M70 247 L 120 247" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
<text x="240" y="283" text-anchor="middle" fill="#4b5563" font-weight="500" font-size="13">Air under the corners: the bottom is no longer flat</text>
