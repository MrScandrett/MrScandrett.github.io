<text x="440" y="212"  fill="#1d4ed8" font-weight="700" font-size="15">1 First layers</text>
<text x="440" y="228"   font-weight="500" font-size="15">not sticking,</text>
<text x="440" y="243"   font-weight="500" font-size="12">warping, elephant's foot</text>
<text x="440" y="118"  fill="#6d28d9" font-weight="700" font-size="15">2 Partway up</text>
<text x="440" y="134"   font-weight="500" font-size="12">spaghetti, layer shift,</text>
