<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t">
<title id="t">Clogged nozzle: a blockage inside the nozzle stops the plastic, so the printed line gets thin and then stops while the nozzle keeps moving</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#e5e7eb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6b7280" stroke-width="2"/></pattern>
<pattern id="hatchbad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fecaca"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b91c1c" stroke-width="2"/></pattern>
</defs>
<rect width="480" height="300" fill="#f3f5f8"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#1f2937">
<rect x="20" y="250" width="440" height="16" rx="3" fill="#4b5563"/><rect x="20" y="250" width="440" height="3" fill="#9ca3af"/>
<g transform="translate(150 70)">
<rect x="-6" y="-60" width="12" height="80" fill="#f59e0b" stroke="#b45309"/>
<rect x="-40" y="20" width="80" height="50" rx="5" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
<rect x="-6" y="20" width="12" height="40" fill="#f59e0b"/>
<path d="M-26 70 L 26 70 L 10 104 L -10 104 Z" fill="#d4a017" stroke="#7c5e10" stroke-width="1.5"/>
<path d="M-6 60 L 6 60 L 4 96 L -4 96 Z" fill="#3f3f46"/>
<text x="36" y="96"   font-weight="600" font-size="15"></text>
</g>
<line x1="250" y1="150" x2="160" y2="150" stroke="#b91c1c" stroke-width="2" marker-end="url(#arb)"/>
<text x="256" y="146"  fill="#b91c1c" font-weight="600" font-size="14">blockage</text><text x="256" y="162"   font-weight="600" font-size="12">(burnt plastic, dust)</text>
<path d="M40 246 L 120 246" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
<path d="M120 246 L 190 246" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
<path d="M190 246 L 230 246" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="300" y1="210" x2="236" y2="242" stroke="#b91c1c" stroke-width="2" marker-end="url(#arb)"/>
<text x="306" y="205"  fill="#b91c1c" font-weight="600" font-size="13">line thins, then stops</text>
<text x="306" y="50"   font-weight="600" font-size="13">extruder may click</text><text x="306" y="66"   font-weight="600" font-size="13">or grind the filament</text>
<text x="240" y="283" text-anchor="middle" fill="#4b5563" font-weight="500" font-size="13">Teacher job: never poke a hot nozzle</text>
<text x="472" y="297" font-size="9.5" fill="#4b5563" text-anchor="end">Original ClassroomOS teaching diagram</text>
</g></svg>
