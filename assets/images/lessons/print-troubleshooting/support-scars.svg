<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t">
<title id="t">Support scars: after supports are removed, the surface they touched is rough, pitted and has leftover bits of support</title>
