<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ls-title ls-desc">
  <title id="ls-title">Optics of Light and Shadows: Umbra, Penumbra, and Diffraction</title>
  <desc id="ls-desc">Diagram showing how an extended light source creates an umbra (total shadow) and penumbra (partial shadow) behind an opaque obstacle, with a wave diffraction inset showing wave fronts bending around an edge.</desc>
  <defs>
    <radialGradient id="bulb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere-shade" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="penumbra-grad-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="penumbra-grad-bot" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="screen-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="28%" stop-color="#94a3b8"/>
      <stop offset="38%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="62%" stop-color="#1e293b"/>
      <stop offset="72%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#080e1a"/>
  
  <!-- Subtle coordinate grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <path d="M0 60h960M0 120h960M0 180h960M0 240h960M0 300h960M0 360h960M0 420h960M0 480h960"/>
    <path d="M60 0v540M120 0v540M180 0v540M240 0v540M300 0v540M360 0v540M420 0v540M480 0v540M540 0v540M600 0v540M660 0v540M720 0v540M780 0v540M840 0v540M900 0v540"/>
  </g>

  <!-- Header -->
  <text x="40" y="44" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">GEOMETRIC RAY OPTICS &amp; WAVE SHADOW FORMATION</text>
  <text x="40" y="68" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Extended light sources produce dual shadow regions: total blockage (umbra) and partial blockage (penumbra).</text>

  <!-- Main Optical Bench (y-center = 260) -->
  <!-- Penumbra volumes -->
  <!-- Top penumbra wedge: between outer top ray and inner bottom ray -->
  <polygon points="120,180 370,195 720,135 720,205 370,225" fill="url(#penumbra-grad-top)"/>
  <!-- Bottom penumbra wedge: between outer bottom ray and inner top ray -->
  <polygon points="120,340 370,325 720,385 720,315 370,295" fill="url(#penumbra-grad-bot)"/>

  <!-- Umbra core wedge: behind obstacle to apex at (620, 260) or extending to screen -->
  <polygon points="370,205 720,225 720,295 370,315" fill="#020617" opacity="0.95"/>
  <polygon points="370,205 600,260 370,315" fill="#000000"/>

  <!-- Light Rays -->
  <!-- Exterior tangents (defining outer edge of penumbra) -->
  <line x1="120" y1="180" x2="720" y2="135" stroke="#fde047" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.85"/>
  <line x1="120" y1="340" x2="720" y2="385" stroke="#fde047" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.85"/>

  <!-- Interior crossing tangents (defining umbra boundary) -->
  <line x1="120" y1="180" x2="720" y2="315" stroke="#f59e0b" stroke-width="2" opacity="0.9"/>
  <line x1="120" y1="340" x2="720" y2="205" stroke="#f59e0b" stroke-width="2" opacity="0.9"/>

  <!-- Center optical axis -->
  <line x1="60" y1="260" x2="760" y2="260" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- Extended Light Source (Lamp / Star) -->
  <g transform="translate(120, 260)">
    <circle cx="0" cy="0" r="95" fill="url(#bulb-glow)"/>
    <circle cx="0" cy="0" r="80" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="0" cy="0" r="74" fill="#fef9c3"/>
    <!-- Top and bottom emitting source points -->
    <circle cx="0" cy="-80" r="4.5" fill="#ea580c"/>
    <circle cx="0" cy="80" r="4.5" fill="#ea580c"/>
    <text x="0" y="5" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#854d0e" text-anchor="middle">Extended</text>
    <text x="0" y="24" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#854d0e" text-anchor="middle">Light Source</text>
    <text x="0" y="110" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fde047" text-anchor="middle">Diameter D₁</text>
  </g>

  <!-- Opaque Obstacle (Sphere / Planet / Moon) -->
  <g transform="translate(370, 260)">
    <circle cx="0" cy="0" r="55" fill="url(#sphere-shade)" stroke="#94a3b8" stroke-width="2.5"/>
    <!-- Crescent illumination highlight -->
    <path d="M-54,0 A54,54 0 0,1 0,-54 A38,54 0 0,0 0,54 A54,54 0 0,1 -54,0" fill="#fef08a" opacity="0.5"/>
    <text x="0" y="78" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle">Opaque Obstacle</text>
    <text x="0" y="96" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">(Diameter D₂ &lt; D₁)</text>
  </g>

  <!-- Projection Screen (Detector plane) -->
  <g transform="translate(720, 100)">
    <!-- Screen physical bar -->
    <rect x="0" y="20" width="12" height="300" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <!-- Projected shadow intensity gradient on screen face -->
    <rect x="-8" y="20" width="8" height="300" fill="url(#screen-shadow)" rx="2"/>
    <text x="22" y="38" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Projection Screen</text>
    <text x="22" y="56" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Observed illumination pattern</text>
  </g>

  <!-- Zone Annotations & Brackets on Screen -->
  <!-- Top Penumbra bracket -->
  <path d="M740,135 h14 v70 h-14" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="764" y="174" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">PENUMBRA</text>
  <text x="764" y="190" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">Partial shadow: source partially visible</text>

  <!-- Umbra core bracket -->
  <path d="M740,205 h14 v110 h-14" fill="none" stroke="#f43f5e" stroke-width="2"/>
  <text x="764" y="255" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#f43f5e">UMBRA</text>
  <text x="764" y="272" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#fecdd3">Total shadow: all direct light blocked</text>

  <!-- Bottom Penumbra bracket -->
  <path d="M740,315 h14 v70 h-14" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="764" y="354" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">PENUMBRA</text>
  <text x="764" y="370" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">Gradual transition to full light</text>

  <!-- Bottom Educational Callouts Box -->
  <rect x="40" y="440" width="880" height="76" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <g transform="translate(60, 456)" font-family="Inter, system-ui, sans-serif">
    <!-- Point 1 -->
    <text x="0" y="18" font-size="12" font-weight="700" fill="#fde047">POINT SOURCE</text>
    <text x="0" y="36" font-size="11.5" font-weight="400" fill="#cbd5e1">Creates razor-sharp shadows: 100% umbra, zero penumbra.</text>

    <!-- Point 2 -->
    <text x="290" y="18" font-size="12" font-weight="700" fill="#38bdf8">EXTENDED SOURCE (SUN)</text>
    <text x="290" y="36" font-size="11.5" font-weight="400" fill="#cbd5e1">Creates soft, fuzzy boundaries. Eclipses: total in umbra, partial in penumbra.</text>

    <!-- Point 3 -->
    <text x="610" y="18" font-size="12" font-weight="700" fill="#a78bfa">WAVE NATURE (DIFFRACTION)</text>
    <text x="610" y="36" font-size="11.5" font-weight="400" fill="#cbd5e1">At microscopic scale, light waves bend around edges, creating faint interference rings.</text>
  </g>
</svg>

