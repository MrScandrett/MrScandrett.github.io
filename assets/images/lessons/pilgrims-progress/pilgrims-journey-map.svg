<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="pp-map-title pp-map-desc">
  <title id="pp-map-title">Allegorical Journey Map of The Pilgrim's Progress (Part One)</title>
  <desc id="pp-map-desc">Illustrated winding route map of John Bunyan's Part One showing twelve reading sessions from the City of Destruction through the Slough of Despond, Wicket Gate, Interpreter's House, the Cross, Palace Beautiful, Two Valleys, Vanity Fair, Doubting Castle, Delectable Mountains, and the River to the Celestial City.</desc>
  <defs>
    <marker id="pp-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2f5d1f" />
    </marker>
  </defs>
  <rect width="860" height="360" rx="16" fill="#f8fcf5" stroke="#85a676" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#2f5d1f" />
  <text x="38" y="40" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fef3c7">PART ONE ROUTE MAP · TWELVE READING SESSIONS ALONG THE NARROW WAY</text>

  <!-- Winding Road Path (Row 1 left->right, Row 2 right->left, Row 3 left->right) -->
  <path d="M 85 112 L 755 112 C 805 112, 805 198, 755 198 L 105 198 C 55 198, 55 286, 105 286 L 765 286" fill="none" stroke="#c8dec0" stroke-width="18" stroke-linecap="round" />
  <path d="M 85 112 L 755 112 C 805 112, 805 198, 755 198 L 105 198 C 55 198, 55 286, 105 286 L 765 286" fill="none" stroke="#2f5d1f" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#pp-arrow)" />

  <!-- Row 1 Stops (Sessions 1-4) -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="30" y="78" width="150" height="58" rx="10" fill="#ffffff" stroke="#a3322a" stroke-width="2" />
    <text x="105" y="99" font-size="10.5" font-weight="800" fill="#a3322a">01 · DESTRUCTION</text>
    <text x="105" y="115" font-size="11" font-weight="700" fill="#1f2a1c">City &amp; Slough</text>
    <text x="105" y="129" font-size="9.5" fill="#4a5a45">Burden · Pliable turns</text>

    <rect x="218" y="78" width="164" height="58" rx="10" fill="#ffffff" stroke="#2f5d1f" stroke-width="1.8" />
    <text x="300" y="99" font-size="10.5" font-weight="800" fill="#2f5d1f">02 · WICKET GATE</text>
    <text x="300" y="115" font-size="11" font-weight="700" fill="#1f2a1c">Interpreter's House</text>
    <text x="300" y="129" font-size="9.5" fill="#4a5a45">Visible parables</text>

    <rect x="420" y="78" width="164" height="58" rx="10" fill="#fef3c7" stroke="#7a4f10" stroke-width="2" />
    <text x="502" y="99" font-size="10.5" font-weight="800" fill="#7a4f10">03 · THE CROSS</text>
    <text x="502" y="115" font-size="11" font-weight="700" fill="#1f2a1c">Hill Difficulty</text>
    <text x="502" y="129" font-size="9.5" fill="#4a5a45">Burden falls · Lost roll</text>

    <rect x="618" y="78" width="164" height="58" rx="10" fill="#ffffff" stroke="#2f5d1f" stroke-width="1.8" />
    <text x="700" y="99" font-size="10.5" font-weight="800" fill="#2f5d1f">04 · PALACE</text>
    <text x="700" y="115" font-size="11" font-weight="700" fill="#1f2a1c">Palace Beautiful</text>
    <text x="700" y="129" font-size="9.5" fill="#4a5a45">Fellowship &amp; armour</text>

    <!-- Row 2 Stops (Sessions 5-8 right->left) -->
    <rect x="618" y="168" width="164" height="58" rx="10" fill="#ffffff" stroke="#a3322a" stroke-width="1.8" />
    <text x="700" y="189" font-size="10.5" font-weight="800" fill="#a3322a">05 · TWO VALLEYS</text>
    <text x="700" y="205" font-size="11" font-weight="700" fill="#1f2a1c">Apollyon &amp; Shadow</text>
    <text x="700" y="219" font-size="9.5" fill="#4a5a45">Sword vs. inward fear</text>

    <rect x="420" y="168" width="164" height="58" rx="10" fill="#ffffff" stroke="#2f5d1f" stroke-width="1.8" />
    <text x="502" y="189" font-size="10.5" font-weight="800" fill="#2f5d1f">06 · COMPANIONS</text>
    <text x="502" y="205" font-size="11" font-weight="700" fill="#1f2a1c">Faithful &amp; Talkative</text>
    <text x="502" y="219" font-size="9.5" fill="#4a5a45">Words vs. lived truth</text>

    <rect x="218" y="168" width="164" height="58" rx="10" fill="#fff0f0" stroke="#a3322a" stroke-width="2" />
    <text x="300" y="189" font-size="10.5" font-weight="800" fill="#a3322a">07 · VANITY FAIR</text>
    <text x="300" y="205" font-size="11" font-weight="700" fill="#1f2a1c">Trial &amp; Martyrdom</text>
    <text x="300" y="219" font-size="9.5" fill="#4a5a45">Hopeful joins journey</text>

    <rect x="30" y="168" width="150" height="58" rx="10" fill="#ffffff" stroke="#7a4f10" stroke-width="1.8" />
    <text x="105" y="189" font-size="10.5" font-weight="800" fill="#7a4f10">08 · BY-PATH</text>
    <text x="105" y="205" font-size="11" font-weight="700" fill="#1f2a1c">By-ends &amp; Shortcut</text>
    <text x="105" y="219" font-size="9.5" fill="#4a5a45">Easy path → capture</text>

    <!-- Row 3 Stops (Sessions 9-12 left->right) -->
    <rect x="30" y="256" width="150" height="58" rx="10" fill="#ffffff" stroke="#a3322a" stroke-width="1.8" />
    <text x="105" y="277" font-size="10.5" font-weight="800" fill="#a3322a">09 · DOUBTING CASTLE</text>
    <text x="105" y="293" font-size="11" font-weight="700" fill="#1f2a1c">Key of Promise</text>
    <text x="105" y="307" font-size="9.5" fill="#4a5a45">Escape with Hopeful</text>

    <rect x="218" y="256" width="164" height="58" rx="10" fill="#ffffff" stroke="#2f5d1f" stroke-width="1.8" />
    <text x="300" y="277" font-size="10.5" font-weight="800" fill="#2f5d1f">10 · MOUNTAINS</text>
    <text x="300" y="293" font-size="11" font-weight="700" fill="#1f2a1c">Delectable Views</text>
    <text x="300" y="307" font-size="9.5" fill="#4a5a45">Flatterer &amp; false guides</text>

    <rect x="420" y="256" width="164" height="58" rx="10" fill="#ffffff" stroke="#2f5d1f" stroke-width="1.8" />
    <text x="502" y="277" font-size="10.5" font-weight="800" fill="#2f5d1f">11 · ENCHANTED</text>
    <text x="502" y="293" font-size="11" font-weight="700" fill="#1f2a1c">Staying Awake</text>
    <text x="502" y="307" font-size="9.5" fill="#4a5a45">Dialogue with Ignorance</text>

    <rect x="618" y="256" width="194" height="58" rx="10" fill="#fef3c7" stroke="#7a4f10" stroke-width="2.2" />
    <text x="715" y="277" font-size="10.5" font-weight="800" fill="#7a4f10">12 · CELESTIAL CITY</text>
    <text x="715" y="293" font-size="11" font-weight="700" fill="#1f2a1c">River &amp; Last Surprise</text>
    <text x="715" y="307" font-size="9.5" fill="#4a5a45">Seeming vs. entering</text>
  </g>

  <text x="30" y="340" font-family="system-ui, sans-serif" font-size="11.5" fill="#4a5a45">Notice the structure: the burden falls early (Session 03)—most of the book tests endurance, discernment, and false shortcuts after forgiveness.</text>
</svg>