<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" role="img" aria-labelledby="alg-lens-title alg-lens-desc">
  <title id="alg-lens-title">How Allegory Works: Reading on Two Levels Without Guessing</title>
  <desc id="alg-lens-desc">Two-track reading diagram linking concrete story elements (the Burden, By-path Meadow, Key of Promise) on the Literal Story Track to their spiritual/moral arguments on the Allegorical Meaning Track via textual evidence bridges.</desc>
  <rect width="860" height="310" rx="16" fill="#f8fcf5" stroke="#85a676" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#2f5d1f" />
  <text x="38" y="40" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fef3c7">READING AN ALLEGORY ON TWO LEVELS · STORY OBJECT ↔ TEXTUAL EVIDENCE ↔ MEANING</text>

  <!-- Column Headers -->
  <g font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">
    <rect x="28" y="68" width="246" height="30" rx="8" fill="#e6f2e0" stroke="#2f5d1f" />
    <text x="151" y="88" fill="#1f2a1c">1. LITERAL STORY EVENT</text>

    <rect x="308" y="68" width="244" height="30" rx="8" fill="#fef3c7" stroke="#7a4f10" />
    <text x="430" y="88" fill="#7a4f10">2. TEXTUAL EVIDENCE BRIDGE</text>

    <rect x="586" y="68" width="246" height="30" rx="8" fill="#eff6ff" stroke="#1e40af" />
    <text x="709" y="88" fill="#1e3a8a">3. ALLEGORICAL CLAIM</text>
  </g>

  <!-- Example 1: Burden -->
  <g font-family="system-ui, sans-serif">
    <rect x="28" y="108" width="246" height="52" rx="8" fill="#ffffff" stroke="#85a676" />
    <text x="42" y="129" font-size="11.5" font-weight="800" fill="#2f5d1f">A heavy pack on Christian's back</text>
    <text x="42" y="146" font-size="10.5" fill="#4a5a45">Weighs him down in the Slough; rolls off</text>

    <line x1="276" y1="134" x2="306" y2="134" stroke="#7a4f10" stroke-width="2" />
    <rect x="308" y="108" width="244" height="52" rx="8" fill="#fffbeb" stroke="#d97706" />
    <text x="320" y="129" font-size="11" font-weight="700" fill="#7a4f10">Look at what loosens it:</text>
    <text x="320" y="146" font-size="10.5" fill="#451a03">Legality fails; it breaks only at the Cross.</text>

    <line x1="554" y1="134" x2="584" y2="134" stroke="#1e40af" stroke-width="2" />
    <rect x="586" y="108" width="246" height="52" rx="8" fill="#ffffff" stroke="#3b82f6" />
    <text x="600" y="129" font-size="11.5" font-weight="800" fill="#1e3a8a">Guilt of sin &amp; grace</text>
    <text x="600" y="146" font-size="10.5" fill="#1e293b">Human effort cannot remove inner guilt.</text>

    <!-- Example 2: By-path Meadow -->
    <rect x="28" y="168" width="246" height="52" rx="8" fill="#ffffff" stroke="#85a676" />
    <text x="42" y="189" font-size="11.5" font-weight="800" fill="#2f5d1f">Climbing a stile into smooth grass</text>
    <text x="42" y="206" font-size="10.5" fill="#4a5a45">Way feels rough; meadow runs parallel</text>

    <line x1="276" y1="194" x2="306" y2="194" stroke="#7a4f10" stroke-width="2" />
    <rect x="308" y="168" width="244" height="52" rx="8" fill="#fffbeb" stroke="#d97706" />
    <text x="320" y="189" font-size="11" font-weight="700" fill="#7a4f10">Look at the sequence:</text>
    <text x="320" y="206" font-size="10.5" fill="#451a03">Easy start turns dark → Doubting Castle.</text>

    <line x1="554" y1="194" x2="584" y2="194" stroke="#1e40af" stroke-width="2" />
    <rect x="586" y="168" width="246" height="52" rx="8" fill="#ffffff" stroke="#3b82f6" />
    <text x="600" y="189" font-size="11.5" font-weight="800" fill="#1e3a8a">Comfort vs. faithfulness</text>
    <text x="600" y="206" font-size="10.5" fill="#1e293b">Even confident leaders misstep for ease.</text>

    <!-- Example 3: Key of Promise -->
    <rect x="28" y="228" width="246" height="52" rx="8" fill="#ffffff" stroke="#85a676" />
    <text x="42" y="249" font-size="11.5" font-weight="800" fill="#2f5d1f">A key kept hidden in his chest</text>
    <text x="42" y="266" font-size="10.5" fill="#4a5a45">Unlocks dungeon, yard, and iron gate</text>

    <line x1="276" y1="254" x2="306" y2="254" stroke="#7a4f10" stroke-width="2" />
    <rect x="308" y="228" width="244" height="52" rx="8" fill="#fffbeb" stroke="#d97706" />
    <text x="320" y="249" font-size="11" font-weight="700" fill="#7a4f10">Look at how it works:</text>
    <text x="320" y="266" font-size="10.5" fill="#451a03">Forgotten until Hopeful reminds him.</text>

    <line x1="554" y1="254" x2="584" y2="254" stroke="#1e40af" stroke-width="2" />
    <rect x="586" y="228" width="246" height="52" rx="8" fill="#ffffff" stroke="#3b82f6" />
    <text x="600" y="249" font-size="11.5" font-weight="800" fill="#1e3a8a">Remembered promises</text>
    <text x="600" y="266" font-size="10.5" fill="#1e293b">Community helps restore forgotten truth.</text>
  </g>

  <text x="28" y="298" font-family="system-ui, sans-serif" font-size="11.5" fill="#4a5a45">Method: start from what literally happens in the scene, quote a detail, and let Bunyan's dialogue confirm the allegorical bridge.</text>
</svg>