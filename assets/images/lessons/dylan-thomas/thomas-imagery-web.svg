<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="thomas-web-title thomas-web-desc">
  <title id="thomas-web-title">Dylan Thomas Motif Constellation Across Five Major Poems</title>
  <desc id="thomas-web-desc">Constellation diagram linking Dylan Thomas's recurring imagery clusters—Green Youth and Time, Body as Landscape, Light vs. Dying Night, Sea and Welsh Coast, and Defiance over Death—to the five poems in the anthology.</desc>
  <rect width="860" height="330" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#1e293b" />
  <text x="38" y="40" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fde68a">MOTIF CONSTELLATION · HOW SIX IMAGES RECUR ACROSS THOMAS'S POETRY</text>

  <!-- Central Hub -->
  <circle cx="430" cy="184" r="56" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
  <text x="430" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fde68a">THOMAS'S</text>
  <text x="430" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fde68a">IMAGINATION</text>
  <text x="430" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Wales · Sound · Time</text>

  <!-- Connection Lines -->
  <g stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3">
    <line x1="378" y1="164" x2="225" y2="118" />
    <line x1="378" y1="204" x2="225" y2="250" />
    <line x1="430" y1="128" x2="430" y2="95" />
    <line x1="482" y1="164" x2="635" y2="118" />
    <line x1="482" y1="204" x2="635" y2="250" />
  </g>

  <!-- Node 1: Green & Time (Top-Left) -->
  <rect x="28" y="72" width="248" height="86" rx="12" fill="#14532d" stroke="#4ade80" stroke-width="1.8" />
  <text x="44" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#86efac">GREEN YOUTH &amp; TIME</text>
  <text x="44" y="114" font-family="Georgia, serif" font-size="11.5" font-style="italic" fill="#ecfdf5">“green and golden” / “green fuse”</text>
  <text x="44" y="133" font-family="system-ui, sans-serif" font-size="10.5" fill="#bbf7d0">Poems: Fern Hill · Green Fuse</text>
  <text x="44" y="148" font-family="system-ui, sans-serif" font-size="10.5" fill="#bbf7d0">Life and decay share one root.</text>

  <!-- Node 2: Body as Landscape (Bottom-Left) -->
  <rect x="28" y="206" width="248" height="86" rx="12" fill="#312e81" stroke="#818cf8" stroke-width="1.8" />
  <text x="44" y="230" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#c7d2fe">BODY AS LANDSCAPE</text>
  <text x="44" y="248" font-family="Georgia, serif" font-size="11.5" font-style="italic" fill="#eef2ff">“water's mouth” / “veins”</text>
  <text x="44" y="267" font-family="system-ui, sans-serif" font-size="10.5" fill="#c7d2fe">Poems: Green Fuse · Refusal to Mourn</text>
  <text x="44" y="282" font-family="system-ui, sans-serif" font-size="10.5" fill="#c7d2fe">Human bones &amp; rivers follow same law.</text>

  <!-- Node 3: Light & Sight (Top-Center) -->
  <rect x="316" y="64" width="228" height="52" rx="10" fill="#78350f" stroke="#fbbf24" stroke-width="1.8" />
  <text x="430" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#fde68a">LIGHT VS. DYING NIGHT</text>
  <text x="430" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#fef3c7">“blaze like meteors” · Do Not Go Gentle</text>

  <!-- Node 4: Sacred Nature & Sound (Top-Right) -->
  <rect x="584" y="72" width="248" height="86" rx="12" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.8" />
  <text x="600" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#99f6e4">SACRED ORDINARY WORLD</text>
  <text x="600" y="114" font-family="Georgia, serif" font-size="11.5" font-style="italic" fill="#f0fdfa">“a water bead is Zion”</text>
  <text x="600" y="133" font-family="system-ui, sans-serif" font-size="10.5" fill="#ccfbf1">Poems: Fern Hill · Refusal to Mourn</text>
  <text x="600" y="148" font-family="system-ui, sans-serif" font-size="10.5" fill="#ccfbf1">Farms &amp; tides become chapels.</text>

  <!-- Node 5: Craft & Night Elegy (Bottom-Right) -->
  <rect x="584" y="206" width="248" height="86" rx="12" fill="#7f1d1d" stroke="#f87171" stroke-width="1.8" />
  <text x="600" y="230" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fecaca">DEFIANCE &amp; CRAFT</text>
  <text x="600" y="248" font-family="Georgia, serif" font-size="11.5" font-style="italic" fill="#fef2f2">“And death shall have no dominion”</text>
  <text x="600" y="267" font-family="system-ui, sans-serif" font-size="10.5" fill="#fecaca">Poems: Dominion · Sullen Art</text>
  <text x="600" y="282" font-family="system-ui, sans-serif" font-size="10.5" fill="#fecaca">Spoken rhythm stands against silence.</text>

  <text x="28" y="314" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Reading tip: pick one motif above and trace how its emotional tone transforms from poem to poem across the anthology.</text>
</svg>