<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-labelledby="vill-title vill-desc">
  <title id="vill-title">Villanelle 19-Line Clockwork Architecture in Do Not Go Gentle</title>
  <desc id="vill-desc">Architectural braid of a 19-line villanelle showing five tercets (ABA) plus a closing quatrain (ABAA), tracing how Refrain A1 and Refrain A2 alternate mechanically across all six stanzas and unite in lines 18 and 19.</desc>
  <rect width="860" height="350" rx="16" fill="#fffaf3" stroke="#d6c3aa" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#1e293b" />
  <text x="38" y="40" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fde68a">THE 19-LINE VILLANELLE CLOCKWORK · TWO REFRAINS + TWO RHYME SOUNDS</text>

  <!-- 6 Stanza Columns -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <!-- Stanza 1 -->
    <rect x="26" y="72" width="122" height="176" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" />
    <text x="87" y="94" font-size="11.5" font-weight="800" fill="#0f172a">STANZA 1</text>
    <rect x="38" y="108" width="98" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" /><text x="87" y="127" font-size="11.5" font-weight="800" fill="#92400e">A1 (-ight)</text>
    <rect x="38" y="148" width="98" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6" /><text x="87" y="167" font-size="11.5" font-weight="700" fill="#1e40af">b (-ay)</text>
    <rect x="38" y="188" width="98" height="30" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8" /><text x="87" y="207" font-size="11.5" font-weight="800" fill="#991b1b">A2 (-ight)</text>

    <!-- Stanza 2 -->
    <rect x="160" y="72" width="122" height="176" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" />
    <text x="221" y="94" font-size="11.5" font-weight="800" fill="#0f172a">STANZA 2</text>
    <rect x="172" y="108" width="98" height="30" rx="6" fill="#f1f5f9" stroke="#64748b" /><text x="221" y="127" font-size="11.5" font-weight="700" fill="#334155">a (-ight)</text>
    <rect x="172" y="148" width="98" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6" /><text x="221" y="167" font-size="11.5" font-weight="700" fill="#1e40af">b (-ay)</text>
    <rect x="172" y="188" width="98" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" /><text x="221" y="207" font-size="11.5" font-weight="800" fill="#92400e">A1 (-ight)</text>

    <!-- Stanza 3 -->
    <rect x="294" y="72" width="122" height="176" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" />
    <text x="355" y="94" font-size="11.5" font-weight="800" fill="#0f172a">STANZA 3</text>
    <rect x="306" y="108" width="98" height="30" rx="6" fill="#f1f5f9" stroke="#64748b" /><text x="355" y="127" font-size="11.5" font-weight="700" fill="#334155">a (-ight)</text>
    <rect x="306" y="148" width="98" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6" /><text x="355" y="167" font-size="11.5" font-weight="700" fill="#1e40af">b (-ay)</text>
    <rect x="306" y="188" width="98" height="30" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8" /><text x="355" y="207" font-size="11.5" font-weight="800" fill="#991b1b">A2 (-ight)</text>

    <!-- Stanza 4 -->
    <rect x="428" y="72" width="122" height="176" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" />
    <text x="489" y="94" font-size="11.5" font-weight="800" fill="#0f172a">STANZA 4</text>
    <rect x="440" y="108" width="98" height="30" rx="6" fill="#f1f5f9" stroke="#64748b" /><text x="489" y="127" font-size="11.5" font-weight="700" fill="#334155">a (-ight)</text>
    <rect x="440" y="148" width="98" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6" /><text x="489" y="167" font-size="11.5" font-weight="700" fill="#1e40af">b (-ay)</text>
    <rect x="440" y="188" width="98" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" /><text x="489" y="207" font-size="11.5" font-weight="800" fill="#92400e">A1 (-ight)</text>

    <!-- Stanza 5 -->
    <rect x="562" y="72" width="122" height="176" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" />
    <text x="623" y="94" font-size="11.5" font-weight="800" fill="#0f172a">STANZA 5</text>
    <rect x="574" y="108" width="98" height="30" rx="6" fill="#f1f5f9" stroke="#64748b" /><text x="623" y="127" font-size="11.5" font-weight="700" fill="#334155">a (-ight)</text>
    <rect x="574" y="148" width="98" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6" /><text x="623" y="167" font-size="11.5" font-weight="700" fill="#1e40af">b (-ay)</text>
    <rect x="574" y="188" width="98" height="30" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8" /><text x="623" y="207" font-size="11.5" font-weight="800" fill="#991b1b">A2 (-ight)</text>

    <!-- Stanza 6 (Quatrain) -->
    <rect x="696" y="72" width="138" height="202" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
    <text x="765" y="94" font-size="11.5" font-weight="800" fill="#7c2d12">STANZA 6 (QUATRAIN)</text>
    <rect x="708" y="108" width="114" height="28" rx="6" fill="#f1f5f9" stroke="#64748b" /><text x="765" y="126" font-size="11.5" font-weight="700" fill="#334155">a · L16 (Father)</text>
    <rect x="708" y="142" width="114" height="28" rx="6" fill="#eff6ff" stroke="#3b82f6" /><text x="765" y="160" font-size="11.5" font-weight="700" fill="#1e40af">b · L17 (Pray)</text>
    <rect x="708" y="176" width="114" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2" /><text x="765" y="199" font-size="11.5" font-weight="800" fill="#92400e">A1 · L18</text>
    <rect x="708" y="220" width="114" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2" /><text x="765" y="243" font-size="11.5" font-weight="800" fill="#991b1b">A2 · L19</text>
  </g>

  <!-- Braided Guide Lines under columns -->
  <path d="M 87 220 C 120 264, 188 264, 221 220" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" />
  <path d="M 221 220 C 310 278, 400 278, 489 220" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" />
  <path d="M 489 220 C 570 278, 670 268, 708 194" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" />

  <text x="26" y="305" font-family="system-ui, sans-serif" font-size="12" fill="#475569"><tspan font-weight="800" fill="#92400e">A1:</tspan> “Do not go gentle into that good night” · <tspan font-weight="800" fill="#991b1b">A2:</tspan> “Rage, rage against the dying of the light” — converging together at the end.</text>
  <text x="26" y="325" font-family="system-ui, sans-serif" font-size="11.5" fill="#64748b">The strict clockwork gives grief a repeating pulse—turning repetition into emotional momentum rather than a circle.</text>
</svg>