<text x="642" y="131" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#193f49" font-weight="700"></text><text x="640" y="131" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#193f49" font-weight="700">Watertight</text><g transform="translate(683 290) scale(0.95)"><path d="M-38,-30 L-31,-63 L-12,-43 Q0,-47 12,-43 L31,-63 L38,-30 Q50,12 37,50 Q0,66 -37,50 Q-50,12 -38,-30 Z" fill="#cde7d7" stroke="#15803d" stroke-width="2.6315789473684212"/><circle cx="-14" cy="-24" r="10" fill="#f7f1e3" stroke="#15803d" stroke-width="2"/><circle cx="14" cy="-24" r="10" fill="#f7f1e3" stroke="#15803d" stroke-width="2"/>
