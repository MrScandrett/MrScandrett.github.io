<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Five cleanup steps from left to right: crop the floor with a cutting plane, fill the holes, decimate from about a million triangles to about one hundred thousand, make it watertight with a flat base, and scale it so a caliper measurement of 84 millimetres matches the model.">
<rect width="1000" height="520" fill="#f7f5ee"/><path d="M0 0h1000v8H0z" fill="#1e5f69"/>
<text x="36" y="50" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#193f49">Clean it up: five steps from scan to printable</text>
<text x="36" y="78" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#49636b">Same order every time. Save a copy after each step.</text>
