<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Three ways to capture shape. Photogrammetry: a camera takes many photos from different places. Structured light: a projector shines stripes and an offset camera sees them bend. LiDAR and depth sensors: pulses of light are timed on their way back.">
<rect width="1000" height="540" fill="#f7f5ee"/><path d="M0 0h1000v8H0z" fill="#1e5f69"/>
<text x="36" y="50" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#193f49">Three ways to capture a real shape</text>
<text x="36" y="78" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#49636b">All three measure where light hits the surface. They differ in what does the measuring.</text>
<rect x="36" y="100" width="300" height="400" rx="14" fill="#fff" stroke="#c9d3d1" stroke-width="2"/><text x="56" y="134" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#193f49" font-weight="700">Photogrammetry</text><g transform="translate(186 305) scale(0.8)"><path d="M-38,-30 L-31,-63 L-12,-43 Q0,-47 12,-43 L31,-63 L38,-30 Q50,12 37,50 Q0,66 -37,50 Q-50,12 -38,-30 Z" fill="#d9c3a0" stroke="#5b4632" stroke-width="3.125"/><circle cx="-14" cy="-24" r="10" fill="#f7f1e3" stroke="#5b4632" stroke-width="2"/><circle cx="14" cy="-24" r="10" fill="#f7f1e3" stroke="#5b4632" stroke-width="2"/>
<circle cx="-14" cy="-24" r="4" fill="#5b4632"/><circle cx="14" cy="-24" r="4" fill="#5b4632"/><path d="M-5,-14 L0,-4 L5,-14 Z" fill="#c98a2b"/></g><path d="M68,315 L166,315" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="166" cy="315" r="3.5" fill="#c2410c"/><g transform="translate(68 315) rotate(-4.8) scale(1)"><rect x="-13" y="-9" width="18" height="18" rx="3" fill="#c2410c"/><path d="M5,-6 L14,-10 L14,10 L5,6 Z" fill="#c2410c"/></g><path d="M104,213 L178,275" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="178" cy="275" r="3.5" fill="#c2410c"/><g transform="translate(104 213) rotate(48.3) scale(1)"><rect x="-13" y="-9" width="18" height="18" rx="3" fill="#c2410c"/><path d="M5,-6 L14,-10 L14,10 L5,6 Z" fill="#c2410c"/></g><path d="M268,213 L196,281" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="196" cy="281" r="3.5" fill="#c2410c"/><g transform="translate(268 213) rotate(131.7) scale(1)"><rect x="-13" y="-9" width="18" height="18" rx="3" fill="#c2410c"/><path d="M5,-6 L14,-10 L14,10 L5,6 Z" fill="#c2410c"/></g><path d="M304,315 L208,321" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4"/><circle cx="208" cy="321" r="3.5" fill="#c2410c"/><g transform="translate(304 315) rotate(-175.2) scale(1)"><rect x="-13" y="-9" width="18" height="18" rx="3" fill="#c2410c"/><path d="M5,-6 L14,-10 L14,10 L5,6 Z" fill="#c2410c"/></g><text x="56" y="418" font-family="Arial,Helvetica,sans-serif" font-size="15.5" fill="#193f49" font-weight="700">• Any camera, many photos</text><text x="56" y="444" font-family="Arial,Helvetica,sans-serif" font-size="15.5" fill="#49636b" >• Needs texture and even light</text><text x="56" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15.5" fill="#49636b" >• Colour comes free</text><rect x="350" y="100" width="300" height="400" rx="14" fill="#fff" stroke="#c9d3d1" stroke-width="2"/><text x="370" y="134" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#193f49" font-weight="700">Structured light</text><defs><clipPath id="owlclip2"><path d="M-38,-30 L-31,-63 L-12,-43 Q0,-47 12,-43 L31,-63 L38,-30 Q50,12 37,50 Q0,66 -37,50 Q-50,12 -38,-30 Z"/></clipPath></defs><g transform="translate(500 315) scale(0.95)"><path d="M-38,-30 L-31,-63 L-12,-43 Q0,-47 12,-43 L31,-63 L38,-30 Q50,12 37,50 Q0,66 -37,50 Q-50,12 -38,-30 Z" fill="#eadfca" stroke="#5b4632" stroke-width="2.5"/><g clip-path="url(#owlclip2)"><path d="M-45,-70 Q-29,0 -45,70" stroke="#2563eb" stroke-width="8" fill="none" opacity="0.6"/><path d="M-27,-70 Q-11,0 -27,70" stroke="#2563eb" stroke-width="8" fill="none" opacity="0.6"/><path d="M-9,-70 Q7,0 -9,70" stroke="#2563eb" stroke-width="8" fill="none" opacity="0.6"/><path d="M9,-70 Q25,0 9,70" stroke="#2563eb" stroke-width="8" fill="none" opacity="0.6"/><path d="M27,-70 Q43,0 27,70" stroke="#2563eb" stroke-width="8" fill="none" opacity="0.6"/><path d="M45,-70 Q61,0 45,70" stroke="#2563eb" stroke-width="8" fill="none" opacity="0.6"/></g></g><rect x="368" y="193" width="44" height="28" rx="5" fill="#1d4ed8"/><text x="390" y="239" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">projector</text><path d="M412,203 L470,269 M412,213 L530,365" stroke="#1d4ed8" stroke-width="1.4" opacity="0.6"/><g transform="translate(612 209) rotate(136.6) scale(1.1)"><rect x="-13" y="-9" width="18" height="18" rx="3" fill="#c2410c"/><path d="M5,-6 L14,-10 L14,10 L5,6 Z" fill="#c2410c"/></g><text x="612" y="239" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#c2410c" text-anchor="middle" font-weight="700">camera</text><text x="370" y="418" font-family="Arial,Helvetica,sans-serif" font-size="15.5" fill="#193f49" font-weight="700">• Projector + offset camera</text><text x="370" y="444" font-family="Arial,Helvetica,sans-serif" font-size="15.5" fill="#49636b" >• Stripes bend over the surface</text><text x="370" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15.5" fill="#49636b" >• Fine detail, small objects</text><rect x="664" y="100" width="300" height="400" rx="14" fill="#fff" stroke="#c9d3d1" stroke-width="2"/><text x="684" y="134" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#193f49" font-weight="700">LiDAR / depth sensor</text><g transform="translate(864 295) scale(0.8)"><path d="M-38,-30 L-31,-63 L-12,-43 Q0,-47 12,-43 L31,-63 L38,-30 Q50,12 37,50 Q0,66 -37,50 Q-50,12 -38,-30 Z" fill="#d9c3a0" stroke="#5b4632" stroke-width="3.125"/><circle cx="-14" cy="-24" r="10" fill="#f7f1e3" stroke="#5b4632" stroke-width="2"/><circle cx="14" cy="-24" r="10" fill="#f7f1e3" stroke="#5b4632" stroke-width="2"/>
<circle cx="-14" cy="-24" r="4" fill="#5b4632"/><circle cx="14" cy="-24" r="4" fill="#5b4632"/><path d="M-5,-14 L0,-4 L5,-14 Z" fill="#c98a2b"/></g><rect x="686" y="279" width="34" height="34" rx="6" fill="#6d28d9"/><path d="M722,296 L840,267" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="3 6"/><circle cx="840" cy="267" r="3.5" fill="#6d28d9"/><path d="M722,296 L836,283" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="3 6"/><circle cx="836" cy="283" r="3.5" fill="#6d28d9"/><path d="M722,296 L834,303" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="3 6"/><circle cx="834" cy="303" r="3.5" fill="#6d28d9"/><path d="M722,296 L834,321" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="3 6"/><circle cx="834" cy="321" r="3.5" fill="#6d28d9"/><path d="M722,296 L836,335" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="3 6"/><circle cx="836" cy="335" r="3.5" fill="#6d28d9"/><text x="814" y="383" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="700">distance = speed of light × time ÷ 2</text><text x="684" y="418" font-family="Arial,Helvetica,sans-serif" font-size="15.5" fill="#193f49" font-weight="700">• Times light pulses</text><text x="684" y="444" font-family="Arial,Helvetica,sans-serif" font-size="15.5" fill="#49636b" >• Works on plain walls</text><text x="684" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15.5" fill="#49636b" >• Coarse on small objects</text><text x="980" y="528" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#7a8a8f" text-anchor="end">Original ClassroomOS teaching diagram</text>
</svg>
