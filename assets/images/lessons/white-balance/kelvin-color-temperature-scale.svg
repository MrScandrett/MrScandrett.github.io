<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="wb-k-title wb-k-desc">
  <title id="wb-k-title">Kelvin Color Temperature Scale and Theatrical Gel Shifts</title>
  <desc id="wb-k-desc">Spectrum diagram mapping color temperature from 1900K candlelight and 3200K tungsten halogen through 5600K noon daylight up to 8000K open shade, showing tungsten amber drift and CTO/CTB gel shifts.</desc>
  <defs>
    <linearGradient id="kelvinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="22%" stop-color="#fbbf24"/>
      <stop offset="48%" stop-color="#fff8ec"/>
      <stop offset="68%" stop-color="#f4f8ff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <marker id="wb-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="370" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">The Kelvin Scale: Light Color From Candlelight to Open Shade</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Low Kelvin glows amber-orange; higher Kelvin shifts blue — just like hotter stars glow bluer</text>

  <!-- Spectrum bar -->
  <rect x="44" y="84" width="792" height="44" rx="12" fill="url(#kelvinGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Markers along scale -->
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <!-- 1900K -->
    <line x1="78" y1="80" x2="78" y2="140" stroke="#9a3412" stroke-width="2.5"/>
    <text x="78" y="160" font-size="13" font-weight="800" fill="#9a3412">1900K</text>
    <text x="78" y="177" font-size="11.5" font-weight="600" fill="#475569">Candlelight</text>
    <text x="78" y="192" font-size="10.5" fill="#64748b">Match / hearth</text>

    <!-- 3200K -->
    <line x1="264" y1="80" x2="264" y2="140" stroke="#b45309" stroke-width="2.5"/>
    <text x="264" y="160" font-size="13" font-weight="800" fill="#b45309">3200K</text>
    <text x="264" y="177" font-size="11.5" font-weight="600" fill="#475569">Tungsten / Stage</text>
    <text x="264" y="192" font-size="10.5" fill="#64748b">Halogen Lekos</text>

    <!-- 5600K -->
    <line x1="510" y1="76" x2="510" y2="142" stroke="#0f766e" stroke-width="3"/>
    <rect x="446" y="146" width="128" height="22" rx="11" fill="#0f766e"/>
    <text x="510" y="161" font-size="12" font-weight="800" fill="#fff">5600K · DAYLIGHT</text>
    <text x="510" y="182" font-size="11" fill="#475569">Noon sun / studio key</text>

    <!-- 6500K -->
    <line x1="654" y1="80" x2="654" y2="140" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="654" y="160" font-size="13" font-weight="800" fill="#1d4ed8">6500K</text>
    <text x="654" y="177" font-size="11.5" font-weight="600" fill="#475569">Overcast Sky</text>
    <text x="654" y="192" font-size="10.5" fill="#64748b">Diffused clouds</text>

    <!-- 8000K -->
    <line x1="794" y1="80" x2="794" y2="140" stroke="#1e3a8a" stroke-width="2.5"/>
    <text x="794" y="160" font-size="13" font-weight="800" fill="#1e3a8a">8000K+</text>
    <text x="794" y="177" font-size="11.5" font-weight="600" fill="#475569">Open Shade</text>
    <text x="794" y="192" font-size="10.5" fill="#64748b">North sky skylight</text>
  </g>

  <!-- Two explanatory callout cards at bottom -->
  <rect x="28" y="218" width="402" height="128" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="46" y="244" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#7c2d12">Stagecraft Shift 1: Dimmer Amber Drift &amp; CTO Gels</text>
  <text x="46" y="266" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9a3412">• Dimming a 3200K halogen lamp to 35% cools its filament</text>
  <text x="56" y="283" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9a3412">down to ~2100K candlelight amber automatically.</text>
  <text x="46" y="306" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9a3412">• Adding a full CTO gel converts a 5600K arc followspot</text>
  <text x="56" y="323" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9a3412">back down to 3200K so skin tones match stage washes.</text>

  <rect x="450" y="218" width="402" height="128" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="468" y="244" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e3a8a">Camera Rule: Opposite Direction of Mismatch</text>
  <text x="468" y="266" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1e40af">• Camera WB set HIGHER than room light → image looks ORANGE</text>
  <text x="478" y="283" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1d4ed8">(Camera adds orange to cancel cool light it thinks is there.)</text>
  <text x="468" y="306" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1e40af">• Camera WB set LOWER than room light → image looks BLUE</text>
  <text x="478" y="323" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1d4ed8">(Great on purpose for moonlight; jarring on skin when unintended.)</text>
</svg>
