<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="wb-cri-title wb-cri-desc">
  <title id="wb-cri-title">Color Rendering Index (CRI): Complete vs. Spiky Spectral Power</title>
  <desc id="wb-cri-desc">Two spectral power distribution graphs at 5600K showing a full continuous spectrum (CRI 97, accurate red and skin tones) versus a spiky low-CRI 70 spectrum missing deep red wavelengths.</desc>
  <defs>
    <linearGradient id="visSpec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="22%" stop-color="#2563eb"/>
      <stop offset="44%" stop-color="#10b981"/>
      <stop offset="65%" stop-color="#eab308"/>
      <stop offset="84%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="880" height="370" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Why Matching Kelvin Isn’t Enough: Color Rendering Index (CRI)</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Both lights below read 5600K on a white wall — yet cheap spiky LEDs starve red fabric and human skin</text>

  <!-- Panel 1: CRI 97 -->
  <rect x="28" y="76" width="400" height="270" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <rect x="46" y="92" width="140" height="22" rx="11" fill="#0f766e"/>
  <text x="116" y="107" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">DAYLIGHT / CRI 97</text>
  <text x="200" y="108" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#064e3b">Full Continuous Spectrum</text>

  <rect x="48" y="128" width="360" height="122" rx="8" fill="#0f172a"/>
  <path d="M 56 238 Q 105 148, 175 144 T 290 148 T 396 164 L 396 238 Z" fill="url(#visSpec)" opacity="0.88"/>
  <rect x="56" y="240" width="340" height="7" rx="3" fill="url(#visSpec)"/>
  <text x="64" y="232" font-family="JetBrains Mono, monospace" font-size="10" fill="#fff">420nm Blue</text>
  <text x="205" y="232" font-family="JetBrains Mono, monospace" font-size="10" fill="#fff">550nm Green</text>
  <text x="336" y="232" font-family="JetBrains Mono, monospace" font-size="10" fill="#fff">660nm Red</text>

  <text x="48" y="274" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">• Rich, continuous energy across all wavelengths</text>
  <text x="48" y="294" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">• Deep reds (R9), warm skin tones, &amp; costumes</text>
  <text x="58" y="311" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">reflect faithfully once WB is locked at 5600K.</text>

  <!-- Panel 2: CRI 70 -->
  <rect x="452" y="76" width="400" height="270" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  <rect x="470" y="92" width="152" height="22" rx="11" fill="#c2410c"/>
  <text x="546" y="107" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">BUDGET TUBE / CRI 70</text>
  <text x="634" y="108" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#7c2d12">Spiky Spectrum (Weak Red)</text>

  <rect x="472" y="128" width="360" height="122" rx="8" fill="#0f172a"/>
  <!-- Spiky curve with missing cyan & deep red -->
  <path d="M 480 238 L 512 232 L 528 140 L 544 226 L 605 224 L 622 146 L 640 218 L 692 210 L 708 176 L 732 232 L 820 237 L 820 238 Z" fill="url(#visSpec)" opacity="0.82"/>
  <rect x="738" y="160" width="80" height="68" rx="6" fill="rgba(239,68,68,0.16)" stroke="#f87171" stroke-dasharray="4 3"/>
  <text x="778" y="188" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#fecaca">Missing</text>
  <text x="778" y="202" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#fecaca">Deep Red</text>
  <rect x="480" y="240" width="340" height="7" rx="3" fill="url(#visSpec)"/>

  <text x="472" y="274" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a3412">• Narrow blue/green spikes still average to “5600K white”</text>
  <text x="472" y="294" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">• White Balance sliders CANNOT invent wavelengths that</text>
  <text x="482" y="311" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">were never emitted — actors look dull or greenish.</text>
</svg>
