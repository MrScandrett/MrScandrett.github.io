<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Your arm and a robot arm have the same parts</title>
  <desc id="d">Side-by-side drawing. On the left, a human arm with shoulder, elbow, and wrist joints, muscles, and a hand. On the right, a robot arm with matching shoulder, elbow, and wrist motors, metal links, and a two-finger gripper. Labels connect the matching parts.</desc>
  <rect width="960" height="540" fill="#eef5f3"/>
  <g stroke="rgba(20,107,140,.08)">
    <path d="M0 40h960M0 80h960M0 120h960M0 160h960M0 200h960M0 240h960M0 280h960M0 320h960M0 360h960M0 400h960M0 440h960M0 480h960M0 520h960"/>
    <path d="M40 0v540M80 0v540M120 0v540M160 0v540M200 0v540M240 0v540M280 0v540M320 0v540M360 0v540M400 0v540M440 0v540M480 0v540M520 0v540M560 0v540M600 0v540M640 0v540M680 0v540M720 0v540M760 0v540M800 0v540M840 0v540M880 0v540M920 0v540"/>
  </g>
  <text x="240" y="50" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="34" fill="#12202a">YOUR ARM</text>
  <text x="720" y="50" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="34" fill="#12202a">ROBOT ARM</text>
  <path d="M480 80v420" stroke="#12202a" stroke-opacity=".2" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Human arm -->
  <g>
    <path d="M70 150c30-30 90-34 120-10l20 30-40 40c-40-10-80-20-100-60z" fill="#7aa7b5"/>
    <path d="M165 175c40 60 70 110 92 150" stroke="#e7b48f" stroke-width="54" stroke-linecap="round" fill="none"/>
    <path d="M257 325c50-10 100-30 140-60" stroke="#e7b48f" stroke-width="40" stroke-linecap="round" fill="none"/>
    <path d="M180 200c18 30 40 66 60 100" stroke="#d48f6a" stroke-width="20" stroke-linecap="round" fill="none" opacity=".75"/>
    <path d="M397 265c14-10 30-12 40-4l18-16c6-4 12 2 8 8l-16 20 22-6c8-2 10 8 2 11l-26 10c-14 6-34 4-44-6z" fill="#e7b48f" stroke="#c98d6c" stroke-width="2"/>
    <circle cx="170" cy="175" r="14" fill="#f2bf3f" stroke="#12202a" stroke-width="3"/>
    <circle cx="257" cy="325" r="13" fill="#f2bf3f" stroke="#12202a" stroke-width="3"/>
    <circle cx="397" cy="265" r="11" fill="#f2bf3f" stroke="#12202a" stroke-width="3"/>
  </g>

  <!-- Robot arm -->
  <g>
    <rect x="580" y="440" width="120" height="22" rx="6" fill="#2d4a54"/>
    <rect x="612" y="370" width="56" height="74" rx="8" fill="#3c6370"/>
    <path d="M640 370L700 230" stroke="#0b1418" stroke-width="34" stroke-linecap="round"/>
    <path d="M640 370L700 230" stroke="#e86f3a" stroke-width="26" stroke-linecap="round"/>
    <path d="M700 230L840 270" stroke="#0b1418" stroke-width="28" stroke-linecap="round"/>
    <path d="M700 230L840 270" stroke="#e86f3a" stroke-width="20" stroke-linecap="round"/>
    <path d="M840 270L846 318" stroke="#0b1418" stroke-width="20" stroke-linecap="round"/>
    <path d="M840 270L846 318" stroke="#c7d3d1" stroke-width="13" stroke-linecap="round"/>
    <path d="M824 320h44M824 320v28M868 320v28" stroke="#c7d3d1" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="640" cy="370" r="18" fill="#f2bf3f" stroke="#12202a" stroke-width="4"/>
    <circle cx="700" cy="230" r="15" fill="#f2bf3f" stroke="#12202a" stroke-width="4"/>
    <circle cx="840" cy="270" r="11" fill="#f2bf3f" stroke="#12202a" stroke-width="4"/>
    <circle cx="640" cy="370" r="6" fill="#12202a"/><circle cx="700" cy="230" r="5" fill="#12202a"/><circle cx="840" cy="270" r="4" fill="#12202a"/>
  </g>

  <!-- Labels -->
  <g font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" fill="#12202a">
    <g font-weight="700">
      <text x="62" y="250">Shoulder joint</text>
      <text x="150" y="380">Elbow joint</text>
      <text x="360" y="215">Wrist</text>
      <text x="420" y="330">Hand</text>
      <text x="520" y="350">Shoulder</text><text x="520" y="372">motor</text>
      <text x="640" y="190">Elbow motor</text>
      <text x="868" y="250">Wrist</text><text x="868" y="272">motor</text>
      <text x="776" y="390">Gripper</text><text x="752" y="412">(end effector)</text>
      <text x="740" y="300" fill="#9a4219">Link</text>
      <text x="610" y="300" fill="#9a4219">Link</text>
    </g>
    <text x="70" y="452" font-size="17" fill="#4d626b">Muscles pull on bones to turn each joint.</text>
    <text x="70" y="476" font-size="17" fill="#4d626b">Your brain feels the angles and corrects.</text>
    <text x="520" y="492" font-size="17" fill="#4d626b">Motors (servos) turn each joint. Encoders</text>
    <text x="520" y="516" font-size="17" fill="#4d626b">measure the angles so the controller can correct.</text>
  </g>
  <g stroke="#12202a" stroke-width="1.5" fill="none" opacity=".55">
    <path d="M128 240l30-52"/><path d="M200 372l46-38"/><path d="M386 220l8 30"/><path d="M440 312l-2-30"/>
    <path d="M590 358l34 6"/><path d="M698 196l2 20"/><path d="M866 256l-14 8"/><path d="M816 380l20-26"/>
  </g>
</svg>
