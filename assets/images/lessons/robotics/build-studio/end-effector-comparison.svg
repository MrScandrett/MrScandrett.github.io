<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">Robot end-effector comparison</title>
  <desc id="d">Pusher, scoop, and two-finger gripper are compared against a forty millimeter ping-pong ball with reach, alignment, control, and complexity tradeoffs.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#147a9b"/>
    </marker>
    <style>text{font-family:Arial,sans-serif;fill:#173039}.h{font-size:30px;font-weight:700}.l{font-size:23px;font-weight:700}.s{font-size:17px}.card{fill:white;stroke:#173039;stroke-width:4}.tool{fill:#147a9b;stroke:#173039;stroke-width:5}.ball{fill:#f8f7f1;stroke:#b95832;stroke-width:5}.dim{stroke:#147a9b;stroke-width:3;marker-start:url(#a);marker-end:url(#a)}.dot{fill:#39745a}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8f7f1"/>
  <text x="55" y="55" class="h">Choose the simplest tool that controls the task</text>
  <text x="55" y="88" class="s">Test every design from the same 100 mm line with the same 40 mm ball. Record three trials before revising.</text>
  <g transform="translate(45 125)">
    <rect class="card" width="350" height="455" rx="14"/>
    <text x="25" y="45" class="l">Pusher</text>
    <rect class="tool" x="55" y="175" width="170" height="30" rx="10"/>
    <rect class="tool" x="205" y="135" width="30" height="110" rx="8"/>
    <circle class="ball" cx="275" cy="208" r="40"/>
    <path d="M80 285H275" class="dim"/>
    <text x="177" y="315" text-anchor="middle" class="s">reach</text>
    <circle class="dot" cx="35" cy="355" r="8"/>
    <text x="55" y="361" class="s">tolerates alignment error</text>
    <circle class="dot" cx="35" cy="389" r="8"/>
    <text x="55" y="395" class="s">few moving parts</text>
    <text x="25" y="438" class="s" font-weight="700">Best when contact is enough</text>
  </g>
  <g transform="translate(425 125)">
    <rect class="card" width="350" height="455" rx="14"/>
    <text x="25" y="45" class="l">Scoop</text>
    <path class="tool" d="M55 205H215Q235 205 250 185L275 150V250H210Q170 250 150 225H55z"/>
    <circle class="ball" cx="235" cy="180" r="40"/>
    <path d="M80 290H265" class="dim"/>
    <text x="172" y="320" text-anchor="middle" class="s">reach</text>
    <circle class="dot" cx="35" cy="355" r="8"/>
    <text x="55" y="361" class="s">supports object from below</text>
    <circle class="dot" cx="35" cy="389" r="8"/>
    <text x="55" y="395" class="s">needs low approach height</text>
    <text x="25" y="438" class="s" font-weight="700">Best for lifting or corralling</text>
  </g>
  <g transform="translate(805 125)">
    <rect class="card" width="350" height="455" rx="14"/>
    <text x="25" y="45" class="l">Two-finger gripper</text>
    <rect class="tool" x="45" y="175" width="130" height="30" rx="10"/>
    <path d="M170 185Q230 100 280 135L252 165Q222 142 195 195" class="tool"/>
    <path d="M170 195Q230 280 280 245L252 215Q222 238 195 185" class="tool"/>
    <circle class="ball" cx="245" cy="190" r="40"/>
    <path d="M205 115H285" class="dim"/>
    <text x="245" y="96" text-anchor="middle" class="s">jaw opening &#x2265; 40 mm</text>
    <circle class="dot" cx="35" cy="355" r="8"/>
    <text x="55" y="361" class="s">controls object after contact</text>
    <circle class="dot" cx="35" cy="389" r="8"/>
    <text x="55" y="395" class="s">needs alignment + force limit</text>
    <text x="25" y="438" class="s" font-weight="700">Best for pick, carry, and release</text>
  </g>
  <rect x="45" y="600" width="1110" height="35" rx="8" fill="#fff1c4"/>
  <text x="600" y="624" text-anchor="middle" class="s"><tspan font-weight="700">Fair test:</tspan> same ball, same start line, same goal, three trials, one changed variable.</text>
</svg>
