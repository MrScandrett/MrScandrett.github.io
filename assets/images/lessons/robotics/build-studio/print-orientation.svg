<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">Three print orientations compared</title>
  <desc id="d">A bracket printed flat, on edge, and tilted with supports is compared for strength, time, surface finish, and hole accuracy.</desc>
  <defs>
    <style>text{font-family:Arial,sans-serif;fill:#173039}.h{font-size:30px;font-weight:700}.l{font-size:23px;font-weight:700}.s{font-size:17px}.card{fill:white;stroke:#173039;stroke-width:4}.bed{fill:#26343b}.layer{stroke:#147a9b;stroke-width:3}.good{fill:#39745a}.warn{fill:#b95832}.support{fill:none;stroke:#b95832;stroke-width:4;stroke-dasharray:8 6}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8f7f1"/>
  <text x="55" y="55" class="h">Orientation changes the part you get</text>
  <text x="55" y="88" class="s">Compare the load direction, critical faces, supports, and print time before choosing &#x201C;Slice.&#x201D;</text>
  <g transform="translate(45 125)">
    <rect class="card" width="350" height="460" rx="14"/>
    <text x="25" y="45" class="l">A &#xB7; Flat</text>
    <rect class="bed" x="35" y="295" width="280" height="18"/>
    <path d="M75 290V175H260V225H155V290z" fill="#dbecef" stroke="#173039" stroke-width="5"/>
    <g class="layer">
      <path d="M75 270H155M75 250H155M75 230H155M75 210H260M75 190H260"/>
    </g>
    <circle cx="210" cy="200" r="18" fill="#f8f7f1" stroke="#173039" stroke-width="4"/>
    <circle class="good" cx="36" cy="350" r="8"/>
    <text x="55" y="356" class="s">large bed contact</text>
    <circle class="good" cx="36" cy="382" r="8"/>
    <text x="55" y="388" class="s">short print</text>
    <circle class="warn" cx="36" cy="414" r="8"/>
    <text x="55" y="420" class="s">hole may bridge poorly</text>
    <text x="25" y="450" class="s" font-weight="700">Use when the broad face can be the base.</text>
  </g>
  <g transform="translate(425 125)">
    <rect class="card" width="350" height="460" rx="14"/>
    <text x="25" y="45" class="l">B &#xB7; On edge</text>
    <rect class="bed" x="35" y="295" width="280" height="18"/>
    <path d="M135 290V105H235V210H285V290z" fill="#dbecef" stroke="#173039" stroke-width="5"/>
    <g class="layer">
      <path d="M135 270H285M135 250H285M135 230H285M135 210H285M135 190H235M135 170H235M135 150H235M135 130H235"/>
    </g>
    <circle cx="185" cy="150" r="18" fill="#f8f7f1" stroke="#173039" stroke-width="4"/>
    <circle class="good" cx="36" cy="350" r="8"/>
    <text x="55" y="356" class="s">rounder vertical hole</text>
    <circle class="warn" cx="36" cy="382" r="8"/>
    <text x="55" y="388" class="s">small bed contact</text>
    <circle class="warn" cx="36" cy="414" r="8"/>
    <text x="55" y="420" class="s">longer print; tall-wall risk</text>
    <text x="25" y="450" class="s" font-weight="700">Use only when the load path justifies it.</text>
  </g>
  <g transform="translate(805 125)">
    <rect class="card" width="350" height="460" rx="14"/>
    <text x="25" y="45" class="l">C &#xB7; Tilted + support</text>
    <rect class="bed" x="35" y="295" width="280" height="18"/>
    <g transform="rotate(-23 190 235)">
      <path d="M100 285V155H270V205H175V285z" fill="#dbecef" stroke="#173039" stroke-width="5"/>
      <circle cx="220" cy="180" r="18" fill="#f8f7f1" stroke="#173039" stroke-width="4"/>
    </g>
    <path class="support" d="M95 295L155 250 180 295M185 295L225 230 260 295"/>
    <circle class="good" cx="36" cy="350" r="8"/>
    <text x="55" y="356" class="s">can redirect layer forces</text>
    <circle class="warn" cx="36" cy="382" r="8"/>
    <text x="55" y="388" class="s">support marks critical faces</text>
    <circle class="warn" cx="36" cy="414" r="8"/>
    <text x="55" y="420" class="s">more time and material</text>
    <text x="25" y="450" class="s" font-weight="700">Use after flat and edge options fail.</text>
  </g>
  <text x="600" y="630" text-anchor="middle" class="s">Always inspect the layer preview; the STL view alone cannot show toolpaths or hidden support.</text>
</svg>
