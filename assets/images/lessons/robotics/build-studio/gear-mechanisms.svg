<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">Mechanisms trade speed or travel for force</title>
  <desc id="d">Comparison of a spur gear pair, a lever linkage arm, and a pulley belt drive showing how mechanical advantage trades speed or travel distance for output torque and force.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#b95832"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#147a9b"/>
    </marker>
    <style>text{font-family:Arial,sans-serif;fill:#173039}.h{font-size:30px;font-weight:700}.l{font-size:23px;font-weight:700}.s{font-size:17px}.m{font-family:monospace;font-size:17px;font-weight:700}.card{fill:white;stroke:#173039;stroke-width:4}.driver{fill:#147a9b;stroke:#173039;stroke-width:4}.driven{fill:#f2bd3f;stroke:#173039;stroke-width:4}.frame{stroke:#173039;stroke-width:8;stroke-linecap:round}.good{fill:#39745a}.warn{fill:#b95832}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8f7f1"/>
  <text x="55" y="55" class="h">Mechanisms trade speed or travel for force</text>
  <text x="55" y="88" class="s">Gears, levers, and pulleys never create energy. Match the mechanism to the robot&#x2019;s stall, lift, or reach problem.</text>

  <!-- Card A: Spur gear pair -->
  <g transform="translate(45 125)">
    <rect class="card" width="350" height="450" rx="14"/>
    <text x="25" y="45" class="l">A &#xB7; Spur gear reduction</text>
    <rect x="35" y="185" width="280" height="16" rx="6" fill="#dce6e7" stroke="#173039" stroke-width="3"/>
    <!-- Driver gear 12T -->
    <circle class="driver" cx="105" cy="193" r="36"/>
    <circle cx="105" cy="193" r="10" fill="#f8f7f1" stroke="#173039" stroke-width="3"/>
    <path d="M78 145A48 48 0 0 1 132 145" fill="none" stroke="#147a9b" stroke-width="4" marker-end="url(#b)"/>
    <text x="105" y="130" text-anchor="middle" class="s">driver 12T</text>
    <!-- Driven gear 36T -->
    <circle class="driven" cx="222" cy="193" r="78"/>
    <circle cx="222" cy="193" r="14" fill="#f8f7f1" stroke="#173039" stroke-width="3"/>
    <path d="M265 105A92 92 0 0 0 180 105" fill="none" stroke="#b95832" stroke-width="5" marker-end="url(#a)"/>
    <text x="222" y="92" text-anchor="middle" class="s">driven 36T</text>
    <text x="175" y="302" text-anchor="middle" class="m">ratio = 36 &#xF7; 12 = 3 : 1</text>
    <circle class="good" cx="35" cy="340" r="8"/>
    <text x="55" y="346" class="s">3&#xD7; ideal torque; 1/3 speed</text>
    <circle class="warn" cx="35" cy="375" r="8"/>
    <text x="55" y="381" class="s">reverses direction; needs rigid shafts</text>
    <text x="25" y="425" class="s" font-weight="700">Use when wheels or lifts stall under load.</text>
  </g>

  <!-- Card B: Lever and linkage -->
  <g transform="translate(425 125)">
    <rect class="card" width="350" height="450" rx="14"/>
    <text x="25" y="45" class="l">B &#xB7; Lever &amp; linkage arm</text>
    <!-- Fulcrum -->
    <polygon points="145,255 120,295 170,295" fill="#173039"/>
    <path class="frame" d="M60 230L285 165"/>
    <circle cx="145" cy="205" r="10" fill="#f2bd3f" stroke="#173039" stroke-width="3"/>
    <!-- Effort arrow -->
    <path d="M65 150V212" fill="none" stroke="#147a9b" stroke-width="5" marker-end="url(#b)"/>
    <text x="70" y="138" text-anchor="middle" class="s">input force</text>
    <!-- Load arrow -->
    <path d="M280 225V180" fill="none" stroke="#b95832" stroke-width="5" marker-end="url(#a)"/>
    <rect x="260" y="118" width="42" height="36" rx="6" fill="#b95832" stroke="#173039" stroke-width="3"/>
    <text x="281" y="106" text-anchor="middle" class="s">load</text>
    <text x="175" y="302" text-anchor="middle" class="m">MA = d_effort &#xF7; d_load</text>
    <circle class="good" cx="35" cy="340" r="8"/>
    <text x="55" y="346" class="s">converts small rotation to arc lift</text>
    <circle class="warn" cx="35" cy="375" r="8"/>
    <text x="55" y="381" class="s">longer arm increases servo moment</text>
    <text x="25" y="425" class="s" font-weight="700">Use for scoops, arms, and jaw linkages.</text>
  </g>

  <!-- Card C: Pulley & belt transfer -->
  <g transform="translate(805 125)">
    <rect class="card" width="350" height="450" rx="14"/>
    <text x="25" y="45" class="l">C &#xB7; Belt &amp; pulley span</text>
    <!-- Belt -->
    <path d="M85 162L245 140A55 55 0 0 1 245 250L85 228A33 33 0 0 1 85 162z" fill="none" stroke="#173039" stroke-width="8"/>
    <circle class="driver" cx="85" cy="195" r="28"/>
    <circle cx="85" cy="195" r="8" fill="#f8f7f1" stroke="#173039" stroke-width="3"/>
    <circle class="driven" cx="245" cy="195" r="50"/>
    <circle cx="245" cy="195" r="11" fill="#f8f7f1" stroke="#173039" stroke-width="3"/>
    <path d="M125 142H205" fill="none" stroke="#147a9b" stroke-width="4" marker-end="url(#b)"/>
    <text x="165" y="128" text-anchor="middle" class="s">spans distance across chassis</text>
    <text x="175" y="302" text-anchor="middle" class="m">same spin direction</text>
    <circle class="good" cx="35" cy="340" r="8"/>
    <text x="55" y="346" class="s">moves motor weight toward center</text>
    <circle class="warn" cx="35" cy="375" r="8"/>
    <text x="55" y="381" class="s">needs tension; can slip at high torque</text>
    <text x="25" y="425" class="s" font-weight="700">Use when motor cannot sit at the axle.</text>
  </g>

  <rect x="45" y="595" width="1110" height="38" rx="8" fill="#fff1c4"/>
  <text x="600" y="621" text-anchor="middle" class="s"><tspan font-weight="700">Reality check:</tspan> Ideal ratios ignore friction, tooth binding, and shaft flex. Always test the built mechanism under a measured load.</text>
</svg>

