<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of an engineering evidence board</title>
  <desc id="d">A complete robot build record combining labeled multi-view photographs with a scale ruler, a power and signal flow diagram, a three-trial test table, and a revision log.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#147a9b"/>
    </marker>
    <marker id="p" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#b95832"/>
    </marker>
    <style>text{font-family:Arial,sans-serif;fill:#173039}.h{font-size:30px;font-weight:700}.l{font-size:21px;font-weight:700}.s{font-size:16px}.m{font-family:monospace;font-size:15px}.card{fill:white;stroke:#173039;stroke-width:4}.sub{fill:#f4f7f6;stroke:#9aa9aa;stroke-width:2.5}.sig{stroke:#147a9b;stroke-width:3.5;fill:none;marker-end:url(#a)}.pwr{stroke:#b95832;stroke-width:3.5;fill:none;marker-end:url(#p)}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8f7f1"/>
  <text x="55" y="55" class="h">Make the engineering visible to the next team</text>
  <text x="55" y="88" class="s">Good documentation pairs labeled views, scale, system flow, and trial data so anyone can inspect, repair, or improve the build.</text>

  <g transform="translate(45 115)">
    <rect class="card" width="1110" height="490" rx="16"/>

    <!-- Left panel: Labeled orthographic photo plate -->
    <g transform="translate(25 25)">
      <rect class="sub" width="490" height="440" rx="10"/>
      <text x="20" y="34" class="l">1 &#xB7; Labeled views with scale bar</text>
      <!-- Robot graphic inside photo frame -->
      <rect x="115" y="85" width="250" height="175" rx="18" fill="#dce6e7" stroke="#173039" stroke-width="5"/>
      <rect x="92" y="102" width="24" height="55" rx="8" fill="#173039"/>
      <rect x="92" y="188" width="24" height="55" rx="8" fill="#173039"/>
      <rect x="364" y="102" width="24" height="55" rx="8" fill="#173039"/>
      <rect x="364" y="188" width="24" height="55" rx="8" fill="#173039"/>
      <rect x="145" y="130" width="80" height="80" rx="8" fill="#b95832"/>
      <rect x="242" y="122" width="90" height="95" rx="8" fill="#147a9b"/>
      <path d="M365 145H425V200H365" fill="none" stroke="#39745a" stroke-width="8" stroke-linecap="round"/>
      <!-- Callout arrows -->
      <path class="pwr" d="M55 75L165 130"/>
      <text x="20" y="68" class="s" fill="#b95832" font-weight="700">7.4V pack + switch</text>
      <path class="sig" d="M310 68L290 122"/>
      <text x="255" y="60" class="s" fill="#147a9b" font-weight="700">UNO + driver shield</text>
      <path class="sig" d="M435 112L415 145"/>
      <text x="365" y="102" class="s" fill="#39745a" font-weight="700">45 mm scoop</text>
      <!-- Scale ruler -->
      <rect x="115" y="295" width="250" height="24" fill="white" stroke="#173039" stroke-width="2.5"/>
      <path d="M140 295V308M165 295V304M190 295V308M215 295V304M240 295V308M265 295V304M290 295V308M315 295V304M340 295V308" stroke="#173039" stroke-width="2"/>
      <text x="240" y="340" text-anchor="middle" class="m">0 mm &#x2500;&#x2500;&#x2500; 140 mm scale reference</text>
      <text x="20" y="382" class="s">&#x2022; Plain background and even lighting</text>
      <text x="20" y="408" class="s">&#x2022; Arrows end on the exact part and state its job</text>
    </g>

    <!-- Top-right panel: Power & Signal Architecture -->
    <g transform="translate(540 25)">
      <rect class="sub" width="545" height="195" rx="10"/>
      <text x="20" y="34" class="l">2 &#xB7; Power (copper) vs. signal (blue) flow</text>
      <rect x="24" y="65" width="110" height="58" rx="8" fill="#b95832"/>
      <text x="79" y="99" text-anchor="middle" fill="white" class="s" font-weight="700">Battery + Fuse</text>
      <path class="pwr" d="M134 94H192"/>
      <rect x="196" y="65" width="130" height="58" rx="8" fill="#147a9b"/>
      <text x="261" y="99" text-anchor="middle" fill="white" class="s" font-weight="700">Controller / Shield</text>
      <path class="sig" d="M326 80H392"/>
      <path class="pwr" d="M326 108H392"/>
      <rect x="396" y="55" width="125" height="34" rx="6" fill="#705589"/>
      <text x="458" y="77" text-anchor="middle" fill="white" class="s">Ultrasonic echo</text>
      <rect x="396" y="98" width="125" height="34" rx="6" fill="#39745a"/>
      <text x="458" y="120" text-anchor="middle" fill="white" class="s">Motors + Servo</text>
      <text x="24" y="165" class="s">Label voltage rails, pin numbers, common ground, and moving pinch hazards.</text>
    </g>

    <!-- Bottom-right panel: Controlled 3-trial table + Revision -->
    <g transform="translate(540 240)">
      <rect class="sub" width="545" height="225" rx="10"/>
      <text x="20" y="34" class="l">3 &#xB7; Three-trial evidence &amp; single-variable revision</text>
      <rect x="20" y="50" width="505" height="115" fill="white" stroke="#173039" stroke-width="2"/>
      <line x1="20" y1="80" x2="525" y2="80" stroke="#173039" stroke-width="2"/>
      <line x1="20" y1="108" x2="525" y2="108" stroke="#9aa9aa" stroke-width="1.5"/>
      <line x1="20" y1="136" x2="525" y2="136" stroke="#9aa9aa" stroke-width="1.5"/>
      <text x="32" y="70" class="m" font-weight="700">Trial   Condition (100 mm start)   Result     Observation</text>
      <text x="32" y="99" class="m">v1 #1   42 mm jaw, flat fingers    FAIL       Ball rolled left off tip</text>
      <text x="32" y="127" class="m">v2 #1   55 mm jaw + curved pads    PASS       Centered &amp; crossed goal</text>
      <text x="32" y="155" class="m">v2 #2   55 mm jaw + curved pads    PASS       2/2 controlled release</text>
      <text x="20" y="196" class="s" font-weight="700">Revision rule: state what failed, the one variable changed, and the new score.</text>
    </g>
  </g>
</svg>

