<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="t d">
  <title id="t">Robot chassis anatomy</title>
  <desc id="d">Annotated top and side views show a centered battery, controller access, clear sensor view, wheel axes, cable passages, and ground clearance.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#173039"/>
    </marker>
    <style>text{font-family:Arial,sans-serif;fill:#173039}.h{font-size:30px;font-weight:700}.l{font-size:21px;font-weight:700}.s{font-size:17px}.line{stroke:#173039;stroke-width:3;fill:none;marker-end:url(#a)}.dim{stroke:#147a9b;stroke-width:3;fill:none}.plate{fill:#edf3f2;stroke:#173039;stroke-width:7}.part{stroke:#173039;stroke-width:4}.note{fill:#fff7d6;stroke:#b98512;stroke-width:3}</style>
  </defs>
  <rect width="1200" height="730" fill="#f8f7f1"/>
  <text x="55" y="55" class="h">A chassis is a map of relationships</text>
  <text x="55" y="88" class="s">Place the parts before adding decorative shape. Protect access, motion, sight lines, and wiring.</text>
  <g transform="translate(70 135)">
    <text x="0" y="-15" class="l">TOP VIEW</text>
    <rect class="plate" x="70" y="15" width="520" height="330" rx="28"/>
    <g fill="#20292d">
      <rect x="32" y="48" width="68" height="100" rx="28"/>
      <rect x="32" y="215" width="68" height="100" rx="28"/>
      <rect x="560" y="48" width="68" height="100" rx="28"/>
      <rect x="560" y="215" width="68" height="100" rx="28"/>
    </g>
    <line x1="65" y1="98" x2="595" y2="98" stroke="#b95832" stroke-width="5" stroke-dasharray="10 8"/>
    <line x1="65" y1="265" x2="595" y2="265" stroke="#b95832" stroke-width="5" stroke-dasharray="10 8"/>
    <rect class="part" x="145" y="120" width="150" height="125" rx="12" fill="#b95832"/>
    <text x="220" y="174" text-anchor="middle" fill="white" class="l">BATTERY</text>
    <text x="220" y="202" text-anchor="middle" fill="white" class="s">low + centered</text>
    <rect class="part" x="332" y="105" width="165" height="150" rx="12" fill="#147a9b"/>
    <text x="414" y="170" text-anchor="middle" fill="white" class="l">CONTROLLER</text>
    <text x="414" y="198" text-anchor="middle" fill="white" class="s">USB accessible</text>
    <rect class="part" x="515" y="145" width="72" height="72" rx="10" fill="#705589"/>
    <path d="M587 155L690 105M587 205L690 255" fill="none" stroke="#705589" stroke-width="4" stroke-dasharray="9 8"/>
    <text x="675" y="85" class="s">clear sensor cone</text>
    <circle cx="315" cy="64" r="13" fill="#f2bd3f" stroke="#173039" stroke-width="3"/>
    <circle cx="315" cy="296" r="13" fill="#f2bd3f" stroke="#173039" stroke-width="3"/>
    <path d="M315 64V296" stroke="#f2bd3f" stroke-width="5" stroke-dasharray="8 7"/>
    <text x="242" y="335" class="s">cable passage</text>
    <path class="line" d="M250 326L302 300"/>
    <path class="line" d="M10 390C90 370 120 250 145 210"/>
    <text x="0" y="420" class="s">battery removal path</text>
    <path class="dim" d="M70 380V405M590 380V405M70 396H590"/>
    <text x="330" y="430" text-anchor="middle" class="l" fill="#147a9b">&#x2264; 150 mm</text>
  </g>
  <g transform="translate(690 160)">
    <text x="0" y="-15" class="l">SIDE VIEW</text>
    <path class="plate" d="M30 210H360V255H30z"/>
    <circle cx="75" cy="280" r="62" fill="#20292d"/>
    <circle cx="315" cy="280" r="62" fill="#20292d"/>
    <circle cx="75" cy="280" r="20" fill="#b7c4c7"/>
    <circle cx="315" cy="280" r="20" fill="#b7c4c7"/>
    <rect x="120" y="135" width="105" height="72" rx="8" class="part" fill="#b95832"/>
    <rect x="240" y="115" width="90" height="92" rx="8" class="part" fill="#147a9b"/>
    <path class="dim" d="M30 365V395M360 365V395M30 385H360"/>
    <text x="195" y="424" text-anchor="middle" class="l" fill="#147a9b">wheelbase</text>
    <path class="dim" d="M390 255H420M390 342H420M410 255V342"/>
    <text x="430" y="305" class="s" fill="#147a9b">ground</text>
    <text x="430" y="327" class="s" fill="#147a9b">clearance</text>
    <rect class="note" x="20" y="460" width="430" height="90" rx="10"/>
    <text x="40" y="493" class="l">Fit-check with real parts</text>
    <text x="40" y="522" class="s">Print the plan at 100%. Turn the wheels and</text>
    <text x="40" y="545" class="s">connect the cables before committing to plastic.</text>
  </g>
</svg>
