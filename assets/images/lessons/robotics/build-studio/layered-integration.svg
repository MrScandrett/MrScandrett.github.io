<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">Layered robot integration and fault isolation</title>
  <desc id="d">Six staged bring-up gates from unpowered mechanical check to spotter floor test, paired with a fault-isolation loop that disconnects the newest subsystem when a known test fails.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#173039"/>
    </marker>
    <style>text{font-family:Arial,sans-serif;fill:#173039}.h{font-size:30px;font-weight:700}.l{font-size:22px;font-weight:700}.s{font-size:17px}.gate{fill:white;stroke:#173039;stroke-width:4}.num{fill:#147a9b}.num-t{fill:white;font-size:20px;font-weight:700}.card{fill:white;stroke:#173039;stroke-width:4}.arrow{stroke:#173039;stroke-width:3.5;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8f7f1"/>
  <text x="55" y="55" class="h">Integrate one layer at a time so bugs have nowhere to hide</text>
  <text x="55" y="88" class="s">Pass each gate before connecting the next subsystem. If behavior breaks, the newest connection is the prime suspect.</text>

  <!-- Left column: 6 bring-up gates -->
  <g transform="translate(55 120)">
    <g transform="translate(0 0)">
      <rect class="gate" width="660" height="68" rx="10"/>
      <circle class="num" cx="38" cy="34" r="20"/>
      <text x="38" y="41" text-anchor="middle" class="num-t">1</text>
      <text x="74" y="29" class="l">Mechanical roll &amp; fastener check (unpowered)</text>
      <text x="74" y="53" class="s">Wheels spin freely; screws clear tires; battery and switch stay reachable.</text>
    </g>
    <g transform="translate(0 82)">
      <rect class="gate" width="660" height="68" rx="10"/>
      <circle class="num" cx="38" cy="34" r="20" style="fill:#b95832"/>
      <text x="38" y="41" text-anchor="middle" class="num-t">2</text>
      <text x="74" y="29" class="l">Power path &amp; common ground</text>
      <text x="74" y="53" class="s">Verify polarity and voltage with actuators unplugged; share ground across rails.</text>
    </g>
    <g transform="translate(0 164)">
      <rect class="gate" width="660" height="68" rx="10"/>
      <circle class="num" cx="38" cy="34" r="20"/>
      <text x="38" y="41" text-anchor="middle" class="num-t">3</text>
      <text x="74" y="29" class="l">Controller logic heartbeat</text>
      <text x="74" y="53" class="s">Boot controller alone; confirm status LED or serial message before load motion.</text>
    </g>
    <g transform="translate(0 246)">
      <rect class="gate" width="660" height="68" rx="10"/>
      <circle class="num" cx="38" cy="34" r="20" style="fill:#39745a"/>
      <text x="38" y="41" text-anchor="middle" class="num-t">4</text>
      <text x="74" y="29" class="l">Sensor plausibility check</text>
      <text x="74" y="53" class="s">Move a known target at 100 mm and 200 mm; verify readings change as predicted.</text>
    </g>
    <g transform="translate(0 328)">
      <rect class="gate" width="660" height="68" rx="10"/>
      <circle class="num" cx="38" cy="34" r="20" style="fill:#b95832"/>
      <text x="38" y="41" text-anchor="middle" class="num-t">5</text>
      <text x="74" y="29" class="l">Drive &amp; servo test on blocks (wheels raised)</text>
      <text x="74" y="53" class="s">Verify forward, turn, STOP, and unloaded servo limits before touching the floor.</text>
    </g>
    <g transform="translate(0 410)">
      <rect class="gate" width="660" height="68" rx="10"/>
      <circle class="num" cx="38" cy="34" r="20" style="fill:#39745a"/>
      <text x="38" y="41" text-anchor="middle" class="num-t">6</text>
      <text x="74" y="29" class="l">Controlled floor run with spotter</text>
      <text x="74" y="53" class="s">Clear stop zone, assign pilot + spotter + recorder, log one variable per run.</text>
    </g>
  </g>

  <!-- Right column: Fault Isolation Loop -->
  <g transform="translate(755 120)">
    <rect class="card" width="390" height="478" rx="14"/>
    <rect x="0" y="0" width="390" height="58" rx="14" fill="#173039"/>
    <text x="195" y="37" text-anchor="middle" class="l" fill="white">Fault-isolation protocol</text>

    <rect x="30" y="82" width="330" height="64" rx="10" fill="#fde8df" stroke="#b95832" stroke-width="3"/>
    <text x="195" y="110" text-anchor="middle" class="l" fill="#b95832">Symptom appears at Gate N</text>
    <text x="195" y="133" text-anchor="middle" class="s">Board resets, wheel reverses, or sensor freezes</text>

    <path class="arrow" d="M195 146V176"/>

    <rect x="30" y="180" width="330" height="64" rx="10" fill="#edf3f2" stroke="#147a9b" stroke-width="3"/>
    <text x="195" y="208" text-anchor="middle" class="l">1. Unplug newest subsystem</text>
    <text x="195" y="231" text-anchor="middle" class="s">Return hardware to Gate N&#x2212;1 state</text>

    <path class="arrow" d="M195 244V274"/>

    <rect x="30" y="278" width="330" height="64" rx="10" fill="#edf3f2" stroke="#147a9b" stroke-width="3"/>
    <text x="195" y="306" text-anchor="middle" class="l">2. Re-run Gate N&#x2212;1 test</text>
    <text x="195" y="329" text-anchor="middle" class="s">Confirm last known-good state still passes</text>

    <path class="arrow" d="M195 342V372"/>

    <rect x="30" y="376" width="330" height="76" rx="10" fill="#fff7d6" stroke="#b98512" stroke-width="3"/>
    <text x="195" y="404" text-anchor="middle" class="l">3. Inspect interface boundary</text>
    <text x="195" y="427" text-anchor="middle" class="s">Check voltage sag, shared GND, pin map,</text>
    <text x="195" y="446" text-anchor="middle" class="s">or mechanical binding before reconnecting.</text>
  </g>
</svg>

