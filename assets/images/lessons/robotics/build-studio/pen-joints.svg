<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">Three-dimensional pen joint construction</title>
  <desc id="d">Butt seam, lap joint, and gusseted corner are compared with load arrows and recommended extrusion paths.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#b95832"/>
    </marker>
    <style>text{font-family:Arial,sans-serif;fill:#173039}.h{font-size:30px;font-weight:700}.l{font-size:23px;font-weight:700}.s{font-size:17px}.card{fill:white;stroke:#173039;stroke-width:4}.rod{stroke:#147a9b;stroke-width:28;stroke-linecap:round;fill:none}.bead{stroke:#f2bd3f;stroke-width:8;stroke-linecap:round;fill:none}.load{stroke:#b95832;stroke-width:5;marker-end:url(#a)}.bad{fill:#b95832}.good{fill:#39745a}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8f7f1"/>
  <text x="55" y="55" class="h">Put material across the force path</text>
  <text x="55" y="88" class="s">More plastic is not automatically stronger. Bond area and geometry decide where a hand-built mount bends.</text>
  <g transform="translate(45 125)">
    <rect class="card" width="350" height="450" rx="14"/>
    <text x="25" y="45" class="l">Butt seam</text>
    <path class="rod" d="M70 250H175M175 250V120"/>
    <path class="bead" d="M156 234Q175 214 194 234"/>
    <path class="load" d="M280 110H220"/>
    <path d="M160 225L190 258M160 258L190 225" stroke="#b95832" stroke-width="6"/>
    <circle class="bad" cx="35" cy="330" r="8"/>
    <text x="55" y="336" class="s">small bonded area</text>
    <circle class="bad" cx="35" cy="365" r="8"/>
    <text x="55" y="371" class="s">stress collects at one seam</text>
    <text x="25" y="420" class="s" font-weight="700">Useful for a quick fit mock-up,</text>
    <text x="25" y="444" class="s" font-weight="700">not a loaded corner.</text>
  </g>
  <g transform="translate(425 125)">
    <rect class="card" width="350" height="450" rx="14"/>
    <text x="25" y="45" class="l">Lap joint</text>
    <path class="rod" d="M70 250H220M170 250V110"/>
    <path class="bead" d="M145 232V150M195 232V150M145 155Q170 135 195 155"/>
    <path class="load" d="M280 110H220"/>
    <circle class="good" cx="35" cy="330" r="8"/>
    <text x="55" y="336" class="s">longer bonded path</text>
    <circle class="good" cx="35" cy="365" r="8"/>
    <text x="55" y="371" class="s">several thin passes can fuse</text>
    <text x="25" y="420" class="s" font-weight="700">Overlap first; stitch both sides</text>
    <text x="25" y="444" class="s" font-weight="700">after the form cools.</text>
  </g>
  <g transform="translate(805 125)">
    <rect class="card" width="350" height="450" rx="14"/>
    <text x="25" y="45" class="l">Triangular gusset</text>
    <path class="rod" d="M55 250H240M170 250V90"/>
    <path d="M170 145L105 245" stroke="#147a9b" stroke-width="20" stroke-linecap="round"/>
    <path class="bead" d="M170 145L105 245M150 160L115 220"/>
    <path class="load" d="M280 95H220"/>
    <path d="M122 224L165 158" stroke="#39745a" stroke-width="5" stroke-dasharray="7 5"/>
    <circle class="good" cx="35" cy="330" r="8"/>
    <text x="55" y="336" class="s">triangle redirects bending load</text>
    <circle class="good" cx="35" cy="365" r="8"/>
    <text x="55" y="371" class="s">strong without filling the panel</text>
    <text x="25" y="420" class="s" font-weight="700">Best here: brace in the same plane</text>
    <text x="25" y="444" class="s" font-weight="700">as the expected sideways load.</text>
  </g>
  <rect x="45" y="595" width="1110" height="38" rx="8" fill="#fff1c4"/>
  <text x="600" y="621" text-anchor="middle" class="s"><tspan font-weight="700">Safe technique:</tspan> heat-safe mat, eye protection, correct filament temperature, and hands away from nozzle and fresh plastic.</text>
</svg>
