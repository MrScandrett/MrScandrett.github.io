<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">Servo mechanism anatomy</title>
  <desc id="d">A labeled pan-tilt mechanism shows two servo axes, centered horns, cable loop, separate power and common ground, mechanical stops, load arm, and torque moment.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#173039"/>
    </marker>
    <style>text{font-family:Arial,sans-serif;fill:#173039}.h{font-size:30px;font-weight:700}.l{font-size:22px;font-weight:700}.s{font-size:17px}.line{stroke:#173039;stroke-width:3;fill:none;marker-end:url(#a)}.servo{fill:#147a9b;stroke:#173039;stroke-width:5}.horn{fill:#f2bd3f;stroke:#173039;stroke-width:4}.wire{fill:none;stroke-width:5}.note{fill:white;stroke:#9aa9aa;stroke-width:3}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8f7f1"/>
  <text x="55" y="55" class="h">A servo positions a joint&#x2014;the structure carries the load</text>
  <text x="55" y="88" class="s">Center each servo before installing its horn. Find safe limits unloaded, then attach the mechanism.</text>
  <g transform="translate(80 130)">
    <path d="M60 400H520" stroke="#173039" stroke-width="14"/>
    <rect class="servo" x="225" y="300" width="150" height="100" rx="12"/>
    <circle class="horn" cx="300" cy="300" r="35"/>
    <path d="M300 300L300 215" stroke="#f2bd3f" stroke-width="18"/>
    <path d="M175 215H425" stroke="#173039" stroke-width="22" stroke-linecap="round"/>
    <rect class="servo" x="265" y="105" width="120" height="90" rx="12" transform="rotate(90 325 150)"/>
    <circle class="horn" cx="325" cy="150" r="30"/>
    <path d="M325 150L425 105" stroke="#f2bd3f" stroke-width="16"/>
    <rect x="415" y="60" width="110" height="85" rx="12" fill="#705589" stroke="#173039" stroke-width="5"/>
    <circle cx="450" cy="98" r="13" fill="#dce8e8" stroke="#173039" stroke-width="4"/>
    <circle cx="495" cy="98" r="13" fill="#dce8e8" stroke="#173039" stroke-width="4"/>
    <path d="M470 145C560 190 500 300 395 285" class="wire" stroke="#b95832"/>
    <path d="M70 430C150 500 370 500 450 430" stroke="#147a9b" stroke-width="4" fill="none" stroke-dasharray="9 7"/>
    <text x="260" y="520" text-anchor="middle" class="s">pan axis rotates the whole upper assembly</text>
    <path class="line" d="M105 260L225 335"/>
    <text x="15" y="240" class="l">pan servo</text>
    <text x="15" y="265" class="s">vertical axis</text>
    <path class="line" d="M570 195L380 160"/>
    <text x="580" y="190" class="l">tilt servo</text>
    <text x="580" y="215" class="s">horizontal axis</text>
    <path class="line" d="M585 75L515 92"/>
    <text x="595" y="72" class="l">sensor</text>
    <text x="595" y="97" class="s">clear view</text>
    <path class="line" d="M610 290L475 250"/>
    <text x="620" y="285" class="l">service loop</text>
    <text x="620" y="310" class="s">must not snag at limits</text>
  </g>
  <g transform="translate(810 140)">
    <rect class="note" width="330" height="420" rx="14"/>
    <text x="25" y="45" class="l">Three checks before motion</text>
    <circle cx="40" cy="92" r="17" fill="#f2bd3f"/>
    <text x="40" y="99" text-anchor="middle" font-weight="700">1</text>
    <text x="70" y="88" class="s" font-weight="700">Power</text>
    <text x="70" y="112" class="s">Adequate regulated supply;</text>
    <text x="70" y="134" class="s">controller and servo share ground.</text>
    <circle cx="40" cy="180" r="17" fill="#f2bd3f"/>
    <text x="40" y="187" text-anchor="middle" font-weight="700">2</text>
    <text x="70" y="176" class="s" font-weight="700">Limits</text>
    <text x="70" y="200" class="s">No binding, collision, buzzing,</text>
    <text x="70" y="222" class="s">or cable pull at either end.</text>
    <circle cx="40" cy="268" r="17" fill="#f2bd3f"/>
    <text x="40" y="275" text-anchor="middle" font-weight="700">3</text>
    <text x="70" y="264" class="s" font-weight="700">Load moment</text>
    <text x="70" y="288" class="s">Torque demand grows with both</text>
    <text x="70" y="310" class="s">load and distance from the shaft.</text>
    <path d="M55 360H275" stroke="#b95832" stroke-width="8"/>
    <circle cx="55" cy="360" r="15" fill="#173039"/>
    <path d="M275 335V385" stroke="#173039" stroke-width="6"/>
    <text x="165" y="348" text-anchor="middle" class="s">distance</text>
    <text x="165" y="405" text-anchor="middle" class="s" font-weight="700">moment = force &#xD7; distance</text>
  </g>
</svg>
