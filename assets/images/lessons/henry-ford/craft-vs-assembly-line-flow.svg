<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="cva-title">
  <title id="cva-title">Craft Production vs. Moving Assembly Line Flow</title>
  <rect width="920" height="340" rx="16" fill="#f8fafc"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">Why the Moving Assembly Line Slashed Model T Build Time</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#475569">Before 1913, skilled teams hand-fitted one stationary car. Highland Park paired interchangeable parts with moving chassis stations.</text>

  <!-- Row 1: Craft Production -->
  <g transform="translate(28 80)">
    <rect width="864" height="106" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#9f1239">CRAFT PRODUCTION (PRE-1913) — ~12+ HOURS PER CHASSIS</text>
    <rect x="20" y="42" width="140" height="46" rx="8" fill="#ffffff" stroke="#fecdd3"/>
    <text x="90" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#881337">Car Stays Parked</text>
    <text x="90" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">Generalists walk to car</text>

    <line x1="164" y1="65" x2="196" y2="65" stroke="#be123c" stroke-width="2.5"/>
    <polygon points="202,65 193,60 193,70" fill="#be123c"/>

    <rect x="204" y="42" width="190" height="46" rx="8" fill="#ffffff" stroke="#fecdd3"/>
    <text x="299" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#881337">Hand-File Custom Fit</text>
    <text x="299" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">Non-identical parts slow buildup</text>

    <line x1="398" y1="65" x2="430" y2="65" stroke="#be123c" stroke-width="2.5"/>
    <polygon points="436,65 427,60 427,70" fill="#be123c"/>

    <rect x="438" y="42" width="406" height="46" rx="8" fill="#ffffff" stroke="#fecdd3"/>
    <text x="641" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#881337">Result: High Labor Cost · Luxury Only</text>
    <text x="641" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">Only wealthy households could afford hand-fitted cars (~$850 in 1908)</text>
  </g>

  <!-- Row 2: Moving Assembly Line -->
  <g transform="translate(28 202)">
    <rect width="864" height="118" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="20" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#065f46">HIGHLAND PARK MOVING LINE (1913+) — ~93 MINUTES CHASSIS TIME</text>

    <line x1="20" y1="98" x2="844" y2="98" stroke="#059669" stroke-width="4" stroke-dasharray="10 6"/>
    <text x="432" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#047857">CONTINUOUS CONVEYOR PULLS INTERCHANGEABLE CHASSIS →</text>

    <rect x="20" y="42" width="186" height="46" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="113" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#064e3b">Station 1 · Axles</text>
    <text x="113" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">Interchangeable tolerances</text>

    <line x1="208" y1="65" x2="232" y2="65" stroke="#059669" stroke-width="2.5"/>
    <polygon points="238,65 229,60 229,70" fill="#059669"/>

    <rect x="240" y="42" width="186" height="46" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="333" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#064e3b">Station 2 · Engine</text>
    <text x="333" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">Drop in, torque fixed bolts</text>

    <line x1="428" y1="65" x2="452" y2="65" stroke="#059669" stroke-width="2.5"/>
    <polygon points="458,65 449,60 449,70" fill="#059669"/>

    <rect x="460" y="42" width="186" height="46" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="553" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#064e3b">Station 3 · Wheels/Body</text>
    <text x="553" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">Zero tool switching</text>

    <line x1="648" y1="65" x2="672" y2="65" stroke="#059669" stroke-width="2.5"/>
    <polygon points="678,65 669,60 669,70" fill="#059669"/>

    <rect x="680" y="42" width="164" height="46" rx="8" fill="#047857"/>
    <text x="762" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#ffffff">Scale &amp; Price Drop</text>
    <text x="762" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#d1fae5">Model T price fell ~70%</text>
  </g>
</svg>
