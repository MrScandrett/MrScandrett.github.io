<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Private gain and shared cost in a fictional pasture</title><desc id="desc">Five farmers share a pasture. A farmer receives income from an extra animal, while the animal consumes grass available to all five farmers.</desc><rect width="1000" height="560" fill="#f1f5e9"/><g font-family="system-ui,sans-serif" fill="#243923"><text x="50" y="65" font-size="34" font-weight="700">One extra animal. Who gains? Who pays?</text><rect x="50" y="110" width="400" height="340" rx="20" fill="#fff" stroke="#38562e" stroke-width="3"/><text x="80" y="160" font-size="27" font-weight="700">One farmer</text><text x="80" y="210" font-size="24">Receives the extra income</text><g fill="#38562e"><circle cx="170" cy="300" r="45"/><rect x="125" y="340" width="90" height="50" rx="15"/></g><path d="M470 280h70m-15-15 15 15-15 15" fill="none" stroke="#38562e" stroke-width="5"/><rect x="560" y="110" width="390" height="340" rx="20" fill="#dce8cd" stroke="#38562e" stroke-width="3"/><text x="590" y="160" font-size="27" font-weight="700">All five farmers</text><text x="590" y="210" font-size="24">Share the loss of grass</text><g fill="#38562e"><circle cx="620" cy="305" r="20"/><circle cx="685" cy="305" r="20"/><circle cx="750" cy="305" r="20"/><circle cx="815" cy="305" r="20"/><circle cx="880" cy="305" r="20"/></g><text x="50" y="510" font-size="24">Rules can change the incentive by changing rights, limits, and responsibilities.</text></g></svg>