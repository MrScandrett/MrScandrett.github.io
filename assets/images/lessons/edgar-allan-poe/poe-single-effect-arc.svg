<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="poe-arc-title poe-arc-desc">
  <title id="poe-arc-title">Poe's Single Effect and the Unreliable Narrator Split</title>
  <desc id="poe-arc-desc">Diagram showing how Edgar Allan Poe's three rules of suspense—claustrophobic setting, heightened sensory rhythm, and an unreliable narrator claiming total calm—split what the speaker claims from what the reader observes.</desc>
  <rect width="860" height="330" rx="16" fill="#151c27" stroke="#626a72" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#202c3a" stroke="#f2ce8a" stroke-opacity="0.35" />
  <text x="38" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#f2ce8a">POE'S SUSPENSE ENGINE · THE SINGLE EFFECT &amp; THE NARRATOR GAP</text>

  <!-- Three Pillars Converging -->
  <rect x="28" y="72" width="246" height="68" rx="10" fill="#202733" stroke="#626a72" />
  <text x="42" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f2ce8a">1. ENCLOSED SETTING</text>
  <text x="42" y="114" font-family="system-ui, sans-serif" font-size="11" fill="#eee9dd">Locked chamber, midnight storm,</text>
  <text x="42" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#eee9dd">crumbling vault—no outside exit.</text>

  <rect x="28" y="150" width="246" height="68" rx="10" fill="#202733" stroke="#626a72" />
  <text x="42" y="174" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#93c5fd">2. SENSORY ACCELERATION</text>
  <text x="42" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#eee9dd">Heartbeats, whispers, ticking clocks,</text>
  <text x="42" y="208" font-family="system-ui, sans-serif" font-size="11" fill="#eee9dd">and repeated refrains heighten dread.</text>

  <rect x="28" y="228" width="246" height="68" rx="10" fill="#202733" stroke="#626a72" />
  <text x="42" y="252" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e06c75">3. SINGLE UNIFIED EFFECT</text>
  <text x="42" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#eee9dd">Every detail pushes one mood—</text>
  <text x="42" y="286" font-family="system-ui, sans-serif" font-size="11" fill="#eee9dd">never broken by comic detours.</text>

  <!-- Right Panel: The Unreliable Narrator Split -->
  <rect x="302" y="72" width="530" height="224" rx="12" fill="#202733" stroke="#f2ce8a" stroke-width="1.8" />
  <text x="322" y="98" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#fde68a">HOW TO READ AN UNRELIABLE NARRATOR (TWO COLUMNS)</text>

  <!-- Column A: Narrator Claim -->
  <rect x="322" y="114" width="236" height="164" rx="10" fill="#151e29" stroke="#626a72" />
  <text x="338" y="138" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#93c5fd">WHAT THE SPEAKER CLAIMS</text>
  <text x="338" y="160" font-family="Georgia, serif" font-size="11.5" font-style="italic" fill="#eee9dd">“Observe how healthily—</text>
  <text x="338" y="177" font-family="Georgia, serif" font-size="11.5" font-style="italic" fill="#eee9dd">how calmly I can tell you.”</text>
  <text x="338" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#c7c4bd">• Insists he is rational &amp; steady</text>
  <text x="338" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#c7c4bd">• Blames noises on outside causes</text>
  <text x="338" y="243" font-family="system-ui, sans-serif" font-size="11" fill="#c7c4bd">• Asks questions he already dreads</text>

  <!-- Column B: Reader Evidence -->
  <rect x="576" y="114" width="236" height="164" rx="10" fill="#151e29" stroke="#e06c75" />
  <text x="592" y="138" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#e06c75">WHAT THE EVIDENCE REVEALS</text>
  <text x="592" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#eee9dd">• Ordinary tapping becomes an omen</text>
  <text x="592" y="182" font-family="system-ui, sans-serif" font-size="11" fill="#eee9dd">• One trained word (“Nevermore”)</text>
  <text x="602" y="198" font-family="system-ui, sans-serif" font-size="11" fill="#eee9dd">triggers escalating self-torture</text>
  <text x="592" y="222" font-family="system-ui, sans-serif" font-size="11" fill="#eee9dd">• Repetition &amp; exclamation spikes</text>
  <text x="602" y="238" font-family="system-ui, sans-serif" font-size="11" fill="#eee9dd">expose guilt and grief taking over</text>
  <text x="592" y="262" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#f2ce8a">Suspense lives in this widening gap.</text>

  <text x="28" y="318" font-family="system-ui, sans-serif" font-size="11.5" fill="#c7c4bd">Close reading clue: separate observable facts (“a tapping at my chamber door”) from the speaker's fearful interpretation.</text>
</svg>