<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-labelledby="raven-meter-title raven-meter-desc">
  <title id="raven-meter-title">Trochaic Octameter and Internal Rhyme Architecture of The Raven</title>
  <desc id="raven-meter-desc">Visual scansion of the opening lines of Edgar Allan Poe's The Raven, showing eight STRESSED-unstress trochaic pairs per line, internal rhyme bridges (dreary/weary, napping/tapping/rapping), and the long -ore/-more end refrain spine.</desc>
  <rect width="860" height="350" rx="16" fill="#151c27" stroke="#626a72" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#202c3a" stroke="#f2ce8a" stroke-opacity="0.35" />
  <text x="38" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#f2ce8a">SOUND ARCHITECTURE OF “THE RAVEN” · TROCHAIC OCTAMETER + INTERNAL RHYME</text>

  <!-- Line 1 Scansion -->
  <text x="30" y="78" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#93c5fd">LINE 1 · FALLING TROCHAIC FEET (STRESS – unstress × 8)</text>
  <g transform="translate(30, 88)" font-family="Georgia, serif" text-anchor="middle">
    <rect x="0" y="0" width="94" height="54" rx="7" fill="#202733" stroke="#626a72" />
    <text x="47" y="23" font-size="12.5" font-weight="700" fill="#f2ce8a">ONCE u-</text><text x="47" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#c7c4bd">/  ˘</text>
    <rect x="100" y="0" width="94" height="54" rx="7" fill="#202733" stroke="#626a72" />
    <text x="147" y="23" font-size="12.5" font-weight="700" fill="#f2ce8a">PON a</text><text x="147" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#c7c4bd">/  ˘</text>
    <rect x="200" y="0" width="94" height="54" rx="7" fill="#202733" stroke="#626a72" />
    <text x="247" y="23" font-size="12.5" font-weight="700" fill="#f2ce8a">MID-night</text><text x="247" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#c7c4bd">/  ˘</text>
    <rect x="300" y="0" width="94" height="54" rx="7" fill="#42331b" stroke="#f2ce8a" stroke-width="2" />
    <text x="347" y="23" font-size="12.5" font-weight="700" fill="#fde68a">DREAR-y</text><text x="347" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#fde68a">RHYME A</text>
    <rect x="400" y="0" width="94" height="54" rx="7" fill="#202733" stroke="#626a72" />
    <text x="447" y="23" font-size="12.5" font-weight="700" fill="#f2ce8a">WHILE I</text><text x="447" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#c7c4bd">/  ˘</text>
    <rect x="500" y="0" width="94" height="54" rx="7" fill="#202733" stroke="#626a72" />
    <text x="547" y="23" font-size="12.5" font-weight="700" fill="#f2ce8a">PON-dered</text><text x="547" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#c7c4bd">/  ˘</text>
    <rect x="600" y="0" width="94" height="54" rx="7" fill="#202733" stroke="#626a72" />
    <text x="647" y="23" font-size="12.5" font-weight="700" fill="#f2ce8a">WEAK and</text><text x="647" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#c7c4bd">/  ˘</text>
    <rect x="700" y="0" width="94" height="54" rx="7" fill="#42331b" stroke="#f2ce8a" stroke-width="2" />
    <text x="747" y="23" font-size="12.5" font-weight="700" fill="#fde68a">WEAR-y</text><text x="747" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#fde68a">RHYME A</text>
  </g>
  <!-- Internal Rhyme Arc -->
  <path d="M 377 144 C 460 170, 690 170, 777 144" fill="none" stroke="#f2ce8a" stroke-width="2.2" stroke-dasharray="5 3" />
  <rect x="478" y="152" width="194" height="20" rx="10" fill="#42331b" stroke="#f2ce8a" stroke-width="1.2" />
  <text x="575" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fde68a">Mid-line chime locks pace</text>

  <!-- Stanza End-Word Refrain Spine -->
  <rect x="30" y="186" width="800" height="114" rx="12" fill="#202733" stroke="#626a72" stroke-width="1.6" />
  <text x="48" y="209" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#e06c75">PERCUSSIVE CONSONANTS + THE -ORE REFRAIN SPINE (Lines 2–6)</text>

  <g transform="translate(48, 224)" font-family="Georgia, serif" font-size="12" fill="#eee9dd">
    <text x="0" y="14">Line 2: … volume of forgotten <tspan font-weight="800" fill="#f2ce8a">LORE</tspan> —</text>
    <text x="0" y="36">Line 3: … nearly <tspan font-weight="700" fill="#93c5fd">napping</tspan>, suddenly there came a <tspan font-weight="700" fill="#93c5fd">tapping</tspan>,</text>
    <text x="0" y="58">Line 4: … gently <tspan font-weight="700" fill="#93c5fd">rapping</tspan>, <tspan font-weight="700" fill="#93c5fd">rapping</tspan> at my chamber <tspan font-weight="800" fill="#f2ce8a">DOOR</tspan>.</text>
    <text x="430" y="14">Line 5: … tapping at my chamber <tspan font-weight="800" fill="#f2ce8a">DOOR</tspan> —</text>
    <text x="430" y="36">Line 6: “Only this and nothing <tspan font-weight="800" fill="#e06c75">MORE</tspan>.”</text>
    <text x="430" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#c7c4bd">Later stanzas mutate “nothing more” → “Nevermore.”</text>
  </g>

  <text x="30" y="328" font-family="system-ui, sans-serif" font-size="12" fill="#c7c4bd">Notice why Poe chose “o” + “r” in “Nevermore”: long, resonant vowels echo like a tolling bell at the truncated end of Line 6.</text>
</svg>