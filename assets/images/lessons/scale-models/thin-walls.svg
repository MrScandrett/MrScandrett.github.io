<text x="42" y="53" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#193f49">Why model walls get thicker than the real ones</text>
<text x="42" y="82" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#49636b">A 0.4 mm nozzle lays beads about 0.4 mm wide. A wall needs at least two beads to hold together, and three to survive handling.</text>
