<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="A 2.4 metre wall and a 1.7 metre person shown at 1:50, 1:100 and 1:200; the model wall is 48, 24 and 12 millimetres tall.">
<rect width="1000" height="520" fill="#f7f5ee"/><path d="M0 0h1000v8H0z" fill="#1e5f69"/>
<text x="42" y="53" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#193f49">One wall, one person, three scales</text>
<text x="42" y="82" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#49636b">A 2.4 m wall and a 1.7 m person, drawn at 3 px per model millimetre. Divide the real size by the scale.</text>
<rect x="70" y="120" width="270" height="320" fill="#fff" stroke="#bdd0cc" stroke-width="2" rx="14"/><text x="90" y="148" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#215963" >1 : 50</text><text x="182" y="148" font-family="Arial,Helvetica,sans-serif" font-size="15"  fill="#49636b" >1 m → 20 mm</text><rect x="110" y="256" width="72" height="144" fill="#e2c9a4" stroke="#7b5b3a" stroke-width="1.5" /><g fill="#2b2b2e"><circle cx="210" cy="311.3" r="13.3"/><path d="M196.7 327.2h26.5l-3.2 42.8h-4.8l-1.3 40.8h-8.0l-1.3 -40.8h-4.8z"/></g><line x1="90" y1="400" x2="320" y2="400" stroke="#3d4a4f" stroke-width="2" /><line x1="98" y1="256" x2="98" y2="400" stroke="#40647a" stroke-width="1.5" /><line x1="92" y1="256" x2="104" y2="256" stroke="#40647a" stroke-width="1.5" /><line x1="92" y1="400" x2="104" y2="400" stroke="#40647a" stroke-width="1.5" /><text x="88" y="333" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2b5466" text-anchor="end"></text><text x="120" y="426" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#7b5b3a" >wall 48 mm</text><text x="210" y="426" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2b2b2e" >person 34 mm</text><rect x="400" y="120" width="270" height="320" fill="#fff" stroke="#bdd0cc" stroke-width="2" rx="14"/><text x="420" y="148" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#215963" >1 : 100</text><text x="512" y="148" font-family="Arial,Helvetica,sans-serif" font-size="15"  fill="#49636b" >1 m → 10 mm</text><rect x="440" y="328" width="36" height="72" fill="#e2c9a4" stroke="#7b5b3a" stroke-width="1.5" /><g fill="#2b2b2e"><circle cx="540" cy="355.6" r="6.6"/><path d="M533.4 363.6h13.3l-1.6 21.4h-2.4l-0.7 20.4h-4.0l-0.7 -20.4h-2.4z"/></g><line x1="420" y1="400" x2="650" y2="400" stroke="#3d4a4f" stroke-width="2" /><line x1="428" y1="328" x2="428" y2="400" stroke="#40647a" stroke-width="1.5" /><line x1="422" y1="328" x2="434" y2="328" stroke="#40647a" stroke-width="1.5" /><line x1="422" y1="400" x2="434" y2="400" stroke="#40647a" stroke-width="1.5" /><text x="418" y="369" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2b5466" text-anchor="end"></text><text x="450" y="426" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#7b5b3a" >wall 24 mm</text><text x="540" y="426" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2b2b2e" >person 17 mm</text><rect x="680" y="120" width="270" height="320" fill="#fff" stroke="#bdd0cc" stroke-width="2" rx="14"/><text x="700" y="148" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#215963" >1 : 200</text><text x="792" y="148" font-family="Arial,Helvetica,sans-serif" font-size="15"  fill="#49636b" >1 m → 5 mm</text><rect x="720" y="364" width="18" height="36" fill="#e2c9a4" stroke="#7b5b3a" stroke-width="1.5" /><g fill="#2b2b2e"><circle cx="820" cy="377.8" r="3.3"/><path d="M816.7 381.8h6.6l-0.8 10.7h-1.2l-0.3 10.2h-2.0l-0.3 -10.2h-1.2z"/></g><line x1="700" y1="400" x2="930" y2="400" stroke="#3d4a4f" stroke-width="2" /><line x1="708" y1="364" x2="708" y2="400" stroke="#40647a" stroke-width="1.5" /><line x1="702" y1="364" x2="714" y2="364" stroke="#40647a" stroke-width="1.5" /><line x1="702" y1="400" x2="714" y2="400" stroke="#40647a" stroke-width="1.5" /><text x="698" y="387" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2b5466" text-anchor="end"></text><text x="730" y="426" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#7b5b3a" >wall 12 mm</text><text x="820" y="426" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2b2b2e" >person 8.5 mm</text><text x="42" y="472" font-family="Arial,Helvetica,sans-serif" font-size="15"  fill="#3e5157" >Same building, same ratio of wall to person at every scale. Only the size on the table changes:</text><text x="42" y="492" font-family="Arial,Helvetica,sans-serif" font-size="15"  fill="#3e5157" >halve the scale number and every length doubles.</text><text x="42" y="466" font-family="Arial,Helvetica,sans-serif" font-size="15"  fill="#23353b" ></text><text x="958" y="504" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#7a8a90">Original ClassroomOS teaching diagram</text>
</svg>
