<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif">
  <title id="t">What to measure in a classroom</title>
  <desc id="d">A classroom plan with dimension arrows for length and width wall to wall, the door width, the wall thickness at the door frame, and a window's width and distance from a corner. A side view shows the ceiling height and the window sill height.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1d2228"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#f7f5ee"/>
  <path d="M0 0h1000v8H0z" fill="#1e5f69"/>
  <text x="42" y="53" font-size="28" font-weight="700" fill="#193f49">Measure the room you are in</text>
  <text x="42" y="82" font-size="16.5" fill="#49636b">Lengths wall to wall at floor level; openings from the nearest corner; heights from the floor.</text>

  <!-- PLAN -->
  <text x="60" y="110" font-size="15" font-weight="700" fill="#215963">PLAN (from above)</text>
  <!-- walls: outer 80..520 x 150..440, 14 thick -->
  <path d="M80 150 H520 V440 H80 Z M94 164 V426 H506 V164 Z" fill="#3d4a4f" fill-rule="evenodd"/>
  <rect x="94" y="164" width="412" height="262" fill="#fffdf6"/>
  <!-- door gap in bottom wall at x 400..460 -->
  <rect x="400" y="426" width="60" height="14" fill="#fffdf6"/>
  <path d="M400 426 A60 60 0 0 1 460 366" fill="none" stroke="#3d4a4f" stroke-width="1.5"/>
  <line x1="400" y1="426" x2="400" y2="366" stroke="#3d4a4f" stroke-width="2"/>
  <!-- windows in top wall -->
  <rect x="150" y="150" width="90" height="14" fill="#a9d1ec" stroke="#3d4a4f" stroke-width="1"/>
  <rect x="320" y="150" width="90" height="14" fill="#a9d1ec" stroke="#3d4a4f" stroke-width="1"/>
  <!-- desks -->
  <g fill="#e6dcc6" stroke="#9a8a6a" stroke-width="1">
    <rect x="140" y="230" width="50" height="30"/><rect x="230" y="230" width="50" height="30"/><rect x="320" y="230" width="50" height="30"/>
    <rect x="140" y="300" width="50" height="30"/><rect x="230" y="300" width="50" height="30"/><rect x="320" y="300" width="50" height="30"/>
  </g>
  <!-- length -->
  <line x1="94" y1="200" x2="506" y2="200" stroke="#c2410c" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="236" y="186" width="128" height="20" fill="#fffdf6"/>
  <text x="300" y="201" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">length, wall to wall</text>
  <!-- width -->
  <line x1="485" y1="164" x2="485" y2="426" stroke="#c2410c" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="477" y="290" font-size="14" font-weight="700" fill="#9a3412" text-anchor="end">width</text>
  <!-- window width + from corner -->
  <line x1="320" y1="138" x2="410" y2="138" stroke="#1d2228" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="365" y="132" font-size="13" fill="#1d2228" text-anchor="middle">window width</text>
  <line x1="94" y1="138" x2="150" y2="138" stroke="#1d2228" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="122" y="132" font-size="13" fill="#1d2228" text-anchor="middle">from corner</text>
  <!-- door width -->
  <line x1="400" y1="462" x2="460" y2="462" stroke="#1d2228" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="430" y="482" font-size="13" fill="#1d2228" text-anchor="middle">door width</text>
  <!-- wall thickness callout -->
  <line x1="470" y1="426" x2="470" y2="440" stroke="#2f6fd6" stroke-width="2"/>
  <line x1="470" y1="440" x2="500" y2="492" stroke="#2f6fd6" stroke-width="1.5"/>
  <text x="504" y="506" font-size="13" font-weight="700" fill="#2552a3">wall thickness:</text>
  <text x="504" y="522" font-size="13" fill="#2552a3">across the</text><text x="504" y="538" font-size="13" fill="#2552a3">door frame</text>
  <!-- north -->
  <g transform="translate(560 190)"><circle r="20" fill="#fff" stroke="#3d4a4f" stroke-width="1.5"/><path d="M0 -14 L6 8 L0 3 L-6 8 Z" fill="#3d4a4f"/><text y="-26" font-size="13" font-weight="700" fill="#3d4a4f" text-anchor="middle">N</text></g>
  <text x="80" y="520" font-size="14" fill="#3e5157">Take every length twice, by different people.</text>
  <text x="80" y="539" font-size="14" fill="#3e5157">Readings 2 cm apart? Measure a third time.</text>

  <!-- SIDE VIEW -->
  <line x1="640" y1="110" x2="640" y2="500" stroke="#d5d9df" stroke-width="2"/>
  <text x="670" y="110" font-size="15" font-weight="700" fill="#215963">SIDE VIEW (one wall, seen from inside)</text>
  <rect x="690" y="170" width="250" height="250" fill="#fffdf6" stroke="#3d4a4f" stroke-width="3"/>
  <rect x="790" y="230" width="90" height="80" fill="#a9d1ec" stroke="#3d4a4f" stroke-width="1.5"/>
  <line x1="670" y1="420" x2="960" y2="420" stroke="#3d4a4f" stroke-width="3"/>
  <!-- ceiling height -->
  <line x1="720" y1="170" x2="720" y2="420" stroke="#c2410c" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="728" y="290" font-size="14" font-weight="700" fill="#9a3412">ceiling</text>
  <text x="728" y="307" font-size="14" font-weight="700" fill="#9a3412">height</text>
  <!-- sill height -->
  <line x1="835" y1="310" x2="835" y2="420" stroke="#1d2228" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="843" y="370" font-size="13" fill="#1d2228">sill height</text>
  <!-- person -->
  <g fill="#2b2b2e"><circle cx="910" cy="300" r="9"/><path d="M901 312 h18 l-2 50 h-4 l-1 58 h-4 l-1 -58 h-4 z"/></g>
  <text x="670" y="458" font-size="13" fill="#3e5157">No climbing: use a pole, a laser measure,</text>
  <text x="670" y="476" font-size="13" fill="#3e5157">or count ceiling tiles and measure one.</text>
  <text x="958" y="548" text-anchor="end" font-size="12" fill="#7a8a90">Original ClassroomOS teaching diagram</text>
</svg>
