<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#24334b">From light to a visual experience</text><rect x="40" y="120" width="340" height="225" rx="12" fill="#e0f2fe"/><text x="62" y="165" font-size="27" fill="#24334b">01  LIGHT</text><text x="62" y="225" font-size="22" fill="#24334b">Wavelengths and intensity</text><text x="62" y="261" font-size="22" fill="#24334b">reach the eye.</text><path d="M385 235 L420 235" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="120" width="340" height="225" rx="12" fill="#ede9fe"/><text x="452" y="165" font-size="27" fill="#24334b">02  RETINA</text><text x="452" y="225" font-size="22" fill="#24334b">Rods and cones respond;</text><text x="452" y="261" font-size="22" fill="#24334b">retinal circuits compare.</text><path d="M775 235 L810 235" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="120" width="340" height="225" rx="12" fill="#fce7f3"/><text x="842" y="165" font-size="27" fill="#24334b">03  BRAIN</text><text x="842" y="225" font-size="22" fill="#24334b">Edges, depth and context</text><text x="842" y="261" font-size="22" fill="#24334b">shape what you perceive.</text><text x="40" y="425" font-size="26" fill="#24334b">Perception is active processing, not a photograph passed through unchanged.</text><text x="40" y="478" font-size="24" fill="#24334b">Adaptation can change responses at several stages of this pathway.</text><text x="40" y="545" font-size="20" fill="#52637b">Teaching schematic • boxes show functions, not anatomical scale or every connection.</text></g></svg>