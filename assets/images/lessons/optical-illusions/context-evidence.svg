<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#24334b">Brightness: appearance versus digital evidence</text><rect x="40" y="110" width="520" height="360" rx="12" fill="#eff6ff"/><rect x="600" y="110" width="560" height="360" rx="12" fill="#f5f3ff"/><text x="65" y="155" font-size="25" fill="#24334b">A  Same signal, different context</text><text x="625" y="155" font-size="25" fill="#24334b">B  Separate signal from interpretation</text><rect x="80" y="195" width="190" height="185" rx="12" fill="#222222"/><rect x="310" y="195" width="190" height="185" rx="12" fill="#dddddd"/><rect x="143" y="258" width="64" height="64" fill="#888888"/><rect x="373" y="258" width="64" height="64" fill="#888888"/><text x="88" y="430" font-size="23" fill="#24334b">Both centers: RGB (136, 136, 136)</text><rect x="660" y="210" width="180" height="125" fill="#888888"/><rect x="840" y="210" width="180" height="125" fill="#888888"/><text x="663" y="385" font-size="24" fill="#24334b">Remove the neighbors.</text><text x="663" y="428" font-size="24" fill="#24334b">Compare the numerical values.</text><text x="40" y="530" font-size="26" fill="#24334b">The pixel values stay fixed. The surrounding context changes the appearance.</text></g></svg>