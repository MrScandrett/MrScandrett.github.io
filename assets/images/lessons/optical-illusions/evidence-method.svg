<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="20" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#24334b">How to investigate an illusion</text><rect x="40" y="110" width="1120" height="110" rx="12" fill="#e0f2fe"/><text x="65" y="153" font-size="25" fill="#24334b">MEASURE</text><text x="345" y="152" font-size="24" fill="#24334b">What is physically drawn?</text><text x="345" y="190" font-size="22" fill="#24334b">Check pixels, angles, lengths.</text><rect x="40" y="245" width="1120" height="110" rx="12" fill="#ede9fe"/><text x="65" y="288" font-size="25" fill="#24334b">MANIPULATE</text><text x="345" y="287" font-size="24" fill="#24334b">What happens if context changes?</text><text x="345" y="325" font-size="22" fill="#24334b">Remove fins or surrounding shapes.</text><rect x="40" y="380" width="1120" height="110" rx="12" fill="#dcfce7"/><text x="65" y="423" font-size="25" fill="#24334b">EXPLAIN</text><text x="345" y="422" font-size="24" fill="#24334b">Which idea fits the evidence?</text><text x="345" y="460" font-size="22" fill="#24334b">Separate results from hypotheses.</text><text x="40" y="570" font-size="23" fill="#24334b">A reveal checks the drawing; it does not prove a complete theory of the brain.</text></g></svg>