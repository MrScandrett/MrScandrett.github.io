<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
  <title id="t">Walls versus infill in the hook's arm</title>
  <desc id="d">Three cross-sections of the same 8 by 5 millimetre arm. A: two walls and 20 percent infill. B: two walls and 60 percent infill. C: three walls and 20 percent infill. C uses less plastic than B and is stronger in bending, because the outer skin carries most of a bending load.</desc>
  <defs>
    <clipPath id="ca"><rect x="25" y="25" width="174" height="90"/></clipPath>
    <clipPath id="cb"><rect x="25" y="25" width="174" height="90"/></clipPath>
    <clipPath id="cc"><rect x="38" y="38" width="148" height="64"/></clipPath>
  </defs>
  <rect width="1000" height="540" rx="18" fill="#ffffff"/>
  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Cut the arm in half: where is the plastic?</text>
  <text x="40" y="76" font-family="system-ui, sans-serif" font-size="17" fill="#334155">Same 8 mm × 5 mm arm. Bending pulls hardest on the top skin and pushes hardest on the bottom skin.</text>

  <g font-family="system-ui, sans-serif">
    <!-- A -->
    <g transform="translate(60,120)">
      <text x="112" y="-12" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">A · 2 walls, 20% infill</text>
      <rect x="0" y="0" width="224" height="140" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
      <rect x="6" y="6" width="212" height="128" fill="none" stroke="#f59e0b" stroke-width="12.6"/>
      <rect x="19" y="19" width="186" height="102" fill="none" stroke="#d97706" stroke-width="12.6"/>
      <g clip-path="url(#ca)" stroke="#f59e0b" stroke-width="5"><line x1="20" y1="120" x2="120" y2="20"/><line x1="100" y1="120" x2="200" y2="20"/><line x1="20" y1="20" x2="120" y2="120"/><line x1="100" y1="20" x2="200" y2="120"/></g>
    </g>
    <!-- B -->
    <g transform="translate(388,120)">
      <text x="112" y="-12" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">B · 2 walls, 60% infill</text>
      <rect x="0" y="0" width="224" height="140" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
      <rect x="6" y="6" width="212" height="128" fill="none" stroke="#f59e0b" stroke-width="12.6"/>
      <rect x="19" y="19" width="186" height="102" fill="none" stroke="#d97706" stroke-width="12.6"/>
      <g clip-path="url(#cb)" stroke="#f59e0b" stroke-width="5">
        <line x1="-80" y1="120" x2="20" y2="20"/><line x1="-38" y1="120" x2="62" y2="20"/><line x1="4" y1="120" x2="104" y2="20"/><line x1="46" y1="120" x2="146" y2="20"/><line x1="88" y1="120" x2="188" y2="20"/><line x1="130" y1="120" x2="230" y2="20"/><line x1="172" y1="120" x2="272" y2="20"/>
        <line x1="-80" y1="20" x2="20" y2="120"/><line x1="-38" y1="20" x2="62" y2="120"/><line x1="4" y1="20" x2="104" y2="120"/><line x1="46" y1="20" x2="146" y2="120"/><line x1="88" y1="20" x2="188" y2="120"/><line x1="130" y1="20" x2="230" y2="120"/><line x1="172" y1="20" x2="272" y2="120"/>
      </g>
    </g>
    <!-- C -->
    <g transform="translate(716,120)">
      <text x="112" y="-12" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">C · 3 walls, 20% infill</text>
      <rect x="0" y="0" width="224" height="140" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
      <rect x="6" y="6" width="212" height="128" fill="none" stroke="#f59e0b" stroke-width="12.6"/>
      <rect x="19" y="19" width="186" height="102" fill="none" stroke="#d97706" stroke-width="12.6"/>
      <rect x="31.5" y="31.5" width="161" height="77" fill="none" stroke="#f59e0b" stroke-width="12.6"/>
      <g clip-path="url(#cc)" stroke="#f59e0b" stroke-width="5"><line x1="40" y1="110" x2="120" y2="30"/><line x1="110" y1="110" x2="190" y2="30"/><line x1="40" y1="30" x2="120" y2="110"/><line x1="110" y1="30" x2="190" y2="110"/></g>
    </g>

    <text x="40" y="132" font-size="14" fill="#b91c1c" font-weight="700" transform="rotate(-90 40 132)" text-anchor="end">pulled</text>
    <text x="40" y="262" font-size="14" fill="#1d4ed8" font-weight="700" transform="rotate(-90 40 262)">pushed</text>

    <!-- bars -->
    <g font-size="16" fill="#0f172a">
      <text x="60" y="318" font-weight="700">Plastic used</text>
      <text x="60" y="408" font-weight="700">Bending strength (lesson model)</text>
    </g>
    <g>
      <rect x="60" y="330" width="224" height="22" rx="4" fill="#e2e8f0"/><rect x="60" y="330" width="135" height="22" rx="4" fill="#64748b"/>
      <rect x="388" y="330" width="224" height="22" rx="4" fill="#e2e8f0"/><rect x="388" y="330" width="180" height="22" rx="4" fill="#64748b"/>
      <rect x="716" y="330" width="224" height="22" rx="4" fill="#e2e8f0"/><rect x="716" y="330" width="169" height="22" rx="4" fill="#64748b"/>
      <text x="60" y="374" font-size="15" fill="#334155">60% of a solid arm</text>
      <text x="388" y="374" font-size="15" fill="#334155">80% of a solid arm</text>
      <text x="716" y="374" font-size="15" fill="#334155">76% of a solid arm</text>

      <rect x="60" y="420" width="224" height="22" rx="4" fill="#e2e8f0"/><rect x="60" y="420" width="183" height="22" rx="4" fill="#0e7490"/>
      <rect x="388" y="420" width="224" height="22" rx="4" fill="#e2e8f0"/><rect x="388" y="420" width="200" height="22" rx="4" fill="#0e7490"/>
      <rect x="716" y="420" width="224" height="22" rx="4" fill="#e2e8f0"/><rect x="716" y="420" width="211" height="22" rx="4" fill="#0e7490"/>
      <text x="60" y="464" font-size="15" fill="#334155">82% of a solid arm</text>
      <text x="388" y="464" font-size="15" fill="#334155">89% of a solid arm</text>
      <text x="716" y="464" font-size="15" font-weight="700" fill="#0e7490">94%, with less plastic than B</text>
    </g>
    <text x="40" y="504" font-size="17" fill="#0f172a">The outer skin does most of the work in bending. One more wall beats three times the infill.</text>
    <text x="960" y="530" text-anchor="end" font-size="12" fill="#64748b">0.45 mm walls, drawn to scale · bars from the lesson's comparison model, not lab data · Original ClassroomOS teaching diagram</text>
  </g>
</svg>
