<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="t d">
  <title id="t">The same hook printed two ways</title>
  <desc id="d">Left: a hook printed lying on its side, with plastic roads that follow the hook's outline; it can only break by tearing the roads. Right: the same hook printed standing up, with horizontal layer lines; the pull at the inside corner splits it cleanly along one layer.</desc>
  <defs>
    <path id="hook" d="M0,0 H30 V198 A12,12 0 0 0 42,210 H160 V162 H190 V240 H0 Z"/>
    <clipPath id="clipA"><use href="#hook"/></clipPath>
    <clipPath id="clipB"><use href="#hook"/></clipPath>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e5e7eb"/><line x1="0" y1="0" x2="0" y2="10" stroke="#9ca3af" stroke-width="3"/>
    </pattern>
    <pattern id="layers" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect width="10" height="8" fill="#fcd34d"/><rect y="6" width="10" height="2" fill="#b45309"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="1000" height="580" rx="18" fill="#ffffff"/>
  <line x1="500" y1="30" x2="500" y2="550" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Panel A -->
  <text x="40" y="52" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">A · Printed lying on its side</text>
  <text x="40" y="80" font-family="system-ui, sans-serif" font-size="17" fill="#334155">Roads run along the hook, the same way the pull runs</text>
  <rect x="60" y="100" width="20" height="300" fill="url(#hatch)"/>
  <text x="70" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#475569">wall</text>
  <g transform="translate(80,120)">
    <use href="#hook" fill="#fde68a"/>
    <g clip-path="url(#clipA)" fill="none">
      <line x1="40" y1="230" x2="160" y2="110" stroke="#f59e0b" stroke-width="2"/>
      <line x1="80" y1="250" x2="200" y2="130" stroke="#f59e0b" stroke-width="2"/>
      <line x1="0" y1="190" x2="40" y2="150" stroke="#f59e0b" stroke-width="2"/>
      <line x1="0" y1="110" x2="40" y2="70" stroke="#f59e0b" stroke-width="2"/>
      <line x1="0" y1="40" x2="40" y2="0" stroke="#f59e0b" stroke-width="2"/>
      <use href="#hook" stroke="#b45309" stroke-width="22"/>
      <use href="#hook" stroke="#fbbf24" stroke-width="15"/>
      <use href="#hook" stroke="#b45309" stroke-width="8"/>
    </g>
    <use href="#hook" fill="none" stroke="#78350f" stroke-width="2.5"/>
    <!-- bucket -->
    <path d="M150,210 C150,250 150,270 112,300 M150,210 C152,250 170,270 188,300" fill="none" stroke="#475569" stroke-width="3"/>
    <path d="M100,300 H200 L190,380 H110 Z" fill="#94a3b8" stroke="#334155" stroke-width="2.5"/>
    <text x="150" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">load</text>
    <!-- pull arrows along the roads -->
    <line x1="58" y1="196" x2="98" y2="196" stroke="#b91c1c" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="36" y1="180" x2="36" y2="140" stroke="#b91c1c" stroke-width="3" marker-end="url(#arr)"/>
    <!-- jagged crack -->
    <polyline points="34,206 27,214 30,220 21,227 23,233 14,240" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 3"/>
  </g>
  <g font-family="system-ui, sans-serif">
    <rect x="300" y="122" width="180" height="96" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="390" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">On the printer bed</text>
    <path d="M318,200 L462,200 L448,184 L332,184 Z" fill="#cbd5e1"/>
    <path d="M345,193 L352,180 L360,180 L355,190 L420,190 L425,182 L433,182 L428,195 Z" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
    <text x="390" y="172" text-anchor="middle" font-size="13" fill="#475569">lying flat, top view</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">
    <text x="40" y="470" font-weight="700" fill="#166534">Stronger.</text>
    <text x="40" y="494">To break, the crack must tear across</text>
    <text x="40" y="516">the plastic roads themselves.</text>
    <text x="40" y="538" fill="#475569" font-size="15">The break surface is rough and jagged.</text>
  </g>

  <!-- Panel B -->
  <text x="540" y="52" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">B · Printed standing, as it hangs</text>
  <text x="540" y="80" font-family="system-ui, sans-serif" font-size="17" fill="#334155">Layers stack up the back plate, across the pull</text>
  <rect x="560" y="100" width="20" height="300" fill="url(#hatch)"/>
  <text x="570" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#475569">wall</text>
  <g transform="translate(580,120)">
    <g clip-path="url(#clipB)"><rect x="-5" y="-5" width="210" height="260" fill="url(#layers)"/></g>
    <use href="#hook" fill="none" stroke="#78350f" stroke-width="2.5"/>
    <path d="M150,210 C150,250 150,270 112,300 M150,210 C152,250 170,270 188,300" fill="none" stroke="#475569" stroke-width="3"/>
    <path d="M100,300 H200 L190,380 H110 Z" fill="#94a3b8" stroke="#334155" stroke-width="2.5"/>
    <text x="150" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">load</text>
    <!-- pull across the layers -->
    <line x1="22" y1="170" x2="22" y2="128" stroke="#b91c1c" stroke-width="3" marker-end="url(#arr)"/>
    <!-- clean split along one layer -->
    <line x1="-4" y1="190" x2="34" y2="190" stroke="#dc2626" stroke-width="4"/>
    <text x="48" y="186" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">splits along a layer</text>
  </g>
  <g font-family="system-ui, sans-serif">
    <rect x="800" y="122" width="180" height="96" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="890" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">On the printer bed</text>
    <line x1="815" y1="204" x2="965" y2="204" stroke="#64748b" stroke-width="3"/>
    <path d="M850,154 H856 V198 H884 V188 H890 V203 H850 Z" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
    <text x="930" y="180" text-anchor="middle" font-size="13" fill="#475569">standing up</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#0f172a">
    <text x="540" y="470" font-weight="700" fill="#b91c1c">Weaker.</text>
    <text x="540" y="494">The pull only has to unstick two layers.</text>
    <text x="540" y="516">Layer bonds are the weakest part of a print.</text>
    <text x="540" y="538" fill="#475569" font-size="15">The break surface is flat and smooth.</text>
  </g>
  <text x="980" y="572" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Layers and roads drawn thicker than real · Original ClassroomOS teaching diagram</text>
</svg>
