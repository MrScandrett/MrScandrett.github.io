<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d">
  <title id="t">Six finishing steps, with the safety rule for each</title>
  <desc id="d">Six cards in order. 1, snip supports with flush cutters, cutting away from your body, wearing safety glasses. 2, coarse sanding at 120 to 220 grit with a dust mask. 3, fine sanding at 320 to 400 grit, wet for PLA. 4, filler primer sprayed by an adult outdoors or in a ventilated booth. 5, paint in thin coats. 6, an optional clear coat to seal.</desc>
  <rect width="1000" height="600" rx="18" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif">
    <text x="40" y="50" font-size="24" font-weight="700" fill="#0f172a">From rough print to finished object</text>
    <text x="40" y="78" font-size="17" fill="#334155">The red line on each card is that step's safety rule.</text>

    <!-- card frame helper repeated -->
    <g>
      <rect x="40" y="100" width="290" height="225" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="74" cy="134" r="20" fill="#0e7490"/><text x="74" y="141" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
      <text x="104" y="141" font-size="21" font-weight="700" fill="#0f172a">Snip supports</text>
      <!-- cutter icon -->
      <g transform="translate(70,170)" stroke="#334155" stroke-width="3" fill="none">
        <path d="M0,58 L40,18 L54,4"/><path d="M16,62 L44,24 L58,8"/><circle cx="42" cy="22" r="4" fill="#334155"/>
        <path d="M0,58 q-6,10 4,14 M16,62 q2,12 12,8"/>
      </g>
      <path d="M150,230 h70" stroke="#0e7490" stroke-width="3" marker-end="url(#a1)"/>
      <text x="150" y="216" font-size="15" fill="#334155">cut away from you</text>
      <text x="58" y="276" font-size="16" fill="#0f172a">Flush cutters, small bites.</text>
      <text x="58" y="302" font-size="15" fill="#b91c1c" font-weight="700">Glasses on · blade away from body</text>
    </g>
    <g>
      <rect x="355" y="100" width="290" height="225" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="389" cy="134" r="20" fill="#0e7490"/><text x="389" y="141" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
      <text x="419" y="141" font-size="21" font-weight="700" fill="#0f172a">Sand coarse</text>
      <rect x="385" y="172" width="110" height="60" rx="6" fill="#d6b88a" stroke="#92400e" stroke-width="2"/>
      <g fill="#92400e"><circle cx="400" cy="185" r="2"/><circle cx="420" cy="196" r="2"/><circle cx="440" cy="183" r="2"/><circle cx="465" cy="200" r="2"/><circle cx="480" cy="186" r="2"/><circle cx="410" cy="215" r="2"/><circle cx="452" cy="220" r="2"/><circle cx="478" cy="218" r="2"/></g>
      <text x="515" y="198" font-size="26" font-weight="800" fill="#0f172a">120</text>
      <text x="515" y="228" font-size="18" fill="#334155">→ 220 grit</text>
      <text x="373" y="276" font-size="16" fill="#0f172a">Knock down scars and ridges.</text>
      <text x="373" y="302" font-size="15" fill="#b91c1c" font-weight="700">Dust mask on · don't blow the dust</text>
    </g>
    <g>
      <rect x="670" y="100" width="290" height="225" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="704" cy="134" r="20" fill="#0e7490"/><text x="704" y="141" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
      <text x="734" y="141" font-size="21" font-weight="700" fill="#0f172a">Sand fine</text>
      <rect x="700" y="172" width="110" height="60" rx="6" fill="#9ca3af" stroke="#374151" stroke-width="2"/>
      <path d="M720,166 q6,-12 12,0 q-6,10 -12,0z M760,160 q6,-12 12,0 q-6,10 -12,0z" fill="#38bdf8"/>
      <text x="830" y="198" font-size="26" font-weight="800" fill="#0f172a">320</text>
      <text x="830" y="228" font-size="18" fill="#334155">→ 400, wet</text>
      <text x="688" y="276" font-size="16" fill="#0f172a">Water keeps PLA cool and</text>
      <text x="688" y="298" font-size="16" fill="#0f172a">holds the dust down.</text>
      <text x="688" y="318" font-size="15" fill="#b91c1c" font-weight="700">Light pressure: heat softens PLA</text>
    </g>
    <g>
      <rect x="40" y="345" width="290" height="225" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="74" cy="379" r="20" fill="#0e7490"/><text x="74" y="386" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">4</text>
      <text x="104" y="386" font-size="21" font-weight="700" fill="#0f172a">Filler primer</text>
      <rect x="70" y="420" width="36" height="70" rx="8" fill="#6b7280"/><rect x="78" y="408" width="20" height="14" rx="3" fill="#374151"/>
      <g fill="#9ca3af"><circle cx="122" cy="420" r="3"/><circle cx="134" cy="428" r="3"/><circle cx="130" cy="412" r="2.5"/><circle cx="146" cy="418" r="2.5"/><circle cx="144" cy="434" r="2"/></g>
      <text x="170" y="430" font-size="16" fill="#334155">fills layer lines;</text>
      <text x="170" y="452" font-size="16" fill="#334155">sand at 400 when dry</text>
      <text x="58" y="520" font-size="16" fill="#0f172a">2–3 light coats, not one heavy one.</text>
      <text x="58" y="546" font-size="15" fill="#b91c1c" font-weight="700">Adult sprays · outdoors or vented booth</text>
    </g>
    <g>
      <rect x="355" y="345" width="290" height="225" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="389" cy="379" r="20" fill="#0e7490"/><text x="389" y="386" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">5</text>
      <text x="419" y="386" font-size="21" font-weight="700" fill="#0f172a">Paint</text>
      <rect x="390" y="440" width="70" height="10" rx="4" fill="#92400e" transform="rotate(-30 390 440)"/>
      <path d="M452,402 l16,-10 l10,16 l-16,10 z" fill="#2563eb"/>
      <rect x="500" y="420" width="26" height="40" rx="4" fill="#dc2626"/><rect x="532" y="420" width="26" height="40" rx="4" fill="#facc15"/><rect x="564" y="420" width="26" height="40" rx="4" fill="#2563eb"/>
      <text x="373" y="520" font-size="16" fill="#0f172a">Acrylic, thin coats, dry between.</text>
      <text x="373" y="546" font-size="15" fill="#b91c1c" font-weight="700">Water-based paint for student work</text>
    </g>
    <g>
      <rect x="670" y="345" width="290" height="225" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="704" cy="379" r="20" fill="#0e7490"/><text x="704" y="386" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">6</text>
      <text x="734" y="386" font-size="21" font-weight="700" fill="#0f172a">Seal (optional)</text>
      <path d="M720,470 q40,-60 80,0 q-40,30 -80,0z" fill="#fde68a" stroke="#78350f" stroke-width="2"/>
      <path d="M716,468 q44,-70 88,0" fill="none" stroke="#7dd3fc" stroke-width="5" opacity="0.8"/>
      <text x="820" y="440" font-size="16" fill="#334155">clear coat</text>
      <text x="820" y="462" font-size="16" fill="#334155">protects paint</text>
      <text x="688" y="520" font-size="16" fill="#0f172a">A coat does not make a print</text>
      <text x="688" y="542" font-size="16" fill="#0f172a">safe for food.</text>
      <text x="688" y="562" font-size="15" fill="#b91c1c" font-weight="700">Adult sprays · ventilated</text>
    </g>
    <defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0e7490"/></marker></defs>
    <text x="960" y="592" text-anchor="end" font-size="12" fill="#64748b">Original ClassroomOS teaching diagram</text>
  </g>
</svg>
