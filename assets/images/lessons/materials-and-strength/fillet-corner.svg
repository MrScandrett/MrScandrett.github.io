<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
  <title id="t">Sharp inside corner versus fillet</title>
  <desc id="d">Two close-ups of the inside corner where a hook's arm meets its back plate. On the left the corner is sharp: the lines of force crowd together at the corner point, which glows red, and a crack starts there. On the right the corner is rounded with a fillet: the lines of force turn the corner gradually and spread out.</desc>
  <defs>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sharpClip"><path d="M60,70 H200 V280 H440 V420 H60 Z"/></clipPath>
    <clipPath id="filletClip"><path d="M560,70 H700 V220 A60,60 0 0 0 760,280 H940 V420 H560 Z"/></clipPath>
  </defs>
  <rect width="1000" height="520" rx="18" fill="#ffffff"/>
  <line x1="500" y1="30" x2="500" y2="490" stroke="#e5e7eb" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <text x="40" y="50" font-size="24" font-weight="700" fill="#0f172a">Sharp inside corner</text>
    <text x="540" y="50" font-size="24" font-weight="700" fill="#0f172a">Fillet: a rounded inside corner</text>

    <!-- sharp -->
    <path d="M60,70 H200 V280 H440 V420 H60 Z" fill="#fde68a" stroke="#78350f" stroke-width="3"/>
    <g clip-path="url(#sharpClip)">
      <circle cx="200" cy="280" r="70" fill="url(#hot)"/>
      <g fill="none" stroke="#0e7490" stroke-width="2.5">
        <path d="M194,70 V282 Q194,286 198,286 H440"/>
        <path d="M184,70 V288 Q184,296 192,296 H440"/>
        <path d="M168,70 V300 Q168,312 180,312 H440"/>
        <path d="M140,70 V320 Q140,340 160,340 H440"/>
        <path d="M105,70 V345 Q105,375 135,375 H440"/>
      </g>
    </g>
    <polyline points="200,280 188,292 192,300 178,312" fill="none" stroke="#b91c1c" stroke-width="4"/>
    <text x="226" y="252" font-size="18" font-weight="700" fill="#b91c1c">force lines crowd here</text>
    <text x="226" y="274" font-size="16" fill="#7f1d1d">so cracks start here</text>
    <text x="40" y="460" font-size="17" fill="#0f172a">The pull has to turn 90° in no space at all.</text>
    <text x="40" y="484" font-size="17" fill="#0f172a">Stress piles up at one point, many times the average.</text>

    <!-- fillet -->
    <path d="M560,70 H700 V220 A60,60 0 0 0 760,280 H940 V420 H560 Z" fill="#fde68a" stroke="#78350f" stroke-width="3"/>
    <g clip-path="url(#filletClip)">
      <circle cx="718" cy="262" r="80" fill="url(#warm)"/>
      <g fill="none" stroke="#0e7490" stroke-width="2.5">
        <path d="M692,70 V220 A68,68 0 0 0 760,288 H940"/>
        <path d="M676,70 V220 A84,84 0 0 0 760,304 H940"/>
        <path d="M656,70 V220 A104,104 0 0 0 760,324 H940"/>
        <path d="M630,70 V220 A130,130 0 0 0 760,350 H940"/>
        <path d="M598,70 V220 A162,162 0 0 0 760,382 H940"/>
      </g>
    </g>
    <path d="M700,220 A60,60 0 0 0 760,280" fill="none" stroke="#0e7490" stroke-width="6"/>
    <line x1="760" y1="220" x2="718" y2="262" stroke="#334155" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="772" y="214" font-size="18" font-weight="700" fill="#0e7490">radius</text>
    <text x="786" y="252" font-size="16" fill="#334155">stress turns gradually</text>
    <text x="540" y="460" font-size="17" fill="#0f172a">The curve gives the pull room to turn.</text>
    <text x="540" y="484" font-size="17" fill="#0f172a">Same plastic, lower peak stress, stronger hook.</text>
    <text x="960" y="508" text-anchor="end" font-size="12" fill="#64748b">Lines of force sketched, not calculated · Original ClassroomOS teaching diagram</text>
  </g>
</svg>
