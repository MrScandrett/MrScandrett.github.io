<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t d">
  <title id="t">Overhang angles</title>
  <desc id="d">Five printed walls leaning at 0, 30, 45, 60 and 80 degrees from vertical, each built from stacked layers. Up to about 45 degrees each layer rests mostly on the one below. At 60 degrees the edges droop, and at 80 degrees the layers hang in air and need support.</desc>
  <rect width="1000" height="460" rx="18" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif">
    <text x="40" y="50" font-size="24" font-weight="700" fill="#0f172a">Each new layer needs something under it</text>
    <text x="40" y="78" font-size="17" fill="#334155">Angle measured from straight up. Layers drawn about 5× thicker than real.</text>
    <line x1="30" y1="360" x2="970" y2="360" stroke="#64748b" stroke-width="4"/>
    <text x="960" y="384" text-anchor="end" font-size="14" fill="#475569">printer bed</text>

    <!-- 0 deg -->
    <g fill="#fcd34d" stroke="#b45309" stroke-width="1.5">
      <rect x="70" y="346" width="56" height="14"/><rect x="70" y="332" width="56" height="14"/><rect x="70" y="318" width="56" height="14"/><rect x="70" y="304" width="56" height="14"/><rect x="70" y="290" width="56" height="14"/><rect x="70" y="276" width="56" height="14"/><rect x="70" y="262" width="56" height="14"/><rect x="70" y="248" width="56" height="14"/><rect x="70" y="234" width="56" height="14"/><rect x="70" y="220" width="56" height="14"/>
    </g>
    <!-- 30 deg: shift 8 per layer -->
    <g fill="#fcd34d" stroke="#b45309" stroke-width="1.5">
      <rect x="230" y="346" width="56" height="14"/><rect x="238" y="332" width="56" height="14"/><rect x="246" y="318" width="56" height="14"/><rect x="254" y="304" width="56" height="14"/><rect x="262" y="290" width="56" height="14"/><rect x="270" y="276" width="56" height="14"/><rect x="278" y="262" width="56" height="14"/><rect x="286" y="248" width="56" height="14"/><rect x="294" y="234" width="56" height="14"/><rect x="302" y="220" width="56" height="14"/>
    </g>
    <!-- 45 deg: shift 14 per layer -->
    <g fill="#fcd34d" stroke="#b45309" stroke-width="1.5">
      <rect x="410" y="346" width="56" height="14"/><rect x="424" y="332" width="56" height="14"/><rect x="438" y="318" width="56" height="14"/><rect x="452" y="304" width="56" height="14"/><rect x="466" y="290" width="56" height="14"/><rect x="480" y="276" width="56" height="14"/><rect x="494" y="262" width="56" height="14"/><rect x="508" y="248" width="56" height="14"/><rect x="522" y="234" width="56" height="14"/><rect x="536" y="220" width="56" height="14"/>
    </g>
    <!-- 60 deg: shift 24, overhang edge droops -->
    <g fill="#fcd34d" stroke="#b45309" stroke-width="1.5">
      <rect x="620" y="346" width="56" height="14"/><rect x="644" y="332" width="56" height="14"/><rect x="668" y="318" width="56" height="14"/><rect x="692" y="304" width="56" height="14"/><rect x="716" y="290" width="56" height="14"/><rect x="740" y="276" width="56" height="14"/>
    </g>
    <g fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5">
      <path d="M676,346 h24 v6 q-12,10 -24,4 z"/><path d="M700,332 h24 v6 q-12,10 -24,4 z"/><path d="M724,318 h24 v6 q-12,10 -24,4 z"/><path d="M748,304 h24 v6 q-12,10 -24,4 z"/><path d="M772,290 h24 v6 q-12,10 -24,4 z"/>
    </g>
    <!-- 80 deg -->
    <g fill="#fcd34d" stroke="#b45309" stroke-width="1.5">
      <rect x="840" y="346" width="56" height="14"/>
    </g>
    <path d="M896,332 h56 v14 h-56 z" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5" transform="rotate(14 896 346)"/>
    <path d="M920,300 c10,10 20,20 30,22" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- angle guides -->
    <g stroke="#0e7490" stroke-width="2" fill="none" stroke-dasharray="6 4">
      <line x1="98" y1="360" x2="98" y2="196"/>
      <line x1="258" y1="360" x2="258" y2="196"/><line x1="258" y1="360" x2="352" y2="196"/>
      <line x1="438" y1="360" x2="438" y2="196"/><line x1="438" y1="360" x2="602" y2="196"/>
      <line x1="648" y1="360" x2="648" y2="196"/><line x1="648" y1="360" x2="818" y2="262"/>
    </g>
    <g font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">
      <text x="98" y="184">0°</text><text x="300" y="184">30°</text><text x="510" y="184">45°</text><text x="725" y="184">60°</text><text x="905" y="184">80°</text>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="98" y="412" fill="#166534" font-weight="700">fine</text>
      <text x="300" y="412" fill="#166534" font-weight="700">fine</text>
      <text x="510" y="412" fill="#a16207" font-weight="700">about the limit</text>
      <text x="725" y="412" fill="#b91c1c" font-weight="700">edges droop</text>
      <text x="905" y="412" fill="#b91c1c" font-weight="700">needs support</text>
      <text x="510" y="436" fill="#334155" font-size="15">half of each line still sits on the layer below</text>
    </g>
    <text x="960" y="452" text-anchor="end" font-size="12" fill="#64748b">Your printer's real limit depends on cooling, speed and plastic: test it · Original ClassroomOS teaching diagram</text>
  </g>
</svg>
