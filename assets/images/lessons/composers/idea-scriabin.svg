<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="scriabin-idea-title scriabin-idea-desc">
  <title id="scriabin-idea-title">Scriabin's Mystic Chord and Harmonic Color Field</title>
  <desc id="scriabin-idea-desc">Diagram comparing a standard C-major triad with Alexander Scriabin's six-note mystic chord (C, F-sharp, B-flat, E, A, D) stacked in fourths, paired with his personal circle-of-fifths key-to-color wheel.</desc>
  <rect width="860" height="330" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#1e293b" />
  <text x="38" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fde68a">HARMONY AS A FIELD OF COLOR · TRIAD VS. MYSTIC CHORD</text>

  <!-- Left: Triad vs Mystic Chord Stack -->
  <rect x="24" y="70" width="230" height="206" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.6" />
  <text x="40" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#93c5fd">CONVENTIONAL TRIAD</text>
  <text x="40" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">Stacked in thirds (clear pull)</text>
  <rect x="44" y="138" width="190" height="30" rx="6" fill="#1d4ed8" /><text x="139" y="158" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#fff">G (5th)</text>
  <rect x="44" y="176" width="190" height="30" rx="6" fill="#2563eb" /><text x="139" y="196" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#fff">E (Major 3rd)</text>
  <rect x="44" y="214" width="190" height="30" rx="6" fill="#3b82f6" /><text x="139" y="234" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#fff">C (Tonic Root)</text>

  <!-- Center: Mystic Chord Stack of 4ths -->
  <rect x="272" y="70" width="268" height="206" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
  <text x="288" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#e9d5ff">SCRIABIN'S MYSTIC CHORD</text>
  <text x="288" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">Six pitches stacked in fourths (suspended)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="#fff">
    <rect x="292" y="124" width="228" height="21" rx="5" fill="#7e22ce" /><text x="406" y="139" text-anchor="middle">D · Perfect 4th above A</text>
    <rect x="292" y="149" width="228" height="21" rx="5" fill="#6b21a8" /><text x="406" y="164" text-anchor="middle">A · Perfect 4th above E</text>
    <rect x="292" y="174" width="228" height="21" rx="5" fill="#0e7490" /><text x="406" y="189" text-anchor="middle">E · Augmented 4th above B♭</text>
    <rect x="292" y="199" width="228" height="21" rx="5" fill="#0f766e" /><text x="406" y="214" text-anchor="middle">B♭ · Diminished 4th above F♯</text>
    <rect x="292" y="224" width="228" height="21" rx="5" fill="#b45309" /><text x="406" y="239" text-anchor="middle">F♯ · Augmented 4th above C</text>
    <rect x="292" y="249" width="228" height="21" rx="5" fill="#b91c1c" /><text x="406" y="264" text-anchor="middle">C · Bass Resonance</text>
  </g>

  <!-- Right: Personal Synesthesia Wheel (1911 Clavier à lumières) -->
  <rect x="558" y="70" width="278" height="206" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.6" />
  <text x="574" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fde68a">PROMETHEUS KEY WHEEL</text>
  <text x="574" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#cbd5e1">Scriabin's personal key-color map</text>
  <circle cx="697" cy="192" r="56" fill="none" stroke="#475569" stroke-width="1.5" />
  <g font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">
    <circle cx="697" cy="136" r="14" fill="#dc2626" /><text x="697" y="140" fill="#fff">C</text>
    <circle cx="725" cy="144" r="14" fill="#ea580c" /><text x="725" y="148" fill="#fff">G</text>
    <circle cx="746" cy="164" r="14" fill="#eab308" /><text x="746" y="168" fill="#111">D</text>
    <circle cx="753" cy="192" r="14" fill="#16a34a" /><text x="753" y="196" fill="#fff">A</text>
    <circle cx="746" cy="220" r="14" fill="#38bdf8" /><text x="746" y="224" fill="#0f172a">E</text>
    <circle cx="725" cy="240" r="14" fill="#3b82f6" /><text x="725" y="244" fill="#fff">B</text>
    <circle cx="697" cy="248" r="14" fill="#4f46e5" /><text x="697" y="252" fill="#fff">F♯</text>
    <circle cx="669" cy="240" r="14" fill="#9333ea" /><text x="669" y="244" fill="#fff">D♭</text>
    <circle cx="648" cy="220" r="14" fill="#a855f7" /><text x="648" y="224" fill="#fff">A♭</text>
    <circle cx="641" cy="192" r="14" fill="#94a3b8" /><text x="641" y="196" fill="#0f172a">E♭</text>
    <circle cx="648" cy="164" r="14" fill="#cbd5e1" /><text x="648" y="168" fill="#0f172a">B♭</text>
    <circle cx="669" cy="144" r="14" fill="#b91c1c" /><text x="669" y="148" fill="#fff">F</text>
  </g>
  <text x="697" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#cbd5e1">5ths</text>

  <text x="24" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" fill="#cbd5e1">Imagined colors are personal artistic associations, not a universal acoustic law—yet fourth-based chords truly suspend harmonic gravity.</text>
</svg>