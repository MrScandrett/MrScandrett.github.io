<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="schumann-idea-title schumann-idea-desc">
  <title id="schumann-idea-title">Schumann's Character Pieces: Contrasting Personalities in Miniature</title>
  <desc id="schumann-idea-desc">Side-by-side comparison of Robert Schumann's two signature character voices—Eusebius (lyrical, legato, inward) and Florestan (impulsive, rhythmic, bold)—showing how articulation, tempo, and dynamics shape musical storytelling in a short piece.</desc>
  <rect width="860" height="320" rx="16" fill="#fffaf3" stroke="#d6c3aa" stroke-width="2" />
  <rect x="20" y="16" width="820" height="40" rx="10" fill="#1e293b" />
  <text x="38" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fef3c7">CHARACTER PIECES · TWO CONTRASTING VOICES IN ONE MINIATURE ALBUM</text>

  <!-- Eusebius Panel -->
  <rect x="24" y="72" width="394" height="202" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" />
  <text x="44" y="100" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#1e3a8a">Eusebius · The Dreamer</text>
  <text x="44" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">“Träumerei” / “Melodie” · Legato &amp; Inward</text>
  <!-- Smooth Slurred Phrase Arc -->
  <path d="M 48 168 Q 130 132 212 162 T 376 154" fill="none" stroke="#2563eb" stroke-width="3" />
  <circle cx="48" cy="168" r="5" fill="#1e3a8a" /><circle cx="130" cy="148" r="5" fill="#1e3a8a" />
  <circle cx="212" cy="162" r="5" fill="#1e3a8a" /><circle cx="294" cy="166" r="5" fill="#1e3a8a" />
  <circle cx="376" cy="154" r="5" fill="#1e3a8a" />
  <rect x="44" y="192" width="354" height="66" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="58" y="213" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b"><tspan font-weight="700">Articulation:</tspan> connected slurs (legato), gentle pedal</text>
  <text x="58" y="231" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b"><tspan font-weight="700">Rhythm:</tspan> unhurried pulse, subtle rubato stretch</text>
  <text x="58" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b"><tspan font-weight="700">Dynamics:</tspan> p to mp, warm middle register</text>

  <!-- Florestan Panel -->
  <rect x="442" y="72" width="394" height="202" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2" />
  <text x="462" y="100" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#7c2d12">Florestan · The Impulsive Spark</text>
  <text x="462" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#c2410c">“The Wild Rider” / “Soldier's March” · Crisp &amp; Driven</text>
  <!-- Angular Staccato Rhythm -->
  <polyline points="466,174 504,148 542,174 580,142 618,170 656,138 694,168 732,144 770,164" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3" />
  <g fill="#9a3412">
    <polygon points="466,162 472,172 460,172" /><polygon points="504,136 510,146 498,146" />
    <polygon points="580,130 586,140 574,140" /><polygon points="656,126 662,136 650,136" />
    <polygon points="732,132 738,142 726,142" />
  </g>
  <rect x="462" y="192" width="354" height="66" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" />
  <text x="476" y="213" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b"><tspan font-weight="700">Articulation:</tspan> crisp staccato &amp; marked accents (&gt;)</text>
  <text x="476" y="231" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b"><tspan font-weight="700">Rhythm:</tspan> brisk compound meter or marching snap</text>
  <text x="476" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b"><tspan font-weight="700">Dynamics:</tspan> sharp sfz bursts and wide leaps</text>

  <text x="24" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Even without changing the pitch sequence, articulation, tempo, and dynamics can turn one tune into two vivid characters.</text>
</svg>