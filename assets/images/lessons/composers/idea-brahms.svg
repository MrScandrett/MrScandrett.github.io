<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="brahms-idea-title brahms-idea-desc">
  <title id="brahms-idea-title">Developing Variation and Hemiola in Johannes Brahms</title>
  <desc id="brahms-idea-desc">Diagram showing how Brahms develops a short three-note motif through inversion, rhythmic stretching, and sequence—alongside a metric grid contrasting 3/4 waltz beats against a 2-against-3 cross-rhythm hemiola.</desc>
  <rect width="860" height="330" rx="16" fill="#fffaf3" stroke="#d6c3aa" stroke-width="2" />
  <rect x="20" y="16" width="820" height="40" rx="10" fill="#3b2314" />
  <text x="38" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fde68a">DEVELOPING VARIATION · GROWING A PIECE FROM ONE TINY CELL</text>

  <!-- Left: Developing Variation Tree -->
  <rect x="24" y="72" width="460" height="206" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.8" />
  <text x="42" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#7c2d12">1. MOTIF GROWTH (Developing Variation)</text>

  <!-- Seed Cell -->
  <rect x="42" y="112" width="128" height="148" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
  <text x="54" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#92400e">SEED CELL</text>
  <polyline points="62,188 102,168 142,178" fill="none" stroke="#92400e" stroke-width="3" />
  <circle cx="62" cy="188" r="5" fill="#7c2d12" /><circle cx="102" cy="168" r="5" fill="#7c2d12" /><circle cx="142" cy="178" r="5" fill="#7c2d12" />
  <text x="54" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#451a03">Up a 3rd, down a step.</text>
  <text x="54" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#451a03">Everything in the phrase</text>
  <text x="54" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#451a03">evolves from this cell.</text>

  <!-- Three Evolutions -->
  <rect x="192" y="112" width="274" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="204" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Sequence (shifted higher)</text>
  <text x="204" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Same shape climbs step by step to a climax</text>

  <rect x="192" y="165" width="274" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="204" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#166534">Inversion (flipped upside down)</text>
  <text x="204" y="199" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Down a 3rd, up a step—an answering echo</text>

  <rect x="192" y="218" width="274" height="42" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5" />
  <text x="204" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7e22ce">Augmentation (stretched values)</text>
  <text x="204" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Becomes a slow, noble bass line underneath</text>

  <!-- Right: Cross-Rhythm / Hemiola Grid -->
  <rect x="500" y="72" width="336" height="206" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
  <text x="518" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0f172a">2. LAYERED RHYTHM (Hemiola: 2 vs. 3)</text>
  <text x="518" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Six eighth-notes grouped two ways at once:</text>

  <text x="518" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">3 groups of 2 (feels like 3/4)</text>
  <rect x="518" y="149" width="96" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" /><text x="566" y="167" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1e3a8a">1  2</text>
  <rect x="620" y="149" width="96" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" /><text x="668" y="167" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1e3a8a">3  4</text>
  <rect x="722" y="149" width="96" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" /><text x="770" y="167" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1e3a8a">5  6</text>

  <text x="518" y="203" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#b45309">2 groups of 3 (feels like 6/8)</text>
  <rect x="518" y="210" width="147" height="28" rx="6" fill="#fef3c7" stroke="#d97706" /><text x="591" y="228" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#7c2d12">1  2  3</text>
  <rect x="671" y="210" width="147" height="28" rx="6" fill="#fef3c7" stroke="#d97706" /><text x="744" y="228" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#7c2d12">4  5  6</text>

  <text x="518" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Layering both accents keeps steady beats buoyant.</text>

  <text x="24" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Instead of introducing unrelated tunes, Brahms transforms one small cell and shifts its rhythmic grouping underneath.</text>
</svg>