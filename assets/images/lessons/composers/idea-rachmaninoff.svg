<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="rach-idea-title rach-idea-desc">
  <title id="rach-idea-title">Three-Layer Piano Texture in Rachmaninoff</title>
  <desc id="rach-idea-desc">Cross-section diagram showing how Rachmaninoff distributes a dense piano texture across three acoustic registers: a projecting singing melody on top, wide sweeping arpeggiated harmony in the middle, and sustained resonant bass roots at the bottom.</desc>
  <rect width="860" height="330" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect x="20" y="16" width="820" height="40" rx="10" fill="#0f172a" />
  <text x="38" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#e2e8f0">VOICING A DENSE TEXTURE · THREE REGISTER LAYERS AT ONE KEYBOARD</text>

  <!-- Layer 1: Singing Melody -->
  <rect x="24" y="72" width="590" height="68" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <text x="40" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#92400e">LAYER 1 · SINGING MELODY (Right-Hand Top Fingers · mf / f)</text>
  <path d="M 42 122 C 120 96, 210 128, 300 104 C 390 84, 480 120, 585 102" fill="none" stroke="#92400e" stroke-width="3.2" />
  <circle cx="42" cy="122" r="5" fill="#92400e" /><circle cx="165" cy="108" r="5" fill="#92400e" /><circle cx="300" cy="104" r="5" fill="#92400e" /><circle cx="435" cy="100" r="5" fill="#92400e" /><circle cx="585" cy="102" r="5" fill="#92400e" />

  <!-- Layer 2: Wide Broken-Chord Accompaniment -->
  <rect x="24" y="150" width="590" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="40" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">LAYER 2 · WIDE ARPEGGIO FILL (Inner Fingers &amp; Left Hand · pp / mp)</text>
  <path d="M 45 208 Q 75 178 105 208 T 165 208 T 225 208 T 285 208 T 345 208 T 405 208 T 465 208 T 525 208 T 585 208" fill="none" stroke="#3b82f6" stroke-width="2.2" />

  <!-- Layer 3: Resonant Bass Pedal -->
  <rect x="24" y="232" width="590" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.8" />
  <text x="40" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0f172a">LAYER 3 · RESONANT BASS FOUNDATION (Deep Left Hand + Damper Pedal)</text>
  <rect x="44" y="264" width="140" height="10" rx="5" fill="#334155" />
  <rect x="235" y="264" width="150" height="10" rx="5" fill="#334155" />
  <rect x="435" y="264" width="150" height="10" rx="5" fill="#334155" />

  <!-- Balance Meter Card -->
  <rect x="632" y="72" width="204" height="214" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8" />
  <text x="648" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0f172a">PIANIST BALANCE</text>
  <text x="648" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400e">Melody (Top)</text>
  <rect x="648" y="132" width="168" height="12" rx="6" fill="#e2e8f0" />
  <rect x="648" y="132" width="142" height="12" rx="6" fill="#d97706" />

  <text x="648" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Arpeggios (Middle)</text>
  <rect x="648" y="176" width="168" height="12" rx="6" fill="#e2e8f0" />
  <rect x="648" y="176" width="66" height="12" rx="6" fill="#3b82f6" />

  <text x="648" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155">Bass Roots (Bottom)</text>
  <rect x="648" y="220" width="168" height="12" rx="6" fill="#e2e8f0" />
  <rect x="648" y="220" width="108" height="12" rx="6" fill="#475569" />

  <text x="648" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Firm pinky weight lets the tune</text>
  <text x="648" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">float cleanly above the middle waves.</text>

  <text x="24" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Notice how the outer voices frame the harmony: the bass anchors the chord while the top line sings smoothly across barlines.</text>
</svg>