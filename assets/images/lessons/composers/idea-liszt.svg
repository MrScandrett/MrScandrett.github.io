<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="liszt-idea-title liszt-idea-desc">
  <title id="liszt-idea-title">Thematic Transformation in Franz Liszt's Music</title>
  <desc id="liszt-idea-desc">Diagram showing how a single four-note rising-and-falling contour transforms into three contrasting characters—a singing lullaby, a heroic march, and a turbulent storm—by changing rhythm, register, dynamics, and accompaniment while preserving its melodic shape.</desc>
  <defs>
    <marker id="liszt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c2d12" />
    </marker>
  </defs>
  <rect width="860" height="330" rx="16" fill="#fffaf3" stroke="#d6c3aa" stroke-width="2" />
  <rect x="20" y="16" width="820" height="40" rx="10" fill="#2c1810" />
  <text x="38" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fde68a">THEMATIC TRANSFORMATION · ONE MELODIC CONTOUR, THREE MUSICAL WORLDS</text>

  <!-- Source Cell -->
  <rect x="24" y="76" width="210" height="196" rx="12" fill="#ffffff" stroke="#7c2d12" stroke-width="2.2" />
  <text x="40" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#7c2d12">CORE THEME SHAPE</text>
  <text x="40" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">Step up, leap up, step down</text>
  <!-- 5-line staff -->
  <g stroke="#cbd5e1" stroke-width="1.2">
    <line x1="40" y1="145" x2="218" y2="145" />
    <line x1="40" y1="156" x2="218" y2="156" />
    <line x1="40" y1="167" x2="218" y2="167" />
    <line x1="40" y1="178" x2="218" y2="178" />
    <line x1="40" y1="189" x2="218" y2="189" />
  </g>
  <polyline points="68,183 108,172 152,150 192,161" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="4 3" />
  <circle cx="68" cy="183" r="6" fill="#7c2d12" />
  <circle cx="108" cy="172" r="6" fill="#7c2d12" />
  <circle cx="152" cy="150" r="6" fill="#7c2d12" />
  <circle cx="192" cy="161" r="6" fill="#7c2d12" />
  <text x="40" y="218" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1e293b">Contour: +2, +4, −2</text>
  <text x="40" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">The pitch skeleton stays</text>
  <text x="40" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">recognizable everywhere.</text>

  <!-- Branch Arrows -->
  <path d="M 236 125 C 266 125, 266 108, 294 108" fill="none" stroke="#7c2d12" stroke-width="2.2" marker-end="url(#liszt-arrow)" />
  <path d="M 236 174 L 294 174" fill="none" stroke="#7c2d12" stroke-width="2.2" marker-end="url(#liszt-arrow)" />
  <path d="M 236 222 C 266 222, 266 240, 294 240" fill="none" stroke="#7c2d12" stroke-width="2.2" marker-end="url(#liszt-arrow)" />

  <!-- Transformation 1: Lullaby -->
  <rect x="302" y="74" width="534" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="318" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">1. SINGING NOCTURNE (Cantabile)</text>
  <text x="318" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Long notes, soft dynamics (p), middle register, flowing triplets underneath</text>
  <polyline points="722,116 748,108 778,90 806,99" fill="none" stroke="#2563eb" stroke-width="2.5" />
  <circle cx="722" cy="116" r="4.5" fill="#1d4ed8" /><circle cx="748" cy="108" r="4.5" fill="#1d4ed8" />
  <circle cx="778" cy="90" r="4.5" fill="#1d4ed8" /><circle cx="806" cy="99" r="4.5" fill="#1d4ed8" />

  <!-- Transformation 2: Heroic March -->
  <rect x="302" y="144" width="534" height="60" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8" />
  <text x="318" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#92400e">2. HEROIC MARCH (Maestoso)</text>
  <text x="318" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Crisp dotted rhythms, loud brass/octaves (ff), steady striding bass</text>
  <polyline points="722,186 742,178 766,160 796,169" fill="none" stroke="#b45309" stroke-width="3" />
  <rect x="718" y="182" width="8" height="8" fill="#92400e" /><rect x="738" y="174" width="8" height="8" fill="#92400e" />
  <rect x="762" y="156" width="8" height="8" fill="#92400e" /><rect x="792" y="165" width="8" height="8" fill="#92400e" />

  <!-- Transformation 3: Stormy Scherzo -->
  <rect x="302" y="214" width="534" height="60" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8" />
  <text x="318" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#991b1b">3. STORMY FINALE (Agitato)</text>
  <text x="318" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">Fast staccato notes, minor-key chromatic harmony, surging low tremolos</text>
  <polyline points="722,256 736,246 752,226 770,238 784,256 798,246 814,226" fill="none" stroke="#dc2626" stroke-width="2.2" />
  <circle cx="722" cy="256" r="3.5" fill="#991b1b" /><circle cx="752" cy="226" r="3.5" fill="#991b1b" /><circle cx="814" cy="226" r="3.5" fill="#991b1b" />

  <text x="24" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Listening clue: keep tracking the interval contour (+2, +4, −2) even when tempo, accompaniment, and mood shift dramatically.</text>
</svg>