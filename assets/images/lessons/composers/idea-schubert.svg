<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="schubert-idea-title schubert-idea-desc">
  <title id="schubert-idea-title">Franz Schubert's Lieder: Voice and Piano as Equal Storytellers</title>
  <desc id="schubert-idea-desc">Diagram illustrating how Schubert pairs a vocal melody with descriptive piano motifs—such as the spinning wheel in Gretchen am Spinnrade, galloping hooves in Erlkönig, and rippling water in Die Forelle—so the accompaniment portrays the unseen scene.</desc>
  <rect width="860" height="330" rx="16" fill="#fffaf3" stroke="#d6c3aa" stroke-width="2" />
  <rect x="20" y="16" width="820" height="40" rx="10" fill="#1e293b" />
  <text x="38" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fde68a">THE GERMAN LIED · POETRY + VOICE + PIANO STORYTELLING</text>

  <!-- Upper Track: Voice -->
  <rect x="24" y="72" width="812" height="72" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <text x="42" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#92400e">VOCAL LINE · THE CHARACTER SPEAKING THE POEM</text>
  <path d="M 48 124 C 150 100, 260 130, 390 112 C 510 96, 650 128, 795 110" fill="none" stroke="#92400e" stroke-width="2.8" />
  <text x="42" y="132" font-family="Georgia, serif" font-size="11.5" font-style="italic" fill="#451a03">Carries the words, mood shifts, and dialogue between narrator and characters.</text>

  <!-- Lower Track: 3 Piano Storytelling Scenes -->
  <text x="24" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0f172a">PIANO ACCOMPANIMENT · PAINTS THE UNSEEN ACTION &amp; SETTING</text>

  <!-- Scene 1: Gretchen -->
  <rect x="24" y="180" width="260" height="104" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" />
  <text x="40" y="203" font-family="Georgia, serif" font-size="13.5" font-weight="700" fill="#1e3a8a">Gretchen am Spinnrade</text>
  <circle cx="72" cy="242" r="22" fill="none" stroke="#2563eb" stroke-width="2.2" />
  <path d="M 72 220 L 72 264 M 50 242 L 94 242 M 57 227 L 87 257 M 87 227 L 57 257" stroke="#60a5fa" stroke-width="1.5" />
  <text x="108" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Circular 16th-note spin</text>
  <text x="108" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Stops suddenly when she</text>
  <text x="108" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">pauses, lost in thought.</text>

  <!-- Scene 2: Erlkönig -->
  <rect x="300" y="180" width="260" height="104" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8" />
  <text x="316" y="203" font-family="Georgia, serif" font-size="13.5" font-weight="700" fill="#7f1d1d">Erlkönig</text>
  <path d="M 320 250 L 332 228 L 344 250 L 356 228 L 368 250 L 380 228 L 392 250" fill="none" stroke="#dc2626" stroke-width="2.4" />
  <text x="406" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Driving octave triplets</text>
  <text x="406" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Galloping hooves &amp; wind</text>
  <text x="406" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">surge through the night.</text>

  <!-- Scene 3: Die Forelle -->
  <rect x="576" y="180" width="260" height="104" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8" />
  <text x="592" y="203" font-family="Georgia, serif" font-size="13.5" font-weight="700" fill="#115e59">Die Forelle (The Trout)</text>
  <path d="M 594 246 Q 608 228 622 246 T 650 246 T 678 246" fill="none" stroke="#0d9488" stroke-width="2.4" />
  <text x="692" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Darting rippling figures</text>
  <text x="692" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Bright water leaps until the</text>
  <text x="692" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">stream turns muddy.</text>

  <text x="24" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">In Schubert's Lieder, the piano is never passive background chords: it acts as scenery, motion, and emotional subtext.</text>
</svg>