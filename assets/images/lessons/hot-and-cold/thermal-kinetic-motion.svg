<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="th-title th-desc">
  <title id="th-title">Thermal Physics: Temperature and Kinetic Molecular Motion</title>
  <desc id="th-desc">Infographic showing atomic kinetic motion from Absolute Zero through Ice, Water, and Steam, alongside calibrated temperature scales comparing Kelvin, Celsius, and Fahrenheit.</desc>
  <defs>
    <linearGradient id="scale-temp-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#06b6d4"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#080e1a"/>
  
  <!-- Subtle Coordinate Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <path d="M0 60h960M0 120h960M0 180h960M0 240h960M0 300h960M0 360h960M0 420h960M0 480h960"/>
    <path d="M60 0v540M120 0v540M180 0v540M240 0v540M300 0v540M360 0v540M420 0v540M480 0v540M540 0v540M600 0v540M660 0v540M720 0v540M780 0v540M840 0v540M900 0v540"/>
  </g>

  <!-- Header -->
  <text x="40" y="44" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">WHAT IS TEMPERATURE? MICROSCOPIC KINETIC ENERGY</text>
  <text x="40" y="68" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Temperature is the measure of the average translational kinetic energy of atoms and molecules: E_k = ³⁄₂ k_B T</text>

  <!-- 4 Particle Chambers: y = 95, height = 210, width = 195. Spacing x = 50, 270, 490, 710 -->

  <!-- Chamber 1: Absolute Zero -->
  <g transform="translate(50, 95)">
    <rect x="0" y="0" width="195" height="210" rx="10" fill="#030712" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="10" y="10" width="175" height="24" rx="5" fill="#1e3a8a"/>
    <text x="97" y="26" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#bfdbfe" text-anchor="middle">0 K · ABSOLUTE ZERO</text>
    
    <!-- Motionless atoms -->
    <g fill="#60a5fa">
      <circle cx="50" cy="70" r="7"/><circle cx="95" cy="70" r="7"/><circle cx="140" cy="70" r="7"/>
      <circle cx="50" cy="115" r="7"/><circle cx="95" cy="115" r="7"/><circle cx="140" cy="115" r="7"/>
      <circle cx="50" cy="160" r="7"/><circle cx="95" cy="160" r="7"/><circle cx="140" cy="160" r="7"/>
    </g>
    <text x="97" y="195" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">V = 0 · Zero Kinetic Energy</text>
  </g>

  <!-- Chamber 2: Freezing / Ice -->
  <g transform="translate(270, 95)">
    <rect x="0" y="0" width="195" height="210" rx="10" fill="#081e28" stroke="#0891b2" stroke-width="2"/>
    <rect x="10" y="10" width="175" height="24" rx="5" fill="#0891b2"/>
    <text x="97" y="26" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#cffafe" text-anchor="middle">273 K · ICE (SOLID)</text>

    <!-- Vibrating atoms with vibration tick marks -->
    <g fill="#22d3ee">
      <circle cx="50" cy="70" r="7"/><circle cx="95" cy="70" r="7"/><circle cx="140" cy="70" r="7"/>
      <circle cx="50" cy="115" r="7"/><circle cx="95" cy="115" r="7"/><circle cx="140" cy="115" r="7"/>
      <circle cx="50" cy="160" r="7"/><circle cx="95" cy="160" r="7"/><circle cx="140" cy="160" r="7"/>
    </g>
    <!-- Vibration marks -->
    <path d="M40,70 h-3 M60,70 h3 M85,70 h-3 M105,70 h3 M130,70 h-3 M150,70 h3" stroke="#67e8f9" stroke-width="1.8"/>
    <path d="M40,115 h-3 M60,115 h3 M85,115 h-3 M105,115 h3 M130,115 h-3 M150,115 h3" stroke="#67e8f9" stroke-width="1.8"/>
    <path d="M40,160 h-3 M60,160 h3 M85,160 h-3 M105,160 h3 M130,160 h-3 M150,160 h3" stroke="#67e8f9" stroke-width="1.8"/>
    <text x="97" y="195" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#67e8f9" text-anchor="middle">Lattice Bond Vibrations</text>
  </g>

  <!-- Chamber 3: Room Temperature / Liquid -->
  <g transform="translate(490, 95)">
    <rect x="0" y="0" width="195" height="210" rx="10" fill="#1c160c" stroke="#d97706" stroke-width="2"/>
    <rect x="10" y="10" width="175" height="24" rx="5" fill="#d97706"/>
    <text x="97" y="26" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#fef3c7" text-anchor="middle">293 K · WATER (LIQUID)</text>

    <!-- Displaced liquid molecules with short velocity arrows -->
    <g fill="#fbbf24">
      <circle cx="45" cy="75" r="7"/><path d="M45,75 l12,-8" stroke="#fde68a" stroke-width="2"/>
      <circle cx="105" cy="65" r="7"/><path d="M105,65 l-14,6" stroke="#fde68a" stroke-width="2"/>
      <circle cx="150" cy="90" r="7"/><path d="M150,90 l-6,14" stroke="#fde68a" stroke-width="2"/>
      <circle cx="55" cy="130" r="7"/><path d="M55,130 l14,8" stroke="#fde68a" stroke-width="2"/>
      <circle cx="110" cy="120" r="7"/><path d="M110,120 l-10,-12" stroke="#fde68a" stroke-width="2"/>
      <circle cx="155" cy="145" r="7"/><path d="M155,145 l-14,-6" stroke="#fde68a" stroke-width="2"/>
      <circle cx="70" cy="168" r="7"/><path d="M70,168 l-10,12" stroke="#fde68a" stroke-width="2"/>
      <circle cx="130" cy="170" r="7"/><path d="M130,170 l12,-10" stroke="#fde68a" stroke-width="2"/>
    </g>
    <text x="97" y="195" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">Fluid Molecular Tumbling</text>
  </g>

  <!-- Chamber 4: Boiling / Gas Steam -->
  <g transform="translate(710, 95)">
    <rect x="0" y="0" width="195" height="210" rx="10" fill="#200d0d" stroke="#dc2626" stroke-width="2"/>
    <rect x="10" y="10" width="175" height="24" rx="5" fill="#dc2626"/>
    <text x="97" y="26" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#fee2e2" text-anchor="middle">373 K · STEAM (GAS)</text>

    <!-- Fast chaotic gas particles with long velocity vectors -->
    <g fill="#f87171">
      <circle cx="45" cy="80" r="6"/><path d="M45,80 l28,-18" stroke="#fca5a5" stroke-width="2.5"/><polygon points="73,62 65,65 70,72" fill="#fca5a5"/>
      <circle cx="140" cy="65" r="6"/><path d="M140,65 l-26,22" stroke="#fca5a5" stroke-width="2.5"/><polygon points="114,87 122,84 117,77" fill="#fca5a5"/>
      <circle cx="85" cy="125" r="6"/><path d="M85,125 l24,24" stroke="#fca5a5" stroke-width="2.5"/><polygon points="109,149 101,146 106,139" fill="#fca5a5"/>
      <circle cx="150" cy="155" r="6"/><path d="M150,155 l-30,-18" stroke="#fca5a5" stroke-width="2.5"/><polygon points="120,137 128,140 123,147" fill="#fca5a5"/>
      <circle cx="40" cy="170" r="6"/><path d="M40,170 l30,-12" stroke="#fca5a5" stroke-width="2.5"/><polygon points="70,158 62,161 67,168" fill="#fca5a5"/>
    </g>
    <text x="97" y="195" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">High-Speed Collisions</text>
  </g>

  <!-- Calibrated Comparative Temperature Scale Bar (y = 330 to 425) -->
  <g transform="translate(50, 335)">
    <!-- Scale Background Gradient Track -->
    <rect x="0" y="40" width="855" height="18" rx="9" fill="url(#scale-temp-grad)"/>

    <!-- Scale 1: KELVIN (Top) -->
    <text x="0" y="24" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">KELVIN (K)</text>
    <text x="0" y="10" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748b">Absolute</text>
    <!-- Mark 0 K -->
    <line x1="97" y1="32" x2="97" y2="40" stroke="#38bdf8" stroke-width="2"/>
    <text x="97" y="24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">0 K</text>
    <!-- Mark 273 K -->
    <line x1="317" y1="32" x2="317" y2="40" stroke="#22d3ee" stroke-width="2"/>
    <text x="317" y="24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5f3fc" text-anchor="middle">273.15 K</text>
    <!-- Mark 293 K -->
    <line x1="537" y1="32" x2="537" y2="40" stroke="#f59e0b" stroke-width="2"/>
    <text x="537" y="24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">293.15 K</text>
    <!-- Mark 373 K -->
    <line x1="757" y1="32" x2="757" y2="40" stroke="#ef4444" stroke-width="2"/>
    <text x="757" y="24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">373.15 K</text>

    <!-- Scale 2: CELSIUS (Bottom Left) -->
    <text x="0" y="80" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#22c55e">CELSIUS (°C)</text>
    <line x1="97" y1="58" x2="97" y2="66" stroke="#38bdf8" stroke-width="2"/>
    <text x="97" y="78" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">−273.15 °C</text>

    <line x1="317" y1="58" x2="317" y2="66" stroke="#22d3ee" stroke-width="2"/>
    <text x="317" y="78" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5f3fc" text-anchor="middle">0 °C (Freeze)</text>

    <line x1="537" y1="58" x2="537" y2="66" stroke="#f59e0b" stroke-width="2"/>
    <text x="537" y="78" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">20 °C (Room)</text>

    <line x1="757" y1="58" x2="757" y2="66" stroke="#ef4444" stroke-width="2"/>
    <text x="757" y="78" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">100 °C (Boil)</text>

    <!-- Scale 3: FAHRENHEIT -->
    <text x="0" y="98" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">FAHRENHEIT (°F)</text>
    <text x="97" y="98" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">−459.67 °F</text>
    <text x="317" y="98" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">32 °F</text>
    <text x="537" y="98" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">68 °F</text>
    <text x="757" y="98" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">212 °F</text>
  </g>

  <!-- Key Concept Summary Box -->
  <rect x="40" y="450" width="880" height="70" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <g transform="translate(60, 466)" font-family="Inter, system-ui, sans-serif">
    <!-- Point 1 -->
    <text x="0" y="16" font-size="12" font-weight="700" fill="#38bdf8">NO NEGATIVE KELVIN</text>
    <text x="0" y="34" font-size="11.5" font-weight="400" fill="#cbd5e1">0 K is absolute zero: particles cannot have less than zero kinetic energy.</text>

    <!-- Point 2 -->
    <text x="320" y="16" font-size="12" font-weight="700" fill="#fde047">HEAT FLOW DIRECTION</text>
    <text x="320" y="34" font-size="11.5" font-weight="400" fill="#cbd5e1">Thermal energy always flows spontaneously from hotter objects to colder ones.</text>

    <!-- Point 3 -->
    <text x="640" y="16" font-size="12" font-weight="700" fill="#f43f5e">CONVERSION FORMULAS</text>
    <text x="640" y="34" font-size="11.5" font-weight="400" fill="#cbd5e1">K = °C + 273.15  ·  °F = (°C × ⁹⁄₅) + 32</text>
  </g>
</svg>

