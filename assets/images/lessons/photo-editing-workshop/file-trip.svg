<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <title>What survives the trip between file formats</title>
  <desc>Four file icons in a row, from the native project file to a layered PSD, a flat PNG and a lossy JPEG. Under each, a list shows what the format keeps and what is lost on the way.</desc>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="40" y="58" font-size="34" font-weight="800" fill="#0f172a">What survives the trip?</text>
  <text x="40" y="92" font-size="20" fill="#334155">Each step to the right is easier to share and harder to edit. You can always go right; you can't come back.</text>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
  <g font-size="18">
    <g transform="translate(40 130)">
      <rect width="250" height="440" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
      <rect x="20" y="20" width="210" height="44" rx="10" fill="#2563eb"/><text x="125" y="50" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="22">.layerlab</text>
      <text x="20" y="96" font-weight="800" fill="#0f172a">Native project</text>
      <text x="20" y="134" fill="#15803d">✓ layers</text><text x="20" y="164" fill="#15803d">✓ live text &amp; shapes</text><text x="20" y="194" fill="#15803d">✓ masks</text><text x="20" y="224" fill="#15803d">✓ adjustment layers</text><text x="20" y="254" fill="#15803d">✓ layer effects</text><text x="20" y="284" fill="#15803d">✓ transparency</text>
      <text x="20" y="400" fill="#334155" font-size="16">Like .psd in Photoshop,</text><text x="20" y="422" fill="#334155" font-size="16">.xcf in GIMP, .kra in Krita</text>
    </g>
    <path d="M300 350h40" stroke="#64748b" stroke-width="6" marker-end="url(#ar)"/>
    <g transform="translate(350 130)">
      <rect width="250" height="440" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <rect x="20" y="20" width="210" height="44" rx="10" fill="#7c3aed"/><text x="125" y="50" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="22">.psd  /  .ora</text>
      <text x="20" y="96" font-weight="800" fill="#0f172a">Layered interchange</text>
      <text x="20" y="134" fill="#15803d">✓ layers</text><text x="20" y="164" fill="#b45309">~ text becomes pixels</text><text x="20" y="194" fill="#b45309">~ masks (PSD yes, ORA no)</text><text x="20" y="224" fill="#b45309">~ adjustments baked</text><text x="20" y="254" fill="#b45309">~ effects baked</text><text x="20" y="284" fill="#15803d">✓ transparency</text>
      <text x="20" y="400" fill="#334155" font-size="16">Opens in other editors,</text><text x="20" y="422" fill="#334155" font-size="16">layer by layer</text>
    </g>
    <path d="M610 350h40" stroke="#64748b" stroke-width="6" marker-end="url(#ar)"/>
    <g transform="translate(660 130)">
      <rect width="250" height="440" rx="18" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
      <rect x="20" y="20" width="210" height="44" rx="10" fill="#0e7490"/><text x="125" y="50" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="22">.png</text>
      <text x="20" y="96" font-weight="800" fill="#0f172a">Flat, lossless</text>
      <text x="20" y="134" fill="#b91c1c">✗ layers (one picture)</text><text x="20" y="164" fill="#b91c1c">✗ editable anything</text><text x="20" y="194" fill="#15803d">✓ every pixel exact</text><text x="20" y="224" fill="#15803d">✓ transparency</text>
      <text x="20" y="400" fill="#334155" font-size="16">Logos, screenshots,</text><text x="20" y="422" fill="#334155" font-size="16">graphics, web</text>
    </g>
    <path d="M920 350h40" stroke="#64748b" stroke-width="6" marker-end="url(#ar)"/>
    <g transform="translate(970 130)">
      <rect width="200" height="440" rx="18" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
      <rect x="20" y="20" width="160" height="44" rx="10" fill="#b91c1c"/><text x="100" y="50" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="22">.jpg</text>
      <text x="20" y="96" font-weight="800" fill="#0f172a">Flat, lossy</text>
      <text x="20" y="134" fill="#b91c1c">✗ layers</text><text x="20" y="164" fill="#b91c1c">✗ transparency</text><text x="20" y="194" fill="#b91c1c">✗ some detail</text><text x="20" y="224" fill="#15803d">✓ small files</text>
      <g transform="translate(40 260)"><rect width="120" height="80" fill="#93c5fd"/><rect x="0" y="0" width="40" height="40" fill="#60a5fa"/><rect x="40" y="40" width="40" height="40" fill="#bfdbfe"/><rect x="80" y="0" width="40" height="40" fill="#3b82f6"/><text x="60" y="104" text-anchor="middle" font-size="14" fill="#334155">8×8 blocks</text></g>
      <text x="20" y="400" fill="#334155" font-size="16">Photos to share</text>
    </g>
  </g>
  <text x="40" y="616" font-size="16" fill="#475569">Original ClassroomOS diagram. "~" = kept in a changed form.</text>
</svg>
