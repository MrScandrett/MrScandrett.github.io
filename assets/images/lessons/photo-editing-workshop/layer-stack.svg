<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <title>A layer stack, exploded</title>
  <desc>Four layers drawn as tilted sheets stacked from bottom to top: a sunset background photo, a planet with a mask, a warm adjustment layer, and live text. An arrow shows them combining into the final picture.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1026"/><stop offset=".6" stop-color="#3b1d6e"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#ffffff"/><rect width="8" height="8" fill="#d4d4d8"/><rect x="8" y="8" width="8" height="8" fill="#d4d4d8"/></pattern>
    <radialGradient id="planet" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/></radialGradient>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="40" y="58" font-size="34" font-weight="800" fill="#0f172a">A layer stack, exploded</text>
  <text x="40" y="92" font-size="20" fill="#334155">Each layer is a clear sheet. The app looks down through all of them, top to bottom.</text>

  <g transform="translate(70 0)">
    <!-- 1 background -->
    <g transform="translate(0 600) skewX(-30) scale(1 .5)"><rect x="160" y="-240" width="420" height="280" fill="url(#sky)" stroke="#0f172a" stroke-width="3"/></g>
    <!-- 2 planet + mask -->
    <g transform="translate(0 480) skewX(-30) scale(1 .5)"><rect x="160" y="-240" width="420" height="280" fill="url(#chk)" opacity=".55" stroke="#0f172a" stroke-width="3"/><circle cx="370" cy="-110" r="95" fill="url(#planet)"/></g>
    <!-- 3 adjustment -->
    <g transform="translate(0 360) skewX(-30) scale(1 .5)"><rect x="160" y="-240" width="420" height="280" fill="#fb923c" opacity=".28" stroke="#0f172a" stroke-width="3" stroke-dasharray="10 8"/></g>
    <!-- 4 text -->
    <g transform="translate(0 240) skewX(-30) scale(1 .5)"><rect x="160" y="-240" width="420" height="280" fill="url(#chk)" opacity=".45" stroke="#0f172a" stroke-width="3"/><text x="200" y="-20" font-size="64" font-weight="900" fill="#ffffff" stroke="#0f172a" stroke-width="2">STEAM NIGHT</text></g>
  </g>

  <g font-size="19" fill="#0f172a">
    <text x="610" y="216" font-weight="800">4 · Text layer (live)</text>
    <text x="610" y="240" fill="#334155">Stays editable words until you rasterize it.</text>
    <text x="610" y="336" font-weight="800">3 · Adjustment layer</text>
    <text x="610" y="360" fill="#334155">No pixels. Warms everything below it.</text>
    <text x="610" y="456" font-weight="800">2 · Pixel layer + mask</text>
    <text x="610" y="480" fill="#334155">Checkerboard = transparent. The mask hides, never deletes.</text>
    <text x="610" y="576" font-weight="800">1 · Background photo</text>
    <text x="610" y="600" fill="#334155">The bottom sheet. Covered by everything above.</text>
  </g>

  <path d="M980 400 h70" stroke="#2563eb" stroke-width="8" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker></defs>
  <g transform="translate(1065 300)">
    <rect width="110" height="150" fill="url(#sky)" stroke="#0f172a" stroke-width="2"/>
    <circle cx="55" cy="60" r="34" fill="url(#planet)"/>
    <rect width="110" height="150" fill="#fb923c" opacity=".2"/>
    <text x="55" y="122" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">STEAM NIGHT</text>
    <text x="55" y="178" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">What you see</text>
  </g>
  <text x="40" y="730" font-size="16" fill="#475569">Original ClassroomOS diagram · schematic, not to scale.</text>
</svg>
