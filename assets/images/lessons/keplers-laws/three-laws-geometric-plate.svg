<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="tlgp-title">
  <title id="tlgp-title">Kepler's Three Laws of Planetary Motion Geometry Plate</title>
  <rect width="900" height="320" rx="16" fill="#04060e"/>
  <text x="28" y="36" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#e2ebf8">Kepler's Three Laws of Planetary Motion</text>
  <text x="28" y="56" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Every bound orbit obeys these three geometric rules — first derived empirically from Brahe's Mars data.</text>

  <!-- Law 1 -->
  <g transform="translate(24 76)">
    <rect width="272" height="220" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="16" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#f4c430">1 · Law of Ellipses</text>
    <ellipse cx="136" cy="110" rx="96" ry="54" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
    <line x1="40" y1="110" x2="232" y2="110" stroke="#475569" stroke-dasharray="3 3"/>
    <circle cx="76" cy="110" r="11" fill="#facc15"/>
    <circle cx="196" cy="110" r="4" fill="#64748b"/>
    <circle cx="176" cy="61" r="6" fill="#60a5fa"/>
    <text x="76" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#fde047">Focus 1 (Sun)</text>
    <text x="196" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" fill="#94a3b8">Empty F₂</text>
    <text x="136" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#cbd5e1">Planets travel ellipses with</text>
    <text x="136" y="201" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#cbd5e1">Sun at one focus (r₁ + r₂ = 2a)</text>
  </g>

  <!-- Law 2 -->
  <g transform="translate(314 76)">
    <rect width="272" height="220" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="16" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#f4c430">2 · Equal Areas in Equal Time</text>
    <ellipse cx="136" cy="110" rx="96" ry="54" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <!-- Fast perihelion wedge -->
    <path d="M76,110 L42,88 A96,54 0 0,0 42,132 Z" fill="#f59e0b" fill-opacity="0.42" stroke="#f59e0b" stroke-width="1.4"/>
    <!-- Slow aphelion wedge -->
    <path d="M76,110 L230,96 A96,54 0 0,1 230,124 Z" fill="#22c55e" fill-opacity="0.38" stroke="#22c55e" stroke-width="1.4"/>
    <circle cx="76" cy="110" r="10" fill="#facc15"/>
    <text x="58" y="158" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#fde68a">Fast (Perihelion)</text>
    <text x="208" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#86efac">Slow (Aphelion)</text>
    <text x="136" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#cbd5e1">Both shaded sectors have</text>
    <text x="136" y="201" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#cbd5e1">identical area when Δt is equal</text>
  </g>

  <!-- Law 3 -->
  <g transform="translate(604 76)">
    <rect width="272" height="220" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="16" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#f4c430">3 · Harmonic Law (T² = a³)</text>
    <text x="136" y="64" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#f8fafc">T² / a³ = 1.00</text>
    <g font-family="ui-monospace,monospace" font-size="10.5" fill="#cbd5e1">
      <text x="24" y="96">Planet      a (AU)    T (yr)</text>
      <line x1="24" y1="103" x2="248" y2="103" stroke="#334155"/>
      <text x="24" y="120" fill="#93c5fd">Earth       1.00      1.00</text>
      <text x="24" y="138" fill="#fca5a5">Mars        1.52      1.88</text>
      <text x="24" y="156" fill="#fed7aa">Jupiter     5.20     11.86</text>
      <text x="24" y="174" fill="#fde047">Saturn      9.54     29.46</text>
    </g>
    <text x="136" y="201" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#cbd5e1">Period squared scales as cube of a</text>
  </g>
</svg>
