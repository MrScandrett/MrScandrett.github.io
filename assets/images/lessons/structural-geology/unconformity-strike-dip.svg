<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Structural Geology: Angular Unconformity and Strike &amp; Dip Field Measurements">
  <defs>
    <linearGradient id="bgUd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1109"/>
      <stop offset="100%" stop-color="#050804"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bgUd)"/>
  <rect x="20" y="20" width="920" height="440" rx="16" fill="none" stroke="#2f3a23" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="58" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#fef08a">Field Geometry: Angular Unconformities and Strike &amp; Dip</text>
  <text x="50" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Reading missing geologic time and recording 3D planar orientations from surface outcrops</text>

  <!-- Left: Angular Unconformity (Siccar Point style) -->
  <g transform="translate(50, 110)">
    <rect width="415" height="320" rx="12" fill="#141a0e" stroke="#364925" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ecc470">1. Angular Unconformity (Missing Time)</text>
    <text x="20" y="52" font-family="system-ui, sans-serif" font-size="11.5" fill="#a3b899">Erosional surface separating tilted older rock from flat younger rock</text>

    <!-- Cross section diagram -->
    <g transform="translate(20, 70)">
      <!-- Younger horizontal beds on top -->
      <rect x="0" y="0" width="375" height="35" fill="#38bdf8" fill-opacity="0.8"/>
      <rect x="0" y="35" width="375" height="35" fill="#f59e0b" fill-opacity="0.8"/>
      <text x="187" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#042f2e">Younger Horizontal Strata (Beds D &amp; C)</text>

      <!-- Unconformity boundary line (wavy erosional surface) -->
      <path d="M 0,70 Q 60,65 120,72 Q 180,68 240,73 Q 300,66 375,70" fill="none" stroke="#ef4444" stroke-width="3"/>
      <rect x="75" y="58" width="225" height="22" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <text x="187" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#fecaca">UNCONFORMITY (Erosional Gap in Time)</text>

      <!-- Older steeply tilted strata beneath unconformity -->
      <g transform="translate(0, 70)">
        <!-- Tilted stripes at 45 degree angle -->
        <polygon points="0,0 80,0 0,80" fill="#1e3a8a"/>
        <polygon points="80,0 160,0 0,160 0,80" fill="#047857"/>
        <polygon points="160,0 240,0 15,225 0,225 0,160" fill="#b45309"/>
        <polygon points="240,0 320,0 95,225 15,225" fill="#4338ca"/>
        <polygon points="320,0 375,0 375,55 175,225 95,225" fill="#047857"/>
        <polygon points="375,55 375,135 255,225 175,225" fill="#b45309"/>
        <polygon points="375,135 375,215 335,225 255,225" fill="#1e3a8a"/>
        <polygon points="375,215 375,225 335,225" fill="#4338ca"/>
      </g>
      <text x="187" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Older Tilted Strata (Deformed &amp; Truncated)</text>
    </g>
  </g>

  <!-- Right: Strike and Dip Notation -->
  <g transform="translate(495, 110)">
    <rect width="415" height="320" rx="12" fill="#141a0e" stroke="#364925" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ecc470">2. Strike &amp; Dip Field Measurements</text>
    <text x="20" y="52" font-family="system-ui, sans-serif" font-size="11.5" fill="#a3b899">How geologists map the orientation of dipping planar beds</text>

    <!-- 3D Inclined plane diagram -->
    <g transform="translate(40, 75)">
      <!-- Horizontal reference plane (water level) -->
      <polygon points="20,100 230,60 330,120 120,160" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
      <text x="240" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">Horizontal Water Plane</text>

      <!-- Dipping rock plane cutting through water -->
      <polygon points="60,30 270,30 250,170 40,170" fill="#d97706" fill-opacity="0.75" stroke="#fde68a" stroke-width="1.5"/>

      <!-- Strike line: intersection of dipping bed and horizontal plane -->
      <line x1="50" y1="95" x2="260" y2="95" stroke="#ffffff" stroke-width="3"/>
      <circle cx="50" cy="95" r="4" fill="#ffffff"/>
      <circle cx="260" cy="95" r="4" fill="#ffffff"/>
      <text x="155" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">STRIKE LINE (Horizontal bearing)</text>

      <!-- Dip angle arrow -->
      <path d="M 175,95 L 175,170" stroke="#f59e0b" stroke-width="2.5"/>
      <polygon points="175,170 170,160 180,160" fill="#f59e0b"/>
      <text x="185" y="140" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fde68a">DIP (35° SE)</text>

      <!-- Map Symbol Box -->
      <rect x="230" y="145" width="105" height="48" rx="6" fill="#060904" stroke="#4d6134" stroke-width="1"/>
      <line x1="245" y1="168" x2="285" y2="168" stroke="#fff" stroke-width="2"/>
      <line x1="265" y1="168" x2="265" y2="182" stroke="#fff" stroke-width="2"/>
      <text x="275" y="180" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fde68a">35°</text>
      <text x="282" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Map Symbol</text>
    </g>
  </g>
</svg>
