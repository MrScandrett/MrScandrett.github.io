<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Structural Geology: Geological Folds (Anticline and Syncline) and Fault Mechanics (Normal vs Reverse)">
  <defs>
    <linearGradient id="bgSg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1109"/>
      <stop offset="100%" stop-color="#050804"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bgSg)"/>
  <rect x="20" y="20" width="920" height="440" rx="16" fill="none" stroke="#2f3a23" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="58" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#fef08a">Structural Geometry: Ductile Folds vs. Brittle Faults</text>
  <text x="50" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">How tectonic stress deforms continuous planar stratigraphy under compressive, extensional, and shear regimes</text>

  <!-- Left: Ductile Folds (Anticline & Syncline) -->
  <g transform="translate(50, 110)">
    <rect width="415" height="320" rx="12" fill="#141a0e" stroke="#364925" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ecc470">1. Ductile Deformation: Folds</text>
    <text x="20" y="52" font-family="system-ui, sans-serif" font-size="11.5" fill="#a3b899">Compressional stress curves continuous beds without fracturing</text>

    <!-- Fold Cross section -->
    <g transform="translate(20, 70)">
      <!-- Ground surface line -->
      <line x1="0" y1="15" x2="375" y2="15" stroke="#84cc16" stroke-width="2"/>
      <text x="5" y="10" font-family="system-ui, sans-serif" font-size="10" fill="#84cc16">Eroded Ground Surface</text>

      <!-- Strata layers wavy -->
      <!-- Bed 1 (youngest, top) -->
      <path d="M 0,90 Q 95,20 190,90 Q 285,160 375,90 L 375,130 Q 285,200 190,130 Q 95,60 0,130 Z" fill="#b45309" fill-opacity="0.85"/>
      <!-- Bed 2 (intermediate) -->
      <path d="M 0,130 Q 95,60 190,130 Q 285,200 375,130 L 375,170 Q 285,240 190,170 Q 95,100 0,170 Z" fill="#047857" fill-opacity="0.85"/>
      <!-- Bed 3 (oldest, core of anticline) -->
      <path d="M 0,170 Q 95,100 190,170 Q 285,240 375,170 L 375,210 L 0,210 Z" fill="#1e3a8a" fill-opacity="0.85"/>

      <!-- Axial planes dashed -->
      <line x1="95" y1="15" x2="95" y2="200" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="285" y1="15" x2="285" y2="200" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- Labels -->
      <rect x="35" y="25" width="120" height="24" rx="4" fill="#0f172a" stroke="#fef08a" stroke-width="1"/>
      <text x="95" y="41" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fef08a">ANTICLINE (Arch)</text>

      <rect x="225" y="25" width="120" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="285" y="41" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">SYNCLINE (Trough)</text>

      <text x="95" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fef08a">Oldest rocks in core</text>
      <text x="285" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Youngest rocks in core</text>
    </g>
  </g>

  <!-- Right: Brittle Faults (Normal vs Reverse) -->
  <g transform="translate(495, 110)">
    <rect width="415" height="320" rx="12" fill="#141a0e" stroke="#364925" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ecc470">2. Brittle Deformation: Faults</text>
    <text x="20" y="52" font-family="system-ui, sans-serif" font-size="11.5" fill="#a3b899">Differential stress breaks rock along a planar slip surface</text>

    <!-- Normal Fault Sub-box -->
    <g transform="translate(20, 70)">
      <rect width="180" height="225" rx="8" fill="#1b2413" stroke="#2d3b20"/>
      <text x="90" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">NORMAL FAULT</text>
      <text x="90" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Tensional Stress (Pulling apart)</text>

      <!-- Fault plane line -->
      <line x1="30" y1="50" x2="150" y2="175" stroke="#ef4444" stroke-width="2"/>

      <!-- Footwall (left, up relative) -->
      <polygon points="15,65 50,65 110,130 15,130" fill="#d97706" fill-opacity="0.8"/>
      <polygon points="15,130 110,130 145,170 15,170" fill="#059669" fill-opacity="0.8"/>
      <text x="35" y="105" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#fff">Footwall</text>

      <!-- Hanging Wall (right, dropped down) -->
      <polygon points="70,95 165,95 165,160 135,160" fill="#d97706" fill-opacity="0.8"/>
      <polygon points="135,160 165,160 165,200 155,200" fill="#059669" fill-opacity="0.8"/>
      <text x="110" y="125" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#fff">Hanging</text>
      <text x="115" y="137" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#fff">Wall</text>

      <!-- Arrow down on hanging wall -->
      <polygon points="150,85 145,75 155,75" fill="#ef4444"/>
      <text x="90" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fde68a">Hanging wall drops down</text>
    </g>

    <!-- Reverse / Thrust Fault Sub-box -->
    <g transform="translate(215, 70)">
      <rect width="180" height="225" rx="8" fill="#1b2413" stroke="#2d3b20"/>
      <text x="90" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">REVERSE FAULT</text>
      <text x="90" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Compressional (Pushing)</text>

      <!-- Fault plane line -->
      <line x1="150" y1="50" x2="30" y2="175" stroke="#38bdf8" stroke-width="2"/>

      <!-- Hanging wall (pushed up) -->
      <polygon points="55,60 140,60 90,115 15,115" fill="#d97706" fill-opacity="0.8"/>
      <polygon points="15,115 90,115 45,165 15,165" fill="#059669" fill-opacity="0.8"/>
      <text x="45" y="90" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#fff">Hanging</text>
      <text x="50" y="102" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#fff">Wall</text>

      <!-- Footwall (right, down relative) -->
      <polygon points="115,110 165,110 165,165 70,165" fill="#d97706" fill-opacity="0.8"/>
      <polygon points="70,165 165,165 165,200 40,200" fill="#059669" fill-opacity="0.8"/>
      <text x="115" y="140" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#fff">Footwall</text>

      <!-- Arrow up on hanging wall -->
      <polygon points="70,45 65,55 75,55" fill="#38bdf8"/>
      <text x="90" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#bae6fd">Hanging wall pushed up</text>
    </g>
  </g>
</svg>

