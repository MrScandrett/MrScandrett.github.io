<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card-ttl { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .card-soft { fill: #0b1e32; stroke: #0284c7; stroke-width: 1.5; rx: 8px; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
      .col-header { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 700; }
      .badge-ttl { fill: #f59e0b; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
      .badge-soft { fill: #38bdf8; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
      .box-ttl { fill: #1e293b; stroke: #475569; stroke-width: 1; rx: 6px; }
      .box-soft { fill: #0c2d48; stroke: #0369a1; stroke-width: 1; rx: 6px; }
      .box-highlight { fill: #1e1b4b; stroke: #818cf8; stroke-width: 1.5; rx: 6px; }
      .box-title { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
      .box-desc { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .box-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38bdf8; }
      .wire { stroke: #64748b; stroke-width: 2; fill: none; }
      .wire-active { stroke: #f59e0b; stroke-width: 2; fill: none; }
      .wire-soft { stroke: #38bdf8; stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-ttl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="960" height="520" class="bg" />

  <!-- Top Title -->
  <text x="480" y="36" text-anchor="middle" class="title">Two Ways to Build Pong: Discrete Hardware (1972) vs. Software Loop (Today)</text>
  <text x="480" y="56" text-anchor="middle" class="subtitle">Allan Alcorn built Atari Pong out of 66 logic chips with zero code. Today, a 4-phase game loop does the same job in 25 lines.</text>

  <!-- Left: 1972 Discrete TTL Architecture -->
  <g transform="translate(36, 75)">
    <rect width="424" height="415" class="card-ttl" />
    
    <text x="24" y="32" class="col-header" fill="#fbbf24">1972: Discrete TTL Hardware</text>
    <text x="24" y="50" class="badge-ttl">NO CPU · NO RAM · NO SOFTWARE · 66 LOGIC CHIPS</text>

    <!-- Block 1: Master Clock & Sync -->
    <g transform="translate(24, 70)">
      <rect width="180" height="60" class="box-ttl" />
      <text x="12" y="24" class="box-title">7.159 MHz Crystal Clock</text>
      <text x="12" y="44" class="box-desc">H &amp; V raster scanline counters</text>
    </g>

    <!-- Block 2: Paddle Potentiometer Timers -->
    <g transform="translate(220, 70)">
      <rect width="180" height="60" class="box-ttl" />
      <text x="12" y="24" class="box-title">Paddle 555-Style Timers</text>
      <text x="12" y="44" class="box-desc">Rotary pot delays vertical pulse</text>
    </g>

    <!-- Connectors -->
    <line x1="114" y1="130" x2="114" y2="165" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-ttl)" />
    <line x1="310" y1="130" x2="310" y2="165" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-ttl)" />

    <!-- Block 3: Ball Position Counters -->
    <g transform="translate(24, 165)">
      <rect width="180" height="66" class="box-ttl" />
      <text x="12" y="24" class="box-title">Ball Position Counters</text>
      <text x="12" y="42" class="box-desc">Flip-flops compare H/V beam</text>
      <text x="12" y="56" class="box-mono" fill="#cbd5e1">Outputs 4×4 pixel pulse</text>
    </g>

    <!-- Block 4: Hit Detection Logic -->
    <g transform="translate(220, 165)">
      <rect width="180" height="66" class="box-highlight" />
      <text x="12" y="24" class="box-title" fill="#c7d2fe">AND Gate Hit Detector</text>
      <text x="12" y="42" class="box-desc" fill="#a5b4fc">Paddle PULSE ∧ Ball PULSE</text>
      <text x="12" y="56" class="box-mono" fill="#a5b4fc">Toggles ball direction latch</text>
    </g>

    <!-- Cross connection -->
    <line x1="204" y1="198" x2="220" y2="198" stroke="#f59e0b" stroke-width="2" />
    <line x1="310" y1="231" x2="310" y2="265" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-ttl)" />

    <!-- Block 5: 8-Segment Deflection & Speedup -->
    <g transform="translate(24, 265)">
      <rect width="376" height="52" class="box-ttl" />
      <text x="14" y="22" class="box-title">8-Segment Paddle Divider &amp; Speedup Logic</text>
      <text x="14" y="40" class="box-desc">Hit offset sets V-deflection rate; rally counter speeds up clock</text>
    </g>

    <line x1="212" y1="317" x2="212" y2="340" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-ttl)" />

    <!-- Block 6: Video Summer & Audio Beeper -->
    <g transform="translate(24, 340)">
      <rect width="376" height="52" class="box-ttl" stroke="#f59e0b" />
      <text x="14" y="22" class="box-title" fill="#fef08a">Resistor Summer → Black &amp; White CRT Video</text>
      <text x="14" y="40" class="box-desc">Sync, paddles, ball, and score are directly mixed into composite analog video!</text>
    </g>
  </g>

  <!-- Right: Modern Software Architecture -->
  <g transform="translate(500, 75)">
    <rect width="424" height="415" class="card-soft" />

    <text x="24" y="32" class="col-header" fill="#38bdf8">Today: Modern Software Loop</text>
    <text x="24" y="50" class="badge-soft">JAVASCRIPT · HTML5 CANVAS · 60 FPS CLOCK</text>

    <!-- Step 1: Input -->
    <g transform="translate(24, 70)">
      <rect width="376" height="50" class="box-soft" />
      <text x="14" y="22" class="box-title">1. Input System</text>
      <text x="14" y="38" class="box-mono">if (keys.up) player.y -= 5;  // reads keyboard/touch</text>
    </g>

    <line x1="212" y1="120" x2="212" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-soft)" />

    <!-- Step 2: AI -->
    <g transform="translate(24, 135)">
      <rect width="376" height="50" class="box-soft" />
      <text x="14" y="22" class="box-title">2. AI Opponent System</text>
      <text x="14" y="38" class="box-mono">cpu.y += clamp(ball.y - cpu.center, -aiSpeed, aiSpeed);</text>
    </g>

    <line x1="212" y1="185" x2="212" y2="200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-soft)" />

    <!-- Step 3: Physics & Collision -->
    <g transform="translate(24, 200)">
      <rect width="376" height="56" class="box-soft" stroke="#38bdf8" />
      <text x="14" y="22" class="box-title" fill="#e0f2fe">3. Physics &amp; Bounce System</text>
      <text x="14" y="38" class="box-mono">ball.x += ball.vx;  ball.y += ball.vy;</text>
      <text x="14" y="50" class="box-mono" fill="#7dd3fc">if (collides(ball, p)) { ball.vx *= -1.05; ball.vy += offset; }</text>
    </g>

    <line x1="212" y1="256" x2="212" y2="271" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-soft)" />

    <!-- Step 4: Scoring & State -->
    <g transform="translate(24, 271)">
      <rect width="376" height="50" class="box-soft" />
      <text x="14" y="22" class="box-title">4. Scoring &amp; Serve Reset</text>
      <text x="14" y="38" class="box-mono">if (ball.x &gt; W) { playerScore++; serve(); }</text>
    </g>

    <line x1="212" y1="321" x2="212" y2="336" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-soft)" />

    <!-- Step 5: Render -->
    <g transform="translate(24, 336)">
      <rect width="376" height="56" class="box-soft" />
      <text x="14" y="22" class="box-title">5. Render System (HTML5 Canvas 2D)</text>
      <text x="14" y="38" class="box-mono">ctx.clearRect(0, 0, W, H); ctx.fillRect(player...);</text>
      <text x="14" y="50" class="box-desc">GPU swaps backbuffer to screen via requestAnimationFrame()</text>
    </g>
  </g>
</svg>

