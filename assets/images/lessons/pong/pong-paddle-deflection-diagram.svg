<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card-bg { fill: #111a2e; stroke: #1e293b; stroke-width: 1.5; rx: 8px; }
      .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
      .col-header { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .label-bold { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38bdf8; }
      .mono-dim { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #64748b; }
      .traj-naive { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 4 4; fill: none; }
      .ball { fill: #ffffff; filter: drop-shadow(0 0 6px rgba(255,255,255,0.7)); }
      .zone-border { stroke: #0f172a; stroke-width: 1; }
      .arrow { fill: #38bdf8; }
    </style>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" class="bg" />

  <!-- Top Title -->
  <text x="480" y="38" text-anchor="middle" class="title">How Pong Avoids Infinite Loops: The 8-Segment Paddle</text>
  <text x="480" y="58" text-anchor="middle" class="subtitle">Comparing Naive Physics Reflection with Allan Alcorn's 1972 Discrete Hit-Zone Angle Engineering</text>

  <!-- Left Column: Naive Physics (Flawed) -->
  <rect x="36" y="80" width="340" height="400" class="card-bg" />
  <text x="56" y="112" class="col-header" fill="#f87171">✕ Naive Physics: Pure Normal Reflection</text>
  <text x="56" y="132" class="label">Angle of incidence = angle of reflection</text>
  <text x="56" y="148" class="mono-dim">ball.vx = -ball.vx;  // flat paddle collision</text>

  <!-- Naive Demonstration -->
  <g transform="translate(60, 180)">
    <!-- Court background -->
    <rect x="0" y="0" width="292" height="170" fill="#080d1a" rx="4" stroke="#1e293b" />
    <!-- Center net -->
    <line x1="146" y1="0" x2="146" y2="170" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />
    
    <!-- Flat Left Paddle -->
    <rect x="18" y="55" width="8" height="60" fill="#94a3b8" rx="2" />
    <text x="10" y="50" class="mono-dim">Paddle A</text>

    <!-- Flat Right Paddle -->
    <rect x="266" y="55" width="8" height="60" fill="#94a3b8" rx="2" />
    <text x="236" y="50" class="mono-dim">Paddle B</text>

    <!-- Trajectory: Horizontal deadlock -->
    <line x1="26" y1="85" x2="266" y2="85" stroke="#ef4444" stroke-width="2" />
    <path d="M 230 81 L 242 85 L 230 89 z" fill="#ef4444" />
    <path d="M 62 89 L 50 85 L 62 81 z" fill="#ef4444" />

    <!-- Ball -->
    <circle cx="146" cy="85" r="5" class="ball" />

    <!-- Flaw Badge -->
    <rect x="20" y="125" width="252" height="34" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1" rx="4" />
    <text x="146" y="140" text-anchor="middle" class="label-bold" fill="#fca5a5">DEADLOCK: Unbreakable Ping-Pong Loop</text>
    <text x="146" y="152" text-anchor="middle" class="mono-dim" fill="#f87171">vy stays 0 forever · game cannot be won</text>
  </g>

  <g transform="translate(56, 385)">
    <text x="0" y="14" class="label">If paddles are flat mirrors, horizontal shots bounce</text>
    <text x="0" y="32" class="label">back and forth along the exact same scanline.</text>
    <text x="0" y="52" class="label">Players have no way to angle shots or force mistakes.</text>
    <text x="0" y="74" class="mono" fill="#f87171">Result: Boring game with no skill ceiling.</text>
  </g>

  <!-- Right Column: 8-Segment Deflection (1972 Alcorn Innovation) -->
  <rect x="396" y="80" width="528" height="400" class="card-bg" />
  <text x="416" y="112" class="col-header" fill="#38bdf8">✓ 1972 Atari Pong: 8-Segment Deflection Model</text>
  <text x="416" y="132" class="label">The paddle is divided into 8 discrete vertical zones</text>
  <text x="416" y="148" class="mono">vy = (ball.y - paddle.center) * factor  // or 8-zone LUT</text>

  <!-- 8-Segment Diagram -->
  <g transform="translate(420, 175)">
    <!-- Court bg -->
    <rect x="0" y="0" width="480" height="275" fill="#080d1a" rx="4" stroke="#1e293b" />

    <!-- Incoming Ball vector -->
    <line x1="420" y1="137" x2="160" y2="137" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-cyan)" />
    <text x="340" y="127" class="mono-dim" fill="#94a3b8">Incoming horizontal ball (vy = 0)</text>

    <!-- Detailed 8-Segment Paddle -->
    <!-- Segments 1 to 8: Height = 200 total (25 each) from y=37 to y=237 -->
    <g transform="translate(130, 37)">
      <!-- Zone 1 (Top Tip) -->
      <rect x="0" y="0" width="22" height="25" fill="#f43f5e" class="zone-border" rx="2" />
      <text x="-8" y="17" text-anchor="end" class="mono" fill="#f43f5e">1: +60°</text>

      <!-- Zone 2 -->
      <rect x="0" y="25" width="22" height="25" fill="#fb923c" class="zone-border" />
      <text x="-8" y="42" text-anchor="end" class="mono" fill="#fb923c">2: +40°</text>

      <!-- Zone 3 -->
      <rect x="0" y="50" width="22" height="25" fill="#facc15" class="zone-border" />
      <text x="-8" y="67" text-anchor="end" class="mono" fill="#facc15">3: +20°</text>

      <!-- Zone 4 (Center Top) -->
      <rect x="0" y="75" width="22" height="25" fill="#38bdf8" class="zone-border" />
      <text x="-8" y="92" text-anchor="end" class="mono" fill="#38bdf8">4:  0°</text>

      <!-- Zone 5 (Center Bottom) -->
      <rect x="0" y="100" width="22" height="25" fill="#38bdf8" class="zone-border" />
      <text x="-8" y="117" text-anchor="end" class="mono" fill="#38bdf8">5:  0°</text>

      <!-- Zone 6 -->
      <rect x="0" y="125" width="22" height="25" fill="#facc15" class="zone-border" />
      <text x="-8" y="142" text-anchor="end" class="mono" fill="#facc15">6: -20°</text>

      <!-- Zone 7 -->
      <rect x="0" y="150" width="22" height="25" fill="#fb923c" class="zone-border" />
      <text x="-8" y="167" text-anchor="end" class="mono" fill="#fb923c">7: -40°</text>

      <!-- Zone 8 (Bottom Tip) -->
      <rect x="0" y="175" width="22" height="25" fill="#f43f5e" class="zone-border" rx="2" />
      <text x="-8" y="192" text-anchor="end" class="mono" fill="#f43f5e">8: -60°</text>
    </g>

    <!-- Outgoing Reflection Trajectories Fan -->
    <!-- Origin: x=152, y=paddle centers -->
    <!-- Zone 1: Sharp Up -->
    <path d="M 152 49 L 360 8" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arr-rose)" />
    <text x="375" y="12" class="mono" fill="#f43f5e">Sharp Slice (Up 60°)</text>

    <!-- Zone 2: Moderate Up -->
    <path d="M 152 74 L 370 45" stroke="#fb923c" stroke-width="2" marker-end="url(#arr-amber)" />
    <text x="385" y="48" class="mono" fill="#fb923c">Drive (Up 40°)</text>

    <!-- Zone 3: Shallow Up -->
    <path d="M 152 99 L 380 82" stroke="#facc15" stroke-width="1.8" />

    <!-- Zone 4 & 5: Horizontal return -->
    <path d="M 152 137 L 390 137" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)" />
    <text x="405" y="141" class="mono" fill="#38bdf8">Direct return (0°)</text>

    <!-- Zone 6: Shallow Down -->
    <path d="M 152 174 L 380 192" stroke="#facc15" stroke-width="1.8" />

    <!-- Zone 7: Moderate Down -->
    <path d="M 152 199 L 370 228" stroke="#fb923c" stroke-width="2" marker-end="url(#arr-amber)" />
    <text x="385" y="232" class="mono" fill="#fb923c">Drive (Down 40°)</text>

    <!-- Zone 8: Sharp Down -->
    <path d="M 152 224 L 360 266" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arr-rose)" />
    <text x="375" y="270" class="mono" fill="#f43f5e">Sharp Slice (Down 60°)</text>

    <!-- Impact indicator -->
    <circle cx="152" cy="137" r="6" class="ball" />
  </g>
</svg>

