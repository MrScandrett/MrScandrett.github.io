<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="go-bf-title go-bf-desc">
  <title id="go-bf-title">Why Go Broke Brute-Force Search: Chess vs. Go</title>
  <desc id="go-bf-desc">Side-by-side comparison of Chess (8x8 board, ~35 legal moves per turn, simple piece values) versus 19x19 Go (~200-250 legal moves per turn, ~10^360 game tree size, global territory evaluation).</desc>
  <rect width="880" height="380" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">The Combinatorial Wall: Why Chess Brute Force Fails on Go</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Lookahead search grows as b^d (branching factor ^ depth) — Go makes both wider AND harder to score</text>

  <!-- Chess card -->
  <rect x="28" y="76" width="396" height="224" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="48" y="106" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800" fill="#1e3a8a">Chess · Deep Blue (1997)</text>
  <text x="48" y="130" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" fill="#1d4ed8">8 × 8 = 64 squares</text>
  <text x="48" y="154" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#1e40af">• Branching factor: ~35 moves / turn</text>
  <text x="48" y="176" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#1e40af">• 4-ply brute tree: ~1.5 million positions</text>
  <text x="48" y="198" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#1e40af">• Game-tree complexity: ~10¹²⁰</text>
  <rect x="48" y="216" width="356" height="66" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="62" y="238" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Fast Hand-Written Heuristic:</text>
  <text x="62" y="257" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#1d4ed8">Queen=9 · Rook=5 · Bishop=3 · Pawn=1</text>
  <text x="62" y="274" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">Deep Blue checked 200M boards/sec.</text>

  <!-- Go card -->
  <rect x="456" y="76" width="396" height="224" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="476" y="106" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800" fill="#064e3b">19×19 Go · AlphaGo Era (2016)</text>
  <text x="476" y="130" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" fill="#047857">19 × 19 = 361 intersections</text>
  <text x="476" y="154" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#065f46">• Branching factor: ~200–250 moves / turn</text>
  <text x="476" y="176" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#065f46">• 4-ply brute tree: ~1.6 billion positions</text>
  <text x="476" y="198" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#065f46">• Game-tree complexity: ~10³⁶⁰</text>
  <rect x="476" y="216" width="356" height="66" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="490" y="238" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#064e3b">Why Material Formulas Fail:</text>
  <text x="490" y="257" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">All stones have equal face value (1 point).</text>
  <text x="490" y="274" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">Strength depends on shape, life, and global influence.</text>

  <!-- Scale bar at bottom -->
  <rect x="28" y="314" width="824" height="48" rx="12" fill="#0f172a"/>
  <text x="48" y="336" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Scale Check (Atoms in Observable Universe ≈ 10⁸⁰):</text>
  <text x="48" y="353" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#38bdf8">Chess positions ~10⁴⁴   ·   Chess game tree ~10¹²⁰   ·   Go legal board states ~10¹⁷⁰   ·   Go game tree ~10³⁶⁰</text>
</svg>
