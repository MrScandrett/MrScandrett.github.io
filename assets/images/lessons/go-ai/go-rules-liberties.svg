<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="go-rules-title go-rules-desc">
  <title id="go-rules-title">Core Rules of Go: Liberties, Atari Capture, and Two Eyes</title>
  <desc id="go-rules-desc">Three Go board diagrams showing orthogonally connected liberties, a stone group in atari with one remaining liberty, and a live black group enclosing two separate eyes.</desc>
  <rect width="880" height="380" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">How Go Works: Liberties, Capture (Atari), and Two Eyes</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Four simple geometric rules on grid intersections generate deep emergent strategy</text>

  <!-- Panel 1: Liberties -->
  <rect x="28" y="74" width="260" height="278" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="100" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">1 · Liberties (Breathing Room)</text>
  <rect x="48" y="114" width="220" height="172" rx="10" fill="#efd8a3" stroke="#b48a46"/>
  <!-- 5x4 grid lines -->
  <g stroke="#78592b" stroke-width="1.2">
    <line x1="76" y1="138" x2="240" y2="138"/><line x1="76" y1="178" x2="240" y2="178"/>
    <line x1="76" y1="218" x2="240" y2="218"/><line x1="76" y1="258" x2="240" y2="258"/>
    <line x1="76" y1="138" x2="76" y2="258"/><line x1="117" y1="138" x2="117" y2="258"/>
    <line x1="158" y1="138" x2="158" y2="258"/><line x1="199" y1="138" x2="199" y2="258"/>
    <line x1="240" y1="138" x2="240" y2="258"/>
  </g>
  <!-- Center stone at (158, 218) wait 198? Let's put stone at (158, 178) -> 4 liberties: (158,138), (158,218), (117,178), (199,178) -->
  <circle cx="158" cy="178" r="14" fill="#111827" stroke="#000"/>
  <circle cx="158" cy="138" r="7" fill="#16a34a" stroke="#fff" stroke-width="1.5"/>
  <circle cx="158" cy="218" r="7" fill="#16a34a" stroke="#fff" stroke-width="1.5"/>
  <circle cx="117" cy="178" r="7" fill="#16a34a" stroke="#fff" stroke-width="1.5"/>
  <circle cx="199" cy="178" r="7" fill="#16a34a" stroke="#fff" stroke-width="1.5"/>
  <text x="48" y="308" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">Green dots mark empty orthogonal</text>
  <text x="48" y="324" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">intersections: 4 center, 3 edge, 2 corner.</text>
  <text x="48" y="340" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#0f766e">Diagonals do not connect!</text>

  <!-- Panel 2: Atari & Capture -->
  <rect x="310" y="74" width="260" height="278" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="328" y="100" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">2 · Atari &amp; Capture</text>
  <rect x="330" y="114" width="220" height="172" rx="10" fill="#efd8a3" stroke="#b48a46"/>
  <g stroke="#78592b" stroke-width="1.2">
    <line x1="358" y1="138" x2="522" y2="138"/><line x1="358" y1="178" x2="522" y2="178"/>
    <line x1="358" y1="218" x2="522" y2="218"/><line x1="358" y1="258" x2="522" y2="258"/>
    <line x1="358" y1="138" x2="358" y2="258"/><line x1="399" y1="138" x2="399" y2="258"/>
    <line x1="440" y1="138" x2="440" y2="258"/><line x1="481" y1="138" x2="481" y2="258"/>
    <line x1="522" y1="138" x2="522" y2="258"/>
  </g>
  <!-- Black 2-stone chain at (399,178) & (440,178) -->
  <circle cx="399" cy="178" r="14" fill="#111827"/>
  <circle cx="440" cy="178" r="14" fill="#111827"/>
  <!-- White surrounding stones -->
  <circle cx="358" cy="178" r="13" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <circle cx="399" cy="138" r="13" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <circle cx="440" cy="138" r="13" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <circle cx="399" cy="218" r="13" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <circle cx="440" cy="218" r="13" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <!-- Last liberty in red at (481,178) -->
  <circle cx="481" cy="178" r="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
  <text x="481" y="202" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#991b1b">ATARI!</text>
  <text x="330" y="308" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">Connected stones share liberties. Only 1</text>
  <text x="330" y="324" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">liberty remains (red). If White fills it,</text>
  <text x="330" y="340" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">both Black stones are captured!</text>

  <!-- Panel 3: Two Eyes = Life -->
  <rect x="592" y="74" width="260" height="278" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="610" y="100" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">3 · Two Eyes = Unkillable</text>
  <rect x="612" y="114" width="220" height="172" rx="10" fill="#efd8a3" stroke="#b48a46"/>
  <g stroke="#78592b" stroke-width="1.2">
    <line x1="636" y1="138" x2="808" y2="138"/><line x1="636" y1="178" x2="808" y2="178"/>
    <line x1="636" y1="218" x2="808" y2="218"/><line x1="636" y1="258" x2="808" y2="258"/>
    <line x1="636" y1="138" x2="636" y2="258"/><line x1="679" y1="138" x2="679" y2="258"/>
    <line x1="722" y1="138" x2="722" y2="258"/><line x1="765" y1="138" x2="765" y2="258"/>
    <line x1="808" y1="138" x2="808" y2="258"/>
  </g>
  <!-- Corner eye group along top-left 138/178: Eye1 at (679,178)? Let's use top edge eyes at (679,138) and (765,138) bordered on bottom & middle & sides -->
  <circle cx="636" cy="138" r="12.5" fill="#111827"/>
  <circle cx="722" cy="138" r="12.5" fill="#111827"/>
  <circle cx="808" cy="138" r="12.5" fill="#111827"/>
  <circle cx="636" cy="178" r="12.5" fill="#111827"/>
  <circle cx="679" cy="178" r="12.5" fill="#111827"/>
  <circle cx="722" cy="178" r="12.5" fill="#111827"/>
  <circle cx="765" cy="178" r="12.5" fill="#111827"/>
  <circle cx="808" cy="178" r="12.5" fill="#111827"/>
  <!-- Outer white stones pressing from below -->
  <circle cx="679" cy="218" r="12" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <circle cx="722" cy="218" r="12" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <circle cx="765" cy="218" r="12" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <!-- Two Eyes markers -->
  <circle cx="679" cy="138" r="7" fill="#2563eb" stroke="#fff" stroke-width="1.5"/>
  <circle cx="765" cy="138" r="7" fill="#2563eb" stroke="#fff" stroke-width="1.5"/>
  <text x="679" y="160" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#1d4ed8">Eye 1</text>
  <text x="765" y="160" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#1d4ed8">Eye 2</text>
  <text x="612" y="308" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">Playing inside Eye 1 or Eye 2 leaves</text>
  <text x="612" y="324" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">White with 0 liberties (illegal suicide).</text>
  <text x="612" y="340" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">This Black group can never be captured.</text>
</svg>
