<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="ptr-fr-title ptr-fr-desc">
  <title id="ptr-fr-title">Front Long-Throw, Overhead Short-Throw, and Rear Projection Stage Setups</title>
  <desc id="ptr-fr-desc">Three architectural side-elevation comparisons showing standard front projection's long actor shadow dead-zone, overhead 0.8:1 short-throw compact shadow zone, and rear projection's zero-shadow design requiring backstage depth.</desc>
  <rect width="880" height="370" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Three Ways to Rig Stage Projection (And Why Shadow Zones Shrink)</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Similar triangles tie projector height, throw distance, and where dancers can safely stand upstage</text>

  <!-- Panel 1: Standard Front Throw -->
  <rect x="28" y="76" width="262" height="268" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="44" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">1 · House Front Throw (2.0:1)</text>
  <rect x="44" y="116" width="230" height="150" rx="8" fill="#0f172a"/>
  <!-- Screen right -->
  <line x1="252" y1="134" x2="252" y2="246" stroke="#e2e8f0" stroke-width="4"/>
  <!-- Floor -->
  <line x1="56" y1="246" x2="264" y2="246" stroke="#64748b" stroke-width="2"/>
  <!-- Balcony projector -->
  <rect x="54" y="144" width="22" height="14" rx="3" fill="#a855f7"/>
  <!-- Beam cone -->
  <polygon points="76,151 250,136 250,246" fill="rgba(168,85,247,0.28)" stroke="#c084fc" stroke-width="1"/>
  <!-- Actor in dead zone -->
  <circle cx="198" cy="212" r="6" fill="#fbbf24"/>
  <rect x="194" y="219" width="8" height="27" rx="3" fill="#fbbf24"/>
  <!-- Huge dead zone highlight -->
  <rect x="176" y="243" width="74" height="5" fill="#ef4444"/>
  <text x="213" y="260" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#fca5a5">Large Shadow Zone!</text>
  <text x="44" y="288" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">Needs ~20+ ft throw behind proscenium.</text>
  <text x="44" y="306" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#b91c1c">Low angle makes a 6–8 ft shadow zone on</text>
  <text x="44" y="322" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#b91c1c">the deck unless hung very high.</text>

  <!-- Panel 2: Overhead Short-Throw -->
  <rect x="309" y="76" width="262" height="268" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="325" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#064e3b">2 · High Short-Throw (0.8:1)</text>
  <rect x="325" y="116" width="230" height="150" rx="8" fill="#0f172a"/>
  <line x1="533" y1="134" x2="533" y2="246" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="337" y1="246" x2="545" y2="246" stroke="#64748b" stroke-width="2"/>
  <!-- High pipe overhead closer -->
  <rect x="430" y="128" width="22" height="14" rx="3" fill="#34d399"/>
  <polygon points="452,135 531,134 531,246" fill="rgba(52,211,153,0.28)" stroke="#34d399" stroke-width="1"/>
  <!-- Actor stands closer cleanly -->
  <circle cx="478" cy="212" r="6" fill="#fbbf24"/>
  <rect x="474" y="219" width="8" height="27" rx="3" fill="#fbbf24"/>
  <rect x="502" y="243" width="29" height="5" fill="#fbbf24"/>
  <text x="455" y="260" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#6ee7b7">Small ~3.5ft Zone ✓</text>
  <text x="325" y="288" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">Steep overhead pipe angle clears actors</text>
  <text x="325" y="306" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">so dancers can perform far upstage with</text>
  <text x="325" y="322" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">only a narrow glow-tape keep-clear line.</text>

  <!-- Panel 3: Rear Projection -->
  <rect x="590" y="76" width="262" height="268" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="606" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e3a8a">3 · Rear Projection (RP Screen)</text>
  <rect x="606" y="116" width="230" height="150" rx="8" fill="#0f172a"/>
  <!-- Translucent screen moved slightly left so behind exists -->
  <line x1="744" y1="134" x2="744" y2="246" stroke="#38bdf8" stroke-width="4" stroke-dasharray="5 3"/>
  <line x1="618" y1="246" x2="826" y2="246" stroke="#64748b" stroke-width="2"/>
  <!-- Projector behind screen on right -->
  <rect x="802" y="182" width="22" height="14" rx="3" fill="#38bdf8"/>
  <polygon points="802,189 746,136 746,246" fill="rgba(56,189,248,0.28)" stroke="#38bdf8" stroke-width="1"/>
  <!-- Actor touching screen downstage -->
  <circle cx="718" cy="212" r="6" fill="#fbbf24"/>
  <rect x="714" y="219" width="8" height="27" rx="3" fill="#fbbf24"/>
  <text x="680" y="260" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#7dd3fc">ZERO Shadows!</text>
  <text x="606" y="288" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1e40af">Actors can stand 1 inch from screen</text>
  <text x="606" y="306" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1e40af">without ever blocking the beam.</text>
  <text x="606" y="322" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1d4ed8">Tradeoff: requires clear backstage depth.</text>
</svg>
