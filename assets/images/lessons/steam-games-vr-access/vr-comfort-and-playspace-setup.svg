<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="vr-space-title vr-space-desc">
  <title id="vr-space-title">Safe Classroom VR Play Space, Guardian Zone, and Station Handoff</title>
  <desc id="vr-space-desc">Top-down floor plan of a classroom VR play zone with cleared furniture perimeter, spotter position, wrist straps reminder, and clean station handoff checklist.</desc>
  <rect width="880" height="360" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Before You Put On the Headset: Play Space &amp; Lab Safety Zones</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Physical preparation protects students, controllers, and shared lab stations</text>

  <!-- Floorplan left -->
  <rect x="28" y="76" width="446" height="258" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="48" y="102" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Classroom Play-Space Zones (Top View)</text>

  <!-- Perimeter hazard buffer -->
  <rect x="48" y="116" width="406" height="202" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="6 4"/>
  <text x="64" y="136" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">OUTER BUFFER: Desks, Chairs, Backpacks &amp; Cords Cleared Out</text>

  <!-- Guardian Grid -->
  <rect x="92" y="148" width="230" height="148" rx="14" fill="#ecfdf5" stroke="#0d9488" stroke-width="3"/>
  <text x="207" y="172" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="800" fill="#0f766e">GUARDIAN BOUNDARY</text>
  <circle cx="207" cy="222" r="24" fill="#0f766e"/>
  <text x="207" y="227" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#fff">PLAYER</text>
  <text x="207" y="264" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">Wrist straps tight · Walk calmly</text>
  <text x="207" y="280" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#047857">Never run, jump, or lean outside grid</text>

  <!-- Spotter station -->
  <rect x="336" y="170" width="104" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="388" y="196" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e3a8a">SPOTTER</text>
  <text x="388" y="216" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#1e40af">Watches boundary</text>
  <text x="388" y="232" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#1e40af">&amp; coaches controls</text>
  <text x="388" y="248" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#1e40af">without grabbing!</text>

  <!-- Right: Protocol checklist -->
  <rect x="492" y="76" width="360" height="258" rx="14" fill="#0f172a"/>
  <text x="512" y="106" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Clean Station Handoff Rules</text>

  <rect x="512" y="122" width="320" height="44" rx="8" fill="#1e293b"/>
  <text x="526" y="142" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">1 · Match Computer → Account</text>
  <text x="526" y="158" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">Use ONLY the pre-signed station account.</text>

  <rect x="512" y="174" width="320" height="44" rx="8" fill="#1e293b"/>
  <text x="526" y="194" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#5eead4">2 · Normal PC vs. VR Network</text>
  <text x="526" y="210" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">Go Offline after solo PC; stay Online for VR.</text>

  <rect x="512" y="226" width="320" height="44" rx="8" fill="#1e293b"/>
  <text x="526" y="246" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24">3 · Reset Hardware Cleanly</text>
  <text x="526" y="262" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1">Exit app, close SteamVR, dock headset &amp; straps.</text>

  <rect x="512" y="278" width="320" height="42" rx="8" fill="#3b181f" stroke="#fb7185"/>
  <text x="526" y="297" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#fecaca">Dizzy or Sick? Stop at Once</text>
  <text x="526" y="312" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#fda4af">Remove headset slowly, sit, tell teacher.</text>
</svg>
