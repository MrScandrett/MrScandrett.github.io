<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" role="img" aria-labelledby="vr-pipe-title vr-pipe-desc">
  <title id="vr-pipe-title">Steam Link PC-to-Quest Wireless Streaming and Stereo Frame Budget</title>
  <desc id="vr-pipe-desc">System architecture diagram showing 6DoF controller tracking flowing upstream to the Gaming PC, GPU dual-eye stereo rendering, Ethernet to lab router, 5 GHz Wi-Fi to Meta Quest, and why Offline Mode breaks VR streaming.</desc>
  <defs>
    <marker id="vr-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="vr-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="880" height="370" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">How Steam Link VR Works (And Why Network Continuity Matters)</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">The lab PC renders Left + Right eye frames every ~11ms; the Quest sends head &amp; hand pose back live</text>

  <!-- Gaming PC -->
  <rect x="28" y="82" width="248" height="190" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="44" y="96" width="128" height="22" rx="11" fill="#1d4ed8"/>
  <text x="108" y="111" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">1 · LAB GAMING PC</text>
  <text x="44" y="140" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e3a8a">Stereo Render Engine</text>
  <text x="44" y="160" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1e40af">• Runs Steam + SteamVR</text>
  <text x="44" y="178" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1e40af">• Renders Left &amp; Right eye views</text>
  <text x="44" y="196" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#1e40af">• Target: 90 FPS (~11.1ms budget)</text>
  <rect x="44" y="214" width="216" height="44" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="54" y="233" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#1d4ed8">Encodes live video + spatial</text>
  <text x="54" y="248" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#334155">audio stream over Ethernet</text>

  <!-- Wired Ethernet -->
  <path d="M 276 154 L 348 154" stroke="#0284c7" stroke-width="3" marker-end="url(#vr-arr)"/>
  <text x="312" y="143" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#0369a1">Ethernet</text>
  <path d="M 348 196 L 280 196" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#vr-arr-b)"/>

  <!-- Lab Router -->
  <rect x="354" y="102" width="172" height="150" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="370" y="116" width="106" height="22" rx="11" fill="#334155"/>
  <text x="423" y="131" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">2 · LAB ROUTER</text>
  <text x="370" y="162" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Local LAN Bridge</text>
  <text x="370" y="184" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">Keeps PC wired so</text>
  <text x="370" y="200" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">wireless bandwidth only</text>
  <text x="370" y="216" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">carries 1 wireless hop.</text>

  <!-- 5 GHz Wi-Fi -->
  <path d="M 526 154 L 598 154" stroke="#0284c7" stroke-width="3" marker-end="url(#vr-arr)"/>
  <text x="562" y="143" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#0369a1">5 GHz Wi-Fi</text>
  <path d="M 598 196 L 530 196" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#vr-arr-b)"/>
  <text x="562" y="214" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#047857">6DoF pose</text>

  <!-- Meta Quest -->
  <rect x="604" y="82" width="248" height="190" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="620" y="96" width="136" height="22" rx="11" fill="#0f766e"/>
  <text x="688" y="111" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">3 · META QUEST</text>
  <text x="620" y="140" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800" fill="#064e3b">Display &amp; 6DoF Input</text>
  <text x="620" y="160" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">• Decodes dual-eye frames</text>
  <text x="620" y="178" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">• Tracks head tilt + 2 hands</text>
  <text x="620" y="196" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">• Guardian boundary warns edge</text>
  <rect x="620" y="214" width="216" height="44" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="630" y="233" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#064e3b">Keep Steam ONLINE during VR</text>
  <text x="630" y="248" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#047857">Offline Mode is ONLY after non-VR PC use.</text>

  <!-- Bottom takeaway -->
  <rect x="28" y="292" width="824" height="54" rx="12" fill="#0f172a"/>
  <text x="48" y="315" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#fbbf24">Comfort Rule (Why Lag Causes Motion Sickness):</text>
  <text x="48" y="333" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#e2e8f0">When Wi-Fi drops or latency spikes, inner-ear balance sees movement before the screen updates — stop at once if dizzy.</text>
</svg>
