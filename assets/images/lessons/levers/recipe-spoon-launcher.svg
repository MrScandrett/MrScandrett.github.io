<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" role="img" aria-labelledby="r1Title r1Desc">
  <title id="r1Title">Craft-Stick Spoon Launcher Diagram</title>
  <desc id="r1Desc">Two jumbo craft sticks hinged at the left with rubber bands, wedged apart by a six-stick fulcrum stack lashed in an X pattern, with a plastic spoon strapped to the upper arm launching a soft pom-pom.</desc>
  <defs>
    <linearGradient id="r1Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2c28"/>
      <stop offset="60%" stop-color="#0b2029"/>
      <stop offset="100%" stop-color="#071319"/>
    </linearGradient>
    <linearGradient id="r1Birch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef1c9"/>
      <stop offset="38%" stop-color="#e7b464"/>
      <stop offset="85%" stop-color="#b87930"/>
      <stop offset="100%" stop-color="#855118"/>
    </linearGradient>
    <linearGradient id="r1Stack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde6a6"/>
      <stop offset="55%" stop-color="#dfa34e"/>
      <stop offset="100%" stop-color="#9e6220"/>
    </linearGradient>
    <linearGradient id="r1Spoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="50%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="r1Bowl" cx="48%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="65%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </radialGradient>
    <radialGradient id="r1Pom" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#fef08a"/>
      <stop offset="72%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <pattern id="r1Mat" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#5eead4" stroke-opacity="0.08" stroke-width="0.9"/>
    </pattern>
    <filter id="r1Shadow" x="-12%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4.5" flood-color="#010709" flood-opacity="0.62"/>
    </filter>
  </defs>

  <!-- Makerspace Cutting Mat Backdrop -->
  <rect width="380" height="200" rx="12" fill="url(#r1Bg)"/>
  <rect x="12" y="12" width="356" height="146" rx="8" fill="url(#r1Mat)" stroke="#5eead4" stroke-opacity="0.12" stroke-width="1"/>
  <path d="M0 154 L380 154 L380 200 L0 200 Z" fill="#061216" opacity="0.82"/>
  <ellipse cx="168" cy="166" rx="134" ry="9" fill="#000000" opacity="0.5"/>

  <!-- Launch Trajectory Arc & Ghost Pom-Pom -->
  <path d="M 278 60 Q 312 18 352 34" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5"/>
  <path d="M 344 27 L 354 35 L 342 38" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="322" cy="28" r="8.5" fill="url(#r1Pom)" opacity="0.45"/>

  <g filter="url(#r1Shadow)">
    <!-- Bottom Horizontal Jumbo Craft Stick -->
    <rect x="38" y="148" width="224" height="13" rx="6.5" fill="url(#r1Birch)" stroke="#5c3409" stroke-width="1.3"/>
    <line x1="48" y1="151" x2="252" y2="151" stroke="#fffbeb" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="68" y1="156" x2="232" y2="156" stroke="#78350f" stroke-opacity="0.3" stroke-width="1"/>

    <!-- 6-Stick Wedge Stack (Fulcrum Bundle at x=136..178, y=112..148) -->
    <g>
      <rect x="136" y="142" width="42" height="6.2" rx="3" fill="url(#r1Stack)" stroke="#6b3e11" stroke-width="1"/>
      <rect x="136" y="136" width="42" height="6.2" rx="3" fill="url(#r1Stack)" stroke="#6b3e11" stroke-width="1"/>
      <rect x="136" y="130" width="42" height="6.2" rx="3" fill="url(#r1Stack)" stroke="#6b3e11" stroke-width="1"/>
      <rect x="136" y="124" width="42" height="6.2" rx="3" fill="url(#r1Stack)" stroke="#6b3e11" stroke-width="1"/>
      <rect x="136" y="118" width="42" height="6.2" rx="3" fill="url(#r1Stack)" stroke="#6b3e11" stroke-width="1"/>
      <rect x="136" y="112" width="42" height="6.2" rx="3" fill="url(#r1Stack)" stroke="#6b3e11" stroke-width="1"/>
      <!-- Stack End Rubber Bands -->
      <rect x="141" y="111.5" width="3.5" height="37" rx="1.5" fill="#fbbf24" stroke="#92400e" stroke-width="0.7"/>
      <rect x="170" y="111.5" width="3.5" height="37" rx="1.5" fill="#fbbf24" stroke="#92400e" stroke-width="0.7"/>
    </g>

    <!-- Angled Top Craft Stick + Strapped Plastic Spoon (Hinged at 46, 150, rotated -18.5 deg) -->
    <g transform="translate(46 150) rotate(-18.5)">
      <!-- Contoured Plastic Spoon Handle & Concave Bowl Mounted on Top Stick -->
      <path d="M 88 -11 L 194 -12 Q 208 -13 216 -18 L 216 -8 Q 206 -6 194 -6 L 88 -6 Z" fill="url(#r1Spoon)" stroke="#0f766e" stroke-width="1.1"/>
      <!-- Spoon Bowl (3D Oval + Recessed Interior) -->
      <ellipse cx="233" cy="-15" rx="22" ry="9.5" fill="url(#r1Spoon)" stroke="#0d9488" stroke-width="1.4"/>
      <ellipse cx="233" cy="-15.5" rx="17.5" ry="6.2" fill="url(#r1Bowl)"/>
      <path d="M 220 -18 Q 232 -21 245 -18" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.3" stroke-linecap="round"/>

      <!-- Pom-Pom Seated in Spoon Bowl -->
      <g transform="translate(234 -23)">
        <circle cx="0" cy="0" r="10.5" fill="url(#r1Pom)" stroke="#fef08a" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="2.5 1.5"/>
        <circle cx="-3" cy="-3.5" r="3" fill="#ffffff" opacity="0.75"/>
      </g>

      <!-- Upper Jumbo Craft Stick -->
      <rect x="-8" y="-6.5" width="224" height="13" rx="6.5" fill="url(#r1Birch)" stroke="#5c3409" stroke-width="1.3"/>
      <line x1="4" y1="-3.5" x2="206" y2="-3.5" stroke="#fffbeb" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Rubber Bands Strapping Spoon Handle to Upper Stick -->
      <rect x="108" y="-12.5" width="4.5" height="19.5" rx="2" fill="#4ade80" stroke="#14532d" stroke-width="0.9"/>
      <rect x="176" y="-13" width="4.5" height="20" rx="2" fill="#4ade80" stroke="#14532d" stroke-width="0.9"/>
    </g>

    <!-- Left V-Hinge Rubber Band Wraps -->
    <g fill="#f43f5e" stroke="#881337" stroke-width="0.9">
      <rect x="52" y="141" width="4.2" height="21" rx="2" transform="rotate(-8 54 151)"/>
      <rect x="58" y="139.5" width="4.2" height="22.5" rx="2" transform="rotate(-8 60 151)"/>
      <rect x="64" y="138" width="4.2" height="24" rx="2" transform="rotate(-8 66 151)"/>
    </g>

    <!-- Diagonal X-Lashing Rubber Bands at Crossing Point -->
    <g stroke-linecap="round">
      <line x1="142" y1="103" x2="171" y2="161" stroke="#881337" stroke-width="5.2"/>
      <line x1="142" y1="103" x2="171" y2="161" stroke="#fb7185" stroke-width="3.2"/>
      <line x1="172" y1="95" x2="143" y2="161" stroke="#881337" stroke-width="5.2"/>
      <line x1="172" y1="95" x2="143" y2="161" stroke="#f43f5e" stroke-width="3.2"/>
    </g>

    <!-- Fulcrum Contact Marker -->
    <circle cx="157" cy="112" r="5.5" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.2"/>
  </g>

  <!-- Flex Push-and-Release Indicator Near Spoon -->
  <path d="M 244 42 Q 250 56 246 68" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <path d="M 240 48 L 244 40 L 250 46" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clean Engineering Micro-Labels -->
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.03em">
    <text x="60" y="182" text-anchor="middle" fill="#fda4af">BANDED HINGE</text>
    <text x="157" y="182" text-anchor="middle" fill="#e9d5ff">6-STICK FULCRUM</text>
    <text x="292" y="108" text-anchor="middle" fill="#99f6e4">SPOON + POM-POM</text>
  </g>
</svg>
