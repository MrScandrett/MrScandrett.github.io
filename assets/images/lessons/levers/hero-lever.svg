<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="heroLeverTitle heroLeverDesc">
  <title id="heroLeverTitle">Class 1 Lever Launcher — Effort, Fulcrum, Load, and Torque Balance</title>
  <desc id="heroLeverDesc">An engineered Class 1 lever pivoting on a violet A-frame fulcrum. A downward green effort force on the shorter right arm rotates the hardwood beam clockwise, launching a golden load sphere from the concave cradle cup on the left arm along a sky-blue parabolic arc.</desc>
  <defs>
    <linearGradient id="hlSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#082029"/>
      <stop offset="58%" stop-color="#0b2833"/>
      <stop offset="100%" stop-color="#061318"/>
    </linearGradient>
    <radialGradient id="hlKeyGlow" cx="46%" cy="22%" r="54%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="48%" stop-color="#2dd4bf" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#061318" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hlApexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hlDeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3d44"/>
      <stop offset="35%" stop-color="#11282e"/>
      <stop offset="100%" stop-color="#081519"/>
    </linearGradient>
    <linearGradient id="hlBeamWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef0c7"/>
      <stop offset="24%" stop-color="#eab354"/>
      <stop offset="68%" stop-color="#b97324"/>
      <stop offset="100%" stop-color="#6e3c0e"/>
    </linearGradient>
    <linearGradient id="hlBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hlCupInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="hlFulcrum" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="32%" stop-color="#c084fc"/>
      <stop offset="72%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="hlEffortPad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="hlOrb" cx="34%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#fef08a"/>
      <stop offset="58%" stop-color="#f59e0b"/>
      <stop offset="88%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="hlArcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="38%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="hlGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5eead4" stroke-opacity="0.065" stroke-width="1"/>
      <path d="M 20 0 L 20 40 M 0 20 L 40 20" fill="none" stroke="#5eead4" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <filter id="hlDrop" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#010709" flood-opacity="0.65"/>
    </filter>
    <filter id="hlSoftDrop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#010709" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Studio Backdrop & Blueprint Grid -->
  <rect width="640" height="450" rx="18" fill="url(#hlSky)"/>
  <rect width="640" height="334" rx="18" fill="url(#hlGrid)"/>
  <rect width="640" height="450" rx="18" fill="url(#hlKeyGlow)"/>

  <!-- Subtle Starfield / Atmospheric Dust -->
  <g fill="#cbd5e1" opacity="0.32">
    <circle cx="52" cy="44" r="1.5"/>
    <circle cx="122" cy="30" r="1.1"/>
    <circle cx="204" cy="48" r="1.5"/>
    <circle cx="468" cy="32" r="1.3"/>
    <circle cx="592" cy="46" r="1.7"/>
    <circle cx="606" cy="88" r="1.1"/>
  </g>

  <!-- Layered Horizon Hills -->
  <path d="M0 264 Q108 228 224 256 T456 244 T640 252 L640 340 L0 340 Z" fill="#092126" opacity="0.88"/>
  <path d="M0 292 Q138 262 272 288 T526 274 T640 286 L640 340 L0 340 Z" fill="#0d2c26" opacity="0.92"/>
  <rect y="330" width="640" height="120" fill="#061115"/>

  <!-- Machined Testbed Platform -->
  <ellipse cx="352" cy="336" rx="248" ry="14" fill="#000000" opacity="0.48"/>
  <rect x="34" y="322" width="572" height="14" rx="5" fill="url(#hlDeck)" stroke="#2f525b" stroke-width="1.2"/>
  <line x1="44" y1="324.5" x2="596" y2="324.5" stroke="#99f6e4" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- Protractor Reference Arc Behind Pivot (fx=370, fy=248) -->
  <g transform="translate(370 248)" opacity="0.5">
    <path d="M -56 0 A 56 56 0 0 1 56 0" fill="none" stroke="#c084fc" stroke-opacity="0.38" stroke-width="1.3" stroke-dasharray="3 3"/>
    <line x1="-64" y1="0" x2="64" y2="0" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 0 -56 L 0 -62 M -28 -48.5 L -31 -53.7 M 28 -48.5 L 31 -53.7 M -48.5 -28 L -53.7 -31 M 48.5 -28 L 53.7 -31" stroke="#e9d5ff" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- Ghost Cocked Position (Pre-Launch Reference, tilted -11 deg) -->
  <g transform="translate(370 248) rotate(-11)" opacity="0.17">
    <rect x="-232" y="-9" width="384" height="18" rx="6" fill="none" stroke="#99f6e4" stroke-width="1.6" stroke-dasharray="6 5"/>
    <path d="M -224 -24 C -222 -10, -176 -10, -174 -24" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="-199" cy="-26" r="13" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>
  <!-- Upward Swing Motion Arc at Left Arm -->
  <path d="M 142 268 A 226 226 0 0 1 146 184" fill="none" stroke="#fbbf24" stroke-opacity="0.42" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M 141 192 L 146 181 L 152 191" fill="none" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Target Range Bullseye on Upper-Right (Well Above Effort Pill!) -->
  <g transform="translate(576 112)">
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="11" ry="4" fill="#5eead4" fill-opacity="0.2" stroke="#5eead4" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="2.5" fill="#fef08a"/>
    <line x1="0" y1="8" x2="0" y2="210" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1.2" stroke-dasharray="4 5"/>
  </g>

  <!-- Parabolic Launch Trajectory: Cup (182, 152) -> Apex (356, 48) -> Target (574, 109) -->
  <path d="M 182 152 Q 356 -44 572 108" fill="none" stroke="#041014" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <path d="M 182 152 Q 356 -44 572 108" fill="none" stroke="url(#hlArcGrad)" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="9 8"/>
  <path d="M 562 108 L 574 110 L 569 98" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stroboscopic Motion Ghosts Along Trajectory -->
  <circle cx="222" cy="112" r="10.5" fill="url(#hlOrb)" opacity="0.30"/>
  <circle cx="276" cy="74" r="13.5" fill="url(#hlOrb)" opacity="0.54"/>

  <!-- Hero Projectile Sphere Near Apex (352, 50) -->
  <circle cx="352" cy="50" r="38" fill="url(#hlApexGlow)"/>
  <g filter="url(#hlSoftDrop)">
    <circle cx="352" cy="50" r="18.5" fill="url(#hlOrb)" stroke="#fef3c7" stroke-opacity="0.55" stroke-width="1.4"/>
    <ellipse cx="345" cy="42" rx="5.5" ry="3.6" transform="rotate(-24 345 42)" fill="#ffffff" opacity="0.78"/>
    <!-- Velocity Tangent Vector -->
    <line x1="373" y1="48" x2="412" y2="48" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 405 43 L 415 48 L 405 53" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="421" y="52" fill="#bae6fd" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="800">v</text>
  </g>

  <!-- Main Mechanical Assembly -->
  <g filter="url(#hlDrop)">
    <!-- Fulcrum Trunnion Stand -->
    <rect x="318" y="312" width="104" height="11" rx="3.5" fill="#2e1065" stroke="#c084fc" stroke-width="1.4"/>
    <g fill="#e9d5ff" opacity="0.75">
      <circle cx="330" cy="317.5" r="2.2"/>
      <circle cx="352" cy="317.5" r="2.2"/>
      <circle cx="388" cy="317.5" r="2.2"/>
      <circle cx="410" cy="317.5" r="2.2"/>
    </g>
    <path d="M 332 312 L 358 244 L 382 244 L 408 312 Z" fill="url(#hlFulcrum)" stroke="#e9d5ff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 350 303 L 370 264 L 390 303 Z" fill="#170a29" stroke="#a855f7" stroke-opacity="0.55" stroke-width="1.3" stroke-linejoin="round"/>
    <line x1="337" y1="308" x2="360" y2="249" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>

    <!-- Rotated Hardwood & Brass Lever Beam (fx=370, fy=248, +18 deg clockwise) -->
    <g transform="translate(370 248) rotate(18)">
      <!-- Upward-Opening Concave Brass Launch Cradle Cup (Load Seat!) -->
      <rect x="-211" y="-17" width="24" height="6" rx="2" fill="#78350f" stroke="#fbbf24" stroke-width="1"/>
      <ellipse cx="-199" cy="-28" rx="24" ry="5.5" fill="url(#hlCupInner)" stroke="#fde68a" stroke-width="1.3"/>
      <path d="M -223 -28 C -221 -12, -177 -12, -175 -28 C -183 -23, -215 -23, -223 -28 Z" fill="url(#hlBrass)" stroke="#fef3c7" stroke-width="1.4" stroke-linejoin="round"/>
      <!-- Ghost Rim of Ball Just Leaving Concave Cup -->
      <circle cx="-199" cy="-34" r="13.5" fill="#fbbf24" fill-opacity="0.14" stroke="#fde68a" stroke-opacity="0.5" stroke-width="1.3" stroke-dasharray="3 3"/>

      <!-- Beam Outer Casing & Timber Body -->
      <rect x="-234" y="-12" width="388" height="24" rx="7" fill="url(#hlBeamWood)" stroke="#451a03" stroke-width="2"/>
      <line x1="-224" y1="-8" x2="144" y2="-8" stroke="#fffbeb" stroke-opacity="0.62" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -195 2 Q -120 -1 -55 3 M 28 2 Q 86 5 132 1" fill="none" stroke="#78350f" stroke-opacity="0.38" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Engraved Metric Scale Ticks -->
      <g stroke="#451a03" stroke-opacity="0.62" stroke-width="1.4" stroke-linecap="round">
        <line x1="-200" y1="5" x2="-200" y2="11"/>
        <line x1="-160" y1="7" x2="-160" y2="11"/>
        <line x1="-120" y1="5" x2="-120" y2="11"/>
        <line x1="-80" y1="7" x2="-80" y2="11"/>
        <line x1="-40" y1="5" x2="-40" y2="11"/>
        <line x1="40" y1="5" x2="40" y2="11"/>
        <line x1="80" y1="7" x2="80" y2="11"/>
        <line x1="120" y1="5" x2="120" y2="11"/>
      </g>
      <!-- Brass End Reinforcement Ferrules -->
      <rect x="-234" y="-12" width="18" height="24" rx="5" fill="url(#hlBrass)" stroke="#451a03" stroke-width="1.5"/>
      <rect x="136" y="-12" width="18" height="24" rx="5" fill="url(#hlBrass)" stroke="#451a03" stroke-width="1.5"/>
      <circle cx="-225" cy="0" r="2.2" fill="#451a03"/>
      <circle cx="145" cy="0" r="2.2" fill="#451a03"/>

      <!-- Right Emerald Effort Strike Pad -->
      <rect x="102" y="-18" width="44" height="7" rx="3.5" fill="url(#hlEffortPad)" stroke="#dcfce7" stroke-width="1.3"/>
    </g>

    <!-- Precision Fulcrum Axle Hub -->
    <circle cx="370" cy="248" r="18" fill="#0f172a" stroke="#e9d5ff" stroke-width="2.5"/>
    <circle cx="370" cy="248" r="12.5" fill="#a855f7" stroke="#f3e8ff" stroke-width="2"/>
    <circle cx="370" cy="248" r="5" fill="#fef3c7" stroke="#581c87" stroke-width="1.5"/>
  </g>

  <!-- Release Snap Spark Lines Around Launch Cup -->
  <g stroke="#fde68a" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="158" y1="140" x2="148" y2="132"/>
    <line x1="173" y1="127" x2="168" y2="116"/>
    <line x1="198" y1="131" x2="206" y2="122"/>
  </g>

  <!-- Torque Rotation Indicator Around Fulcrum (Clockwise) -->
  <path d="M 344 214 A 42 42 0 0 1 398 216" fill="none" stroke="#e9d5ff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 391 217 L 400 218 L 397 209" fill="none" stroke="#e9d5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="370" y="201" text-anchor="middle" fill="#e9d5ff" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="800">TORQUE τ</text>

  <!-- EFFORT Force Vector & Callout Pill (Right Side: Well Clear of Trajectory!) -->
  <g filter="url(#hlSoftDrop)">
    <line x1="494" y1="204" x2="494" y2="262" stroke="#051317" stroke-width="10" stroke-linecap="round"/>
    <line x1="494" y1="204" x2="494" y2="262" stroke="#4ade80" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 483 253 L 494 268 L 505 253 Z" fill="#4ade80" stroke="#051317" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="420" y="156" width="148" height="40" rx="10" fill="#07191ee8" stroke="#4ade80" stroke-opacity="0.78" stroke-width="1.6"/>
    <text x="494" y="173" text-anchor="middle" fill="#4ade80" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="0.06em">EFFORT (F<tspan dy="2.5" font-size="9">E</tspan><tspan dy="-2.5">)</tspan></text>
    <text x="494" y="189" text-anchor="middle" fill="#bbf7d0" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">Input push downward</text>
  </g>

  <!-- LOAD Callout Pill & Leader Line (Upper Left) -->
  <g filter="url(#hlSoftDrop)">
    <path d="M 118 112 L 166 146" fill="none" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.8" stroke-dasharray="4 3"/>
    <rect x="34" y="72" width="148" height="40" rx="10" fill="#07191ee8" stroke="#fbbf24" stroke-opacity="0.82" stroke-width="1.6"/>
    <text x="108" y="89" text-anchor="middle" fill="#fbbf24" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="0.06em">LOAD (F<tspan dy="2.5" font-size="9">L</tspan><tspan dy="-2.5">)</tspan></text>
    <text x="108" y="105" text-anchor="middle" fill="#fde68a" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">Launched projectile</text>
  </g>

  <!-- Symmetrical Architectural Dimension Rail -->
  <g>
    <line x1="181" y1="340" x2="181" y2="364" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="370" y1="340" x2="370" y2="364" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="494" y1="340" x2="494" y2="364" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Load Arm Span -->
    <line x1="186" y1="352" x2="322" y2="352" stroke="#fbbf24" stroke-opacity="0.82" stroke-width="2"/>
    <path d="M 193 347 L 184 352 L 193 357" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="254" y="378" text-anchor="middle" fill="#fde68a" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="800">LOAD ARM (d<tspan dy="2.5" font-size="8.5">L</tspan><tspan dy="-2.5">)</tspan></text>

    <!-- Fulcrum Center Badge -->
    <rect x="326" y="341" width="88" height="22" rx="6" fill="#2e1065" stroke="#c084fc" stroke-width="1.4"/>
    <text x="370" y="356" text-anchor="middle" fill="#f3e8ff" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="900" letter-spacing="0.08em">FULCRUM</text>

    <!-- Effort Arm Span -->
    <line x1="418" y1="352" x2="489" y2="352" stroke="#4ade80" stroke-opacity="0.82" stroke-width="2"/>
    <path d="M 482 347 L 491 352 L 482 357" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="454" y="378" text-anchor="middle" fill="#bbf7d0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="800">EFFORT ARM (d<tspan dy="2.5" font-size="8.5">E</tspan><tspan dy="-2.5">)</tspan></text>
  </g>

  <!-- Bottom Law of the Lever Formula Capsule -->
  <rect x="106" y="396" width="428" height="34" rx="10" fill="#081a20" stroke="#2f525b" stroke-width="1.4"/>
  <text x="320" y="418" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13.5" font-weight="800">
    <tspan fill="#4ade80">EFFORT × d</tspan><tspan fill="#4ade80" dy="3" font-size="10">E</tspan><tspan dy="-3" fill="#99f6e4">  =  </tspan><tspan fill="#fbbf24">LOAD × d</tspan><tspan fill="#fbbf24" dy="3" font-size="10">L</tspan>
  </text>
</svg>
