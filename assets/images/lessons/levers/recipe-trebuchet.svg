<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" role="img" aria-labelledby="r3Title r3Desc">
  <title id="r3Title">Counterweight Trebuchet Diagram</title>
  <desc id="r3Desc">A braced wooden A-frame trebuchet on a wide base with a skewer-and-straw bearing at the one-quarter pivot point. A hanging paper-cup counterweight drops on the short right arm, whipping a long left throwing arm and string sling upward to launch a pom-pom.</desc>
  <defs>
    <linearGradient id="r3Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2a29"/>
      <stop offset="58%" stop-color="#0b1f2a"/>
      <stop offset="100%" stop-color="#061116"/>
    </linearGradient>
    <linearGradient id="r3Timber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8b4"/>
      <stop offset="48%" stop-color="#d89b44"/>
      <stop offset="100%" stop-color="#8b5218"/>
    </linearGradient>
    <linearGradient id="r3TimberDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a87031"/>
      <stop offset="100%" stop-color="#59330f"/>
    </linearGradient>
    <linearGradient id="r3Arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#d99438"/>
      <stop offset="52%" stop-color="#fef0c7"/>
      <stop offset="100%" stop-color="#b46e1e"/>
    </linearGradient>
    <linearGradient id="r3Cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="42%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="r3Pom" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#fef08a"/>
      <stop offset="72%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="r3Shadow" x="-12%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4.5" flood-color="#010709" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Makerspace Backdrop -->
  <rect width="380" height="200" rx="12" fill="url(#r3Bg)"/>
  <circle cx="196" cy="62" r="92" fill="none" stroke="#5eead4" stroke-opacity="0.08" stroke-dasharray="3 5"/>
  <path d="M0 158 L380 158 L380 200 L0 200 Z" fill="#051014" opacity="0.84"/>
  <ellipse cx="182" cy="166" rx="146" ry="9.5" fill="#000000" opacity="0.52"/>

  <!-- Sling Whip Arc & Forward Trajectory -->
  <path d="M 114 147 C 42 136, 46 32, 162 22 C 228 16, 294 20, 348 40" fill="none" stroke="#38bdf8" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="6 5"/>
  <path d="M 339 33 L 350 41 L 337 44" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="186" cy="21" r="8" fill="url(#r3Pom)" opacity="0.38"/>
  <circle cx="292" cy="25" r="8.5" fill="url(#r3Pom)" opacity="0.52"/>

  <g filter="url(#r3Shadow)">
    <!-- Rear Base Rail & Rear Braced A-Frame -->
    <rect x="54" y="139" width="252" height="8" rx="3.5" fill="url(#r3TimberDark)" stroke="#452307" stroke-width="1"/>
    <path d="M 164 142 L 204 54 L 244 142" fill="none" stroke="url(#r3TimberDark)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="178" y1="142" x2="204" y2="96" stroke="#6b3e14" stroke-width="5" stroke-linecap="round"/>
    <line x1="230" y1="142" x2="204" y2="96" stroke="#6b3e14" stroke-width="5" stroke-linecap="round"/>

    <!-- Cross-Ties & Central Sling Slide Trough -->
    <polygon points="62,152 170,152 184,142 78,142" fill="#133136" stroke="#2f5c63" stroke-width="1"/>
    <line x1="56" y1="154" x2="72" y2="142" stroke="#d89b44" stroke-width="5" stroke-linecap="round"/>
    <line x1="286" y1="154" x2="302" y2="142" stroke="#d89b44" stroke-width="5" stroke-linecap="round"/>

    <!-- 1:3 Asymmetric Throwing Arm -->
    <g>
      <line x1="66" y1="118" x2="57" y2="112" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="66" y1="118" x2="244" y2="38" stroke="#3b1d06" stroke-width="12" stroke-linecap="round"/>
      <line x1="66" y1="118" x2="244" y2="38" stroke="url(#r3Arm)" stroke-width="8.5" stroke-linecap="round"/>
      <line x1="72" y1="113.5" x2="238" y2="39" stroke="#fffbeb" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round"/>

      <!-- Striped Drinking-Straw Bearing Sleeve Around Skewer Axle -->
      <line x1="203" y1="55" x2="185" y2="64.5" stroke="#c084fc" stroke-width="8.5" stroke-linecap="round"/>
      <line x1="201" y1="56" x2="187" y2="63.5" stroke="#f3e8ff" stroke-width="4" stroke-dasharray="3 3" stroke-linecap="round"/>

      <!-- Two-Cord String Sling + Pouch + Pom-Pom -->
      <path d="M 66 118 Q 84 144 106 146" fill="none" stroke="#ccfbf1" stroke-width="1.8"/>
      <path d="M 59 113 Q 78 148 124 146" fill="none" stroke="#99f6e4" stroke-width="1.6"/>
      <circle cx="115" cy="143" r="8.5" fill="url(#r3Pom)"/>
      <circle cx="113" cy="140" r="2.5" fill="#ffffff" opacity="0.75"/>
      <path d="M 103 145 Q 115 154 127 145 Q 115 148 103 145 Z" fill="#2dd4bf" stroke="#ccfbf1" stroke-width="1.2"/>

      <!-- Hanging Paper-Cup Counterweight -->
      <circle cx="242" cy="39" r="3" fill="#fef3c7" stroke="#78350f" stroke-width="1.2"/>
      <line x1="242" y1="42" x2="230" y2="70" stroke="#fde68a" stroke-width="1.8"/>
      <line x1="242" y1="42" x2="254" y2="70" stroke="#fde68a" stroke-width="1.8"/>
      <ellipse cx="238" cy="70" rx="5" ry="2.2" fill="#cbd5e1" stroke="#475569" stroke-width="0.9"/>
      <ellipse cx="246" cy="70.5" rx="5" ry="2.2" fill="#e2e8f0" stroke="#475569" stroke-width="0.9"/>
      <polygon points="227,70 257,70 252,104 232,104" fill="url(#r3Cup)" stroke="#78350f" stroke-width="1.3" stroke-linejoin="round"/>
      <rect x="225.5" y="68" width="33" height="3.8" rx="1.9" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
      <text x="242" y="91" text-anchor="middle" fill="#451a03" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9.5" font-weight="800">M</text>
    </g>

    <!-- Foreground Low Wide Base Rail & Braced A-Frame -->
    <rect x="38" y="150" width="256" height="9.5" rx="4.5" fill="url(#r3Timber)" stroke="#5c3409" stroke-width="1.2"/>
    <line x1="46" y1="152.5" x2="286" y2="152.5" stroke="#fffbeb" stroke-opacity="0.55" stroke-width="1.3" stroke-linecap="round"/>

    <line x1="158" y1="151" x2="186" y2="108" stroke="url(#r3Timber)" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="214" y1="151" x2="186" y2="108" stroke="url(#r3Timber)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 144 152 L 186 64 L 228 152" fill="none" stroke="#452307" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 144 152 L 186 64 L 228 152" fill="none" stroke="url(#r3Timber)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wooden Skewer Axle & Violet Bearing Collar -->
    <line x1="208" y1="52.5" x2="174" y2="70.5" stroke="#fef3c7" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="186" cy="64" r="7.5" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/>
    <circle cx="186" cy="64" r="2.8" fill="#581c87"/>
  </g>

  <!-- Downward Gravity Effort Arrow Below Paper Cup -->
  <line x1="242" y1="109" x2="242" y2="135" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <path d="M 236 128 L 242 137 L 248 128" fill="none" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clean Engineering Micro-Labels -->
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.03em">
    <text x="92" y="182" text-anchor="middle" fill="#99f6e4">STRING SLING</text>
    <text x="190" y="182" text-anchor="middle" fill="#e9d5ff">1:3 STRAW PIVOT</text>
    <text x="298" y="126" text-anchor="middle" fill="#4ade80">CUP WEIGHT</text>
  </g>
</svg>
