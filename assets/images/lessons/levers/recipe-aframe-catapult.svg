<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" role="img" aria-labelledby="r2Title r2Desc">
  <title id="r2Title">Cardboard A-Frame Catapult Diagram</title>
  <desc id="r2Desc">Three-quarter makerspace view of two triangular corrugated cardboard side supports on a wide fluted base, joined by a wooden dowel axle, top stop crossbar, tensioned rubber band, and craft-stick throwing arm with a bottle-cap cup.</desc>
  <defs>
    <linearGradient id="r2Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#112938"/>
      <stop offset="60%" stop-color="#0b1d29"/>
      <stop offset="100%" stop-color="#061118"/>
    </linearGradient>
    <linearGradient id="r2KraftFront" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#e3aa6e"/>
      <stop offset="52%" stop-color="#b8793e"/>
      <stop offset="100%" stop-color="#7c4a21"/>
    </linearGradient>
    <linearGradient id="r2KraftRear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9e6734"/>
      <stop offset="100%" stop-color="#583416"/>
    </linearGradient>
    <linearGradient id="r2BaseTop" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#cfa36e"/>
      <stop offset="100%" stop-color="#8b572a"/>
    </linearGradient>
    <linearGradient id="r2Arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#eab354"/>
      <stop offset="55%" stop-color="#fde6a6"/>
      <stop offset="100%" stop-color="#c98838"/>
    </linearGradient>
    <linearGradient id="r2Cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="48%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="r2Pom" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#fef08a"/>
      <stop offset="72%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="r2Shadow" x="-12%" y="-15%" width="125%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4.5" flood-color="#010709" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Makerspace Backdrop + Subtle Protractor Arcs -->
  <rect width="380" height="200" rx="12" fill="url(#r2Bg)"/>
  <g stroke="#38bdf8" stroke-opacity="0.10" fill="none">
    <circle cx="122" cy="134" r="95" stroke-dasharray="4 4"/>
    <circle cx="122" cy="134" r="125" stroke-dasharray="3 5"/>
    <line x1="20" y1="134" x2="360" y2="134"/>
  </g>
  <path d="M0 158 L380 158 L380 200 L0 200 Z" fill="#050f15" opacity="0.82"/>
  <ellipse cx="176" cy="166" rx="138" ry="10" fill="#000000" opacity="0.52"/>

  <!-- Launch Trajectory Arc -->
  <path d="M 244 38 Q 294 8 348 34" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5"/>
  <path d="M 340 27 L 350 35 L 338 38" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="306" cy="21" r="8.5" fill="url(#r2Pom)" opacity="0.45"/>

  <g filter="url(#r2Shadow)">
    <!-- 3/4 Perspective Corrugated Cardboard Base -->
    <polygon points="44,154 252,154 288,132 80,132" fill="url(#r2BaseTop)" stroke="#5c3615" stroke-width="1.3" stroke-linejoin="round"/>
    <rect x="44" y="154" width="208" height="10" rx="1.5" fill="#6b3e19" stroke="#d99b58" stroke-width="1"/>
    <path d="M47 159 Q50 155 53 159 T59 159 T65 159 T71 159 T77 159 T83 159 T89 159 T95 159 T101 159 T107 159 T113 159 T119 159 T125 159 T131 159 T137 159 T143 159 T149 159 T155 159 T161 159 T167 159 T173 159 T179 159 T185 159 T191 159 T197 159 T203 159 T209 159 T215 159 T221 159 T227 159 T233 159 T239 159 T245 159 T251 159" fill="none" stroke="#f6d09c" stroke-opacity="0.7" stroke-width="1.1"/>
    <polygon points="252,154 288,132 288,142 252,164" fill="#4f2c11" stroke="#a66c38" stroke-width="1" stroke-linejoin="round"/>

    <!-- Rear Cardboard A-Frame Triangle -->
    <path d="M 118 134 L 180 38 L 242 134 Z M 146 122 L 180 68 L 214 122 Z" fill="url(#r2KraftRear)" fill-rule="evenodd" stroke="#bd8248" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- Rear Dowel Axle Segment -->
    <line x1="146" y1="115" x2="129" y2="126" stroke="#fde6a6" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Front Tension Anchor Dowel Spanning Between Rear and Front Legs -->
    <line x1="201" y1="114" x2="233" y2="94" stroke="#5c3409" stroke-width="7" stroke-linecap="round"/>
    <line x1="201" y1="114" x2="233" y2="94" stroke="#fde6a6" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Craft-Stick Throwing Arm -->
    <g transform="translate(131 124) rotate(-38)">
      <rect x="-10" y="-6.5" width="146" height="13" rx="6" fill="url(#r2Arm)" stroke="#5c3409" stroke-width="1.4"/>
      <line x1="-2" y1="-3" x2="128" y2="-3" stroke="#fffbeb" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Rubber-Band Collar On Arm -->
      <rect x="46" y="-7.5" width="5" height="15" rx="2" fill="#f43f5e" stroke="#881337" stroke-width="0.9"/>
      <!-- Ribbed Bottle-Cap Cup Mounted Near Arm Tip -->
      <g transform="translate(120 -6.5)">
        <circle cx="0" cy="-12" r="9.5" fill="url(#r2Pom)"/>
        <circle cx="-3" cy="-15" r="2.8" fill="#ffffff" opacity="0.75"/>
        <rect x="-13" y="-11" width="26" height="11" rx="3" fill="url(#r2Cap)" stroke="#ccfbf1" stroke-width="1.2"/>
        <g stroke="#0f766e" stroke-width="1.1">
          <line x1="-8" y1="-10" x2="-8" y2="-1"/>
          <line x1="-4" y1="-10" x2="-4" y2="-1"/>
          <line x1="0" y1="-10" x2="0" y2="-1"/>
          <line x1="4" y1="-10" x2="4" y2="-1"/>
          <line x1="8" y1="-10" x2="8" y2="-1"/>
        </g>
      </g>
    </g>

    <!-- Stretched Twin Rubber-Band Loop (Clearly Connecting Arm Collar to Front Tension Peg!) -->
    <line x1="170" y1="96" x2="217" y2="104" stroke="#881337" stroke-width="5" stroke-linecap="round"/>
    <line x1="170" y1="96" x2="217" y2="104" stroke="#fb7185" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="167" y1="91" x2="214" y2="99" stroke="#f43f5e" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Adjustable Top Crossbar Stop -->
    <polygon points="148,58 180,38 194,47 162,67" fill="#d99b58" stroke="#fef08a" stroke-width="1.3" stroke-linejoin="round"/>
    <polygon points="160,65 184,50 188,54 164,69" fill="#4ade80" stroke="#14532d" stroke-width="0.9"/>

    <!-- Foreground Cardboard A-Frame Triangle -->
    <path d="M 86 154 L 148 58 L 210 154 Z M 114 142 L 148 88 L 182 142 Z" fill="url(#r2KraftFront)" fill-rule="evenodd" stroke="#f6d09c" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Front Peg Tip Emerging Through Front Leg -->
    <circle cx="195" cy="118" r="3.5" fill="#fef0c7" stroke="#5c3409" stroke-width="1.2"/>
    <!-- Masking Tape Base Gussets -->
    <polygon points="81,154 96,138 105,142 92,154" fill="#fde68a" opacity="0.82"/>
    <polygon points="199,154 189,141 198,137 214,154" fill="#fde68a" opacity="0.82"/>

    <!-- Foreground Wooden Dowel End & Violet Pivot Washer -->
    <line x1="129" y1="125" x2="108" y2="138" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    <line x1="129" y1="125" x2="108" y2="138" stroke="#fef0c7" stroke-width="5" stroke-linecap="round"/>
    <circle cx="114" cy="134" r="7.5" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/>
    <circle cx="114" cy="134" r="2.8" fill="#581c87"/>
  </g>

  <!-- Clean Engineering Micro-Labels -->
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.03em">
    <text x="86" y="182" text-anchor="middle" fill="#e9d5ff">DOWEL PIVOT</text>
    <text x="196" y="182" text-anchor="middle" fill="#fda4af">BAND TENSION</text>
    <text x="134" y="42" text-anchor="end" fill="#bbf7d0">ANGLE STOP</text>
    <text x="304" y="80" text-anchor="middle" fill="#99f6e4">BOTTLE-CAP CUP</text>
  </g>
</svg>
