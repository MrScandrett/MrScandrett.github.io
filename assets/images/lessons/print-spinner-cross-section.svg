<svg xmlns="http://www.w3.org/2000/svg" width="560" height="270" viewBox="0 0 560 270" role="img" aria-labelledby="cup-figure-title cup-figure-desc"><style>.bl-diagram-label{font:700 11px sans-serif;fill:#465768}.bl-diagram-label.strong{fill:#a94e11}</style><rect width="560" height="270" fill="#fff9f3"/>
                  <title id="cup-figure-title">Cross-section of the captured spinner</title>
                  <desc id="cup-figure-desc">A half-section through the cup and the disc inside it. The cup is a base 2.6 millimetres thick with a wall reaching a radius of 20 millimetres and an internal groove ending at a radius of 16.6 millimetres, closed by a 45-degree chamfered ceiling. The disc spans radius 8 to 16.2 millimetres and is 4 millimetres thick, leaving 0.2 millimetres of air below it, 0.2 millimetres under the groove ceiling at its outer corner, and 0.4 millimetres outside it.</desc>
                  <line x1="60" y1="24" x2="60" y2="228" stroke="#465768" stroke-width="1.2" stroke-dasharray="10 4 2 4" opacity=".6" />
                  <text class="bl-diagram-label" x="60" y="18" text-anchor="middle">axis</text>
                  <polygon points="60,200 360,200 360,50 264,50 309,95 309,161 60,161" fill="rgba(138,106,77,.34)" stroke="#8a6a4d" stroke-width="2" stroke-linejoin="round" />
                  <polygon points="180,158 303,158 303,98 180,98" fill="rgba(232,121,42,.5)" stroke="#a94e11" stroke-width="2" stroke-linejoin="round" />
                  <text class="bl-diagram-label strong" x="241" y="132" text-anchor="middle">disc that spins</text>
                  <text class="bl-diagram-label" x="245" y="186" text-anchor="middle">cup base (2.6 mm)</text>
                  <line x1="287" y1="72" x2="205" y2="46" stroke="#465768" stroke-width="1" opacity=".55" />
                  <text class="bl-diagram-label" x="200" y="42" text-anchor="end">45° chamfer traps the disc</text>
                  <line x1="309" y1="96" x2="378" y2="64" stroke="#465768" stroke-width="1" opacity=".55" />
                  <text class="bl-diagram-label strong" x="384" y="68">0.2 mm ceiling gap</text>
                  <line x1="306" y1="140" x2="378" y2="132" stroke="#465768" stroke-width="1" opacity=".55" />
                  <text class="bl-diagram-label strong" x="384" y="136">0.4 mm side gap</text>
                  <line x1="345" y1="152" x2="378" y2="190" stroke="#465768" stroke-width="1" opacity=".55" />
                  <text class="bl-diagram-label" x="384" y="194">cup wall</text>
                  <line x1="150" y1="161" x2="112" y2="238" stroke="#465768" stroke-width="1" opacity=".55" />
                  <text class="bl-diagram-label strong" x="104" y="252">0.2 mm floor gap</text>
                  <text class="bl-diagram-label" x="60" y="222" text-anchor="middle">r0</text>
                  <text class="bl-diagram-label" x="360" y="222" text-anchor="middle">r20</text>
                </svg>
