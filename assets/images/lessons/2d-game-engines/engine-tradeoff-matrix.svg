<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="ge-mat-title ge-mat-desc">
  <title id="ge-mat-title">Choosing a 2D Game Tool: Scratch, Canvas JS, Kaplay, and Phaser</title>
  <desc id="ge-mat-desc">Comparison matrix contrasting raw HTML5 Canvas, Kaplay, and Phaser 3 across setup speed, built-in physics/tilemaps, code style, and best student project fit.</desc>
  <rect width="880" height="380" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Choosing the Right Engine for Your 2D Project</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">No single tool wins every scenario — pick based on how much plumbing you want built vs. custom</text>

  <!-- Col 1: Vanilla Canvas JS -->
  <rect x="28" y="76" width="262" height="278" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="46" y="92" width="136" height="22" rx="11" fill="#475569"/>
  <text x="114" y="107" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">FROM SCRATCH JS</text>
  <text x="46" y="138" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0f172a">Plain Canvas 2D</text>
  <text x="46" y="160" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">✓ Zero dependencies or downloads</text>
  <text x="46" y="180" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">✓ You control every math step</text>
  <text x="46" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#b45309">• You write your own hitboxes,</text>
  <text x="54" y="216" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#b45309">camera, and sprite animations</text>
  <rect x="46" y="256" width="226" height="80" rx="10" fill="#f1f5f9"/>
  <text x="58" y="276" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#0f172a">Best For:</text>
  <text x="58" y="294" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">Pong, Snake, Breakout, and</text>
  <text x="58" y="310" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#334155">learning how loops really work.</text>

  <!-- Col 2: Kaplay -->
  <rect x="309" y="76" width="262" height="278" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="327" y="92" width="144" height="22" rx="11" fill="#0f766e"/>
  <text x="399" y="107" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">FASTEST PROTOTYPING</text>
  <text x="327" y="138" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800" fill="#064e3b">Kaplay (Browser)</text>
  <text x="327" y="160" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#065f46">✓ Readable component lists</text>
  <text x="327" y="180" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#065f46">✓ Built-in sprite, body(), scene()</text>
  <text x="327" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#065f46">✓ Great for 1-week Game Jams</text>
  <text x="327" y="220" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#047857">• Lighter ecosystem for huge maps</text>
  <rect x="327" y="256" width="226" height="80" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="339" y="276" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#064e3b">Best For:</text>
  <text x="339" y="294" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">First JavaScript platformers,</text>
  <text x="339" y="310" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#065f46">arcade dodgers, rapid ideas.</text>

  <!-- Col 3: Phaser 3 -->
  <rect x="590" y="76" width="262" height="278" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="608" y="92" width="144" height="22" rx="11" fill="#4f46e5"/>
  <text x="680" y="107" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">FULL TOOLKIT</text>
  <text x="608" y="138" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800" fill="#1e1b4b">Phaser 3</text>
  <text x="608" y="160" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#312e81">✓ Rich Tiled tilemap support</text>
  <text x="608" y="180" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#312e81">✓ Arcade &amp; Matter physics options</text>
  <text x="608" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#312e81">✓ Tweens, particles, cameras</text>
  <text x="608" y="220" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4338ca">• More preload/scene boilerplate</text>
  <rect x="608" y="256" width="226" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="620" y="276" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#1e1b4b">Best For:</text>
  <text x="620" y="294" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#312e81">Multi-level RPGs, Metroidvanias,</text>
  <text x="620" y="310" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#312e81">particle-rich browser builds.</text>
</svg>
