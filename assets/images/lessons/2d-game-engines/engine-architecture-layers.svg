<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="ge-arch-title ge-arch-desc">
  <title id="ge-arch-title">2D Game Engine Architecture Layers</title>
  <desc id="ge-arch-desc">Layered architecture diagram showing how a 2D game engine separates the game rules you write from the built-in plumbing: scene tree, physics and collisions, input polling, audio playback, asset loader, and 60 FPS renderer.</desc>
  <rect width="880" height="380" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Inside a 2D Game Engine: Your Rules on Top of Built-In Plumbing</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">An engine handles repeatable systems so your code stays focused on mechanics, levels, and feel</text>

  <!-- Top layer: Your game -->
  <rect x="28" y="76" width="824" height="72" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="46" y="90" width="166" height="20" rx="10" fill="#0f766e"/>
  <text x="129" y="104" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">YOUR GAME LOGIC</text>
  <text x="228" y="105" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#064e3b">Player Moves · Scoring · Win / Lose Rules · Level Layout</text>
  <text x="46" y="132" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#065f46">onCollide("player", "coin", collect) · if score &gt;= 10 go("victory") · speed / jump feel</text>

  <!-- Engine Box wrapper -->
  <rect x="28" y="164" width="824" height="192" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="46" y="188" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e293b">BUILT-IN ENGINE SUBSYSTEMS (Handled Every 16.6ms Frame)</text>

  <!-- Row 1 of subsystems -->
  <rect x="46" y="202" width="186" height="66" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="60" y="224" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#312e81">1 · Scene Graph</text>
  <text x="60" y="242" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#3730a3">Menu → Level 1 → Game Over</text>
  <text x="60" y="257" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4f46e5">Spawns &amp; cleans entities</text>

  <rect x="246" y="202" width="186" height="66" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="260" y="224" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e3a8a">2 · Input Polling</text>
  <text x="260" y="242" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1e40af">Keyboard, mouse, touch,</text>
  <text x="260" y="257" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#2563eb">&amp; gamepad unified API</text>

  <rect x="446" y="202" width="192" height="66" rx="10" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="460" y="224" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#78350f">3 · Physics &amp; Collisions</text>
  <text x="460" y="242" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#92400e">Gravity, delta-time steps,</text>
  <text x="460" y="257" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#b45309">AABB / tilemap hitboxes</text>

  <rect x="652" y="202" width="182" height="66" rx="10" fill="#fdf4ff" stroke="#c084fc"/>
  <text x="666" y="224" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#581c87">4 · Camera &amp; Audio</text>
  <text x="666" y="242" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b21a8">Follow viewport, zoom,</text>
  <text x="666" y="257" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7e22ce">shake, &amp; sound mixer</text>

  <!-- Bottom engine bar: Asset Loader & Canvas/WebGL -->
  <rect x="46" y="280" width="788" height="60" rx="10" fill="#0f172a"/>
  <text x="64" y="304" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">5 · Asset Preloader + 60 FPS Renderer (Canvas / WebGL)</text>
  <text x="64" y="324" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Loads sprite sheets, fonts, and audio buffers cleanly before Level 1 starts, then batches every visible frame to GPU pixels.</text>
</svg>
