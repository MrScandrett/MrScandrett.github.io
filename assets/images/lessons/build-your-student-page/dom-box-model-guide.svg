<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="sp-box-title sp-box-desc">
  <title id="sp-box-title">CSS Box Model and Semantic Student Page Anatomy</title>
  <desc id="sp-box-desc">Two-panel reference diagram showing the four CSS Box Model layers (margin, border, padding, content) and a five-section semantic student project page wireframe (intro, example, practice, checkpoint, reflection).</desc>
  <rect width="880" height="380" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Layout Blueprint: The CSS Box Model &amp; A Teaching Page Structure</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Every rectangular element obeys the same four spacing rings, and great project pages follow five clear beats</text>

  <!-- Left: Box Model -->
  <rect x="28" y="76" width="404" height="278" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="102" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#0f172a">CSS Box Model Layers (Outside → In)</text>

  <rect x="52" y="118" width="356" height="218" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="6 4"/>
  <text x="68" y="138" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#92400e">MARGIN (pushes neighbors away outside)</text>

  <rect x="82" y="150" width="296" height="166" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
  <text x="96" y="170" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0369a1">BORDER (visible edge frame)</text>

  <rect x="110" y="182" width="240" height="114" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="124" y="202" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#166534">PADDING (breathing room inside)</text>

  <rect x="142" y="216" width="176" height="58" rx="6" fill="#4f46e5"/>
  <text x="230" y="242" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">CONTENT</text>
  <text x="230" y="260" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#e0e7ff">Text, Canvas, or Image</text>

  <!-- Right: Student Teaching Page Blueprint -->
  <rect x="448" y="76" width="404" height="278" rx="14" fill="#0f172a"/>
  <text x="468" y="104" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#f8fafc">5 Beats of a Teaching Student Page</text>

  <rect x="468" y="120" width="364" height="38" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="484" y="143" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#7dd3fc">1 · Hero Intro</text>
  <text x="588" y="143" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">What you built &amp; why it matters</text>

  <rect x="468" y="164" width="364" height="38" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="484" y="187" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#6ee7b7">2 · Worked Example</text>
  <text x="614" y="187" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Code snippet, photo, or state diagram</text>

  <rect x="468" y="208" width="364" height="38" rx="8" fill="#1e293b" stroke="#a78bfa"/>
  <text x="484" y="231" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#c4b5fd">3 · Interactive Try-It</text>
  <text x="622" y="231" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Controls visitors can test live</text>

  <rect x="468" y="252" width="364" height="38" rx="8" fill="#1e293b" stroke="#fbbf24"/>
  <text x="484" y="275" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#fcd34d">4 · Checkpoint Quiz</text>
  <text x="618" y="275" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Question checking real understanding</text>

  <rect x="468" y="296" width="364" height="38" rx="8" fill="#1e293b" stroke="#fb7185"/>
  <text x="484" y="319" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#fda4af">5 · Test Reflection</text>
  <text x="612" y="319" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Bugs hit, trials run, what improved</text>
</svg>
