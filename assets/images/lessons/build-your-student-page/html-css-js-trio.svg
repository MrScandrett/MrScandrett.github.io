<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="sp-trio-title sp-trio-desc">
  <title id="sp-trio-title">How HTML, CSS, and JavaScript Work Together on One Page</title>
  <desc id="sp-trio-desc">Diagram comparing HTML (semantic structure and headings), CSS (layout, colors, spacing), and JavaScript (button events and live DOM updates) operating together on a student web page.</desc>
  <rect width="880" height="380" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">The Web Trio: Structure (HTML), Style (CSS), and Behavior (JS)</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">All three files connect to the exact same DOM elements inside the live browser preview</text>

  <!-- HTML -->
  <rect x="28" y="76" width="262" height="278" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <rect x="46" y="92" width="110" height="22" rx="11" fill="#ea580c"/>
  <text x="101" y="107" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#fff">index.html</text>
  <text x="46" y="138" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#7c2d12">1 · Bones &amp; Meaning</text>
  <text x="46" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9a3412">Declares WHAT each piece IS:</text>
  <rect x="46" y="172" width="226" height="106" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="58" y="192" font-family="JetBrains Mono, monospace" font-size="11" fill="#7c2d12">&lt;header&gt;Title&lt;/header&gt;</text>
  <text x="58" y="210" font-family="JetBrains Mono, monospace" font-size="11" fill="#7c2d12">&lt;main&gt;</text>
  <text x="58" y="228" font-family="JetBrains Mono, monospace" font-size="11" fill="#7c2d12">  &lt;h1&gt;My Project&lt;/h1&gt;</text>
  <text x="58" y="246" font-family="JetBrains Mono, monospace" font-size="11" fill="#c2410c">  &lt;button id="btn"&gt;Run&lt;/button&gt;</text>
  <text x="58" y="264" font-family="JetBrains Mono, monospace" font-size="11" fill="#7c2d12">&lt;/main&gt;</text>
  <text x="46" y="302" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#7c2d12">Match IDs carefully:</text>
  <text x="46" y="320" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9a3412">Every opened tag closes with &lt;/tag&gt;</text>

  <!-- CSS -->
  <rect x="309" y="76" width="262" height="278" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="327" y="92" width="110" height="22" rx="11" fill="#2563eb"/>
  <text x="382" y="107" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#fff">style.css</text>
  <text x="327" y="138" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e3a8a">2 · Skin, Color &amp; Grid</text>
  <text x="327" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#1e40af">Controls HOW elements look:</text>
  <rect x="327" y="172" width="226" height="106" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="339" y="192" font-family="JetBrains Mono, monospace" font-size="11" fill="#1e3a8a">body {</text>
  <text x="339" y="210" font-family="JetBrains Mono, monospace" font-size="11" fill="#1e40af">  font-family: system-ui;</text>
  <text x="339" y="228" font-family="JetBrains Mono, monospace" font-size="11" fill="#1e40af">  background: #f8fafc;</text>
  <text x="339" y="246" font-family="JetBrains Mono, monospace" font-size="11" fill="#1e3a8a">}</text>
  <text x="339" y="264" font-family="JetBrains Mono, monospace" font-size="11" fill="#2563eb">#btn { border-radius: 8px; }</text>
  <text x="327" y="302" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Selectors aim at tags/classes:</text>
  <text x="327" y="320" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1e40af"># matches id · . matches class</text>

  <!-- JS -->
  <rect x="590" y="76" width="262" height="278" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="608" y="92" width="110" height="22" rx="11" fill="#0f766e"/>
  <text x="663" y="107" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#fff">script.js</text>
  <text x="608" y="138" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#064e3b">3 · Muscles &amp; Events</text>
  <text x="608" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#065f46">Reacts WHEN user acts:</text>
  <rect x="608" y="172" width="226" height="106" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="620" y="192" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#064e3b">const b = document</text>
  <text x="620" y="208" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#047857">  .getElementById("btn");</text>
  <text x="620" y="228" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#064e3b">b.addEventListener("click",</text>
  <text x="620" y="246" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#065f46">  () =&gt; b.textContent="Done!"</text>
  <text x="620" y="264" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#064e3b">);</text>
  <text x="608" y="302" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#064e3b">Case-sensitive lookup:</text>
  <text x="608" y="320" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#065f46">getElementById("Btn") != id="btn"</text>
</svg>
