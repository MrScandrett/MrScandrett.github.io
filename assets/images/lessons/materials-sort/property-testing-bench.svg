<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="ptb-title">
  <title id="ptb-title">Four Mechanical Properties Testing Bench</title>
  <rect width="880" height="340" rx="16" fill="#fffbeb"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#78350f">Materials Property Testing Bench</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#92400e">Push, squeeze, bend, or stretch each sample to see what a material does under real load.</text>

  <!-- 1. Hard -->
  <g transform="translate(24 78)">
    <rect width="196" height="236" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <text x="16" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#92400e">1. HARD (Resists denting)</text>
    <path d="M56,118 L142,118 L156,144 L42,144 Z" fill="#64748b" stroke="#334155" stroke-width="2.5"/>
    <path d="M98,66 L98,108" stroke="#f97316" stroke-width="4"/>
    <polygon points="98,116 90,102 106,102" fill="#f97316"/>
    <rect x="64" y="52" width="68" height="18" rx="4" fill="#334155"/>
    <text x="98" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">PROBE 50 N</text>
    <text x="16" y="176" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Oak block / Brick / Steel</text>
    <text x="16" y="196" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Keeps its shape when pressed;</text>
    <text x="16" y="211" font-family="system-ui,sans-serif" font-size="11" fill="#475569">protects &amp; holds heavy weight.</text>
  </g>

  <!-- 2. Soft -->
  <g transform="translate(236 78)">
    <rect width="196" height="236" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <text x="16" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#92400e">2. SOFT (Squishes easily)</text>
    <path d="M44,118 Q98,142 152,118 L152,150 Q98,154 44,150 Z" fill="#f59e0b" fill-opacity="0.35" stroke="#d97706" stroke-width="2.5"/>
    <circle cx="72" cy="134" r="2.5" fill="#b45309"/>
    <circle cx="118" cy="136" r="2.5" fill="#b45309"/>
    <path d="M98,66 L98,116" stroke="#f97316" stroke-width="4"/>
    <polygon points="98,125 90,111 106,111" fill="#f97316"/>
    <rect x="64" y="52" width="68" height="18" rx="4" fill="#334155"/>
    <text x="98" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">PROBE 5 N</text>
    <text x="16" y="176" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Sponge / Foam / Cotton</text>
    <text x="16" y="196" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Compresses and cushions</text>
    <text x="16" y="211" font-family="system-ui,sans-serif" font-size="11" fill="#475569">bumps gently, then springs back.</text>
  </g>

  <!-- 3. Flexible -->
  <g transform="translate(448 78)">
    <rect width="196" height="236" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <text x="16" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#0f766e">3. FLEXIBLE (Bends cleanly)</text>
    <rect x="34" y="102" width="32" height="44" rx="4" fill="#475569"/>
    <path d="M66,114 Q118,114 156,146" fill="none" stroke="#14b8a6" stroke-width="10" stroke-linecap="round"/>
    <path d="M148,120 L156,138" stroke="#f97316" stroke-width="3.5"/>
    <polygon points="156,144 148,132 162,132" fill="#f97316"/>
    <text x="16" y="176" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Rubber hose / Copper wire</text>
    <text x="16" y="196" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Curves smoothly around</text>
    <text x="16" y="211" font-family="system-ui,sans-serif" font-size="11" fill="#475569">corners without cracking.</text>
  </g>

  <!-- 4. Rigid -->
  <g transform="translate(660 78)">
    <rect width="196" height="236" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <text x="16" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#1d4ed8">4. RIGID (Refuses to bend)</text>
    <rect x="34" y="102" width="32" height="44" rx="4" fill="#475569"/>
    <rect x="66" y="110" width="96" height="12" rx="3" fill="#2563eb"/>
    <path d="M148,76 L148,100" stroke="#f97316" stroke-width="3.5"/>
    <polygon points="148,107 140,95 156,95" fill="#f97316"/>
    <text x="16" y="176" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Metal spoon / Hardwood stick</text>
    <text x="16" y="196" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Stays straight under sideways</text>
    <text x="16" y="211" font-family="system-ui,sans-serif" font-size="11" fill="#475569">force; snaps if pushed too far.</text>
  </g>
</svg>
