<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="eliza-pipe-title eliza-pipe-desc">
  <title id="eliza-pipe-title">1966 ELIZA MAD-SLIP 6-Stage Processing Pipeline &amp; 36-bit BCD Memory Queue</title>
  <desc id="eliza-pipe-desc">Schematic diagram showing how Weizenbaum's 1966 DOCTOR script slices clauses at punctuation and BUT, swaps pronouns, sorts keywords by precedence on KEYSTACK, decomposes wildcards, cycles through reassembly rules, and hashes MY-clauses with a 36-bit Hollerith BCD SLIP HASH for LIMIT 4 memory recall.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b5e3a" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309" />
    </marker>
  </defs>

  <rect width="960" height="520" rx="16" fill="#f6f8f5" stroke="#cbd5ce" stroke-width="2" />
  <rect x="24" y="20" width="912" height="44" rx="8" fill="#132018" />
  <text x="42" y="48" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#d9ffe3">MIT PROJECT MAC · IBM 7094 CTSS · ELIZA MAD-SLIP PIPELINE (1966)</text>

  <!-- Stage 1 -->
  <rect x="28" y="88" width="276" height="122" rx="10" fill="#ffffff" stroke="#8fb39b" stroke-width="2" />
  <text x="42" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#14532d">1. CLAUSE GUILLOTINE</text>
  <text x="42" y="134" font-family="ui-monospace, monospace" font-size="12" fill="#1e293b">Delimiters: ,  .  BUT</text>
  <text x="42" y="156" font-family="system-ui, sans-serif" font-size="12" fill="#334155">Drops keyword-free openers;</text>
  <text x="42" y="174" font-family="system-ui, sans-serif" font-size="12" fill="#334155">cuts everything after first</text>
  <text x="42" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#334155">clause that holds a keyword.</text>

  <!-- Arrow 1->2 -->
  <line x1="304" y1="149" x2="340" y2="149" stroke="#1b5e3a" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Stage 2 -->
  <rect x="342" y="88" width="276" height="122" rx="10" fill="#ffffff" stroke="#8fb39b" stroke-width="2" />
  <text x="356" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#14532d">2. TOKEN SCAN &amp; SWAPS</text>
  <text x="356" y="134" font-family="ui-monospace, monospace" font-size="12" fill="#1e293b">I → YOU   MY → YOUR   ME → YOU</text>
  <text x="356" y="156" font-family="system-ui, sans-serif" font-size="12" fill="#334155">Applies word substitutions and</text>
  <text x="356" y="174" font-family="system-ui, sans-serif" font-size="12" fill="#334155">attaches DLIST category tags</text>
  <text x="356" y="192" font-family="ui-monospace, monospace" font-size="12" fill="#1e293b">(/FAMILY, /BELIEF, /NOUN).</text>

  <!-- Arrow 2->3 -->
  <line x1="618" y1="149" x2="654" y2="149" stroke="#1b5e3a" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Stage 3 -->
  <rect x="656" y="88" width="276" height="122" rx="10" fill="#ffffff" stroke="#8fb39b" stroke-width="2" />
  <text x="670" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#14532d">3. KEYSTACK (PRECEDENCE)</text>
  <text x="670" y="134" font-family="ui-monospace, monospace" font-size="12" fill="#1e293b">COMPUTER(50) &gt; MY(2) &gt; I(0)</text>
  <text x="670" y="156" font-family="system-ui, sans-serif" font-size="12" fill="#334155">Highest rank pushes to top.</text>
  <text x="670" y="174" font-family="system-ui, sans-serif" font-size="12" fill="#334155">Ties or lower ranks go to bottom.</text>
  <text x="670" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#334155">Follows (=KEY) &amp; (PRE ...) links.</text>

  <!-- Arrow 3->4 (down) -->
  <line x1="794" y1="210" x2="794" y2="246" stroke="#1b5e3a" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Stage 4 -->
  <rect x="656" y="248" width="276" height="126" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
  <text x="670" y="272" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af">4. DECOMPOSITION MATCH</text>
  <text x="670" y="294" font-family="ui-monospace, monospace" font-size="12" fill="#1e293b">(0 YOUR 0 (/FAMILY) 0)</text>
  <text x="670" y="318" font-family="system-ui, sans-serif" font-size="12" fill="#334155">0 = greedy wildcard span.</text>
  <text x="670" y="336" font-family="system-ui, sans-serif" font-size="12" fill="#334155">Captures numbered slices [1..5]</text>
  <text x="670" y="354" font-family="system-ui, sans-serif" font-size="12" fill="#334155">or falls back to (NEWKEY).</text>

  <!-- Arrow 4->5 (left) -->
  <line x1="656" y1="311" x2="620" y2="311" stroke="#1b5e3a" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Stage 5 -->
  <rect x="342" y="248" width="276" height="126" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
  <text x="356" y="272" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af">5. REASSEMBLY ROTATION</text>
  <text x="356" y="294" font-family="ui-monospace, monospace" font-size="12" fill="#1e293b">Slot [1..5] → Template #k</text>
  <text x="356" y="318" font-family="system-ui, sans-serif" font-size="12" fill="#334155">Cycles cursor through fixed list</text>
  <text x="356" y="336" font-family="system-ui, sans-serif" font-size="12" fill="#334155">of replies so consecutive turns</text>
  <text x="356" y="354" font-family="system-ui, sans-serif" font-size="12" fill="#334155">rotate before wrapping back to #1.</text>

  <!-- Arrow 5->6 (left) -->
  <line x1="342" y1="311" x2="306" y2="311" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow-amber)" />

  <!-- Stage 6 -->
  <rect x="28" y="248" width="276" height="126" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
  <text x="42" y="272" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#92400e">6. 36-BIT BCD MEMORY QUEUE</text>
  <text x="42" y="294" font-family="ui-monospace, monospace" font-size="12" fill="#1e293b">HERE → 302551256060₈ → #3</text>
  <text x="42" y="318" font-family="system-ui, sans-serif" font-size="12" fill="#451a03">MY rule packs last word into 6-bit</text>
  <text x="42" y="336" font-family="system-ui, sans-serif" font-size="12" fill="#451a03">BCD, mid-square hashes 0..3,</text>
  <text x="42" y="354" font-family="system-ui, sans-serif" font-size="12" fill="#451a03">and replays when LIMIT = 4.</text>

  <!-- Bottom summary strip -->
  <rect x="28" y="396" width="904" height="98" rx="10" fill="#132018" />
  <text x="46" y="423" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#7dffb0">TELETYPE OUTPUT CARRIAGE (IBM 1050 / MODEL 33, 110 BAUD)</text>
  <text x="46" y="447" font-family="system-ui, sans-serif" font-size="13" fill="#e2f5e7">• Zero learned weights · Zero training corpus · Zero model of human feelings or grammar truth.</text>
  <text x="46" y="470" font-family="system-ui, sans-serif" font-size="13" fill="#b7dec2">• When KEYSTACK is empty: if LIMIT = 4 and MEMORY is non-empty, pop oldest MEMORY; else emit NONE template.</text>
</svg>
