<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="llm-evo-title llm-evo-desc">
  <title id="llm-evo-title">60-Year Evolution of Language Machines: 1966 ELIZA to Transformer LLMs</title>
  <desc id="llm-evo-desc">Architectural comparison diagram tracing six eras of natural language computing from 1966 pattern rules (ELIZA) through 1972 symbolic parse trees, 1990s statistical N-grams, 2013 Word2Vec embeddings, 2014 RNN/LSTM hidden states, and 2017-present Transformer self-attention.</desc>

  <rect width="960" height="500" rx="16" fill="#0f172a" />
  <text x="32" y="44" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">FROM ELIZA TO MODERN LLMS: HOW MACHINES HANDLE LANGUAGE</text>
  <text x="32" y="68" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Each paradigm solved a limit of the previous one—while expanding both fluency and the risk of anthropomorphism.</text>

  <!-- Era 1: 1966 -->
  <rect x="30" y="92" width="286" height="176" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2" />
  <text x="48" y="120" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#6ee7b7">1966 · PATTERN RULES</text>
  <text x="48" y="144" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">ELIZA (MAD-SLIP)</text>
  <text x="48" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• 0 learned weights</text>
  <text x="48" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Keyword rank + pronoun flips</text>
  <text x="48" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• 1 clause context (cut at BUT)</text>
  <text x="48" y="236" font-family="system-ui, sans-serif" font-size="12" fill="#fca5a5">Limit: Zero semantics or truth</text>

  <!-- Era 2: 1972 -->
  <rect x="336" y="92" width="286" height="176" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2" />
  <text x="354" y="120" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#93c5fd">1972 · SYMBOLIC SYNTAX</text>
  <text x="354" y="144" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Parse Trees (SHRDLU)</text>
  <text x="354" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Hand-written grammar rules</text>
  <text x="354" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Explicit micro-world objects</text>
  <text x="354" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Maps Subject / Verb / Object</text>
  <text x="354" y="236" font-family="system-ui, sans-serif" font-size="12" fill="#fca5a5">Limit: Breaks on slang &amp; open text</text>

  <!-- Era 3: 1990s -->
  <rect x="642" y="92" width="288" height="176" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2" />
  <text x="660" y="120" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#fcd34d">1990s · CORPUS COUNTS</text>
  <text x="660" y="144" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">N-Gram Predictors</text>
  <text x="660" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Empirical next-word tables</text>
  <text x="660" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Learns probabilities from text</text>
  <text x="660" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Only sees last 1–4 words</text>
  <text x="660" y="236" font-family="system-ui, sans-serif" font-size="12" fill="#fca5a5">Limit: Blind to long-range context</text>

  <!-- Era 4: 2013 -->
  <rect x="30" y="292" width="286" height="176" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="2" />
  <text x="48" y="320" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#d8b4fe">2013 · GEOMETRY</text>
  <text x="48" y="344" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Word2Vec Embeddings</text>
  <text x="48" y="370" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• ~300D continuous vectors</text>
  <text x="48" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Synonyms cluster in space</text>
  <text x="48" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Vector analogies (king−man+woman)</text>
  <text x="48" y="436" font-family="system-ui, sans-serif" font-size="12" fill="#fca5a5">Limit: Static point ("bank" collides)</text>

  <!-- Era 5: 2014 -->
  <rect x="336" y="292" width="286" height="176" rx="12" fill="#1e293b" stroke="#fb923c" stroke-width="2" />
  <text x="354" y="320" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#fdba74">2014 · SEQUENCE STATE</text>
  <text x="354" y="344" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">RNN / LSTM</text>
  <text x="354" y="370" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Passes hidden state h_t forward</text>
  <text x="354" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Captures word order sequentially</text>
  <text x="354" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">• Gated memory retention</text>
  <text x="354" y="436" font-family="system-ui, sans-serif" font-size="12" fill="#fca5a5">Limit: Early words decay / bottleneck</text>

  <!-- Era 6: 2017-Now -->
  <rect x="642" y="292" width="288" height="176" rx="12" fill="#0f2922" stroke="#10b981" stroke-width="2.5" />
  <text x="660" y="320" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#6ee7b7">2017–NOW · SELF-ATTENTION</text>
  <text x="660" y="344" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Transformers &amp; LLMs</text>
  <text x="660" y="370" font-family="system-ui, sans-serif" font-size="12" fill="#d1fae5">• Billions–trillions of parameters</text>
  <text x="660" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#d1fae5">• Direct Q·K·V context links</text>
  <text x="660" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#d1fae5">• Softmax + temperature sampling</text>
  <text x="660" y="436" font-family="system-ui, sans-serif" font-size="12" fill="#fde68a">Risk: Amplifies the ELIZA Effect</text>
</svg>
