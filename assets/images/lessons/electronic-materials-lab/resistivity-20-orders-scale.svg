<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="r20-title">
  <title id="r20-title">Electrical Resistivity Across Twenty Orders of Magnitude</title>
  <defs>
    <linearGradient id="r20-grad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="48%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="920" height="340" rx="16" fill="#0f172a"/>
  <text x="30" y="40" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Electrical Resistivity Across 20 Orders of Magnitude (ρ, Ω·m)</text>
  <text x="30" y="61" font-family="system-ui,sans-serif" font-size="12.5" fill="#94a3b8">No other engineering property spans a wider physical range — from copper PCB traces to high-voltage porcelain insulators.</text>

  <!-- Band regions -->
  <rect x="44" y="92" width="236" height="40" rx="8" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="162" y="117" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#7dd3fc">CONDUCTORS (10⁻⁸ – 10⁻⁵)</text>

  <rect x="292" y="92" width="270" height="40" rx="8" fill="#7c3aed" fill-opacity="0.24" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="427" y="117" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#ddd6fe">SEMICONDUCTORS (10⁻⁴ – 10⁴)</text>

  <rect x="574" y="92" width="302" height="40" rx="8" fill="#ea580c" fill-opacity="0.22" stroke="#fb923c" stroke-width="1.5"/>
  <text x="725" y="117" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#fed7aa">INSULATORS (10⁸ – 10¹⁶)</text>

  <!-- Logarithmic bar -->
  <rect x="44" y="160" width="832" height="16" rx="8" fill="url(#r20-grad)"/>

  <!-- Ticks and Callouts -->
  <g font-family="system-ui,sans-serif" font-size="11.5" fill="#e2e8f0">
    <!-- Silver & Copper -->
    <line x1="62" y1="150" x2="62" y2="210" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="62" cy="168" r="5" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="62" y="226" font-weight="800" fill="#7dd3fc">Cu / Ag</text>
    <text x="62" y="242" font-size="10.5" fill="#cbd5e1">1.7×10⁻⁸ Ω·m</text>

    <!-- Aluminum / Iron -->
    <line x1="155" y1="150" x2="155" y2="262" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="155" cy="168" r="5" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="155" y="278" font-weight="800" fill="#7dd3fc">Nichrome / Iron</text>
    <text x="155" y="294" font-size="10.5" fill="#cbd5e1">~10⁻⁷ – 10⁻⁶</text>

    <!-- Doped silicon / Graphite -->
    <line x1="330" y1="150" x2="330" y2="210" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="330" cy="168" r="5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="330" y="226" font-weight="800" fill="#ddd6fe">Doped Silicon</text>
    <text x="330" y="242" font-size="10.5" fill="#cbd5e1">10⁻² – 10¹ Ω·m</text>

    <!-- Pure Silicon -->
    <line x1="485" y1="150" x2="485" y2="262" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="485" cy="168" r="5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="485" y="278" font-weight="800" fill="#ddd6fe">Pure Silicon</text>
    <text x="485" y="294" font-size="10.5" fill="#cbd5e1">~2.3×10³ Ω·m</text>

    <!-- Glass -->
    <line x1="690" y1="150" x2="690" y2="210" stroke="#fb923c" stroke-width="2"/>
    <circle cx="690" cy="168" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="690" y="226" font-weight="800" fill="#fed7aa">Glass / PVC</text>
    <text x="690" y="242" font-size="10.5" fill="#cbd5e1">10¹¹ – 10¹⁴ Ω·m</text>

    <!-- PTFE / Quartz -->
    <line x1="836" y1="150" x2="836" y2="262" stroke="#fb923c" stroke-width="2"/>
    <circle cx="836" cy="168" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="840" y="278" text-anchor="end" font-weight="800" fill="#fed7aa">Quartz / PTFE</text>
    <text x="840" y="294" text-anchor="end" font-size="10.5" fill="#cbd5e1">~10¹⁶ Ω·m</text>
  </g>
</svg>
