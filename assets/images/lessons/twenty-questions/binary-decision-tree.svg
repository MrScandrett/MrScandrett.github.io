<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="bdt-title bdt-desc">
  <title id="bdt-title">A Balanced 3-Bit Binary Decision Tree Splitting 8 Outcomes</title>
  <desc id="bdt-desc">Three balanced yes-or-no questions divide 8 equally likely items cleanly in half at each step: 8 to 4 to 2 to 1, reducing Shannon entropy from 3.0 bits to 2.0, 1.0, and 0.0 bits across Bald Eagle, African Elephant, Red Apple, Giant Sequoia, Smartphone, Paper Book, Planet Saturn, and Active Volcano.</desc>

  <rect width="860" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect x="20" y="16" width="820" height="42" rx="10" fill="#0f172a" />
  <text x="38" y="42" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e2f5ff">BALANCED BINARY DECISION TREE · 2³ = 8 OUTCOMES ISOLATED IN 3 BITS</text>

  <!-- Main tree card -->
  <rect x="20" y="72" width="662" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Right entropy ladder -->
  <rect x="696" y="72" width="144" height="310" rx="12" fill="#0f172a" />
  <text x="768" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#7dd3fc">SHANNON ENTROPY</text>
  <line x1="712" y1="104" x2="824" y2="104" stroke="#334155" stroke-width="1" />

  <!-- Ladder rows aligned with tree levels -->
  <text x="768" y="122" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#38bdf8">H = 3.0 bits</text>
  <text x="768" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">8 items (1/8 each)</text>

  <line x1="716" y1="154" x2="820" y2="154" stroke="#1e293b" stroke-width="1" />
  <text x="768" y="180" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#60a5fa">H = 2.0 bits</text>
  <text x="768" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">4 items (−1.0 bit)</text>

  <line x1="716" y1="218" x2="820" y2="218" stroke="#1e293b" stroke-width="1" />
  <text x="768" y="246" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#34d399">H = 1.0 bit</text>
  <text x="768" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">2 items (−1.0 bit)</text>

  <line x1="716" y1="292" x2="820" y2="292" stroke="#1e293b" stroke-width="1" />
  <text x="768" y="330" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#4ade80">H = 0.0 bits</text>
  <text x="768" y="346" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">1 answer (certainty)</text>

  <!-- Edges: Q1 -> Q2a / Q2b -->
  <line x1="352" y1="130" x2="190" y2="164" stroke="#16a34a" stroke-width="2.4" />
  <line x1="352" y1="130" x2="514" y2="164" stroke="#dc2626" stroke-width="2.4" />
  <rect x="242" y="133" width="38" height="18" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1" />
  <text x="261" y="146" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="800" fill="#14532d">YES</text>
  <rect x="424" y="133" width="34" height="18" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1" />
  <text x="441" y="146" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="800" fill="#7f1d1d">NO</text>

  <!-- Edges: Q2 -> Q3 -->
  <line x1="190" y1="202" x2="108" y2="236" stroke="#16a34a" stroke-width="2" />
  <line x1="190" y1="202" x2="272" y2="236" stroke="#dc2626" stroke-width="2" />
  <line x1="514" y1="202" x2="432" y2="236" stroke="#16a34a" stroke-width="2" />
  <line x1="514" y1="202" x2="596" y2="236" stroke="#dc2626" stroke-width="2" />

  <text x="132" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="800" fill="#15803d">YES</text>
  <text x="248" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="800" fill="#b91c1c">NO</text>
  <text x="456" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="800" fill="#15803d">YES</text>
  <text x="572" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="800" fill="#b91c1c">NO</text>

  <!-- Edges: Q3 -> Leaves -->
  <line x1="108" y1="272" x2="68" y2="314" stroke="#16a34a" stroke-width="1.8" />
  <line x1="108" y1="272" x2="148" y2="314" stroke="#dc2626" stroke-width="1.8" />
  <line x1="272" y1="272" x2="232" y2="314" stroke="#16a34a" stroke-width="1.8" />
  <line x1="272" y1="272" x2="312" y2="314" stroke="#dc2626" stroke-width="1.8" />
  <line x1="432" y1="272" x2="392" y2="314" stroke="#16a34a" stroke-width="1.8" />
  <line x1="432" y1="272" x2="472" y2="314" stroke="#dc2626" stroke-width="1.8" />
  <line x1="596" y1="272" x2="556" y2="314" stroke="#16a34a" stroke-width="1.8" />
  <line x1="596" y1="272" x2="636" y2="314" stroke="#dc2626" stroke-width="1.8" />

  <text x="78" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800" fill="#15803d">Y</text>
  <text x="138" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800" fill="#b91c1c">N</text>
  <text x="242" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800" fill="#15803d">Y</text>
  <text x="302" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800" fill="#b91c1c">N</text>
  <text x="402" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800" fill="#15803d">Y</text>
  <text x="462" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800" fill="#b91c1c">N</text>
  <text x="566" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800" fill="#15803d">Y</text>
  <text x="626" y="297" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800" fill="#b91c1c">N</text>

  <!-- Root Node Q1 -->
  <rect x="242" y="88" width="220" height="42" rx="10" fill="#1d4ed8" />
  <text x="352" y="106" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#bfdbfe">Q1 · SPLIT 4 vs 4 (+1.00 bit)</text>
  <text x="352" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Living biological organism?</text>

  <!-- Layer 2 Nodes Q2 -->
  <rect x="115" y="164" width="150" height="38" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="190" y="180" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#4338ca">Q2a · 2 vs 2 (+1.00 bit)</text>
  <text x="190" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e1b4b">Is it an animal?</text>

  <rect x="439" y="164" width="150" height="38" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="514" y="180" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#4338ca">Q2b · 2 vs 2 (+1.00 bit)</text>
  <text x="514" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e1b4b">Made by humans?</text>

  <!-- Layer 3 Nodes Q3 -->
  <rect x="44" y="236" width="128" height="36" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" />
  <text x="108" y="251" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#0369a1">Q3a · 1 vs 1</text>
  <text x="108" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0c4a6e">Can it fly?</text>

  <rect x="208" y="236" width="128" height="36" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" />
  <text x="272" y="251" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#0369a1">Q3b · 1 vs 1</text>
  <text x="272" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0c4a6e">Edible fruit?</text>

  <rect x="368" y="236" width="128" height="36" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" />
  <text x="432" y="251" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#0369a1">Q3c · 1 vs 1</text>
  <text x="432" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0c4a6e">Uses electricity?</text>

  <rect x="532" y="236" width="128" height="36" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" />
  <text x="596" y="251" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#0369a1">Q3d · 1 vs 1</text>
  <text x="596" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0c4a6e">In outer space?</text>

  <!-- 8 Consistent Leaves -->
  <rect x="32" y="314" width="72" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" />
  <text x="68" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Bald</text>
  <text x="68" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Eagle</text>
  <text x="68" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">111</text>

  <rect x="112" y="314" width="72" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" />
  <text x="148" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">African</text>
  <text x="148" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Elephant</text>
  <text x="148" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">110</text>

  <rect x="196" y="314" width="72" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" />
  <text x="232" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Red</text>
  <text x="232" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Apple</text>
  <text x="232" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">101</text>

  <rect x="276" y="314" width="72" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" />
  <text x="312" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Giant</text>
  <text x="312" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Sequoia</text>
  <text x="312" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">100</text>

  <rect x="356" y="314" width="72" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" />
  <text x="392" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#14532d">Smart-</text>
  <text x="392" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#14532d">phone</text>
  <text x="392" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">011</text>

  <rect x="436" y="314" width="72" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" />
  <text x="472" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Paper</text>
  <text x="472" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Book</text>
  <text x="472" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">010</text>

  <rect x="520" y="314" width="72" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" />
  <text x="556" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Planet</text>
  <text x="556" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Saturn</text>
  <text x="556" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">001</text>

  <rect x="600" y="314" width="72" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" />
  <text x="636" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Active</text>
  <text x="636" y="349" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#14532d">Volcano</text>
  <text x="636" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#15803d">000</text>
</svg>
