<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" role="img" aria-labelledby="bsp-title bsp-desc">
  <title id="bsp-title">5-Stage Bayesian Shannon Inference Loop in the 20Q Engine</title>
  <desc id="bsp-desc">Flow diagram showing the five steps of the 20Q engine: 1. Uniform Prior Beliefs, 2. Compute Shannon Entropy and Information Gain for all unasked clues, 3. Ask the Optimal 50/50 Split, 4. Soft Bayesian Likelihood Update that tolerates noisy answers, and 5. Confidence Gate checking whether top belief is at least 78% or entropy is at most 0.40 bits before guessing or looping back.</desc>
  <defs>
    <marker id="tq-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="tq-arrow-loop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e" />
    </marker>
  </defs>

  <rect width="860" height="270" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect x="20" y="16" width="820" height="38" rx="9" fill="#0f172a" />
  <text x="38" y="40" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#bae6fd">20Q ENGINE PIPELINE · SHANNON INFORMATION GAIN + SOFT BAYESIAN UPDATE</text>

  <!-- Stage 1 -->
  <rect x="20" y="72" width="144" height="114" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
  <text x="32" y="94" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#1e40af">1. PRIOR BELIEFS</text>
  <text x="32" y="114" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0f172a">P(e) = 1 / N</text>
  <text x="32" y="136" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Starts equal over</text>
  <text x="32" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#334155">all curated &amp; taught</text>
  <text x="32" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#334155">candidates.</text>

  <line x1="164" y1="129" x2="188" y2="129" stroke="#2563eb" stroke-width="2.4" marker-end="url(#tq-arrow)" />

  <!-- Stage 2 -->
  <rect x="190" y="72" width="146" height="114" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
  <text x="202" y="94" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#1e40af">2. SCORE IG(Q)</text>
  <text x="202" y="114" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#0f172a">IG = H − E[H|Q]</text>
  <text x="202" y="136" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Measures expected</text>
  <text x="202" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#334155">bit drop for every</text>
  <text x="202" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#334155">unasked clue.</text>

  <line x1="336" y1="129" x2="360" y2="129" stroke="#2563eb" stroke-width="2.4" marker-end="url(#tq-arrow)" />

  <!-- Stage 3 -->
  <rect x="362" y="72" width="144" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2" />
  <text x="374" y="94" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#1d4ed8">3. OPTIMAL SPLIT</text>
  <text x="374" y="114" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0f172a">P(Yes) ≈ 50%</text>
  <text x="374" y="136" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">Asks top IG clue;</text>
  <text x="374" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">player picks Yes, No,</text>
  <text x="374" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#1e293b">Prob, or Not Sure.</text>

  <line x1="506" y1="129" x2="530" y2="129" stroke="#2563eb" stroke-width="2.4" marker-end="url(#tq-arrow)" />

  <!-- Stage 4 -->
  <rect x="532" y="72" width="146" height="114" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
  <text x="544" y="94" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#0f766e">4. BAYES UPDATE</text>
  <text x="544" y="114" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#0f172a">P'(e) ∝ P(e)·L(A|e)</text>
  <text x="544" y="136" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Soft weights (0.95 /</text>
  <text x="544" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#334155">0.78) + Laplace ε</text>
  <text x="544" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#334155">prevent fatal zeroes.</text>

  <line x1="678" y1="129" x2="700" y2="129" stroke="#2563eb" stroke-width="2.4" marker-end="url(#tq-arrow)" />

  <!-- Stage 5 -->
  <rect x="702" y="72" width="138" height="114" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
  <text x="714" y="94" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#166534">5. GUESS GATE</text>
  <text x="714" y="114" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#14532d">H ≤ 0.40 or ≥ 78%</text>
  <text x="714" y="136" font-family="system-ui, sans-serif" font-size="11" fill="#14532d">If confident or Q=20,</text>
  <text x="714" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#14532d">reveal best guess;</text>
  <text x="714" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#14532d">else loop back.</text>

  <!-- Feedback Loop Arrow -->
  <path d="M 771 186 L 771 218 L 263 218 L 263 189" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#tq-arrow-loop)" />
  <rect x="394" y="206" width="246" height="22" rx="11" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4" />
  <text x="517" y="221" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">Not confident yet (or guess rejected) → Next Q</text>

  <text x="22" y="252" font-family="system-ui, sans-serif" font-size="11.5" fill="#475569">Note: Answering "Not Sure" applies 0.50 / 0.50 uniformly so prior beliefs remain unchanged (zero bits removed).</text>
</svg>
