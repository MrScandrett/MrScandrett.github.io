<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">What the operating system does</title><desc id="desc">Four connected layers: person, apps and interfaces, operating system, hardware.</desc><metadata>Original ClassroomOS educational illustration. Dedicated to the public domain under CC0 1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><rect width="1200" height="650" rx="20" fill="#f8faf7"/><g font-family="Arial, sans-serif"><text x="45" y="48" font-size="17" fill="#247568" font-weight="700">COMPUTER FIELD GUIDE / OS LAYERS</text><text x="45" y="96" font-size="36" fill="#10283d" font-weight="700">What the operating system does</text><rect x="65" y="145" width="1070" height="78" rx="12" fill="#fff0cf" stroke="#247568" stroke-width="2"/><text x="90" y="177" font-size="23" fill="#183449" font-weight="700">YOU</text><text x="90" y="205" font-size="21" fill="#183449" font-weight="400">Choose a goal: write, draw, organize or explore.</text><path d="M600 223 L600 245" fill="none" stroke="#6a8496" stroke-width="3"/><rect x="65" y="245" width="1070" height="78" rx="12" fill="#e4f3ee" stroke="#247568" stroke-width="2"/><text x="90" y="277" font-size="23" fill="#183449" font-weight="700">APPS + INTERFACES</text><text x="90" y="305" font-size="21" fill="#183449" font-weight="400">Editor · browser · file manager · terminal window</text><path d="M600 323 L600 345" fill="none" stroke="#6a8496" stroke-width="3"/><rect x="65" y="345" width="1070" height="78" rx="12" fill="#dcecf9" stroke="#247568" stroke-width="2"/><text x="90" y="377" font-size="23" fill="#183449" font-weight="700">OPERATING SYSTEM</text><text x="90" y="405" font-size="21" fill="#183449" font-weight="400">Coordinates apps, files, memory, devices and permissions.</text><path d="M600 423 L600 445" fill="none" stroke="#6a8496" stroke-width="3"/><rect x="65" y="445" width="1070" height="78" rx="12" fill="#e8e5f5" stroke="#247568" stroke-width="2"/><text x="90" y="477" font-size="23" fill="#183449" font-weight="700">HARDWARE</text><text x="90" y="505" font-size="21" fill="#183449" font-weight="400">Processor · memory (RAM) · storage · keyboard · display</text><text x="65" y="566" font-size="24" fill="#183449" font-weight="400">The terminal and desktop are different ways to ask the same OS to do work.</text><text x="45" y="620" font-size="16" fill="#496174" font-weight="400">ClassroomOS · Original diagram · CC0 1.0 / Free to reuse</text></g></svg>