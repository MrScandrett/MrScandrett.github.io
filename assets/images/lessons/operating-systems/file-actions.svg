<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Copy, move and shortcuts are different</title><desc id="desc">Copy keeps the original and creates an independent file. Move changes location. A shortcut or alias points to the original and is not a backup.</desc><metadata>Original ClassroomOS educational illustration. Dedicated to the public domain under CC0 1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><rect width="1200" height="650" rx="20" fill="#f8faf7"/><g font-family="Arial, sans-serif"><text x="45" y="48" font-size="17" fill="#247568" font-weight="700">COMPUTER FIELD GUIDE / FILE ACTIONS</text><text x="45" y="96" font-size="36" fill="#10283d" font-weight="700">Copy, move and shortcuts are different</text><rect x="45" y="150" width="340" height="390" rx="12" fill="#ffffff" stroke="#b1c3ce" stroke-width="2"/><text x="65" y="192" font-size="25" fill="#183449" font-weight="700">COPY</text><text x="65" y="225" font-size="21" fill="#183449" font-weight="400">Two independent files</text><rect x="100" y="255" width="230" height="64" rx="12" fill="#dcecf9" stroke="#247568" stroke-width="2"/><text x="122" y="295" font-size="25" fill="#183449" font-weight="700">notes.txt</text><path d="M215 319 L215 386" fill="none" stroke="#6a8496" stroke-width="3"/><rect x="100" y="386" width="230" height="64" rx="12" fill="#e4f3ee" stroke="#247568" stroke-width="2"/><text x="122" y="427" font-size="23" fill="#183449" font-weight="400">notes-copy.txt</text><text x="65" y="495" font-size="20" fill="#183449" font-weight="400">Original stays in place.</text><rect x="430" y="150" width="340" height="390" rx="12" fill="#ffffff" stroke="#b1c3ce" stroke-width="2"/><text x="450" y="192" font-size="25" fill="#183449" font-weight="700">MOVE</text><text x="450" y="225" font-size="21" fill="#183449" font-weight="400">Same file, new location</text><rect x="485" y="255" width="230" height="64" rx="12" fill="#dcecf9" stroke="#247568" stroke-width="2"/><text x="507" y="295" font-size="25" fill="#183449" font-weight="700">notes.txt</text><path d="M600 319 L600 386" fill="none" stroke="#6a8496" stroke-width="3"/><rect x="485" y="386" width="230" height="64" rx="12" fill="#fff0cf" stroke="#247568" stroke-width="2"/><text x="507" y="427" font-size="22" fill="#183449" font-weight="400">drafts/notes.txt</text><text x="450" y="495" font-size="20" fill="#183449" font-weight="400">Old location is empty.</text><rect x="815" y="150" width="340" height="390" rx="12" fill="#ffffff" stroke="#b1c3ce" stroke-width="2"/><text x="835" y="192" font-size="25" fill="#183449" font-weight="700">SHORTCUT / ALIAS</text><text x="835" y="225" font-size="21" fill="#183449" font-weight="400">A pointer to the original</text><rect x="870" y="255" width="230" height="64" rx="12" fill="#dcecf9" stroke="#247568" stroke-width="2"/><text x="892" y="295" font-size="25" fill="#183449" font-weight="700">notes.txt</text><path d="M985 319 L985 386" fill="none" stroke="#6a8496" stroke-width="3"/><rect x="870" y="386" width="230" height="64" rx="12" fill="#e8e5f5" stroke="#247568" stroke-width="2"/><text x="892" y="427" font-size="23" fill="#183449" font-weight="400">Link → notes.txt</text><text x="835" y="495" font-size="20" fill="#183449" font-weight="400">Link is not a backup.</text><text x="45" y="578" font-size="23" fill="#183449" font-weight="400">Before changing files, check the destination. An existing name may be overwritten.</text><text x="45" y="620" font-size="16" fill="#496174" font-weight="400">ClassroomOS · Original diagram · CC0 1.0 / Free to reuse</text></g></svg>