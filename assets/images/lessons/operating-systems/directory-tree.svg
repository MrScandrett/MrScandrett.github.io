<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">A path is an address through a tree</title><desc id="desc">Home contains Documents, which contains STEAM Lab. STEAM Lab contains images and notes.txt; images contains robot.png. The current directory is STEAM Lab.</desc><metadata>Original ClassroomOS educational illustration. Dedicated to the public domain under CC0 1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><rect width="1200" height="650" rx="20" fill="#f8faf7"/><g font-family="Arial, sans-serif"><text x="45" y="48" font-size="17" fill="#247568" font-weight="700">COMPUTER FIELD GUIDE / DIRECTORY TREE</text><text x="45" y="96" font-size="36" fill="#10283d" font-weight="700">A path is an address through a tree</text><rect x="70" y="150" width="230" height="58" rx="12" fill="#fff0cf" stroke="#247568" stroke-width="2"/><text x="86" y="187" font-size="24" fill="#183449" font-weight="700">Home / student</text><rect x="140" y="245" width="230" height="58" rx="12" fill="#fff0cf" stroke="#247568" stroke-width="2"/><text x="156" y="282" font-size="24" fill="#183449" font-weight="700">Documents</text><rect x="220" y="340" width="230" height="58" rx="12" fill="#fff0cf" stroke="#247568" stroke-width="2"/><text x="236" y="377" font-size="24" fill="#183449" font-weight="700">STEAM Lab</text><rect x="560" y="435" width="220" height="58" rx="12" fill="#fff0cf" stroke="#247568" stroke-width="2"/><text x="576" y="472" font-size="24" fill="#183449" font-weight="700">images</text><rect x="870" y="435" width="230" height="58" rx="12" fill="#dcecf9" stroke="#247568" stroke-width="2"/><text x="886" y="472" font-size="24" fill="#183449" font-weight="700">notes.txt</text><rect x="560" y="520" width="220" height="58" rx="12" fill="#dcecf9" stroke="#247568" stroke-width="2"/><text x="576" y="557" font-size="24" fill="#183449" font-weight="700">robot.png</text><path d="M185 208 L185 245" fill="none" stroke="#6a8496" stroke-width="3"/><path d="M255 303 L255 340" fill="none" stroke="#6a8496" stroke-width="3"/><path d="M335 398 L335 464" fill="none" stroke="#6a8496" stroke-width="3"/><path d="M335 464 L560 464" fill="none" stroke="#6a8496" stroke-width="3"/><path d="M780 464 L870 464" fill="none" stroke="#6a8496" stroke-width="3"/><path d="M670 493 L670 520" fill="none" stroke="#6a8496" stroke-width="3"/><rect x="525" y="145" width="610" height="220" rx="12" fill="#10283d" stroke="#10283d" stroke-width="2"/><text x="550" y="183" font-size="21" fill="#9de5d1" font-weight="700">CURRENT DIRECTORY: STEAM Lab</text><text x="550" y="228" font-size="25" fill="#ffffff" font-weight="400">Relative: images/robot.png</text><text x="550" y="276" font-size="21" fill="#9de5d1" font-weight="400">Absolute (Linux example):</text><text x="550" y="315" font-size="24" fill="#ffffff" font-weight="400">/home/student/Documents/</text><text x="550" y="345" font-size="24" fill="#ffffff" font-weight="400">STEAM Lab/images/robot.png</text><text x="70" y="565" font-size="23" fill="#183449" font-weight="700">.. = parent</text><text x="280" y="565" font-size="23" fill="#183449" font-weight="700">. = current directory</text><text x="45" y="620" font-size="16" fill="#496174" font-weight="400">ClassroomOS · Original diagram · CC0 1.0 / Free to reuse</text></g></svg>