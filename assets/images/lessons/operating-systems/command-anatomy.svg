<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Read a command before you run it</title><desc id="desc">Unix shell example separates the prompt from ls, option -a, and quoted directory argument STEAM Lab. PowerShell equivalent uses Get-ChildItem -Force -Path.</desc><metadata>Original ClassroomOS educational illustration. Dedicated to the public domain under CC0 1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><rect width="1200" height="650" rx="20" fill="#f8faf7"/><g font-family="Arial, sans-serif"><text x="45" y="48" font-size="17" fill="#247568" font-weight="700">COMPUTER FIELD GUIDE / COMMAND ANATOMY</text><text x="45" y="96" font-size="36" fill="#10283d" font-weight="700">Read a command before you run it</text><rect x="45" y="145" width="1110" height="150" rx="12" fill="#10283d" stroke="#10283d" stroke-width="2"/><text y="185" font-size="18" fill="#9de5d1" font-weight="700"><tspan x="75">PROMPT</tspan><tspan x="525">COMMAND</tspan><tspan x="650">OPTION</tspan><tspan x="775">ARGUMENT</tspan></text><text y="253" font-size="30" fill="#ffffff" font-family="monospace"><tspan x="75">student:~/Documents$</tspan><tspan x="525">ls</tspan><tspan x="650">-a</tspan><tspan x="775">"STEAM Lab"</tspan></text><rect x="45" y="335" width="340" height="105" rx="12" fill="#ffffff" stroke="#b1c3ce" stroke-width="2"/><text x="63" y="375" font-size="26" fill="#183449" font-weight="700">Prompt</text><text x="63" y="414" font-size="20" fill="#183449" font-weight="400">Shell is ready; do not type it.</text><rect x="430" y="335" width="340" height="105" rx="12" fill="#ffffff" stroke="#b1c3ce" stroke-width="2"/><text x="448" y="375" font-size="26" fill="#183449" font-weight="700">ls -a</text><text x="448" y="414" font-size="20" fill="#183449" font-weight="400">List entries, including hidden.</text><rect x="815" y="335" width="340" height="105" rx="12" fill="#ffffff" stroke="#b1c3ce" stroke-width="2"/><text x="833" y="375" font-size="26" fill="#183449" font-weight="700">&quot;STEAM Lab&quot;</text><text x="833" y="414" font-size="20" fill="#183449" font-weight="400">Quoted path = one argument.</text><text x="45" y="495" font-size="23" fill="#183449" font-weight="700">PowerShell equivalent:</text><rect x="45" y="515" width="1110" height="60" rx="12" fill="#dcecf9" stroke="#247568" stroke-width="2"/><text x="65" y="554" font-size="29" fill="#183449" font-weight="400">Get-ChildItem -Force -Path &quot;STEAM Lab&quot;</text><text x="45" y="620" font-size="16" fill="#496174" font-weight="400">ClassroomOS · Original diagram · CC0 1.0 / Free to reuse</text></g></svg>