<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">AI suggests. You verify.</title><desc id="desc">Five steps: context, explain, preview, practice, inspect. Pause for deletion, force flags, administrator access or downloaded scripts.</desc><metadata>Original ClassroomOS educational illustration. Dedicated to the public domain under CC0 1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><rect width="1200" height="650" rx="20" fill="#f8faf7"/><g font-family="Arial, sans-serif"><text x="45" y="48" font-size="17" fill="#247568" font-weight="700">COMPUTER FIELD GUIDE / AI COMMAND REVIEW</text><text x="45" y="96" font-size="36" fill="#10283d" font-weight="700">AI suggests. You verify.</text><rect x="45" y="160" width="210" height="205" rx="12" fill="#e4f3ee" stroke="#247568" stroke-width="2"/><text x="59" y="200" font-size="22" fill="#183449" font-weight="700">1 / CONTEXT</text><text x="59" y="265" font-size="18" fill="#183449" font-weight="400">Name your OS, shell</text><text x="59" y="300" font-size="18" fill="#183449" font-weight="400">and current directory.</text><rect x="270" y="160" width="210" height="205" rx="12" fill="#dcecf9" stroke="#247568" stroke-width="2"/><text x="284" y="200" font-size="22" fill="#183449" font-weight="700">2 / EXPLAIN</text><text x="284" y="265" font-size="18" fill="#183449" font-weight="400">Identify every option</text><text x="284" y="300" font-size="18" fill="#183449" font-weight="400">and every target path.</text><rect x="495" y="160" width="210" height="205" rx="12" fill="#e4f3ee" stroke="#247568" stroke-width="2"/><text x="509" y="200" font-size="22" fill="#183449" font-weight="700">3 / PREVIEW</text><text x="509" y="265" font-size="18" fill="#183449" font-weight="400">List targets first.</text><text x="509" y="300" font-size="18" fill="#183449" font-weight="400">Check for overwrite risk.</text><rect x="720" y="160" width="210" height="205" rx="12" fill="#dcecf9" stroke="#247568" stroke-width="2"/><text x="734" y="200" font-size="22" fill="#183449" font-weight="700">4 / PRACTICE</text><text x="734" y="265" font-size="18" fill="#183449" font-weight="400">Run one command</text><text x="734" y="300" font-size="18" fill="#183449" font-weight="400">in a new practice folder.</text><rect x="945" y="160" width="210" height="205" rx="12" fill="#e4f3ee" stroke="#247568" stroke-width="2"/><text x="959" y="200" font-size="22" fill="#183449" font-weight="700">5 / INSPECT</text><text x="959" y="265" font-size="18" fill="#183449" font-weight="400">Check the result</text><text x="959" y="300" font-size="18" fill="#183449" font-weight="400">before continuing.</text><rect x="45" y="410" width="1110" height="135" rx="12" fill="#fff0cf" stroke="#ae7526" stroke-width="2"/><text x="70" y="450" font-size="25" fill="#183449" font-weight="700">STOP AND ASK A TEACHER</text><text x="70" y="490" font-size="24" fill="#183449" font-weight="400">Deletion · force flags · administrator access · downloaded scripts</text><text x="70" y="525" font-size="23" fill="#183449" font-weight="400">AI can suggest commands. Understanding the effects is still your job.</text><text x="45" y="620" font-size="16" fill="#496174" font-weight="400">ClassroomOS · Original diagram · CC0 1.0 / Free to reuse</text></g></svg>