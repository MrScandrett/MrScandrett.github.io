<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">A breath changes the length of the reflected Wi-Fi path</title>
  <desc id="d">Router on the left, receiver on the right. A direct path is fixed. A second path runs from the router via the chest to the receiver; its length change depends on both angles at the chest.</desc>
  <rect width="760" height="360" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif" font-size="15" fill="#1e293b">
    <rect x="40" y="150" width="70" height="26" rx="6" fill="#334155"/><rect x="52" y="112" width="5" height="40" fill="#334155"/><rect x="92" y="112" width="5" height="40" fill="#334155"/>
    <text x="40" y="198" font-weight="700">Router (TX)</text>
    <rect x="650" y="150" width="70" height="26" rx="6" fill="#334155"/><rect x="663" y="112" width="5" height="40" fill="#334155"/><rect x="703" y="112" width="5" height="40" fill="#334155"/>
    <text x="640" y="198" font-weight="700">Receiver (RX)</text>
    <line x1="110" y1="150" x2="650" y2="150" stroke="#64748b" stroke-width="3"/>
    <text x="300" y="138" fill="#475569">direct path: never changes</text>
    <!-- body -->
    <ellipse cx="380" cy="300" rx="70" ry="42" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <path d="M345 262 q35 -26 70 0" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round"/>
    <path d="M345 255 q35 -26 70 0" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round" opacity=".7"/>
    <text x="440" y="292" fill="#334155">chest</text>
    <text x="440" y="311" font-size="13" fill="#64748b">inhale ≈ 5 mm out</text>
    <polyline points="110,168 380,258 650,168" fill="none" stroke="#0ea5e9" stroke-width="3"/>
    <polyline points="110,166 380,250 650,166" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 5" opacity=".7"/>
    <text x="150" y="232" fill="#0369a1" font-weight="700">reflected path</text>
    <text x="150" y="252" font-size="13" fill="#0369a1">router → chest → receiver: geometry matters</text>
    <rect x="48" y="300" width="250" height="44" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="60" y="320" font-size="13">Wavelength at 2.4 GHz ≈ 12.3 cm</text>
    <text x="60" y="337" font-size="13">5 mm chest move → 0–10 mm path change</text>
  </g>
</svg>
