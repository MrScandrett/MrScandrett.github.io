<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
  <title id="t">Why some places can feel a breath and others cannot</title>
  <desc id="d">Two phasor diagrams. The short chest-reflection arrow rotates. Left: its tip moves nearly along the static arrow, changing total amplitude. Right: its tip moves mostly sideways, changing amplitude little.</desc>
  <rect width="760" height="340" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#1e293b">
    <text x="30" y="30" font-weight="700" font-size="16">Amplitude sweet spot</text>
    <text x="30" y="50" fill="#475569">rotating tip moves along the total</text>
    <line x1="40" y1="230" x2="300" y2="230" stroke="#334155" stroke-width="4"/>
    <polygon points="300,230 288,224 288,236" fill="#334155"/>
    <text x="90" y="256">static paths (don't move)</text>
    <line x1="300" y1="230" x2="300" y2="150" stroke="#0ea5e9" stroke-width="4"/>
    <path d="M276 150 A 30 30 0 0 1 324 150" fill="none" stroke="#0ea5e9" stroke-dasharray="5 4"/>
    <line x1="40" y1="230" x2="300" y2="150" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="316" y="190" fill="#0369a1">chest</text>
    <text x="40" y="290" fill="#15803d" font-weight="700">total length changes → clear trace</text>
    <text x="400" y="30" font-weight="700" font-size="16">Amplitude blind spot</text>
    <text x="400" y="50" fill="#475569">rotating tip moves across the total</text>
    <line x1="410" y1="230" x2="640" y2="230" stroke="#334155" stroke-width="4"/>
    <polygon points="640,230 628,224 628,236" fill="#334155"/>
    <text x="440" y="256">static paths</text>
    <line x1="640" y1="230" x2="705" y2="230" stroke="#0ea5e9" stroke-width="4"/>
    <path d="M690 196 A 40 40 0 0 1 690 264" fill="none" stroke="#0ea5e9" stroke-dasharray="5 4"/>
    <text x="650" y="190" fill="#0369a1">chest</text>
    <text x="410" y="290" fill="#15803d" font-weight="700">total length barely changes → flat trace</text>
    <text x="30" y="324" font-size="13" fill="#64748b">Amplitude = length of the total arrow. The moving arrow's tip travels tangent to its rotation.</text>
  </g>
</svg>
