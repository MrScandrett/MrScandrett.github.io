<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-labelledby="t d">
  <title id="t">From Wi-Fi packets to breaths per minute</title>
  <desc id="d">Six stages: packets give 52 subcarrier amplitudes; resample onto an even 10 hertz clock; band-pass 0.1 to 0.6 hertz; keep and align the best six subcarriers; take the spectrum; the strongest peak times sixty is breaths per minute.</desc>
  <rect width="800" height="250" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">
    <g stroke="#94a3b8" stroke-width="1.5" fill="#fff">
      <rect x="10" y="60" width="116" height="110" rx="12"/><rect x="142" y="60" width="116" height="110" rx="12"/>
      <rect x="274" y="60" width="116" height="110" rx="12"/><rect x="406" y="60" width="116" height="110" rx="12"/>
      <rect x="538" y="60" width="116" height="110" rx="12"/><rect x="670" y="60" width="116" height="110" rx="12" fill="#e0f2fe" stroke="#0ea5e9"/>
    </g>
    <g stroke="#64748b" stroke-width="2"><line x1="126" y1="115" x2="142" y2="115"/><line x1="258" y1="115" x2="274" y2="115"/><line x1="390" y1="115" x2="406" y2="115"/><line x1="522" y1="115" x2="538" y2="115"/><line x1="654" y1="115" x2="670" y2="115"/></g>
    <g font-weight="700"><text x="68" y="86">1 Packets</text><text x="200" y="86">2 Even clock</text><text x="332" y="86">3 Band-pass</text><text x="464" y="86">4 Best six</text><text x="596" y="86">5 Spectrum</text><text x="728" y="86">6 Peak</text></g>
    <g fill="#475569"><text x="68" y="112">52 numbers</text><text x="68" y="130">per packet</text><text x="200" y="112">packets arrive</text><text x="200" y="130">unevenly → 10 Hz</text><text x="332" y="112">keep 0.1–0.6 Hz</text><text x="332" y="130">drop drift, jitter</text><text x="464" y="112">rank, flip signs,</text><text x="464" y="130">average</text><text x="596" y="112">how much of each</text><text x="596" y="130">rhythm is there?</text><text x="728" y="112">tallest bump</text><text x="728" y="130">× 60 = breaths</text><text x="728" y="148">per minute</text></g>
    <text x="400" y="30" font-size="16" font-weight="700">The same chain runs on the simulator, a recording, and a live ESP32</text>
    <text x="400" y="220" fill="#64748b">Each stage is one idea you can switch off in the lab and watch the answer break.</text>
  </g>
</svg>
