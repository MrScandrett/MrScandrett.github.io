<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="tci-title">
  <title id="tci-title">Titration Equivalence Curve and Indicator Color Windows</title>
  <rect width="880" height="340" rx="16" fill="#f8fafc"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">Acid–Base Titration Curve &amp; Choosing the Right Indicator</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#475569">Match an indicator's color-transition window cleanly inside the vertical equivalence jump for pinpoint accuracy.</text>

  <g transform="translate(88 76)" font-family="system-ui,sans-serif">
    <rect width="746" height="214" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>

    <!-- Indicator bands -->
    <!-- Phenolphthalein pH 8.2 - 10.0 -->
    <rect x="0" y="32" width="746" height="30" fill="#ec4899" fill-opacity="0.16"/>
    <text x="732" y="51" text-anchor="end" font-size="10.5" font-weight="800" fill="#be185d">Phenolphthalein (pH 8.2–10.0 · Clear → Magenta)</text>

    <!-- Bromothymol blue pH 6.0 - 7.6 -->
    <rect x="0" y="88" width="746" height="26" fill="#22c55e" fill-opacity="0.15"/>
    <text x="732" y="105" text-anchor="end" font-size="10.5" font-weight="800" fill="#15803d">Bromothymol Blue (pH 6.0–7.6 · Yellow → Blue)</text>

    <!-- Strong Acid + Strong Base steep S curve -->
    <path d="M24,188 L260,180 C340,176 355,155 362,107 C369,55 385,28 465,24 L710,18" fill="none" stroke="#2563eb" stroke-width="4"/>

    <!-- Weak Acid + Strong Base gentle buffer curve -->
    <path d="M24,148 C130,136 270,126 335,108 C355,96 365,68 388,36 C415,26 485,24 710,18" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Equivalence point dots -->
    <line x1="362" y1="8" x2="362" y2="206" stroke="#64748b" stroke-dasharray="4 3"/>
    <circle cx="362" cy="107" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text x="348" y="122" text-anchor="end" font-size="11" font-weight="800" fill="#1e40af">Strong Eq Pt (pH 7.0)</text>

    <circle cx="372" cy="60" r="6" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
    <text x="384" y="66" font-size="11" font-weight="800" fill="#c2410c">Weak Acid Eq Pt (pH ~8.7)</text>

    <text x="150" y="122" font-size="10.5" font-weight="700" fill="#ea580c">Buffer Region (Weak Acid)</text>
  </g>
  <text x="461" y="315" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#334155">Volume of Base Added (mL NaOH →)</text>
  <text x="-183" y="34" transform="rotate(-90)" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="800" fill="#334155">Solution pH (0 → 14)</text>
</svg>
