<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="rs-title rs-desc">
  <title id="rs-title">Earth Science: Soil Horizons and Weathering of Bedrock</title>
  <desc id="rs-desc">Detailed cross-section diagram showing soil horizons O, A, E, B, C, and R bedrock, paired with an explanation of mechanical and chemical weathering that transforms rock into fertile soil.</desc>
  <defs>
    <linearGradient id="o-layer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1108"/>
      <stop offset="100%" stop-color="#2d1b0e"/>
    </linearGradient>
    <linearGradient id="a-layer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2313"/>
      <stop offset="100%" stop-color="#54351e"/>
    </linearGradient>
    <linearGradient id="e-layer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c775d"/>
      <stop offset="100%" stop-color="#a89275"/>
    </linearGradient>
    <linearGradient id="b-layer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a4d25"/>
      <stop offset="100%" stop-color="#b45d2d"/>
    </linearGradient>
    <linearGradient id="c-layer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
    <linearGradient id="r-layer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#080e1a"/>
  
  <!-- Subtle Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <path d="M0 60h960M0 120h960M0 180h960M0 240h960M0 300h960M0 360h960M0 420h960M0 480h960"/>
    <path d="M60 0v540M120 0v540M180 0v540M240 0v540M300 0v540M360 0v540M420 0v540M480 0v540M540 0v540M600 0v540M660 0v540M720 0v540M780 0v540M840 0v540M900 0v540"/>
  </g>

  <!-- Title & Description -->
  <text x="40" y="44" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">SOIL HORIZONS &amp; THE WEATHERING OF BEDROCK</text>
  <text x="40" y="68" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Over centuries, physical and chemical weathering pulverize solid rock, mixing with biological organic matter to build soil.</text>

  <!-- ==================== LEFT: SOIL PROFILE COLUMN ==================== -->
  <g transform="translate(60, 95)">
    <!-- Main Column Border: width = 360, height = 330 -->
    <rect x="0" y="0" width="360" height="330" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Surface vegetation -->
    <path d="M5,0 Q15,-12 25,0 Q35,-15 45,0 Q60,-12 75,0 Q90,-16 105,0 Q125,-12 145,0 Q165,-15 185,0 Q205,-12 225,0 Q245,-16 265,0 Q285,-12 305,0 Q325,-15 345,0 Q355,-10 360,0" fill="#15803d" stroke="#22c55e" stroke-width="2"/>

    <!-- O Horizon (0 - 35px) -->
    <rect x="1" y="0" width="358" height="35" rx="8" fill="url(#o-layer)"/>
    <!-- Organic debris specks -->
    <ellipse cx="60" cy="18" rx="8" ry="3" fill="#713f12" transform="rotate(-15, 60, 18)"/>
    <ellipse cx="140" cy="22" rx="10" ry="4" fill="#854d0e" transform="rotate(20, 140, 22)"/>
    <ellipse cx="230" cy="15" rx="7" ry="3" fill="#713f12" transform="rotate(-10, 230, 15)"/>
    <ellipse cx="300" cy="20" rx="9" ry="3.5" fill="#854d0e" transform="rotate(25, 300, 20)"/>

    <!-- A Horizon (35 - 95px) -->
    <rect x="1" y="35" width="358" height="60" fill="url(#a-layer)"/>
    <!-- Root hairs branching through A -->
    <path d="M45,0 Q48,35 60,75 M60,75 Q65,85 75,95 M180,0 Q175,40 160,85 M160,85 Q150,92 145,95 M280,0 Q285,45 295,85" stroke="#fef08a" stroke-width="2.5" fill="none" opacity="0.85"/>
    <path d="M52,40 Q62,50 70,55 M172,50 Q160,60 150,65 M288,50 Q305,65 315,75" stroke="#fef08a" stroke-width="1.5" fill="none" opacity="0.75"/>

    <!-- E Horizon (95 - 145px) -->
    <rect x="1" y="95" width="358" height="50" fill="url(#e-layer)"/>
    <!-- Leached sand specks -->
    <circle cx="80" cy="118" r="3" fill="#f5ebe0"/><circle cx="160" cy="125" r="3.5" fill="#f5ebe0"/><circle cx="240" cy="115" r="2.5" fill="#f5ebe0"/><circle cx="310" cy="130" r="3" fill="#f5ebe0"/>

    <!-- B Horizon (145 - 215px) -->
    <rect x="1" y="145" width="358" height="70" fill="url(#b-layer)"/>
    <!-- Clay / mineral deposits -->
    <ellipse cx="100" cy="180" rx="20" ry="10" fill="#7c2d12" opacity="0.6"/>
    <ellipse cx="220" cy="175" rx="24" ry="12" fill="#7c2d12" opacity="0.6"/>
    <ellipse cx="300" cy="190" rx="18" ry="9" fill="#7c2d12" opacity="0.6"/>

    <!-- C Horizon (215 - 275px) -->
    <rect x="1" y="215" width="358" height="60" fill="url(#c-layer)"/>
    <!-- Weathered rock boulders -->
    <polygon points="50,230 75,225 90,245 70,260 40,250" fill="#44403c" stroke="#292524" stroke-width="1.5"/>
    <polygon points="150,225 190,220 205,248 175,265 140,250" fill="#44403c" stroke="#292524" stroke-width="1.5"/>
    <polygon points="260,235 295,228 320,252 285,268 250,255" fill="#44403c" stroke="#292524" stroke-width="1.5"/>

    <!-- R Horizon (275 - 328px) -->
    <rect x="1" y="275" width="358" height="53" rx="8" fill="url(#r-layer)"/>
    <!-- Bedrock fracture joint lines -->
    <path d="M0,295 L120,292 L180,305 L290,298 L360,302" stroke="#44403c" stroke-width="2.5" fill="none"/>
    <path d="M70,275 L75,328 M220,275 L215,328" stroke="#44403c" stroke-width="2" fill="none"/>
  </g>

  <!-- Labels on Soil Profile -->
  <g transform="translate(435, 95)" font-family="Inter, system-ui, sans-serif">
    <!-- O -->
    <text x="0" y="22" font-size="13" font-weight="800" fill="#fbbf24">O HORIZON</text>
    <text x="0" y="36" font-size="11" font-weight="500" fill="#cbd5e1">Humus &amp; organic leaf litter (decomposing surface)</text>

    <!-- A -->
    <text x="0" y="70" font-size="13" font-weight="800" fill="#38bdf8">A HORIZON (TOPSOIL)</text>
    <text x="0" y="84" font-size="11" font-weight="500" fill="#cbd5e1">Mineral-rich loam with high organic biological activity</text>

    <!-- E -->
    <text x="0" y="125" font-size="13" font-weight="800" fill="#e2e8f0">E HORIZON (ELUVIATION)</text>
    <text x="0" y="139" font-size="11" font-weight="500" fill="#cbd5e1">Leached pale layer where water percolates downward</text>

    <!-- B -->
    <text x="0" y="180" font-size="13" font-weight="800" fill="#f97316">B HORIZON (SUBSOIL)</text>
    <text x="0" y="194" font-size="11" font-weight="500" fill="#cbd5e1">Accumulation zone for leached iron, clay, &amp; aluminum</text>

    <!-- C -->
    <text x="0" y="245" font-size="13" font-weight="800" fill="#a8a29e">C HORIZON (REGOLITH)</text>
    <text x="0" y="259" font-size="11" font-weight="500" fill="#cbd5e1">Partially broken, weathered parent rock chunks</text>

    <!-- R -->
    <text x="0" y="305" font-size="13" font-weight="800" fill="#71717a">R HORIZON (BEDROCK)</text>
    <text x="0" y="319" font-size="11" font-weight="500" fill="#cbd5e1">Continuous unweathered parent rock mass</text>
  </g>

  <!-- Bottom Educational Summary Cards -->
  <rect x="40" y="440" width="880" height="76" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <g transform="translate(60, 456)" font-family="Inter, system-ui, sans-serif">
    <!-- Point 1 -->
    <text x="0" y="18" font-size="12" font-weight="700" fill="#38bdf8">MECHANICAL WEATHERING</text>
    <text x="0" y="36" font-size="11.5" font-weight="400" fill="#cbd5e1">Frost wedging (ice expands 9% in rock joints), root wedging, and thermal fracturing.</text>

    <!-- Point 2 -->
    <text x="320" y="18" font-size="12" font-weight="700" fill="#fde047">CHEMICAL WEATHERING</text>
    <text x="320" y="36" font-size="11.5" font-weight="400" fill="#cbd5e1">Carbonic acid in rainwater dissolves minerals; oxidation creates red iron-oxide clays.</text>

    <!-- Point 3 -->
    <text x="640" y="18" font-size="12" font-weight="700" fill="#22c55e">SOIL FORMATION RATE</text>
    <text x="640" y="36" font-size="11.5" font-weight="400" fill="#cbd5e1">Nature takes 100 to 500+ years to generate a single centimeter of fertile topsoil.</text>
  </g>
</svg>

