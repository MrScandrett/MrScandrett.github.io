<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="boxShadow" x="-3%" y="-4%" width="106%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="920" height="480" fill="url(#bgGrad2)" rx="16"/>

  <text x="460" y="38" fill="#f8fafc" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-0.01em">
    Slopes in the Real World: Engineering, Safety &amp; Civil Infrastructure
  </text>
  <text x="460" y="60" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="13" text-anchor="middle">
    From wheelchair accessibility standards to highway runaway truck ramps and structural drainage
  </text>

  <!-- 4 Real World Panels -->
  <!-- 1. ADA Ramp -->
  <g transform="translate(30, 80)" filter="url(#boxShadow)">
    <rect width="415" height="175" rx="12" fill="#111c34" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="20" y="30" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="16" font-weight="800">♿ ADA Wheelchair Ramp (1:12)</text>
    <text x="20" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Federal Americans with Disabilities Act maximum slope</text>
    
    <!-- Ramp Diagram -->
    <path d="M 30 145 L 230 145 L 230 110 Z" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Wheelchair icon on ramp -->
    <circle cx="120" cy="115" r="9" fill="none" stroke="#facc15" stroke-width="2"/>
    <path d="M 120 115 L 126 122 L 132 122" stroke="#facc15" stroke-width="2" fill="none"/>
    <circle cx="126" cy="103" r="4" fill="#facc15"/>
    
    <!-- Dimensions -->
    <line x1="30" y1="158" x2="230" y2="158" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="130" y="170" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">Run = 12 ft (144 in)</text>
    <line x1="242" y1="145" x2="242" y2="110" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="250" y="130" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="start">Rise = 1 ft</text>

    <!-- Stat card -->
    <rect x="255" y="65" width="145" height="75" rx="8" fill="rgba(0,0,0,0.3)" stroke="#38bdf8" stroke-width="1"/>
    <text x="265" y="85" fill="#f8fafc" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700">Ratio: 1 : 12</text>
    <text x="265" y="103" fill="#38bdf8" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700">Grade: 8.33%</text>
    <text x="265" y="121" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700">Angle θ ≈ 4.76°</text>
    <text x="265" y="133" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Over 1:12 risks tip-over</text>
  </g>

  <!-- 2. Highway Grade & Truck Escape Ramp -->
  <g transform="translate(475, 80)" filter="url(#boxShadow)">
    <rect width="415" height="175" rx="12" fill="#111c34" stroke="#ea580c" stroke-width="1.6"/>
    <text x="20" y="30" fill="#fb923c" font-family="'Inter', sans-serif" font-size="16" font-weight="800">🚛 Highway 6% Grade &amp; Runaway Ramp</text>
    <text x="20" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Steep mountain passes require runaway truck escape ramps</text>

    <!-- Mountain road -->
    <path d="M 25 80 L 190 145" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="145" x2="190" y2="145" stroke="#64748b" stroke-dasharray="3 3"/>
    <line x1="25" y1="80" x2="25" y2="145" stroke="#64748b" stroke-dasharray="3 3"/>
    <text x="100" y="160" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">Run = 1000 ft</text>
    <text x="15" y="115" fill="#ea580c" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="end">Drop 60 ft</text>

    <!-- Escape ramp branching upward -->
    <path d="M 120 120 Q 150 125 180 85" stroke="#eab308" stroke-width="3" stroke-dasharray="4 2"/>
    <text x="185" y="80" fill="#facc15" font-family="'Inter', sans-serif" font-size="9" font-weight="700">Gravity Bed Ramp</text>

    <!-- Highway warning sign -->
    <g transform="translate(240, 65)">
      <rect width="60" height="60" rx="8" fill="#f59e0b" transform="rotate(45 30 30)" stroke="#78350f" stroke-width="2"/>
      <text x="30" y="30" fill="#000" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle">6%</text>
      <text x="30" y="43" fill="#000" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">GRADE</text>
    </g>

    <rect x="308" y="65" width="95" height="75" rx="8" fill="rgba(0,0,0,0.3)" stroke="#ea580c" stroke-width="1"/>
    <text x="315" y="85" fill="#f8fafc" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700">Slope: -0.06</text>
    <text x="315" y="103" fill="#fdba74" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700">Angle: ~3.43°</text>
    <text x="315" y="121" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="9">Brake fading risk</text>
    <text x="315" y="133" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">Truck ramps +20%</text>
  </g>

  <!-- 3. Ski Trail Ratings -->
  <g transform="translate(30, 275)" filter="url(#boxShadow)">
    <rect width="415" height="175" rx="12" fill="#111c34" stroke="#22c55e" stroke-width="1.6"/>
    <text x="20" y="30" fill="#4ade80" font-family="'Inter', sans-serif" font-size="16" font-weight="800">⛷️ Ski Trail Steepness Categories</text>
    <text x="20" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Slopes classified by grade percentage and angle of descent</text>

    <!-- Green Circle -->
    <g transform="translate(20, 65)">
      <circle cx="20" cy="20" r="16" fill="#16a34a"/>
      <text x="50" y="18" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Green Circle</text>
      <text x="50" y="33" fill="#86efac" font-family="'IBM Plex Mono', monospace" font-size="11">Grade &lt; 25% (θ &lt; 14°)</text>
    </g>

    <!-- Blue Square -->
    <g transform="translate(20, 115)">
      <rect x="5" y="5" width="30" height="30" rx="4" fill="#0284c7"/>
      <text x="50" y="18" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Blue Square</text>
      <text x="50" y="33" fill="#7dd3fc" font-family="'IBM Plex Mono', monospace" font-size="11">Grade 25%–40% (14°–22°)</text>
    </g>

    <!-- Black Diamond -->
    <g transform="translate(225, 65)">
      <rect x="10" y="5" width="24" height="24" rx="2" fill="#0f172a" stroke="#f8fafc" stroke-width="1.5" transform="rotate(45 22 17)"/>
      <text x="50" y="18" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Black Diamond</text>
      <text x="50" y="33" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="11">Grade &gt; 40% (θ &gt; 22°)</text>
    </g>

    <!-- Avalanche note -->
    <rect x="225" y="115" width="175" height="42" rx="6" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1"/>
    <text x="235" y="132" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="10" font-weight="700">⚠️ Avalanche Prime Zone:</text>
    <text x="235" y="147" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="10">30° to 45° slope (58%–100%)</text>
  </g>

  <!-- 4. Roof Pitch & Drainage -->
  <g transform="translate(475, 275)" filter="url(#boxShadow)">
    <rect width="415" height="175" rx="12" fill="#111c34" stroke="#a855f7" stroke-width="1.6"/>
    <text x="20" y="30" fill="#c084fc" font-family="'Inter', sans-serif" font-size="16" font-weight="800">🏠 Roof Pitch &amp; Drainage Hydraulics</text>
    <text x="20" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Preventing pooling water and roof collapse with minimum slopes</text>

    <!-- Roof graphic -->
    <path d="M 25 125 L 120 70 L 215 125 Z" fill="none" stroke="#c084fc" stroke-width="3"/>
    <line x1="25" y1="125" x2="215" y2="125" stroke="#64748b" stroke-dasharray="3 3"/>
    <!-- Pitch pitch triangle -->
    <path d="M 120 70 L 165 70 L 165 96 Z" fill="rgba(192, 132, 252, 0.2)" stroke="#facc15" stroke-width="1.5"/>
    <text x="142" y="64" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">12 in</text>
    <text x="172" y="85" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="start">4 in</text>

    <!-- Code requirements box -->
    <rect x="230" y="65" width="170" height="95" rx="8" fill="rgba(0,0,0,0.3)" stroke="#a855f7" stroke-width="1"/>
    <text x="240" y="83" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="10" font-weight="700">Commercial Flat Roof:</text>
    <text x="240" y="99" fill="#38bdf8" font-family="'IBM Plex Mono', monospace" font-size="10">¼" rise / 12" run (2.08%)</text>
    <text x="240" y="117" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Minimum slope to drain rain.</text>
    <text x="240" y="133" fill="#facc15" font-family="'Inter', sans-serif" font-size="9">Zero slope = ponding &amp; collapse!</text>
    <text x="240" y="149" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8.5">Residential: 4:12 to 12:12 (45°)</text>
  </g>
</svg>