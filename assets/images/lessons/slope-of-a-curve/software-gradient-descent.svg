<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1124"/>
      <stop offset="100%" stop-color="#162238"/>
    </linearGradient>
    <filter id="softGlow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="480" fill="url(#bgGrad3)" rx="16"/>

  <text x="460" y="38" fill="#f8fafc" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-0.01em">
    Slopes in Software &amp; AI: The Mathematical Engine of Computation
  </text>
  <text x="460" y="60" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="13" text-anchor="middle">
    Gradient descent in machine learning, game physics sliding, PID controllers, and UI animation curves
  </text>

  <!-- 4 Panels -->
  <!-- 1. AI Gradient Descent -->
  <g transform="translate(30, 80)" filter="url(#softGlow)">
    <rect width="415" height="175" rx="12" fill="#101a33" stroke="#8b5cf6" stroke-width="1.6"/>
    <text x="20" y="28" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="15" font-weight="800">🤖 Machine Learning &amp; Gradient Descent</text>
    <text x="20" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">How neural networks train: descending the loss slope</text>

    <!-- Parabola Loss Curve -->
    <path d="M 30 70 Q 110 145 190 70" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
    <!-- Ball at w_t -->
    <circle cx="65" cy="98" r="7" fill="#f43f5e"/>
    <text x="65" y="86" fill="#f43f5e" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">w_t</text>
    <!-- Tangent slope line -->
    <line x1="45" y1="116" x2="90" y2="78" stroke="#facc15" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- Gradient descent arrow stepping downhill toward minimum -->
    <path d="M 68 102 L 95 120" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <polygon points="98,122 88,118 92,126" fill="#22c55e"/>
    <text x="110" y="142" fill="#f8fafc" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">Minimum Loss</text>
    <circle cx="110" cy="144" r="3" fill="#facc15"/>

    <!-- Code / Formula box -->
    <rect x="205" y="55" width="195" height="105" rx="8" fill="rgba(0,0,0,0.35)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="215" y="74" fill="#c4b5fd" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700">w ← w - α · ∇L(w)</text>
    <text x="215" y="92" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">∇L(w) = Slope (Derivative)</text>
    <text x="215" y="108" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">α = Learning rate (step size)</text>
    <text x="215" y="126" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="9.5">Slope &gt; 0 → step left (-)</text>
    <text x="215" y="142" fill="#4ade80" font-family="'IBM Plex Mono', monospace" font-size="9.5">Slope &lt; 0 → step right (+)</text>
  </g>

  <!-- 2. Game Physics & Terrain Normal -->
  <g transform="translate(475, 80)" filter="url(#softGlow)">
    <rect width="415" height="175" rx="12" fill="#101a33" stroke="#0ea5e9" stroke-width="1.6"/>
    <text x="20" y="28" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="15" font-weight="800">🎮 Game Physics: Slope Sliding &amp; Normals</text>
    <text x="20" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Detecting walkable surfaces vs forced steep slide angles</text>

    <!-- Curved terrain -->
    <path d="M 25 140 Q 90 145 130 95 T 195 50" fill="none" stroke="#22c55e" stroke-width="3"/>
    <!-- Character on slope -->
    <circle cx="130" cy="95" r="7" fill="#38bdf8"/>
    <!-- Tangent vector -->
    <line x1="105" y1="120" x2="155" y2="70" stroke="#facc15" stroke-width="2"/>
    <text x="160" y="70" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="9">Tangent T</text>
    <!-- Normal vector (perpendicular) -->
    <line x1="130" y1="95" x2="165" y2="130" stroke="#f43f5e" stroke-width="2"/>
    <text x="168" y="142" fill="#f43f5e" font-family="'IBM Plex Mono', monospace" font-size="9">Normal N</text>

    <!-- Stat box -->
    <rect x="210" y="55" width="190" height="105" rx="8" fill="rgba(0,0,0,0.35)" stroke="#0ea5e9" stroke-width="1"/>
    <text x="220" y="74" fill="#7dd3fc" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700">m = f'(x) = dy/dx</text>
    <text x="220" y="92" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="9.5">Normal N = (-m, 1) / √(1+m²)</text>
    <text x="220" y="112" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10">Walkable if θ ≤ 45° (m ≤ 1.0)</text>
    <text x="220" y="128" fill="#f87171" font-family="'Inter', sans-serif" font-size="10">If m &gt; 1.0: Player slides downhill!</text>
    <text x="220" y="144" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">slideVelocity += gravity · sin(θ)</text>
  </g>

  <!-- 3. PID Controller D-Term -->
  <g transform="translate(30, 275)" filter="url(#softGlow)">
    <rect width="415" height="175" rx="12" fill="#101a33" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="20" y="28" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="15" font-weight="800">🏎️ PID Controllers: D = Error Slope</text>
    <text x="20" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Robotics &amp; autonomous steering: derivative term dampens overshoot</text>

    <!-- Error curve showing overshoot vs dampened -->
    <line x1="25" y1="100" x2="190" y2="100" stroke="#64748b" stroke-dasharray="3 3"/>
    <text x="195" y="103" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">Target 0</text>
    <!-- Wild oscillation without D -->
    <path d="M 25 150 Q 55 40 85 140 T 145 100" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="3 3"/>
    <text x="85" y="45" fill="#f87171" font-family="'Inter', sans-serif" font-size="9">P-only: Overshoot</text>
    <!-- Smooth damped with D -->
    <path d="M 25 150 Q 60 70 110 95 T 180 100" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <text x="120" y="85" fill="#4ade80" font-family="'Inter', sans-serif" font-size="9" font-weight="700">PID: Smooth Braking</text>

    <!-- Formula Box -->
    <rect x="205" y="55" width="195" height="105" rx="8" fill="rgba(0,0,0,0.35)" stroke="#f59e0b" stroke-width="1"/>
    <text x="215" y="74" fill="#fde68a" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700">D = K_d · (de(t) / dt)</text>
    <text x="215" y="92" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">de/dt is the slope of the error!</text>
    <text x="215" y="110" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5">Negative slope means error is</text>
    <text x="215" y="125" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5">shrinking fast → D acts as a brake</text>
    <text x="215" y="142" fill="#4ade80" font-family="'Inter', sans-serif" font-size="9.5">Prevents catastrophic crash!</text>
  </g>

  <!-- 4. UI Animation & Easing Curves -->
  <g transform="translate(475, 275)" filter="url(#softGlow)">
    <rect width="415" height="175" rx="12" fill="#101a33" stroke="#ec4899" stroke-width="1.6"/>
    <text x="20" y="28" fill="#f472b6" font-family="'Inter', sans-serif" font-size="15" font-weight="800">✨ CSS Animation: Bézier Curve Slopes</text>
    <text x="20" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">How slopes at t=0 and t=1 create smooth organic UI motion</text>

    <!-- Cubic bezier curve in unit box -->
    <rect x="35" y="60" width="90" height="90" fill="none" stroke="#475569" stroke-dasharray="2 2"/>
    <path d="M 35 150 C 35 150, 50 140, 75 105 S 110 60, 125 60" fill="none" stroke="#f472b6" stroke-width="3"/>
    <!-- Start slope handle -->
    <line x1="35" y1="150" x2="60" y2="150" stroke="#facc15" stroke-width="2"/>
    <circle cx="60" cy="150" r="3" fill="#facc15"/>
    <text x="50" y="162" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="8">Slope = 0 (Ease-in)</text>
    <!-- End slope handle -->
    <line x1="125" y1="60" x2="100" y2="60" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="100" cy="60" r="3" fill="#38bdf8"/>
    <text x="125" y="52" fill="#38bdf8" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="end">Slope = 0 (Ease-out)</text>

    <!-- Explanation Box -->
    <rect x="195" y="55" width="205" height="105" rx="8" fill="rgba(0,0,0,0.35)" stroke="#ec4899" stroke-width="1"/>
    <text x="205" y="74" fill="#fbcfe8" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700">cubic-bezier(0.25, 0.1, 0.25, 1)</text>
    <text x="205" y="92" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9.5">Slope = Velocity of animation.</text>
    <text x="205" y="108" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5">Flat slope = Slow, gentle start/stop.</text>
    <text x="205" y="124" fill="#facc15" font-family="'Inter', sans-serif" font-size="9.5">Steep slope = High-speed burst.</text>
    <text x="205" y="142" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9.5">Constant slope = Linear robotic motion.</text>
  </g>
</svg>