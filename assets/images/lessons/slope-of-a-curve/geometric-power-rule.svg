<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#172338"/>
    </linearGradient>
    <filter id="boxGlow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="480" fill="url(#bgGrad4)" rx="16"/>

  <text x="460" y="38" fill="#f8fafc" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-0.01em">
    The Geometric Power Rule: Why d/dx [xⁿ] = n · xⁿ⁻¹
  </text>
  <text x="460" y="60" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="13" text-anchor="middle">
    Visualizing derivatives as border expansion of squares, cubes, circles, and spheres
  </text>

  <!-- 4 Panels -->
  <!-- 1. Expanding Square (x^2 -> 2x) -->
  <g transform="translate(30, 80)" filter="url(#boxGlow)">
    <rect width="415" height="175" rx="12" fill="#101d36" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="20" y="28" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="15" font-weight="800">🟧 Square: d/dx [x²] = 2x</text>
    <text x="20" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Expanding by Δx adds 2 perimeter strips</text>

    <!-- Base square -->
    <rect x="35" y="70" width="75" height="75" fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="2"/>
    <text x="72" y="112" fill="#e2e8f0" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">x²</text>
    <!-- Right strip -->
    <rect x="110" y="70" width="16" height="75" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="118" y="112" fill="#713f12" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle" transform="rotate(-90 118 112)">x · Δx</text>
    <!-- Top strip -->
    <rect x="35" y="54" width="75" height="16" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="72" y="65" fill="#713f12" font-family="'IBM Plex Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">x · Δx</text>
    <!-- Corner square (negligible) -->
    <rect x="110" y="54" width="16" height="16" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
    <text x="118" y="65" fill="#fff" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">Δx²</text>

    <!-- Proof box -->
    <rect x="165" y="52" width="235" height="108" rx="8" fill="rgba(0,0,0,0.35)" stroke="#38bdf8" stroke-width="1"/>
    <text x="175" y="72" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700">ΔArea = 2(x · Δx) + (Δx)²</text>
    <text x="175" y="90" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="10">Divide by Δx:</text>
    <text x="175" y="108" fill="#e2e8f0" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700">ΔArea / Δx = 2x + Δx</text>
    <text x="175" y="126" fill="#38bdf8" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700">As Δx → 0:  dA/dx = 2x</text>
    <text x="175" y="145" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">The 2 comes from the 2 growing sides!</text>
  </g>

  <!-- 2. Expanding Cube (x^3 -> 3x^2) -->
  <g transform="translate(475, 80)" filter="url(#boxGlow)">
    <rect width="415" height="175" rx="12" fill="#101d36" stroke="#8b5cf6" stroke-width="1.6"/>
    <text x="20" y="28" fill="#c084fc" font-family="'Inter', sans-serif" font-size="15" font-weight="800">📦 Cube: d/dx [x³] = 3x²</text>
    <text x="20" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Expanding a cube adds 3 exposed square faces</text>

    <!-- Isometric Cube Sketch -->
    <g transform="translate(40, 65)">
      <!-- Main cube front -->
      <rect x="15" y="30" width="55" height="55" fill="rgba(139, 92, 246, 0.3)" stroke="#a78bfa" stroke-width="1.8"/>
      <!-- Top face -->
      <polygon points="15,30 40,10 95,10 70,30" fill="rgba(167, 139, 250, 0.4)" stroke="#a78bfa" stroke-width="1.8"/>
      <!-- Right face -->
      <polygon points="70,30 95,10 95,65 70,85" fill="rgba(124, 58, 237, 0.45)" stroke="#a78bfa" stroke-width="1.8"/>
      <text x="42" y="62" fill="#fff" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700">x³</text>
      <!-- 3 slab arrows -->
      <text x="45" y="22" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700">Slab 1</text>
      <text x="75" y="50" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700">Slab 2</text>
      <text x="20" y="75" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700">Slab 3</text>
    </g>

    <!-- Proof box -->
    <rect x="165" y="52" width="235" height="108" rx="8" fill="rgba(0,0,0,0.35)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="175" y="72" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700">ΔVolume ≈ 3(x² · Δx)</text>
    <text x="175" y="90" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9.5">Each of 3 faces has area x²</text>
    <text x="175" y="108" fill="#e2e8f0" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700">ΔV / Δx → 3x²</text>
    <text x="175" y="126" fill="#c084fc" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700">d/dx [x³] = 3x²</text>
    <text x="175" y="145" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">3 faces of area x² expanding outward!</text>
  </g>

  <!-- 3. Expanding Circle -> Circumference -->
  <g transform="translate(30, 275)" filter="url(#boxGlow)">
    <rect width="415" height="175" rx="12" fill="#101d36" stroke="#22c55e" stroke-width="1.6"/>
    <text x="20" y="28" fill="#4ade80" font-family="'Inter', sans-serif" font-size="15" font-weight="800">⚪ Circle: d/dr [πr²] = 2πr</text>
    <text x="20" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Expanding radius dr peels off the circumference ring!</text>

    <!-- Circle and shell -->
    <g transform="translate(20, 55)">
      <circle cx="65" cy="55" r="42" fill="rgba(34, 197, 94, 0.2)" stroke="#22c55e" stroke-width="2"/>
      <circle cx="65" cy="55" r="50" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="3 2"/>
      <text x="65" y="58" fill="#86efac" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">πr²</text>
      <text x="65" y="118" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">Ring: 2πr · dr</text>
    </g>

    <!-- Proof box -->
    <rect x="165" y="52" width="235" height="108" rx="8" fill="rgba(0,0,0,0.35)" stroke="#22c55e" stroke-width="1"/>
    <text x="175" y="72" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700">Area = πr²</text>
    <text x="175" y="90" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9.5">Expand radius by tiny dr:</text>
    <text x="175" y="108" fill="#e2e8f0" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700">d/dr [πr²] = 2πr</text>
    <text x="175" y="126" fill="#86efac" font-family="'Inter', sans-serif" font-size="10" font-weight="700">= Circumference of Circle!</text>
    <text x="175" y="145" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">The derivative of area is the boundary.</text>
  </g>

  <!-- 4. Expanding Sphere -> Surface Area -->
  <g transform="translate(475, 275)" filter="url(#boxGlow)">
    <rect width="415" height="175" rx="12" fill="#101d36" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="20" y="28" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="15" font-weight="800">⚽ Sphere: d/dr [⁴⁄₃πr³] = 4πr²</text>
    <text x="20" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Expanding volume peels off the entire surface area skin!</text>

    <!-- Sphere graphic -->
    <g transform="translate(20, 55)">
      <circle cx="65" cy="55" r="42" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="2"/>
      <ellipse cx="65" cy="55" rx="42" ry="14" fill="none" stroke="#f59e0b" stroke-dasharray="3 3"/>
      <circle cx="65" cy="55" r="48" fill="none" stroke="#facc15" stroke-width="2.5"/>
      <text x="65" y="58" fill="#fde68a" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">⁴⁄₃πr³</text>
    </g>

    <!-- Proof box -->
    <rect x="165" y="52" width="235" height="108" rx="8" fill="rgba(0,0,0,0.35)" stroke="#f59e0b" stroke-width="1"/>
    <text x="175" y="72" fill="#facc15" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700">Volume V = ⁴⁄₃πr³</text>
    <text x="175" y="90" fill="#cbd5e1" font-family="'IBM Plex Mono', monospace" font-size="10">Power Rule: 3 · (⁴⁄₃π) r²</text>
    <text x="175" y="108" fill="#e2e8f0" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700">dV/dr = 4πr²</text>
    <text x="175" y="126" fill="#fde68a" font-family="'Inter', sans-serif" font-size="10" font-weight="700">= Surface Area of Sphere!</text>
    <text x="175" y="145" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Rate of volume growth is surface area!</text>
  </g>
</svg>