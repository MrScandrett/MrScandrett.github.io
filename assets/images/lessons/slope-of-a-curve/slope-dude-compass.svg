<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="posGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="negGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="zeroGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="undefGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#skyGrad)" rx="16"/>

  <!-- Title Banner -->
  <text x="450" y="42" fill="#f8fafc" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-0.01em">
    Slope Dude's Mental Compass: The 4 Fundamental Slope Types
  </text>
  <text x="450" y="66" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="13" text-anchor="middle">
    Always read left to right: Rise Δy over Run Δx = (y₂ - y₁) / (x₂ - x₁)
  </text>

  <!-- Grid of 4 Quadrants -->
  <!-- 1. Positive Slope -->
  <g transform="translate(30, 85)" filter="url(#shadow)">
    <rect width="395" height="175" rx="12" fill="#131e32" stroke="#22c55e" stroke-width="1.8"/>
    <!-- Hill -->
    <path d="M 25 145 L 180 50" stroke="url(#posGrad)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="180,50 160,52 172,66" fill="#22c55e"/>
    <!-- Triangle dashed -->
    <line x1="25" y1="145" x2="180" y2="145" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.5"/>
    <line x1="180" y1="145" x2="180" y2="50" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.5"/>
    <text x="100" y="162" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">+Run (Δx &gt; 0)</text>
    <text x="190" y="100" fill="#22c55e" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="start">+Rise (Δy &gt; 0)</text>
    <!-- Hiker icon -->
    <circle cx="95" cy="85" r="7" fill="#facc15"/>
    <line x1="95" y1="92" x2="88" y2="108" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    <line x1="88" y1="108" x2="80" y2="118" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    <line x1="88" y1="108" x2="98" y2="114" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    <!-- Labels -->
    <text x="215" y="38" fill="#4ade80" font-family="'Inter', sans-serif" font-size="17" font-weight="800">1. Puff Puff Positive</text>
    <text x="215" y="62" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Slope m &gt; 0 (Uphill climb)</text>
    <text x="215" y="86" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">As you move right, height rises.</text>
    <rect x="215" y="102" width="165" height="52" rx="6" fill="rgba(34, 197, 94, 0.12)" stroke="#22c55e" stroke-width="1"/>
    <text x="297" y="123" fill="#86efac" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">m = +Δy / +Δx &gt; 0</text>
    <text x="297" y="143" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Angle 0° &lt; θ &lt; 90°</text>
  </g>

  <!-- 2. Negative Slope -->
  <g transform="translate(475, 85)" filter="url(#shadow)">
    <rect width="395" height="175" rx="12" fill="#131e32" stroke="#ea580c" stroke-width="1.8"/>
    <!-- Downhill -->
    <path d="M 25 50 L 180 145" stroke="url(#negGrad)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="180,145 172,128 160,143" fill="#ea580c"/>
    <!-- Triangle dashed -->
    <line x1="25" y1="50" x2="180" y2="50" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.5"/>
    <line x1="180" y1="50" x2="180" y2="145" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.5"/>
    <text x="100" y="42" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">+Run (Δx &gt; 0)</text>
    <text x="190" y="100" fill="#fb923c" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="start">-Rise (Δy &lt; 0)</text>
    <!-- Skier icon -->
    <circle cx="108" cy="85" r="7" fill="#38bdf8"/>
    <line x1="108" y1="92" x2="114" y2="108" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="98" y1="120" x2="135" y2="98" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Labels -->
    <text x="215" y="38" fill="#fb923c" font-family="'Inter', sans-serif" font-size="17" font-weight="800">2. Nice Negative</text>
    <text x="215" y="62" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Slope m &lt; 0 (Downhill ski)</text>
    <text x="215" y="86" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">As you move right, height falls.</text>
    <rect x="215" y="102" width="165" height="52" rx="6" fill="rgba(234, 88, 12, 0.12)" stroke="#ea580c" stroke-width="1"/>
    <text x="297" y="123" fill="#fdba74" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">m = -Δy / +Δx &lt; 0</text>
    <text x="297" y="143" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Angle -90° &lt; θ &lt; 0°</text>
  </g>

  <!-- 3. Zero Slope -->
  <g transform="translate(30, 280)" filter="url(#shadow)">
    <rect width="395" height="175" rx="12" fill="#131e32" stroke="#0284c7" stroke-width="1.8"/>
    <!-- Flat line -->
    <path d="M 25 105 L 180 105" stroke="url(#zeroGrad)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="180,105 168,98 168,112" fill="#38bdf8"/>
    <line x1="25" y1="105" x2="180" y2="105" stroke="#38bdf8" stroke-width="1"/>
    <text x="100" y="132" fill="#38bdf8" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">Δx &gt; 0, Δy = 0</text>
    <!-- Skater / walker -->
    <circle cx="102" cy="78" r="7" fill="#a78bfa"/>
    <line x1="102" y1="85" x2="102" y2="98" stroke="#a78bfa" stroke-width="3"/>
    <line x1="95" y1="105" x2="110" y2="105" stroke="#f8fafc" stroke-width="2.5"/>
    <!-- Labels -->
    <text x="215" y="38" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="17" font-weight="800">3. Zero Fun (Flat Plateau)</text>
    <text x="215" y="62" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Slope m = 0 (Horizontal line)</text>
    <text x="215" y="86" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Zero vertical rise over run.</text>
    <rect x="215" y="102" width="165" height="52" rx="6" fill="rgba(2, 132, 199, 0.12)" stroke="#0284c7" stroke-width="1"/>
    <text x="297" y="123" fill="#7dd3fc" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">m = 0 / Δx = 0</text>
    <text x="297" y="143" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Angle θ = 0° (Peak or Valley!)</text>
  </g>

  <!-- 4. Undefined Slope -->
  <g transform="translate(475, 280)" filter="url(#shadow)">
    <rect width="395" height="175" rx="12" fill="#131e32" stroke="#dc2626" stroke-width="1.8"/>
    <!-- Sheer Cliff -->
    <path d="M 100 30 L 100 150" stroke="url(#undefGrad)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="100,150 93,138 107,138" fill="#ef4444"/>
    <text x="115" y="90" fill="#f87171" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="start">Δx = 0 (No Run!)</text>
    <!-- Warning sign -->
    <polygon points="45,95 65,55 85,95" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
    <text x="65" y="88" fill="#000" font-family="'Inter', sans-serif" font-size="15" font-weight="900" text-anchor="middle">!</text>
    <!-- Labels -->
    <text x="215" y="38" fill="#f87171" font-family="'Inter', sans-serif" font-size="17" font-weight="800">4. Undef-INITE Cliff!</text>
    <text x="215" y="62" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Slope is Undefined (Vertical)</text>
    <text x="215" y="86" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Vertical cliff: division by zero.</text>
    <rect x="215" y="102" width="165" height="52" rx="6" fill="rgba(220, 38, 38, 0.12)" stroke="#dc2626" stroke-width="1"/>
    <text x="297" y="123" fill="#fca5a5" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">m = Δy / 0 = UNDEFINED</text>
    <text x="297" y="143" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Angle θ = 90° (Infinite grade)</text>
  </g>
</svg>