<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="crd-title">
  <title id="crd-title">Cosmological Redshift and Hubble's Velocity-Distance Diagram</title>
  <rect width="880" height="340" rx="16" fill="#0f172a"/>
  <text x="28" y="38" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Cosmological Redshift: How Expanding Space Stretches Light</text>
  <text x="28" y="58" font-family="system-ui,sans-serif" font-size="12.5" fill="#94a3b8">Distant galaxies recede faster because space between us and them stretches while photons are in flight (z = Δλ / λ₀).</text>

  <!-- Left: Spectral Shifts -->
  <g transform="translate(26 78)">
    <rect width="420" height="236" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="16" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#e2e8f0">Absorption Lines Shift Toward Red</text>

    <defs>
      <linearGradient id="crd-spec" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#4338ca"/>
        <stop offset="28%" stop-color="#2563eb"/>
        <stop offset="52%" stop-color="#16a34a"/>
        <stop offset="75%" stop-color="#eab308"/>
        <stop offset="100%" stop-color="#dc2626"/>
      </linearGradient>
    </defs>

    <!-- Lab reference -->
    <text x="16" y="54" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Laboratory Rest Frame (z = 0)</text>
    <rect x="16" y="62" width="386" height="28" rx="4" fill="url(#crd-spec)"/>
    <line x1="88" y1="62" x2="88" y2="90" stroke="#090d16" stroke-width="3.5"/>
    <line x1="176" y1="62" x2="176" y2="90" stroke="#090d16" stroke-width="3.5"/>
    <line x1="256" y1="62" x2="256" y2="90" stroke="#090d16" stroke-width="3.5"/>

    <!-- Nearby galaxy -->
    <text x="16" y="118" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fde68a">Nearby Galaxy (z ≈ 0.05)</text>
    <rect x="16" y="126" width="386" height="28" rx="4" fill="url(#crd-spec)"/>
    <line x1="108" y1="126" x2="108" y2="154" stroke="#090d16" stroke-width="3.5"/>
    <line x1="196" y1="126" x2="196" y2="154" stroke="#090d16" stroke-width="3.5"/>
    <line x1="276" y1="126" x2="276" y2="154" stroke="#090d16" stroke-width="3.5"/>

    <!-- Distant galaxy -->
    <text x="16" y="182" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Distant Galaxy Cluster (z ≈ 0.25)</text>
    <rect x="16" y="190" width="386" height="28" rx="4" fill="url(#crd-spec)"/>
    <line x1="168" y1="190" x2="168" y2="218" stroke="#090d16" stroke-width="3.5"/>
    <line x1="256" y1="190" x2="256" y2="218" stroke="#090d16" stroke-width="3.5"/>
    <line x1="336" y1="190" x2="336" y2="218" stroke="#090d16" stroke-width="3.5"/>
  </g>

  <!-- Right: Hubble's Law v = H0 * d -->
  <g transform="translate(466 78)">
    <rect width="388" height="236" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="26" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#7dd3fc">Hubble's Law: v = H₀ · d (~70 km/s/Mpc)</text>
    <g transform="translate(56 46)">
      <line x1="0" y1="146" x2="306" y2="146" stroke="#94a3b8" stroke-width="1.8"/>
      <line x1="0" y1="0" x2="0" y2="146" stroke="#94a3b8" stroke-width="1.8"/>
      <line x1="0" y1="146" x2="294" y2="16" stroke="#f59e0b" stroke-width="2.5"/>
      <circle cx="52" cy="122" r="4.5" fill="#fde047"/>
      <circle cx="108" cy="100" r="4.5" fill="#fde047"/>
      <circle cx="164" cy="70" r="4.5" fill="#fde047"/>
      <circle cx="222" cy="52" r="4.5" fill="#fde047"/>
      <circle cx="272" cy="24" r="4.5" fill="#fde047"/>
      <text x="150" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Distance d (Mpc)</text>
      <text x="-73" y="-34" transform="rotate(-90)" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Recession Speed v</text>
      <text x="148" y="42" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#fde68a">Slope = H₀ (Expansion Rate)</text>
    </g>
  </g>
</svg>
