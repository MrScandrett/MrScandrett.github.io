8"/><text x="180" y="400" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#193f49" text-anchor="middle">VERTICES</text><text x="180" y="428" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle">8 corner points</text><text x="180" y="452" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b" text-anchor="middle">each one is (x, y, z)</text><line x1="490.0" y1="271.0" x2="592.2" y2="330.0" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><line x1="592.2" y1="330.0" x2="490.0" y2="389.0" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><line x1="490.0" y1="389.0" x2="387.8" y2="330.0" stroke="#8a94a3" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/><line x1="387.8" y1="330.0" x2="490.0" y2="271.0" stroke="#8a94a3" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/><line x1="490.0" y1="153.0" x2="592.2" y2="212.0" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><line x1="592.2" y1="212.0" x2="490.0" y2="271.0" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><line x1="490.0" y1="271.0" x2="387.8" y2="212.0" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><line x1="387.8" y1="212.0" x2="490.0" y2="153.0" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><line x1="490.0" y1="271.0" x2="490.0" y2="153.0" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><line x1="592.2" y1="330.0" x2="592.2" y2="212.0" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><line x1="490.0" y1="389.0" x2="490.0" y2="271.0" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><line x1="387.8" y1="330.0" x2="387.8" y2="212.0" stroke="#8a94a3" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/><text x="500" y="400" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#193f49" text-anchor="middle">EDGES</text><text x="500" y="428" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle">12 straight lines</text><text x="500" y="452" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b" text-anchor="middle">where two faces meet</text><polygon points="810.0,153.0 912.2,212.0 810.0,271.0 707.8,212.0" fill="#dfe5ee" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/><polygon points="912.2,330.0 810.0,389.0 810.0,271.0 912.2,212.0" fill="#b3bfcf" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/><polygon points="810.0,271.0 912.2,330.0 912.2,212.0 810.0,153.0" fill="#c9d2df" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/><line x1="810.0" y1="389.0" x2="707.8" y2="330.0" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/><line x1="707.8" y1="330.0" x2="810.0" y2="271.0" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/><line x1="707.8" y1="330.0" x2="707.8" y2="212.0" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/><text x="820" y="400" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#193f49" text-anchor="middle">FACES</text><text x="820" y="428" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#1f2937" text-anchor="middle">6 flat surfaces</text><text x="820" y="452" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b" text-anchor="middle">each one a loop of corners</text><text x="500" y="492" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#c2410c" text-anchor="middle">V − E + F = 8 − 12 + 6 = 2</text><text x="976" y="504" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#7a8a90" text-anchor="end">Original ClassroomOS teaching diagram</text>
</svg>
