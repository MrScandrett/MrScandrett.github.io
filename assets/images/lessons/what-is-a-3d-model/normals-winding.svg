<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Left: a triangle whose corners are numbered 1, 2, 3 counter-clockwise as seen from outside; curling the fingers of the right hand in that order makes the thumb point out, and that is the normal. Right: the same triangle with corners listed 1, 3, 2, which is clockwise, so the normal points into the solid. A face orientation view colours outside faces blue and inside faces red.">
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d63a3a"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9a4a"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker><marker id="ar-out" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f7fe6"/></marker><marker id="ar-in" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e04848"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker></defs>
<rect width="1000" height="520" fill="#f7f5ee"/><path d="M0 0h1000v8H0z" fill="#1e5f69"/>
<text x="42" y="53" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#193f49">Which side is outside?</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#49636b">The order of a face’s corners decides its normal: counter-clockwise seen from outside means the normal points out.</text>
<polygon points="130.0,350.0 370.0,350.0 250.0,170.0" fill="#3f7fe6" stroke="#1f2937" stroke-width="3" stroke-linejoin="round" fill-opacity="0.85"/><text x="100" y="376" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1f2937">1</text><text x="382" y="376" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1f2937">2</text><text x="242" y="156" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1f2937">3</text><path d="M 205 310 A 52 52 0 1 0 295 310" fill="none" stroke="#ffffff" stroke-width="4" marker-end="url(#ar-ink)"/><path d="M 205 310 A 52 52 0 1 0 295 310" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="1 0" /><text x="250" y="405" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Corners 1 → 2 → 3 run counter-clockwise</text><text x="250" y="430" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b" text-anchor="middle">Right-hand rule: curl your fingers 1 → 2 → 3,</text><text x="250" y="452" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b" text-anchor="middle">your thumb points out of the page. That is the normal.</text><circle cx="250" cy="268" r="17" fill="#fff" stroke="#15803d" stroke-width="3"/><circle cx="250" cy="268" r="5" fill="#15803d"/><text x="322" y="262" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#15803d"><tspan x="322">normal: toward you</tspan><tspan x="322" dy="19">(outside)</tspan></text><polygon points="630.0,350.0 870.0,350.0 750.0,170.0" fill="#e04848" stroke="#1f2937" stroke-width="3" stroke-linejoin="round" fill-opacity="0.85"/><text x="600" y="376" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1f2937">1</text><text x="882" y="376" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1f2937">3</text><text x="742" y="156" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1f2937">2</text><path d="M 705 310 A 52 52 0 1 1 795 310" fill="none" stroke="#ffffff" stroke-width="4" marker-end="url(#ar-ink)"/><path d="M 705 310 A 52 52 0 1 1 795 310" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="1 0" /><circle cx="750" cy="268" r="17" fill="#fff" stroke="#c2410c" stroke-width="3"/><path d="M738 256l24 24M762 256l-24 24" stroke="#c2410c" stroke-width="3"/><text x="822" y="262" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#c2410c"><tspan x="822">normal: away</tspan><tspan x="822" dy="19">from you (inside)</tspan></text><text x="750" y="405" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Listed 1 → 3 → 2: clockwise from outside</text><text x="750" y="430" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b" text-anchor="middle">Same three corners, opposite order. The normal points</text><text x="750" y="452" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b" text-anchor="middle">into the solid: a flipped face. Shown red in a face-orientation view.</text><rect x="330" y="470" width="22" height="16" fill="#3f7fe6"/><text x="358" y="484" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#1f2937">outside (front) of a face</text><rect x="560" y="470" width="22" height="16" fill="#e04848"/><text x="588" y="484" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#1f2937">inside (back) of a face</text>
</svg>
