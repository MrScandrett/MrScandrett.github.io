<text x="262.6" y="332.1" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2e9a4a">Y</text>
<text x="114.0" y="189.6" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2f6fd6">Z</text>
<polygon points="120.0,430.0 336.0,430.0 336.0,322.0 120.0,322.0" fill="rgba(201,210,223,0.55)" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="336.0,430.0 415.2,372.4 415.2,264.4 336.0,322.0" fill="rgba(179,191,207,0.55)" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="120.0,322.0 336.0,322.0 415.2,264.4 199.2,264.4" fill="rgba(223,229,238,0.6)" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="120.0" y1="430.0" x2="336.0" y2="430.0" stroke="#d63a3a" stroke-width="5" stroke-linecap="round"/>
