<circle cx="935.2" cy="264.4" r="8" fill="#c2410c"/>
<text x="949.2" y="246.4" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#c2410c" text-anchor="end">(0.030, 0.015, −0.020) m</text>
<text x="600" y="515" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1f2937">glTF / GLB, game engines, three.js: Y up, metres</text>
<text x="600" y="538" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#49636b">same corner: up is now the 2nd number, and "back" is −Z</text>
</svg>
