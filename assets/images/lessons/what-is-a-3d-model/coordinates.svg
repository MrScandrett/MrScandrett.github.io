<text x="936.0" y="438.0" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#d63a3a">X</text>
<text x="630.0" y="189.6" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2e9a4a">Y (up)</text>
