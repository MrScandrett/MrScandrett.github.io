<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Two sets of axes. Left: a CAD app or slicer, Z pointing up, measured in millimetres, with a corner of a box at x 30, y 20, z 15. Right: a game engine, Y pointing up, measured in metres, where the same corner is 0.030, 0.015, minus 0.020.">
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d63a3a"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9a4a"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker><marker id="ar-out" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f7fe6"/></marker><marker id="ar-in" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e04848"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker></defs>
<rect width="1000" height="520" fill="#f7f5ee"/><path d="M0 0h1000v8H0z" fill="#1e5f69"/>
<text x="42" y="53" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#193f49">Every point is three numbers</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#49636b">How far along X, along Y and up. CAD and slicers count millimetres with Z up; games count metres with Y up.</text>
<line x1="250.0" y1="360.0" x2="466.2" y2="484.8" stroke="#d63a3a" stroke-width="3" marker-end="url(#ar-x)" stroke-linecap="round"/><line x1="250.0" y1="360.0" x2="69.9" y2="464.0" stroke="#2e9a4a" stroke-width="3" marker-end="url(#ar-y)" stroke-linecap="round"/><line x1="250.0" y1="360.0" x2="250.0" y2="172.8" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ar-z)" stroke-linecap="round"/><text x="488.16639999999995" y="503.20000000000005" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#d63a3a">X</text><text x="29.859199999999987" y="482.4" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2e9a4a">Y</text><text x="243" y="155.2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2f6fd6">Z</text><polygon points="250.0,282.0 385.1,360.0 295.0,412.0 159.9,334.0" fill="#dfe5ee" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.85"/><polygon points="385.1,438.0 295.0,490.0 295.0,412.0 385.1,360.0" fill="#b3bfcf" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.85"/><polygon points="159.9,412.0 295.0,490.0 295.0,412.0 159.9,334.0" fill="#c9d2df" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.85"/><line x1="385.1" y1="438.0" x2="295.0" y2="490.0" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><circle cx="295.0" cy="412.0" r="7" fill="#c2410c"/><text x="309.032" y="406" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#c2410c">(30, 20, 15) mm</text><text x="80" y="455" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1f2937">CAD, Tinkercad, Blender, slicers: Z up, millimetres</text><text x="80" y="480" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b">x = 30 mm right · y = 20 mm back · z = 15 mm up</text><line x1="700.0" y1="360.0" x2="916.0" y2="360.0" stroke="#d63a3a" stroke-width="3" marker-end="url(#ar-x)" stroke-linecap="round"/><line x1="700.0" y1="360.0" x2="700.0" y2="172.8" stroke="#2e9a4a" stroke-width="3" marker-end="url(#ar-y)" stroke-linecap="round"/><line x1="700.0" y1="360.0" x2="856.0" y2="270.0" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ar-z)" stroke-linecap="round"/><text x="936" y="366" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#d63a3a">X</text><text x="693" y="157.2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2e9a4a">Y</text><text x="877.6" y="265" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#2f6fd6">−Z</text><line x1="700.0" y1="360.0" x2="835.0" y2="360.0" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="835.0" y1="360.0" x2="913.0" y2="315.0" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="913.0" y1="315.0" x2="913.0" y2="237.0" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><circle cx="913.0" cy="237.0" r="7" fill="#c2410c"/><text x="927" y="231" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#c2410c">(0.030, 0.015, −0.020) m</text><text x="560" y="455" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1f2937">glTF, Godot, Unity, three.js: Y up, metres</text><text x="560" y="480" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b">same corner: 0.030 m right · 0.015 m up · 0.020 m toward −Z</text><line x1="505.0" y1="120.0" x2="505.0" y2="430.0" stroke="#c9c3b2" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><text x="976" y="504" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#7a8a90" text-anchor="end">Original ClassroomOS teaching diagram</text>
</svg>
