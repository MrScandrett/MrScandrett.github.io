<text x="429.2" y="256.4" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#c2410c">(30, 20, 15) mm</text>
<text x="228.0" y="454.0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#b42318" text-anchor="middle">x = 30 right</text>
<text x="387.6" y="419.2" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1f7a39">y = 20 back</text>
<text x="427.2" y="323.4" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1e56b0">z = 15 up</text>
<text x="42" y="515" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1f2937">CAD, slicers, 3MF, STL (by custom): Z up, mm</text>
