<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Left: a box in CAD axes with Z up; one corner at 30, 20, 15 millimetres is marked with its distance along X, along Y and up Z. Right: the same corner in glTF game axes with Y up, in metres: 0.030, 0.015, minus 0.020.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
<marker id="a0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d63a3a"/></marker><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e9a4a"/></marker><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="1000" height="560" fill="#f7f5ef"/><rect width="1000" height="8" fill="#1f5f6b"/>
<text x="42" y="53" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#193f49">Every point is three numbers</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#49636b">How far along X, along Y, and up. CAD counts millimetres with Z up; game engines count metres with Y up.</text>
<line x1="120.0" y1="430.0" x2="451.2" y2="430.0" stroke="#d63a3a" stroke-width="3" stroke-linecap="round" marker-end="url(#a0)"/>
<line x1="120.0" y1="430.0" x2="254.6" y2="332.1" stroke="#2e9a4a" stroke-width="3" stroke-linecap="round" marker-end="url(#a1)"/>
<line x1="120.0" y1="430.0" x2="120.0" y2="199.6" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round" marker-end="url(#a2)"/>
