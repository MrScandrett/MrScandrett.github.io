<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Six small boxes. A watertight box is closed with every face blue outside. A box with a hole has a missing face, so the red inside shows. A flipped normal shows one red face on the outside. A non-manifold edge has a third face sticking out of one edge. A self-intersection has two boxes pushed through each other. A zero-thickness wall is a single sheet with no inside at all.">
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d63a3a"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9a4a"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker><marker id="ar-out" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f7fe6"/></marker><marker id="ar-in" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e04848"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker></defs>
<rect width="1000" height="640" fill="#f7f5ee"/><path d="M0 0h1000v8H0z" fill="#1e5f69"/>
<text x="42" y="53" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#193f49">Six ways a mesh can be broken</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#49636b">A printer needs a closed skin with a clear inside. Each of these confuses the slicer about what is solid.</text>
<polygon points="175.0,133.0 242.5,172.0 175.0,211.0 107.5,172.0" fill="#3f7fe6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.95"/><polygon points="242.5,250.0 175.0,289.0 175.0,211.0 242.5,172.0" fill="#3f7fe6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.75"/><polygon points="175.0,211.0 242.5,250.0 242.5,172.0 175.0,133.0" fill="#3f7fe6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.6"/><text x="175" y="355" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">Watertight ✓</text><text x="175" y="378" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b" text-anchor="middle">closed, every normal out</text><polygon points="432.5,250.0 500.0,289.0 500.0,211.0 432.5,172.0" fill="#e04848" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.7"/><polygon points="500.0,211.0 432.5,250.0 432.5,172.0 500.0,133.0" fill="#e04848" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.85"/><polygon points="500.0,211.0 567.5,250.0 500.0,289.0 432.5,250.0" fill="#e04848" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.6"/><polygon points="567.5,250.0 500.0,289.0 500.0,211.0 567.5,172.0" fill="#3f7fe6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.75"/><polygon points="500.0,211.0 567.5,250.0 567.5,172.0 500.0,133.0" fill="#3f7fe6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.6"/><polygon points="500.0,133.0 567.5,172.0 500.0,211.0 432.5,172.0" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="500" y="355" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#c2410c" text-anchor="middle">Hole</text><text x="500" y="378" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4963