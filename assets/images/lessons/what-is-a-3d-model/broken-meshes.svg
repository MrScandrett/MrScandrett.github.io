dge</text><text x="175" y="628" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b" text-anchor="middle">three faces share one edge</text><polygon points="500.0,383.0 567.5,422.0 500.0,461.0 432.5,422.0" fill="#3f7fe6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.95"/><polygon points="567.5,500.0 500.0,539.0 500.0,461.0 567.5,422.0" fill="#3f7fe6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.75"/><polygon points="500.0,461.0 567.5,500.0 567.5,422.0 500.0,383.0" fill="#3f7fe6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.6"/><polygon points="500.0,390.8 554.0,422.0 500.0,453.2 446.0,422.0" fill="#7fb0f5" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.85"/><polygon points="554.0,484.4 500.0,515.6 500.0,453.2 554.0,422.0" fill="#7fb0f5" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.7"/><polygon points="500.0,453.2 554.0,484.4 554.0,422.0 500.0,390.8" fill="#7fb0f5" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" fill-opacity="0.55"/><polygon points="500.0,418.1 554.0,449.3 516.9,470.8" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="500" y="605" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#c2410c" text-anchor="middle">Self-intersection</text><text x="500" y="628" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b" text-anchor="middle">two shells pushed through</text><polygon points="791.2,480.5 858.8,519.5 858.8,441.5 791.2,402.5" fill="#3f7fe6" stroke="#1f2937" stroke-width="3" stroke-linejoin="round" fill-opacity="0.8"/><line x1="858.8" y1="519.5" x2="858.8" y2="441.5" stroke="#c2410c" stroke-width="5" stroke-linecap="round"/><text x="825" y="605" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#c2410c" text-anchor="middle">