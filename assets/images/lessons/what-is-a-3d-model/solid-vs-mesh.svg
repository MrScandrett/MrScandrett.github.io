<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Left: a CAD solid cylinder, stored as an exact circle of radius 10 millimetres and a height. Right: the same cylinder exported as a mesh, made of 12 flat side faces cut into triangles; the flats miss the true circle by up to 0.34 millimetres.">
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d63a3a"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9a4a"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker><marker id="ar-out" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f7fe6"/></marker><marker id="ar-in" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e04848"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ar-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker></defs>
<rect width="1000" height="520" fill="#f7f5ee"/><path d="M0 0h1000v8H0z" fill="#1e5f69"/>
<text x="42" y="53" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#193f49">A CAD solid knows the circle. A mesh only has flats.</text>
<text x="42" y="83" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#49636b">CAD stores exact surfaces (“a circle, radius 10 mm”). Exporting to STL or OBJ cuts them into flat triangles.</text>
<path d="M130 170 L130 380 A120 44 0 0 0 370 380 L370 170" fill="#c9d2df" stroke="#1f2937" stroke-width="2.5"/><ellipse cx="250" cy="170" rx="120" ry="44" fill="#dfe5ee" stroke="#1f2937" stroke-width="2.5"/><line x1="250.0" y1="170.0" x2="370.0" y2="170.0" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"/><circle cx="250.0" cy="170.0" r="4" fill="#c2410c"/><text x="280" y="162" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#c2410c">r = 10 mm</text><polygon points="870.0,170.0 853.9,192.0 853.9,402.0 870.0,380.0" fill="rgb(220,225,232)" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/><line x1="870.0" y1="170.0" x2="853.9" y2="402.0" stroke="#5c6675" stroke-width="1" stroke-linecap="round"/><polygon points="853.9,192.0 810.0,208.1 810.0,418.1 853.9,402.0" fill="rgb(226,231,237)" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/><line x1="853.9" y1="192.0" x2="810.0" y2="418.1" stroke="#5c6675" stroke-width="1" stroke-linecap="round"/><polygon points="810.0,208.1 750.0,214.0 750.0,424.0 810.0,418.1" fill="rgb(223,229,235)" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/><line x1="810.0" y1="208.1" x2="750.0" y2="424.0" stroke="#5c6675" stroke-width="1" stroke-linecap="round"/><polygon points="750.0,214.0 690.0,208.1 690.0,418.1 750.0,424.0" fill="rgb(213,219,226)" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/><line x1="750.0" y1="214.0" x2="690.0" y2="418.1" stroke="#5c6675" stroke-width="1" stroke-linecap="round"/><polygon points="690.0,208.1 646.1,192.0 646.1,402.0 690.0,418.1" fill="rgb(198,205,214)" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/><line x1="690.0" y1="208.1" x2="646.1" y2="402.0" stroke="#5c6675" stroke-width="1" stroke-linecap="round"/><polygon points="646.1,192.0 630.0,170.0 630.0,380.0 646.1,402.0" fill="rgb(181,189,200)" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/><line x1="646.1" y1="192.0" x2="630.0" y2="380.0" stroke="#5c6675" stroke-width="1" stroke-linecap="round"/><polygon points="870.0,170.0 853.9,192.0 810.0,208.1 750.0,214.0 690.0,208.1 646.1,192.0 630.0,170.0 646.1,148.0 690.0,131.9 750.0,126.0 810.0,131.9 853.9,148.0" fill="#dfe5ee" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/><line x1="870.0" y1="170.0" x2="853.9" y2="192.0" stroke="#7d8796" stroke-width="1" stroke-linecap="round"/><line x1="870.0" y1="170.0" x2="810.0" y2="208.1" stroke="#7d8796" stroke-width="1" stroke-linecap="round"/><line x1="870.0" y1="170.0" x2="750.0" y2="214.0" stroke="#7d8796" stroke-width="1" stroke-linecap="round"/><line x1="870.0" y1="170.0" x2="690.0" y2="208.1" stroke="#7d8796" stroke-width="1" stroke-linecap="round"/><line x1="870.0" y1="170.0" x2="646.1" y2="192.0" stroke="#7d8796" stroke-width="1" stroke-linecap="round"/><line x1="870.0" y1="170.0" x2="630.0" y2="170.0" stroke="#7d8796" stroke-width="1" stroke-linecap="round"/><line x1="870.0" y1="170.0" x2="646.1" y2="148.0" stroke="#7d8796" stroke-width="1" stroke-linecap="round"/><line x1="870.0" y1="170.0" x2="690.0" y2="131.9" stroke="#7d8796" stroke-width="1" stroke-linecap="round"/><line x1="870.0" y1="170.0" x2="750.0" y2="126.0" stroke="#7d8796" stroke-width="1" stroke-linecap="round"/><line x1="870.0" y1="170.0" x2="810.0" y2="131.9" stroke="#7d8796" stroke-width="1" stroke-linecap="round"/><text x="250" y="465" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">CAD solid (STEP)</text><text x="250" y="490" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b" text-anchor="middle">exact circle, any size, no triangles</text><text x="750" y="465" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Mesh (STL, OBJ, 3MF, glTF)</text><text x="750" y="490" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#49636b" text-anchor="middle">12 sides → 44 triangles · flats miss the circle by up to 0.34 mm</text><line x1="440.0" y1="280.0" x2="550.0" y2="280.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ar-ink)" stroke-linecap="round"/><text x="495" y="266" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">export</text>
</svg>
