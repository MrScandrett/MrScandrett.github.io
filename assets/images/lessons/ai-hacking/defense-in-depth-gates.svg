<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="ah-did-title ah-did-desc">
  <title id="ah-did-title">Defense-in-Depth Security Gates Against Prompt Injection</title>
  <desc id="ah-did-desc">Diagram mapping four action stages of a prompt-injection attack against five security controls, showing which layers stop the request and clarifying that audit logging observes rather than blocks.</desc>
  <defs>
    <marker id="did-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="880" height="380" rx="18" fill="#f8fafc"/>
  <text x="28" y="34" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Defense in Depth: Independent Gates Along the Action Path</text>
  <text x="28" y="54" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Preventive layers block execution at distinct checkpoints — monitoring layers leave forensic evidence</text>

  <!-- Step 1 -->
  <rect x="28" y="80" width="186" height="196" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="42" y="94" width="66" height="20" rx="10" fill="#0f172a"/>
  <text x="75" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">STAGE 1</text>
  <text x="42" y="134" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Read Public Page</text>
  <text x="42" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">Agent fetches allowed school</text>
  <text x="42" y="170" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">article containing hidden text.</text>
  <rect x="42" y="196" width="158" height="64" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="52" y="216" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#065f46">Allowed Step</text>
  <text x="52" y="234" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#047857">Reading the public project</text>
  <text x="52" y="249" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#047857">page is part of its real job.</text>

  <path d="M 214 176 L 236 176" stroke="#475569" stroke-width="2" marker-end="url(#did-arr)"/>

  <!-- Step 2 -->
  <rect x="240" y="80" width="186" height="196" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="254" y="94" width="66" height="20" rx="10" fill="#0f172a"/>
  <text x="287" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">STAGE 2</text>
  <text x="254" y="134" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Parse Text Rules</text>
  <text x="254" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">Model decides whether page text</text>
  <text x="254" y="170" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">is data or an order to obey.</text>
  <rect x="254" y="196" width="158" height="64" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="264" y="216" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#312e81">GATE 1 · Untrusted Data</text>
  <text x="264" y="234" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#3730a3">Stops here if data tagging /</text>
  <text x="264" y="249" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#3730a3">prompt hygiene rejects override.</text>

  <path d="M 426 176 L 448 176" stroke="#475569" stroke-width="2" marker-end="url(#did-arr)"/>

  <!-- Step 3 -->
  <rect x="452" y="80" width="186" height="196" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="466" y="94" width="66" height="20" rx="10" fill="#0f172a"/>
  <text x="499" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">STAGE 3</text>
  <text x="466" y="134" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Read Private File</text>
  <text x="466" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">Agent requests access to</text>
  <text x="466" y="170" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">private student record file.</text>
  <rect x="466" y="196" width="158" height="64" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="476" y="216" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#312e81">GATE 2 · Least Privilege</text>
  <text x="476" y="234" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#3730a3">Hard OS permission blocks</text>
  <text x="476" y="249" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#3730a3">private reads even if fooled.</text>

  <path d="M 638 176 L 660 176" stroke="#475569" stroke-width="2" marker-end="url(#did-arr)"/>

  <!-- Step 4 -->
  <rect x="664" y="80" width="188" height="196" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="678" y="94" width="66" height="20" rx="10" fill="#0f172a"/>
  <text x="711" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fff">STAGE 4</text>
  <text x="678" y="134" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Outbound Send</text>
  <text x="678" y="154" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">Agent attempts network POST</text>
  <text x="678" y="170" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#475569">to unapproved external host.</text>
  <rect x="678" y="196" width="160" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="688" y="216" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#78350f">GATES 3 &amp; 4 · Egress</text>
  <text x="688" y="234" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#92400e">Network Allowlist OR Human</text>
  <text x="688" y="249" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#92400e">Approval stops unapproved send.</text>

  <!-- Logging bar -->
  <rect x="28" y="294" width="824" height="64" rx="12" fill="#1e293b" stroke="#475569"/>
  <rect x="44" y="310" width="160" height="22" rx="11" fill="#38bdf8"/>
  <text x="124" y="325" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#082f49">DETECTIVE CONTROL</text>
  <text x="220" y="326" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8fafc">Audit Logging: Observes Every Step, Blocks Zero Steps</text>
  <text x="44" y="347" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1">Why logs matter: without an audit trail you never know what an agent tried. Why logs alone fail: forensics runs after the leak.</text>
</svg>
