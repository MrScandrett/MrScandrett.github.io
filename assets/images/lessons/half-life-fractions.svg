<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" role="img" aria-labelledby="title desc">
<title id="title">Expected sample remaining after successive half-lives</title><desc id="desc">A 400 atom sample has expected counts of 400 at zero half-lives, 200 after one, 100 after two, 50 after three, and 25 after four. The bars halve in width each step.</desc>
<rect width="1000" height="395" rx="18" fill="#08101b"/>
<g font-family="Inter,Arial,sans-serif"><text x="36" y="48" fill="#ecf6ff" font-size="27" font-weight="800">A halving pattern, not a countdown clock</text><text x="36" y="76" fill="#b9cde0" font-size="16">Expected undecayed atoms from a starting sample of 400</text>
<g fill="#c6d9ea" font-size="16"><text x="40" y="133">Start</text><text x="40" y="190">1 half-life</text><text x="40" y="247">2 half-lives</text><text x="40" y="304">3 half-lives</text><text x="40" y="361">4 half-lives</text></g>
<g fill="#38bdf8"><rect x="190" y="106" width="680" height="32" rx="7"/><rect x="190" y="163" width="340" height="32" rx="7"/><rect x="190" y="220" width="170" height="32" rx="7"/><rect x="190" y="277" width="85" height="32" rx="7"/><rect x="190" y="334" width="42.5" height="32" rx="7"/></g>
<g fill="#ecf6ff" font-size="20" font-weight="800"><text x="885" y="131">400</text><text x="545" y="188">200</text><text x="375" y="245">100</text><text x="290" y="302">50</text><text x="249" y="359">25</text></g>
</g></svg>
