<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="al-arch-title al-arch-desc">
  <title id="al-arch-title">Babbage and Lovelace Analytical Engine Architecture Mapped to a Modern Computer</title>
  <desc id="al-arch-desc">Schematic diagram showing the four subsystems of the 1843 Analytical Engine: Punched Cards (Program and Input), The Store (Memory / Registers V1 through V24), The Mill (CPU and Barrel Loop Control), and The Printer (Output), connected by ingress and egress data rails.</desc>
  <defs>
    <marker id="al-arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e" />
    </marker>
    <marker id="al-arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309" />
    </marker>
    <marker id="al-arr-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6d28d9" />
    </marker>
  </defs>

  <rect width="960" height="490" rx="16" fill="#fbf9f3" stroke="#cbd5e1" stroke-width="2" />
  <rect x="24" y="20" width="912" height="46" rx="10" fill="#18130e" />
  <text x="42" y="49" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" font-weight="700" fill="#fef3c7">THE ANALYTICAL ENGINE (1843) · BRASS &amp; STEAM HARDWARE ↔ MODERN COMPUTER ARCHITECTURE</text>

  <!-- 1. Punched Cards (Left) -->
  <rect x="24" y="84" width="236" height="292" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2" />
  <rect x="24" y="84" width="236" height="34" rx="12" fill="#fef3c7" />
  <text x="40" y="106" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#78350f">1. PUNCHED CARDS</text>
  <text x="40" y="138" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#0f766e">MODERN: PROGRAM / INPUT</text>

  <!-- Card 1: Operation -->
  <rect x="42" y="152" width="200" height="54" rx="8" fill="#f7ebd2" stroke="#b45309" stroke-width="1.5" />
  <text x="54" y="173" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#451a03">Operation Cards</text>
  <text x="54" y="191" font-family="ui-monospace, monospace" font-size="11" fill="#78350f">Command: ×  ÷  +  −</text>
  <circle cx="212" cy="171" r="4" fill="#18130e" /><circle cx="226" cy="171" r="4" fill="#18130e" />
  <circle cx="212" cy="187" r="4" fill="none" stroke="#92400e" stroke-width="1.5" /><circle cx="226" cy="187" r="4" fill="#18130e" />

  <!-- Card 2: Variable -->
  <rect x="42" y="218" width="200" height="54" rx="8" fill="#f7ebd2" stroke="#b45309" stroke-width="1.5" />
  <text x="54" y="239" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#451a03">Variable Cards</text>
  <text x="54" y="257" font-family="ui-monospace, monospace" font-size="11" fill="#78350f">Select Store V_read → V_write</text>

  <!-- Card 3: Number -->
  <rect x="42" y="284" width="200" height="54" rx="8" fill="#f7ebd2" stroke="#b45309" stroke-width="1.5" />
  <text x="54" y="305" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#451a03">Decimal Number Cards</text>
  <text x="54" y="323" font-family="ui-monospace, monospace" font-size="11" fill="#78350f">Load constants (base-10 wheels)</text>

  <text x="40" y="362" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Cards can rewind for loops.</text>

  <!-- 2. The Mill (Center Top) -->
  <rect x="308" y="84" width="344" height="148" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
  <rect x="308" y="84" width="344" height="34" rx="12" fill="#ccfbf1" />
  <text x="324" y="106" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#134e4a">2. THE MILL (ARITHMETIC + CONTROL)</text>
  <text x="324" y="138" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#0f766e">MODERN: CPU / ALU &amp; CONTROL UNIT</text>

  <!-- Gears inside The Mill -->
  <circle cx="378" cy="184" r="30" fill="#fef3c7" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 3" />
  <circle cx="378" cy="184" r="10" fill="#b45309" />
  <text x="378" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#78350f">Gear Train</text>

  <circle cx="446" cy="184" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5 3" />
  <circle cx="446" cy="184" r="8" fill="#0284c7" />
  <text x="446" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0c4a6e">Barrels</text>

  <rect x="492" y="152" width="144" height="62" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5" />
  <text x="504" y="172" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#134e4a">Micro-Control</text>
  <text x="504" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Adds, subtracts, mult, div</text>
  <text x="504" y="206" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Branches if V10 = 0</text>

  <!-- 3. The Store (Center Bottom) -->
  <rect x="308" y="256" width="344" height="120" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2" />
  <rect x="308" y="256" width="344" height="32" rx="12" fill="#fef3c7" />
  <text x="324" y="277" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#78350f">3. THE STORE (DECIMAL COLUMNS)</text>
  <text x="324" y="306" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#b45309">MODERN: MEMORY (RAM / REGISTERS)</text>

  <!-- Gear columns in The Store -->
  <g font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">
    <rect x="326" y="318" width="44" height="44" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5" />
    <text x="348" y="336" fill="#0f766e">V1..V3</text><text x="348" y="352" fill="#334155">Data</text>

    <rect x="378" y="318" width="54" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <text x="405" y="336" fill="#92400e">V4..V13</text><text x="405" y="352" fill="#334155">Work</text>

    <rect x="440" y="318" width="60" height="44" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" />
    <text x="470" y="336" fill="#5b21b6">V21..V24</text><text x="470" y="352" fill="#334155">Results</text>

    <text x="576" y="336" fill="#475569">Up to 1,000 columns</text>
    <text x="576" y="352" fill="#475569">50 decimal digits each</text>
  </g>

  <!-- 4. Output (Right) -->
  <rect x="700" y="84" width="236" height="292" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2" />
  <rect x="700" y="84" width="236" height="34" rx="12" fill="#ede9fe" />
  <text x="716" y="106" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#4c1d95">4. OUTPUT DEVICES</text>
  <text x="716" y="138" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#6d28d9">MODERN: PRINTER / SCREEN</text>

  <rect x="718" y="156" width="200" height="84" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="730" y="178" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#4c1d95">Typesetting Printer</text>
  <text x="730" y="198" font-family="ui-monospace, monospace" font-size="11.5" fill="#1e293b">B₁ =  1/6    (0.16667)</text>
  <text x="730" y="216" font-family="ui-monospace, monospace" font-size="11.5" fill="#1e293b">B₃ = −1/30  (−0.03333)</text>
  <text x="730" y="232" font-family="system-ui, sans-serif" font-size="10.5" fill="#6d28d9">Eliminates human copying errors</text>

  <rect x="718" y="256" width="200" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="730" y="278" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">Symbolic Future (Ada)</text>
  <text x="730" y="297" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Numbers can represent notes,</text>
  <text x="730" y="313" font-family="system-ui, sans-serif" font-size="11" fill="#334155">letters, or weaving patterns.</text>

  <!-- Data & Control Rails -->
  <line x1="260" y1="178" x2="300" y2="178" stroke="#0f766e" stroke-width="3" marker-end="url(#al-arr-teal)" />
  <text x="284" y="169" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#0f766e">Op</text>

  <line x1="260" y1="305" x2="300" y2="305" stroke="#b45309" stroke-width="3" marker-end="url(#al-arr-amber)" />
  <text x="284" y="296" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#b45309">Var</text>

  <!-- Ingress / Egress Racks between Store and Mill -->
  <line x1="418" y1="256" x2="418" y2="236" stroke="#0f766e" stroke-width="3" marker-end="url(#al-arr-teal)" />
  <text x="380" y="249" text-anchor="end" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#0f766e">Read (Ingress)</text>

  <line x1="544" y1="232" x2="544" y2="252" stroke="#b45309" stroke-width="3" marker-end="url(#al-arr-amber)" />
  <text x="556" y="249" text-anchor="start" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#b45309">Write (Egress)</text>

  <!-- Store to Printer -->
  <line x1="652" y1="194" x2="692" y2="194" stroke="#6d28d9" stroke-width="3" marker-end="url(#al-arr-violet)" />
  <text x="676" y="184" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#6d28d9">Out</text>

  <!-- Bottom Principle Strip -->
  <rect x="24" y="392" width="912" height="78" rx="12" fill="#18130e" />
  <text x="44" y="420" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#5eead4">ADA'S KEY INSIGHT · SOFTWARE IS SEPARATE FROM HARDWARE</text>
  <text x="44" y="442" font-family="system-ui, sans-serif" font-size="12.5" fill="#f7f1e3">The Difference Engine (1822) was a fixed calculator. By swapping punched-card decks, the Analytical Engine could compute</text>
  <text x="44" y="460" font-family="system-ui, sans-serif" font-size="12.5" fill="#d6cbba">Bernoulli numbers, solve equations, or weave symbolic patterns on the very same brass hardware.</text>
</svg>
