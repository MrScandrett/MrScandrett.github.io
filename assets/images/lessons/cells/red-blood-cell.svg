e human red blood cell · biconcave disc</text><ellipse cx="282" cy="237" rx="124" ry="114" filter="url(#relief)" fill="url(#red)" stroke="#993749" stroke-width="2"/><ellipse cx="282" cy="231" rx="43" ry="36" fill="#f3bbb0" stroke="none" stroke-width="1"/><path d="M462,240 C460,215 487,210 505,222 Q533,243 565,222 C588,207 612,216 613,240 C614,264 588,271 565,258 Q533,240 505,258 C483,272 460,264 462,240 Z" filter="url(#relief)" fill="url(#red)" stroke="#993749" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M56,93 H277 V223" fill="none" stroke="#657b82" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="56" y="87">Thin center; no hole</text><path d="M78,409 H187 V288" fill="none" stroke="#657b82" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="78" y="403">Thicker rim</text><path d="M484,368 H540 V253" fill="none" stroke="#657b82" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text class="label" x="484" y="362">Side section</text><text x="26" y="479" style="font-size:13px;fill:#526974">About 7–8 µm across • no nucleus or mitochondria • hemoglobin carries oxygen</text></svg>