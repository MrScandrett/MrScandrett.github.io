<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Four ways to turn a flat profile into a solid</title>
  <desc id="d">Extrude pushes a T-shaped profile straight back into a beam. Revolve spins half a vase silhouette around a dashed axis into a whole vase. Loft blends a square at the bottom into a circle at the top. Sweep slides a small oval profile along a curved path to make a mug handle.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdc"/></marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>
  <g stroke="#d5d9df" stroke-width="2"><line x1="500" y1="20" x2="500" y2="680"/><line x1="20" y1="350" x2="980" y2="350"/></g>

  <!-- 1 Extrude -->
  <g>
    <text x="30" y="46" font-size="24" font-weight="700" fill="#1d2228">1 · EXTRUDE</text>
    <text x="30" y="72" font-size="17" fill="#3d4650">push the profile straight out</text>
    <polygon points="60,120 200,120 200,150 145,150 145,270 115,270 115,150 60,150" fill="#fbe1cc" stroke="#e8792a" stroke-width="4" stroke-linejoin="round"/>
    <text x="70" y="300" font-size="15" fill="#b4561a" font-weight="600">the profile</text>
    <line x1="215" y1="195" x2="285" y2="195" stroke="#2f6fdc" stroke-width="4" marker-end="url(#ah)"/>
    <g transform="translate(250 0)">
      <polygon points="130,75 270,75 270,105 215,105 215,225 185,225 185,105 130,105" fill="#e9b48b" stroke="#8a4b1c" stroke-width="2"/>
      <g stroke="#8a4b1c" stroke-width="2"><line x1="60" y1="120" x2="130" y2="75"/><line x1="200" y1="120" x2="270" y2="75"/><line x1="200" y1="150" x2="270" y2="105"/><line x1="145" y1="270" x2="215" y2="225"/></g>
      <polygon points="60,120 200,120 200,150 145,150 145,270 115,270 115,150 60,150" fill="#f6cba8" stroke="#8a4b1c" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="30" y="332" font-size="16" fill="#1d2228">Same cross-section all the way: beams, nameplates, cookie cutters.</text>
  </g>

  <!-- 2 Revolve -->
  <g transform="translate(500 0)">
    <text x="30" y="46" font-size="24" font-weight="700" fill="#1d2228">2 · REVOLVE</text>
    <text x="30" y="72" font-size="17" fill="#3d4650">spin half a silhouette around an axis</text>
    <line x1="110" y1="85" x2="110" y2="300" stroke="#e0a64b" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="40" y="312" font-size="15" fill="#9a6a12" font-weight="600">axis</text>
    <path d="M110,280 L150,280 C175,250 185,200 160,160 C145,135 140,120 150,105 L110,105 Z" fill="#fbe1cc" stroke="#e8792a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M84,96 A28,9 0 1 0 136,96" fill="none" stroke="#2f6fdc" stroke-width="3.5" marker-end="url(#ah)"/>
    <line x1="200" y1="195" x2="260" y2="195" stroke="#2f6fdc" stroke-width="4" marker-end="url(#ah)"/>
    <path d="M300,280 L380,280 C405,250 415,200 390,160 C375,135 370,120 380,105 L300,105 C310,120 305,135 290,160 C265,200 275,250 300,280 Z" fill="#f6cba8" stroke="#8a4b1c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M300,280 A40,9 0 0 0 380,280" fill="none" stroke="#8a4b1c" stroke-width="2"/>
    <ellipse cx="340" cy="105" rx="40" ry="9" fill="#e9b48b" stroke="#8a4b1c" stroke-width="2.5"/>
    <path d="M330,120 C320,150 300,190 305,240" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <text x="30" y="332" font-size="16" fill="#1d2228">Round from above: vases, bottles, chess pieces, wheels.</text>
  </g>

  <!-- 3 Loft -->
  <g transform="translate(0 350)">
    <text x="30" y="46" font-size="24" font-weight="700" fill="#1d2228">3 · LOFT</text>
    <text x="30" y="72" font-size="17" fill="#3d4650">stretch a skin from one profile to another</text>
    <rect x="50" y="215" width="54" height="54" fill="#fbe1cc" stroke="#e8792a" stroke-width="4"/>
    <circle cx="77" cy="130" r="27" fill="#fbe1cc" stroke="#e8792a" stroke-width="4"/>
    <line x1="77" y1="207" x2="77" y2="166" stroke="#2f6fdc" stroke-width="3.5" marker-end="url(#ah)"/>
    <text x="118" y="250" font-size="15" fill="#b4561a" font-weight="600">profile 1</text>
    <text x="118" y="136" font-size="15" fill="#b4561a" font-weight="600">profile 2</text>
    <line x1="200" y1="195" x2="250" y2="195" stroke="#2f6fdc" stroke-width="4" marker-end="url(#ah)"/>
    <path d="M290,280 L320,110 A50,16 0 0 0 420,110 L450,280 L370,305 Z" fill="#f6cba8" stroke="#8a4b1c" stroke-width="3" stroke-linejoin="round"/>
    <line x1="370" y1="305" x2="370" y2="126" stroke="#8a4b1c" stroke-width="2"/>
    <ellipse cx="370" cy="110" rx="50" ry="16" fill="#e9b48b" stroke="#8a4b1c" stroke-width="2.5"/>
    <polyline points="290,280 370,255 450,280" fill="none" stroke="#8a4b1c" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="30" y="332" font-size="16" fill="#1d2228">The shape changes as it rises: square-to-round vents, bottle necks, hulls.</text>
  </g>

  <!-- 4 Sweep -->
  <g transform="translate(500 350)">
    <text x="30" y="46" font-size="24" font-weight="700" fill="#1d2228">4 · SWEEP</text>
    <text x="30" y="72" font-size="17" fill="#3d4650">slide a profile along a path</text>
    <path d="M50,130 C140,118 160,262 50,262" fill="none" stroke="#2f6fdc" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/>
    <ellipse cx="50" cy="130" rx="7" ry="16" fill="#fbe1cc" stroke="#e8792a" stroke-width="4"/>
    <text x="22" y="105" font-size="15" fill="#b4561a" font-weight="600">profile</text>
    <text x="118" y="300" font-size="15" fill="#2f6fdc" font-weight="600">path</text>
    <line x1="180" y1="195" x2="228" y2="195" stroke="#2f6fdc" stroke-width="4" marker-end="url(#ah)"/>
    <path d="M370,140 C470,128 490,272 370,272" fill="none" stroke="#8a4b1c" stroke-width="30"/>
    <path d="M370,140 C470,128 490,272 370,272" fill="none" stroke="#f6cba8" stroke-width="24"/>
    <path d="M378,134 C462,128 478,250 392,262" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
    <rect x="250" y="100" width="130" height="200" rx="10" fill="#e9b48b" stroke="#8a4b1c" stroke-width="3"/>
    <ellipse cx="315" cy="100" rx="65" ry="12" fill="#d79a6c" stroke="#8a4b1c" stroke-width="2.5"/>
    <text x="30" y="332" font-size="16" fill="#1d2228">Same cross-section, bent path: handles, pipes, railings, hooks.</text>
  </g>
</svg>
