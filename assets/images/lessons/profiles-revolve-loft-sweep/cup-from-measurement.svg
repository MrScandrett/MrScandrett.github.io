<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Sizing a revolved cup from a measurement</title>
  <desc id="d">Left: a cut-through view of a cup around a bundle of pens measured at 38 mm. One millimetre of clearance on each side makes the inside 40 mm across; 2 mm walls make the outside 44 mm; the base is 2 mm thick and the cup is 90 mm tall. Right: the profile you actually draw, only the right half of the wall, an L shape beside the spin axis, with an outer radius of 22 mm and an inner radius of 20 mm.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f6cba8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8a4b1c" stroke-width="2"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1d2228"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdc"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1d2228">1 · Measure the thing, then add room</text>
  <text x="560" y="40" font-size="22" font-weight="700" fill="#1d2228">2 · Draw only half, then spin it</text>
  <line x1="530" y1="20" x2="530" y2="580" stroke="#d5d9df" stroke-width="2"/>

  <!-- pens -->
  <rect x="174" y="70" width="152" height="402" fill="#eef3fb" stroke="#6b7c93" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="250" y="96" font-size="15" fill="#4a5a70" text-anchor="middle">pens (measured)</text>
  <!-- cup section -->
  <path d="M162,120 L170,120 L170,472 L330,472 L330,120 L338,120 L338,480 L162,480 Z" fill="url(#hatch)" stroke="#8a4b1c" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="250" y1="110" x2="250" y2="500" stroke="#e0a64b" stroke-width="2" stroke-dasharray="9 6"/>

  <!-- measured -->
  <line x1="174" y1="200" x2="326" y2="200" stroke="#1d2228" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="196" y="176" width="108" height="20" fill="#ffffff"/>
  <text x="250" y="191" font-size="15" text-anchor="middle" fill="#1d2228" font-weight="700">measured 38</text>
  <!-- inner -->
  <line x1="170" y1="300" x2="330" y2="300" stroke="#1d2228" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="182" y="276" width="136" height="20" fill="#ffffff"/>
  <text x="250" y="291" font-size="15" text-anchor="middle" fill="#1d2228" font-weight="700">inner Ø 40</text>
  <text x="250" y="325" font-size="14" text-anchor="middle" fill="#3d4650" stroke="#eef3fb" stroke-width="5" paint-order="stroke">38 + 1 + 1 clearance</text>
  <!-- outer -->
  <line x1="162" y1="490" x2="162" y2="525" stroke="#6b7c93" stroke-width="1.5"/>
  <line x1="338" y1="490" x2="338" y2="525" stroke="#6b7c93" stroke-width="1.5"/>
  <line x1="162" y1="518" x2="338" y2="518" stroke="#1d2228" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="250" y="545" font-size="15" text-anchor="middle" fill="#1d2228" font-weight="700">outer Ø 44 = 40 + 2 + 2 wall</text>
  <!-- height -->
  <line x1="345" y1="120" x2="400" y2="120" stroke="#6b7c93" stroke-width="1.5"/>
  <line x1="345" y1="480" x2="400" y2="480" stroke="#6b7c93" stroke-width="1.5"/>
  <line x1="390" y1="120" x2="390" y2="480" stroke="#1d2228" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="402" y="305" font-size="15" fill="#1d2228" font-weight="700">height 90</text>
  <!-- wall + base callouts -->
  <line x1="338" y1="150" x2="420" y2="150" stroke="#1d2228" stroke-width="1.5"/>
  <text x="424" y="155" font-size="15" fill="#1d2228">wall 2</text>
  <line x1="300" y1="476" x2="420" y2="440" stroke="#1d2228" stroke-width="1.5"/>
  <text x="424" y="444" font-size="15" fill="#1d2228">base 2</text>
  <text x="30" y="580" font-size="14" fill="#3d4650">All sizes in millimetres. Ø means diameter.</text>

  <!-- profile -->
  <line x1="620" y1="95" x2="620" y2="510" stroke="#e0a64b" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="585" y="530" font-size="15" fill="#9a6a12" font-weight="700">spin axis</text>
  <path d="M594,100 A26,8 0 1 0 646,100" fill="none" stroke="#2f6fdc" stroke-width="3.5" marker-end="url(#b)"/>
  <path d="M620,480 L708,480 L708,120 L700,120 L700,472 L620,472 Z" fill="#fbe1cc" stroke="#e8792a" stroke-width="4" stroke-linejoin="round"/>
  <line x1="620" y1="410" x2="700" y2="410" stroke="#1d2228" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="660" y="400" font-size="15" text-anchor="middle" fill="#1d2228" font-weight="700">r 20</text>
  <line x1="620" y1="200" x2="708" y2="200" stroke="#1d2228" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="664" y="190" font-size="15" text-anchor="middle" fill="#1d2228" font-weight="700">r 22</text>
  <text x="740" y="250" font-size="16" fill="#1d2228">Every point on this</text>
  <text x="740" y="272" font-size="16" fill="#1d2228">L-shape travels round</text>
  <text x="740" y="294" font-size="16" fill="#1d2228">the axis in a circle.</text>
  <text x="740" y="336" font-size="16" fill="#1d2228">Radius = half the</text>
  <text x="740" y="358" font-size="16" fill="#1d2228">diameter, so you draw</text>
  <text x="740" y="380" font-size="16" fill="#1d2228">20 and 22, not 40 and 44.</text>
  <text x="740" y="440" font-size="16" fill="#b4561a" font-weight="700">Never cross the axis:</text>
  <text x="740" y="462" font-size="16" fill="#b4561a">a profile that pokes past it</text>
  <text x="740" y="484" font-size="16" fill="#b4561a">would spin through itself.</text>
</svg>
