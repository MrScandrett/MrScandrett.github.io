<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">The movement of the book of Jeremiah</title>
  <desc id="desc">Five connected movements: calling, covenant accusation, leaders and false reassurance, restoration, and fall with aftermath.</desc>
  <rect width="1200" height="390" fill="#f5f8fa"/>
  <text x="55" y="55" fill="#123e63" font-family="Georgia,serif" font-size="32">One book, five movements</text>
  <text x="55" y="84" fill="#47617a" font-family="Arial,sans-serif" font-size="17">The order is not a single continuous timeline; these are reading handles.</text>
  <g font-family="Arial,sans-serif">
    <path d="M135 205H1060" stroke="#087c91" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(55 130)"><rect width="190" height="150" rx="10" fill="#123e63"/><text x="20" y="37" fill="#edc66d" font-size="18" font-weight="700">1 · Called</text><text x="20" y="72" fill="#fff" font-size="16">Jeremiah is sent</text><text x="20" y="98" fill="#dbe8f3" font-size="15">1:4–10</text><text x="20" y="126" fill="#dbe8f3" font-size="14">fear meets vocation</text></g>
    <g transform="translate(275 130)"><rect width="190" height="150" rx="10" fill="#215c8f"/><text x="20" y="37" fill="#fff0b8" font-size="18" font-weight="700">2 · Accused</text><text x="20" y="72" fill="#fff" font-size="16">covenant and justice</text><text x="20" y="98" fill="#dbe8f3" font-size="15">2–20</text><text x="20" y="126" fill="#dbe8f3" font-size="14">worship cannot hide harm</text></g>
    <g transform="translate(495 130)"><rect width="190" height="150" rx="10" fill="#6b477e"/><text x="20" y="37" fill="#ffe7a8" font-size="18" font-weight="700">3 · Tested</text><text x="20" y="72" fill="#fff" font-size="16">leaders and promises</text><text x="20" y="98" fill="#eadff0" font-size="15">21–29</text><text x="20" y="126" fill="#eadff0" font-size="14">wait against easy answers</text></g>
    <g transform="translate(715 130)"><rect width="190" height="150" rx="10" fill="#267664"/><text x="20" y="37" fill="#fff0b8" font-size="18" font-weight="700">4 · Planted</text><text x="20" y="72" fill="#fff" font-size="16">return and new covenant</text><text x="20" y="98" fill="#d9eee8" font-size="15">30–33</text><text x="20" y="126" fill="#d9eee8" font-size="14">hope takes public shape</text></g>
    <g transform="translate(935 130)"><rect width="210" height="150" rx="10" fill="#8a3c4e"/><text x="20" y="37" fill="#ffe7a8" font-size="18" font-weight="700">5 · Aftermath</text><text x="20" y="72" fill="#fff" font-size="16">fall, grief, nations</text><text x="20" y="98" fill="#f2dce1" font-size="15">34–52</text><text x="20" y="126" fill="#f2dce1" font-size="14">warning is not erased</text></g>
  </g>
  <text x="55" y="345" fill="#123e63" font-family="Arial,sans-serif" font-size="16" font-weight="700">Read each movement with a passage, then name whether your claim is observation, explanation, or later interpretation.</text>
</svg>
