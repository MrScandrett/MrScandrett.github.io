<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Jeremiah's historical arc</title>
  <desc id="desc">A teaching timeline from Josiah's reforms through Jerusalem's fall to Babylon and the promised return.</desc>
  <rect width="1200" height="430" fill="#123e63"/>
  <text x="60" y="62" fill="#fff8e9" font-family="Georgia,serif" font-size="34">Jeremiah’s world: warning, collapse, and hope</text>
  <text x="60" y="96" fill="#dbe8f3" font-family="Arial,sans-serif" font-size="17">Teaching timeline · dates are approximate; read the cited passages for the claims</text>
  <path d="M100 224H1100" stroke="#edc66d" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif">
    <circle cx="150" cy="224" r="19" fill="#edc66d"/><text x="92" y="177" fill="#fff8e9" font-size="20" font-weight="700">Josiah</text><text x="92" y="202" fill="#dbe8f3" font-size="16">c. 640–609 BCE</text><text x="92" y="276" fill="#fff8e9" font-size="16">reform and covenant</text><text x="92" y="300" fill="#dbe8f3" font-size="15">2 Kings 22–23</text>
    <circle cx="390" cy="224" r="19" fill="#edc66d"/><text x="332" y="177" fill="#fff8e9" font-size="20" font-weight="700">Jeremiah called</text><text x="332" y="202" fill="#dbe8f3" font-size="16">c. 627 BCE</text><text x="332" y="276" fill="#fff8e9" font-size="16">tear down · build · plant</text><text x="332" y="300" fill="#dbe8f3" font-size="15">Jeremiah 1:4–10</text>
    <circle cx="630" cy="224" r="19" fill="#edc66d"/><text x="572" y="177" fill="#fff8e9" font-size="20" font-weight="700">Babylon rises</text><text x="572" y="202" fill="#dbe8f3" font-size="16">605–597 BCE</text><text x="572" y="276" fill="#fff8e9" font-size="16">competing promises</text><text x="572" y="300" fill="#dbe8f3" font-size="15">Jeremiah 25; 28–29</text>
    <circle cx="870" cy="224" r="19" fill="#edc66d"/><text x="812" y="177" fill="#fff8e9" font-size="20" font-weight="700">Jerusalem falls</text><text x="812" y="202" fill="#dbe8f3" font-size="16">587/586 BCE</text><text x="812" y="276" fill="#fff8e9" font-size="16">city, temple, and kingship</text><text x="812" y="300" fill="#dbe8f3" font-size="15">Jeremiah 39; 52</text>
    <circle cx="1080" cy="224" r="19" fill="#edc66d"/><text x="1004" y="355" fill="#fff8e9" font-size="20" font-weight="700">Restoration promised</text><text x="1004" y="380" fill="#dbe8f3" font-size="16">Jeremiah 30–33</text>
  </g>
  <text x="60" y="405" fill="#edc66d" font-family="Arial,sans-serif" font-size="16">The book holds judgment and future faithfulness together; it is not a simple success story.</text>
</svg>
