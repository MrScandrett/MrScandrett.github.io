<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Tissot's Indicatrix: How Flat Maps Distort Area vs. Shape">
  <defs>
    <linearGradient id="bgTissot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1926"/>
      <stop offset="100%" stop-color="#040c14"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bgTissot)"/>
  <rect x="20" y="20" width="920" height="440" rx="16" fill="none" stroke="#1c4566" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="58" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">Tissot's Indicatrix: Visualizing Mathematical Distortion</text>
  <text x="50" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#93c5fd">Nicolas Tissot proved in 1859 that infinitely small circles on a globe become distorted into ellipses of varying area or elongation when projected.</text>

  <!-- 3 Comparison Panels -->
  <!-- 1. Conformal (Mercator) -->
  <g transform="translate(50, 110)">
    <rect width="270" height="320" rx="12" fill="#081724" stroke="#1d486d" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#38bdf8">Conformal (Mercator)</text>
    <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde047">Preserves Angles &amp; Shapes</text>

    <!-- Indicatrices at 0, 30, 60 deg lat -->
    <g transform="translate(25, 65)">
      <!-- 60 deg N: Enormous Circle -->
      <circle cx="110" cy="40" r="36" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
      <text x="110" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">60° N · Area 4×!</text>

      <!-- 30 deg N: Medium Circle -->
      <circle cx="110" cy="105" r="22" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
      <text x="110" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#e0f2fe">30° N</text>

      <!-- Equator: Baseline Circle -->
      <circle cx="110" cy="155" r="16" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
      <text x="110" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#e0f2fe">0° (Equator)</text>
    </g>

    <text x="20" y="248" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Ellipses remain <strong>perfect circles</strong></text>
    <text x="20" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Local shapes and compass bearings true</text>
    <text x="20" y="284" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">• Area expands toward infinity at poles!</text>
    <text x="20" y="304" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">Greenland looks the size of Africa.</text>
  </g>

  <!-- 2. Equal-Area (Gall-Peters) -->
  <g transform="translate(345, 110)">
    <rect width="270" height="320" rx="12" fill="#081724" stroke="#1d486d" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#4ade80">Equal-Area (Gall–Peters)</text>
    <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde047">Preserves True Relative Area</text>

    <!-- Indicatrices -->
    <g transform="translate(25, 65)">
      <!-- 60 deg N: Horizontally stretched ellipse (same area as circle r=16) -->
      <ellipse cx="110" cy="40" rx="32" ry="8" fill="#4ade80" fill-opacity="0.3" stroke="#4ade80" stroke-width="2"/>
      <text x="110" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff">60° N · Stretched E-W</text>

      <!-- 45 deg N: Standard parallel (circle) -->
      <circle cx="110" cy="95" r="16" fill="#4ade80" fill-opacity="0.3" stroke="#4ade80" stroke-width="2"/>
      <text x="110" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#dcfce7">45° N (Standard parallel)</text>

      <!-- Equator: Vertically stretched ellipse -->
      <ellipse cx="110" cy="155" rx="10" ry="25.6" fill="#4ade80" fill-opacity="0.3" stroke="#4ade80" stroke-width="2"/>
      <text x="110" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#dcfce7">0° · Stretched N-S</text>
    </g>

    <text x="20" y="248" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Ellipse <strong>surface area is constant</strong></text>
    <text x="20" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Landmass area comparisons are 100% fair</text>
    <text x="20" y="284" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">• Extreme shape and angle distortion</text>
    <text x="20" y="304" font-family="system-ui, sans-serif" font-size="10" fill="#4ade80">Africa appears stretched out like laundry.</text>
  </g>

  <!-- 3. Compromise (Robinson) -->
  <g transform="translate(640, 110)">
    <rect width="270" height="320" rx="12" fill="#081724" stroke="#1d486d" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#f59e0b">Compromise (Robinson)</text>
    <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde047">Balances Area &amp; Shape</text>

    <!-- Indicatrices -->
    <g transform="translate(25, 65)">
      <!-- 60 deg N: Mildly enlarged, mildly sheared ellipse -->
      <ellipse cx="110" cy="40" rx="23" ry="17" transform="rotate(8 110 40)" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2"/>
      <text x="110" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff">60° N · Modest distortion</text>

      <!-- 30 deg N -->
      <ellipse cx="110" cy="100" rx="18" ry="16" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2"/>
      <text x="110" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fef3c7">30° N</text>

      <!-- Equator -->
      <circle cx="110" cy="155" r="16" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2"/>
      <text x="110" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fef3c7">0° (Equator)</text>
    </g>

    <text x="20" y="248" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Neither strictly equal-area nor conformal</text>
    <text x="20" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Distributes error gracefully across the map</text>
    <text x="20" y="284" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Looks "natural" to human perception</text>
    <text x="20" y="304" font-family="system-ui, sans-serif" font-size="10" fill="#f59e0b">National Geographic standard (1988–1998).</text>
  </g>
</svg>
