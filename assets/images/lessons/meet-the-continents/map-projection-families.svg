<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Cartographic Projection Families: Developable Surfaces (Cylindrical, Conic, and Azimuthal)">
  <defs>
    <linearGradient id="bgCart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2338"/>
      <stop offset="100%" stop-color="#06121d"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bgCart)"/>
  <rect x="20" y="20" width="920" height="440" rx="16" fill="none" stroke="#1d4d75" stroke-width="1.5"/>

  <!-- Header -->
  <text x="50" y="58" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">The Developable Surfaces of Cartography</text>
  <text x="50" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#93c5fd">Because a sphere cannot be flattened without stretching or tearing, cartographers project Earth onto unrollable geometric surfaces</text>

  <!-- 3 Columns for Families -->
  <!-- 1. Cylindrical -->
  <g transform="translate(50, 110)">
    <rect width="270" height="320" rx="12" fill="#091b2c" stroke="#1e517d" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#7dd3fc">1. Cylindrical</text>
    <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Cylinder wrapped around equator</text>

    <!-- Diagram -->
    <g transform="translate(35, 65)">
      <!-- Cylinder outline -->
      <ellipse cx="100" cy="20" rx="80" ry="18" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <line x1="20" y1="20" x2="20" y2="140" stroke="#38bdf8" stroke-width="2"/>
      <line x1="180" y1="20" x2="180" y2="140" stroke="#38bdf8" stroke-width="2"/>
      <ellipse cx="100" cy="140" rx="80" ry="18" fill="#0e3a5f" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
      <!-- Globe inside -->
      <circle cx="100" cy="80" r="48" fill="url(#globeGrad)" fill-opacity="0.4" stroke="#e0f2fe" stroke-width="1.5"/>
      <ellipse cx="100" cy="80" rx="48" ry="12" fill="none" stroke="#e0f2fe" stroke-width="1" stroke-dasharray="3 2"/>
    </g>

    <text x="20" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Characteristics:</text>
    <text x="20" y="254" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Meridians &amp; parallels are straight lines</text>
    <text x="20" y="271" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Distortion minimal near equator</text>
    <text x="20" y="288" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• High latitudes expand massively (Mercator)</text>
    <text x="20" y="305" font-family="system-ui, sans-serif" font-size="10.5" fill="#38bdf8">Examples: Mercator, Gall-Peters, Miller</text>
  </g>

  <!-- 2. Conic -->
  <g transform="translate(345, 110)">
    <rect width="270" height="320" rx="12" fill="#091b2c" stroke="#1e517d" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#fde047">2. Conic</text>
    <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Cone placed over a chosen hemisphere</text>

    <!-- Diagram -->
    <g transform="translate(35, 65)">
      <!-- Cone apex -->
      <path d="M 100,5 L 15,140 Q 100,165 185,140 Z" fill="#2d3b14" fill-opacity="0.4" stroke="#facc15" stroke-width="2"/>
      <!-- Globe inside -->
      <circle cx="100" cy="95" r="46" fill="url(#globeGrad)" fill-opacity="0.4" stroke="#fef08a" stroke-width="1.5"/>
      <ellipse cx="100" cy="95" rx="46" ry="10" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="3 2"/>
      <ellipse cx="100" cy="72" rx="38" ry="8" fill="none" stroke="#facc15" stroke-width="1.5"/>
    </g>

    <text x="20" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Characteristics:</text>
    <text x="20" y="254" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Meridians radiate; parallels form arcs</text>
    <text x="20" y="271" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Distortion minimal along standard parallels</text>
    <text x="20" y="288" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Excellent for mid-latitude countries (USA)</text>
    <text x="20" y="305" font-family="system-ui, sans-serif" font-size="10.5" fill="#fde047">Examples: Albers Equal-Area, Lambert Conformal</text>
  </g>

  <!-- 3. Azimuthal (Planar) -->
  <g transform="translate(640, 110)">
    <rect width="270" height="320" rx="12" fill="#091b2c" stroke="#1e517d" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#4ade80">3. Azimuthal (Planar)</text>
    <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Flat plane tangent to a single point</text>

    <!-- Diagram -->
    <g transform="translate(35, 65)">
      <!-- Flat tangent plane at top pole -->
      <polygon points="10,40 160,20 190,60 40,80" fill="#065f46" fill-opacity="0.4" stroke="#4ade80" stroke-width="2"/>
      <!-- Globe below tangent plane -->
      <circle cx="100" cy="100" r="48" fill="url(#globeGrad)" fill-opacity="0.4" stroke="#a7f3d0" stroke-width="1.5"/>
      <ellipse cx="100" cy="100" rx="48" ry="12" fill="none" stroke="#a7f3d0" stroke-width="1" stroke-dasharray="3 2"/>
      <!-- Tangent point -->
      <circle cx="100" cy="52" r="4" fill="#facc15"/>
    </g>

    <text x="20" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Characteristics:</text>
    <text x="20" y="254" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Distances or directions true from center point</text>
    <text x="20" y="271" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Circular outer boundary</text>
    <text x="20" y="288" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Ideal for polar navigation and airline routes</text>
    <text x="20" y="305" font-family="system-ui, sans-serif" font-size="10.5" fill="#4ade80">Examples: Polar Equidistant, Orthographic</text>
  </g>
</svg>

