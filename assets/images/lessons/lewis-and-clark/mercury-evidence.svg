<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440"><rect width="1000" height="440" fill="#f3f6f4"/><g font-family="sans-serif" fill="#263d43"><text x="40" y="48" font-size="27" font-weight="bold">A chemical compound → a chemical trace → a historical claim</text><text x="40" y="93" font-size="18">Calomel: mercury(I) chloride, Hg₂Cl₂</text></g><g stroke="#526a76" stroke-width="7"><path d="M115 165H345"/></g><g stroke="#334c56" stroke-width="2"><circle cx="115" cy="165" r="28" fill="#a9c6a5"/><circle cx="185" cy="165" r="38" fill="#b7c8d3"/><circle cx="275" cy="165" r="38" fill="#b7c8d3"/><circle cx="345" cy="165" r="28" fill="#a9c6a5"/></g><g font-family="sans-serif" font-size="21" text-anchor="middle" fill="#233b43"><text x="115" y="173">Cl</text><text x="185" y="173">Hg</text><text x="275" y="173">Hg</text><text x="345" y="173">Cl</text></g><path d="M420 165H510L495 155M510 165L495 175" fill="none" stroke="#263d43" stroke-width="3"/><path d="M535 128H915V150H535Z" fill="#76a780"/><path d="M535 150H915V270H535Z" fill="#c8b298"/><path d="M640 150V235Q730 280 815 235V150" fill="#82705f"/><g fill="#f3d16a"><circle cx="675" cy="215" r="6"/><circle cx="705" cy="235" r="6"/><circle cx="750" cy="226" r="6"/><circle cx="782" cy="210" r="6"/></g><g font-family="sans-serif" fill="#263d43" font-size="19"><text x="550" y="103">Latrine soil: sampled in context</text><text x="42" y="245">Composition schematic, not pill appearance</text><text x="42" y="310">A mercury signal is one clue.</text><text x="42" y="343">Ask: what is the background level? How old is the deposit?</text><text x="42" y="376">Do artifacts and written locations agree? Could another source explain it?</text><text x="42" y="417" font-size="15">Schematic teaching illustration; dots represent a detectable trace, not visible mercury droplets.</text></g></svg>