<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Capacitors and RC time</title><desc id="desc">Concept overview: Q = CV, τ = RC, 63% per τ. Schematic, not to scale.</desc><rect width="640" height="360" fill="#122237"/><g fill="none" stroke="#70d8cf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="200" y="30" width="240" height="160" rx="10"/><path d="M220 170 H420" opacity=".5"/></g><g fill="none" stroke="#f7cb68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M220 170 C 260 70, 300 55, 420 50"/><path d="M262 62 V170" stroke-dasharray="4 6"/></g><text x="320" y="236" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="27" font-weight="650">Capacitors and RC time</text><circle cx="110" cy="262" r="3" fill="#f7cb68"/><text x="110" y="296" text-anchor="middle" fill="#c8dae9" font-family="system-ui,sans-serif" font-size="17">Q = CV</text><circle cx="320" cy="262" r="3" fill="#f7cb68"/><text x="320" y="296" text-anchor="middle" fill="#c8dae9" font-family="system-ui,sans-serif" font-size="17">τ = RC</text><circle cx="530" cy="262" r="3" fill="#f7cb68"/><text x="530" y="296" text-anchor="middle" fill="#c8dae9" font-family="system-ui,sans-serif" font-size="17">63% per τ</text></svg>