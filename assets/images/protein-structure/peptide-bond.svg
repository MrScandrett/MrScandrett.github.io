<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img"><title>Net peptide bond formation between two free amino acids</title><defs><radialGradient id="atom" cx="30%" cy="25%"><stop stop-color="#ffffff"/><stop offset=".3" stop-color="#a69bc7"/><stop offset="1" stop-color="#534866"/></radialGradient><linearGradient id="ribbon" x2="0" y2="1"><stop stop-color="#d8b4fe"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4c1d95"/></linearGradient></defs><rect width="800" height="560" fill="#f8f7fc"/><text x="400" y="55" font-family="Arial,sans-serif" font-size="29" fill="#433566" text-anchor="middle">PEPTIDE BOND · net condensation</text><text x="400" y="97" font-family="Arial,sans-serif" font-size="22" fill="#433566" text-anchor="middle">Bookkeeping of atoms, not the ribosome mechanism</text><text x="185" y="177" font-family="Arial,sans-serif" font-size="26" fill="#1e293b" text-anchor="middle">H₂N–CH(R₁)–COOH</text><text x="400" y="177" font-family="Arial,sans-serif" font-size="30" fill="#433566" text-anchor="middle">+</text><text x="610" y="177" font-family="Arial,sans-serif" font-size="26" fill="#1e293b" text-anchor="middle">H₂N–CH(R₂)–COOH</text><path d="M400,213 L400,257" fill="none" stroke="#6d28d9" stroke-width="5" stroke-linecap="round"/><path d="M389 247 L400 265 L411 247" fill="#6d28d9"/><text x="80" y="316" font-family="Arial,sans-serif" font-size="28" fill="#1e293b" text-anchor="middle">H₂N</text><text x="200" y="316" font-family="Arial,sans-serif" font-size="28" fill="#1e293b" text-anchor="middle">CH(R₁)</text><text x="330" y="316" font-family="Arial,sans-serif" font-size="28" fill="#1e293b" text-anchor="middle">C</text><text x="430" y="316" font-family="Arial,sans-serif" font-size="28" fill="#1e293b" text-anchor="middle">N</text><text x="550" y="316" font-family="Arial,sans-serif" font-size="28" fill="#1e293b" text-anchor="middle">CH(R₂)</text><text x="700" y="316" font-family="Arial,sans-serif" font-size="28" fill="#1e293b" text-anchor="middle">COOH</text><path d="M112,307 L142,307" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/><path d="M259,307 L312,307" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/><path d="M349,307 L411,307" fill="none" stroke="#6d28d9" stroke-width="6" stroke-linecap="round"/><path d="M449,307 L491,307" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/><path d="M609,307 L650,307" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/><path d="M326,328 L326,365" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/><path d="M334,328 L334,365" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/><text x="330" y="399" font-family="Arial,sans-serif" font-size="27" fill="#b91c1c" text-anchor="middle">O</text><path d="M430,328 L430,363" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/><text x="430" y="399" font-family="Arial,sans-serif" font-size="27" fill="#1e293b" text-anchor="middle">H</text><text x="400" y="451" font-family="Arial,sans-serif" font-size="26" fill="#6d28d9" text-anchor="middle">New C–N bond + one H₂O equivalent</text><text x="400" y="510" font-family="Arial,sans-serif" font-size="22" fill="#433566" text-anchor="middle">Two residues → one peptide bond · R groups remain</text></svg>
