<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classic Snake</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header><strong>Snake</strong><output id="score">Score 0</output></header>
    <canvas width="400" height="400" tabindex="0" aria-label="Snake board. Use the arrow keys to steer."></canvas>
    <div class="controls">
      <button id="start">Play</button>
      <button data-turn="ArrowLeft" aria-label="Left">←</button>
      <button data-turn="ArrowUp" aria-label="Up">↑</button>
      <button data-turn="ArrowDown" aria-label="Down">↓</button>
      <button data-turn="ArrowRight" aria-label="Right">→</button>
    </div>
    <p id="status" role="status">Use arrow keys or tap the arrows.</p>
  </main>
</body>
</html>
