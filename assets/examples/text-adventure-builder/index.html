<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Locked Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main>
  <h1>The Locked Library</h1>
  <p>Find the key and escape through the garden door.</p>
  <output id="stats"></output>
  <p id="message" role="status"></p>
  <button id="first">Search the shelves</button>
  <button id="second">Open the door</button>
  <button id="again" hidden>Play again</button>
</main>
</body>
</html>
