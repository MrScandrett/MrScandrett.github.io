<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dungeon Descent</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main>
  <h1>Dungeon Descent</h1>
  <p>Reach floor five. Descending costs health, and each potion heals three points.</p>
  <output id="stats"></output>
  <p id="message" role="status"></p>
  <button id="first">Descend</button>
  <button id="second">Drink potion</button>
  <button id="again" hidden>Play again</button>
</main>
</body>
</html>
