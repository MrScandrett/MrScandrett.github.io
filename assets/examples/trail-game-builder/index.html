<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wagon Trail</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<main>
  <h1>Wagon Trail</h1>
  <p>Reach the fort 100 miles west. Traveling uses supplies. Foraging costs a day.</p>
  <output id="stats"></output>
  <p id="message" role="status"></p>
  <button id="first">Travel west</button>
  <button id="second">Forage</button>
  <button id="again" hidden>Play again</button>
</main>
</body>
</html>
