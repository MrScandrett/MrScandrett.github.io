<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Frog Bog</title><link rel="stylesheet" href="style.min.css"/></head><body><div class="wrap"><h1>🐸 Frog Bog</h1><p class="subtitle">A tribute to the 1982 Atari classic. Catch flies with your frog's tongue before time runs out!</p><div class="scoreboard"><div class="score p1"><span class="label">Player 1</span> <span class="value" id="score1">0</span></div><div class="timer" id="timer">60</div><div class="score p2"><span class="label">Player 2</span> <span class="value" id="score2">0</span></div></div><canvas id="game" width="800" height="500"></canvas><div class="controls"><div class="controls-col">Player 1: <kbd>SPACE</kbd> to jump</div><button id="startBtn">Start Game</button><div class="controls-col">Player 2: <kbd>ENTER</kbd> to jump</div></div><div class="hint">Tip: the closer a fly, the shorter your leap needs to be. Time your jumps to land right on a fly!</div></div><script src="app.min.js"></script></body></html>
