<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Metroblox (1981)</title><link rel="stylesheet" href="style.min.css"/></head><body><div class="wrap"><h1>🏙️ Metroblox (1981)</h1><p class="subtitle">A tribute to 1989's original city-building sim. Zone, wire, and pave your way to a thriving town.</p><div class="stats"><div class="stat"><span class="label">Funds</span><span class="value" id="funds">$10,000</span></div><div class="stat"><span class="label">Population</span><span class="value" id="population">0</span></div><div class="stat"><span class="label">Date</span><span class="value" id="date">Jan 1900</span></div><div class="stat tax"><span class="label">Tax Rate</span> <input type="range" id="taxRate" min="0" max="20" value="9"/> <span class="value" id="taxRateValue">9%</span></div></div><div class="toolbar" id="toolbar"><button data-tool="bulldoze" class="tool active" title="Bulldoze ($1)">🧨<span>Bulldoze</span></button> <button data-tool="road" class="tool" title="Road ($10)">🛣️<span>Road</span></button> <button data-tool="rzone" class="tool" title="Residential Zone ($20)">🏠<span>Residential</span></button> <button data-tool="czone" class="tool" title="Commercial Zone ($25)">🏬<span>Commercial</span></button> <button data-tool="izone" class="tool" title="Industrial Zone ($25)">🏭<span>Industrial</span></button> <button data-tool="power" class="tool" title="Power Line ($15)">⚡<span>Power Line</span></button> <button data-tool="plant" class="tool" title="Power Plant ($500)">🔌<span>Power Plant</span></button></div><canvas id="game" width="560" height="360"></canvas><div class="controls"><button id="newCityBtn">New City</button> <button id="pauseBtn">Pause</button> <span class="hint">Click or drag on the grid to build. Zoned lots grow on their own once they're powered and touch a road.</span></div></div><script src="app.min.js"></script></body></html>
