<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Xeno-Ecosystem: Neon Evolution</title><link rel="stylesheet" href="style.css"><style>body{margin:0;background:#020208;overflow:hidden;font-family:'Courier New',monospace}#simCanvas{display:block;image-rendering:pixelated}#ui{position:absolute;top:20px;left:20px;color:#00f2ff;pointer-events:none;text-shadow:0 0 5px #00f2ff}.event-log{color:#fff200;font-weight:700}#kepler{position:absolute;right:20px;bottom:20px;width:220px;background:linear-gradient(180deg,rgba(2,6,20,.75),rgba(2,2,8,.85));border:1px solid rgba(0,80,95,.6);padding:10px;color:#bfeffd;pointer-events:auto;z-index:2000}#kepler canvas{width:100%;height:auto;display:block;background:0 0}</style></head><body><canvas id="simCanvas"></canvas><div id="ui"><div id="stats">Loading...</div><div id="log">Status: Initializing...</div></div><div id="kepler"><div id="keplerName">SYSTEM: KEPLER-186f</div><canvas id="keplerCanvas" width="96" height="96"></canvas><div id="keplerStats">Pop: 0 | Stars: 0 | Time: 0s</div></div><div id="lab" style="display:none;position:absolute;left:20px;bottom:20px;background:rgba(0,0,0,.8);border:1px solid #00f2ff;padding:15px;color:#bfeffd;font-family:monospace;font-size:11px;z-index:1999;max-width:300px;max-height:400px;overflow:auto"><h3 style="margin:0 0 10px 0;color:#00f2ff">Laboratory</h3><div id="labId">No creature selected</div><pre id="genomeView" style="background:#050a15;padding:8px;border:1px solid #066;margin:8px 0;overflow-x:auto;white-space:pre-wrap"></pre><div style="margin:8px 0"><label>Force Spikes: <select id="forceSpikes" style="background:#020208;color:#00f2ff;border:1px solid #00f2ff"><option value="inherit">Inherit</option><option value="true">Yes</option><option value="false">No</option></select></label></div><div style="margin:8px 0"><label>Force Biolume: <select id="forceBiolume" style="background:#020208;color:#00f2ff;border:1px solid #00f2ff"><option value="inherit">Inherit</option><option value="true">Yes</option><option value="false">No</option></select></label></div><button id="applyForce" style="background:#066;color:#00f2ff;border:1px solid #0ff;padding:4px 8px;cursor:pointer;margin:8px 4px 0 0">Apply</button> <button id="closeLab" style="background:#600;color:#f88;border:1px solid #f88;padding:4px 8px;cursor:pointer;margin:8px 0 0 0">Close</button></div><script src="Script.js"></script></body></html>
