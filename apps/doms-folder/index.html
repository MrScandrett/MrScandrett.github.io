<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kaiju Battleground</title>
  <link rel="icon" href="../../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.min.css">
</head>
<body>
  <main id="home-screen">
    <h1>KAIJU<br><span>BATTLEGROUND</span></h1>
    <div id="home-gcells" class="gcells">G-Cells: 0</div>
    <p class="section-label">Choose your titan</p>
    <div class="kaiju-grid" id="kaiju-grid"></div>

    <div class="menu-options">
      <section>
        <p class="section-label">Game mode</p>
        <div class="button-row">
          <button id="mode-survival" class="mode-btn selected">Survival</button>
          <button id="mode-boss" class="mode-btn">Boss Battle</button>
        </div>
      </section>
      <section>
        <p class="section-label">Ultimate move</p>
        <div class="button-row">
          <button id="ult-thermo" class="mode-btn selected">Thermo Pulse</button>
          <button id="ult-burning" class="mode-btn">Burning Breath</button>
        </div>
      </section>
    </div>
    <button id="play-btn">Enter the city</button>
    <p class="menu-hint">Move with WASD · Attack with 1–4 · Ultimate with 5 · Pause with Esc</p>
  </main>

  <section id="game-shell" aria-label="Kaiju battle">
    <div id="top-ui" class="hidden">
      <div id="healthContainer" class="meter">
        <span>Health</span>
        <div class="bar"><div id="playerHealth"></div></div>
      </div>
      <div id="ultimateContainer" class="meter">
        <span>Ultimate</span>
        <div class="bar"><div id="ultimateBar"></div></div>
      </div>
      <div id="game-gcells" class="gcells hidden">G-Cells: 0</div>
      <button id="pause-btn" class="hud-button hidden" aria-label="Pause game">Ⅱ</button>
    </div>

    <canvas id="gameCanvas" width="1000" height="600" class="hidden"></canvas>
    <div id="battle-status" class="hidden" aria-live="polite">
      <span id="wave-status">Wave 1 / 3</span>
      <span id="combo-status">Combo ×1</span>
    </div>
    <p id="log" class="hidden" role="status" aria-live="polite"></p>

    <div id="bottom-ui" class="hidden" aria-label="Attacks">
      <button class="move-slot" data-move="1"><span class="key-label">1</span><span>Tailwhip</span><span class="cooldown-overlay" id="cd-1"></span></button>
      <button class="move-slot" data-move="2"><span class="key-label">2</span><span>Stomp</span><span class="cooldown-overlay" id="cd-2"></span></button>
      <button class="move-slot" data-move="3"><span class="key-label">3</span><span>Bite</span><span class="cooldown-overlay" id="cd-3"></span></button>
      <button class="move-slot" data-move="4"><span class="key-label">4</span><span>Beam</span><span class="cooldown-overlay" id="cd-4"></span></button>
      <button class="move-slot ultimate-slot" data-move="5"><span class="key-label">5</span><span>Ultimate</span></button>
      <button id="dash-btn" class="move-slot dash-slot"><span class="key-label">Space</span><span>Dash</span></button>
    </div>
    <div id="touch-pad" class="hidden" aria-label="Movement controls">
      <button data-key="w" class="touch-up" aria-label="Move up">▲</button>
      <button data-key="a" aria-label="Move left">◀</button>
      <button data-key="s" aria-label="Move down">▼</button>
      <button data-key="d" aria-label="Move right">▶</button>
    </div>
  </section>

  <div id="pause-menu" class="hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <div class="pause-content">
      <h2 id="pause-title">Paused</h2>
      <button id="resume-btn">Resume</button>
      <button id="quit-btn">Quit to menu</button>
    </div>
  </div>

  <script src="app.min.js"></script>
</body>
</html>
