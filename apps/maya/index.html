<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Gravity Dodge</title><style>body{margin:0;background:#000;overflow:hidden;font-family:Arial}canvas{display:block;margin:auto;background:#050505}</style></head><body><canvas id="game"></canvas><script>const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let debris=[], particles=[], powerUps=[];
let score=0, gameOver=false;
let highScore=localStorage.getItem("gravityHighScore")||0;
let currentSkin=localStorage.getItem("gravitySkin")||"classic";

let shield=0, slowTime=0, doubleScore=0, dashCooldown=0;

const skins={
  classic:{color:"lime",unlock:0},
  neon:{color:"cyan",unlock:0},
  fire:{color:"orange",unlock:1000},
  galaxy:{color:"purple",unlock:2500},
  gold:{color:"gold",unlock:5000}
};

const skinKeys=["classic","neon","fire","galaxy","gold"];
// IDEA: track dashCooldown (already computed above) as a small bar near the
// score so the player can see when Shift-dash is ready again.

const player={
  size:30,
  x:canvas.width/2,
  y:canvas.height/2,
  speed:6,
  dashSpeed:18
};

const keys={};
document.addEventListener("keydown",e=>{
  keys[e.code]=true;

  if(e.code==="ShiftLeft" && dashCooldown<=0) dash();
  if(e.code==="KeyR" && gameOver) restartGame();

  // Skin switching
  if(e.code.startsWith("Digit")){
    const index=parseInt(e.code.replace("Digit",""))-1;
    if(skinKeys[index]){
      const chosen=skinKeys[index];
      if(highScore>=skins[chosen].unlock){
        currentSkin=chosen;
        localStorage.setItem("gravitySkin",currentSkin);
      }
    }
  }
});
document.addEventListener("keyup",e=>keys[e.code]=false);

function dash(){
  if(keys["ArrowLeft"]) player.x-=player.dashSpeed;
  if(keys["ArrowRight"]) player.x+=player.dashSpeed;
  if(keys["ArrowUp"]) player.y-=player.dashSpeed;
  if(keys["ArrowDown"]) player.y+=player.dashSpeed;
  dashCooldown=60;
}

function spawnDebris(){
  const shapes=["circle","square","triangle","pentagon","hexagon"];
  debris.push({
    x:Math.random()*canvas.width,
    y:-40,
    size:20+Math.random()*15,
    speed:3+Math.random()*2+score/2000,
    shape:shapes[Math.floor(Math.random()*shapes.length)],
    color:`hsl(${Math.random()*360},100%,50%)`
  });
}
setInterval(spawnDebris,600);

const powerUpTypes={
  shield:{color:"deepskyblue",duration:300},
  slow:{color:"violet",duration:300},
  double:{color:"yellow",duration:300}
};
const powerUpKeys=Object.keys(powerUpTypes);

function spawnPowerUp(){
  if(gameOver)return;
  const type=powerUpKeys[Math.floor(Math.random()*powerUpKeys.length)];
  powerUps.push({
    x:Math.random()*canvas.width,
    y:-30,
    size:16,
    speed:2.5,
    type
  });
}
setInterval(spawnPowerUp,8000);

function neon(color){
  ctx.shadowBlur=25;
  ctx.shadowColor=color;
}

function drawShape(d){
  neon(d.color);
  ctx.fillStyle=d.color;
  ctx.beginPath();

  if(d.shape==="circle"){
    ctx.arc(d.x,d.y,d.size,0,Math.PI*2);
  } else {
    const sides={square:4,triangle:3,pentagon:5,hexagon:6}[d.shape];
    for(let i=0;i<sides;i++){
      const angle=(i/sides)*Math.PI*2;
      const x=d.x+Math.cos(angle)*d.size;
      const y=d.y+Math.sin(angle)*d.size;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
  }

  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur=0;
}

function update(){
  if(gameOver) return;

  score+=doubleScore>0?2:1;

  if(keys["ArrowLeft"]) player.x-=player.speed;
  if(keys["ArrowRight"]) player.x+=player.speed;
  if(keys["ArrowUp"]) player.y-=player.speed;
  if(keys["ArrowDown"]) player.y+=player.speed;

  player.x=Math.max(0,Math.min(canvas.width-player.size,player.x));
  player.y=Math.max(0,Math.min(canvas.height-player.size,player.y));

  debris.forEach(d=>{
    d.y+=slowTime>0?d.speed*0.4:d.speed;

    if(
      player.x < d.x+d.size &&
      player.x+player.size > d.x &&
      player.y < d.y+d.size &&
      player.y+player.size > d.y
    ){
      if(shield<=0){
        gameOver=true;
        if(score>highScore){
          highScore=score;
          localStorage.setItem("gravityHighScore",highScore);
        }
      }
    }
  });

  debris=debris.filter(d=>d.y<canvas.height+50);
  if(dashCooldown>0) dashCooldown--;

  powerUps.forEach(p=>{
    p.y+=p.speed;
    if(
      player.x<p.x+p.size &&
      player.x+player.size>p.x &&
      player.y<p.y+p.size &&
      player.y+player.size>p.y
    ){
      p.collected=true;
      const duration=powerUpTypes[p.type].duration;
      if(p.type==="shield") shield=duration;
      if(p.type==="slow") slowTime=duration;
      if(p.type==="double") doubleScore=duration;
    }
  });
  powerUps=powerUps.filter(p=>!p.collected&&p.y<canvas.height+50);

  if(shield>0) shield--;
  if(slowTime>0) slowTime--;
  if(doubleScore>0) doubleScore--;
}

function restartGame(){
  debris=[];
  particles=[];
  powerUps=[];
  score=0;
  shield=0;
  slowTime=0;
  doubleScore=0;
  dashCooldown=0;
  player.x=canvas.width/2;
  player.y=canvas.height/2;
  gameOver=false;
}

function drawPlayer(){
  const skin=skins[currentSkin];

  if(currentSkin==="galaxy"){
    const gradient=ctx.createLinearGradient(player.x,player.y,player.x+30,player.y+30);
    gradient.addColorStop(0,"purple");
    gradient.addColorStop(1,"blue");
    ctx.fillStyle=gradient;
    neon("purple");
  } else {
    ctx.fillStyle=skin.color;
    neon(skin.color);
  }

  ctx.fillRect(player.x,player.y,player.size,player.size);
  ctx.shadowBlur=0;
}

function drawPowerUp(p){
  neon(powerUpTypes[p.type].color);
  ctx.fillStyle=powerUpTypes[p.type].color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size/2,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  debris.forEach(drawShape);
  powerUps.forEach(drawPowerUp);
  drawPlayer();

  if(shield>0){
    ctx.strokeStyle="deepskyblue";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(player.x+player.size/2,player.y+player.size/2,player.size,0,Math.PI*2);
    ctx.stroke();
  }

  ctx.fillStyle="white";
  ctx.font="18px Arial";
  ctx.fillText("Score: "+score,20,30);
  ctx.fillText("High Score: "+highScore,20,55);
  ctx.fillText("Skin: "+currentSkin,20,80);

  ctx.fillText("1-5 to change skins",20,110);

  let buffY=135;
  if(shield>0){ ctx.fillText("Shield: "+Math.ceil(shield/60)+"s",20,buffY); buffY+=22; }
  if(slowTime>0){ ctx.fillText("Slow-Mo: "+Math.ceil(slowTime/60)+"s",20,buffY); buffY+=22; }
  if(doubleScore>0){ ctx.fillText("2x Score: "+Math.ceil(doubleScore/60)+"s",20,buffY); }

  if(gameOver){
    ctx.textAlign="center";
    ctx.font="50px Arial";
    neon("white");
    ctx.fillText("GAME OVER",canvas.width/2,canvas.height/2);
    ctx.font="20px Arial";
    ctx.fillText("Press R to Restart",canvas.width/2,canvas.height/2+40);
    ctx.shadowBlur=0;
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();</script><script>window.__TOUCH_CONTROLS__={"landscape":true,"clusters":[{"side":"left","pad":{"up":"ArrowUp","down":"ArrowDown","left":"ArrowLeft","right":"ArrowRight"}},{"side":"right","buttons":[{"code":"ShiftLeft","label":"Dash","hold":false},{"code":"KeyR","label":"Retry","hold":false}]}]}</script><script>(function(){"use strict";var m=window.__TOUCH_CONTROLS__;if(!m)return;var v={ArrowUp:["ArrowUp",38],ArrowDown:["ArrowDown",40],ArrowLeft:["ArrowLeft",37],ArrowRight:["ArrowRight",39],Space:[" ",32],Enter:["Enter",13],Escape:["Escape",27],ShiftLeft:["Shift",16],ShiftRight:["Shift",16],Tab:["Tab",9],Backspace:["Backspace",8]};function k(e){if(v[e])return{code:e,key:v[e][0],keyCode:v[e][1]};if(/^Key[A-Z]$/.test(e)){var t=e.slice(3);return{code:e,key:t.toLowerCase(),keyCode:t.charCodeAt(0)}}if(/^Digit[0-9]$/.test(e)){var i=e.slice(5);return{code:e,key:i,keyCode:i.charCodeAt(0)}}return{code:e,key:e,keyCode:0}}function h(e,t){var i=document.body||document.documentElement,d=new KeyboardEvent(e,{key:t.key,code:t.code,bubbles:!0,cancelable:!0});try{Object.defineProperty(d,"keyCode",{get:function(){return t.keyCode}}),Object.defineProperty(d,"which",{get:function(){return t.keyCode}})}catch{}i.dispatchEvent(d)}function C(){return window.matchMedia&&window.matchMedia("(pointer: coarse)").matches}function L(){if(!C())return"desktop";var e=Math.min(window.innerWidth,window.innerHeight);return e>=700?"tablet":"phone"}var A=[".tc-root{position:fixed;inset:0;z-index:2147483000;pointer-events:none;","font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;","padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))"," max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));}",".tc-root[hidden]{display:none}",".tc-cluster{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));","display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}",".tc-cluster.tc-left{left:max(14px,env(safe-area-inset-
