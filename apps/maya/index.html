<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050505"><link rel="icon" href="data:,"><title>Gravity Dodge</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body,html{width:100%;height:100%}body{margin:0;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%;background:#050505}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style></head><body><canvas id="game" aria-label="Gravity Dodge game"></canvas><p class="sr-only">Use arrow keys or WASD to move. Press Shift or Space to dash. Press P to pause.</p><script>const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const TAU = Math.PI * 2;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let width = innerWidth;
let height = innerHeight;

function resize() {
  width = innerWidth;
  height = innerHeight;
  canvas.width = Math.round(width * DPR);
  canvas.height = Math.round(height * DPR);
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  player.x = Math.max(player.radius, Math.min(width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(height - player.radius, player.y));
  makeStars();
}

const skins = {
  classic: { color: "#66ff66", accent: "#eaffea", unlock: 0 },
  neon:   { color: "#30f8ff", accent: "#e4ffff", unlock: 0 },
  fire:   { color: "#ff922b", accent: "#ffe1a8", unlock: 1000 },
  galaxy: { color: "#b43cff", accent: "#5b7cff", unlock: 2500 },
  gold:   { color: "#ffd43b", accent: "#fff4b0", unlock: 5000 }
};
const skinKeys = Object.keys(skins);

let highScore = Number(localStorage.getItem("gravityHighScore")) || 0;
let currentSkin = localStorage.getItem("gravitySkin") || "classic";
if (!skins[currentSkin] || highScore < skins[currentSkin].unlock) currentSkin = "classic";

const player = {
  x: width / 2, y: height * 0.7, radius: 15,
  vx: 0, vy: 0, acceleration: 1850, maxSpeed: 390,
  dashSpeed: 820, dashCooldown: 0, dashFlash: 0, invulnerable: 0,
  angle: 0
};

let state = "menu";
let score = 0;
let displayScore = 0;
let survivalTime = 0;
let spawnTimer = 0;
let powerTimer = 7;
let shake = 0;
let flash = 0;
let combo = 1;
let comboTimer = 0;
let lastTime = performance.now();
let debris = [];
let particles = [];
let powerUps = [];
let trails = [];
let stars = [];
let messages = [];
let shield = 0;
let slowTime = 0;
let doubleScore = 0;

const keys = {};
const pointer = { active: false, x: 0, y: 0 };
const touchDevice = matchMedia("(pointer: coarse)").matches;
let lastTap = 0;
const powerUpTypes = {
  shield: { color: "#25bfff", label: "S", name: "SHIELD" },
  slow:   { color: "#d861ff", label: "⌛", name: "TIME WARP" },
  double: { color: "#ffe14a", label: "2×", name: "DOUBLE SCORE" }
};

function makeStars() {
  const count = Math.min(140, Math.floor(width * height / 11000));
  stars = Array.from({ length: count }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    size: Math.random() * 1.6 + 0.2,
    alpha: Math.random() * 0.55 + 0.12,
    speed: Math.random() * 16 + 5
  }));
}

function startGame() {
  debris = [];
  particles = [];
  powerUps = [];
  trails = [];
  messages = [];
  score = 0;
  displayScore = 0;
  survivalTime = 0;
  spawnTimer = 0.7;
  powerTimer = 6;
  shake = 0;
  flash = 0;
  combo = 1;
  comboTimer = 0;
  shield = 0;
  slowTime = 0;
  doubleScore = 0;
  Object.assign(player, {
    x: width / 2, y: height * 0.72, vx: 0, vy: 0,
    dashCooldown: 0, dashFlash: 0, invulnerable: 1
  });
  state = "playing";
  addMessage("SURVIVE", width / 2, height * 0.43, "#fff", 1.1, 28);
}

function togglePause() {
  if (state === "playing") state = "paused";
  else if (state === "paused") state = "playing";
}

function selectSkin(index) {
  const name = skinKeys[index];
  if (!name) return;
  if (highScore >= skins[name].unlock) {
    currentSkin = name;
    localStorage.setItem("gravitySkin", name);
    burst(player.x, player.y, skins[name].color, 12, 130);
  } else {
    addMessage("UNLOCK AT " + skins[name].unlock, width / 2, height * 0.68, "#ff6680", 1, 16);
  }
}

document.addEventListener("keydown", event => {
  keys[event.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(event.code)) event.preventDefault();
  if ((event.code === "ShiftLeft" || event.code === "ShiftRight" || event.code === "Space") && state === "playing") dash();
  if ((event.code === "Enter" || event.code === "KeyR") && (state === "menu" || state === "gameover")) startGame();
  if (event.code === "KeyP" || event.code === "Escape") togglePause();
  if (event.code.startsWith("Digit")) selectSkin(Number(event.code.slice(5)) - 1);
});
document.addEventListener("keyup", event => { keys[event.code] = false; });
window.addEventListener("blur", () => { if (state === "playing") state = "paused"; });
window.addEventListener("resize", resize);

canvas.addEventListener("pointerdown", event => {
  pointer.active = true;
  pointer.x = event.clientX;
  pointer.y = event.clientY;
  const now = performance.now();
  if (state === "playing" && now - lastTap < 300) dash();
  if (state === "menu" || state === "gameover") startGame();
  else if (state === "paused") state = "playing";
  lastTap = now;
});
canvas.addEventListener("pointermove", event => {
  if (!pointer.active) return;
  pointer.x = event.clientX;
  pointer.y = event.clientY;
});
canvas.addEventListener("pointerup", () => { pointer.active = false; });
canvas.addEventListener("pointercancel", () => { pointer.active = false; });

function dash() {
  if (player.dashCooldown > 0) return;
  let dx = inputX();
  let dy = inputY();
  if (pointer.active) {
    dx = pointer.x - player.x;
    dy = pointer.y - player.y;
  }
  if (!dx && !dy) {
    const speed = Math.hypot(player.vx, player.vy);
    dx = speed > 10 ? player.vx / speed : 0;
    dy = speed > 10 ? player.vy / speed : -1;
  }
  const length = Math.hypot(dx, dy) || 1;
  player.vx = dx / length * player.dashSpeed;
  player.vy = dy / length * player.dashSpeed;
  player.dashCooldown = 1.15;
  player.dashFlash = 0.16;
  player.invulnerable = 0.18;
  shake = Math.max(shake, 4);
  burst(player.x, player.y, skins[currentSkin].color, 16, 230, true);
}

function inputX() {
  return (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
}
function inputY() {
  return (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
}

function spawnDebris() {
  const shapes = [3, 4, 5, 6, 8, 0];
  const radius = 13 + Math.random() * Math.min(25, 13 + survivalTime * 0.14);
  const targetX = player.x + (Math.random() - 0.5) * width * 0.65;
  const startX = Math.max(radius, Math.min(width - radius, Math.random() < 0.32 ? targetX : Math.random() * width));
  const speed = 155 + Math.random() * 95 + Math.min(180, survivalTime * 3.4);
  debris.push({
    x: startX, y: -radius - 20, radius,
    vx: (Math.random() - 0.5) * (35 + survivalTime), vy: speed,
    sides: shapes[Math.floor(Math.random() * shapes.length)],
    rotation: Math.random() * TAU, spin: (Math.random() - 0.5) * 2.4,
    color: `hsl(${Math.random() * 360}, 100%, 58%)`,
    near: false
  });
}

function spawnPowerUp() {
  const names = Object.keys(powerUpTypes);
  const type = names[Math.floor(Math.random() * names.length)];
  powerUps.push({
    x: 40 + Math.random() * Math.max(1, width - 80), y: -30,
    radius: 14, vy: 115, type, rotation: 0, pulse: Math.random() * TAU
  });
}

function burst(x, y, color, count = 12, speed = 170, streak = false) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * TAU;
    const velocity = speed * (0.35 + Math.random() * 0.65);
    particles.push({
      x, y, vx: Math.cos(angle) * velocity, vy: Math.sin(angle) * velocity,
      life: 0.3 + Math.random() * 0.45, maxLife: 0.75,
      size: streak ? 2 + Math.random() * 3 : 2 + Math.random() * 5,
      color, streak
    });
  }
}

function addMessage(text, x, y, color, life = 0.8, size = 15) {
  messages.push({ text, x, y, color, life, maxLife: life, size });
}

function circleHit(a, b, padding = 0) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  const radius = a.radius + b.radius - padding;
  return dx * dx + dy * dy < radius * radius;
}

function endGame() {
  state = "gameover";
  shake = 16;
  flash = 0.7;
  burst(player.x, player.y, skins[currentSkin].color, 38, 330);
  const finalScore = Math.floor(score);
  if (finalScore > highScore) {
    highScore = finalScore;
    localStorage.setItem("gravityHighScore", highScore);
  }
}

function update(dt) {
  const backgroundSpeed = state === "playing" ? 1 : 0.18;
  for (const star of stars) {
    star.y += star.speed * dt * backgroundSpeed;
    if (star.y > height + 3) { star.y = -3; star.x = Math.random() * width; }
  }

  shake = Math.max(0, shake - 28 * dt);
  flash = Math.max(0, flash - 2.8 * dt);
  messages.forEach(m => { m.life -= dt; m.y -= 22 * dt; });
  messages = messages.filter(m => m.life > 0);
  particles.forEach(p => {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.pow(0.04, dt);
    p.vy *= Math.pow(0.04, dt);
  });
  particles = particles.filter(p => p.life > 0);

  if (state !== "playing") return;

  survivalTime += dt;
  const scoreRate = doubleScore > 0 ? 200 : 100;
  score += dt * scoreRate * combo;
  displayScore += (score - displayScore) * Math.min(1, dt * 10);
  comboTimer -= dt;
  if (comboTimer <= 0) combo = 1;

  shield = Math.max(0, shield - dt);
  slowTime = Math.max(0, slowTime - dt);
  doubleScore = Math.max(0, doubleScore - dt);
  player.dashCooldown = Math.max(0, player.dashCooldown - dt);
  player.dashFlash = Math.max(0, player.dashFlash - dt);
  player.invulnerable = Math.max(0, player.invulnerable - dt);

  let ix = inputX();
  let iy = inputY();
  if (pointer.active) {
    const dx = pointer.x - player.x;
    const dy = pointer.y - player.y;
    const distance = Math.hypot(dx, dy);
    if (distance > 8) { ix = dx / distance; iy = dy / distance; }
  }
  if (ix && iy) { ix *= Math.SQRT1_2; iy *= Math.SQRT1_2; }

  player.vx += ix * player.acceleration * dt;
  player.vy += iy * player.acceleration * dt;
  const drag = Math.pow(ix || iy ? 0.035 : 0.00008, dt);
  player.vx *= drag;
  player.vy *= drag;
  const speed = Math.hypot(player.vx, player.vy);
  const speedLimit = player.dashFlash > 0 ? player.dashSpeed : player.maxSpeed;
  if (speed > speedLimit) {
    player.vx = player.vx / speed * speedLimit;
    player.vy = player.vy / speed * speedLimit;
  }
  if (speed > 20) player.angle = Math.atan2(player.vy, player.vx) + Math.PI / 2;

  player.x += player.vx * dt;
  player.y += player.vy * dt;
  if (player.x < player.radius) { player.x = player.radius; player.vx = Math.abs(player.vx) * 0.25; }
  if (player.x > width - player.radius) { player.x = width - player.radius; player.vx = -Math.abs(player.vx) * 0.25; }
  if (player.y < player.radius) { player.y = player.radius; player.vy = Math.abs(player.vy) * 0.25; }
  if (player.y > height - player.radius) { player.y = height - player.radius; player.vy = -Math.abs(player.vy) * 0.25; }

  trails.push({ x: player.x, y: player.y, life: 0.22, maxLife: 0.22, size: player.radius * (player.dashFlash > 0 ? 1.1 : 0.62) });
  trails.forEach(t => { t.life -= dt; });
  trails = trails.filter(t => t.life > 0).slice(-24);

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnDebris();
    if (survivalTime > 24 && Math.random() < 0.18) spawnDebris();
    spawnTimer = Math.max(0.19, 0.62 - survivalTime * 0.006) * (0.85 + Math.random() * 0.35);
  }
  powerTimer -= dt;
  if (powerTimer <= 0) {
    spawnPowerUp();
    powerTimer = 7.5 + Math.random() * 4;
  }

  const timeScale = slowTime > 0 ? 0.42 : 1;
  for (const d of debris) {
    d.x += d.vx * dt * timeScale;
    d.y += d.vy * dt * timeScale;
    d.rotation += d.spin * dt * timeScale;

    const distance = Math.hypot(player.x - d.x, player.y - d.y);
    if (!d.near && d.y > player.y - d.radius && distance < player.radius + d.radius + 24 && !circleHit(player, d, 5)) {
      d.near = true;
      combo = Math.min(5, combo + 0.25);
      comboTimer = 2.2;
      score += 35 * combo;
      addMessage("NEAR MISS  +" + Math.round(35 * combo), d.x, d.y, d.color);
      burst(d.x, d.y, d.color, 5, 75);
    }

    if (player.invulnerable <= 0 && circleHit(player, d, 7)) {
      if (shield > 0) {
        shield = 0;
        player.invulnerable = 0.8;
        d.dead = true;
        shake = 10;
        flash = 0.35;
        burst(d.x, d.y, "#25bfff", 28, 280);
        addMessage("SHIELD BROKEN", player.x, player.y - 35, "#25bfff", 1, 16);
      } else {
        endGame();
        break;
      }
    }
  }
  debris = debris.filter(d => !d.dead && d.y < height + d.radius + 50 && d.x > -100 && d.x < width + 100);

  for (const p of powerUps) {
    p.y += p.vy * dt * timeScale;
    p.rotation += dt * 1.7;
    p.pulse += dt * 4;
    if (circleHit(player, p, 1)) {
      p.dead = true;
      if (p.type === "shield") shield = 7;
      if (p.type === "slow") slowTime = 5;
      if (p.type === "double") doubleScore = 6;
      score += 100;
      shake = 3;
      burst(p.x, p.y, powerUpTypes[p.type].color, 20, 190);
      addMessage(powerUpTypes[p.type].name, p.x, p.y - 20, powerUpTypes[p.type].color, 1.1, 17);
    }
  }
  powerUps = powerUps.filter(p => !p.dead && p.y < height + 40);
}

function glow(color, blur = 20) {
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
}

function resetGlow() {
  ctx.shadowBlur = 0;
  ctx.shadowColor = "transparent";
}

function polygon(x, y, radius, sides, rotation) {
  ctx.beginPath();
  if (!sides) {
    ctx.arc(x, y, radius, 0, TAU);
    return;
  }
  for (let i = 0; i < sides; i++) {
    const angle = rotation + i / sides * TAU - Math.PI / 2;
    const px = x + Math.cos(angle) * radius;
    const py = y + Math.sin(angle) * radius;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function drawBackground() {
  const gradient = ctx.createRadialGradient(width / 2, height * 0.55, 0, width / 2, height * 0.55, Math.max(width, height) * 0.75);
  gradient.addColorStop(0, "#090b12");
  gradient.addColorStop(1, "#020203");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = "#fff";
  for (const star of stars) {
    ctx.globalAlpha = star.alpha;
    ctx.fillRect(star.x, star.y, star.size, star.size);
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = "rgba(80, 110, 160, .045)";
  ctx.lineWidth = 1;
  const grid = 64;
  for (let x = (width / 2) % grid; x < width; x += grid) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
  }
  for (let y = (survivalTime * 14) % grid; y < height; y += grid) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
  }
}

function drawDebris(d) {
  ctx.save();
  glow(d.color, 18);
  ctx.fillStyle = d.color;
  polygon(d.x, d.y, d.radius, d.sides, d.rotation);
  ctx.globalAlpha = 0.82;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "rgba(255,255,255,.8)";
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
}

function drawPowerUp(p) {
  const info = powerUpTypes[p.type];
  const pulse = 1 + Math.sin(p.pulse) * 0.09;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rotation);
  glow(info.color, 22);
  ctx.strokeStyle = info.color;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.8;
  ctx.strokeRect(-p.radius * pulse, -p.radius * pulse, p.radius * 2 * pulse, p.radius * 2 * pulse);
  ctx.rotate(-p.rotation);
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#081018";
  ctx.beginPath(); ctx.arc(0, 0, p.radius - 2, 0, TAU); ctx.fill();
  ctx.fillStyle = info.color;
  ctx.font = "bold 12px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(info.label, 0, 1);
  ctx.restore();
}

function drawPlayer() {
  const skin = skins[currentSkin];
  for (const trail of trails) {
    ctx.globalAlpha = Math.max(0, trail.life / trail.maxLife) * 0.25;
    ctx.fillStyle = skin.color;
    ctx.fillRect(trail.x - trail.size / 2, trail.y - trail.size / 2, trail.size, trail.size);
  }
  ctx.globalAlpha = player.invulnerable > 0 && Math.floor(player.invulnerable * 18) % 2 ? 0.3 : 1;
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);
  glow(skin.color, player.dashFlash > 0 ? 36 : 22);
  if (currentSkin === "galaxy") {
    const gradient = ctx.createLinearGradient(-15, -15, 15, 15);
    gradient.addColorStop(0, skin.color);
    gradient.addColorStop(1, skin.accent);
    ctx.fillStyle = gradient;
  } else {
    ctx.fillStyle = skin.color;
  }
  ctx.fillRect(-player.radius, -player.radius, player.radius * 2, player.radius * 2);
  ctx.strokeStyle = skin.accent;
  ctx.lineWidth = 2;
  ctx.strokeRect(-player.radius + 2, -player.radius + 2, player.radius * 2 - 4, player.radius * 2 - 4);
  ctx.fillStyle = "rgba(255,255,255,.75)";
  ctx.fillRect(-6, -10, 12, 4);
  ctx.restore();
  ctx.globalAlpha = 1;

  if (shield > 0) {
    ctx.save();
    glow("#25bfff", 18);
    ctx.strokeStyle = `rgba(37,191,255,${0.62 + Math.sin(survivalTime * 7) * 0.18})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius + 11, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    glow(p.color, 8);
    if (p.streak) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.fillRect(-p.size * 2.5, -p.size / 2, p.size * 5, p.size);
      ctx.restore();
    } else {
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
  resetGlow();
}

function drawBar(x, y, w, label, value, color) {
  ctx.fillStyle = "rgba(255,255,255,.12)";
  ctx.fillRect(x, y, w, 4);
  ctx.fillStyle = color;
  glow(color, 8);
  ctx.fillRect(x, y, w * Math.max(0, Math.min(1, value)), 4);
  resetGlow();
  ctx.fillStyle = "rgba(255,255,255,.62)";
  ctx.font = "bold 10px Arial";
  ctx.textAlign = "left";
  ctx.fillText(label, x, y - 6);
}

function drawHud() {
  const compact = width < 560;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#fff";
  ctx.font = `bold ${compact ? 22 : 26}px Arial`;
  ctx.fillText(String(Math.floor(displayScore)).padStart(6, "0"), 22, 36);
  ctx.fillStyle = "rgba(255,255,255,.52)";
  ctx.font = "bold 10px Arial";
  ctx.fillText("SCORE", 23, 51);
  ctx.fillText("BEST  " + String(highScore).padStart(6, "0"), 22, 70);

  drawBar(22, 94, compact ? 116 : 150, "DASH  " + (player.dashCooldown <= 0 ? "READY" : "RECHARGING"), 1 - player.dashCooldown / 1.15, skins[currentSkin].color);

  let y = 124;
  const buffs = [
    [shield, 7, "SHIELD", "#25bfff"],
    [slowTime, 5, "TIME WARP", "#d861ff"],
    [doubleScore, 6, "DOUBLE SCORE", "#ffe14a"]
  ];
  for (const [time, max, name, color] of buffs) {
    if (time <= 0) continue;
    drawBar(22, y, compact ? 116 : 150, name + "  " + time.toFixed(1) + "s", time / max, color);
    y += 30;
  }

  if (combo > 1) {
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 18px Arial";
    glow("#fff", 12);
    ctx.fillText("×" + combo.toFixed(2), width - 22, 36);
    resetGlow();
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.font = "bold 10px Arial";
    ctx.fillText("NEAR-MISS MULTIPLIER", width - 22, 51);
  }
}

function drawMessages() {
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const m of messages) {
    const alpha = Math.min(1, m.life * 4) * Math.min(1, (m.maxLife - m.life) * 8);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = m.color;
    ctx.font = `bold ${m.size}px Arial`;
    glow(m.color, 12);
    ctx.fillText(m.text, m.x, m.y);
  }
  ctx.globalAlpha = 1;
  resetGlow();
}

function panel(title, subtitle) {
  ctx.fillStyle = "rgba(0,0,0,.58)";
  ctx.fillRect(0, 0, width, height);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff";
  ctx.font = `900 ${Math.min(58, width * 0.105)}px Arial`;
  glow(skins[currentSkin].color, 26);
  ctx.fillText(title, width / 2, height * 0.36);
  resetGlow();
  ctx.fillStyle = skins[currentSkin].color;
  ctx.font = "bold 14px Arial";
  ctx.fillText(subtitle, width / 2, height * 0.36 + 48);
}

function drawOverlay() {
  if (state === "menu") {
    panel("GRAVITY DODGE", "MOVE FAST. MISS CLOSER.");
    ctx.fillStyle = "rgba(255,255,255,.86)";
    ctx.font = "bold 15px Arial";
    ctx.fillText(touchDevice ? "DRAG  ·  MOVE" : "ARROWS / WASD  ·  MOVE", width / 2, height * 0.54);
    ctx.fillText(touchDevice ? "DOUBLE TAP  ·  DASH" : "SHIFT / SPACE  ·  DASH", width / 2, height * 0.54 + 27);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 17px Arial";
    glow("#fff", 12);
    ctx.fillText("PRESS ENTER OR TAP TO START", width / 2, height * 0.54 + 78);
    resetGlow();
    drawSkinPicker(height * 0.82);
  } else if (state === "paused") {
    panel("PAUSED", "PRESS P / ESC OR TAP TO RESUME");
  } else if (state === "gameover") {
    panel("SIGNAL LOST", "FINAL SCORE  " + Math.floor(score));
    ctx.fillStyle = Math.floor(score) >= highScore && score > 0 ? "#ffe14a" : "rgba(255,255,255,.6)";
    ctx.font = "bold 13px Arial";
    ctx.fillText(Math.floor(score) >= highScore && score > 0 ? "NEW HIGH SCORE" : "BEST  " + highScore, width / 2, height * 0.36 + 77);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 17px Arial";
    glow("#fff", 12);
    ctx.fillText("PRESS R / ENTER OR TAP TO RETRY", width / 2, height * 0.36 + 128);
    resetGlow();
    drawSkinPicker(Math.min(height - 52, height * 0.77));
  }
}

function drawSkinPicker(y) {
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(255,255,255,.45)";
  ctx.font = "bold 10px Arial";
  ctx.fillText("SKINS  ·  PRESS 1–5", width / 2, y - 28);
  const gap = Math.min(58, width / 6);
  const start = width / 2 - gap * 2;
  skinKeys.forEach((name, index) => {
    const skin = skins[name];
    const x = start + index * gap;
    const unlocked = highScore >= skin.unlock;
    ctx.globalAlpha = unlocked ? 1 : 0.2;
    ctx.fillStyle = skin.color;
    if (name === currentSkin) glow(skin.color, 18);
    ctx.fillRect(x - 9, y - 9, 18, 18);
    resetGlow();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 9px Arial";
    ctx.fillText(unlocked ? String(index + 1) : String(skin.unlock), x, y + 23);
  });
  ctx.globalAlpha = 1;
}

function draw() {
  drawBackground();
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  debris.forEach(drawDebris);
  powerUps.forEach(drawPowerUp);
  drawParticles();
  if (state !== "gameover" || particles.length < 20) drawPlayer();
  drawMessages();
  ctx.restore();
  if (state === "playing") drawHud();
  drawOverlay();
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.35})`;
    ctx.fillRect(0, 0, width, height);
  }
}

function loop(now) {
  const dt = Math.min(0.033, (now - lastTime) / 1000 || 0);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
