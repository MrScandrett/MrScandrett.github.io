<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#351257"><title>Luna's Little World</title><link rel="stylesheet" href="style.min.css"><style data-a11y-defaults>:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid #1d4ed8!important;outline-offset:2px!important}@media (prefers-reduced-motion:reduce){*,::after,::before{animation-duration:NaNs!important;animation-iteration-count:1!important;transition-duration:NaNs!important;scroll-behavior:auto!important}}</style></head><body><div class="sky-sparkles" aria-hidden="true"></div><main id="virtual-pet-container"><div class="antenna" aria-hidden="true"><span></span></div><header class="game-title"><span class="eyebrow">MY MAGICAL PET</span><h1>Luna's Little World</h1></header><section id="stats" aria-label="Pet needs"><div class="stat" data-stat="hunger"><span class="stat-icon" aria-hidden="true">🍓</span> <span class="stat-copy"><span>Hunger</span><span class="meter"><i></i></span></span> <strong id="hunger">6</strong></div><div class="stat" data-stat="sleepiness"><span class="stat-icon" aria-hidden="true">🌙</span> <span class="stat-copy"><span>Sleepy</span><span class="meter"><i></i></span></span> <strong id="sleepiness">4</strong></div><div class="stat" data-stat="boredom"><span class="stat-icon" aria-hidden="true">⭐</span> <span class="stat-copy"><span>Bored</span><span class="meter"><i></i></span></span> <strong id="boredom">5</strong></div></section><section id="screen" aria-live="polite"><div class="screen-gloss" aria-hidden="true"></div><div class="room" aria-hidden="true"><span class="cloud cloud-one"></span> <span class="cloud cloud-two"></span> <span class="hill hill-back"></span> <span class="hill hill-front"></span> <span class="flower flower-one">✿</span> <span class="flower flower-two">✿</span></div><div id="effect" aria-hidden="true"></div><div id="pet-character"><div class="egg" aria-hidden="true"><span></span></div><img src="assets/luna-kitten.png" alt="Luna, a little purple magical kitten"></div><div class="message-bubble"><p id="message">Choose an activity to hatch your pet!</p></div></section><div class="pet-info"><span><i class="online-dot"></i> LUNA</span> <span>AGE <strong id="age">0</strong></span></div><section id="controls" aria-label="Care for Luna"><button id="feed-btn" type="button"><span aria-hidden="true">🍓</span><b>Feed</b></button> <button id="sleep-btn" type="button"><span aria-hidden="true">🌙</span><b>Sleep</b></button> <button id="play-btn" type="button"><span aria-hidden="true">🧶</span><b>Play</b></button></section><p class="tip">Keep Luna's need bars low to keep her sparkling!</p></main><script src="app.min.js"></script></body></html>
