<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Pixel Universe</title><style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}#ui{position:absolute;top:10px;left:10px;color:#fff;font-family:monospace}#stats{position:absolute;top:34px;left:10px;color:#fff;font-family:monospace;font-size:.9em}</style></head><body><div id="ui">Alive</div><div id="stats">Planets Destroyed: 0 | Best Time: 0s</div><canvas id="universe"></canvas><script>const canvas=document.getElementById("universe");
const ctx=canvas.getContext("2d");
const ui=document.getElementById("ui");
const stats=document.getElementById("stats");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const pixelSize=6;
const combineThreshold=1.5;
const explodeThreshold=4;

let particles=[];
let explosions=[];
let planets=[];
let alive=true;

let planetsDestroyed=0;
let survivalStart=performance.now();
let bestTime=Number(localStorage.getItem("pixelUniverseBestTime"))||0;

let player={
x:canvas.width/2,
y:canvas.height/2,
radius:4,
speed:4
};

let keys={};
let autoSpawnTimer=0;

window.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

window.addEventListener("resize",()=>{
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
});

canvas.addEventListener("click",(e)=>{
if(!alive)return;
spawnParticle(e.clientX,e.clientY);
});

function spawnParticle(x,y){

let dx=canvas.width/2-x;
let dy=canvas.height/2-y;
let len=Math.sqrt(dx*dx+dy*dy);

if(len===0){ dx=1; dy=0; len=1; }

dx/=len;
dy/=len;

particles.push({
x:x,
y:y,
vx:dx*(2+Math.random()*2),
vy:dy*(2+Math.random()*2),
size:1,
color:`hsl(${Math.random()*360},100%,60%)`
});
}

function spawnPlanet(){
planets.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
radius:50
});
}

for(let i=0;i<3;i++)spawnPlanet();
updateStats();
// IDEA: give the player a small speed boost or bigger radius for every few
// planets destroyed, so late-game survival feels different from the start.

function distance(x1,y1,x2,y2){
let dx=x1-x2;
let dy=y1-y2;
return Math.sqrt(dx*dx+dy*dy);
}

function createExplosion(x,y,amount=30){
for(let i=0;i<amount;i++){
explosions.push({
x,y,
vx:(Math.random()-0.5)*10,
vy:(Math.random()-0.5)*10,
life:40
});
}
}

function updateStats(){
stats.textContent=`Planets Destroyed: ${planetsDestroyed} | Best Time: ${bestTime.toFixed(1)}s`;
}

function resetGame(){
alive=false;
ui.textContent="You Died - Restarting...";

const survived=(performance.now()-survivalStart)/1000;
if(survived>bestTime){
bestTime=survived;
localStorage.setItem("pixelUniverseBestTime",bestTime);
}
updateStats();

createExplosion(player.x,player.y,60);

setTimeout(()=>{
particles=[];
explosions=[];
planets=[];
for(let i=0;i<3;i++)spawnPlanet();

player.x=canvas.width/2;
player.y=canvas.height/2;

survivalStart=performance.now();
alive=true;
ui.textContent="Alive";
},1500);
}

function update(){

if(!alive)return;

if(keys["w"])player.y-=player.speed;
if(keys["s"])player.y+=player.speed;
if(keys["a"])player.x-=player.speed;
if(keys["d"])player.x+=player.speed;

/* AUTO CLICKERS (TWO CORNERS) */

autoSpawnTimer++;

if(autoSpawnTimer>70){   // slow spawn
autoSpawnTimer=0;

spawnParticle(0,0); // top-left
spawnParticle(canvas.width,canvas.height); // bottom-right

}

/* PLAYER VS PLANETS */

for(let pl of planets){

let dx=player.x-pl.x;
let dy=player.y-pl.y;
let dist=Math.sqrt(dx*dx+dy*dy);

if(dist<player.radius+pl.radius&&dist>0){

let overlap=(player.radius+pl.radius)-dist;

let nx=dx/dist;
let ny=dy/dist;

player.x+=nx*overlap;
player.y+=ny*overlap;

}

}

/* PARTICLE MOVE */

for(let pIndex=particles.length-1;pIndex>=0;pIndex--){

let p=particles[pIndex];

p.x+=p.vx;
p.y+=p.vy;

if(p.x<0||p.x>canvas.width)p.vx*=-1;
if(p.y<0||p.y>canvas.height)p.vy*=-1;

let dx=(p.x+(pixelSize*p.size)/2)-player.x;
let dy=(p.y+(pixelSize*p.size)/2)-player.y;
let dist=Math.sqrt(dx*dx+dy*dy);

if(dist<player.radius+(pixelSize*p.size)/2){
resetGame();
break;
}

for(let i=planets.length-1;i>=0;i--){

let pl=planets[i];

if(distance(p.x,p.y,pl.x,pl.y)<pl.radius){

pl.radius-=pixelSize;

createExplosion(p.x,p.y,10);

particles.splice(pIndex,1);

if(pl.radius<=player.radius){

createExplosion(pl.x,pl.y,100);
planets.splice(i,1);
planetsDestroyed++;
updateStats();

}

break;

}

}

}

/* PARTICLE VS PARTICLE */

for(let i=0;i<particles.length;i++){
for(let j=i+1;j<particles.length;j++){

let a=particles[i];
let b=particles[j];

if(distance(a.x,a.y,b.x,b.y)<pixelSize*(a.size+b.size)){

let speedA=Math.sqrt(a.vx*a.vx+a.vy*a.vy);
let speedB=Math.sqrt(b.vx*b.vx+b.vy*b.vy);

let impact=speedA+speedB;

if(impact>explodeThreshold){

createExplosion((a.x+b.x)/2,(a.y+b.y)/2,40);

particles.splice(j,1);
particles.splice(i,1);

i--;
break;

}

else if(impact<combineThreshold){

a.size+=b.size;
a.vx*=0.7;
a.vy*=0.7;

particles.splice(j,1);
j--;

}

else{

let tempvx=a.vx;
let tempvy=a.vy;

a.vx=b.vx;
a.vy=b.vy;

b.vx=tempvx;
b.vy=tempvy;

}

}

}
}

/* EXPLOSIONS */

for(let i=explosions.length-1;i>=0;i--){

let e=explosions[i];

e.x+=e.vx;
e.y+=e.vy;

e.life--;

if(e.life<=0)explosions.splice(i,1);

}

}

function draw(){

ctx.fillStyle="black";
ctx.fillRect(0,0,canvas.width,canvas.height);

/* PLANETS */

for(let pl of planets){

ctx.beginPath();
ctx.arc(pl.x,pl.y,pl.radius,0,Math.PI*2);
ctx.fillStyle="blue";
ctx.fill();

}

/* PARTICLES */

for(let p of particles){

ctx.fillStyle=p.color;
ctx.fillRect(p.x,p.y,pixelSize*p.size,pixelSize*p.size);

}

/* PLAYER PIXEL BALL */

if(alive){

ctx.fillStyle="white";

for(let y=-player.radius;y<=player.radius;y++){
for(let x=-player.radius;x<=player.radius;x++){

if(x*x+y*y<=player.radius*player.radius){

ctx.fillRect(player.x+x,player.y+y,1,1);

}

}
}

}

/* EXPLOSIONS */

ctx.fillStyle="orange";

for(let e of explosions){
ctx.fillRect(e.x,e.y,4,4);
}

}

function animate(){
update();
draw();
requestAnimationFrame(animate);
}

animate();</script><script>window.__TOUCH_CONTROLS__={"landscape":true,"clusters":[{"side":"left","pad":{"up":"KeyW","down":"KeyS","left":"KeyA","right":"KeyD"}}]}</script><script>(function(){"use strict";var m=window.__TOUCH_CONTROLS__;if(!m)return;var v={ArrowUp:["ArrowUp",38],ArrowDown:["ArrowDown",40],ArrowLeft:["ArrowLeft",37],ArrowRight:["ArrowRight",39],Space:[" ",32],Enter:["Enter",13],Escape:["Escape",27],ShiftLeft:["Shift",16],ShiftRight:["Shift",16],Tab:["Tab",9],Backspace:["Backspace",8]};function k(e){if(v[e])return{code:e,key:v[e][0],keyCode:v[e][1]};if(/^Key[A-Z]$/.test(e)){var t=e.slice(3);return{code:e,key:t.toLowerCase(),keyCode:t.charCodeAt(0)}}if(/^Digit[0-9]$/.test(e)){var i=e.slice(5);return{code:e,key:i,keyCode:i.charCodeAt(0)}}return{code:e,key:e,keyCode:0}}function h(e,t){var i=document.body||document.documentElement,d=new KeyboardEvent(e,{key:t.key,code:t.code,bubbles:!0,cancelable:!0});try{Object.defineProperty(d,"keyCode",{get:function(){return t.keyCode}}),Object.defineProperty(d,"which",{get:function(){return t.keyCode}})}catch{}i.dispatchEvent(d)}function C(){return window.matchMedia&&window.matchMedia("(pointer: coarse)").matches}function L(){if(!C())return"desktop";var e=Math.min(window.innerWidth,window.innerHeight);return e>=700?"tablet":"phone"}var A=[".tc-root{position:fixed;inset:0;z-index:2147483000;pointer-events:none;","font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;","padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))"," max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));}",".tc-root[hidden]{display:none}",".tc-cluster{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));","display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}",".tc-cluster.tc-left{left:max(14px,env(safe-area-inset-left))}",".tc-cluster.tc-right{right:max(14px,env(safe-area-inset-right))}",".tc-label{font:700 11px/1 system-ui,sans-serif;letter-spacing:
