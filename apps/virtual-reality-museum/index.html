<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virtual Reality Museum · Mr. Scandrett's ClassroomOS</title>
    <meta name="description" content="Explore the Virtual Reality Museum. View 3D artifacts, landmarks, and animals at human scale in VR, AR, and desktop browsers." />
    <meta name="theme-color" content="#1f2937" />

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #1f2937;
        color: #fff;
      }

      a-scene {
        width: 100%;
        height: 100%;
      }

      #vr-toggle {
        position: fixed;
        bottom: 30px;
        right: 30px;
        padding: 12px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s;
      }

      #vr-toggle:hover {
        transform: scale(1.05);
      }

      #vr-toggle:active {
        transform: scale(0.95);
      }

      #info-panel {
        position: fixed;
        top: 20px;
        left: 20px;
        max-width: 350px;
        background: rgba(31, 41, 55, 0.95);
        padding: 20px;
        border-radius: 8px;
        border-left: 4px solid #667eea;
        z-index: 20;
        backdrop-filter: blur(8px);
        display: none;
      }

      #info-panel.show {
        display: block;
      }

      #info-panel h2 {
        margin-bottom: 8px;
        font-size: 18px;
        color: #667eea;
      }

      #info-panel .student {
        font-size: 14px;
        color: #9ca3af;
        margin-bottom: 8px;
      }

      #info-panel .description {
        font-size: 13px;
        line-height: 1.5;
        color: #d1d5db;
      }

      #info-panel .type {
        display: inline-block;
        margin-top: 12px;
        padding: 4px 8px;
        background: rgba(102, 126, 234, 0.2);
        border-radius: 4px;
        font-size: 12px;
        color: #667eea;
        font-weight: 500;
      }

      #navigation-help {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(31, 41, 55, 0.95);
        padding: 15px 20px;
        border-radius: 8px;
        font-size: 13px;
        color: #d1d5db;
        z-index: 20;
        max-width: 280px;
        backdrop-filter: blur(8px);
      }

      #navigation-help h3 {
        color: #667eea;
        margin-bottom: 10px;
        font-size: 14px;
      }

      #navigation-help p {
        margin: 6px 0;
        line-height: 1.4;
      }

      #upload-button {
        position: fixed;
        bottom: 30px;
        left: 30px;
        padding: 12px 20px;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-decoration: none;
        display: inline-block;
        transition: transform 0.2s;
      }

      #upload-button:hover {
        transform: scale(1.05);
      }

      #upload-button:active {
        transform: scale(0.95);
      }

      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 30;
      }

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loading p {
        color: #d1d5db;
        font-size: 14px;
      }

      .empty-museum {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 25;
        color: #d1d5db;
      }

      .empty-museum h2 {
        font-size: 24px;
        margin-bottom: 10px;
        color: #667eea;
      }

      .empty-museum p {
        margin-bottom: 20px;
      }

      .empty-museum a {
        display: inline-block;
        padding: 10px 20px;
        background: #667eea;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        transition: background 0.2s;
      }

      .empty-museum a:hover {
        background: #5a67d8;
      }

      /* Mobile adjustments */
      @media (max-width: 768px) {
        #info-panel {
          max-width: 100%;
          left: 10px;
          right: 10px;
          top: 10px;
        }

        #navigation-help {
          max-width: 100%;
          right: 10px;
          top: 10px;
          font-size: 12px;
          padding: 10px 15px;
        }

        #vr-toggle,
        #upload-button {
          padding: 10px 16px;
          font-size: 12px;
          bottom: 20px;
        }

        #upload-button {
          left: 20px;
        }

        #vr-toggle {
          right: 20px;
        }
      }
    </style>
  </head>

  <body>
    <!-- A-Frame scene -->
    <a-scene physics="gravity: 0; debug: false" background="color: #0f172a" fog="type: linear; color: #0f172a; near: 20; far: 60">
      <!-- Museum sky (deep neutral) -->
      <a-sky color="#1e293b"></a-sky>

      <!-- Lighting: soft ambient + directional key + warm fill -->
      <a-light type="ambient" color="#cbd5e1" intensity="0.5"></a-light>
      <a-light type="directional" color="#fff" intensity="0.7" position="8 15 6" light="castShadow: true"></a-light>
      <a-light type="point" color="#fbbf24" intensity="0.3" position="0 6 0" light="distance: 20; decay: 2"></a-light>

      <!-- Marble-look gallery floor -->
      <a-plane
        id="ground"
        position="0 0 0"
        rotation="-90 0 0"
        width="100"
        height="100"
        color="#e2e8f0"
        material="roughness: 0.5; metalness: 0.1"
        shadow="cast: false; receive: true"
      ></a-plane>

      <!-- Subtle floor accent -->
      <a-entity position="0 0.01 0" rotation="-90 0 0">
        <a-plane width="100" height="100" color="#94a3b8" opacity="0.15"></a-plane>
      </a-entity>

      <!-- Camera positioned at human eye height (1.6m) -->
      <a-camera position="0 1.6 8" look-controls wasd-controls="acceleration: 50">
        <a-cursor color="#667eea" fuse="true" fuseTimeout="2000"></a-cursor>
      </a-camera>

      <!-- Model container for dynamically loaded models -->
      <a-entity id="model-container" position="0 0 0"></a-entity>
    </a-scene>

    <!-- Info panel for selected model -->
    <div id="info-panel">
      <h2 id="model-title">Museum</h2>
      <div class="student" id="model-student"></div>
      <div class="description" id="model-description"></div>
      <span class="type" id="model-type"></span>
    </div>

    <!-- Navigation help -->
    <div id="navigation-help">
      <h3>🧭 Navigation</h3>
      <p><strong>Desktop:</strong> WASD to move, mouse to look</p>
      <p><strong>Mobile:</strong> Touch to move, gyro to look</p>
      <p><strong>VR:</strong> Use controllers to teleport</p>
      <p style="margin-top: 10px; font-size: 12px; color: #6b7280;">
        Click a model to see details
      </p>
    </div>

    <!-- Upload button -->
    <a href="/lessons/virtual-reality-museum-upload.html" id="upload-button">➕ Add Your Model</a>

    <!-- VR toggle button -->
    <button id="vr-toggle">🥽 Enter VR</button>

    <!-- Loading indicator -->
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <p>Loading Museum...</p>
    </div>

    <!-- Empty museum message -->
    <div class="empty-museum" id="empty-museum" style="display: none;">
      <h2>Virtual Reality Museum</h2>
      <p>No artifacts yet.</p>
      <a href="/lessons/virtual-reality-museum-upload.html">Be the first to upload!</a>
    </div>

    <script src="./viewer.js?v=3"></script>
  </body>
</html>
