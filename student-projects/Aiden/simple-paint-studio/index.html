<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Paint Studio</title>
    <link rel="stylesheet" href="/assets/css/creation-app.css">
    <!-- Linking the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="paint-app" data-creation-app data-creation-fit>
        <div class="paint-workspace" data-creation-primary>
            <div class="toolbar">
                <label>Color: <input type="color" id="colorPicker" value="#000000"></label>
                <label>Size: <input type="range" id="brushSize" min="1" max="40" value="5"></label>
                <button id="eraserBtn" class="tool-btn" aria-pressed="false">Eraser</button>
                <button id="saveBtn" class="tool-btn">Save PNG</button>
                <button id="clearBtn">Clear Canvas</button>
            </div>

            <canvas id="paintCanvas" width="800" height="500"></canvas>
        </div>
    </main>

    <!-- Linking the external JS file -->
    <script src="script.js"></script>
    <script src="/assets/js/creation-app.js"></script>
</body>
</html>
