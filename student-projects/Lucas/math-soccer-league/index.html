<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Soccer League</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="score-panel" aria-label="Scoreboard">
      <div>
        <p class="eyebrow">Math Soccer League</p>
        <h1>Score goals with correct answers</h1>
      </div>
      <div class="scoreboard">
        <div>
          <span class="score-label">You</span>
          <strong id="playerScore">0</strong>
        </div>
        <span class="score-divider">-</span>
        <div>
          <span class="score-label">AI</span>
          <strong id="aiScore">0</strong>
        </div>
      </div>
    </section>

    <section id="setupScreen" class="setup-screen">
      <div class="field-preview" aria-hidden="true">
        <div class="goal-net left"></div>
        <div class="center-circle"></div>
        <div class="ball"></div>
        <div class="goal-net right"></div>
      </div>

      <div class="setup-panel">
        <h2>Choose AI difficulty</h2>
        <div class="difficulty-grid">
          <button class="difficulty-card" data-difficulty="beginner">
            <strong>Beginner</strong>
            <span>Slower AI, smaller numbers</span>
          </button>
          <button class="difficulty-card" data-difficulty="intermediate">
            <strong>Intermediate</strong>
            <span>Balanced pace and bigger numbers</span>
          </button>
          <button class="difficulty-card" data-difficulty="pro">
            <strong>Pro</strong>
            <span>Fast AI and tougher division</span>
          </button>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="game-screen hidden">
      <div class="match-status">
        <div>
          <span>Level</span>
          <strong id="levelText">1 / 20</strong>
        </div>
        <div>
          <span>Difficulty</span>
          <strong id="difficultyText">Beginner</strong>
        </div>
        <div>
          <span>AI chance</span>
          <strong id="aiChanceText">Low</strong>
        </div>
      </div>

      <div class="pitch" aria-label="Soccer field">
        <div class="goal-box goal-box-left"></div>
        <div class="midline"></div>
        <div class="pitch-circle"></div>
        <div id="shotBall" class="shot-ball"></div>
      </div>

      <div class="question-card">
        <p id="feedbackText" class="feedback">Answer to take your shot.</p>
        <h2 id="questionText">2 + 2 = ?</h2>
        <form id="answerForm" class="answer-form">
          <input id="answerInput" type="number" inputmode="numeric" autocomplete="off" aria-label="Answer" required>
          <button type="submit">Shoot</button>
        </form>
      </div>
    </section>

    <section id="resultScreen" class="result-screen hidden">
      <h2 id="resultTitle">Full time!</h2>
      <p id="resultMessage"></p>
      <button id="playAgainButton">Play again</button>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
