<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Tetris</title><link rel="stylesheet" href="style.css"></head><body>
<div class="vaporwave-bg">
  <div class="stars"></div>
  <div class="sun"></div>
  <div class="grid-floor"></div>
  <div class="hold-tint"></div>
  <div class="scanlines"></div>
</div>
<div class="container">
  <div class="sidebar sidebar-left">
    <h3>Hold</h3>
    <canvas id="hold" width="80" height="80"></canvas>
    <div class="buttons"><button id="holdBtn">Hold (C)</button></div>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="240" height="480"></canvas>
    <canvas id="fx" width="240" height="480"></canvas>
  </div>
  <div class="sidebar">
    <h1>TETRIS</h1>
    <div class="stat">Score: <span id="score">0</span></div>
    <div class="stat">Level: <span id="level">1</span></div>
    <div class="stat">Lines: <span id="lines">0</span></div>
    <div class="buttons"><button id="startBtn">Start</button> <button id="pauseBtn">Pause</button> <button id="resetBtn">Reset</button></div>
    <h3>Next</h3>
    <canvas id="next" width="80" height="80"></canvas>
    <p class="hint">Controls: ← → ↓ | Rotate: Up / X | Space: Hard drop | C: Hold | P: Pause</p>
  </div>
</div>
<script src="script.js"></script></body></html>
