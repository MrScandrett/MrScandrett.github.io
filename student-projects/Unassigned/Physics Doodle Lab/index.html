<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics Doodle Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Physics Doodle Lab</h1>
        <p>Draw, drop, bounce, and explore.</p>
      </div>
      <div class="stats" aria-live="polite">
        <span id="shapeCount">0 shapes</span>
        <span id="energyLabel">calm</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Drawing controls">
      <div class="tool-group" role="group" aria-label="Tool">
        <button class="tool active" data-tool="ball" type="button">Circle</button>
        <button class="tool" data-tool="box" type="button">Block</button>
        <button class="tool" data-tool="wall" type="button">Ramp</button>
      </div>

      <label>
        Gravity
        <input id="gravity" type="range" min="0" max="1.6" step="0.05" value="0.65">
      </label>

      <label>
        Bounce
        <input id="bounce" type="range" min="0.2" max="0.95" step="0.05" value="0.72">
      </label>

      <label>
        Size
        <input id="size" type="range" min="14" max="54" step="2" value="30">
      </label>

      <button id="pause" type="button">Pause</button>
      <button id="shake" type="button">Shake</button>
      <button id="clear" type="button">Clear</button>
    </section>

    <section class="stage-wrap" aria-label="Physics drawing area">
      <canvas id="stage"></canvas>
      <div class="hint" id="hint">Click or drag to make shapes. Choose Ramp to draw platforms.</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
