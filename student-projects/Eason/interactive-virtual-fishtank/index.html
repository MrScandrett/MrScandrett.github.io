<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Virtual Fishtank</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .tank-wrapper {
            text-align: center;
        }

        h1 {
            color: #e2f1af;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(226, 241, 175, 0.5);
            font-size: 24px;
        }

        /* The Aquarium Tank */
        .aquarium {
            position: relative;
            width: 800px;
            height: 450px;
            background: linear-gradient(180deg, #0a58ca 0%, #042864 70%, #021330 100%);
            border: 12px solid #333;
            border-bottom: 20px solid #222;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 
                        inset 0 0 50px rgba(0, 212, 255, 0.4);
            overflow: hidden;
        }

        /* Glass Reflection Effect */
        .aquarium::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%);
            pointer-events: none;
            z-index: 10;
        }

        /* Water Bubbles Animation */
        .bubble {
            position: absolute;
            bottom: -20px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-500px) translateX(var(--wobble));
                opacity: 0;
            }
        }

        /* Seabed Decorations */
        .seabed {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25px;
            background: #d2b48c;
            border-top: 3px solid #c2a47c;
            z-index: 2;
        }

        .sand-mound {
            position: absolute;
            bottom: 10px;
            background: #d2b48c;
            border-radius: 50%;
        }

        /* Dynamic Fish Styling */
        .fish {
            position: absolute;
            width: 60px;
            height: 35px;
            cursor: pointer;
            user-select: none;
            z-index: 5;
            transition: transform 0.2s ease;
        }

        /* Procedural CSS Fish Drawing */
        .fish-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: inherit;
            border-radius: 50% 50% 50% 50%;
        }

        .fish-tail {
            position: absolute;
            right: -15px;
            top: 5px;
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-right: 20px solid;
            border-right-color: inherit;
        }

        .fish-eye {
            position: absolute;
            left: 10px;
            top: 8px;
            width: 6px;
            height: 6px;
            background-color: #fff;
            border-radius: 50%;
        }

        .fish-eye::after {
            content: '';
            position: absolute;
            left: 1px;
            top: 1px;
            width: 3px;
            height: 3px;
            background-color: #000;
            border-radius: 50%;
        }

        /* Swimming Tail-Wag Animation */
        .fish.swimming .fish-tail {
            animation: wag 0.15s infinite alternate ease-in-out;
            transform-origin: left center;
        }

        @keyframes wag {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(15deg); }
        }

        /* Instruction text */
        .controls {
            margin-top: 15px;
            color: #8fa0c0;
            font-size: 14px;
        }
        
        button {
            background-color: #0a58ca;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }
        
        button:hover {
            background-color: #042864;
        }
    </style>
</head>
<body>

    <div class="tank-wrapper">
        <h1>HTML5 Virtual Aquarium</h1>
        
        <div class="aquarium" id="tank">
            <!-- Decorative Seabed -->
            <div class="seabed"></div>
            <div class="sand-mound" style="width: 150px; height: 60px; left: 50px; bottom: -20px;"></div>
            <div class="sand-mound" style="width: 200px; height: 80px; right: 80px; bottom: -30px;"></div>
        </div>

        <div class="controls">
            <button id="addFishBtn">Add a Fish</button>
            <span>Click on the tank or tap a fish to scare it!</span>
        </div>
    </div>

    <script>
        const tank = document.getElementById('tank');
        const addFishBtn = document.getElementById('addFishBtn');
        
        // Configuration boundaries for fish movement
        const tankWidth = 800 - 24; // accounting for borders
        const tankHeight = 450 - 32;
        const fishArray = [];

        // Vibrant tropical fish color palette
        const colors = ['#ff5722', '#ffeb3b', '#e91e63', '#00e676', '#00b0ff', '#aa00ff', '#ff9100'];

        class Fish {
            constructor() {
                this.element = document.createElement('div');
                this.element.className = 'fish swimming';
                
                // Build HTML fish structure
                const body = document.createElement('div');
                body.className = 'fish-body';
                const tail = document.createElement('div');
                tail.className = 'fish-tail';
                const eye = document.createElement('div');
                eye.className = 'fish-eye';
                
                this.element.appendChild(body);
                this.element.appendChild(tail);
                this.element.appendChild(eye);

                // Randomized traits
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.element.style.color = this.color; // Tail uses inherit border color
                body.style.backgroundColor = this.color;
                
                // Scale variations (small, medium, large fish)
                this.scale = 0.6 + Math.random() * 0.8;
                this.width = 60 * this.scale;
                this.height = 35 * this.scale;
                this.element.style.width = `${this.width}px`;
                this.element.style.height = `${this.height}px`;

                // Set initial random physics
                this.x = Math.random() * (tankWidth - this.width);
                this.y = Math.random() * (tankHeight - this.height - 40); // stay off very bottom
                this.speedX = (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1);
                this.speedY = (Math.random() * 1 - 0.5);

                // Render into DOM
                tank.appendChild(this.element);

                // Add tap event interaction
                this.element.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    this.scare();
                });
            }

            update() {
                // Advance position coordinates
                this.x += this.speedX;
                this.y += this.speedY;

                // Handle Left/Right wall collision bounds
                if (this.x <= 0) {
                    this.x = 0;
                    this.speedX *= -1;
                } else if (this.x >= tankWidth - this.width) {
                    this.x = tankWidth - this.width;
                    this.speedX *= -1;
                }

                // Handle Top/Bottom collision bounds
                if (this.y <= 0) {
                    this.y = 0;
                    this.speedY *= -1;
                } else if (this.y >= tankHeight - this.height - 30) {
                    this.y = tankHeight - this.height - 30;
                    this.speedY *= -1;
                }

                // Apply updates to DOM styles with CSS flip transform based on heading direction
                const directionFlip = this.speedX > 0 ? 'scaleX(-1)' : 'scaleX(1)';
                this.element.style.transform = `translate(${this.x}px, ${this.y}px) ${directionFlip}`;
            }

            scare() {
                // Suddenly boost speed away
                this.speedX *= -2.5;
                this.speedY = (Math.random() - 0.5) * 6;
                
                // Clamp maximum erratic burst speed
                if (Math.abs(this.speedX) > 8) this.speedX = 8 * Math.sign(this.speedX);

                // Gradually cool down speed back to normal after 1 second
                setTimeout(() => {
                    this.speedX = (Math.random() * 2 + 1) * Math.sign(this.speedX);
                    this.speedY = (Math.random() * 1 - 0.5);
                }, 1000);
            }
        }

        // Generate ambient water bubbles
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = 4 + Math.random() * 10;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * (tankWidth - size)}px`;
            bubble.style.setProperty('--wobble', `${-20 + Math.random() * 40}px`);
            bubble.style.animationDuration = `${3 + Math.random() * 4}s`;
            tank.appendChild(bubble);
            bubble.addEventListener('animationend', () => bubble.remove());
        }

        function addFish() {
            if (fishArray.length >= 20) return;
            fishArray.push(new Fish());
        }

        addFishBtn.addEventListener('click', addFish);
        tank.addEventListener('mousedown', (event) => {
            if (event.target === tank) fishArray.forEach((fish) => fish.scare());
        });

        for (let index = 0; index < 7; index += 1) addFish();
        window.setInterval(createBubble, 550);

        function animate() {
            fishArray.forEach((fish) => fish.update());
            window.requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
