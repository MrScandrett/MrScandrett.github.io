<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>One More Rally</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="stage-panel" aria-label="One More Rally game">
        <div class="hud">
          <div>
            <span class="label">Level</span>
            <strong id="levelText">1 / 100</strong>
          </div>
          <div>
            <span class="label">Rally Goal</span>
            <strong id="goalText">3</strong>
          </div>
          <div>
            <span class="label">Kindness</span>
            <strong id="scoreText">0</strong>
          </div>
        </div>

        <canvas id="game" width="960" height="540" aria-label="Pong game board"></canvas>

        <div class="message-card" id="messageCard">
          <p class="eyebrow" id="chapterText">Chapter 1</p>
          <h1 id="titleText">One More Rally</h1>
          <p id="storyText">
            Keep the ball in play and send little lights across the night sky.
          </p>
          <button id="startButton" type="button">Start Level</button>
        </div>
      </section>

      <aside class="control-panel" aria-label="Game controls and progress">
        <div class="brand">
          <p class="eyebrow">Classic paddle rally</p>
          <h2>One More Rally</h2>
        </div>

        <div class="stat-grid">
          <div>
            <span class="label">Lives</span>
            <strong id="livesText">5</strong>
          </div>
          <div>
            <span class="label">Best Level</span>
            <strong id="bestText">1</strong>
          </div>
        </div>

        <label class="toggle-row">
          <input id="assistToggle" type="checkbox" checked>
          <span>Helper paddle for younger players</span>
        </label>

        <div class="controls">
          <button id="pauseButton" type="button">Pause</button>
          <button id="restartButton" type="button">Restart</button>
        </div>

        <div class="progress-wrap">
          <div class="progress-header">
            <span>Memory Lights</span>
            <span id="percentText">1%</span>
          </div>
          <div class="progress-track">
            <div id="progressBar"></div>
          </div>
        </div>

        <p class="help">
          Move with mouse, touch, arrow keys, or W/S. Win each level by completing the rally goal.
        </p>
      </aside>
    </main>

    <script src="game.js"></script>
  </body>
</html>
