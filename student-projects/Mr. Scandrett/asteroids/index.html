<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Vector Rocks (1979)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <h1>☄️ Vector Rocks (1979)</h1>
  <p class="subtitle">A tribute to 1979's Atari classic. Blast the rocks, dodge the shards, watch out for the saucer.</p>
  <div class="scoreboard">
    <div class="score"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="score"><span class="label">Lives</span><span class="value" id="lives">3</span></div>
    <div class="score"><span class="label">Wave</span><span class="value" id="wave">1</span></div>
  </div>
  <canvas id="game" width="800" height="600"></canvas>
  <div class="controls">
    <div class="controls-col"><kbd>&larr;</kbd><kbd>&rarr;</kbd> rotate &nbsp; <kbd>&uarr;</kbd> thrust &nbsp; <kbd>SPACE</kbd> fire &nbsp; <kbd>SHIFT</kbd> hyperspace</div>
    <button id="startBtn">Start Game</button>
  </div>
  <div class="hint">Tip: momentum carries between frames &mdash; ease off the thrust before you need to stop.</div>
</div>
<script src="script.js"></script>
</body>
</html>
