<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mechaterra</title>
    <link rel="stylesheet" href="src/styles.css?v=4">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  </head>
  <body>
    <main class="shell">
      <section id="setup" class="setup-panel">
        <div class="brand">
          <span>Mechaterra</span>
          <strong>3D terrain warfare</strong>
        </div>

        <div class="setup-grid">
          <label>
            Team Alpha
            <input id="teamAColor" type="color" value="#d93434">
          </label>
          <label>
            Team Vector
            <input id="teamBColor" type="color" value="#2788ff">
          </label>
          <label>
            AI Difficulty
            <select id="difficulty">
              <option value="easy">Easy</option>
              <option value="normal" selected>Normal</option>
              <option value="hard">Hard</option>
            </select>
          </label>
          <label>
            Score Target
            <input id="scoreTarget" type="number" min="3" max="20" value="7">
          </label>
        </div>

        <button id="startButton" class="primary-button">Start Match</button>
      </section>

      <canvas id="game" width="1280" height="720"></canvas>

      <section class="moves-panel" aria-label="Controls">
        <div><kbd>A</kbd><kbd>D</kbd><span>Stride</span></div>
        <div><kbd>W</kbd><kbd>Space</kbd><span>Jump</span></div>
        <div><kbd>Shift</kbd><span>Jet glide</span></div>
        <div><kbd>Mouse</kbd><span>Aim / fire</span></div>
        <div><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><span>Powers</span></div>
      </section>

      <section class="hud">
        <div>
          <span id="roundLabel">Round 1</span>
          <strong id="scoreLabel">0 - 0</strong>
        </div>
        <div>
          <span id="statusLabel">Configure match</span>
          <strong id="weaponLabel">Grav Well</strong>
        </div>
        <div class="meter">
          <span>Core</span>
          <i id="healthFill"></i>
        </div>
        <div class="meter">
          <span>Jetpack</span>
          <i id="fuelFill"></i>
        </div>
      </section>
    </main>

    <script type="module" src="src/game.js?v=4"></script>
  </body>
</html>
