<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Shark Escape - 2026 Edition</title>
    <!-- Linking the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- Game Interface -->
        <div id="ui">
            <div id="score">Score: 0</div>
            
            <!-- Speed Adjustment Control -->
            <div id="settings">
                <label for="speedSlider">Shark Speed</label>
                <input type="range" id="speedSlider" min="0" max="15" value="0">
            </div>

            <!-- Game Over Screen (Hidden by default) -->
            <div id="game-over" class="hidden">
                <h1>CHOMPED!</h1>
                <p>The sharks got you.</p>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>

        <!-- The actual game screen -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Linking the JavaScript logic -->
    <script src="script.js"></script>
</body>
</html>
