<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Virtual Pet</title>
    <!-- Link to your CSS file for styling the shell and pet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="virtual-pet-container">
        <h1>My Virtual Pet</h1>
        
        <!-- Status Bars -->
        <div id="stats">
            <div class="stat">Hunger: <span id="hunger">10</span>/10</div>
            <div class="stat">Sleepiness: <span id="sleepiness">10</span>/10</div>
            <div class="stat">Boredom: <span id="boredom">10</span>/10</div>
            <div class="stat">Age: <span id="age">0</span></div>
        </div>

        <!-- Digital Screen Area -->
        <div id="screen">
            <!-- Your pet character (can be an image or SVG) -->
            <div id="pet-character">🥚</div>
            <p id="message">Hatch your pet!</p>
        </div>

        <!-- Controls -->
        <div id="controls">
            <button id="feed-btn">Feed</button>
            <button id="sleep-btn">Sleep</button>
            <button id="play-btn">Play</button>
        </div>
    </div>

    <!-- Link to your JavaScript for game logic -->
    <script src="script.js"></script>
</body>
</html>
