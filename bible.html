<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Bible · Mr. Scandrett's ClassroomOS</title>
  <meta name="description" content="Read all 66 books of the Bible in the BSB, KJV or ASV, track your progress chapter by chapter, and start each day with the verse of the day." />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="stylesheet" href="assets/css/classroom-home.css" />
  <link rel="stylesheet" href="assets/css/reader-fonts.css" />
  <link rel="stylesheet" href="assets/css/pages/bible.css" />
  <script>
    try {
      var d = document.documentElement;
      var m = localStorage.getItem('reader:mode');
      if (m) d.dataset.readerMode = m;
      var s = Number(localStorage.getItem('bible:size'));
      if (s) d.style.setProperty('--bb-scale', s / 100);
      d.dataset.bibleLayout = localStorage.getItem('bible:layout') || 'auto';
      var h = localStorage.getItem('bible:highlight');
      if (h) d.dataset.highlight = h;
      var f = localStorage.getItem('bible:face');
      if (f) d.dataset.bibleFace = f;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="bb-skip" href="#bbMain">Skip to content</a>

  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="index.html">Mr. Scandrett's ClassroomOS</a>
      <nav class="site-nav" aria-label="Primary">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="steam-lessons.html">Lessons</a></li>
          <li><a href="paths.html">Paths</a></li>
          <li><a href="showcase.html">Showcase</a></li>
          <li><a href="applications.html">Apps</a></li>
          <li><a href="library.html" aria-current="page">Library</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <header class="bb-bar">
    <a class="bb-btn bb-back" href="library.html#section-classics" aria-label="Back to the library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg><span>Library</span>
    </a>
    <a class="bb-brand" href="bible.html#/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3M12 6.5v6M9.5 9h5" /></svg>
      <span>The Bible</span>
    </a>
    <div class="bb-tools">
      <div class="bb-seg bb-tr" id="bbTr" role="group" aria-label="Translation"></div>
      <button type="button" class="bb-btn" id="bbDisplayBtn" aria-controls="bbDisplay" aria-expanded="false" title="Display settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l5-14h1l5 14M6.5 13h7M17 19l2.5-7 2.5 7M18 17h3" /></svg><span>Display</span>
      </button>
    </div>
  </header>

  <div class="bb-display" id="bbDisplay" role="region" aria-label="Display settings" hidden>
    <fieldset>
      <legend>Page</legend>
      <div class="bb-seg" role="group">
        <button type="button" data-mode="paper" aria-pressed="false">Paper</button>
        <button type="button" data-mode="sepia" aria-pressed="false">Sepia</button>
        <button type="button" data-mode="night" aria-pressed="false">Night</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Text size</legend>
      <div class="bb-seg" role="group">
        <button type="button" data-size="-10" aria-label="Smaller text">A−</button>
        <output id="bbSizeOut">100%</output>
        <button type="button" data-size="10" aria-label="Larger text">A+</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Typeface</legend>
      <div class="bb-seg bb-face-options" role="group" aria-label="Typeface">
        <button type="button" data-face="serif" aria-pressed="false">Serif</button>
        <button type="button" data-face="sans" aria-pressed="false">Sans</button>
        <button type="button" data-face="chicago" aria-pressed="false">Chicago</button>
        <button type="button" data-face="literata" aria-pressed="false">Literata</button>
        <button type="button" data-face="atkinson" aria-pressed="false" aria-label="Atkinson Hyperlegible">Atkinson</button>
        <button type="button" data-face="lexend" aria-pressed="false">Lexend</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Verses</legend>
      <div class="bb-seg" role="group">
        <button type="button" data-layout="auto" aria-pressed="false" title="Poetry one verse per line, everything else as paragraphs">Auto</button>
        <button type="button" data-layout="flow" aria-pressed="false">Paragraph</button>
        <button type="button" data-layout="lines" aria-pressed="false">Verse by verse</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Highlight</legend>
      <div class="bb-seg bb-seg-colors" role="radiogroup" aria-label="Highlight color">
        <button type="button" data-hl="gold" aria-pressed="false" title="Gold highlight">Gold</button>
        <button type="button" data-hl="sage" aria-pressed="false" title="Sage highlight">Sage</button>
        <button type="button" data-hl="blue" aria-pressed="false" title="Blue highlight">Blue</button>
        <button type="button" data-hl="rose" aria-pressed="false" title="Rose highlight">Rose</button>
        <button type="button" data-hl="purple" aria-pressed="false" title="Purple highlight">Purple</button>
      </div>
    </fieldset>
  </div>

  <main class="bb-main" id="bbMain" tabindex="-1">
    <p class="bb-loading">Opening the Bible…</p>
  </main>

  <div class="bb-selbar" id="bbSelbar" role="region" aria-label="Selected passage" hidden>
    <div class="bb-sel-header">
      <div class="bb-sel-info">
        <span class="bb-sel-ref" id="bbSelRef"></span>
        <span class="bb-sel-count" id="bbSelCount"></span>
      </div>
      <button type="button" class="bb-sel-btn bb-sel-clear" id="bbSelClear" aria-label="Clear verse selection" title="Clear selection (Esc)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
      </button>
    </div>
    <div class="bb-sel-actions">
      <div class="bb-sel-colors" id="bbSelColors" role="radiogroup" aria-label="Highlight color">
        <button type="button" class="bb-color-dot" data-color="gold" aria-label="Gold highlight" aria-checked="true" role="radio" title="Gold highlight"></button>
        <button type="button" class="bb-color-dot" data-color="sage" aria-label="Sage highlight" aria-checked="false" role="radio" title="Sage highlight"></button>
        <button type="button" class="bb-color-dot" data-color="blue" aria-label="Blue highlight" aria-checked="false" role="radio" title="Blue highlight"></button>
        <button type="button" class="bb-color-dot" data-color="rose" aria-label="Rose highlight" aria-checked="false" role="radio" title="Rose highlight"></button>
        <button type="button" class="bb-color-dot" data-color="purple" aria-label="Purple highlight" aria-checked="false" role="radio" title="Purple highlight"></button>
      </div>
      <div class="bb-sel-tools">
        <button type="button" class="bb-sel-btn" id="bbSelCopy" title="Copy passage text with reference">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>
          <span class="bb-sel-btn-label">Copy</span>
        </button>
        <button type="button" class="bb-sel-btn" id="bbSelLink" title="Copy shareable link to this passage">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></svg>
          <span class="bb-sel-btn-label">Link</span>
        </button>
        <button type="button" class="bb-sel-btn" id="bbSelListen" title="Listen to selected verses">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3" /></svg>
          <span class="bb-sel-btn-label">Listen</span>
        </button>
        <button type="button" class="bb-sel-btn" id="bbSelShare" title="Share selected passage" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><line x1="8.59" y1="13.51" x2="15.42" y2="17.49" /><line x1="15.41" y1="6.51" x2="8.59" y2="10.49" /></svg>
          <span class="bb-sel-btn-label">Share</span>
        </button>
      </div>
    </div>
  </div>

  <p class="bb-sr" id="bbStatus" role="status" aria-live="polite"></p>

  <script type="module" src="assets/js/bible-reader.mjs"></script>
  <script src="assets/js/theme-registry.js"></script>
  <script src="assets/js/nav-mobile.js"></script>
</body>
</html>
