<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Library · Mr. Scandrett's ClassroomOS</title>
  <meta name="description" content="Videos uploaded by Mr. Scandrett for the classroom." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/classroom-home.css" />
  <style>
    /* ── YouTube-style grid ── */
    .vl-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem 0.85rem;
    }
    @media (max-width: 1200px) { .vl-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 900px)  { .vl-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 580px)  { .vl-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 380px)  { .vl-grid { grid-template-columns: 1fr; } }

    .vl-card {
      appearance: none;
      cursor: pointer;
      padding: 0;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
    }
    .vl-card:hover .vl-play-icon { opacity: 1; }
    .vl-card:hover .vl-thumb { opacity: 0.78; }
    .vl-card:focus-visible {
      outline: 3px solid rgba(0, 113, 227, 0.26);
      outline-offset: 3px;
    }

    .vl-card--feature {
      grid-column: span 2;
    }
    @media (max-width: 900px) {
      .vl-card--feature {
        grid-column: 1 / -1;
      }
    }

    .vl-thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #111;
      border-bottom: 1px solid rgba(210, 210, 215, 0.52);
    }
    .vl-card--feature .vl-thumb-wrap {
      aspect-ratio: 16 / 10;
    }
    @media (min-width: 1024px) {
      .vl-card--feature .vl-thumb-wrap {
        aspect-ratio: auto;
        min-height: 100%;
      }
    }
    .vl-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.15s;
    }
    .vl-play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
      background: rgba(0, 0, 0, 0.25);
    }
    .vl-play-icon svg {
      width: 30px;
      height: 30px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.8));
    }
    .vl-duration {
      position: absolute;
      bottom: 4px;
      right: 5px;
      background: rgba(0, 0, 0, 0.88);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      letter-spacing: 0.02em;
      font-family: 'Inter', sans-serif;
    }

    /* YouTube-style row: avatar + text */
    .vl-meta {
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
    }
    .vl-avatar {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a90d9 0%, #6c5ce7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0;
      font-family: 'Inter', sans-serif;
      margin-top: 1px;
    }
    .vl-text {
      flex: 1;
      min-width: 0;
    }
    .vl-title {
      margin: 0 0 0.15rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .vl-sub {
      font-size: 0.72rem;
      margin: 0;
      line-height: 1.4;
    }
    .vl-desc {
      margin-top: 0.15rem;
    }
    .vl-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(0, 113, 227, 0.1);
      color: #005ec3;
      border: 1px solid rgba(0, 113, 227, 0.14);
    }
    .vl-chip--muted {
      background: rgba(25, 49, 77, 0.06);
      color: var(--muted);
      border-color: rgba(25, 49, 77, 0.08);
    }

    /* ── Modal ── */
    .vl-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.86);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .vl-modal-backdrop.open { display: flex; }

    .vl-modal {
      width: 100%;
      max-width: 880px;
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.75);
      position: relative;
    }
    .vl-modal video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .vl-modal-info {
      padding: 0.8rem 1rem 1rem;
    }
    .vl-modal-category {
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #777;
      margin: 0 0 0.15rem;
    }
    .vl-modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      margin: 0 0 0.3rem;
    }
    .vl-modal-desc {
      font-size: 0.8rem;
      color: #999;
      margin: 0;
      line-height: 1.5;
    }
    .vl-modal-close {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
  <link rel="stylesheet" href="assets/css/liquid-woodland.css" />
  <script src="assets/js/theme-lighting.js"></script>

  <main id="main-content">
    <section class="hero">
      <p class="eyebrow">Mr. Scandrett</p>

  <!-- Modal -->
  <div class="vl-modal-backdrop" id="vl-modal-backdrop" role="dialog" aria-modal="true" aria-label="Video player">
    <div class="vl-modal" tabindex="-1">
      <button class="vl-modal-close" id="vl-modal-close" aria-label="Close video">✕</button>

      <div class="vl-modal-info">

  <footer class="site-footer">
    <p>Mr. Scandrett's ClassroomOS &mdash; <a href="https://github.com/MrScandrett" target="_blank" rel="noreferrer">GitHub</a></p>
  </footer>

  <script src="assets/js/reveal.js"></script>
  <script src="assets/js/nav-mobile.js"></script>
  <script>
    const VIDEOS = [
      {
        src: 'assets/videos/stevejobs_onfailure.mp4',
        title: 'Steve Jobs on Failure',
        category: 'Interview',
        desc: 'A rare interview clip where Steve Jobs reflects on failure, resilience, and what it really means to build something that matters.',
        seekTo: 30
      },
      {
        src: 'assets/videos/stevejobs_life.mp4',
        title: 'Steve Jobs on Life',
        category: 'Interview',
        desc: 'Steve Jobs shares his perspective on life, purpose, and the importance of following what you love — even when the path isn\'t clear.',
        seekTo: 30
      },
      {
        src: 'assets/videos/carlsagan_palebluedot.mp4',
        title: 'Carl Sagan — Pale Blue Dot',
        category: 'Science & Perspective',
        desc: 'Carl Sagan reflects on a photograph of Earth taken from 3.7 billion miles away, and what it means for how we treat each other and our world.',
        seekTo: 30
      },
      {
        src: 'assets/videos/Carl Sagan Kids Questions.mp4',
        title: 'Carl Sagan "Encourage Kids to Ask Questions" (The Tonight Show 1977)',
        category: 'Science & Education',
        desc: 'In this 1977 Tonight Show appearance, Carl Sagan makes a passionate case for nurturing curiosity in children — why asking questions is the foundation of all science, and how adults can keep that spark alive.',
        seekTo: 15
      },
      {
        src: 'assets/videos/deadpoetsociety.mp4',
        title: 'Dead Poets Society',
        category: 'Film & Inspiration',
        desc: 'A memorable clip from Dead Poets Society focused on voice, courage, and the challenge of thinking for yourself.',
        seekTo: 15
      },
      {
        src: 'assets/videos/makeyourlifespectacular.mp4',
        title: 'Make Your Life Spectacular',
        category: 'Motivation',
        desc: 'An inspirational video about living with purpose, bringing energy to your work, and making your life mean something.',
        seekTo: 15
      }
    ];

    function fmtDuration(s) {
      if (!s || !isFinite(s)) return '';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    function captureThumbnail(src, seekTo, imgEl) {
      const vid = document.createElement('video');
      vid.muted = true;
      vid.preload = 'metadata';
      vid.src = src;
      vid.addEventListener('loadedmetadata', () => {
        vid.currentTime = Math.min(seekTo, vid.duration - 1);
      });
      vid.addEventListener('seeked', () => {
        const canvas = document.createElement('canvas');
        canvas.width = vid.videoWidth || 640;
        canvas.height = vid.videoHeight || 360;
        canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
        imgEl.src = canvas.toDataURL('image/jpeg', 0.85);
        vid.src = '';
      }, { once: true });
    }

    function makeSkeletonLine(width) {
      const line = document.createElement('span');
      line.className = 'skeleton skeleton-text';
      line.dataset.width = width;
      return line;
    }

    function createVideoSkeletonCard(isFeature = false) {
      const card = document.createElement('article');
      card.className = 'vl-card skeleton-card';
      card.setAttribute('aria-hidden', 'true');
      if (isFeature) card.classList.add('vl-card--feature', 'skeleton-card--featured', 'skeleton-card--video-feature');

      const media = document.createElement('div');
      media.className = 'skeleton skeleton-media';
      media.dataset.ratio = isFeature ? 'feature' : 'video';

      const body = document.createElement('div');
      body.className = 'skeleton-body';

      const meta = document.createElement('div');
      meta.className = 'skeleton-meta';

      const avatar = document.createElement('span');
      avatar.className = 'skeleton skeleton-avatar';

      const metaCopy = document.createElement('div');
      metaCopy.className = 'skeleton-meta-copy';
      metaCopy.append(
        makeSkeletonLine('short'),
        makeSkeletonLine('long'),
        makeSkeletonLine('medium')
      );

      meta.append(avatar, metaCopy);
      body.appendChild(meta);

      if (isFeature) {
        body.append(
          makeSkeletonLine('long'),
          makeSkeletonLine('medium')
        );
      }

      const actions = document.createElement('div');
      actions.className = 'skeleton-actions';
      ['5.6rem', '6.4rem'].forEach((width) => {
        const chip = document.createElement('span');
        chip.className = 'skeleton skeleton-chip';
        chip.style.width = width;
        actions.appendChild(chip);
      });

      body.appendChild(actions);
      card.append(media, body);
      return card;
    }

    function renderVideoSkeletons() {
      if (!grid) return;
      grid.innerHTML = '';
      grid.append(
        createVideoSkeletonCard(true),
        createVideoSkeletonCard(),
        createVideoSkeletonCard(),
        createVideoSkeletonCard(),
        createVideoSkeletonCard(),
        createVideoSkeletonCard()
      );
    }

    const grid = document.getElementById('vl-grid');
    const backdrop = document.getElementById('vl-modal-backdrop');
    const modal = backdrop.querySelector('.vl-modal');
    const closeButton = document.getElementById('vl-modal-close');
    const modalVideo = document.getElementById('vl-modal-video');
    const modalCategory = document.getElementById('vl-modal-category');
    const modalTitle = document.getElementById('vl-modal-title');
    const modalDesc = document.getElementById('vl-modal-desc');
    const focusableSelector = 'button, [href], input, select, textarea, video[controls], [tabindex]:not([tabindex="-1"])';
    let lastFocused = null;

    renderVideoSkeletons();

    function focusableElements(root) {
      return Array.from(root.querySelectorAll(focusableSelector)).filter((element) => {
        if (element.disabled) return false;
        if (element.getAttribute('aria-hidden') === 'true') return false;
        return element.offsetParent !== null || element === document.activeElement;
      });
    }

    function moveFocusIntoModal() {
      const focusables = focusableElements(backdrop);
      if (focusables.length > 0) {
        focusables[0].focus();
        return;
      }
      modal.focus();
    }

    function trapModalFocus(event) {
      if (event.key !== 'Tab' || !backdrop.classList.contains('open')) return;

      const focusables = focusableElements(backdrop);
      if (focusables.length === 0) {
        event.preventDefault();
        modal.focus();
        return;
      }

      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      const active = document.activeElement;

      if (event.shiftKey) {
        if (active === first || !backdrop.contains(active)) {
          event.preventDefault();
          last.focus();
        }
        return;
      }

      if (active === last) {
        event.preventDefault();
        first.focus();
      }
    }

    grid.innerHTML = '';

    VIDEOS.forEach((v, index) => {
      const card = document.createElement('button');
      card.className = 'vl-card card-shell card-shell--border reveal';
      card.type = 'button';
      card.setAttribute('aria-label', `Play: ${v.title}`);
      if (index === 0) card.classList.add('vl-card--feature', 'card-shell--featured');

      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'vl-thumb-wrap card-media';

      const img = document.createElement('img');
      img.className = 'vl-thumb';
      img.alt = `Thumbnail for ${v.title}`;

      const playIcon = document.createElement('div');
      playIcon.className = 'vl-play-icon';
      playIcon.innerHTML = `<svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="28" cy="28" r="28" fill="white" fill-opacity="0.9"/>
        <polygon points="22,16 44,28 22,40" fill="#111"/>
      </svg>`;

      const durEl = document.createElement('span');
      durEl.className = 'vl-duration';
      const tmpVid = document.createElement('video');
      tmpVid.preload = 'metadata';
      tmpVid.src = v.src;
      tmpVid.addEventListener('loadedmetadata', () => {
        durEl.textContent = fmtDuration(tmpVid.duration);
        tmpVid.src = '';
      });

      thumbWrap.append(img, playIcon, durEl);

      const body = document.createElement('div');
      body.className = 'card-body';
      body.innerHTML = `
        <div class="vl-meta">
          <div class="vl-avatar" aria-hidden="true">MS</div>
          <div class="vl-text">
            <p class="card-kicker">${v.category}</p>
            <p class="vl-title card-title">${v.title}</p>
            <p class="vl-sub card-sub">Mr. Scandrett &middot; Class video library</p>
          </div>
        </div>
        ${index === 0 ? `<p class="vl-desc card-sub">${v.desc}</p>` : ''}
        <div class="card-actions">
          <span class="vl-chip">Play video</span>
          <span class="vl-chip vl-chip--muted">${v.category}</span>
        </div>
      `;

      card.append(thumbWrap, body);
      grid.appendChild(card);
      captureThumbnail(v.src, v.seekTo, img);

      card.addEventListener('click', () => {
        lastFocused = card;
        modalVideo.src = v.src;
        modalCategory.textContent = v.category;
        modalTitle.textContent = v.title;
        modalDesc.textContent = v.desc;
        backdrop.classList.add('open');
        window.setTimeout(moveFocusIntoModal, 0);
        const playPromise = modalVideo.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {});
        }
      });
    });

    grid.setAttribute('aria-busy', 'false');

    function closeModal() {
      backdrop.classList.remove('open');
      modalVideo.pause();
      modalVideo.src = '';
      if (lastFocused && document.contains(lastFocused)) {
        lastFocused.focus();
      }
    }

    closeButton.addEventListener('click', closeModal);
    backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
    document.addEventListener('keydown', e => {
      if (!backdrop.classList.contains('open')) return;
      if (e.key === 'Escape') {
        e.preventDefault();
        closeModal();
        return;
      }
      trapModalFocus(e);
    });
  </script>
</body>
</html>
