<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Hop — Phaser 3 Platformer Starter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">PHASER 3 GAME STARTER</p>
      <h1>Star Hop</h1>
      <p>Collect every star. Avoid the red spikes.</p>
    </header>

    <!-- WHY: Phaser creates its own canvas inside this div (see `parent` in game.js). -->
    <div id="game" aria-label="Star Hop game. Move with arrow keys or A and D, jump with Up, W, or Space."></div>

    <p class="controls"><strong>Move:</strong> ← → or A D · <strong>Jump:</strong> ↑ W or Space · <strong>Restart:</strong> R</p>
  </main>

  <!-- WHAT: The Phaser engine, saved inside this pack (lib/) so the game works offline.
       Version 3.90.0 — see lib/PHASER-LICENSE.md. It is large (about 1 MB) because it
       contains the whole engine: physics, input, sound, cameras, and more. -->
  <script src="lib/phaser.min.js"></script>
  <!-- WHAT: Your game. It must load AFTER Phaser, because it uses the Phaser object. -->
  <script src="game.js"></script>
</body>
</html>
