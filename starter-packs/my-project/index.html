<!doctype html>
<html lang="en">
<head>
  <!-- WHAT: The head holds information ABOUT the page. Nothing here is drawn. -->
  <meta charset="utf-8">
  <!-- WHY: Without this line, phones shrink the page to a tiny desktop view. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- TRY THIS: Change the title, save, and look at the browser tab. -->
  <title>My Project</title>
  <!-- WHAT: This link connects style.css. The path is relative to THIS file. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- WHAT: header, main, and footer are landmarks. Screen readers use them to jump around the page. -->
  <header class="site-header">
    <p class="site-name">My Project</p>
  </header>

  <main>
    <section class="intro">
      <h1>Hello! I'm building something.</h1>
      <p>Replace this sentence with one line about what your project is and who it is for.</p>

      <!-- CHECKPOINT: Click this button. If the message below changes, script.js is connected. -->
      <button id="check-button" type="button">Test my JavaScript</button>
      <p id="check-message" class="check-message" aria-live="polite">JavaScript has not run yet.</p>
    </section>

    <section>
      <h2>What I am working on</h2>
      <!-- TRY THIS: Add a third list item, save, and refresh. -->
      <ul>
        <li>First idea</li>
        <li>Second idea</li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>Made by <strong>Your Name</strong> · Starter from Mr. Scandrett's ClassroomOS</p>
  </footer>

  <!-- WHAT: This loads script.js.
       WHY defer: the browser finishes reading the HTML first, so the script can find #check-button. -->
  <script src="script.js" defer></script>
</body>
</html>
