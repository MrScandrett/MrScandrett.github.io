<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Courier — 2D Game Starter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">2D GAME DEVELOPER PATHWAY · STARTER PACK</p>
      <h1>Pixel Courier</h1>
      <p>Collect every parcel, then reach the mailbox.</p>
    </header>

    <!-- WHY a fixed 320 × 180 canvas: game.js draws at this small "internal resolution"
         and style.css scales the whole picture up with sharp pixels (lesson 04). -->
    <canvas id="game" tabindex="0" aria-label="Pixel Courier game. Move with arrow keys or A and D, jump with Space, Up or W, pause with P."></canvas>

    <p class="controls"><strong>Move:</strong> ← → or A D · <strong>Jump:</strong> Space ↑ W · <strong>Drop through a plank:</strong> hold ↓ + jump · <strong>Pause:</strong> P</p>
  </main>

  <!-- WHAT: your art (palette, frames, tiles, level). Replace art.js with the one you
       download from the pathway. It must load BEFORE game.js, which reads it. -->
  <script src="art.js"></script>
  <script src="game.js"></script>
</body>
</html>
