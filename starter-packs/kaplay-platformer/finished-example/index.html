<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin Climb — Finished Reference</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">FINISHED REFERENCE BUILD</p>
      <h1>Coin Climb</h1>
      <p>Adds a double jump, a patrolling enemy, lives, and a clear time. Compare with <code>finished-example/game.js</code> after trying the challenges.</p>
    </header>

    <!-- WHY: KAPLAY draws into this canvas. Giving it an id lets game.js pick
         exactly this one, so the page layout stays under our control. -->
    <canvas id="game" tabindex="0" aria-label="Coin Climb game. Move with arrow keys or A and D, jump with Up, W, or Space."></canvas>

    <p class="controls"><strong>Move:</strong> ← → or A D · <strong>Jump / double jump:</strong> ↑ W or Space · <strong>Restart:</strong> R</p>
  </main>

  <!-- WHAT: The KAPLAY engine, saved inside this pack (lib/) so the game works offline.
       WHY a local copy: a CDN link can change version or be blocked on a school network.
       Version 3001.0.19 — see ../lib/KAPLAY-LICENSE.md. -->
  <script src="../lib/kaplay.js"></script>
  <!-- WHAT: Your game. It must load AFTER the engine, because it uses the engine's functions. -->
  <script src="game.js"></script>
</body>
</html>
