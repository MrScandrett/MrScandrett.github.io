<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Garden — Creative Coding Starter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <canvas id="art" aria-label="Animated generative artwork"></canvas>

    <section class="controls" aria-label="Artwork controls">
      <div>
        <p class="eyebrow">CREATIVE CODING + DEMOSCENE LAB</p>
        <h1>Signal Garden</h1>
        <p id="description">Particles follow a smooth-noise vector field.</p>
      </div>

      <label>Scene
        <select id="scene">
          <option value="flow">Flow Field</option>
          <option value="waves">Wave Choir</option>
          <option value="stars">Star Tunnel</option>
        </select>
      </label>
      <label>Energy <input id="energy" type="range" min="0.2" max="2" step="0.05" value="1"></label>
      <label>Complexity <input id="complexity" type="range" min="1" max="10" step="1" value="5"></label>
      <label>Palette
        <select id="palette">
          <option value="aurora">Aurora</option>
          <option value="sunset">Sunset</option>
          <option value="mono">Monochrome</option>
        </select>
      </label>
      <div class="buttons">
        <button id="pause" type="button">Pause</button>
        <button id="seed" type="button">New Seed</button>
        <button id="export" type="button">Export PNG</button>
      </div>
      <p class="keys">Space pause · N new seed · 1/2/3 scenes</p>
    </section>
  </main>
  <script src="sketch.js"></script>
</body>
</html>
