<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Sweep — Finished Reference</title>
  <!-- WHY: The reference reuses the starter's stylesheet so only the game logic differs. -->
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <p class="eyebrow">FINISHED REFERENCE BUILD</p>
      <h1>Signal Sweep</h1>
      <p>Adds dash, lives, and a best time. Attempt the checkpoints before reading <code>finished-example/game.js</code>.</p>
    </header>

    <section class="hud" aria-label="Game status">
      <span>Signals <strong id="score">0 / 5</strong></span>
      <span>Lives <strong id="lives">♥♥♥</strong></span>
      <span>Best <strong id="best">—</strong></span>
      <span>Status <strong id="status">Ready</strong></span>
      <button id="restart" type="button">Restart</button>
    </section>

    <canvas id="game" width="800" height="450" tabindex="0"
      aria-label="Signal Sweep finished reference. Move with WASD or arrow keys, dash with Shift."></canvas>

    <p class="instructions"><strong>Move:</strong> WASD / arrows · <strong>Dash:</strong> Shift · <strong>Restart:</strong> R</p>
  </main>

  <script src="game.js" defer></script>
</body>
</html>
