<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Sweep — Browser Game Starter</title>
  <!-- WHAT: CSS is kept separate so presentation can change without touching game logic. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <p class="eyebrow">BROWSER GAME BUILDER</p>
      <h1>Signal Sweep</h1>
      <p>Collect every signal. Avoid the roaming glitch.</p>
    </header>

    <section class="hud" aria-label="Game status">
      <span>Signals <strong id="score">0 / 5</strong></span>
      <span>Status <strong id="status">Ready</strong></span>
      <button id="restart" type="button">Restart</button>
    </section>

    <!-- WHY: The width and height attributes define the drawing coordinate system.
         CSS may resize the canvas visually, while JavaScript keeps input aligned. -->
    <canvas id="game" width="800" height="450" tabindex="0"
      aria-label="Signal Sweep game. Move with WASD or arrow keys."></canvas>

    <p class="instructions"><strong>Move:</strong> WASD / arrows · <strong>Restart:</strong> R</p>
    <details>
      <summary>Learning mission</summary>
      <p>Change one rule at a time in <code>game.js</code>. Predict the result before refreshing.</p>
    </details>
  </main>

  <!-- WHAT: defer waits until the HTML above has been parsed. -->
  <script src="game.js" defer></script>
</body>
</html>
